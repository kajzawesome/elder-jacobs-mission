a vez que pude ir yo era el capacitado. (Les mando la foto en cuanto la tenga, o está en la página de Facebook de nuestra misión) El domingo fue la conferencia de estaca y estuvo divertida. Vinieron Washington y Juan Carlos y la pasaron bien. También están bastante emocionados por sus bautismos que vienen, el 22 & 23 respectivamente. Dios los ama, pórtense bien, cuéntenme cómo les va de vez en cuando para saber que no están muertos Los amo Elder Jacobs Fotos: el distrito (versión de la semana pasada) Los élderes de JAS y yo en el aeropuerto 🦩 ¡El primer día del Élder Carson! Noche de empanadas + tacos Más de esta semana"}, {"id": "l44", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">ABR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 44 · Largo", "title": "¡Chao! Me voy a otra área...", "date": "2022-04-18T15:19:00", "group": "2022-04", "html": "<div class=\"body\"><p>Sí.... otro cambio de emergencia.<\/p>\n<p>Que tal compadres!<\/p>\n<p>Esta semana salió súper bien. Tuvimos muchas lecciones con miembros ayudando, nuestros amigos Washington y Juan Carlos se bautizan esta semana que viene, ¡y la rama está floreciendo!<\/p>\n<p>Nuestra reunión sacramental de Pascua estuvo súper increíble. Tuvimos varios números musicales, muchos himnos y un recorrido por el ministerio y la Expiación de Cristo. Después comimos un montón de comida y dulces.<\/p>\n<p>1.ª vez haciendo servicio esta semana (en una rama de habla hispana)<\/p>\n<p>La conferencia de zona del jueves estuvo increíble. Pasamos muchísimo tiempo trabajando en nuestras habilidades de enseñanza y de verdad estoy notando una diferencia en el Espíritu con nosotros y en nuestras lecciones.<\/p>\n<p>Y sí, después de por fin 6 semanas completas (1 cambio, más o menos), me muevo otra vez. Ojalá me pudiera quedar, y fue medio repentino, pero es otro cambio de emergencia más. Me voy a Brandon Spanish. Por suerte sí puedo regresar el viernes y el domingo para los bautismos, además de ayudar a terminar de enseñarles antes del bautismo, pero estoy muy triste. De verdad aprendí a trabajar lo más duro que puedo y a amar a la gente a pesar de los retos, así que estoy muy triste de irme, probablemente lo más triste hasta ahora. Estoy listo para el futuro, bueno, excepto para empacar. Sigo odiando empacar<\/p>\n<p class=\"sign\">Los amo panas!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>estatua de búho<\/li>\n<li>McDonald's<\/li>\n<li>Steven (nuestro dino de hule que tenemos en el carro) pero en anime<\/li>\n<li>el hermano Owen y sus escrituras<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-04-18_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-18_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-18_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-18_0_3.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_237.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_238.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "¡Chao! Me voy a otra área... Sí.... otro cambio de emergencia. Que tal compadres! Esta semana salió súper bien. Tuvimos muchas lecciones con miembros ayudando, nuestros amigos Washington y Juan Carlos se bautizan esta semana que viene, ¡y la rama está floreciendo! Nuestra reunión sacramental de Pascua estuvo súper increíble. Tuvimos varios números musicales, muchos himnos y un recorrido por el ministerio y la Expiación de Cristo. Después comimos un montón de comida y dulces. 1.ª vez haciendo servicio esta semana (en una rama de habla hispana) La conferencia de zona del jueves estuvo increíble. Pasamos muchísimo tiempo trabajando en nuestras habilidades de enseñanza y de verdad estoy notando una diferencia en el Espíritu con nosotros y en nuestras lecciones. Y sí, después de por fin 6 semanas completas (1 cambio, más o menos), me muevo otra vez. Ojalá me pudiera quedar, y fue medio repentino, pero es otro cambio de emergencia más. Me voy a Brandon Spanish. Por suerte sí puedo regresar el viernes y el domingo para los bautismos, además de ayudar a terminar de enseñarles antes del bautismo, pero estoy muy triste. De verdad aprendí a trabajar lo más duro que puedo y a amar a la gente a pesar de los retos, así que estoy muy triste de irme, probablemente lo más triste hasta ahora. Estoy listo para el futuro, bueno, excepto para empacar. Sigo odiando empacar Los amo panas! Elder Jacobs Fotos: estatua de búho McDonald's Steven (nuestro dino de hule que tenemos en el carro) pero en anime el hermano Owen y sus escrituras Más de esta semana"}, {"id": "l45", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">ABR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["PR"], "moments": ["Baptism"], "extra": "Puerto Rico", "kind": "Carta 45 · Brandon", "title": "🐡 Bautismo 🛹 nuevo comp 🐐 y más 🔥", "date": "2022-04-25T07:15:00", "group": "2022-04", "html": "<div class=\"body\"><p>Como tan utede?<\/p>\n<p>Super bien acá<\/p>\n<p>Ahora estoy en Brandon porque me cambiaron otra vez (otro cambio de emergencia). Soy Elder Jacobs, el sin hogar. No se preocupen, en general estoy bien, solo que es medio frustrante mudarme/cambiar de compañero tan seguido, pero me encanta ser misionero y no cambiaría eso, así que acepto las partes malas, porque si no, no podría tener las buenas. 2 Nefi 2:26-27<\/p>\n<p>Me encantaría contarles más de nuestros amigos, pero todavía estoy conociendo quiénes son, así que probablemente más adelante. El trabajo aquí está bastante padre pero es difícil, porque de hecho cubrimos 3 áreas, o sea toda la estaca. Antes había otros misioneros para ayudar con las otras partes, pero (no quiero sonar como disco rayado) nos faltan misioneros de habla hispana; pronto van a llegar algunos en 2 semanas.<\/p>\n<p>¡Pude ir al bautismo de Washington y a su fiesta de cumpleaños 🎉 🥳 feliz cumpleaños! ¡72! Fue toda una fiesta. Vean las fotos abajo. Llegaron los bomberos porque había demasiado humo del al pastor de Jorge; super rico<\/p>\n<p>El de Juan Carlos será la próxima semana. Lo tuvimos que mover, pero está emocionado. Ese será otro viaje a Largo. Mi nuevo compañero es el Élder Huntsman, de South Jordan. Súper increíble, tengo mucho que aprender de él y nos llevamos súper bien. También vivimos con otros 3 élderes, así que siempre hay fiesta en el departamento. El Élder Jenkins, Clayton y Shields. El Élder Shields vino con nosotros un día porque sus compañeros (líderes de zona) se fueron de intercambio con los AP. Sí, no sé qué más, tal vez me acuerde la próxima semana o las fotos llenen algunos huecos<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>tortuguita<\/li>\n<li>día de cambios<\/li>\n<li>el Élder Shields con nosotros<\/li>\n<li>mofongo<\/li>\n<li>plátanos &amp; pincho (básicamente una brocheta)<\/li>\n<li>bautismo<\/li>\n<li>payasadas después del bautismo<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-04-25_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-04-25_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-04-25_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-04-25_0_7.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_239.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_240.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_241.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_242.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_243.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_244.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_245.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_246.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_247.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_248.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_249.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_250.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_251.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_252.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_253.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_254.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐡 Bautismo 🛹 nuevo comp 🐐 y más 🔥 Como tan utede? Super bien acá Ahora estoy en Brandon porque me cambiaron otra vez (otro cambio de emergencia). Soy Elder Jacobs, el sin hogar. No se preocupen, en general estoy bien, solo que es medio frustrante mudarme/cambiar de compañero tan seguido, pero me encanta ser misionero y no cambiaría eso, así que acepto las partes malas, porque si no, no podría tener las buenas. 2 Nefi 2:26-27 Me encantaría contarles más de nuestros amigos, pero todavía estoy conociendo quiénes son, así que probablemente más adelante. El trabajo aquí está bastante padre pero es difícil, porque de hecho cubrimos 3 áreas, o sea toda la estaca. Antes había otros misioneros para ayudar con las otras partes, pero (no quiero sonar como disco rayado) nos faltan misioneros de habla hispana; pronto van a llegar algunos en 2 semanas. ¡Pude ir al bautismo de Washington y a su fiesta de cumpleaños 🎉 🥳 feliz cumpleaños! ¡72! Fue toda una fiesta. Vean las fotos abajo. Llegaron los bomberos porque había demasiado humo del al pastor de Jorge; super rico El de Juan Carlos será la próxima semana. Lo tuvimos que mover, pero está emocionado. Ese será otro viaje a Largo. Mi nuevo compañero es el Élder Huntsman, de South Jordan. Súper increíble, tengo mucho que aprender de él y nos llevamos súper bien. También vivimos con otros 3 élderes, así que siempre hay fiesta en el departamento. El Élder Jenkins, Clayton y Shields. El Élder Shields vino con nosotros un día porque sus compañeros (líderes de zona) se fueron de intercambio con los AP. Sí, no sé qué más, tal vez me acuerde la próxima semana o las fotos llenen algunos huecos Los amo Elder Jacobs Fotos: tortuguita día de cambios el Élder Shields con nosotros mofongo plátanos & pincho (básicamente una brocheta) bautismo payasadas después del bautismo Más de esta semana"}, {"id": "l46", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAY 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 46 · Brandon", "title": "🌊 Bautismo doble 🔥", "date": "2022-05-02T12:09:00", "group": "2022-05", "html": "<div class=\"body\"><p>Bom Día!<\/p>\n<p>¡Semana bastante cansada, pero todo bien!<\/p>\n<p>Empezamos la semana con consejo de distrito y entrevistas. ¡Nuestro distrito está bastante chido! Somos nosotros 5 élderes, 4 hermanas y un matrimonio de misioneros mayores. ¡Eso sí es un equipazo! Además, las entrevistas siempre son buenas. Por la falta de misioneros de habla hispana y por cuántos se van a ir, es probable que pronto vuelva a capacitar y que cubra zonas completas por un tiempo, lo cual no es súper increíble, pero se puede.<\/p>\n<p>Pasamos un buen rato asegurándonos de que todo estuviera bien para los bautismos y también visitando a algunos miembros. Pero claro, enseñando un montón esta semana, casi todo en la city (Plant City).<\/p>\n<p>\"Fui\" de intercambio con el Élder Shields a Lithia &amp; Valrico (vivimos con él y sus compañeros). Estuvo bastante bien, definitivamente es un área más difícil porque la gente está \"cómoda\" y siente que ya encontró a Cristo o que no necesita creer en Dios. Definitivamente la pasé bien, pero estoy constantemente agradecido de enseñar en español a gente tan humilde y tan llena de amor.<\/p>\n<p>El Élder Huntsman (compañero/líder de distrito) me invitó a leer este discurso y me gustó, y quiero compartírselo para ver qué opinan. La historia del principio también está muy buena:<\/p>\n<p>\"Dar seguimiento\"<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2014/04/following-up?lang=eng<\/p>\n<p class=\"sign\">Los amo y esperamos que tengan buena semana,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos<\/p>\n<ul class=\"bul\">\n<li>Beatriz<\/li>\n<li>Juan Carlos + su esposa (&amp; hermana Bleakly &amp; Hermano Rivera)<\/li>\n<li>pickleball<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-05-02_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-02_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-02_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-05-02_0_3.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_255.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_256.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_257.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_258.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_259.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_260.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_261.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_262.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_263.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_264.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🌊 Bautismo doble 🔥 Bom Día! ¡Semana bastante cansada, pero todo bien! Empezamos la semana con consejo de distrito y entrevistas. ¡Nuestro distrito está bastante chido! Somos nosotros 5 élderes, 4 hermanas y un matrimonio de misioneros mayores. ¡Eso sí es un equipazo! Además, las entrevistas siempre son buenas. Por la falta de misioneros de habla hispana y por cuántos se van a ir, es probable que pronto vuelva a capacitar y que cubra zonas completas por un tiempo, lo cual no es súper increíble, pero se puede. Pasamos un buen rato asegurándonos de que todo estuviera bien para los bautismos y también visitando a algunos miembros. Pero claro, enseñando un montón esta semana, casi todo en la city (Plant City). \"Fui\" de intercambio con el Élder Shields a Lithia & Valrico (vivimos con él y sus compañeros). Estuvo bastante bien, definitivamente es un área más difícil porque la gente está \"cómoda\" y siente que ya encontró a Cristo o que no necesita creer en Dios. Definitivamente la pasé bien, pero estoy constantemente agradecido de enseñar en español a gente tan humilde y tan llena de amor. El Élder Huntsman (compañero/líder de distrito) me invitó a leer este discurso y me gustó, y quiero compartírselo para ver qué opinan. La historia del principio también está muy buena: \"Dar seguimiento\" https://www.churchofjesuschrist.org/study/general-conference/2014/04/following-up?lang=eng Los amo y esperamos que tengan buena semana, Elder Jacobs Fotos Beatriz Juan Carlos + su esposa (& hermana Bleakly & Hermano Rivera) pickleball Más de esta semana"}, {"id": "l47", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAY 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 47 · Brandon", "title": "Feliz Día de las madres", "date": "2022-05-09T06:04:00", "group": "2022-05", "html": "<div class=\"body\"><p>Buenos Días! Feliz Día de las madres! (Un poco tarde ahora)<\/p>\n<p>Tuvimos una semana bastante buena aquí en Brandon y Plant City.<\/p>\n<p>En general hicimos muchas pasadas a visitar y enseñamos lecciones, de todo. Tenemos unos amigos bastante buena onda que están cerca de tener fecha de bautismo.<\/p>\n<p>Por favor oren por Zulene &amp; su familia, Los Reyes. A su bebé de 5 meses le van a hacer varias cirugías.<\/p>\n<p>Para ser completamente honesto, no me acuerdo de mucho de esta semana. Todo pareció bastante normal, lo de siempre. En honor al Día de las Madres: una de mis escrituras favoritas<\/p>\n<p>46 Pues así como yo siempre los había llamado mis hijos (porque todos ellos eran muy jóvenes), así ellos me dijeron: Padre, he aquí, nuestro Dios está con nosotros, y no permitirá que caigamos; avancemos, pues; no mataríamos a nuestros hermanos si nos dejaran en paz; vamos, por tanto, no sea que derroten al ejército de Antipus.<\/p>\n<p>47 Y nunca habían combatido; sin embargo, no temían la muerte, y estimaban más la libertad de sus padres que sus propias vidas; sí, sus madres les habían enseñado que si no dudaban, Dios los libraría. 48 Y me repitieron las palabras de sus madres, diciendo: No dudamos que nuestras madres lo sabían. Alma 56:46-48<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>distrito<\/li>\n<li>yo traduciendo<\/li>\n<li>bicho hoja<\/li>\n<li>la mejor quesadilla de la vida<\/li>\n<li>Volvieron las lluvias de Florida, o sea calor de verano + humedad<\/li>\n<li>no hay más que decir, goku san<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-05-09_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_265.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_266.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Feliz Día de las madres Buenos Días! Feliz Día de las madres! (Un poco tarde ahora) Tuvimos una semana bastante buena aquí en Brandon y Plant City. En general hicimos muchas pasadas a visitar y enseñamos lecciones, de todo. Tenemos unos amigos bastante buena onda que están cerca de tener fecha de bautismo. Por favor oren por Zulene & su familia, Los Reyes. A su bebé de 5 meses le van a hacer varias cirugías. Para ser completamente honesto, no me acuerdo de mucho de esta semana. Todo pareció bastante normal, lo de siempre. En honor al Día de las Madres: una de mis escrituras favoritas 46 Pues así como yo siempre los había llamado mis hijos (porque todos ellos eran muy jóvenes), así ellos me dijeron: Padre, he aquí, nuestro Dios está con nosotros, y no permitirá que caigamos; avancemos, pues; no mataríamos a nuestros hermanos si nos dejaran en paz; vamos, por tanto, no sea que derroten al ejército de Antipus. 47 Y nunca habían combatido; sin embargo, no temían la muerte, y estimaban más la libertad de sus padres que sus propias vidas; sí, sus madres les habían enseñado que si no dudaban, Dios los libraría. 48 Y me repitieron las palabras de sus madres, diciendo: No dudamos que nuestras madres lo sabían. Alma 56:46-48 Los amo! Elder Jacobs Fotos: distrito yo traduciendo bicho hoja la mejor quesadilla de la vida Volvieron las lluvias de Florida, o sea calor de verano + humedad no hay más que decir, goku san Más de esta semana"}, {"id": "l48", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAY 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HN\">🇭🇳 Honduras<\/span><\/div>", "cultures": ["HN"], "moments": [], "extra": "Honduras", "kind": "Carta 48 · Brandon", "title": "🚂🚃🚃🚃 el tren del grind 🌊", "date": "2022-05-16T05:28:00", "group": "2022-05", "html": "<div class=\"body\"><p>Buenos Días mis chiquis! (jerga de Honduras para \"compas\")<\/p>\n<p>Todo super bien!<\/p>\n<p>No lo expliqué en el último correo, pero tuvimos cambios. El Élder Huntsman y yo seguimos igual, pero más o menos cambiamos de área. Antes cubríamos toda la estaca y ahora solo cubrimos la mitad, mientras que las hermanas cubren la otra mitad. Por eso tenemos más tiempo para buscar y subirnos al tren del grind para levantar esta mitad del área (sobre todo Plant City). También por este cambio ahora vivimos en 2 departamentos: el actual/anterior en Lithia (el centro de la zona) y uno en Plant City para los días en que no tiene sentido manejar casi una hora de regreso y mejor quedarnos a dormir. En cuanto a la semana, en general fue bastante normal/lo esperado. Mucho tiempo buscando al principio de la semana, pero hacia el final casi puras lecciones. El domingo estuvo bien pero largo. 1 hora en la iglesia de Plant City, 2 en Brandon + 2 horas de reuniones, y 1 hora para el devocional de jóvenes adultos. Mucha reunión/mucho estar sentado.<\/p>\n<p>He estado aprendiendo sobre el poder de la oración y de tener buena comunicación, así que aquí van unas preguntas para que todos piensen en sus oraciones/comunicación:<\/p>\n<ul class=\"bul\">\n<li>¿Te distraes fácilmente?<\/li>\n<li>¿Tiendes a hacer que todo se trate de ti?<\/li>\n<li>Mientras alguien más está hablando, ¿piensas en lo que vas a decir en vez de escuchar para entenderle?<\/li>\n<li>¿Te enfocas en los fracasos/dificultades en vez de en las bendiciones?<\/li>\n<\/ul>\n<p>Testifico que dios te ama y es bueno!<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>boliche con el distrito anterior (el lunes pasado)<\/li>\n<li>la piña más chiquita<\/li>\n<li>folleto de los israelitas hebreos<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-05-16_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-05-16_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-16_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-05-16_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-05-16_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_267.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_268.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_269.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_270.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🚂🚃🚃🚃 el tren del grind 🌊 Buenos Días mis chiquis! (jerga de Honduras para \"compas\") Todo super bien! No lo expliqué en el último correo, pero tuvimos cambios. El Élder Huntsman y yo seguimos igual, pero más o menos cambiamos de área. Antes cubríamos toda la estaca y ahora solo cubrimos la mitad, mientras que las hermanas cubren la otra mitad. Por eso tenemos más tiempo para buscar y subirnos al tren del grind para levantar esta mitad del área (sobre todo Plant City). También por este cambio ahora vivimos en 2 departamentos: el actual/anterior en Lithia (el centro de la zona) y uno en Plant City para los días en que no tiene sentido manejar casi una hora de regreso y mejor quedarnos a dormir. En cuanto a la semana, en general fue bastante normal/lo esperado. Mucho tiempo buscando al principio de la semana, pero hacia el final casi puras lecciones. El domingo estuvo bien pero largo. 1 hora en la iglesia de Plant City, 2 en Brandon + 2 horas de reuniones, y 1 hora para el devocional de jóvenes adultos. Mucha reunión/mucho estar sentado. He estado aprendiendo sobre el poder de la oración y de tener buena comunicación, así que aquí van unas preguntas para que todos piensen en sus oraciones/comunicación: ¿Te distraes fácilmente? ¿Tiendes a hacer que todo se trate de ti? Mientras alguien más está hablando, ¿piensas en lo que vas a decir en vez de escuchar para entenderle? ¿Te enfocas en los fracasos/dificultades en vez de en las bendiciones? Testifico que dios te ama y es bueno! Los amo Elder Jacobs Fotos: boliche con el distrito anterior (el lunes pasado) la piña más chiquita folleto de los israelitas hebreos Más de esta semana"}, {"id": "l49", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAY 2022<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 49 · Brandon", "title": "🐺🤯->☠ ¡Aquí Rojo 2, los tengo encima!", "date": "2022-05-23T05:12:00", "group": "2022-05", "html": "<div class=\"body\"><p>Como están mis amigos?<\/p>\n<p>Todo bien acá en la Florida<\/p>\n<p>Esta semana definitivamente fue una de las más difíciles. Nuestro horario estuvo un poco desordenado con los días en que normalmente estamos en Plant City vs. Brandon, pero aun así le dimos con todo.<\/p>\n<p>Una de las cosas más difíciles fue la cantidad de lecciones que logramos programar y que luego cero, nada, ninguna de ellas se dio. Eso significó mucho tiempo buscando o yendo a nuestros planes de respaldo, algo que he descubierto que es súper clave. Lo cual me lleva a mi pensamiento de hoy:<\/p>\n<p>Marcos 8:<\/p>\n<p>27 Y salieron Jesús y sus discípulos por las aldeas de Cesarea de Filipo. Y en el camino preguntó a sus discípulos, diciéndoles: ¿Quién dicen los hombres que soy yo?<\/p>\n<p>28 Y ellos respondieron: Juan el Bautista; y otros, Elías; y otros, alguno de los profetas. 29 Entonces él les dijo: Y vosotros, ¿quién decís que soy? Y respondiendo Pedro, le dijo: Tú eres el Cristo. Cristo no fue solo un plan de respaldo para nuestros fracasos, pecados, faltas e imperfecciones, sino todo el plan. Desde el principio, Él fue escogido para librarnos de nuestra muerte espiritual y física. ¡Confíen en Él y en Su gracia!<\/p>\n<p>Ahora, para explicar el título del correo.<\/p>\n<p>Referencia a Star Wars porque por qué no, y esta semana me mordió un perro.<\/p>\n<p>El Élder Huntsman y yo estábamos en nuestra pupusería y parque de tráilers favoritos tratando de visitar a unos amigos y encontrar nuevos. Él estaba apuntando algo en el Libro de Área cuando una señora llegó a su casa y se estacionó. Su perro, que antes estaba como loco ladrando, se calmó y fue a recibirla. Nos vimos, nos saludamos con la mano, pero ella se metió antes de que yo pudiera empezar a hablar con ella, así que decidí intentar tocar la puerta.<\/p>\n<p>Mientras me acercaba a su tráiler/patio, me acordé del perro y decidí ver si lo veía. Lo vi al instante, él me vio a mí ¡y se volvió loco! Cuando me di cuenta, iba retrocediendo tratando de esquivar esta bala canina. Su primera embestida falló y solo me agarró el pantalón, pero luego se lanzó otra vez y saltó, y me agarró la rodilla. Estaba a punto de irse contra el Élder Huntsman cuando la señora salió y le gritó.<\/p>\n<p>Se veía súper apenada y nada sorprendida de que hubiera vuelto a pasar...<\/p>\n<p>Pero sin hoyos en el pantalón. Y el perro, ni idea de qué tipo, alguna cruza de poodle<\/p>\n<p>Mándenme fotos de perritos lindos y buena onda para compensar jaja, o cuéntenme una historia de cuando los mordieron. La próxima semana es nuestra ronda de recepción, por lo pesada que estuvo esta semana con todos los planes cayéndose<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>nuevo distrito<\/li>\n<li>Franklin, el Chad absoluto de los conversos recientes<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-05-23_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-23_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-05-23_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_271.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_272.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_273.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_274.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_275.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_276.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_277.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_278.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_279.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_280.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐺🤯->☠ ¡Aquí Rojo 2, los tengo encima! Como están mis amigos? Todo bien acá en la Florida Esta semana definitivamente fue una de las más difíciles. Nuestro horario estuvo un poco desordenado con los días en que normalmente estamos en Plant City vs. Brandon, pero aun así le dimos con todo. Una de las cosas más difíciles fue la cantidad de lecciones que logramos programar y que luego cero, nada, ninguna de ellas se dio. Eso significó mucho tiempo buscando o yendo a nuestros planes de respaldo, algo que he descubierto que es súper clave. Lo cual me lleva a mi pensamiento de hoy: Marcos 8: 27 Y salieron Jesús y sus discípulos por las aldeas de Cesarea de Filipo. Y en el camino preguntó a sus discípulos, diciéndoles: ¿Quién dicen los hombres que soy yo? 28 Y ellos respondieron: Juan el Bautista; y otros, Elías; y otros, alguno de los profetas. 29 Entonces él les dijo: Y vosotros, ¿quién decís que soy? Y respondiendo Pedro, le dijo: Tú eres el Cristo. Cristo no fue solo un plan de respaldo para nuestros fracasos, pecados, faltas e imperfecciones, sino todo el plan. Desde el principio, Él fue escogido para librarnos de nuestra muerte espiritual y física. ¡Confíen en Él y en Su gracia! Ahora, para explicar el título del correo. Referencia a Star Wars porque por qué no, y esta semana me mordió un perro. El Élder Huntsman y yo estábamos en nuestra pupusería y parque de tráilers favoritos tratando de visitar a unos amigos y encontrar nuevos. Él estaba apuntando algo en el Libro de Área cuando una señora llegó a su casa y se estacionó. Su perro, que antes estaba como loco ladrando, se calmó y fue a recibirla. Nos vimos, nos saludamos con la mano, pero ella se metió antes de que yo pudiera empezar a hablar con ella, así que decidí intentar tocar la puerta. Mientras me acercaba a su tráiler/patio, me acordé del perro y decidí ver si lo veía. Lo vi al instante, él me vio a mí ¡y se volvió loco! Cuando me di cuenta, iba retrocediendo tratando de esquivar esta bala canina. Su primera embestida falló y solo me agarró el pantalón, pero luego se lanzó otra vez y saltó, y me agarró la rodilla. Estaba a punto de irse contra el Élder Huntsman cuando la señora salió y le gritó. Se veía súper apenada y nada sorprendida de que hubiera vuelto a pasar... Pero sin hoyos en el pantalón. Y el perro, ni idea de qué tipo, alguna cruza de poodle Mándenme fotos de perritos lindos y buena onda para compensar jaja, o cuéntenme una historia de cuando los mordieron. La próxima semana es nuestra ronda de recepción, por lo pesada que estuvo esta semana con todos los planes cayéndose Los amo! Elder Jacobs Fotos: nuevo distrito Franklin, el Chad absoluto de los conversos recientes Más de esta semana"}, {"id": "l50", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAY 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": [], "moments": ["Temple"], "extra": "", "kind": "Carta 50 · Brandon", "title": "🤯 Las cosas de mi alma & el grind 🤠", "date": "2022-05-30T06:03:00", "group": "2022-05", "html": "<div class=\"body\"><p>Ola, cómo estáis?<\/p>\n<p>Todo va increíble por aquí. Hemos visto más éxito y tuvimos grandes oportunidades de aprender y luego aplicar lo nuevo que aprendimos para ver milagros.<\/p>\n<p>Esta semana no tuvimos consejo de distrito porque tuvimos conferencia de zona. El enfoque esta vez fue \"las cosas de mi alma\"/testimonio final. Como fue la última con los Hollingsworth antes de que lleguen los Gardiner, fue muy especial. Las capacitaciones estuvieron muy enfocadas en metas, verdades clave y nuestro desarrollo personal. Básicamente, si me fuera a morir, qué enseñaría/testificaría antes. Aunque no voy a compartir aquí la historia de mi conversión (pregúntenme si quieren, se las cuento), sí tengo algo que compartir; una de las muchas cosas de mi alma.<\/p>\n<p>Templos<\/p>\n<p>Los templos siempre han sido algo especial para mí. Son completamente diferentes a los edificios donde nos reunimos, y he tenido la oportunidad de visitar muchos, ya sea para las ordenanzas en sí o en casas abiertas. Nunca me había dado cuenta, pero uno de mis recuerdos o etapas más felices de mi vida fue mi penúltimo año de prepa, porque iba cada jueves después de la escuela con amigos (ahora el Élder Grossen &amp; el que pronto será el Élder Baker). Este año también ha sido increíble porque pude visitar el Templo de Orlando en marzo, y como misión estamos enfocados en lograr que los conversos recientes y los miembros que no han ido vayan al templo. Es una meta difícil porque no podemos estar ahí con ellos, pero sus experiencias no tienen precio. Mosíah 2:6<\/p>\n<p>Y plantaron sus tiendas alrededor del templo, cada hombre con la puerta de su tienda dando hacia el templo, a fin de que así permanecieran en sus tiendas y oyeran las palabras que el rey Benjamín les iba a hablar. Espero que todos puedan encontrar tiempo esta semana para ir al templo, o al menos a los terrenos si andan cortos de tiempo o están tratando de renovar su recomendación. Los amo a todos.<\/p>\n<p>Ahora, para seguir con lo que pasó esta semana.<\/p>\n<p>Esta semana fui de intercambio a Riverview, donde pasé 24 horas otra vez con el Élder CJ Ricks y con el Élder Mason. La pasamos bastante bien juntos. Íbamos a salir en bici, pero las bicis se atoraron en el portabicicletas... así que nos echamos un montón de millas en carro.<\/p>\n<p>Tuvimos unas lecciones bien prendidas esta semana. Aquí van los nombres de algunos de nuestros amigos por si pueden orar por ellos 🙏 Jaime - respuesta a la promesa de Moroni<\/p>\n<p>Melina - recuperación de su salud y consuelo<\/p>\n<p>Zulene - ayuda con su familia y su niña que tiene unos problemas de salud serios<\/p>\n<p>Mercedes - encontrar maneras de completar para los gastos<\/p>\n<p>Felix - encontrar el equilibrio entre la iglesia y el trabajo<\/p>\n<p>En general, oren para que reconozcan la verdad, encuentren tiempo para ir a la iglesia y aprendan inglés.<\/p>\n<p>Ha sido una semana de encontrar y tratar de encontrar a los verdaderos escogidos y preparados para recibir. Pasamos mucho de nuestro tiempo esta semana caminando, llamando y manejando por algunas de las distancias.<\/p>\n<p class=\"sign\">Los amo changos<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos<\/p>\n<ul class=\"bul\">\n<li>vi al Élder Ballif en la conferencia de zona<\/li>\n<li>tomando mate (¡gracias mamá!)<\/li>\n<li>pasta de calabacín 🤤 (la volvería a comer, la verdad el grind saludable ha ido bien)<\/li>\n<li>Sábados en la noche 🌙 🔥<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-05-30_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-30_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-30_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-30_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure emas de salud serios Mercedes - encontrar maneras de completar para los gastos Felix - encontrar el equilibrio entre la iglesia y el trabajo En general, oren para que reconozcan la verdad, encuentren tiempo para ir a la iglesia y aprendan inglés. Ha sido una semana de encontrar y tratar de encontrar a los verdaderos escogidos y preparados para recibir. Pasamos mucho de nuestro tiempo esta semana caminando, llamando y manejando por algunas de las distancias. Los amo changos Elder Jacobs Fotos vi al Élder Ballif en la conferencia de zona tomando mate (¡gracias mamá!) pasta de calabacín 🤤 (la volvería a comer, la verdad el grind saludable ha ido bien) Sábados en la noche 🌙 🔥 Más de esta semana"}, {"id": "l51", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><\/div>", "cultures": ["WS"], "moments": [], "extra": "Samoa", "kind": "Carta 51 · Brandon", "title": "¡Llegó el verano!", "date": "2022-06-06T15:14:00", "group": "2022-06", "html": "<div class=\"body\"><p>Hola Amigos! Hace Calor ¡se podría freír un huevo en el cemento, está taaan caliente!<\/p>\n<p>La canción de Plaza Sésamo...<\/p>\n<p>En fin, el verano llegó con todo; cambios de clima random, mucha lluvia y humedad y, claro, relámpagos. Por algo es la capital mundial de los rayos.<\/p>\n<p>En cuanto a esta semana, tratamos de aprovecharla al máximo y ganar el reto de más lecciones con miembros ayudándonos a enseñar. Era entre los 2 distritos de la zona y los aplastamos = ¡fiesta de pizza en el P-day! Fue bastante difícil tener miembros tan seguido, pero ayudó a nuestros amigos a entender más y a sentirse más hermanados.<\/p>\n<p>Esta semana fui a otro intercambio a Riverview y no pasó mucho por un montón de citas canceladas o reprogramadas. Fue divertido estar con esos élderes, Ricks y Ricks. Sí, hay 2 en ese compañerismo + Élder Mason.<\/p>\n<p>Nuestros amigos están bien; algunos tienen mucho interés en leer, otros necesitan un poco de ánimo, y a otros los dejamos, pero tal vez con otros misioneros cuando estén más preparados. He aprendido mucho sobre eso y sobre la oración esta semana mientras he luchado con algunas preguntas y he tratado de recibir más revelación para guiar este compañerismo y esta área. Me he dado cuenta de que, cuando se puede, hacer algunas oraciones en voz alta, aunque esté solo, ayuda muchísimo, junto con simplemente escuchar y esperar a que Dios hable en esta \"conversación\". Ha estado bueno.<\/p>\n<p>Disfruten las fotos de la conferencia de zona, la última del presidente y la Hermana Hollingsworth<\/p>\n<p>Mi teléfono decidió dejar de ser teléfono esta semana, así que la próxima semana tendré más fotos y podré hablar/escribir más. #computergang4today<\/p>\n<p>los amamos! ¡Cumplo 1 año el jueves! (aunque todavía necesito aprender más y ayudar a otros :D)<\/p>\n<p>ah, y el Élder Huntsman y yo también vamos a recibir un nuevo misionero en capacitación de Samoa esta semana. A mitad de cambio, wuu<\/p>\n<p class=\"sign\">Elder Jacobs<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-06-06_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-06_0_1.jpeg\" alt=\"\"><\/figure><\/div>", "text": "¡Llegó el verano! Hola Amigos! Hace Calor ¡se podría freír un huevo en el cemento, está taaan caliente! La canción de Plaza Sésamo... En fin, el verano llegó con todo; cambios de clima random, mucha lluvia y humedad y, claro, relámpagos. Por algo es la capital mundial de los rayos. En cuanto a esta semana, tratamos de aprovecharla al máximo y ganar el reto de más lecciones con miembros ayudándonos a enseñar. Era entre los 2 distritos de la zona y los aplastamos = ¡fiesta de pizza en el P-day! Fue bastante difícil tener miembros tan seguido, pero ayudó a nuestros amigos a entender más y a sentirse más hermanados. Esta semana fui a otro intercambio a Riverview y no pasó mucho por un montón de citas canceladas o reprogramadas. Fue divertido estar con esos élderes, Ricks y Ricks. Sí, hay 2 en ese compañerismo + Élder Mason. Nuestros amigos están bien; algunos tienen mucho interés en leer, otros necesitan un poco de ánimo, y a otros los dejamos, pero tal vez con otros misioneros cuando estén más preparados. He aprendido mucho sobre eso y sobre la oración esta semana mientras he luchado con algunas preguntas y he tratado de recibir más revelación para guiar este compañerismo y esta área. Me he dado cuenta de que, cuando se puede, hacer algunas oraciones en voz alta, aunque esté solo, ayuda muchísimo, junto con simplemente escuchar y esperar a que Dios hable en esta \"conversación\". Ha estado bueno. Disfruten las fotos de la conferencia de zona, la última del presidente y la Hermana Hollingsworth Mi teléfono decidió dejar de ser teléfono esta semana, así que la próxima semana tendré más fotos y podré hablar/escribir más. #computergang4today los amamos! ¡Cumplo 1 año el jueves! (aunque todavía necesito aprender más y ayudar a otros :D) ah, y el Élder Huntsman y yo también vamos a recibir un nuevo misionero en capacitación de Samoa esta semana. A mitad de cambio, wuu Elder Jacobs"}, {"id": "l52", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["WS"], "moments": ["Temple"], "extra": "Samoa", "kind": "Carta 52 · Brandon", "title": "Triple problema", "date": "2022-06-13T09:26:00", "group": "2022-06", "html": "<div class=\"body\"><p>Que onda chavos? Tenemos el hijole!<\/p>\n<p>El poder del trío ha comenzado. Y también las travesuras<\/p>\n<p>El principio de la semana fue bastante normal, más que nada esperando el día del nuevo misionero. Lunes: la familia Hernández nos regaló tacos al pastor. ¡Estamos tratando de llevarlos al templo! (¡De hecho encontramos los registros perdidos! ¡Milagro!) El martes empezó con el consejo de distrito, enfocándonos en ampliar nuestra visión. Las pruebas nos ayudan y necesitamos ponernos metas altas para ver grandes milagros. También me dieron un teléfono temporal para poder tomar más fotos, pero a veces todavía se me olvida que otra vez tengo teléfono. Miércoles: tuvimos entrevistas con el presidente y la Hermana Hollingsworth. Definitivamente fue difícil decir adiós por ahora, porque era la última y el nuevo presidente llega el 30, pero pude aclarar más cosas hablando con ellos. Y como dijeron los dos, \"van a estar atorados con nosotros para siempre\", así que está bien. Luego, en la tarde, en Thonotosassa, otra ciudad del área de Plant City. Ahora viene lo divertido<\/p>\n<p>El jueves en la mañana manejamos a Tampa y recogimos al Élder Fuimaono Lutu, alias Élder Lutu. Es de Samoa Americana 🇼🇸 y está lleno de energía. Está tan feliz de estar aquí, es increíble. Solo que a veces se queda dormido porque todavía se está ajustando a la diferencia de horario y al horario misional completo. El español será su 3.er idioma después de 1. inglés 2. samoano (el común &amp; el idioma de los dioses, porque hay 2 niveles de hablarlo).<\/p>\n<p>El resto de la semana fue mucho tocar puertas tratando de encontrar más amigos. Tuvimos bastante éxito, pero nada de éxito en cuanto a que la gente estuviera en casa cuando tratamos de pasar la segunda vez. También pasamos más tiempo adentro haciendo Facebook, llamadas y capacitando al hijole, porque intentamos cambiarle un poco, pero también casi siempre estuvo lloviendo este fin de semana. Mi pequeño pensamiento de esta semana es sobre la oración y la promesa de Moroni. Antes pensaba que era algo de una sola vez, pero si de verdad estamos desarrollando nuestro testimonio, enfrentándonos a otras personas y sus ideas, o lo que sea, necesitamos seguir pidiendo revelación de la verdad. Así que solo quiero que oren y le pidan a Dios otra vez que les confirme la veracidad del Libro de Mormón.<\/p>\n<p class=\"sign\">Los amo no Hagan drogas<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>hijole dormilón Élder Lutu X2<\/li>\n<li>Jamaica (hibisco; de verdad hacen una bebida con esto, es súper buena y saludable)<\/li>\n<li>lección por videollamada con Franklin (converso reciente) y su amiga Edynay<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-06-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-13_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-13_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-13_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_298.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_299.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Triple problema Que onda chavos? Tenemos el hijole! El poder del trío ha comenzado. Y también las travesuras El principio de la semana fue bastante normal, más que nada esperando el día del nuevo misionero. Lunes: la familia Hernández nos regaló tacos al pastor. ¡Estamos tratando de llevarlos al templo! (¡De hecho encontramos los registros perdidos! ¡Milagro!) El martes empezó con el consejo de distrito, enfocándonos en ampliar nuestra visión. Las pruebas nos ayudan y necesitamos ponernos metas altas para ver grandes milagros. También me dieron un teléfono temporal para poder tomar más fotos, pero a veces todavía se me olvida que otra vez tengo teléfono. Miércoles: tuvimos entrevistas con el presidente y la Hermana Hollingsworth. Definitivamente fue difícil decir adiós por ahora, porque era la última y el nuevo presidente llega el 30, pero pude aclarar más cosas hablando con ellos. Y como dijeron los dos, \"van a estar atorados con nosotros para siempre\", así que está bien. Luego, en la tarde, en Thonotosassa, otra ciudad del área de Plant City. Ahora viene lo divertido El jueves en la mañana manejamos a Tampa y recogimos al Élder Fuimaono Lutu, alias Élder Lutu. Es de Samoa Americana 🇼🇸 y está lleno de energía. Está tan feliz de estar aquí, es increíble. Solo que a veces se queda dormido porque todavía se está ajustando a la diferencia de horario y al horario misional completo. El español será su 3.er idioma después de 1. inglés 2. samoano (el común & el idioma de los dioses, porque hay 2 niveles de hablarlo). El resto de la semana fue mucho tocar puertas tratando de encontrar más amigos. Tuvimos bastante éxito, pero nada de éxito en cuanto a que la gente estuviera en casa cuando tratamos de pasar la segunda vez. También pasamos más tiempo adentro haciendo Facebook, llamadas y capacitando al hijole, porque intentamos cambiarle un poco, pero también casi siempre estuvo lloviendo este fin de semana. Mi pequeño pensamiento de esta semana es sobre la oración y la promesa de Moroni. Antes pensaba que era algo de una sola vez, pero si de verdad estamos desarrollando nuestro testimonio, enfrentándonos a otras personas y sus ideas, o lo que sea, necesitamos seguir pidiendo revelación de la verdad. Así que solo quiero que oren y le pidan a Dios otra vez que les confirme la veracidad del Libro de Mormón. Los amo no Hagan drogas Elder Jacobs Fotos: hijole dormilón Élder Lutu X2 Jamaica (hibisco; de verdad hacen una bebida con esto, es súper buena y saludable) lección por videollamada con Franklin (converso reciente) y su amiga Edynay Más de esta semana"}, {"id": "l53", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><\/div>", "cultures": ["WS"], "moments": [], "extra": "Samoa", "kind": "Carta 53 · Brandon", "title": "🍳🍱 Feliz día de los Padres 🥩", "date": "2022-06-20T05:49:00", "group": "2022-06", "html": "<div class=\"body\"><p>Talofa usos! (Qué onda mis hermanos, en samoano)<\/p>\n<p>¡Esta semana hizo un calor tremendo, 100 °F la mayor parte del tiempo, hasta el fin de semana, cuando cayó un montón de lluvia! Feliz Día del Padre a todos los papás (incluso a los que les caí en su casa para convivir con los muchachos)<\/p>\n<p>Tuvimos nuestro último consejo de distrito esta semana; pensé que iba a estar aquí otro cambio, pero de hecho me voy a Tampa, capacitando y ahora como líder de distrito, así que ya veremos cómo va. La reunión estuvo increíble: repasamos cómo hacernos responsables ante el Señor, elegir la obediencia por amor, y terminamos con una reunión de testimonios. También el Élder Noah Ricks vino con nosotros para un intercambio. Fue interesante porque se va a casa mañana, pero durante el intercambio estuvo constantemente tratando de darnos consejos. Las últimas palabras de sabiduría de un hombre moribundo. El miércoles nuestro GPS dijo: oye, tienes que tomar un camino de tierra, aunque había una carretera perfectamente buena para llegar a la casa de nuestro amigo Emilio. Pero sí encontramos un tractor y un campo de girasoles.<\/p>\n<p>No pasó mucho al día siguiente, pero fuimos bendecidos con muchas lecciones increíbles.<\/p>\n<p>El viernes estuvo loco, Jaja. Fuimos a que Yoana, una conversa reciente que se está alejando un poco, nos arreglara las cejas. Así que pasar ese tiempo con ella estuvo bien, pero en mi opinión, cómo duele el depilado con hilo. Después también tuvimos más lecciones buenísimas con amigos. Liset se siente mejor, pero ella y Rafael decidieron mover la fecha más adelante porque todavía no están del todo listos, ¡pero de verdad quieren hacerlo pronto!<\/p>\n<p>El resto de la semana fue bastante tranquila por la cantidad de llamadas/mensajes tratando de saber cómo estaban los amigos y llevarlos a la iglesia. Cosas bastante normales.<\/p>\n<p>Quería compartir algo que el Élder Lutu me compartió sobre la ayuda/los dones espirituales. Como necesitamos la ayuda de Dios, normalmente oramos para obtenerla (a veces simplemente se nos da, pero normalmente oramos), pero para cosas más complejas, como el don de lenguas, tenemos que estudiar. Estudiar el idioma y también las Escrituras, porque si no hacemos las dos cosas, nuestro bienestar espiritual decae y además le hacemos trampa al Espíritu. Necesitamos equilibrio en todo. Así que traten de descubrir si necesitan esforzarse más por ese don que quieren o estudiar más para asegurarse de que el Espíritu esté ahí para ayudarles a recibirlo.<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>lambo @ la iglesia<\/li>\n<li>Buffet estilo campestre de Fred's con el Hermano Mosher<\/li>\n<li>capitán🇺🇸<\/li>\n<li>Una conversa reciente nos depiló las cejas con hilo (sí, parezco drogado... dolió, ¿ok?..)<\/li>\n<li>🚜🌻<\/li>\n<li>Bob Ross<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-06-20_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-20_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-20_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_8.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_300.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_301.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_302.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_303.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_304.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_305.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_306.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_307.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_308.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_309.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_310.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_311.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_312.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_313.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_314.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_315.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_316.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_317.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🍳🍱 Feliz día de los Padres 🥩 Talofa usos! (Qué onda mis hermanos, en samoano) ¡Esta semana hizo un calor tremendo, 100 °F la mayor parte del tiempo, hasta el fin de semana, cuando cayó un
