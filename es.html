o<\/b> <span class=\"aw\">oct – dic 2022 · reabrimos Largo en español<\/span><\/li><li data-n=\"9\"><span class=\"an\">9<\/span><b>Fort Myers<\/b> <span class=\"aw\">dic 2022 – may 2023<\/span><\/li><\/ol><p class=\"maphint\">Toca un pin o una zona para ver sus fotos y cartas.<\/p><div id=\"areaHost\"><\/div>", "text": "Donde serví Golfo de México Tampa Bay 1 Dade City 2 Lakeland 3 Winter Haven 4 Peace River 5 Largo 6 Brandon 7 Tampa 8 9 Fort Myers 1 Dade City jul – oct 2021 2 Lakeland oct – nov 2021 3 Winter Haven nov 2021 – feb 2022 4 Peace River feb – mar 2022 · Wauchula y Arcadia 5 Largo mar – abr 2022 6 Brandon abr – jun 2022 · y Plant City 7 Tampa jun – oct 2022 8 Largo oct – dic 2022 · reabrimos Largo en español 9 Fort Myers dic 2022 – may 2023 Toca un pin o una zona para ver sus fotos y cartas."}, {"id": "prologue", "kind": "Prólogo", "title": "Para mi yo del futuro", "date": "2022-07-21T07:15:00", "group": "start", "html": "<div class=\"body\"><p>Para mi yo del futuro:<\/p>\n<p>Espero que la misión te esté yendo bien. Espero que tu español haya mejorado muchísimo y que estés disfrutando de la obra. Estoy a punto de empezar el CCM en casa, pero estoy emocionado. Nervioso por dejar a la familia y a los amigos, por sobrevivir al aeropuerto, y nervioso por mis nuevos compañeros y líderes de la misión; pero sé esto: el Señor siempre bendice a Sus siervos y a Sus hijos cuando seguimos Su guía.<\/p>\n<p>He tenido tantas experiencias que no tienen explicación desde el punto de vista del mundo (la víbora de cascabel en la tienda de campaña, el don de lenguas, impresiones al azar que seguí, etc.), que sé que hay un Dios amoroso. También sé que soy un hijo de Dios que en esta Tierra comete errores que requieren que me arrepienta por medio de la Expiación. No te olvides de orar, leer tus Escrituras y hacer lo que es más importante (la familia y el Evangelio). Nuestra bendición patriarcal es Escritura y revelación personal y una gran herramienta. Aunque ahora no entiendo todo lo que dice, sé que lo entenderemos, y probablemente ya aprendiste algo nuevo en la misión.<\/p>\n<p>Persevera hasta el fin, sin bajar nunca el ritmo, porque eso es lo que el Señor ha mandado. En la misión y en la vida venidera. La diabetes siempre será una lucha en la vida, pero podemos con ella. Mira cómo hemos podido manejarla para poder servir a nuestro Señor, nuestro Dios.<\/p>\n<p>Fuiste reservado para este día por una razón, enviado a esta misión por una razón, a la capacitación en línea por una razón, preservado por una razón, y muchas otras cosas en la vida por una razón. Hace falta una perspectiva divina y eterna para entenderlo, pero lo entenderemos. Siempre eres amado aquí en la tierra por tu familia y también por la celestial. El Señor te guiará si tan solo le pides. Sigue adelante con fe cuando tengas dudas.<\/p><\/div>", "text": "Para mi yo del futuro Para mi yo del futuro: Espero que la misión te esté yendo bien. Espero que tu español haya mejorado muchísimo y que estés disfrutando de la obra. Estoy a punto de empezar el CCM en casa, pero estoy emocionado. Nervioso por dejar a la familia y a los amigos, por sobrevivir al aeropuerto, y nervioso por mis nuevos compañeros y líderes de la misión; pero sé esto: el Señor siempre bendice a Sus siervos y a Sus hijos cuando seguimos Su guía. He tenido tantas experiencias que no tienen explicación desde el punto de vista del mundo (la víbora de cascabel en la tienda de campaña, el don de lenguas, impresiones al azar que seguí, etc.), que sé que hay un Dios amoroso. También sé que soy un hijo de Dios que en esta Tierra comete errores que requieren que me arrepienta por medio de la Expiación. No te olvides de orar, leer tus Escrituras y hacer lo que es más importante (la familia y el Evangelio). Nuestra bendición patriarcal es Escritura y revelación personal y una gran herramienta. Aunque ahora no entiendo todo lo que dice, sé que lo entenderemos, y probablemente ya aprendiste algo nuevo en la misión. Persevera hasta el fin, sin bajar nunca el ritmo, porque eso es lo que el Señor ha mandado. En la misión y en la vida venidera. La diabetes siempre será una lucha en la vida, pero podemos con ella. Mira cómo hemos podido manejarla para poder servir a nuestro Señor, nuestro Dios. Fuiste reservado para este día por una razón, enviado a esta misión por una razón, a la capacitación en línea por una razón, preservado por una razón, y muchas otras cosas en la vida por una razón. Hace falta una perspectiva divina y eterna para entenderlo, pero lo entenderemos. Siempre eres amado aquí en la tierra por tu familia y también por la celestial. El Señor te guiará si tan solo le pides. Sigue adelante con fe cuando tengas dudas."}, {"id": "l1", "area": 0, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">CCM<\/span><span class=\"pm-d\">JUN 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"SV\">🇸🇻 El Salvador<\/span><\/div>", "cultures": ["SV"], "moments": [], "extra": "El Salvador", "kind": "Carta 1 · CCM", "title": "¡Primera semana del CCM lista!", "date": "2021-06-12T09:21:00", "group": "2021-06", "html": "<div class=\"body\"><p>Bueno, a todos: ya pasaron mis primeros días en el CCM. ¡He estado ocupadísimo!<\/p>\n<p>El miércoles fue mi primer día y empezó tranquilo, con clase solo en la tarde, pero me dio chance de conocer a mis maestros y a los otros misioneros de mi distrito. Somos 11, todos vamos a algún lugar de EE. UU. y todos de habla hispana. Mi compañero, el Élder Byington, es de Arkansas pero va a servir en Fresno, California. Pero el jueves y el viernes fue cuando de verdad me aventaron a la acción.<\/p>\n<p>Tuve clases y talleres de 7am a 4pm, pero me encantó. Empezamos a ver algunas de las lecciones misionales y cómo enseñarlas, nuestro propósito como misioneros y muchas otras cosas más pequeñas, como Facebook y usar la tecnología de manera eficaz. Aunque no aprendimos ni usamos mucho español porque apenas estamos empezando, yo me aseguré de seguir aprendiendo por mi cuenta. El idioma parece fácil con muchas palabras como estudiar y Salvador, pero las Escrituras me mostraron que todavía me queda un largo camino por aprender. Así es, el misionero nuevo que soy dijo: vamos a leer el Libro de Mormón en español. Es broma, bueno, más o menos. Sí empecé a estudiarlo poco a poco, un capítulo aquí y otro allá, pero tengo una copia en inglés a la mano para asegurarme de entender la mayoría de las palabras. Aunque a veces puede ser muy difícil, probablemente es una de las actividades que más satisfacción me da en el día. Constantemente me expone a palabras y frases nuevas, lo que me permite leer más y a veces más rápido.<\/p>\n<p>Por ahora termino aquí con lo que sé hasta ahora y mi testimonio:<\/p>\n<p>Yo se que mi slavador, Jesucristo, vivo y ama todos personas. Yo se que el poder de las oraciones es verdadero. Yo se que el Evangelio es restaurado para Jose Smith y el es una profeta de Dios. Finalmente, yo se que El Libro de Mormon es muy verdadero y testifica de Jesucristo. En el nombre de dios hijo, Jesucristo, Amen.<\/p>\n<p>Sé que mi Salvador, Jesucristo, vive y ama a todos. Sé que el poder de la oración es verdadero. Sé que el Evangelio fue restaurado por medio de José Smith y que él fue un profeta de Dios. Finalmente, sé que el Libro de Mormón es muy verdadero y testifica de Jesucristo. En el nombre del Hijo de Dios, Jesucristo. Amén.<\/p>\n<p class=\"sign\">Con amor y mucha emoción,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p><\/div>", "text": "¡Primera semana del CCM lista! Bueno, a todos: ya pasaron mis primeros días en el CCM. ¡He estado ocupadísimo! El miércoles fue mi primer día y empezó tranquilo, con clase solo en la tarde, pero me dio chance de conocer a mis maestros y a los otros misioneros de mi distrito. Somos 11, todos vamos a algún lugar de EE. UU. y todos de habla hispana. Mi compañero, el Élder Byington, es de Arkansas pero va a servir en Fresno, California. Pero el jueves y el viernes fue cuando de verdad me aventaron a la acción. Tuve clases y talleres de 7am a 4pm, pero me encantó. Empezamos a ver algunas de las lecciones misionales y cómo enseñarlas, nuestro propósito como misioneros y muchas otras cosas más pequeñas, como Facebook y usar la tecnología de manera eficaz. Aunque no aprendimos ni usamos mucho español porque apenas estamos empezando, yo me aseguré de seguir aprendiendo por mi cuenta. El idioma parece fácil con muchas palabras como estudiar y Salvador, pero las Escrituras me mostraron que todavía me queda un largo camino por aprender. Así es, el misionero nuevo que soy dijo: vamos a leer el Libro de Mormón en español. Es broma, bueno, más o menos. Sí empecé a estudiarlo poco a poco, un capítulo aquí y otro allá, pero tengo una copia en inglés a la mano para asegurarme de entender la mayoría de las palabras. Aunque a veces puede ser muy difícil, probablemente es una de las actividades que más satisfacción me da en el día. Constantemente me expone a palabras y frases nuevas, lo que me permite leer más y a veces más rápido. Por ahora termino aquí con lo que sé hasta ahora y mi testimonio: Yo se que mi slavador, Jesucristo, vivo y ama todos personas. Yo se que el poder de las oraciones es verdadero. Yo se que el Evangelio es restaurado para Jose Smith y el es una profeta de Dios. Finalmente, yo se que El Libro de Mormon es muy verdadero y testifica de Jesucristo. En el nombre de dios hijo, Jesucristo, Amen. Sé que mi Salvador, Jesucristo, vive y ama a todos. Sé que el poder de la oración es verdadero. Sé que el Evangelio fue restaurado por medio de José Smith y que él fue un profeta de Dios. Finalmente, sé que el Libro de Mormón es muy verdadero y testifica de Jesucristo. En el nombre del Hijo de Dios, Jesucristo. Amén. Con amor y mucha emoción, Elder Jacobs"}, {"id": "l2", "area": 0, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">CCM<\/span><span class=\"pm-d\">JUN 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 2 · CCM", "title": "Semana 3 - Modo español", "date": "2021-06-26T20:40:00", "group": "2021-06", "html": "<div class=\"body\"><p>Hola amigos,<\/p>\n<p>Esta semana empezó bastante normal hasta que los maestros activaron el modo español, como le pasó a Buzz Lightyear en Toy Story. Fue algo lento, pero al principio de la semana todos andábamos confundidos y nos la pasábamos diciendo \"repetirlo\" o \"habla más lento, por favor\" (repítelo o habla más despacio, por favor). Definitivamente fue difícil al principio y todavía puede serlo, pero puedo testificar que el don de lenguas de verdad está ahí para aquellos a quienes el Señor lo necesita dar.<\/p>\n<p>Aparte de que el español apenas empezó esta semana, diría que fue bastante normal. Clases a la misma hora, más o menos los mismos temas del Evangelio y mucha diversión con mi distrito, solo que en espanglish.<\/p>\n<p>Lo que más me gustó esta semana probablemente fue nuestra mini reunión de testimonios y hoy nuestra carne asada del día de preparación (P-day).<\/p>\n<p>Fue increíble escuchar los testimonios por lo fuerte que se sentía el Espíritu y por lo fluidos que de repente nos volvimos al testificar, aunque fuera solo entre nosotros. De verdad se nos dio una probadita de lo que llegaremos a ser en las próximas semanas, meses y años.<\/p>\n<p>El P-day pasado mi familia y yo manejamos a Utah para ver a la familia (una ventaja del CCM en casa), y como estaba por allá pude juntarme con algunos de mi distrito que viven cerca. Resulta que sí tienen piernas y no son solo caras en una pantalla que veo casi todos los días.<\/p>\n<p>Termino con una frase de Buzz,       (bueno.... más o menos)<\/p>\n<p>¡Venga conmigo, amigos! ¡Te mostraré las maravillas de la evangelio, y juntos lucharemos contra el despiadado Satán!<\/p>\n<p>(¡Vengan conmigo, amigos! ¡Les mostraré las maravillas del Evangelio y juntos podemos derrotar al malvado Satanás!)<\/p>\n<p>Adios por ahora amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<hr class=\"ps\">\n<p>Análisis del devocional del distrito + travesuras<\/p>\n<p>Carne asada con el Élder Wirick, el Élder Austin y el Élder Gray (de izquierda a derecha)<\/p>\n<p>La próxima vez trataré de no olvidarme y tomar más durante la semana ;)<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-06-26_1_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-06-26_1_1.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_000.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_001.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_002.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_003.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Semana 3 - Modo español Hola amigos, Esta semana empezó bastante normal hasta que los maestros activaron el modo español, como le pasó a Buzz Lightyear en Toy Story. Fue algo lento, pero al principio de la semana todos andábamos confundidos y nos la pasábamos diciendo \"repetirlo\" o \"habla más lento, por favor\" (repítelo o habla más despacio, por favor). Definitivamente fue difícil al principio y todavía puede serlo, pero puedo testificar que el don de lenguas de verdad está ahí para aquellos a quienes el Señor lo necesita dar. Aparte de que el español apenas empezó esta semana, diría que fue bastante normal. Clases a la misma hora, más o menos los mismos temas del Evangelio y mucha diversión con mi distrito, solo que en espanglish. Lo que más me gustó esta semana probablemente fue nuestra mini reunión de testimonios y hoy nuestra carne asada del día de preparación (P-day). Fue increíble escuchar los testimonios por lo fuerte que se sentía el Espíritu y por lo fluidos que de repente nos volvimos al testificar, aunque fuera solo entre nosotros. De verdad se nos dio una probadita de lo que llegaremos a ser en las próximas semanas, meses y años. El P-day pasado mi familia y yo manejamos a Utah para ver a la familia (una ventaja del CCM en casa), y como estaba por allá pude juntarme con algunos de mi distrito que viven cerca. Resulta que sí tienen piernas y no son solo caras en una pantalla que veo casi todos los días. Termino con una frase de Buzz, (bueno.... más o menos) ¡Venga conmigo, amigos! ¡Te mostraré las maravillas de la evangelio, y juntos lucharemos contra el despiadado Satán! (¡Vengan conmigo, amigos! ¡Les mostraré las maravillas del Evangelio y juntos podemos derrotar al malvado Satanás!) Adios por ahora amigos, Elder Jacobs Análisis del devocional del distrito + travesuras Carne asada con el Élder Wirick, el Élder Austin y el Élder Gray (de izquierda a derecha) La próxima vez trataré de no olvidarme y tomar más durante la semana ;) Más de esta semana"}, {"id": "l3", "area": 0, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">CCM<\/span><span class=\"pm-d\">JUL 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 3 · CCM", "title": "Semana 4 - completada", "date": "2021-07-03T08:56:00", "group": "2021-07", "html": "<div class=\"body\"><p>Hola amigos, ¿Cómo le va?<\/p>\n<p>Aquí en el CCM en casa no ha pasado gran cosa. Todas las clases en español, algunos juegos y todas las citas de enseñanza en español (de práctica). Bueno, supongo que eso sí es bastante importante.<\/p>\n<p>Nuestras clases siguen siendo casi todas en español (la Hermana Morgan a veces opina otra cosa, pero igual la queremos por eso jaja). Esta semana tuvimos más cosas para las lecciones, como compartir Escrituras, conversaciones cortas sobre el clima o cualquier otra cosa de adultos que ni entiendo ni hago en inglés, y también tuvimos una cita de cena de mentiritas. Todos trajimos botanas y teníamos que asegurarnos de tener buenos modales, una conversación normal sobre lo que fuera y luego compartir un mensaje breve al final. El Élder Byington y yo compartimos la historia de Pedro caminando sobre el agua. Cuando tenemos fe y una vida centrada en Cristo y Sus enseñanzas podemos hacer lo imposible, pero cuando llegan Satanás u otras tentaciones podemos tambalearnos y perder de vista el rumbo por un momento. Solo tenemos que recordar que Cristo nunca se va, sino que se queda con los brazos totalmente abiertos y, como con Pedro, nos tomará de la mano y nos salvará.<\/p>\n<p>Mi juego favorito de esta semana es nativo o caracoles. Nativo es algo que apenas empezamos a jugar: escogemos a alguien al azar para que sea \"el nativo\". Esa persona tiene que hablar y escribir solo en español y todos los demás tienen que camuflarse para que el maestro no la descubra al final de la clase. De verdad me ayudó a intentar hacer todo en español. El otro definitivamente es el favorito del Élder Austin. Para practicar los números en español jugamos caracoles. Empiezas en uno o donde sea y cuentas hacia arriba, pero cuando el número tiene un 7 o es múltiplo de 7 dices caracoles (caracoles en español), y la siguiente persona tiene que saber el número que sigue aunque no haya escuchado el anterior. Los setentas fueron medio dolor de cabeza jaja. Lo último importante de esta semana fueron nuestras citas de enseñanza. Han sido de 15 min solo en español, pero ha sido muy padre ver cuánto podemos decir de verdad sin Google y hacer llegar nuestro mensaje. La próxima semana son de 30 min, lo cual da un poquito de miedo, pero el Élder Byington y yo siempre nos pasamos de los 15 min por dar testimonio o por cualquier cosa que termina tomando más tiempo del que planeamos.<\/p>\n<p>Para terminar, aquí está mi Escritura favorita de esta semana: 3 Nefi 18:20<\/p>\n<p>y cualquier cosa que pidáis al Padre en mi nombre, si es justa, creyendo que recibiréis, he aquí, os será concedida.<\/p>\n<p class=\"sign\">Hasta Luego Amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P. D. - También ya me llegó mi itinerario de vuelo: Phoenix -&gt; SLC -&gt; Tampa, 21 de julio (prácticamente todo el día por la duración de los vuelos y la diferencia de horario)<\/p>\n<p>Fotos: fotos familiares de hace un mes antes de irme, el clima que nos espera en nuestras misiones y, por último, el día de un misionero en la mañana<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-07-03_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-07-03_0_1.png\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-07-03_0_2.png\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_004.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Semana 4 - completada Hola amigos, ¿Cómo le va? Aquí en el CCM en casa no ha pasado gran cosa. Todas las clases en español, algunos juegos y todas las citas de enseñanza en español (de práctica). Bueno, supongo que eso sí es bastante importante. Nuestras clases siguen siendo casi todas en español (la Hermana Morgan a veces opina otra cosa, pero igual la queremos por eso jaja). Esta semana tuvimos más cosas para las lecciones, como compartir Escrituras, conversaciones cortas sobre el clima o cualquier otra cosa de adultos que ni entiendo ni hago en inglés, y también tuvimos una cita de cena de mentiritas. Todos trajimos botanas y teníamos que asegurarnos de tener buenos modales, una conversación normal sobre lo que fuera y luego compartir un mensaje breve al final. El Élder Byington y yo compartimos la historia de Pedro caminando sobre el agua. Cuando tenemos fe y una vida centrada en Cristo y Sus enseñanzas podemos hacer lo imposible, pero cuando llegan Satanás u otras tentaciones podemos tambalearnos y perder de vista el rumbo por un momento. Solo tenemos que recordar que Cristo nunca se va, sino que se queda con los brazos totalmente abiertos y, como con Pedro, nos tomará de la mano y nos salvará. Mi juego favorito de esta semana es nativo o caracoles. Nativo es algo que apenas empezamos a jugar: escogemos a alguien al azar para que sea \"el nativo\". Esa persona tiene que hablar y escribir solo en español y todos los demás tienen que camuflarse para que el maestro no la descubra al final de la clase. De verdad me ayudó a intentar hacer todo en español. El otro definitivamente es el favorito del Élder Austin. Para practicar los números en español jugamos caracoles. Empiezas en uno o donde sea y cuentas hacia arriba, pero cuando el número tiene un 7 o es múltiplo de 7 dices caracoles (caracoles en español), y la siguiente persona tiene que saber el número que sigue aunque no haya escuchado el anterior. Los setentas fueron medio dolor de cabeza jaja. Lo último importante de esta semana fueron nuestras citas de enseñanza. Han sido de 15 min solo en español, pero ha sido muy padre ver cuánto podemos decir de verdad sin Google y hacer llegar nuestro mensaje. La próxima semana son de 30 min, lo cual da un poquito de miedo, pero el Élder Byington y yo siempre nos pasamos de los 15 min por dar testimonio o por cualquier cosa que termina tomando más tiempo del que planeamos. Para terminar, aquí está mi Escritura favorita de esta semana: 3 Nefi 18:20 y cualquier cosa que pidáis al Padre en mi nombre, si es justa, creyendo que recibiréis, he aquí, os será concedida. Hasta Luego Amigos, Elder Jacobs P. D. - También ya me llegó mi itinerario de vuelo: Phoenix -> SLC -> Tampa, 21 de julio (prácticamente todo el día por la duración de los vuelos y la diferencia de horario) Fotos: fotos familiares de hace un mes antes de irme, el clima que nos espera en nuestras misiones y, por último, el día de un misionero en la mañana Más de esta semana"}, {"id": "l4", "area": 0, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">CCM<\/span><span class=\"pm-d\">JUL 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 4 · CCM", "title": "Semana 5", "date": "2021-07-10T15:30:00", "group": "2021-07", "html": "<div class=\"body\"><p>Hola amigos,<\/p>\n<p>Otra semana completada y solo falta una más para terminar el CCM en casa para misioneros de habla hispana. Esta semana estuvo llena de mucho español, como siempre. Ahora, cuando hablo con otras personas por teléfono o lo que sea, al principio me siento medio raro hablando en inglés. Nuestras lecciones de esta semana se enfocaron en ampliar nuestra capacidad de ofrecer oraciones, compartir Escrituras y dar testimonio. Seguimos jugando nativo en clase y la Hermana Pierce va 0-8, creo. O sea que hemos podido hacerle a ella y al Hermano Gabbittas (nuestro maestro de la tarde/su refuerzo) un montón de preguntas random.<\/p>\n<p>\"Si fueras un utensilio de cocina, ¿cuál serías? O, ¿de qué color eres? ¿O algún pasatiempo raro y poco conocido que tengas? Etc.\" El Élder Byington y yo seguimos enseñando lecciones esta semana, pero de 30 min (todavía con nuestro amigo Andrés). Hace preguntas tan buenas y siempre está pensando, así que siempre tratamos de anticiparnos. Saber cómo responder de forma sencilla y en español a algunas de esas preguntas no es fácil. Ha progresado muy bien y le encanta aprender, así que tenemos muchas ganas de esta próxima semana, con 2 lecciones más antes de salir del CCM.<\/p>\n<p>Una última cosa antes de irme. Mañana (el 11) voy a dar un discurso en la iglesia, así que si quieren vengan a escuchar y a saludar. Es a las 10:30 am hora de Arizona aquí: 1520 S Catalina St, Gilbert, AZ 85296<\/p>\n<p>o lo pueden ver en YouTube aquí: https://www.youtube.com/channel/UCy6UlOLiWS4rFp40zT1T5Wg<\/p>\n<p>Adios por ahora amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos: un diagrama sobre la fe (perdón que no haya más, es que no tomé muchas esta semana porque todo se sentía normal) laFE.png<\/p>\n<p>53K<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-07-10_0_0.png\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_005.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Semana 5 Hola amigos, Otra semana completada y solo falta una más para terminar el CCM en casa para misioneros de habla hispana. Esta semana estuvo llena de mucho español, como siempre. Ahora, cuando hablo con otras personas por teléfono o lo que sea, al principio me siento medio raro hablando en inglés. Nuestras lecciones de esta semana se enfocaron en ampliar nuestra capacidad de ofrecer oraciones, compartir Escrituras y dar testimonio. Seguimos jugando nativo en clase y la Hermana Pierce va 0-8, creo. O sea que hemos podido hacerle a ella y al Hermano Gabbittas (nuestro maestro de la tarde/su refuerzo) un montón de preguntas random. \"Si fueras un utensilio de cocina, ¿cuál serías? O, ¿de qué color eres? ¿O algún pasatiempo raro y poco conocido que tengas? Etc.\" El Élder Byington y yo seguimos enseñando lecciones esta semana, pero de 30 min (todavía con nuestro amigo Andrés). Hace preguntas tan buenas y siempre está pensando, así que siempre tratamos de anticiparnos. Saber cómo responder de forma sencilla y en español a algunas de esas preguntas no es fácil. Ha progresado muy bien y le encanta aprender, así que tenemos muchas ganas de esta próxima semana, con 2 lecciones más antes de salir del CCM. Una última cosa antes de irme. Mañana (el 11) voy a dar un discurso en la iglesia, así que si quieren vengan a escuchar y a saludar. Es a las 10:30 am hora de Arizona aquí: 1520 S Catalina St, Gilbert, AZ 85296 o lo pueden ver en YouTube aquí: https://www.youtube.com/channel/UCy6UlOLiWS4rFp40zT1T5Wg Adios por ahora amigos, Elder Jacobs Fotos: un diagrama sobre la fe (perdón que no haya más, es que no tomé muchas esta semana porque todo se sentía normal) laFE.png 53K Más de esta semana"}, {"id": "l5", "area": 0, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">CCM<\/span><span class=\"pm-d\">JUL 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 5 · CCM", "title": "El final semana de MTC", "date": "2021-07-17T09:07:00", "group": "2021-07", "html": "<div class=\"body\"><p>Bueno, amigos, ya se acabó. Les seré honesto: a veces sentía que no llegaba lo suficientemente pronto, pero me da tristeza dejar a mi increíble distrito. Todos vamos a volar a nuestros campos misionales en estos próximos días. Estoy súper nervioso, pero emocionado. La semana fue normal en general, con clases en la mañana y en la tarde y lecciones unas cuantas veces a la semana (todavía con Andrés), pero todas las lecciones fueron de repaso, aunque aún más a fondo. Por ejemplo, en vez de compartir Escrituras como aprendimos la vez pasada, se trataba de asegurarnos de que, al leer, expliquemos y lo relacionemos con nosotros mismos para hacer mejores conexiones y ayudar a los amigos a quienes enseñamos a entender mejor. Eso nos ayudó muchísimo más adelante en la semana con nuestras lecciones.<\/p>\n<p>Lo mejor de esta semana probablemente fue la lluvia y el tiempo con la familia. Llovió dos veces esta semana, \"un milagro\", como lo describí en clase. Todas las mañanas con la Hermana Pierce repasábamos milagros. Me encanta escuchar las historias y los pensamientos de todos, y de verdad me hizo pensar en todas las formas, grandes y pequeñas, en que el Señor nos ha bendecido a mí y a mi familia. Algo que no mencioné la semana pasada es que del viernes en la noche al sábado en la mañana se fue la luz en una zona enorme del este del valle de Phoenix, incluida mi casa, por una tormenta enorme de polvo y viento. Al principio fue muy frustrante, pero fue de noche y solo duró 10 horas. Viéndolo en retrospectiva, definitivamente fue un milagro, porque no fue el día ni la noche más calurosa y lo arreglaron rápido. Lo otro que más me gustó no es nada en particular con mi familia, sino que me he estado dando cuenta de cuánto los voy a extrañar y de lo mucho que de verdad disfruto su compañía.<\/p>\n<p>Algo triste de esta semana. Nuestro amigo Andrés, a quien le hemos estado enseñando por casi 4 semanas, nos preguntó si lo veríamos la próxima semana el viernes, nuestra última visita. Le dimos la noticia y lo tomó bastante bien, pero los dos definitivamente nos pusimos tristes. Sé que las personas a quienes enseñamos en el CCM son actores y solo algunos no son miembros, pero aun así fue triste crear esa conexión con él y luego tener que dejarlo.<\/p>\n<p>Mi vuelo a Florida es el miércoles y voy a estar viajando básicamente todo el día (unas 7 horas de vuelo más 3 horas de diferencia de horario con Arizona). Estoy emocionado de ir a servir y ver muchas cosas nuevas, pero también nervioso por tratar de empacar todo y asegurarme de hacer bien la conexión de SLC a Tampa. No sé cuándo será el próximo correo, pero sigo tomando fotos para que me acompañen en el viaje.<\/p>\n<p>Las fotos de esta semana son un montón con mi distrito y nuestros maestros, excepto una. Esa es importante para mí por cómo me siento ahorita con lo del vuelo. Estuvo lloviendo casi todo el día, y aun cuando no llovía había nubes por todos lados, oscuras y amenazantes. Pero en medio de todo estaba el Sol: brillante, hermoso y sin nada que estorbara su luz. Cristo es esa luz que siempre está ahí, aun cuando no la podemos ver. Él prevalece sobre la oscuridad y lo hará para siempre.<\/p>\n<p class=\"sign\">Hasta luego mis amigos (ustedes están un poco loco),<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos: foto de la clase de la mañana pero con un montón de filtros y demás, la graduación del CCM, la reunión de distrito sobre la combustión humana, foto normal de la clase de la mañana, la clase de la tarde con nuestro otro maestro, el Hermano Gabbitas, la foto del sol y, por último, unos memes/ángeles<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-07-17_0_0.png\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-07-17_0_1.png\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-07-17_0_2.png\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-07-17_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-07-17_0_4.png\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-07-17_0_5.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-07-17_0_6.png\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_006.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_007.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_008.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "El final semana de MTC Bueno, amigos, ya se acabó. Les seré honesto: a veces sentía que no llegaba lo suficientemente pronto, pero me da tristeza dejar a mi increíble distrito. Todos vamos a volar a nuestros campos misionales en estos próximos días. Estoy súper nervioso, pero emocionado. La semana fue normal en general, con clases en la mañana y en la tarde y lecciones unas cuantas veces a la semana (todavía con Andrés), pero todas las lecciones fueron de repaso, aunque aún más a fondo. Por ejemplo, en vez de compartir Escrituras como aprendimos la vez pasada, se trataba de asegurarnos de que, al leer, expliquemos y lo relacionemos con nosotros mismos para hacer mejores conexiones y ayudar a los amigos a quienes enseñamos a entender mejor. Eso nos ayudó muchísimo más adelante en la semana con nuestras lecciones. Lo mejor de esta semana probablemente fue la lluvia y el tiempo con la familia. Llovió dos veces esta semana, \"un milagro\", como lo describí en clase. Todas las mañanas con la Hermana Pierce repasábamos milagros. Me encanta escuchar las historias y los pensamientos de todos, y de verdad me hizo pensar en todas las formas, grandes y pequeñas, en que el Señor nos ha bendecido a mí y a mi familia. Algo que no mencioné la semana pasada es que del viernes en la noche al sábado en la mañana se fue la luz en una zona enorme del este del valle de Phoenix, incluida mi casa, por una tormenta enorme de polvo y viento. Al principio fue muy frustrante, pero fue de noche y solo duró 10 horas. Viéndolo en retrospectiva, definitivamente fue un milagro, porque no fue el día ni la noche más calurosa y lo arreglaron rápido. Lo otro que más me gustó no es nada en particular con mi familia, sino que me he estado dando cuenta de cuánto los voy a extrañar y de lo mucho que de verdad disfruto su compañía. Algo triste de esta semana. Nuestro amigo Andrés, a quien le hemos estado enseñando por casi 4 semanas, nos preguntó si lo veríamos la próxima semana el viernes, nuestra última visita. Le dimos la noticia y lo tomó bastante bien, pero los dos definitivamente nos pusimos tristes. Sé que las personas a quienes enseñamos en el CCM son actores y solo algunos no son miembros, pero aun así fue triste crear esa conexión con él y luego tener que dejarlo. Mi vuelo a Florida es el miércoles y voy a estar viajando básicamente todo el día (unas 7 horas de vuelo más 3 horas de diferencia de horario con Arizona). Estoy emocionado de ir a servir y ver muchas cosas nuevas, pero también nervioso por tratar de empacar todo y asegurarme de hacer bien la conexión de SLC a Tampa. No sé cuándo será el próximo correo, pero sigo tomando fotos para que me acompañen en el viaje. Las fotos de esta semana son un montón con mi distrito y nuestros maestros, excepto una. Esa es importante para mí por cómo me siento ahorita con lo del vuelo. Estuvo lloviendo casi todo el día, y aun cuando no llovía había nubes por todos lados, oscuras y amenazantes. Pero en medio de todo estaba el Sol: brillante, hermoso y sin nada que estorbara su luz. Cristo es esa luz que siempre está ahí, aun cuando no la podemos ver. Él prevalece sobre la oscuridad y lo hará para siempre. Hasta luego mis amigos (ustedes están un poco loco), Elder Jacobs Fotos: foto de la clase de la mañana pero con un montón de filtros y demás, la graduación del CCM, la reunión de distrito sobre la combustión humana, foto normal de la clase de la mañana, la clase de la tarde con nuestro otro maestro, el Hermano Gabbitas, la foto del sol y, por último, unos memes/ángeles Más de esta semana"}, {"id": "l6", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">JUL 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"AR\">🇦🇷 Argentina<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["AR"], "moments": ["Baptism"], "extra": "Argentina", "kind": "Carta 6 · Dade City", "title": "Primera semana en la misión! Dade city, Florida", "date": "2021-07-26T13:49:00", "group": "2021-07", "html": "<div class=\"body\"><p>Hola Amigos!<\/p>\n<p>🦎<\/p>\n<p>Esta semana estuvo bastante divertida y pasaron muchas cosas (puede que este correo sea un poco más largo de lo normal). El lunes y el martes no pasó mucho porque estuve empacando y asegurándome de tener todo para mi vuelo del miércoles. Además de pasar un poco más de tiempo con mi familia.<\/p>\n<p>El miércoles fue mi vuelo a Florida. Me desperté a las 3:30 para alistarme y terminar de empacar para llegar al aeropuerto una hora antes de que saliera. Todo salió bien ese día. De PHX a SLC iba con otros misioneros, solo que todos iban al CCM, no a su misión. Aun así fue padre platicar con ellos (éramos como 12). Luego de SLC a TPA éramos 18 y solo otros 2 eran de habla hispana. Todo salió bien, solo fue un día largo. Ya en Tampa, todos nos reunimos con el presidente de misión y su esposa, junto con los asistentes (AP).🦎<\/p>\n<p>Esa noche tuvimos unas entrevistas con el Presidente y con el Élder Plumb sobre la misión y cualquier problema de salud. Luego nos mandaron a todos con algunos de los élderes y hermanas que vivían cerca para pasar la noche. A mí me tocó en el departamento donde vive el Élder Farar. Fue súper padre volver a verlo y ponernos un poco al día. Él y yo fuimos a la misma preparatoria y tomamos muchas de las mismas optativas (baile de salón &amp; Kenpo). Lo habían asignado a Argentina, de habla hispana, pero con el Covid el año pasado lo reasignaron aquí. Le encanta estar aquí y ahora ayuda con la búsqueda por redes sociales. En promedio, el 12% de los bautismos de nuestra misión vienen de Facebook. ¡El mes pasado, al parecer, fue el 25%! Tenemos la oportunidad de ayudar con los mensajes en el \"horario estelar\" del martes: la hora en que la gente llega del trabajo y se relaja con el celular. Así que vamos a estar respondiendo a personas o comentando y contestando en nuestros anuncios de Facebook en español.<\/p>\n<p>🦎<\/p>\n<p>El jueves fue uno de los mejores días, en mi opinión, porque ese día nos dieron a nuestros entrenadores. Mi entrenador es el Élder Nelson. Es de Portland, Oregón, y es altísimo. Tiene un montón de historias y muy buenas ideas para ayudarme a mí y a todos nuestros amigos. Ese día también recogimos mi bici antes de ir al departamento. Los otros élderes con los que vivimos son el Élder Ballif y el Élder Ricks. El Élder Ballif es de Idaho y creció en una granja. Es súper divertido estar con él por lo payaso que puede ser. Hace un \"pay de queso\" increíble, o sea, un cheesecake (me recibieron con uno, es receta familiar). Siempre hace sonreír a la gente. El Élder Ricks es el tranquilo de todos nosotros. También es nuevo en esta área. Él y yo batallamos para saber a dónde ir y acordarnos de todos nuestros amigos por ahora.. A todos nos encanta molestarnos y echar chistes en las noches antes de dormir.🦎 💀<\/p>\n<p>Estamos en la Zona Tampa, por el área de Dade City. El Élder Nelson y el Élder Ballif llevan ya 3 cambios en Dade/Zephyrhills, así que son muy buenos guías. Tenemos una de las áreas más grandes porque no hay muchos misioneros de habla hispana, así que tenemos que cubrir mucho terreno. Tratamos de enseñar a quienes necesitan lecciones en español, pero a veces encontramos a otros que también hablan inglés y, según las circunstancias, a veces les enseñamos nosotros mismos en lugar de pasárselos a los misioneros de inglés. Nuestro plan diario es: levantarnos, hacer ejercicio un rato, alistarnos para el día y luego planificar. Tenemos un tiempo de estudio, comida y más tiempo de estudio. Además de llamadas a la gente para ver cómo están y tal vez conseguir algunas lecciones. Aunque casi nadie a quien enseñamos tiene teléfono, así que la mayoría de las veces tenemos que pasar a verlos. A veces está bastante ocupado y otras un poco lento, ¡pero me encanta estar aquí! (Hasta la humedad, suficiente para quedarme 2 años.) Me parece una locura lo verde y frondoso que es todo. Es como una selva. También hay un montón de pájaros de aspecto rarísimo y un montón de lagartijitas 🦎 . Te las encuentras por todos lados. En la iglesia, en las casas, atropelladas en la calle, en este correo, etc. (Aquí hay muchos tipos de animales atropellados jaja)🦎<\/p>\n<p>Tenemos una pequeña rama en español que se organizó hace unas semanas. Son como 15 miembros y cada domingo tratamos de llevar a 10 de los amigos a quienes enseñamos para hacerla crecer. Esta semana nuestros amigos fueron German &amp; Isabel y sus 4 hijos. Apenas me he reunido un poco con ellos, pero son súper amables y lindos. Todos nuestros amigos lo son. De verdad puedo sentir amor por todos ellos. Hasta hablé un poquito en la reunión sacramental. Es tan pequeña que todos notaron al misionero nuevo. Solo pasé al frente, me presenté y luego compartí unos pensamientos y mi testimonio. Esta semana también fuimos a la Primaria por nuestros amigos. Solo los adultos tienen una clase toda en español, porque la mayoría de los niños aquí también saben inglés, excepto Esteban, Diana, Francisco y Ximena (los hijos de Isabel y German) 🦎. Así que tratamos de ayudarlos, pero los maestros andaban un poco dispersos y no se adaptaban mucho a los nuevos o a las visitas, así que no fue lo mejor. Las canciones que estaban cantando son nuevas, así que el Élder Nelson y yo no las conocíamos y no las pudimos traducir. Pero tenían ademanes y los niños sí intentaron cantar, aunque eran más que nada ruiditos. Aun así, qué lindo que quieran venir a la iglesia y hacer amigos.<\/p>\n<p>🦎<\/p>\n<p>Por si se lo preguntaban, sí, ya tuve algunos encuentros raros con unos \"Florida Man\" esta semana y espero que haya más la próxima. Nada demasiado loco, así que todavía no voy a contar nada, pero los élderes me dicen que hay un señor que es de Plutón y asegura que la versión del rey Santiago de la Biblia es el registro de antes de la guerra y la versión nueva de la Biblia es de después de la guerra. También hay un señor que sirvió 23 periodos en Irak y tiene un nudillo biónico. *Nada de esto es real, solo están locos* Supongo que tengo mucho que esperar jaja.<\/p>\n<p>Espero que todos los que celebraron el Día de los Pioneros se hayan divertido. Nosotros solo trabajamos como siempre.🦎<\/p>\n<p>Mi milagro de esta semana probablemente fue la familia Miño. Son unos miembros súper increíbles que hermanan a todos, sin importar qué tan nuevos sean en la rama, incluso a mí. Se me estaba bajando el azúcar y ya no traía azúcar para eso, así que pasamos a su casa, lo cual nos permitió platicar, presentarme, y nos dieron una paleta helada. Definitivamente una bendición con 95° y 100% de humedad.<\/p>\n<p>Viviendo y trabajando en la selva,🦎<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos de esta semana:<\/p>\n<ul class=\"bul\">\n<li>Volando sobre Florida<\/li>\n<li>Piña silvestre<\/li>\n<li>Burro de porcelana que el Élder Nelson consiguió gratis de tanto fastidiar a un estafador<\/li>\n<li>Tormentón el viernes en la tarde. Por algo le dicen a Florida la capital mundial de los rayos. Traíamos paraguas, pero con tanta lluvia y viento no sirvieron de nada, así que quedamos empapados.<\/li>\n<li>Un Florida Man local al que no le importa la lluvia, solo su podadora<\/li>\n<li>P-day con los élderes (el Élder Nelson, el Élder Ballif, el Élder Ricks y yo)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-07-26_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-07-26_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-07-26_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-07-26_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-07-26_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-07-26_0_5.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_009.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_010.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_011.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_012.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_013.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_014.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_015.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_016.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_017.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_018.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_019.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_020.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_021.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_022.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_023.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_024.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_025.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_026.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_027.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_028.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Primera semana en la misión! Dade city, Florida Hola Amigos! 🦎 Esta semana estuvo bastante divertida y pasaron muchas cosas (puede que este correo sea un poco más largo de lo normal). El lunes y el martes no pasó mucho porque estuve empacando y asegurándome de tener todo para mi vuelo del miércoles. Además de pasar un poco más de tiempo con mi familia. El miércoles fue mi vuelo a Florida. Me desperté a las 3:30 para alistarme y terminar de empacar para llegar al aeropuerto una hora antes de que saliera. Todo salió bien ese día. De PHX a SLC iba con otros misioneros, solo que todos iban al CCM, no a su misión. Aun así fue padre platicar con ellos (éramos como 12). Luego de SLC a TPA éramos 18 y solo otros 2 eran de habla hispana. Todo salió bien, solo fue un día largo. Ya en Tampa, todos nos reunimos con el presidente de misión y su esposa, junto con los asistentes (AP).🦎 Esa noche tuvimos unas entrevistas con el Presidente y con el Élder Plumb sobre la misión y cualquier problema de salud. Luego nos mandaron a todos con algunos de los élderes y hermanas que vivían cerca para pasar la noche. A mí me tocó en el departamento donde vive el Élder Farar. Fue súper padre volver a verlo y ponernos un poco al día. Él y yo fuimos a la misma preparatoria y tomamos muchas de las mismas optativas (baile de salón & Kenpo). Lo habían asignado a Argentina, de habla hispana, pero con el Covid el año pasado lo reasignaron aquí. Le encanta estar aquí y ahora ayuda con la búsqueda por redes sociales. En promedio, el 12% de los bautismos de nuestra misión vienen de Facebook. ¡El mes pasado, al parecer, fue el 25%! Tenemos la oportunidad de ayudar con los mensajes en el \"horario estelar\" del martes: la hora en que la gente llega del trabajo y se relaja con el celular. Así que vamos a estar respondiendo a personas o comentando y contestando en nuestros anuncios de Facebook en español. 🦎 El jueves fue uno de los mejores días, en mi opinión, porque ese día nos dieron a nuestros entrenadores. Mi entrenador es el Élder Nelson. Es de Portland, Oregón, y es altísimo. Tiene un montón de historias y muy buenas ideas para ayudarme a mí y a todos nuestros amigos. Ese día también recogimos mi bici antes de ir al departamento. Los otros élderes con los que vivimos son el Élder Ballif y el Élder Ricks. El Élder Ballif es de Idaho y creció en una granja. Es súper divertido estar con él por lo payaso que puede ser. Hace un \"pay de queso\" increíble, o sea, un cheesecake (me recibieron con uno, es receta familiar). Siempre hace sonreír a la gente. El Élder Ricks es el tranquilo de todos nosotros. También es nuevo en esta área. Él y yo batallamos para saber a dónde ir y acordarnos de todos nuestros amigos por ahora.. A todos nos encanta molestarnos y echar chistes en las noches antes de dormir.🦎 💀 Estamos en la Zona Tampa, por el área de Dade City. El Élder Nelson y el Élder Ballif llevan ya 3 cambios en Dade/Zephyrhills, así que son muy buenos guías. Tenemos una de las áreas más grandes porque no hay muchos misioneros de habla hispana, así que tenemos que cubrir mucho terreno. Tratamos de enseñar a quienes necesitan lecciones en español, pero a veces encontramos a otros que también hablan inglés y, según las circunstancias, a veces les enseñamos nosotros mismos en lugar de pasárselos a los misioneros de inglés. Nuestro plan diario es: levantarnos, hacer ejercicio un rato, alistarnos para el día y luego planificar. Tenemos un tiempo de estudio, comida y más tiempo de estudio. Además de llamadas a la gente para ver cómo están y tal vez conseguir algunas lecciones. Aunque casi nadie a quien enseñamos tiene teléfono, así que la mayoría de las veces tenemos que pasar a verlos. A veces está bastante ocupado y otras un poco lento, ¡pero me encanta estar aquí! (Hasta la humedad, suficiente para quedarme 2 años.) Me parece una locura lo verde y frondoso que es todo. Es como una selva. También hay un montón de pájaros de aspecto rarísimo y un montón de lagartijitas 🦎 . Te las encuentras por todos lados. En la iglesia, en las casas, atropelladas en la calle, en este correo, etc. (Aquí hay muchos tipos de animales atropellados jaja)🦎 Tenemos una pequeña rama en español que se organizó hace unas semanas. Son como 15 miembros y cada domingo tratamos de llevar a 10 de los amigos a quienes enseñamos para hacerla crecer. Esta semana nuestros amigos fueron German & Isabel y sus 4 hijos. Apenas me he reunido un poco con ellos, pero son súper amables y lindos. Todos nuestros amigos lo son. De verdad puedo sentir amor por todos ellos. Hasta hablé un poquito en la reunión sacramental. Es tan pequeña que todos notaron al misionero nuevo. Solo pasé al frente, me presenté y luego compartí unos pensamientos y mi testimonio. Esta semana también fuimos a la Primaria por nuestros amigos. Solo los adultos tienen una clase toda en español, porque la mayoría de los niños aquí también saben inglés, excepto Esteban, Diana, Francisco y Ximena (los hijos de Isabel y German) 🦎. Así que tratamos de ayudarlos, pero los maestros andaban un poco dispersos y no se adaptaban mucho a los nuevos o a las visitas, así que no fue lo mejor. Las canciones que estaban cantando son nuevas, así que el Élder Nelson y yo no las conocíamos y no las pudimos traducir. Pero tenían ademanes y los niños sí intentaron cantar, aunque eran más que nada ruiditos. Aun así, qué lindo que quieran venir a la iglesia y hacer amigos. 🦎 Por si se lo preguntaban, sí, ya tuve algunos encuentros raros con unos \"Florida Man\" esta semana y espero que haya más la próxima. Nada demasiado loco, así que todavía no voy a contar nada, pero los élderes me dicen que hay un señor que es de Plutón y asegura que la versión del rey Santiago de la Biblia es el registro de antes de la guerra y la versión nueva de la Biblia es de después de la guerra. También hay un señor que sirvió 23 periodos en Irak y tiene un nudillo biónico. *Nada de esto es real, solo están locos* Supongo que tengo mucho que esperar jaja. Espero que todos los que celebraron el Día de los Pioneros se hayan divertido. Nosotros solo trabajamos como siempre.🦎 Mi milagro de esta semana probablemente fue la familia Miño. Son unos miembros súper increíbles que hermanan a todos, sin importar qué tan nuevos sean en la rama, incluso a mí. Se me estaba bajando el azúcar y ya no traía azúcar para eso, así que pasamos a su casa, lo cual nos permitió platicar, presentarme, y nos dieron una paleta helada. Definitivamente una bendición con 95° y 100% de humedad. Viviendo y trabajando en la selva,🦎 Elder Jacobs Fotos de esta semana: Volando sobre Florida Piña silvestre Burro de porcelana que el Élder Nelson consiguió gratis de tanto fastidiar a un estafador Tormentón el viernes en la tarde. Por algo le dicen a Florida la capital mundial de los rayos. Traíamos paraguas, pero con tanta lluvia y viento no sirvieron de nada, así que quedamos empapados. Un Florida Man local al que no le importa la lluvia, solo su podadora P-day con los élderes (el Élder Nelson, el Élder Ballif, el Élder Ricks y yo) Más de esta semana"}, {"id": "l7", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AGO 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"GT\">🇬🇹 Guatemala<\/span><span class=\"stamp m\">🐊 Caimanes<\/span><\/div>", "cultures": ["GT"], "moments": ["Gators"], "extra": "Guatemala", "kind": "Carta 7 · Dade City", "title": "Qué Mojado!", "date": "2021-08-02T15:43:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola familia y mis amigos<\/p>\n<p>Esta semana ya vino y se fue, pero qué rico poder disfrutar un poco más del aire acondicionado y relajarse en el P-day. Siempre pensé que Arizona era bastante caliente, y lo es, pero no es la misma miseria que Florida ahorita. Está constantemente como a 90° si no es que más, y casi 100% de humedad. Lo cual no solo significa que hace calor, sino que todo está mojado y te deshidratas fácil porque te chupa el agua. Y estás mojado por la humedad, el sudor y a veces la lluvia. Fuera de eso, me encanta estar aquí, me encanta Dade city. El martes no pasó mucho, pero igual estuvo bien. En la mañana tuvimos consejo de distrito, que estuvo genial, y más tarde tuvimos el horario estelar. El horario estelar es de 6 a 9pm y solo les mandamos mensajes a las personas que responden a publicaciones y anuncios de Facebook. La vez pasada estuvo súper lento, así que espero que la próxima esté un poco mejor, pero igual fue divertido responder y simplemente pasar el rato platicando con el Élder Nelson. Comentario aparte sobre la obra misional en redes sociales: nuestra área es una de las líderes en la obra misional en redes sociales, lo cual está súper padre porque algunas de nuestras ideas se implementan en todo el mundo. La más reciente y la mejor es el SEO (optimización para motores de búsqueda). Los élderes y las hermanas de redes sociales se dieron cuenta de que nuestra Iglesia tenía algunos problemas cuando se buscaba en cualquier sitio, porque le faltaban las etiquetas correctas e información actualizada, que es lo que hace que aparezcamos más. Por ejemplo: si alguien buscaba \"iglesia cristiana\", nuestra Iglesia salía al último porque hasta hace poco ni siquiera estaba etiquetada como una. Esto y muchas otras cosas (los números de teléfono de los centros de reuniones serán números de los misioneros, o el horario de la reunión sacramental en Google Maps, etc.) se van a implementar pronto, así que qué emoción.<\/p>\n<p>El miércoles quedamos empapados. Si me dieran un centavo cada vez que los paraguas no sirven de nada y nos rendimos y nos empapamos, tendría 2 centavos, que no es mucho, pero qué raro que haya pasado dos veces (en realidad no, es verano en Florida, definitivamente va a seguir pasando). Odio cuando llueve porque todos los latinos en un radio de 30 millas se esconden adentro, pero sí encontramos a una familia nueva, los Valesquez, de Guatemala. Nos paramos en la puerta de su casa y les compartimos la Primera Visión (ya me sé de memoria Santiago 1:5 y el relato de José en español) y conseguimos una segunda lección. Además, el apodo de Dade City es \"the dirty Dade\" (\"la Dade sucia\") porque es una zona bastante pobre, así que cuando llueve se pone suuuuper sucia/lodosa/arenosa. Nuestro carro quedó bien asqueroso esta semana con todo lo que le metimos.<\/p>\n<p>Todos los demás días estuvieron bastante simples, con algunas comidas con miembros; gracias, élderes de inglés, por dejarnos acompañarlos y mencionarnos cuando hablan de eso jeje.<\/p>\n<p>El viernes estuvo increíble por la capacitación especializada. Todos los nuevos misioneros en capacitación y sus entrenadores van y reciben enseñanza del presidente, su esposa y otros líderes misionales. Súper increíble, recibí muy buena revelación sobre cómo seguir mejorando yo mismo y la obra misional. También pude ver a algunos de los misioneros, lo cual siempre es divertido.<\/p>\n<p>Hoy (P-day) jugamos voleibol como distrito y fuimos por sushi. Así que un final bastante increíble para una semana que estuvo bien. Así que brindemos por la próxima.<\/p>\n<p>Eso es todo por ahora, amigos. Para la próxima ya habré probado un gator-dog (hot dog de carne de caimán), así que les cuento a qué sabe.<\/p>\n<p>Con mucho amor como siempre,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos: perdón que no sean muchas. Tengo que acostumbrarme a tomarlas para tener un montón de cosas increíbles con qué recordar mi misión y compartir con ustedes<\/p>\n<ul class=\"bul\">\n<li>Piña y lagartija 🦎<\/li>\n<li>Chapulín enorme (3 pulgadas), también están por todos lados<\/li>\n<li>Una Baca (vaca, pero mal escrito. Vaca se escribe con V, pero mucha gente no tiene buena ortografía y la v&amp;b suenan igual en español)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-08-02_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-02_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-02_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_029.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_030.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_031.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Qué Mojado! Hola familia y mis amigos Esta semana ya vino y se fue, pero qué rico poder disfrutar un poco más del aire acondicionado y relajarse en el P-day. Siempre pensé que Arizona era bastante caliente, y lo es, pero no es la misma miseria que Florida ahorita. Está constantemente como a 90° si n 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🐊 Caimanes<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Gators"], "extra": "", "kind": "Carta 8 · Dade City", "title": "Los perros", "date": "2021-08-09T15:19:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola todos,<\/p>\n<p>Esta semana ha estado bastante bien. La rama poco a poco está llenando los llamamientos y creciendo; así que ha sido increíble verlo. Nuestro amigo Jaime fue confirmado el domingo, 3 semanas después de su bautismo jaja (estábamos bastante preocupados por eso, porque si no se hace a tiempo tendría que volver a bautizarse. Pero eso toma meses, según descubrimos. Y no, este no es mi bautismo; lo bautizaron antes de que yo llegara a Florida). También pudimos encontrar una buena cantidad de amigos nuevos para enseñar esta semana, así que eso ha estado genial.<\/p>\n<p>Ya sé que lo que quieren saber es qué tal estuvo el gator-dog, pero... tristemente no lo probé. Fuimos el martes después del consejo de distrito, pero el lugar seguía cerrado por sus vacaciones de verano. Ojalá lo pruebe esta semana o la siguiente. Pero sí probamos algo raro: Panda Buffet. Imagínense un edificio medio de barrio bravo como un Waffle House o algo así, porque eso es lo que es. Por dentro estaba bastante decente y el precio era súper barato. Pronto descubrimos por qué. Este bufé chino de todo lo que puedas comer era otra cosa. Todo se veía bastante normal y algunas cosas estaban buenas, pero en general no; a muchos nos dolió el estómago esa noche. Puede que las hermanas de nuestro distrito nos odien ahora jaja, pero fue toda una experiencia.<\/p>\n<p>Esta semana me tocó un intercambio. Me fui un día con el Élder Peters para ver cómo funciona otra área y aprender en general. Básicamente para eso son. Estuvo bastante bien (pude andar en bici por primera vez, a diferencia de lo usual, que es manejar a algún lugar y luego caminar) y me llevé muy bien con él, pero definitivamente prefiero al Élder Nelson. El miércoles pudimos celebrar el cumpleaños del Hermano Graham con él y su esposa. Estuvo súper divertido y la comida, buenísima. Chequen la foto chistosa.<\/p>\n<p>El resto de la semana fue bastante normal, excepto por los perros; de ahí el título del correo. Había muchísimos perros sueltos esta semana. La mayoría trataban de perseguirnos o algo así, pero nosotros solo caminábamos tranquilos y con cuidado, aunque algunos se acercaron demasiado, en mi opinión. Así que solo levantaba la mano y se paraban en seco. Bastante increíble y, sinceramente, inexplicable (considerando que eran dóbermans, pitbulls, chihuahuas y otros perros bravos).<\/p>\n<p>Lo único más que les tengo que contar esta semana son los tacos auténticos que nos dieron gratis. Planeábamos ir a cenar a la troca de tacos a la que va todo el mundo, pero el Élder Nelson es amigo de la señora que la atiende. Así que cuando llegamos y pedimos nuestros 5 tacos cada uno (listos para pagar), nos dijo que nos fuéramos a sentar a esperar porque le caemos bien los muchachos jaja. Yo pedí de asada, de pollo y al pastor. Ay, ese al pastor está buenísimo.<\/p>\n<p>En fin, una semana bastante buena, llena de pequeños milagros. La fe con obras trae milagros.<\/p>\n<p class=\"sign\">Hasta luego amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P. D. El jueves tenemos conferencia de zona, así que estoy bastante emocionado. Además, acabo de cumplir 2 meses como misionero.<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>en bici por el bosque<\/li>\n<li>perro enojado en un árbol<\/li>\n<li>planta oreja de elefante (súper enoooorme)<\/li>\n<li>tacos gratis<\/li>\n<li>pan de plátano que hice<\/li>\n<li>los Graham en la fiesta de cumpleaños<\/li>\n<li>lavado de carro en P-day (el Élder Ballif y yo íbamos a cortarnos el pelo, por eso no traemos ropa de misionero)<\/li>\n<li>preparando ensalada de frutas con frambuesas<\/li>\n<\/ul><\/div><div clas ban en seco. Bastante increíble y, sinceramente, inexplicable (considerando que eran dóbermans, pitbulls, chihuahuas y otros perros bravos). Lo único más que les tengo que contar esta semana son los tacos auténticos que nos dieron gratis. Planeábamos ir a cenar a la troca de tacos a la que va todo el mundo, pero el Élder Nelson es amigo de la señora que la atiende. Así que cuando llegamos y pedimos nuestros 5 tacos cada uno (listos para pagar), nos dijo que nos fuéramos a sentar a esperar porque le caemos bien los muchachos jaja. Yo pedí de asada, de pollo y al pastor. Ay, ese al pastor está buenísimo. En fin, una semana bastante buena, llena de pequeños milagros. La fe con obras trae milagros. Hasta luego amigos, Elder Jacobs P. D. El jueves tenemos conferencia de zona, así que estoy bastante emocionado. Además, acabo de cumplir 2 meses como misionero. Fotos: en bici por el bosque perro enojado en un árbol planta oreja de elefante (súper enoooorme) tacos gratis pan de plátano que hice los Graham en la fiesta de cumpleaños lavado de carro en P-day (el Élder Ballif y yo íbamos a cortarnos el pelo, por eso no traemos ropa de misionero) preparando ensalada de frutas con frambuesas Más de esta semana"}, {"id": "l9", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AGO 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🌀 Huracán<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Hurricane"], "extra": "", "kind": "Carta 9 · Dade City", "title": "Shabbat Shalom", "date": "2021-08-16T06:01:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola amigos,<\/p>\n<p>Dade City está genial como siempre y esta semana ha estado bastante bien. La semana fue bastante tranquila y normal, así que este correo va a tener muchas cosas random jajaja.<\/p>\n<p>La conferencia de zona fue el jueves y estuvo increíble. Escuchamos capacitaciones de nuestro presidente de misión, su esposa, los asistentes (AP) y algunos otros misioneros a quienes se les pidió. Todo estuvo increíble, tengo muchííísimas notas (no es normal en mí, a menos que esté muy metido) y el Espíritu de verdad se aseguró de que tuviera una lista de cómo mejorar. El Élder Nelson y yo tomamos todas las invitaciones para estudiar y mejorar y las pusimos en práctica. Es especialmente importante estos próximos meses hacer eso y ser obedientes por la enorme llegada de misioneros nuevos. A fin de mes deberían llegar 25 élderes de inglés, 2 élderes de español, 2 hermanas de inglés y 1 hermana de español. ¡30 misioneros! Para finales de octubre, el 50% de la misión estará capacitando o recibiendo capacitación. Así que tenemos que dar un buen ejemplo y seguir todas las reglas, incluso las nuevas que dio el presidente. He notado muchas cosas buenas que vienen de la obediencia a las reglas y al Espíritu, así que tratar de ser perfectamente obediente debería traer aún más, por difícil que suene.<\/p>\n<p>¡No dejes al Espíritu en la banca!<\/p>\n<p>Mucho amor -&gt; altas expectativas<\/p>\n<p>Esas probablemente fueron mis frases favoritas de la conferencia de zona. Cuando el Espíritu te impulse, síguelo. A nadie le gusta sentirse inútil o calentando la banca. Y con mucho amor vienen altas expectativas de la familia, los amigos y nuestro Padre Celestial. Así que tenemos que hacer todo lo posible por devolver ese mismo amor.<\/p>\n<p>El viernes en la tarde tuvimos la oportunidad de comer con una miembro y su familia. Se llama Alison. Se bautizó el año pasado y su esposo unos meses después. Tienen 2 hijos y todos son muy amables. Antes era una judía devota y de alguna manera encontró a los misioneros, y ellos nunca mencionaron a Cristo al enseñarle (si lo hubieran hecho, habría dejado de recibir lecciones, porque los judíos no creen que Cristo fuera el Mesías). Por eso su testimonio es súper padre, y todavía hace muchas cosas judías por su herencia y sus tradiciones familiares. Pudimos celebrar el Shabbat con ella y su familia. El Shabbat es el día santo en que Cristo descansó después de crear el mundo. Empieza a las 5pm del viernes y dura hasta las 5pm del sábado. Si eras un judío súper estricto, como ella lo era, no puedes hacer nada que se considere trabajo. Prender una luz, limpiar, ni siquiera apretar un botón. El saludo es Shabbat shalom, que significa buen día de reposo. Dijimos algunas cosas en hebreo y platicamos de la historia (todo súper padre). Al parecer toda la historia de la Iglesia ocurrió en días festivos judíos, y algunas de las cosas que hacen Alma, Amulek y otros profetas en el Libro de Mormón son judías.<\/p>\n<p>Ha estado lloviendo bastante aquí con el huracán Fred, pero estamos bastante tierra adentro (lo más que se puede en Florida), así que hemos estado bien. El resto de la semana estuvo bien y nuestra rama quiere ayudarnos con nuestros esfuerzos misionales, así que ojalá pueda crecer. Aquí va una lista de otras cosas que pasaron.<\/p>\n<ul class=\"bul\">\n<li>(fue la semana pasada, pero se me olvidó decirlo) aprendí a resolver el cubo de Rubik<\/li>\n<li>el Élder Nelson se puede echar pedos cuando quiere jaja<\/li>\n<li>Comida rara de las hermanas (son bien fit y nos quieren dar cosas, pero es medio 🤮 no me gusta kale)<\/li>\n<li>nuestro amigo Domingo tiene fecha (para su bautismo) el 29<\/li>\n<li>Domingo pedaleó más de una hora en bici para llegar a la iglesia porque el aventón que le habíamos conseguido se cayó (definitivamente es una leyenda)<\/li>\n<li>Big Dog (un amigo con necesidades especiales) dijo que el Élder Nelson puede ser su padrino de bodas (no es que de verdad se vaya a casar)<\/li>\n<li>Wafles de quesadilla. Nos aburrimos de nuestras quesadillas de forma normal, así que las hicimos en la wafflera para tener formas nuevas<\/li>\n<\/ul>\n<p class=\"sign\">Hasta luego,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>los lentes rojos chistosos del Élder Nelson<\/li>\n<li>el inicio de la colección de fotos de animales muertos (topo, pájaro, víbora y jabalí)<\/li>\n<li>igual que las lagartijas, las ranas están por todos lados (sobre todo aplastadas en la calle, les mando una foto la próxima semana jaja)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-08-16_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_043.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_044.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Shabbat Shalom Hola amigos, Dade City está genial como siempre y esta semana ha estado bastante bien. La semana fue bastante tranquila y normal, así que este correo va a tener muchas cosas random jajaja. La conferencia de zona fue el jueves y estuvo increíble. Escuchamos capacitaciones de nuestro presidente de misión, su esposa, los asistentes (AP) y algunos otros misioneros a quienes se les pidió. Todo estuvo increíble, tengo muchííísimas notas (no es normal en mí, a menos que esté muy metido) y el Espíritu de verdad se aseguró de que tuviera una lista de cómo mejorar. El Élder Nelson y yo tomamos todas las invitaciones para estudiar y mejorar y las pusimos en práctica. Es especialmente importante estos próximos meses hacer eso y ser obedientes por la enorme llegada de misioneros nuevos. A fin de mes deberí extra": "Colombia Mexico Guatemala", "kind": "Carta 10 · Dade City", "title": "Covid - casi", "date": "2021-08-23T06:51:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola Amigos!<\/p>\n<p>Esta semana ha estado bastante interesante y va a estar un poco más largo que de costumbre, pero allá va.<\/p>\n<p>El P-day pasado tuvimos una actividad de distrito: jugamos juegos de mesa y comimos, y estuvo bastante divertido. Pero al día siguiente, durante el consejo de distrito, una de las hermanas se enteró de que quizás había estado expuesta al Covid y, si salía positiva, todos tendríamos que estar en cuarentena. Por suerte salió negativa, pero... el Élder Ricks, uno de los misioneros de inglés con los que vivimos, se sentía medio enfermo, así que tuvimos que hacer cuarentena hasta que le hicieran la prueba al día siguiente. Por suerte también salió negativo, y el martes en la noche no vamos a ningún lado por el horario estelar, los mensajes de Facebook. Aun así no nos gustó la sensación de estar encerrados.<\/p>\n<p>El miércoles fue bastante normal, con la reunión de coordinación misional en la noche. Eso sí, nos dieron unos tamales guatemaltecos de la familia Chapín, a quienes empezamos a enseñar; sin embargo, puede que no estén interesados, porque cuando nos íbamos trataron de devolvernos el Libro de Mormón que les dimos. Ya veremos la próxima vez que pasemos, pero definitivamente no vamos a aceptar el libro de vuelta jajaja.<\/p>\n<p>(Los tamales no estaban muy buenos. Los chapines, o guatemaltecos, le ponen de todo a los tamales, así que había pollo pero todavía con huesos y otras cosas. También encontramos un pelo)<\/p>\n<p>¡El jueves nos levantamos temprano para conocer en persona a nuestro amigo Domingo! Es súper buena onda y tranquilo. Nos enteramos de que ya dejó el café y el té desde que le enseñamos los mandamientos. De hecho, le llevamos chocolate en polvo para tratar de ayudarlo, pero lo dejó de golpe, qué genial! Es de Chiapas, México. Sabe un dialecto de allá y español (también un poco de inglés, pero no mucho), pero trabaja en un restaurante chino jajaja. Su jefe y sus compañeros son chinos y apenas hablan inglés, y él más bien solo lo entiende. Aun así se llevan bien, no odia su trabajo y no trabaja los domingos, así que eso está bien. Su bautismo es este próximo domingo, así que estoy bastante emocionado.<\/p>\n<p>El viernes hicimos servicio en una tienda de segunda mano... Era algo que las hermanas organizaron para que todos fuéramos, pero resulta que la tienda es de otra iglesia y básicamente, sin querer, nos inscribimos como voluntarios fijos. Estuvo bien, pero no pensamos volver porque fue medio pérdida de tiempo y se supone que no debemos hacer cosas así.<\/p>\n<p>El sábado fue el caos de la semana; pasaron muchísimas cosas. En la mañana hicimos servicio para los Thorton y después nos dieron un banquete. La Hermana Thorton tiene un montón de habilidades y pasatiempos random, es súper divertido platicar con ella y cocina increíble. Comimos licuados, jugo, Alfredo de pollo &amp; camarón, hamburguesas, hot dogs, bistec, Chick-fil-A y obleas colombianas con dulce de leche (cajeta hecha de leche). ¡¡Y todo era casero!! ¡Y me lo comí todo! A todos nos dio un dolor de panza tremendo, pero medio valió la pena.<\/p>\n<p>El resto del día nos arreglamos y nos alistamos para Dade City, como casi todas las tardes. Los sábados son una locura porque normalmente pasamos a las casas de todos nuestros amigos para recordarles de la iglesia, pero también teníamos otras lecciones. Andábamos corriendo por todos lados. La lección importante de esa noche fue con una joven llamada Ashleigh. Tiene 23 años y está buscando más amigos. Salió del ejército por una lesión, así que ahora está estudiando. De hecho, ya había oído de la Iglesia, así que fue ella quien nos vio caminando y nos gritó para platicar a principios de la semana. Tuvimos una lección sobre la Restauración con ella y los élderes de inglés, y salió muy bien. ¡Hasta nos preguntó cómo orar, le explicamos y luego se puso a hacerlo ahí mismo! ¡Y fue a la iglesia al día siguiente!<\/p>\n<p>El domingo estuvo bastante bien, excepto cuando nos enteramos de que teníamos que dar discursos ¡en una hora! Corrimos a escribirlos y a prepararnos para la iglesia. Los dos terminamos y salió bastante bien. El presidente Cuevas, de la rama, dijo que sueno como el Élder Richard G. Scott en español (él traducía sus propios discursos al español).<\/p>\n<p>Mi discurso fue sobre enseñar como lo hizo Cristo. Así que mi lista de cosas que hacer es: enseñar con el Espíritu, enseñar con sencillez y enseñar con amor. También sentí que amar, compartir e invitar podían contar como amor, porque compartir e invitar son actos de amor si se hacen bien. Hice referencia a Predicad Mi Evangelio y a Ven, sígueme. Les recomiendo leer los dos por las buenas ideas y las excelentes Escrituras.<\/p>\n<p>Ashleigh fue a la iglesia y algunos miembros se hicieron sus mejores amigos al instante, y hasta se quedó después de la iglesia para el bautismo en el barrio de inglés. Creo que el barrio de inglés va a tener otro en un par de semanas por lo mucho que ella quiere aprender.<\/p>\n<p>Aquí va una lista corta por si no tienen mucho tiempo para leer todo esto:<\/p>\n<ul class=\"bul\">\n<li>2 sustos de Covid<\/li>\n<li>tamales guatemaltecos (muy raros)<\/li>\n<li>¡conocimos a Domingo en persona!<\/li>\n<li>servicio, más o menos<\/li>\n<li>más servicio y un banquete<\/li>\n<li>lección increíble con los élderes de inglés y Ashleigh (sí, así escribieron su nombre sus papás)<\/li>\n<li>los élderes de inglés tuvieron un bautismo<\/li>\n<li>Ashleigh fue a la iglesia<\/li>\n<li>di mi primer discurso en español<\/li>\n<\/ul>\n<p>Se suponía que esta semana íbamos a tener intercambios con nuestro líder de distrito y nuestros líderes de zona, pero con la locura de los cambios de emergencia no se pudo. Los cambios de emergencia son porque algunos misioneros se van a casa un poco antes para alcanzar a entrar a la escuela.<\/p>\n<p>Además, ya llevo 1 mes en Florida y no lo cambiaría por nada.<\/p>\n<p class=\"sign\">Hasta luego Amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>¡¡Fotos!!<\/p>\n<ul class=\"bul\">\n<li>Rana verde<\/li>\n<li>araña de aspecto rarísimo<\/li>\n<li>los tamales<\/li>\n<li>paloma que alguien atrapó<\/li>\n<li>capacitación especializada (atrás, en medio)<\/li>\n<li>conferencia de zona (atrás, en medio)<\/li>\n<li>Atardecer<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>Esta semana tengo otros bichos muertos, pero a algunos no les gusta. Este es su aviso ⚠️<\/p>\n<ul class=\"bul\">\n<li>chapulín grande<\/li>\n<li>gallina<\/li>\n<li>rana<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-08-23_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-23_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-23_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_1_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_1_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_1_2.jpg\" alt=\"\"><\/figure><\/div>", "text": "Covid - casi Hola Amigos! Esta semana ha estado bastante interesante y va a estar un poco más largo que de costumbre, pero allá va. El P-day pasado tuvimos una actividad de distrito: jugamos juegos de mesa y comimos, y estuvo bastante divertido. Pero al día siguiente, durante el consejo de distrito, una de las hermanas se enteró de que quizás había estado expuesta al Covid y, si salía positiva, todos
