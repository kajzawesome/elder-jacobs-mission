=\"bul\">\n<li>¡llovió y hacía un frío tremendo!<\/li>\n<li>limpiando la pila bautismal porque a las hermanas se les olvidó antes de su bautismo<\/li>\n<li>fotos de la investigación<\/li>\n<li>videollamada de caras chistosas<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-03-20_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-20_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "¿¡Un misterio de asesinato?! 🔪🩸☠️ Olá pessoal! Tuvimos una semana bastante buena, llena de lecciones. Vamos lá! Empezamos la semana buscando un montón y visitando amigos. João & Irene terminaron su curso de matrimonio y fijamos la cita para su boda el viernes en la mañana. Estamos súper emocionados, y también los miembros del barrio, sobre todo los que han estado apoyándolos y queriendo crear un grupo en portugués. El presidente Gardner también está muy emocionado. Se van a bautizar el 25 (sábado) a las 6pm, ¡avísenme si quieren el enlace! Tenemos algunos amigos nuevos, pero no han estado cumpliendo los compromisos como leer el Libro de Mormón o venir a la iglesia. Por favor oren para que sientan el Espíritu y entiendan su importancia. Nuestro amigo Daniel siempre nos canta o nos manda canciones. Estoy aprendiendo un montón de cantos religiosos mexicanos. Algo muy padre de esta semana fue encontrar otra familia de miembros parciales. Recibimos una referencia de los otros élderes que estaban tocando puertas. Debora es de España, pero su esposo es de República Dominicana y ha sido miembro toda su vida. No muy activo, pero sabe que las otras iglesias simplemente no son lo mismo. Les enseñamos a los dos y vamos a regresar esta semana. Estoy súper emocionado por lo que viene, y quieren que también le enseñemos a su hija. La vida ha estado bien, así que nada más oren por los amigos como ya les dije. Y por el don de lenguas para nosotros. Sobre el título: el domingo en la mañana nos despertamos y nuestro carro y todo lo de afuera estaba acordonado con cinta de la policía. Había un cadáver y una camioneta random afuera, justo enfrente de nuestra ventana. Vivimos en el segundo piso y pudimos ver toda la investigación. No vimos el cuerpo (estaba cubierto) y llegamos a la iglesia a tiempo, pero estuvo interesante. Esta semana les agrego una grabación de voz del pensamiento espiritual. Moroni 10:32 Los amo! Elder Jacobs Fotos: ¡llovió y hacía un frío tremendo! limpiando la pila bautismal porque a las hermanas se les olvidó antes de su bautismo fotos de la investigación videollamada de caras chistosas"}, {"id": "l92", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["BR", "HT"], "moments": ["Baptism", "Temple"], "extra": "Brazil Haiti", "kind": "Carta 92 · Fort Myers", "title": "El bautismo, el brasileño y el enfermito 🤠🤧", "date": "2023-03-27T06:55:00", "group": "2023-03", "html": "<div class=\"body\"><p>AaiWawA wA Wa WAaaaa...<\/p>\n<p>(Empieza a sonar la música de El bueno, el malo y el feo)<\/p>\n<p>Oi Cara! Tudo bem e aí?<\/p>\n<p>Esta semana sí que fue otra cosa, pero buena.<\/p>\n<p>No pasó mucho el lunes en la noche, pero el martes tuvimos un intercambio de tres con los líderes de zona, así que al Élder Gonzalez y a mí nos pusieron juntos, nada más dos misioneros normales listos para enseñar y hacer payasadas. Practiqué criollo con él para que en la tarde pudiera soltarme a lo loco. Pude hacer una o dos oraciones y testificar. Lo más difícil fue estar sentado sin casi nada que hacer. De alguna forma entendí un montón de lo que la gente decía, pero me quedé ahí como venado frente a los faros sin tener idea de cómo responder. Pero aun así fue divertido, me gusta estar con el Élder Gonzalez. El miércoles y el jueves estuvieron bastante bien, corriendo de lección en lección y buscando con el tiempo extra. El Élder Bedingfield vino conmigo el jueves para otro intercambio.<\/p>\n<p>El viernes empezó súper bien. ¡João &amp; Irene se casaron! Vean las fotos abajo 👇<\/p>\n<p>Luego seguimos con el día más o menos igual, pero me empezó a doler el cuerpo y tenía un dolor de cabeza fuertísimo. Se puso peor más tarde, así que hablamos con la hermana Meese, la secretaria de salud, y pasamos a Walgreens antes de ir a casa. Me agarró un virus que me está afectando la garganta, los oídos, etc., todo lo que está conectado.<\/p>\n<p>El sábado le eché ganas aunque estaba muy enfermo y no me sentía bien, para dar mi discurso y sacar adelante el bautismo. Pero el domingo en la tarde ya estaba mal y fuimos a una clínica de urgencias donde me dieron una medicina más fuerte y más instrucciones. También se aseguraron de que no fuera COVID.<\/p>\n<p>Hoy me siento mejor, pero dijeron que en unos 5 días debería estar normal, justo a tiempo para el viaje al templo el jueves. Esta semana no hay pensamiento espiritual, estoy enfermo. Pero sí los invito a que escriban preguntas para la Conferencia General, y mientras escuchan recibirán respuestas.<\/p>\n<p>Llegó la visa del Élder Kroeger y se va en 2 semanas. Hoy hay un ET (traslado de emergencia) porque vamos a recibir 2 áreas nuevas de la misión de Orlando pero sin misioneros. Vamos a estar en un trío con el Élder Wiberg y ahora también cubriendo Lehigh Acres.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Fotos de la boda de João &amp; Irene @ el juzgado<\/li>\n<li>fotos del bautismo (¡el 1er bautismo brasileño aquí!)<\/li>\n<li>yo enfermo<\/li>\n<li>cambiando una llanta ponchada<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-03-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-27_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "El bautismo, el brasileño y el enfermito 🤠🤧 AaiWawA wA Wa WAaaaa... (Empieza a sonar la música de El bueno, el malo y el feo) Oi Cara! Tudo bem e aí? Esta semana sí que fue otra cosa, pero buena. No pasó mucho el lunes en la noche, pero el martes tuvimos un intercambio de tres con los líderes de zona, así que al Élder Gonzalez y a mí nos pusieron juntos, nada más dos misioneros normales listos para enseñar y hacer payasadas. Practiqué criollo con él para que en la tarde pudiera soltarme a lo loco. Pude hacer una o dos oraciones y testificar. Lo más difícil fue estar sentado sin casi nada que hacer. De alguna forma entendí un montón de lo que la gente decía, pero me quedé ahí como venado frente a los faros sin tener idea de cómo responder. Pero aun así fue divertido, me gusta estar con el Élder Gonzalez. El miércoles y el jueves estuvieron bastante bien, corriendo de lección en lección y buscando con el tiempo extra. El Élder Bedingfield vino conmigo el jueves para otro intercambio. El viernes empezó súper bien. ¡João & Irene se casaron! Vean las fotos abajo 👇 Luego seguimos con el día más o menos igual, pero me empezó a doler el cuerpo y tenía un dolor de cabeza fuertísimo. Se puso peor más tarde, así que hablamos con la hermana Meese, la secretaria de salud, y pasamos a Walgreens antes de ir a casa. Me agarró un virus que me está afectando la garganta, los oídos, etc., todo lo que está conectado. El sábado le eché ganas aunque estaba muy enfermo y no me sentía bien, para dar mi discurso y sacar adelante el bautismo. Pero el domingo en la tarde ya estaba mal y fuimos a una clínica de urgencias donde me dieron una medicina más fuerte y más instrucciones. También se aseguraron de que no fuera COVID. Hoy me siento mejor, pero dijeron que en unos 5 días debería estar normal, justo a tiempo para el viaje al templo el jueves. Esta semana no hay pensamiento espiritual, estoy enfermo. Pero sí los invito a que escriban preguntas para la Conferencia General, y mientras escuchan recibirán respuestas. Llegó la visa del Élder Kroeger y se va en 2 semanas. Hoy hay un ET (traslado de emergencia) porque vamos a recibir 2 áreas nuevas de la misión de Orlando pero sin misioneros. Vamos a estar en un trío con el Élder Wiberg y ahora también cubriendo Lehigh Acres. Los amo! Elder Jacobs Fotos: Fotos de la boda de João & Irene @ el juzgado fotos del bautismo (¡el 1er bautismo brasileño aquí!) yo enfermo cambiando una llanta ponchada"}, {"id": "l93", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ABR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": [], "moments": ["Temple"], "extra": "", "kind": "Carta 93 · Fort Myers", "title": "Una de las semanas más lentas", "date": "2023-04-03T06:51:00", "group": "2023-04", "html": "<div class=\"body\"><p>Oi galera!<\/p>\n<p>¿Qué tal la conferencia? A mí me encantó.<\/p>\n<p>Tristemente no tengo mucho que contar de esta semana.<\/p>\n<p>El lunes nos volvimos trío y hemos estado haciendo puras payasadas y divirtiéndonos un montón.<\/p>\n<p>El jueves fuimos al templo y, como está tan lejos, manejamos a Tampa el miércoles y pasamos la tarde allá. Pude visitar a los Franco, mi familia de conversos recientes. Hablamos de las bendiciones patriarcales y nos dieron unas empanadas buenísimas.<\/p>\n<p>Y obviamente el sábado y el domingo fue la Conferencia General.<\/p>\n<p>Sin duda me alimenté espiritualmente esta semana, pero no poder tocar puertas, enseñar ni ver a nuestros amigos definitivamente fue difícil.<\/p>\n<p>Me encantó la conferencia, y uno de los grandes temas fue que creemos en Cristo y solo necesitamos confiar en Él. La Pascua es la celebración de Su Expiación: el sufrimiento, la muerte y la resurrección de nuestro Salvador, que nos sana y nos capacita para ser mejores. La gracia es lo que cubre la distancia entre nuestras faltas y esfuerzos y los requisitos de Dios y Su reino. Por favor recuerden que Él está ahí, que Él puede sanarlos y que Él puede arreglar las cosas.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>templo<\/li>\n<li>conferencia con el distrito<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-04-03_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-03_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-03_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-03_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Una de las semanas más lentas Oi galera! ¿Qué tal la conferencia? A mí me encantó. Tristemente no tengo mucho que contar de esta semana. El lunes nos volvimos trío y hemos estado haciendo puras payasadas y divirtiéndonos un montón. El jueves fuimos al templo y, como está tan lejos, manejamos a Tampa el miércoles y pasamos la tarde allá. Pude visitar a los Franco, mi familia de conversos recientes. Hablamos de las bendiciones patriarcales y nos dieron unas empanadas buenísimas. Y obviamente el sábado y el domingo fue la Conferencia General. Sin duda me alimenté espiritualmente esta semana, pero no poder tocar puertas, enseñar ni ver a nuestros amigos definitivamente fue difícil. Me encantó la conferencia, y uno de los grandes temas fue que creemos en Cristo y solo necesitamos confiar en Él. La Pascua es la celebración de Su Expiación: el sufrimiento, la muerte y la resurrección de nuestro Salvador, que nos sana y nos capacita para ser mejores. La gracia es lo que cubre la distancia entre nuestras faltas y esfuerzos y los requisitos de Dios y Su reino. Por favor recuerden que Él está ahí, que Él puede sanarlos y que Él puede arreglar las cosas. Los amo! Élder Jacobo Fotos: templo conferencia con el distrito"}, {"id": "l94", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ABR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["BR"], "moments": ["Temple"], "extra": "Brazil", "kind": "Carta 94 · Fort Myers", "title": "🥚 Páscoa 🐰", "date": "2023-04-10T06:46:00", "group": "2023-04", "html": "<div class=\"body\"><p>Que onda pandilla?<\/p>\n<p>Esta semana estuvo bien, todavía no muy rápida ni súper emocionante, pero tuvimos algunas buenas lecciones y pasaron otras cosas. Los primeros días no pasó mucho. Teníamos algunas lecciones programadas; como la mitad se cancelaron, pero las otras sí se dieron. Luego pasamos tiempo visitando a otros amigos y personas para ver si les interesaba reunirse y cuándo les quedaba mejor.<\/p>\n<p>El miércoles tuvimos un montón de lecciones porque pasamos mucho tiempo tocando puertas. Ojalá estos nuevos amigos lean y progresen. Oren para que encontremos más familias a quienes enseñar. Varios nos dijeron que ya no pasáramos. Pasamos un día en Lehigh porque ahorita estamos cubriendo dos áreas.<\/p>\n<p>Di una lección completa en portugués yo solo, porque el señor nada más quería demostrar su punto de que él es su propio profeta (#LaRevelaciónModernaEstáBrutal&amp;SúperImportante)<\/p>\n<p>El sábado nos vimos a medio camino en Sarasota con los AP para dejar al Élder Kroeger. #FlyHighSweetChildofMine Brasil se lleva a uno de los mejores 🇧🇷<\/p>\n<p>El domingo de Pascua estuvo increíble. Tuve la oportunidad de confirmar a João en la reunión sacramental (estaba súper nervioso de hacerlo en portugués, pero Dios definitivamente me ha estado preparando y aumentando mis capacidades). Y el enfoque en Cristo estuvo increíble; después pude ayudar a algunos amigos a entender eso y Su Expiación.<\/p>\n<p>Entender Su gracia y Su Expiación es probablemente una de las cosas más grandes que he aprendido y que me bendecirá para siempre. Su gracia es la fortaleza y el poder para vencer nuestras debilidades, y Su Expiación es el sacrificio infinito que nos da la gracia, que nos libera de la muerte y puede liberarnos del pecado si nos arrepentimos. El arrepentimiento es un verdadero cambio de corazón, cambiar nuestros deseos por los de Dios, y es un proceso continuo, igual que la restauración del Evangelio de Jesucristo. Por favor tómense un tiempo para meditar en su testimonio de estas cosas, lean el tema del Evangelio sobre esto o incluso compartan su testimonio con alguien más.<\/p>\n<p class=\"sign\">Los amo muchísimo! Feliz páscoa!<\/p>\n<p>Élder Jacó<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Cena con los Cole<\/li>\n<li>Despidiéndonos del Élder Kroeger<\/li>\n<li>Gecko en el bolsillo<\/li>\n<li>Unas fotos padres en Lehigh<\/li>\n<li>Nuestra zona &amp; St. Pete en el templo<\/li>\n<li>Minigolf<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-04-10_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_8.jpg\" alt=\"\"><\/figure><\/div>", "text": "🥚 Páscoa 🐰 Que onda pandilla? Esta semana estuvo bien, todavía no muy rápida ni súper emocionante, pero tuvimos algunas buenas lecciones y pasaron otras cosas. Los primeros días no pasó mucho. Teníamos algunas lecciones programadas; como la mitad se cancelaron, pero las otras sí se dieron. Luego pasamos tiempo visitando a otros amigos y personas para ver si les interesaba reunirse y cuándo les quedaba mejor. El miércoles tuvimos un montón de lecciones porque pasamos mucho tiempo tocando puertas. Ojalá estos nuevos amigos lean y progresen. Oren para que encontremos más familias a quienes enseñar. Varios nos dijeron que ya no pasáramos. Pasamos un día en Lehigh porque ahorita estamos cubriendo dos áreas. Di una lección completa en portugués yo solo, porque el señor nada más quería demostrar su punto de que él es su propio profeta (#LaRevelaciónModernaEstáBrutal&SúperImportante) El sábado nos vimos a medio camino en Sarasota con los AP para dejar al Élder Kroeger. #FlyHighSweetChildofMine Brasil se lleva a uno de los mejores 🇧🇷 El domingo de Pascua estuvo increíble. Tuve la oportunidad de confirmar a João en la reunión sacramental (estaba súper nervioso de hacerlo en portugués, pero Dios definitivamente me ha estado preparando y aumentando mis capacidades). Y el enfoque en Cristo estuvo increíble; después pude ayudar a algunos amigos a entender eso y Su Expiación. Entender Su gracia y Su Expiación es probablemente una de las cosas más grandes que he aprendido y que me bendecirá para siempre. Su gracia es la fortaleza y el poder para vencer nuestras debilidades, y Su Expiación es el sacrificio infinito que nos da la gracia, que nos libera de la muerte y puede liberarnos del pecado si nos arrepentimos. El arrepentimiento es un verdadero cambio de corazón, cambiar nuestros deseos por los de Dios, y es un proceso continuo, igual que la restauración del Evangelio de Jesucristo. Por favor tómense un tiempo para meditar en su testimonio de estas cosas, lean el tema del Evangelio sobre esto o incluso compartan su testimonio con alguien más. Los amo muchísimo! Feliz páscoa! Élder Jacó Fotos: Cena con los Cole Despidiéndonos del Élder Kroeger Gecko en el bolsillo Unas fotos padres en Lehigh Nuestra zona & St. Pete en el templo Minigolf"}, {"id": "l95", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ABR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["MX", "BR"], "moments": ["Baptism", "Temple"], "extra": "Mexico Brazil", "kind": "Carta 95 · Fort Myers", "title": "No soy María pero tengo Jesus adentro", "date": "2023-04-17T08:10:00", "group": "2023-04", "html": "<div class=\"body\"><p>Hola hola, tamo' bien y espero que e' lo mismo pa' ustede<\/p>\n<p>Hemos estado escuchando un montón de reguetón cristiano, por eso el título chistoso y en español.<\/p>\n<p>Dice: No soy María, pero tengo a Cristo adentro<\/p>\n<p>Bueno, esta semana básicamente tiene dos partes, antes del jueves y después del jueves, porque tuvimos cambios. Yo me quedé y recibí al Élder Franson, otro de mis antiguos entrenados, y está súper padre estar juntos otra vez. Pero esta vez le estoy enseñando portugués para que se pueda quedar a cargo del área al final de estas 6 semanas.<\/p>\n<p>Tuvimos algunas lecciones esta semana, pero buena parte de la semana fue buscar. Nada muy loco últimamente, pero sí tenemos algunos amigos que se ven bastante bien; a los demás probablemente vamos a dejar de enseñarles por ahora. El sábado a la hora del almuerzo fuimos al mercado mexicano y estuvo buenísimo. Compré unos recuerditos de países, probablemente regrese por otros. ¡El Élder Franson consiguió una ganga con una camiseta de fútbol de Colombia, $5! Vean las fotos abajo<\/p>\n<p>El domingo dimos discursos sobre la obra misional y fue chistoso porque ni nosotros ni el obispado pensábamos que podíamos hablar tanto tiempo, así que pusieron a las hermanas a dar su testimonio, pero hablamos un montón y salió bien, así que al final al miembro del sumo consejo le recortaron mucho de su tiempo... Ni modo<\/p>\n<p>Una última cosa antes de mi pensamiento espiritual de esta semana: necesito que todos ustedes por favor oren por Irene (la que se acaba de bautizar). Es increíble y ya está tratando de obtener su recomendación para ir al templo, pero recibió una noticia difícil. Tiene un daño bastante grave en la retina y el diagnóstico dice que podría quedarse ciega muy pronto. Está buscando ir con un especialista para recibir más consejo y saber qué hacer, pero es muy difícil para ella. Ayer le dimos una bendición y tiene muy buenos amigos en el barrio, pero sus oraciones por ella significarían todo para mí. El pensamiento de esta semana es Romanos 5:8; interprétenlo como quieran (un señor esta semana lo hizo de una forma muy libre), pero de verdad me encanta este pasaje. Sé que Dios vive y nos ama a pesar de nuestros errores. ¡Confíen en Él!<\/p>\n<p>Romanos 5:8<\/p>\n<p>Pero Dios demuestra su amor para con nosotros en que, siendo aún pecadores, Cristo murió por nosotros.<\/p>\n<p class=\"sign\">Los amo muchísimo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>nosotros con nuestras camisetas<\/li>\n<li>una calcomanía que compré<\/li>\n<li>unas cosas random que vimos en el mercado<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-04-17_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-17_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-17_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-17_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-17_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "No soy María pero tengo Jesus adentro Hola hola, tamo' bien y espero que e' lo mismo pa' ustede Hemos estado escuchando un montón de reguetón cristiano, por eso el título chistoso y en español. Dice: No soy María, pero tengo a Cristo adentro Bueno, esta semana básicamente tiene dos partes, antes del jueves y después del jueves, porque tuvimos cambios. Yo me quedé y recibí al Élder Franson, otro de mis antiguos entrenados, y está súper padre estar juntos otra vez. Pero esta vez le estoy enseñando portugués para que se pueda quedar a cargo del área al final de estas 6 semanas. Tuvimos algunas lecciones esta semana, pero buena parte de la semana fue buscar. Nada muy loco últimamente, pero sí tenemos algunos amigos que se ven bastante bien; a los demás probablemente vamos a dejar de enseñarles por ahora. El sábado a la hora del almuerzo fuimos al mercado mexicano y estuvo buenísimo. Compré unos recuerditos de países, probablemente regrese por otros. ¡El Élder Franson consiguió una ganga con una camiseta de fútbol de Colombia, $5! Vean las fotos abajo El domingo dimos discursos sobre la obra misional y fue chistoso porque ni nosotros ni el obispado pensábamos que podíamos hablar tanto tiempo, así que pusieron a las hermanas a dar su testimonio, pero hablamos un montón y salió bien, así que al final al miembro del sumo consejo le recortaron mucho de su tiempo... Ni modo Una última cosa antes de mi pensamiento espiritual de esta semana: necesito que todos ustedes por favor oren por Irene (la que se acaba de bautizar). Es increíble y ya está tratando de obtener su recomendación para ir al templo, pero recibió una noticia difícil. Tiene un daño bastante grave en la retina y el diagnóstico dice que podría quedarse ciega muy pronto. Está buscando ir con un especialista para recibir más consejo y saber qué hacer, pero es muy difícil para ella. Ayer le dimos una bendición y tiene muy buenos amigos en el barrio, pero sus oraciones por ella significarían todo para mí. El pensamiento de esta semana es Romanos 5:8; interprétenlo como quieran (un señor esta semana lo hizo de una forma muy libre), pero de verdad me encanta este pasaje. Sé que Dios vive y nos ama a pesar de nuestros errores. ¡Confíen en Él! Romanos 5:8 Pero Dios demuestra su amor para con nosotros en que, siendo aún pecadores, Cristo murió por nosotros. Los amo muchísimo! Elder Jacobs Fotos: nosotros con nuestras camisetas una calcomanía que compré unas cosas random que vimos en el mercado"}, {"id": "l96", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ABR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CU\">🇨🇺 Cuba<\/span><span class=\"stamp c\" data-c=\"NI\">🇳🇮 Nicaragua<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["CU", "NI", "BR", "HT"], "moments": ["Baptism"], "extra": "Cuba Nicaragua Brazil Haiti", "kind": "Carta 96 · Fort Myers", "title": "🐂 boi 😎", "date": "2023-04-24T05:44:00", "group": "2023-04", "html": "<div class=\"body\"><p>Oi galera, bom dia!<\/p>\n<p>Espero que hayan tenido una semana maravillosa y que estén bien.<\/p>\n<p>Aquí estamos súper bien y tuvimos una semana bastante exitosa. La gran L que nos llevamos fue que ningún amigo vino a la iglesia después de invitar a un montón de gente. Todo lo demás estuvo bien.<\/p>\n<p>El lunes empezamos buscando y encontramos 2 familias brasileñas más. Además de algunos hispanos y unos cuantos haitianos para pasarlos como referencias.<\/p>\n<p>El martes también fue de buscar, porque se cancelaron nuestras lecciones, pero lo bueno es que le enseñamos a Evandro. Él también es de Brasil y vino a la clase de inglés, pero está muy interesado en crecer en su vida espiritual y acercarse más a Dios. Estaba emocionado por tener su propio Libro de Mormón y por venir a la iglesia, pero salió de la ciudad, así que ojalá esta semana. También pasamos otra vez al BrazMarket y me compré un Chifre de Boi 🐂, o sea un cuerno de buey. Se usa para una bebida tradicional de Brasil: el Tererê<\/p>\n<p>Tuvimos una lección con Marliet; está buscando una iglesia y eso, pero otra iglesia empezó a visitarla. Esperamos que quiera reunirse otra vez y que podamos pasar en persona para darle un Libro de Mormón. Es de Cuba y tiene una fe como nadie.<\/p>\n<p>Esta semana también visitamos a Jose. Es un miembro que está regresando a la Iglesia y le está yendo súper bien. De hecho participó en la ordenación de João al Sacerdocio Aarónico. En nuestra visita tuvimos la oportunidad de hablar con sus compañeros de cuarto y darnos cuenta de todo lo que todavía no sabemos. Son de 3 estados diferentes de Brasil y cada uno dice las cosas diferente y tiene sus propias palabras. Fue un reto divertido. El viernes fui a Lehigh de intercambio con los líderes de zona. Estuvo divertido con el Élder Sellers, pero con todo el día lleno de lecciones planeadas y que luego ninguna se diera, fue difícil, por decir lo menos.<\/p>\n<p>Conocimos a un señor nuevo y a su hijo, son de Nicaragua. Tuvimos una primera lección muy padre y luego entendimos por qué hacía tantas preguntas. Además de un deseo sincero de aprender, quiere bautizarse. Vamos a hablar más de eso en la próxima visita. E aí gente, eso es básicamente todo.<\/p>\n<p>Me encantaría saber de ustedes y de sus vidas. Aunque ya regreso a casa más o menos pronto (27 de mayo), me encantaría platicar ahora. El pensamiento de hoy viene de la Conferencia General:<\/p>\n<p>El presidente Russell M. Nelson ha declarado: “El Buen Pastor cuida con amor a todas las ovejas de Su redil, y nosotros somos Sus verdaderos pastores auxiliares. Nuestro privilegio es llevar Su amor y añadir nuestro propio amor a amigos y vecinos﻿—alimentándolos, cuidándolos y nutriéndolos﻿—como el Salvador desea que lo hagamos”.<\/p>\n<ul class=\"bul\">\n<li>Élder Uceda, \"El Señor Jesucristo nos enseña a ministrar\"<\/li>\n<\/ul>\n<p>Si amamos a nuestros amigos, estamos dispuestos a hacer casi cualquier cosa por ellos. Dejamos nuestros asuntos personales para ir y ser \"salvadores\" para ellos y sus aflicciones. No se olviden de nuestros amigos y sus necesidades, ni del ejemplo que Cristo nos dio. Ministrar puede ser en persona o de forma digital, seguido o de vez en cuando, en visitas cortas o largas. Pero de la forma que lo hagamos, siguiendo al Espíritu, es muy importante.<\/p>\n<p class=\"sign\">Los amo muchísimo!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Nosotros con Mozart (¡le gusta tocar el piano!)<\/li>\n<li>Chifre de Boi 🐂 vaso de cuerno de buey<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-04-24_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-24_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-24_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-24_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "🐂 boi 😎 Oi galera, bom dia! Espero que hayan tenido una semana maravillosa y que estén bien. Aquí estamos súper bien y tuvimos una semana bastante exitosa. La gran L que nos llevamos fue que ningún amigo vino a la iglesia después de invitar a un montón de gente. Todo lo demás estuvo bien. El lunes empezamos buscando y encontramos 2 familias brasileñas más. Además de algunos hispanos y unos cuantos haitianos para pasarlos como referencias. El martes también fue de buscar, porque se cancelaron nuestras lecciones, pero lo bueno es que le enseñamos a Evandro. Él también es de Brasil y vino a la clase de inglés, pero está muy interesado en crecer en su vida espiritual y acercarse más a Dios. Estaba emocionado por tener su propio Libro de Mormón y por venir a la iglesia, pero salió de la ciudad, así que ojalá esta semana. También pasamos otra vez al BrazMarket y me compré un Chifre de Boi 🐂, o sea un cuerno de buey. Se usa para una bebida tradicional de Brasil: el Tererê Tuvimos una lección con Marliet; está buscando una iglesia y eso, pero otra iglesia empezó a visitarla. Esperamos que quiera reunirse otra vez y que podamos pasar en persona para darle un Libro de Mormón. Es de Cuba y tiene una fe como nadie. Esta semana también visitamos a Jose. Es un miembro que está regresando a la Iglesia y le está yendo súper bien. De hecho participó en la ordenación de João al Sacerdocio Aarónico. En nuestra visita tuvimos la oportunidad de hablar con sus compañeros de cuarto y darnos cuenta de todo lo que todavía no sabemos. Son de 3 estados diferentes de Brasil y cada uno dice las cosas diferente y tiene sus propias palabras. Fue un reto divertido. El viernes fui a Lehigh de intercambio con los líderes de zona. Estuvo divertido con el Élder Sellers, pero con todo el día lleno de lecciones planeadas y que luego ninguna se diera, fue difícil, por decir lo menos. Conocimos a un señor nuevo y a su hijo, son de Nicaragua. Tuvimos una primera lección muy padre y luego entendimos por qué hacía tantas preguntas. Además de un deseo sincero de aprender, quiere bautizarse. Vamos a hablar más de eso en la próxima visita. E aí gente, eso es básicamente todo. Me encantaría saber de ustedes y de sus vidas. Aunque ya regreso a casa más o menos pronto (27 de mayo), me encantaría platicar ahora. El pensamiento de hoy viene de la Conferencia General: El presidente Russell M. Nelson ha declarado: “El Buen Pastor cuida con amor a todas las ovejas de Su redil, y nosotros somos Sus verdaderos pastores auxiliares. Nuestro privilegio es llevar Su amor y añadir nuestro propio amor a amigos y vecinos﻿—alimentándolos, cuidándolos y nutriéndolos﻿—como el Salvador desea que lo hagamos”. Élder Uceda, \"El Señor Jesucristo nos enseña a ministrar\" Si amamos a nuestros amigos, estamos dispuestos a hacer casi cualquier cosa por ellos. Dejamos nuestros asuntos personales para ir y ser \"salvadores\" para ellos y sus aflicciones. No se olviden de nuestros amigos y sus necesidades, ni del ejemplo que Cristo nos dio. Ministrar puede ser en persona o de forma digital, seguido o de vez en cuando, en visitas cortas o largas. Pero de la forma que lo hagamos, siguiendo al Espíritu, es muy importante. Los amo muchísimo! Élder Jacobo Fotos: Nosotros con Mozart (¡le gusta tocar el piano!) Chifre de Boi 🐂 vaso de cuerno de buey"}, {"id": "l97", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAY 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["HT"], "moments": ["Baptism"], "extra": "Haiti", "kind": "Carta 97 · Fort Myers", "title": "MPL grind 🐂", "date": "2023-05-01T11:03:00", "group": "2023-05", "html": "<div class=\"body\"><p>Alo galera!<\/p>\n<p>Foi uma semana maravilhosa!<\/p>\n<p>Hicimos un reto de MPL (lecciones con participación de miembros) y por suerte no perdimos, así que nos tocó preparar la comida asquerosa del castigo de los perdedores y no comérnosla.<\/p>\n<p>(Hamburguesas de atún + otras especias y cosas horribles)<\/p>\n<p>Tuvimos muchas lecciones increíbles con nuestros amigos esta semana, en parte porque los miembros vinieron con nosotros y el Espíritu fue muy fuerte. En una lección nos estaba costando ayudar a un amigo a entender la importancia del bautismo y del don del Espíritu Santo, pero de repente me llegó un recuerdo y una idea.<\/p>\n<p>Recuerdo lo especial que fue mi bautismo, los dones especiales que recibí y algunas de las cosas que me enseñaron. Una fue sobre una cobija/toalla y el Espíritu.<\/p>\n<p>Entonces pude ayudar a nuestro amigo Jesus (10 años) a tener una plática parecida y luego la experiencia de envolverlo con el Espíritu, o sea la cobija. Estuvo increíble.<\/p>\n<p>¡No dejes al Espíritu en la banca!<\/p>\n<p>También tuvimos muy buenas visitas con miembros que nos ayudaron a conectar mejor con ellos, al grado de que ahora quieren que vayamos todavía más jaja. No tenemos suficiente tiempo para eso y todas nuestras otras responsabilidades misionales, pero es un cambio muy bueno. Hicimos un intercambio con los élderes de criollo. Yo estuve con el Élder Randolph tratando de hablar criollo. Pude hacer algunas cosas, pero es muy difícil escuchar y entender lo suficiente, por eso me impresionó mucho, porque solo lleva 7 meses en la misión. Muy buen tiempo juntos.<\/p>\n<p>Tristemente no fijamos ninguna fecha bautismal esta semana, pero deberíamos hacerlo la próxima. Sabemos que está en su futuro muy pronto, pero sentimos la inspiración de esperar. ¡Así que ustedes también tienen que esperar hasta la próxima semana!<\/p>\n<p>Esa fue más o menos nuestra semana. Hemos estado dando más lecciones por teléfono para hablar con más gente, así que ojalá podamos hacer crecer nuestro grupo de enseñanza, o sea el número de amigos/personas a quienes enseñamos.<\/p>\n<p>He estado volviendo a escuchar la conferencia y esta semana me encantó escuchar al Élder Meurs hablar de cómo Cristo nos sana. Nunca estamos demasiado lejos de la Expiación y de Su amor. ¡Vayan a leerlo!<\/p>\n<p>El viernes en la noche nos enteramos de que el Élder Anderson viene este viernes y vamos a tener una reunión con él con toda la misión. ¡Estoy súper emocionado!<\/p>\n<p class=\"sign\">Los amo! Vejo-te mais tarde!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>hamburguesas malditas<\/li>\n<li>perrito<\/li>\n<li>limusina<\/li>\n<li>mi malteada estaba súper espesa como helado 🍨<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-05-01_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-01_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-01_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-01_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-01_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "MPL grind 🐂 Alo galera! Foi uma semana maravilhosa! Hicimos un reto de MPL (lecciones con participación de miembros) y por suerte no perdimos, así que nos tocó preparar la comida asquerosa del castigo de los perdedores y no comérnosla. (Hamburguesas de atún + otras especias y cosas horribles) Tuvimos muchas lecciones increíbles con nuestros amigos esta semana, en parte porque los miembros vinieron con nosotros y el Espíritu fue muy fuerte. En una lección nos estaba costando ayudar a un amigo a entender la importancia del bautismo y del don del Espíritu Santo, pero de repente me llegó un recuerdo y una idea. Recuerdo lo especial que fue mi bautismo, los dones especiales que recibí y algunas de las cosas que me enseñaron. Una fue sobre una cobija/toalla y el Espíritu. Entonces pude ayudar a nuestro amigo Jesus (10 años) a tener una plática parecida y luego la experiencia de envolverlo con el Espíritu, o sea la cobija. Estuvo increíble. ¡No dejes al Espíritu en la banca! También tuvimos muy buenas visitas con miembros que nos ayudaron a conectar mejor con ellos, al grado de que ahora quieren que vayamos todavía más jaja. No tenemos suficiente tiempo para eso y todas nuestras otras responsabilidades misionales, pero es un cambio muy bueno. Hicimos un intercambio con los élderes de criollo. Yo estuve con el Élder Randolph tratando de hablar criollo. Pude hacer algunas cosas, pero es muy difícil escuchar y entender lo suficiente, por eso me impresionó mucho, porque solo lleva 7 meses en la misión. Muy buen tiempo juntos. Tristemente no fijamos ninguna fecha bautismal esta semana, pero deberíamos hacerlo la próxima. Sabemos que está en su futuro muy pronto, pero sentimos la inspiración de esperar. ¡Así que ustedes también tienen que esperar hasta la próxima semana! Esa fue más o menos nuestra semana. Hemos estado dando más lecciones por teléfono para hablar con más gente, así que ojalá podamos hacer crecer nuestro grupo de enseñanza, o sea el número de amigos/personas a quienes enseñamos. He estado volviendo a escuchar la conferencia y esta semana me encantó escuchar al Élder Meurs hablar de cómo Cristo nos sana. Nunca estamos demasiado lejos de la Expiación y de Su amor. ¡Vayan a leerlo! El viernes en la noche nos enteramos de que el Élder Anderson viene este viernes y vamos a tener una reunión con él con toda la misión. ¡Estoy súper emocionado! Los amo! Vejo-te mais tarde! Élder Jacobo Fotos: hamburguesas malditas perrito limusina mi malteada estaba súper espesa como helado 🍨"}, {"id": "l98", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAY 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"NI\">🇳🇮 Nicaragua<\/span><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><\/div>", "cultures": ["MX", "NI", "PE"], "moments": [], "extra": "Mexico Nicaragua Peru", "kind": "Carta 98 · Fort Myers", "title": "Escuchando a un Apóstol del Señor", "date": "2023-05-08T06:41:00", "group": "2023-05", "html": "<div class=\"body\"><p>Oi galerinha!<\/p>\n<p>Oye familia!<\/p>\n<p>Espero que hayan tenido una buena semana, con muchas cosas logradas o simplemente la semana normal de trabajo.<\/p>\n<p>Nuestra semana estuvo bastante bien; definitivamente fue más lenta porque pasamos ratos largos adentro o haciendo otras cosas. Tenemos un montón de amigos potenciales, o sea puntitos amarillos, o sea personas a las que tal vez enseñemos si de verdad quieren y tienen tiempo. Por eso pasamos mucho tiempo adentro llamando y mandando mensajes a estas personas.<\/p>\n<p>También tuve unas citas con el doctor y luego el viernes fuimos a Tampa a escuchar al Élder Anderson hablarle a nuestra misión. Estuvo súper increíble, pero sí significó que no hicimos nada en nuestra área por las 3 horas de manejar de ida y luego otra vez de regreso. Tuvimos un recorrido por la capilla buenísimo con nuestro nuevo amigo Paulo. Es de Perú y se siente bastante triste porque tiene 2 hijos y acaba de ser el 3er cumpleaños de su hija. Oren por él.<\/p>\n<p>Tuvimos otra lección increíble con Debora &amp; Darwin. Han progresado mucho con la lectura y Darwin se ha estado acordando de los mandamientos y poniéndolos en práctica de inmediato. También vino el Hermano Mata, estuvo buenísimo. Bastantes lecciones por teléfono; ojalá podamos vernos en persona.<\/p>\n<p>Shaify es de Nicaragua y quiere venir a la iglesia. Nada más estamos viendo cómo hacerle, porque vive en Lehigh (nuestra iglesia está en Fort Myers).<\/p>\n<p>También les volvimos a enseñar a Elias &amp; Nascer el sábado. Van bien, pero estamos tratando de que se enfoquen en la doctrina básica, porque a veces hacen preguntas muy profundas y que no tienen nada que ver con nuestra lección.<\/p>\n<p>Nuestro converso reciente Alejandro nos hizo de cenar una noche y fue muy bonito comer y platicar con él. Nos divertimos hablando de videojuegos, música e historias chistosas.<\/p>\n<p>Una última cosa antes de hablar más del Élder Anderson y de mi pensamiento espiritual.<\/p>\n<p>Bendiciones<\/p>\n<p>Estas últimas 2 semanas hemos tenido la oportunidad de dar muchas bendiciones de salud. Una ayer, una el jueves, una hace 2 semanas el lunes. Y con más posibilidades esta semana.<\/p>\n<p>Estoy muy agradecido por la oportunidad de servir de esta manera, de ver a las personas cambiar y sentir el Espíritu, pero también de tener este poder disponible. No se olviden de que lo está.<\/p>\n<p>Este jueves fuimos con unas personas que no son miembros, cuya familia (miembros en México) nos llamó y nos pidió que fuéramos. Fue muy especial verlos tener un rayito de esperanza más grande y luego sentir al Espíritu testificar de ese poder. También sentí la impresión de darle a la esposa una bendición de consuelo. Qué experiencia tan hermosa.<\/p>\n<p>El Élder Anderson habló de varias cosas, igual que su esposa y algunos presidentes de estaca que estaban ahí; pero lo más importante que me llevé, y que ustedes también pueden aplicar, es el poder de las Escrituras.<\/p>\n<p>Hablaron mucho del poder que hay en las Escrituras, y no solo de leerlas sino de conocerlas. De tener versículos escritos en el corazón, algunos solo sabiendo dónde están y la idea general, y otros de memoria. Así, en la tempestad de la vida no tenemos que andar buscando desesperados un pasaje: ya lo sabemos, es parte de nuestro ser, y ya estamos edificados sobre nuestra roca, Jesucristo.<\/p>\n<p>Busquen un pasaje favorito y empiecen a memorizar dónde está y, si pueden, las palabras.<\/p>\n<p class=\"sign\">Los amo mucho! Que tenham uma super boa semana!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>empanadas<\/li>\n<li>viaje a Tampa/parada en el camino<\/li>\n<li>placa mal hecha<\/li>\n<li>por fin pude ver a los Nelson de mi barrio de casa mientras estaba en Tampa<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-05-08_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-08_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "Escuchando a un Apóstol del Señor Oi galerinha! Oye familia! Espero que hayan tenido una buena semana, con muchas cosas logradas o simplemente la semana normal de trabajo. Nuestra semana estuvo bastante bien; definitivamente fue más lenta porque pasamos ratos largos adentro o haciendo otras cosas. Tenemos un montón de amigos potenciales, o sea puntitos amarillos, o sea personas a las que tal vez enseñemos si de verdad quieren y tienen tiempo. Por eso pasamos mucho tiempo adentro llamando y mandando mensajes a estas personas. También tuve unas citas con el doctor y luego el viernes fuimos a Tampa a escuchar al Élder Anderson hablarle a nuestra misión. Estuvo súper increíble, pero sí significó que no hicimos nada en nuestra área por las 3 horas de manejar de ida y luego otra vez de regreso. Tuvimos un recorrido por la capilla buenísimo con nuestro nuevo amigo Paulo. Es de Perú y se siente bastante triste porque tiene 2 hijos y acaba de ser el 3er cumpleaños de su hija. Oren por él. Tuvimos otra lección increíble con Debora & Darwin. Han progresado mucho con la lectura y Darwin se ha estado acordando de los mandamientos y poniéndolos en práctica de inmediato. También vino el Hermano Mata, estuvo buenísimo. Bastantes lecciones por teléfono; ojalá podamos vernos en persona. Shaify es de Nicaragua y quiere venir a la iglesia. Nada más estamos viendo cómo hacerle, porque vive en Lehigh (nuestra iglesia está en Fort Myers). También les volvimos a enseñar a Elias & Nascer el sábado. Van bien, pero estamos tratando de que se enfoquen en la doctrina básica, porque a veces hacen preguntas muy profundas y que no tienen nada que ver con nuestra lección. Nuestro converso reciente Alejandro nos hizo de cenar una noche y fue muy bonito comer y platicar con él. Nos divertimos hablando de videojuegos, música e historias chistosas. Una última cosa antes de hablar más del Élder Anderson y de mi pensamiento espiritual. Bendiciones Estas últimas 2 semanas hemos tenido la oportunidad de dar muchas bendiciones de salud. Una ayer, una el jueves, una hace 2 semanas el lunes. Y con más posibilidades esta semana. Estoy muy agradecido por la oportunidad de servir de esta manera, de ver a las personas cambiar y sentir el Espíritu, pero también de tener este poder disponible. No se olviden de que lo está. Este jueves fuimos con unas personas que no son miembros, cuya familia (miembros en México) nos llamó y nos pidió que fuéramos. Fue muy especial verlos tener un rayito de esperanza más grande y luego sentir al Espíritu testificar de ese poder. También sentí la impresión de darle a la esposa una bendición de consuelo. Qué experiencia tan hermosa. El Élder Anderson habló de varias cosas, igual que su esposa y algunos presidentes de estaca que estaban ahí; pero lo más importante que me llevé, y que ustedes también pueden aplicar, es el poder de las Escrituras. Hablaron mucho del poder que hay en las Escrituras, y no solo de leerlas sino de conocerlas. De tener versículos escritos en el corazón, algunos solo sabiendo dónde están y la idea general, y otros de memoria. Así, en la tempestad de la vida no tenemos que andar buscando desesperados un pasaje: ya lo sabemos, es parte de nuestro ser, y ya estamos edificados sobre nuestra roca, Jesucristo. Busquen un pasaje favorito y empiecen a memorizar dónde está y, si pueden, las palabras. Los amo mucho! Que tenham uma super boa semana! Elder Jacobs Fotos: empanadas viaje a Tampa/parada en el camino placa mal hecha por fin pude ver a los Nelson de mi barrio de casa mientras estaba en Tampa"}, {"id": "l99", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAY 2023<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 99 · Fort Myers", "title": "¿¡Un solo 👨‍🎤 de armónica?! 🎶", "date": "2023-05-15T05:32:00", "group": "2023-05", "html": "<div class=\"body\"><p>Que onda chimichangas?<\/p>\n<p>¿Qué tal la semana? Ojalá todos hayan disfrutado algo bueno, y a todas las mamás, un maravilloso Día de las Madres. El barrio compró rosas, así que el Élder Franson y yo pudimos repartirlas el domingo en la mañana y ver a todos sonreír 😁 fue maravilloso.<\/p>\n<p>Pudimos enseñarle otra vez a Paulo y es bastante buena onda. Sigue súper ocupado y atorado con su trabajo, que no le permite venir a la iglesia, pero está muy abierto a aprender y le emocionó recibir su propio Libro de Mormón.<\/p>\n<p>Hicimos galletas 🍪 para nuestra lista. Hicimos una lista de personas (miembros y amigos) para pasar a darles galletas y asegurarnos de que sepan que los queremos. También para ver cómo están. Eso estuvo divertido, pero todavía nos faltan algunas familias, así que esta semana va la ronda 2.<\/p>\n<p>Conocimos a un perrote llamado Stitch. Súper divertido.<\/p>\n<p>Cortamos el pasto con un miembro para una hermana menos activa, ¡y luego ella vino a la fiesta del Día de las Madres y a la iglesia! Muchas lecciones por teléfono programadas, pero pocas contestaron.<\/p>\n<p>El jueves tuvimos noche de fútbol ⚽ y, aunque no vino tanta gente como esperábamos, igual la disfrutamos mucho y pudimos ver caras nuevas.<\/p>\n<p>El viernes fue la conferencia de zona junto con mi entrevista final. Fue una gran experiencia. También hicimos un coro solo de hombres con \"El ejército de Helamán\". La entrevista estuvo padre, me gustó poder hablar más tiempo con el presidente Gardiner y repasar muchas de las cosas que he aprendido durante la misión, área por área y compañero por compañero.<\/p>\n<p>El sábado en la noche tuvimos una fiesta del Día de las Madres. En esa fiesta el obispo me pidió que tocara mi armónica en la reunión sacramental porque otro miembro le dijo que yo sabía tocar. Eso fue estresante, pero salió bien; toqué \"Te damos, Señor, nuestras gracias\". Estaba tan preocupado por tocar enfrente del barrio que cuando llegamos a casa el sábado me puse a practicar y sentía que no me salía. Me tomé un descanso, leí un capítulo de mi Libro de Mormón y luego lo intenté otra vez. Me salió perfecto, lo que me dio confianza y me dejó dormir bien. Sé que si confiamos en Dios y lo ponemos en primer lugar, Él siempre nos ayudará. Y ahora, oh hijo mío Helamán, he aquí, estás en tu juventud, y por tanto, te suplico que escuches mis palabras y aprendas de mí; porque sé que quienes pongan su confianza en Dios serán sostenidos en sus tribulaciones, y sus dificultades y aflicciones, y serán enaltecidos en el postrer día.<\/p>\n<p>Alma 36:3<\/p>\n<p>https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/36?id=p3&amp;lang=eng#p3<\/p>\n<p class=\"sign\">Los amo! Solo les queda 1 carta semanal más,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.D. amigos misioneros: aquí está, kaj.jacobs@gmail.com, ¡agréguenme a sus cartas semanales y sigamos en contacto!<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>stitch<\/li>\n<li>El Élder Jenson y yo con Heihei (lo conseguimos juntos en mi segundo cambio)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-05-15_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-15_0_1.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_414.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_415.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_416.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_417.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_418.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_419.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_420.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_421.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "¿¡Un solo 👨‍🎤 de armónica?! 🎶 Que onda chimichangas? ¿Qué tal la semana? Ojalá todos hayan disfrutado algo bueno, y a todas las mamás, un maravilloso Día de las Madres. El barrio compró rosas, así que el Élder Franson y yo pudimos repartirlas el domingo en la mañana y ver a todos sonreír 😁 fue maravilloso. Pudimos enseñarle otra vez a Paulo y es bastante buena onda. Sigue súper ocupado y atorado con su trabajo, que no le permite venir a la iglesia, pero está muy abierto a aprender y le emocionó recibir su propio Libro de Mormón. Hicimos galletas 🍪 para nuestra lista. Hicimos una lista de personas (miembros y amigos) para pasar a darles galletas y asegurarnos de que sepan que los queremos. También para ver cómo están. Eso estuvo divertido, pero todavía nos faltan algunas familias, así que esta semana va la ronda 2. Conocimos a un perrote llamado Stitch. Súper divertido. Cortamos el pasto con un miembro para una hermana menos activa, ¡y luego ella vino a la fiesta del Día de las Madres y a la iglesia! Muchas lecciones por teléfono programadas, pero pocas contestaron. El jueves tuvimos noche de fútbol ⚽ y, aunque no vino tanta gente como esperábamos, igual la disfrutamos mucho y pudimos ver caras nuevas. El viernes fue la conferencia de zona junto con mi entrevista final. Fue una gran experiencia. También hicimos un coro solo de hombres con \"El ejército de Helamán\". La entrevista estuvo padre, me gustó poder hablar más tiempo con el presidente Gardiner y repasar muchas de las cosas que he aprendido durante la misión, área por área y compañero por compañero. El sábado en la noche tuvimos una fiesta del Día de las Madres. En esa fiesta el obispo me pidió que tocara mi armónica en la reunión sacramental porque otro miembro le dijo que yo sabía tocar. Eso fue estresante, pero salió bien; toqué \"Te damos, Señor, nuestras gracias\". Estaba tan preocupado por tocar enfrente del barrio que cuando llegamos a casa el sábado me puse a practicar y sentía que no me salía. Me tomé un descanso, leí un capítulo de mi Libro de Mormón y luego lo intenté otra vez. Me salió perfecto, lo que me dio confianza y me dejó dormir bien. Sé que si confiamos en Dios y lo ponemos en primer lugar, Él siempre nos ayudará. Y ahora, oh hijo mío Helamán, he aquí, estás en tu juventud, y por tanto, te suplico que escuches mis palabras y aprendas de mí; porque sé que quienes pongan su confianza en Dios serán sostenidos en sus tribulaciones, y sus dificultades y aflicciones, y serán enaltecidos en el postrer día. Alma 36:3 https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/36?id=p3&lang=eng#p3 Los amo! Solo les queda 1 carta semanal más, Elder Jacobs P.D. amigos misioneros: aquí está, kaj.jacobs@gmail.com, ¡agréguenme a sus cartas semanales y sigamos en contacto! Fotos: stitch El Élder Jenson y yo con Heihei (lo conseguimos juntos en mi segundo cambio) Más de esta semana"}, {"id": "l100", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAY 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["PE", "BR", "HT"], "moments": ["Baptism", "Temple"], "extra": "Peru Brazil Haiti", "kind": "Carta 100 · Fort Myers", "title": "El fin *no es click bait* 🪤", "date": "2023-05-22T05:54:00", "group": "2023-05", "html": "<div class=\"body\"><p>Oí bom dia galera!<\/p>\n<p>Lhes amo muito, não se esqueçam disso!<\/p>\n<p>No es click bait: este es el último correo porque me voy a casa el sábado. Han sido 2 años increíbles y estoy muy agradecido por todo lo que aprendí y por la gente que conocí. Aquí está otra vez mi correo para los que están sirviendo; me encantaría recibir sus cartas semanales o mensajes random por Messenger.<\/p>\n<p>kaj.jacobs@gmail.com<\/p>\n<p>¡Vamos a lo que pasó esta semana!<\/p>\n<p>Empezamos horneando y cocinando con José. Aprendí a hacer sus famosas galletas de su empresa en Brasil: Cookbel<\/p>\n<p>La hermana Gardiner pidió unirse a nuestro consejo de distrito y estuvo increíble. Disfrutamos practicar enseñando a miembros con ella, escuchar sus ideas y sentir su amor por nosotros y por nuestras áreas.<\/p>\n<p>Salimos a comer a The Patio, un restaurante peruano súper bonito. Comimos de lo más rico que he probado en mi vida. ¡Y nos sobró un montón!<\/p>\n<p>El miércoles estuve con el Élder Bartschi en un intercambio. La pasamos bien en la tarde súper calurosa, buscando prácticamente todo el día. Encontramos bastantes haitianos para su área y también algunos latinos. Terminamos agotadísimos; el sol básicamente te chupa la energía cuando hace tanto calor.<\/p>\n<p>Tuvimos una lección increíble con Paulo y luego vino con nosotros y el barrio a la noche de fútbol ⚽ y le encantó. Estoy mejorando, pero sigo siendo \"manquito\", o sea sin brazos, o sea el amigo del equipo que es chistoso pero súper malo. El viernes en la noche tuvimos otra tanda de lecciones increíbles con los Aguirre, Juan y Moises. Estamos emocionados por ver su progreso esta semana y fijar una fecha bautismal con Jesus, el hijo de los Aguirre.<\/p>\n<p>El sábado se nos cancelaron todas las lecciones y luego tuvimos problemas con el carro, pero al final fue un buen día. Encontramos a una señora escogida que está emocionada por volver a reunirse, Yani. También fuimos al mercado a la hora del almuerzo con el distrito. ¡Vean el poncho que me compré! El domingo estuvo lleno de despedidas, hasta pude dar mi testimonio porque era mi último domingo. He estado aquí 6 meses y se siente como una eternidad, y me ha encantado todo. Así que disfruté eso, y además durante la semana hemos estado llevando galletas a la gente para que sientan nuestro cariño y agradecimiento, pero también para despedirnos.<\/p>\n<p>Todavía me quedan unos días; estoy emocionado de ir al templo con nuestros conversos recientes para hacer bautismos (in português), pero si algo quiero que recuerden es que he amado mi misión, servir a los demás, aprender y trabajar duro. Sé que Dios vive y que Su Hijo Jesucristo tiene el brazo extendido para salvarnos cuando nuestra fe flaquea, como le pasó a Pedro. El Evangelio es un mensaje de gozo y bendice a nuestras familias tanto como a cada persona. Que su gozo sea completo en Cristo, como lo es el mío. 1 Y aconteció que mientras Alma viajaba hacia el sur, de la tierra de Gedeón a la tierra de Manti, he aquí, para asombro suyo, encontró a los hijos de Mosíah que viajaban hacia la tierra de Zarahemla. 2 Ahora bien, estos hijos de Mosíah estaban con Alma en la ocasión en que el ángel se le apareció por primera vez; por tanto, Alma se alegró sobremanera de ver a sus hermanos; y lo que aumentó aún más su gozo, fue que todavía eran sus hermanos en el Señor; sí, y se habían fortalecido en el conocimiento de la verdad; porque eran hombres de sana inteligencia, y habían escudriñado diligentemente las Escrituras para conocer la palabra de Dios.<\/p>\n<p>3 Mas esto no es todo; se habían dedicado a mucha oración y ayuno; por tanto, tenían el espíritu de profecía y el espíritu de revelación, y cuando enseñaban, lo hacían con poder y autoridad de Dios.<\/p>\n<p>Alma 17:1-3<\/p>\n<p>Lhes amo muito, beijos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>El Pátio<\/li>\n<li>poncho<\/li>\n<li>cocinando con Jose<\/li>\n<li>aventuras de llamadas telefónicas<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>Además, el 11 de junio a las 9am hora de Arizona es mi discurso de regreso<\/p><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-05-22_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-22_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-22_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_8.jpg\" alt=\"\"><\/figure><\/div>", "text": "El fin *no es click bait* 🪤 Oí bom dia galera! Lhes amo muito, não se esqueçam disso! No es click bait: este es el último correo porque me voy a casa el sábado. Han sido 2 años increíbles y estoy muy agradecido por todo lo que aprendí y por la gente que conocí. Aquí está otra vez mi correo para los que están sirviendo; me encantaría recibir sus cartas semanales o mensajes random por Messenger. kaj.jacobs@gmail.com ¡Vamos a lo que pasó esta semana! Empezamos horneando y cocinando con José. Aprendí a hacer sus famosas galletas de su empresa en Brasil: Cookbel La hermana Gardiner pidió unirse a nuestro consejo de distrito y estuvo increíble. Disfrutamos practicar enseñando a miembros con ella, escuchar sus ideas y sentir su amor por nosotros y por nuestras áreas. Salimos a comer a The Patio, un restaurante peruano súper bonito. Comimos de lo más rico que he probado en mi vida. ¡Y nos sobró un montón! El miércoles estuve con el Élder Bartschi en un intercambio. La pasamos bien en la tarde súper calurosa, buscando prácticamente todo el día. Encontramos bastantes haitianos para su área y también algunos latinos. Terminamos agotadísimos; el sol básicamente te chupa la energía cuando hace tanto calor. Tuvimos una lección increíble con Paulo y luego vino con nosotros y el barrio a la noche de fútbol ⚽ y le encantó. Estoy mejorando, pero sigo siendo \"manquito\", o sea sin brazos, o sea el amigo del equipo que es chistoso pero súper malo. El viernes en la noche tuvimos otra tanda de lecciones increíbles con los Aguirre, Juan y Moises. Estamos emocionados por ver su progreso esta semana y fijar una fecha bautismal con Jesus, el hijo de los Aguirre. El sábado se nos cancelaron todas las lecciones y luego tuvimos problemas con el carro, pero al final fue un buen día. Encontramos a una señora escogida que está emocionada por volver a reunirse, Yani. También fuimos al mercado a la hora del almuerzo con el distrito. ¡Vean el poncho que me compré! El domingo estuvo lleno de despedidas, hasta pude dar mi testimonio porque era mi último domingo. He estado aquí 6 meses y se siente como una eternidad, y me ha encantado todo. Así que disfruté eso, y además durante la semana hemos estado llevando galletas a la gente para que sientan nuestro cariño y agradecimiento, pero también para despedirnos. Todavía me quedan unos días; estoy emocionado de ir al templo con nuestros conversos recientes para hacer bautismos (in português), pero si algo quiero que recuerden es que he amado mi misión, servir a los demás, aprender y trabajar duro. Sé que Dios vive y que Su Hijo Jesucristo tiene el brazo extendido para salvarnos cuando nuestra fe flaquea, como le pasó a Pedro. El Evangelio es un mensaje de gozo y bendice a nuestras familias tanto como a cada persona. Que su gozo sea completo en Cristo, como lo es el mío. 1 Y aconteció que mientras Alma viajaba hacia el sur, de la tierra de Gedeón a la tierra de Manti, he aquí, para asombro suyo, encontró a los hijos de Mosíah que viajaban hacia la tierra de Zarahemla. 2 Ahora bien, estos hijos de Mosíah estaban con Alma en la ocasión en que el ángel se le apareció por primera vez; por tanto, Alma se alegró sobremanera de ver a sus hermanos; y lo que aumentó aún más su gozo, fue que todavía eran sus hermanos en el Señor; sí, y se habían fortalecido en el conocimiento de la verdad; porque eran hombres de sana inteligencia, y habían escudriñado diligentemente las Escrituras para conocer la palabra de Dios. 3 Mas esto no es todo; se habían dedicado a mucha oración y ayuno; por tanto, tenían el espíritu de profecía y el espíritu de revelación, y cuando enseñaban, lo hacían con poder y autoridad de Dios. Alma 17:1-3 Lhes amo muito, beijos! Elder Jacobs Fotos: El Pátio poncho cocinando con Jose aventuras de llamadas telefónicas Además, el 11 de junio a las 9am hora de Arizona es mi discurso de regreso"}, {"id": "home", "kind": "De vuelta a casa", "title": "De regreso en casa · junio 2023", "date": null, "group": "end", "html": "<div class=\"cover-r\"><img class=\"portrait\" src=\"images/cover.jpg\" alt=\"Elder Jacobs, June 2023\"><\/div>", "text": "De regreso en casa · junio 2023 "}, {"id": "talk", "kind": "Discurso de regreso", "title": "Fortalecer nuestra relación con Cristo", "date": "2023-06-11T09:00:00", "html": "<div class=\"talk\"><h3>Introducción<\/h3>\n<ul><li>Buenos días / presentarme otra vez (ya son básicamente 3 años)<\/li><li>Dónde<\/li><li>Propósito misional<\/li><li>Algún chiste: “por fa vor” vs “por favor”<\/li><\/ul>\n<h3>Algunas cosas que aprendí<\/h3>\n<ul><li>Otras culturas<\/li><li>El cloro con la ropa de color, ni de chiste<\/li><li>La humedad<\/li><li>Gozo verdadero y duradero<\/li><li>¿Quién soy? (devocional del presidente Nelson)<ul><li>Un hijo de Dios<\/li><li>Un discípulo de Cristo<\/li><li>Un hijo del convenio<\/li><\/ul><\/li><\/ul>\n<h3>¿Qué significa relación?<\/h3>\n<ul><li>Algo emocional, como el noviazgo o el matrimonio<\/li><li>De comportamiento<\/li><li>Una conexión entre cosas parecidas<\/li><\/ul>\n<p>Queremos comportarnos bien con los demás, pero lo que nos ayuda a hacerlo es estar conectados con Cristo. Llegar a ser tan parecidos a Él, tan cristianos, que nuestro comportamiento cambie y los demás lo sientan a Él por medio de nosotros.<\/p>\n<p>Les voy a explicar algunas cosas sobre cómo fortalecer nuestra relación con Cristo. Yo las viví y crecí con ellas.<\/p>\n<h3>Cosas que hice para fortalecer mi relación con Cristo y ayudar a otros a hacer lo mismo<\/h3>\n<ol><li>Iglesia, oración, leer las Escrituras (CPR)<ul><li>Iglesia: la Santa Cena<ul><li>Beneficios como el Espíritu, aprender, los amigos (nuestros amigos)<\/li><li>Cristo es el centro, por eso la Santa Cena<\/li><li>Mosíah 14:4–5: “Ciertamente él ha llevado nuestros pesares y cargado nuestros dolores; y nosotros lo tuvimos por azotado, como herido por Dios y abatido. Mas él fue herido por nuestras transgresiones, fue molido por nuestras iniquidades; el castigo de nuestra paz fue sobre él, y con sus heridas somos sanados”.<\/li><\/ul><\/li><li>Oración: \"Dulce oración\"<ul><li>Niveles de oración / lo básico<\/li><li>“Oración en secreto”: “¿Dónde hallo el solaz?”, 3ra estrofa: “Él responde en privado, alcanza mi búsqueda”<\/li><li>Mi experiencia + amigos<\/li><\/ul><\/li><li>Estudiar, no leer ni hojear<\/li><\/ul><\/li><li>Los primeros principios y ordenanzas del Evangelio<ul><li>Fe: no es confianza ni pertenecer a una religión, sino un deseo y una acción por una percepción espiritual y no por pruebas<\/li><li>Arrepentimiento: un cambio completo y volverse hacia Dios<ul><li>La Expiación es para todos: los que están fuera del Evangelio, los que están aprendiendo del Evangelio y, sobre todo, nosotros mismos<\/li><\/ul><\/li><li>Bautismo: el primer convenio, la limpieza o el lavamiento<ul><li>Como el oro<\/li><\/ul><\/li><li>Don del Espíritu Santo: limpieza y compañero<ul><li>Una de las promesas más grandes que podemos tener<\/li><li>Niveles de entendimiento: saberlo todo, o saber poco pero tener el deseo (Jesus)<\/li><\/ul><\/li><li>Perseverar hasta el fin: permanecer o perseverar<ul><li>“La palabra permanecer denota quedarse fijo o estable y perdurar sin ceder. El élder Jeffrey R. Holland explicó que ‘permanecer’ como acción significa ‘[quedarse], pero [quedarse] para siempre’. Ese es el llamado del mensaje del Evangelio para … todos … en el mundo”. (Élder Bednar, abril de 2023)<\/li><li>Los Franco &amp; los Batista: con miedo, pero deseaban las bendiciones eternas como familia<\/li><\/ul><\/li><\/ul><\/li><li>Buscar experiencias espirituales<ul><li>Tiempo especial con Dios<ul><li>Oración<\/li><li>Situaciones privadas y en grupo<\/li><\/ul><\/li><li>Confirmaciones espirituales constantes<ul><li>Buscar lo que edifica e ilumina, en vez de repasar dudas con otros que dudan<\/li><li>Arrodillándome con Julian<\/li><\/ul><\/li><li>Servicio<ul><li>Cristo siempre sirvió<\/li><li>La limpieza después del huracán, las bendiciones y el almacén del obispo<\/li><\/ul><\/li><\/ul><\/li><\/ol>\n<blockquote class=\"hymn\">Cuando Cristo venga, con gran aclamación,<br>y me lleve a casa, ¡qué gozo llenará mi corazón!<br>Me postraré en humilde adoración<br>y proclamaré: ¡mi Dios, cuán grande eres!<\/blockquote>\n<h3>Testimonio<\/h3>\n<ul><li>Cristo<\/li><li>Escrituras<\/li><li>Oración<\/li><li>Don de lenguas<\/li><li>Amigos y familia<\/li><li>Música<\/li><li>Abrazos espirituales y empujoncitos hacia la luz<ul><li>Todos podemos tener eso<\/li><\/ul><\/li><li>La luz espiritual y nuestras formas de recibir revelación<ul><li>Oré pidiendo visiones/sueños<\/li><li>Tengo mis dones espirituales, mi relación con Dios, y Él confía en mí igual que en cualquier otra persona<\/li><li>AMOR<\/li><\/ul><\/li><\/ul><\/div>", "group": "end", "text": "Fortalecer nuestra relación con Cristo Introducción Buenos días / presentarme otra vez (ya son básicamente 3 años) Dónde Propósito misional Algún chiste: “por fa vor” vs “por favor” Algunas cosas que aprendí Otras culturas El cloro con la ropa de color, ni de chiste La humedad Gozo verdadero y duradero ¿Quién soy? (devocional del presidente Nelson) Un hijo de Dios Un discípulo de Cristo Un hijo del convenio ¿Qué significa relación? Algo emocional, como el noviazgo o el matrimonio De comportamiento Una conexión entre cosas parecidas Queremos comportarnos bien con los demás, pero lo que nos ayuda a hacerlo es estar conectados con Cristo. Llegar a ser tan parecidos a Él, tan cristianos, que nuestro comportamiento cambie y los demás lo sientan a Él por medio de nosotros. Les voy a explicar algunas cosas sobre cómo fortalecer nuestra relación con Cristo. Yo las viví y crecí con ellas. Cosas que hice para fortalecer mi relación con Cristo y ayudar a otros a hacer lo mismo Iglesia, oración, leer las Escrituras (CPR) Iglesia: la Santa Cena Beneficios como el Espíritu, aprender, los amigos (nuestros amigos) Cristo es el centro, por eso la Santa Cena Mosíah 14:4–5: “Ciertamente él ha llevado nuestros pesares y cargado nuestros dolores; y nosotros lo tuvimos por azotado, como herido por Dios y abatido. Mas él fue herido por nuestras transgresiones, fue molido por nuestras iniquidades; el castigo de nuestra paz fue sobre él, y con sus heridas somos sanados”. Oración: \"Dulce oración\" Niveles de oración / lo básico “Oración en secreto”: “¿Dónde hallo el solaz?”, 3ra estrofa: “Él responde en privado, alcanza mi búsqueda” Mi experiencia + amigos Estudiar, no leer ni hojear Los primeros principios y ordenanzas del Evangelio Fe: no es confianza ni pertenecer a una religión, sino un deseo y una acción por una percepción espiritual y no por pruebas Arrepentimiento: un cambio completo y volverse hacia Dios La Expiación es para todos: los que están fuera del Evangelio, los que están aprendiendo del Evangelio y, sobre todo, nosotros mismos Bautismo: el primer convenio, la limpieza o el lavamiento Como el oro Don del Espíritu Santo: limpieza y compañero Una de las promesas más grandes que podemos tener Niveles de entendimiento: saberlo todo, o saber poco pero tener el deseo (Jesus) Perseverar hasta el fin: permanecer o perseverar “La palabra permanecer denota quedarse fijo o estable y perdurar sin ceder. El élder Jeffrey R. Holland explicó que ‘permanecer’ como acción significa ‘[quedarse], pero [quedarse] para siempre’. Ese es el llamado del mensaje del Evangelio para … todos … en el mundo”. (Élder Bednar, abril de 2023) Los Franco & los Batista: con miedo, pero deseaban las bendiciones eternas como familia Buscar experiencias espirituales Tiempo especial con Dios Oración Situaciones privadas y en grupo Confirmaciones espirituales constantes Buscar lo que edifica e ilumina, en vez de repasar dudas con otros que dudan Arrodillándome con Julian Servicio Cristo siempre sirvió La limpieza después del huracán, las bendiciones y el almacén del obispo Cuando Cristo venga, con gran aclamación, y me lleve a casa, ¡qué gozo llenará mi corazón! Me postraré en humilde adoración y proclamaré: ¡mi Dios, cuán grande eres! Testimonio Cristo Escrituras Oración Don de lenguas Amigos y familia Música Abrazos espirituales y empujoncitos hacia la luz Todos podemos tener eso La luz espiritual y nuestras formas de recibir revelación Oré pidiendo visiones/sueños Tengo mis dones espirituales, mi relación con Dios, y Él confía en mí igual que en cualquier otra persona AMOR"}, {"id": "culture", "kind": "Notas", "title": "Cosas de cultura", "date": "2023-01-09T06:00:00", "html": "<div class=\"culture\"><div class=\"recipe\"><h3>Agua de horchata<\/h3><ul><li>1/2 taza de harina de arroz<\/li><li>2 tazas de leche normal<\/li><li>1 lata de leche condensada<\/li><li>1 cdta. de vainilla<\/li><li>1 cdta. de canela<\/li><li>1/4 taza de azúcar<\/li><\/ul><p>Agreguen agua al gusto<\/p><p>Mezclen todo y agreguen hielo<\/p><\/div><div class=\"countries\"><div class=\"country\"><h3>🇲🇽 Mexico<\/h3><p><b>Capital:<\/b> Distrito Federal (&quot;DF&quot;)<\/p><p><b>Espresiones famosa:<\/b> Ándale! Apoco! No me digas! Órale! Híjoles!<\/p><p class=\"lbl\">Estados<\/p><ul><li>Hidalgo<\/li><\/ul><p><b>A. Dialecto:<\/b> Otomi<\/p><ul><li>&quot;quehatsi&quot; como esta?<\/li><li>&quot;isqudaí&quot; buenas tardes!<\/li><li>Puebla (Poblanos)<\/li><\/ul><p><b>A. Comida Tipica:<\/b> Mole<\/p><ul><li>Oaxaca<\/li><\/ul><p><b>A. Comida famosa:<\/b> &quot;Tlayudas&quot; (tortillas que son grandes como un sope)<\/p><ul><li>Veracruz<\/li><\/ul><p>A. Los &quot;Jarochos&quot; o &quot;Costeños (personas viven cerca dela costa)&quot;<\/p><ul><li>Michóacan (los Tarascos)<\/li><\/ul><p><b>Ciudad:<\/b> Parangaricutirimicuaro<\/p><p><b>Dialecto:<\/b> Tarasco<\/p><\/div><div class=\"country\"><h3>🇨🇴 Colombia<\/h3><p><b>Capital:<\/b> Bogotá (los Rolos)<\/p><ul><li>&quot;eterna primavera&quot;<\/li><\/ul><p><b>Expresiones:<\/b> chevere! (padre/genial) Bacano! (bueno/genial) parcero (amigo) que mi ave (mucho gusto, o tal vez no es una frase real, no estoy seguro)<\/p><p>Medellin- &quot;Paisa&quot;<\/p><p>Caliroso - con mucho estilo<\/p><p class=\"lbl\">Comida Tipica<\/p><ul><li>arrepas<\/li><li>chocolate con quezo<\/li><li>pan de bono (hay que probarlo!)<\/li><\/ul><\/div><div class=\"country\"><h3>🇻🇪 Venezuela<\/h3><p><b>Capital:<\/b> Caracas<\/p><p><b>Expresiones:<\/b> chévere!<\/p><ul><li>Juego: pelota de goma (Personas de Maracaibo)<\/li><\/ul><p class=\"lbl\">Comidas Tipicas<\/p><ul><li>Arrepas (no se compare con Colombia)<\/li><li>&quot;Caraotas&quot; -frijoles<\/li><li>&quot;wasacaca&quot; -básicamente aderezo ranch<\/li><li>hallacas -tamales venezolanos para Navidad<\/li><\/ul><p class=\"lbl\">Musica<\/p><ul><li>&quot;otra noche de ilusión&quot;<\/li><li>La gainta: una tipa de cancion de la navidad<\/li><\/ul><\/div><div class=\"country\"><h3>🇭🇳 Honduras<\/h3><p><b>Capital:<\/b> Tegucigalpa<\/p><ul><li>los Catrachos<\/li><\/ul><p><b>Expresiones:<\/b> más hizo! Medo gallo (un tipo buena onda)<\/p><\/div><div class=\"country\"><h3> El Salvador<\/h3><p><b>Capital:<\/b> San Salvador<\/p><p><b>Comida Tipica:<\/b> Pupusas<\/p><\/div><div class=\"country\"><h3>🇨🇱 Chile<\/h3><p><b>Expressiones:<\/b> bacán (¡genial!) ; buena po!<\/p><p><b>Capital:<\/b> Santiago<\/p><p class=\"lbl\">Cominda Tipica<\/p><ul><li>completos- sanchicha<\/li><li>Pastel de Choclo (pastel de elote con carne)<\/li><li>Empanadas<\/li><li>Calzones Rotos- una fritura<\/li><\/ul><\/div><div class=\"country\"><h3>🇳🇮 Nicaragua<\/h3><p><b>Capital:<\/b> Managua<\/p><p>&quot;Los Nicas&quot;<\/p><p class=\"lbl\">Comida Tipica<\/p><ul><li>Tostadas<\/li><li>Tamales<\/li><li>tortillas de Maíz<\/li><li>gallo pinto<\/li><\/ul><p><b>Expresiones:<\/b> maje (amigo) al puro cien (💯 por ciento)<\/p><\/div><div class=\"country\"><h3>🇪🇨 Ecuador<\/h3><p><b>Capital:<\/b> Quito<\/p><p class=\"lbl\">Comidas famosas/ típica<\/p><ul><li>La guatita (la panza de vaca)<\/li><li>Cuy (conejillo de indias) con las papas cocinadas<\/li><li>siempre tienen papas<\/li><li>muchísimas sopas<\/li><\/ul><p class=\"lbl\">Dialetos<\/p><ul><li>Kichwa<\/li><\/ul><p>Me voy a camello &quot;Me voy a trabajar&quot;<\/p><p>Chuchaqui &quot;cruda, resaca - sustantivo&quot;<\/p><p>Chumalo &quot;persona borracha&quot;<\/p><p>Ese man<\/p><\/div><div class=\"country\"><h3>🇬🇹 Guatemala<\/h3><ul><li>&quot;Chapin&quot; un Guatemalteco<\/li><li>habla dialectos como &quot;Mam&quot;<\/li><\/ul><p><b>Comida Tipica:<\/b> Chuscutas con Taccines (tortilla con frijoles)<\/p><\/div><div class=\"country\"><h3>🇵🇪 Peru<\/h3><p><b>Capital:<\/b> Lima~Machu Pichu<\/p><p><b>Dialecto:<\/b> Quechua (Alileichu?~Como estas?)<\/p><p class=\"lbl\">Ciudades<\/p><p>Arrequipa (las montañas)<\/p><p>Iquitos( la sierra)<\/p><p class=\"lbl\">Comida Tipica<\/p><p>Ají de Gallina( HAY QUE PROBAR!!!)<\/p><p>Cerviché(cuidado; es pescado crudo, ¡pero sabe rico!)<\/p><p>Patatas (tienen 200+ variedades de Patatas; mas de Idaho!!)<\/p><p>Inca Cola- su soda famosa (hay que probar!)<\/p><\/div><div class=\"country\"><h3>🇦🇷 Argentina<\/h3><p><b>Capital:<\/b> Buenos Aires<\/p><p><b>Juego Famoso:<\/b> Fútbol<\/p><p class=\"lbl\">Comida Famosa<\/p><ul><li>bistec<\/li><li>empanadas<\/li><li>mate- su bebida famosa<\/li><li>milanesa<\/li><li>facherito (con estilo, genial, increíble)<\/li><\/ul><p><b>Frases:<\/b> che (oye! Che! Oye, mejor amigo - muy informal)<\/p><\/div><div class=\"country\"><h3>🇨🇷 Costa Rica<\/h3><p>Los &quot;Ticos&quot;<\/p><p><b>Expresiones:<\/b> &quot;Pura vida&quot; (bien)<\/p><p class=\"lbl\">Cominda tipica<\/p><p>Gallo pinto<\/p><\/div><div class=\"country\"><h3>🇨🇺 Cuba<\/h3><p><b>Capital:<\/b> Havana<\/p><p><b>Comida tipica:<\/b> ropa vieja, tostones, bacalao, sándwich cubano, arroz y frijoles negros<\/p><ul><li>Las Tunas una ciudad hermosa<\/li><\/ul><p><b>Expresiones:<\/b> como esta la cosa? Que bolá? Mi accede (amigo)<\/p><\/div><div class=\"country\"><h3>🇵🇷 Puerto Rico<\/h3><p><b>Capital:<\/b> San Juan<\/p><ul><li>Los Boricuas (les gusta tener este apodo)<\/li><\/ul><p class=\"lbl\">Ciudades<\/p><p class=\"lbl\">Comida tipica<\/p><ul><li>MOFONGO<\/li><li>arroz con abichuela (frijoles)<\/li><li>arroz con grandules( garbanzos)<\/li><li>tostones; platano frito<\/li><li>Pinchos (a la parrilla)<\/li><\/ul><p><b>Expresiones:<\/b> ay bendito!<\/p><\/div><div class=\"country\"><h3>🇩🇴 Republica Dominicana<\/h3><p><b>Capital:<\/b> Santo Domingo<\/p><p><b>Expresiones:<\/b> ay! mi madre! Que lo que? De lo mío (compa) pana (amigo/a)<\/p><p class=\"lbl\">Comida tipica<\/p><ul><li>Mangu<\/li><li>Plantano Verde<\/li><\/ul><\/div><div class=\"country\"><h3>🇧🇷 Brazil<\/h3><p><b>Capital:<\/b> Brasilla<\/p><p><b>Idioma:<\/b> Portugués (bien parecido de Español)<\/p><p><b>Música:<\/b> cavaquinho (instrumento de 4 cuerdas)<\/p><p><b>Expresiones:<\/b> Tudo bém? Legal! (¡Padre!) Uai! Trem (no sé bien cómo se usa)<\/p><p>&quot;Sotaki&quot;- acentos: tienen 3 acentos diferentes según de dónde sean.<\/p><p class=\"lbl\">Ciudades<\/p><ul><li>Belém- habla con &quot;sh&quot; (el Belén de Bras
