 palabra, en conducta, en amor, en espíritu, en fe y en pureza Bueno, estoy emocionado por este cambio y por el futuro. Cuéntenme lo que esté pasando en sus vidas. El viernes tenemos la capacitación especializada y podré ver a más amigos misioneros & volvernos locos buscando en el campus de USF, jaja. Los Amo, Elder Jacobs Fotos: Élder Rogers & Élder Argyle ¡Élder Towne! Hora de Pokémon Cuarteto ¡Bye bye, mijos! Más de esta semana"}, {"id": "l67", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SEP 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🌀 Huracán<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism", "Hurricane"], "extra": "Brazil", "kind": "Carta 67 · Tampa", "title": "🌤La tranquilidad antes de la tormenta🌀🌊", "date": "2022-09-26T05:22:00", "group": "2022-09", "html": "<div class=\"body\"><p>Gracias a todos! Sí tuve un buen cumpleaños el viernes. Casi todo el viernes fue una reunión para capacitadores &amp; misioneros en capacitación, pero después fuimos a cenar a Chick-fil-A.<\/p>\n<p>Esta semana estuvo bastante divertida y, aunque el título dice la tranquilidad antes de la tormenta, esta semana también se sintió como una tormentita en algunas partes.<\/p>\n<p>El lunes pasado en la tarde estuvo buenísimo: pudimos enseñar otra vez a nuestra familia brasileña y tenían muchas preguntas sobre el plan de salvación (qué coincidencia, eso era lo que habíamos planeado enseñar). Tristemente, nuestro miembro estaba trabajando y no pudo ir, así que la lección fue larga, tratando de explicar todo lo suficientemente bien en nuestro portugués limitado (el Élder Towne &amp; yo), pero la disfrutaron. ¡También le dimos unos Pokémon a João, que tiene 6 años!<\/p>\n<p>El martes tuvimos un consejo de distrito buenísimo y un intercambio con los élderes de South Tampa. De camino a casa pasamos a visitar + tocamos puertas y encontramos a una familia de miembros que se acababa de mudar una semana antes.<\/p>\n<p>Les enseñé al Élder Towne &amp; al Élder Rogers cómo tener una sesión de planificación semanal increíble... o sea, hacer arepas. Absolutamente GOAT. No sé por qué no son más populares.<\/p>\n<p>¡Y lo mejor fue que nuestro amigo Samuel por fin se bautizó ayer! Llevaba meses esperando y por fin estaba listo. Fue un servicio súper dulce y sé que veremos muchas cosas buenas de él.<\/p>\n<p>El viernes el presidente Gardiner nos dio noticias del huracán. Así que nos hemos estado preparando con agua, comida, gasolina, etc. Pero ya veremos qué tan poco o demasiado preparados estamos. Hoy a mis compañeros y a mí nos van a evacuar de nuestro departamento a la casa de la misión en Wesley Chapel. Ya veremos cómo va la obra misional esta semana.<\/p>\n<p>Mateo 6:6 Mas tú, cuando ores, entra en tu cámara, y cerrada tu puerta, ora a tu Padre que está en secreto; y tu Padre que ve en secreto te recompensará en público<\/p>\n<p>He estado tratando de hacer una oración en secreto una vez al día y de verdad me ha ayudado en mi relación con Dios. Sé que Él vive, escucha y contesta mis oraciones, y no solo contesta: nos habla a mí y a ustedes cuando actuamos y pedimos con fe.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>El bautismo de Samuel<\/li>\n<li>Meme en español<\/li>\n<li>El Élder Rogers tratando de librarse de los cinchos (se los puso él mismo 🤡 al final encontramos unas tijeras)<\/li>\n<li>¿El Élder Rogers y yo de espaldas? (El Élder Nelson tomó la foto)<\/li>\n<li>mis nuevos Crocs (sí, Ryan, sí me gustan, no debí haber esperado tanto)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-09-26_0_0.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-09-26_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-26_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-26_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-26_0_4.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-09-26_0_5.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_369.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_370.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_371.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_372.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_373.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_374.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_375.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_376.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_377.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_378.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_379.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_380.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🌤La tranquilidad antes de la tormenta🌀🌊 Gracias a todos! Sí tuve un buen cumpleaños el viernes. Casi todo el viernes fue una reunión para capacitadores & misioneros en capacitación, pero después fuimos a cenar a Chick-fil-A. Esta semana estuvo bastante divertida y, aunque el título dice la tranquilidad antes de la tormenta, esta semana también se sintió como una tormentita en algunas partes. El lunes pasado en la tarde estuvo buenísimo: pudimos enseñar otra vez a nuestra familia brasileña y tenían muchas preguntas sobre el plan de salvación (qué coincidencia, eso era lo que habíamos planeado enseñar). Tristemente, nuestro miembro estaba trabajando y no pudo ir, así que la lección fue larga, tratando de explicar todo lo suficientemente bien en nuestro portugués limitado (el Élder Towne & yo), pero la disfrutaron. ¡También le dimos unos Pokémon a João, que tiene 6 años! El martes tuvimos un consejo de distrito buenísimo y un intercambio con los élderes de South Tampa. De camino a casa pasamos a visitar + tocamos puertas y encontramos a una familia de miembros que se acababa de mudar una semana antes. Les enseñé al Élder Towne & al Élder Rogers cómo tener una sesión de planificación semanal increíble... o sea, hacer arepas. Absolutamente GOAT. No sé por qué no son más populares. ¡Y lo mejor fue que nuestro amigo Samuel por fin se bautizó ayer! Llevaba meses esperando y por fin estaba listo. Fue un servicio súper dulce y sé que veremos muchas cosas buenas de él. El viernes el presidente Gardiner nos dio noticias del huracán. Así que nos hemos estado preparando con agua, comida, gasolina, etc. Pero ya veremos qué tan poco o demasiado preparados estamos. Hoy a mis compañeros y a mí nos van a evacuar de nuestro departamento a la casa de la misión en Wesley Chapel. Ya veremos cómo va la obra misional esta semana. Mateo 6:6 Mas tú, cuando ores, entra en tu cámara, y cerrada tu puerta, ora a tu Padre que está en secreto; y tu Padre que ve en secreto te recompensará en público He estado tratando de hacer una oración en secreto una vez al día y de verdad me ha ayudado en mi relación con Dios. Sé que Él vive, escucha y contesta mis oraciones, y no solo contesta: nos habla a mí y a ustedes cuando actuamos y pedimos con fe. Los amo! Elder Jacobs Fotos: El bautismo de Samuel Meme en español El Élder Rogers tratando de librarse de los cinchos (se los puso él mismo 🤡 al final encontramos unas tijeras) ¿El Élder Rogers y yo de espaldas? (El Élder Nelson tomó la foto) mis nuevos Crocs (sí, Ryan, sí me gustan, no debí haber esperado tanto) Más de esta semana"}, {"id": "l68", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OCT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌀 Huracán<\/span><\/div>", "cultures": [], "moments": ["Hurricane"], "extra": "", "kind": "Carta 68 · Tampa", "title": "🌀🌩🌧 ĆåžåţøřɱęŋţåŞ🏃‍♂️💨", "date": "2022-10-03T12:55:00", "group": "2022-10", "html": "<div class=\"body\"><p>Boa tarde!<\/p>\n<p>Esta semana definitivamente fue diferente y me abrió los ojos (no, no perseguimos la tormenta)<\/p>\n<p>Por el huracán 🌀 que venía, nos evacuaron el lunes de la semana pasada en la mañana. A algunos misioneros los mandaron a otros departamentos más tierra adentro/al norte, a capillas y a la casa de la misión. Yo tuve la suerte de estar en la casa de la misión con muchos otros misioneros y con los Gardiner.<\/p>\n<p>Fue muy raro ser misionero y a la vez estar fuera de las actividades normales. El lunes, después de mudarnos a la casa de la misión en Wesley Chapel, el día siguió como normal, pero con enseñanza en línea en la tarde. El martes también nos dejaron salir, pero todavía con límites por estar evacuados. Servimos a otros en Zephyrhills (que, si se acuerdan, es donde empecé mi misión) y fuimos a Betmar. Fue divertido y muy bonito ayudar a otros a prepararse para el huracán. El miércoles estuvimos encerrados, y parte del jueves también, así que aquí hay una lista de cosas que hicimos para no volvernos tan locos:<\/p>\n<ul class=\"bul\">\n<li>contactar a amigos<\/li>\n<li>publicaciones en Facebook &amp; buscar<\/li>\n<li>cantar<\/li>\n<li>estudiar (español, portugués y las Escrituras)<\/li>\n<li>tech decks<\/li>\n<li>enseñarle a Mr. Bingly a echarse y luego intentar que se diera la vuelta<\/li>\n<li>marcar Libros de Mormón para regalar<\/li>\n<li>empezar a aprender a tocar la armónica<\/li>\n<li>juegos de mesa<\/li>\n<li>película de José Smith<\/li>\n<li>compartir escrituras favoritas (la mía es Alma 5:14)<\/li>\n<li>aburrirnos muchísimo<\/li>\n<\/ul>\n<p>Fue difícil porque nos sentíamos totalmente inútiles estando atorados así, pero todos estamos a salvo, y nuestros amigos en Tampa también, porque cambió de rumbo. Pero causó muchos daños en Lehigh Acres y Fort Myers. ¡Oren por los miembros, amigos y misioneros de allá! Hemos estado hospedando a un compañerismo de Peace River (zona Fort Myers) porque su departamento se dañó.<\/p>\n<p>Regresamos el jueves en la tarde y hemos estado tratando de agarrar ritmo otra vez. El lema de nuestra zona, \"Todo acelerador, nada de freno\", quedó en pausa #FrickYouSatan<\/p>\n<p>Pero hemos podido volver al ritmo y enseñar y buscar. La conferencia estuvo buenísima. 3 Nefi 5:13<\/p>\n<p>He aquí, soy discípulo de Jesucristo, el Hijo de Dios. He sido llamado por él para declarar su palabra entre los de su pueblo, a fin de que tengan vida sempiterna.<\/p>\n<p>Esta escritura es en lo que empecé a pensar cuando volví al ritmo. Soy discípulo, llamado por Dios, y no voy a desperdiciar nada del tiempo que me queda en la misión. Se me abrieron los ojos a lo terrible que se siente recibir una mayordomía y no poder cumplirla. Todos tenemos la oportunidad de compartir nuestro testimonio con otros, como explicaron algunos discursantes en la conferencia.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>fotos de la casa de la misión<\/li>\n<li>Tortuga que rescatamos (casi me muerde)<\/li>\n<li>capacitación especializada<\/li>\n<li>cómo quedó todo cerca de nuestro departamento<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-10-03_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-03_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-03_0 atorados así, pero todos estamos a salvo, y nuestros amigos en Tampa también, porque cambió de rumbo. Pero causó muchos daños en Lehigh Acres y Fort Myers. ¡Oren por los miembros, amigos y misioneros de allá! Hemos estado hospedando a un compañerismo de Peace River (zona Fort Myers) porque su departamento se dañó. Regresamos el jueves en la tarde y hemos estado tratando de agarrar ritmo otra vez. El lema de nuestra zona, \"Todo acelerador, nada de freno\", quedó en pausa #FrickYouSatan Pero hemos podido volver al ritmo y enseñar y buscar. La conferencia estuvo buenísima. 3 Nefi 5:13 He aquí, soy discípulo de Jesucristo, el Hijo de Dios. He sido llamado por él para declarar su palabra entre los de su pueblo, a fin de que tengan vida sempiterna. Esta escritura es en lo que empecé a pensar cuando volví al ritmo. Soy discípulo, llamado por Dios, y no voy a desperdiciar nada del tiempo que me queda en la misión. Se me abrieron los ojos a lo terrible que se siente recibir una mayordomía y no poder cumplirla. Todos tenemos la oportunidad de compartir nuestro testimonio con otros, como explicaron algunos discursantes en la conferencia. Los amo! Elder Jacobs Fotos: fotos de la casa de la misión Tortuga que rescatamos (casi me muerde) capacitación especializada cómo quedó todo cerca de nuestro departamento Más de esta semana"}, {"id": "l69", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OCT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><\/div>", "cultures": ["VE"], "moments": [], "extra": "Venezuela", "kind": "Carta 69 · Tampa", "title": "🌀Manos 🤝 que Ayudan & ¡más!🤠", "date": "2022-10-10T12:36:00", "group": "2022-10", "html": "<div class=\"body\"><p>Buenas tardes a todos!<\/p>\n<p>Fue una semana llena de sorpresas y bendiciones!<\/p>\n<p>Esta semana estuvo increíble y llena de acción por varias razones y eventos. Algo que aprendí fue a no dar las cosas por sentado. Cosas como una semana misional normal llena de enseñanza, una casa con luz y agua corriente, comida casera, etc. Nuestra semana estuvo buena e hicimos muchas cosas, pero fue diferente a las demás.<\/p>\n<p>Esta semana tuvimos conferencia de zona, la primera del presidente Gardiner, y estuvo increíble. Nos enfocamos en PME (Predicad Mi Evangelio) y en el Libro de Mormón, lo cual terminó en un juego de Jeopardy de los 2.<\/p>\n<p>Nos costó programar lecciones y que de verdad se dieran, lo que nos llevó a tocar puertas y hacer visitas, pero aun así no mucho. Definitivamente vamos a tratar de que todo arranque esta semana.<\/p>\n<p>Esta semana se nos ponchó una llanta mientras estábamos con el Élder Moon 🌙 🌚 Fue divertido porque eso nos llevó a unas pláticas muy buenas haciendo contactos en la calle, caminando mientras esperábamos a que Pep Boys terminara. Enseñamos 2 lecciones en inglés y eso estuvo difícil jaja; definitivamente no estoy acostumbrado (la estructura de mis oraciones en inglés anda 🆘️) y hay una razón por la que me llamaron a enseñar en español 😅 Esta semana tuvimos otra vez una lección de lectura de escrituras buenísima con los Franco y nos dieron otro platillo de Venezuela 🇻🇪, ¡pero este era una botana que ella inventó así nomás! Tostadas; medio se me olvidó la foto de lo bueno que estaba. ¡También anduvimos corriendo preparándonos para el servicio del sábado!<\/p>\n<p>No teníamos idea de qué debíamos llevar porque no sabíamos qué tipo de trabajo íbamos a hacer. Nos unimos a nuestro barrio a las 4:30 a. m. y formamos nuestro equipo de Manos que Ayudan de 16 (el sábado, pero solo 7 el domingo, porque la mayoría no se quedó) y nos pusieron a trabajar con los árboles. Nos divertimos muchísimo dándoles con todo a los árboles con los miembros. A ellos les vale y se vuelven locos con motosierras y otras formas de tumbar árboles y sacarlos para ayudar a limpiar los patios de la gente. Me quemé muchísimo con el sol y quedé con el cuerpo bastante cansado, así que hoy ha estado bien descansar. Acampamos esa noche (no es algo que la mayoría de los misioneros pueda decir) y regresamos como a las 5 p. m.<\/p>\n<p>¡Disfruten esta escritura y su semana!<\/p>\n<p>DyC 111<\/p>\n<p>6 No os preocupéis por Sion, porque obraré misericordiosamente con ella.<\/p>\n<p>7 Permaneced en este lugar y en las regiones circunvecinas;<\/p>\n<p>8 y el lugar donde es mi voluntad que permanezcáis, por lo general, os será indicado por la paz y el poder de mi Espíritu, que fluirá hacia vosotros<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>cosas de árboles<\/li>\n<li>rana<\/li>\n<li>Nemo<\/li>\n<li>llanta ponchada<\/li>\n<li>sacando lodo<\/li>\n<li>acampando<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-10-10_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-10_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-10_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_8.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-10_0_9.jpg\" alt=\"\"><\/figure><\/div>", "text": "🌀Manos 🤝 que Ayudan & ¡más!🤠 Buenas tardes a todos! Fue una semana llena de sorpresas y bendiciones! Esta semana estuvo increíble y llena de acción por varias razones y eventos. Algo que aprendí fue a no dar las cosas por sentado. Cosas como una semana misional normal llena de enseñanza, una casa con luz y agua corriente, comida casera, etc. Nuestra semana estuvo buena e hicimos muchas cosas, pero fue diferente a las demás. Esta semana tuvimos conferencia de zona, la primera del presidente Gardiner, y estuvo increíble. Nos enfocamos en PME (Predicad Mi Evangelio) y en el Libro de Mormón, lo cual terminó en un juego de Jeopardy de los 2. Nos costó programar lecciones y que de verdad se dieran, lo que nos llevó a tocar puertas y hacer visitas, pero aun así no mucho. Definitivamente vamos a tratar de que todo arranque esta semana. Esta semana se nos ponchó una llanta mientras estábamos con el Élder Moon 🌙 🌚 Fue divertido porque eso nos llevó a unas pláticas muy buenas haciendo contactos en la calle, caminando mientras esperábamos a que Pep Boys terminara. Enseñamos 2 lecciones en inglés y eso estuvo difícil jaja; definitivamente no estoy acostumbrado (la estructura de mis oraciones en inglés anda 🆘️) y hay una razón por la que me llamaron a enseñar en español 😅 Esta semana tuvimos otra vez una lección de lectura de escrituras buenísima con los Franco y nos dieron otro platillo de Venezuela 🇻🇪, ¡pero este era una botana que ella inventó así nomás! Tostadas; medio se me olvidó la foto de lo bueno que estaba. ¡También anduvimos corriendo preparándonos para el servicio del sábado! No teníamos idea de qué debíamos llevar porque no sabíamos qué tipo de trabajo íbamos a hacer. Nos unimos a nuestro barrio a las 4:30 a. m. y formamos nuestro equipo de Manos que Ayudan de 16 (el sábado, pero solo 7 el domingo, porque la mayoría no se quedó) y nos pusieron a trabajar con los árboles. Nos divertimos muchísimo dándoles con todo a los árboles con los miembros. A ellos les vale y se vuelven locos con motosierras y otras formas de tumbar árboles y sacarlos para ayudar a limpiar los patios de la gente. Me quemé muchísimo con el sol y quedé con el cuerpo bastante cansado, así que hoy ha estado bien descansar. Acampamos esa noche (no es algo que la mayoría de los misioneros pueda decir) y regresamos como a las 5 p. m. ¡Disfruten esta escritura y su semana! DyC 111 6 No os preocupéis por Sion, porque obraré misericordiosamente con ella. 7 Permaneced en este lugar y en las regiones circunvecinas; 8 y el lugar donde es mi voluntad que permanezcáis, por lo general, os será indicado por la paz y el poder de mi Espíritu, que fluirá hacia vosotros Los amo, Elder Jacobs Fotos: cosas de árboles rana Nemo llanta ponchada sacando lodo acampando"}, {"id": "l70", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OCT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["VE", "PE", "HT"], "moments": ["Baptism", "Temple"], "extra": "Venezuela Peru Haiti", "kind": "Carta 70 · Tampa", "title": "🇻🇪🎊🎉🎈Cumpleaños & amigos nuevos 🇭🇳🇵🇪", "date": "2022-10-17T11:51:00", "group": "2022-10", "html": "<div class=\"body\"><p>Que ondan payasos<\/p>\n<p>Todo bien aquí, milagros y bautismos muy pronto!<\/p>\n<p>Esta semana hemos estado haciendo mucho trabajo con referencias, tratando de ver cuántas de verdad están disponibles e interesadas en los mensajes, y eso nos llevó a encontrar a Darwín &amp; Luis.<\/p>\n<p>Darwín es súper buena onda, muy amable y chistoso. Es de Honduras 🇭🇳 y vio algo diferente en los élderes de inglés, así que nos invitaron a su casa. Le enseñamos 2 lecciones esta semana y estoy emocionado de ver su progreso. Oren para que encuentre la manera de llegar a la iglesia.<\/p>\n<p>Luis es de Perú 🇵🇪, también bastante joven y muy educado. Ya sabe un montón de la Iglesia por haber visto el templo, a los misioneros, etc. allá en Perú. Le enseñamos 2 lecciones esta semana y estamos trabajando con él para que se dé cuenta de que la iglesia es más importante que trabajar más.<\/p>\n<p>Remodelamos todo el apartamento porque ahora viven con nosotros los élderes de criollo. Al principio fue medio frustrante, sobre todo antes de que pasara, pero ahora se siente tan correcto y es divertido tenerlos ahí. Además, consejo misional: vivir con más élderes = comprar al por mayor = gastar menos $ en general = 🏆 ✌️<\/p>\n<p>Hicimos algunos intercambios esta semana con élderes de mi distrito y fue súper divertido (demasiado divertido para tomar fotos, perdón, estoy intentando sacar más)<\/p>\n<p>Nuestro distrito de verdad se esforzó esta semana para enseñar muchísimo más y dar 1 lección con un miembro presente (LMP) al día, porque una LMP al día mantiene alejado al LD (líder de distrito = yo). Muchos milagros salieron de eso.<\/p>\n<p>Fuimos a enseñar a nuestra familia venezolana y resultó que también era una fiesta de cumpleaños. Cantamos, comimos mucha comida y hablamos de la familia eterna por medio del bautismo y el templo (dijeron que sí, ¡pronto les diremos el día!). Nuestros otros amigos están bien y pensando en el bautismo, así que por favor oren por ellos y sus testimonios. Y también por protección, trabajo y salud (todo eso bueno)<\/p>\n<p>Me ha encantado volver a estudiar la Conferencia General y los invito a todos a hacer lo mismo. Aquí está uno de mis discursos favoritos ahorita: «Este día», del élder Rasband<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2022/10/17rasband?lang=eng<\/p>\n<p>Última semana de los cambios, ¡vamos con todo!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Fiesta de cumpleaños venezolana<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-10-17_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-17_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "🇻🇪🎊🎉🎈Cumpleaños & amigos nuevos 🇭🇳🇵🇪 Que ondan payasos Todo bien aquí, milagros y bautismos muy pronto! Esta semana hemos estado haciendo mucho trabajo con referencias, tratando de ver cuántas de verdad están disponibles e interesadas en los mensajes, y eso nos llevó a encontrar a Darwín & Luis. Darwín es súper buena onda, muy amable y chistoso. Es de Honduras 🇭🇳 y vio algo diferente en los élderes de inglés, así que nos invitaron a su casa. Le enseñamos 2 lecciones esta semana y estoy emocionado de ver su progreso. Oren para que encuentre la manera de llegar a la iglesia. Luis es de Perú 🇵🇪, también bastante joven y muy educado. Ya sabe un montón de la Iglesia por haber visto el templo, a los misioneros, etc. allá en Perú. Le enseñamos 2 lecciones esta semana y estamos trabajando con él para que se dé cuenta de que la iglesia es más importante que trabajar más. Remodelamos todo el apartamento porque ahora viven con nosotros los élderes de criollo. Al principio fue medio frustrante, sobre todo antes de que pasara, pero ahora se siente tan correcto y es divertido tenerlos ahí. Además, consejo misional: vivir con más élderes = comprar al por mayor = gastar menos $ en general = 🏆 ✌️ Hicimos algunos intercambios esta semana con élderes de mi distrito y fue súper divertido (demasiado divertido para tomar fotos, perdón, estoy intentando sacar más) Nuestro distrito de verdad se esforzó esta semana para enseñar muchísimo más y dar 1 lección con un miembro presente (LMP) al día, porque una LMP al día mantiene alejado al LD (líder de distrito = yo). Muchos milagros salieron de eso. Fuimos a enseñar a nuestra familia venezolana y resultó que también era una fiesta de cumpleaños. Cantamos, comimos mucha comida y hablamos de la familia eterna por medio del bautismo y el templo (dijeron que sí, ¡pronto les diremos el día!). Nuestros otros amigos están bien y pensando en el bautismo, así que por favor oren por ellos y sus testimonios. Y también por protección, trabajo y salud (todo eso bueno) Me ha encantado volver a estudiar la Conferencia General y los invito a todos a hacer lo mismo. Aquí está uno de mis discursos favoritos ahorita: «Este día», del élder Rasband https://www.churchofjesuschrist.org/study/general-conference/2022/10/17rasband?lang=eng Última semana de los cambios, ¡vamos con todo! Los amo, Elder Jacobs Fotos: Fiesta de cumpleaños venezolana"}, {"id": "l71", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OCT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Carta 71 · Tampa", "title": "Pues eh, ahora soy 🧍‍♂️creador de contenido de Facebook 💫", "date": "2022-10-24T08:11:00", "group": "2022-10", "html": "<div class=\"body\"><p>Buenos días amigos!<\/p>\n<p>¡Esta fue la última semana de los cambios y estuvo increíble! Mis compañeros y yo crecimos muchísimo juntos y nos divertimos un montón. Estoy muy agradecido por el tiempo que pasé con ellos.<\/p>\n<p>Lo cual supongo que da a entender que mi reinado del terror en Tampa se acabó. ¡Voy a reabrir Largo Sp (para élderes) con el Élder LuTu! Estoy emocionado de regresar a uno de mis lugares favoritos y con un querido amigo/hijo misional. El Élder Towne es el único que se queda, pero pronto se va a Brasil 🇧🇷. El Élder Rogers se va a Dade City con el Élder Dean. En fin, hablemos del resto de la semana<\/p>\n<p>Tuvimos nuestro último consejo de distrito, que estuvo divertido. Al principio de verdad pensé que habría muy pocos cambios, sobre todo en mi compañerismo, pero hay bastantes. Hicimos 2 intercambios esta semana: uno con South Tampa y el otro con los líderes de zona. Todos élderes fenomenales.<\/p>\n<p>No voy a ser líder de distrito el próximo cambio, pero no es por castigo ni nada; como misioneros se nos dan oportunidades para aprender y alguien más la necesita más ahorita. Me encantó, pero también me alegra tener más tiempo para enfocarme en mi área. Tocamos muchas puertas esta semana, más que nada preparando el futuro, ya que la mayoría de la gente estaba ocupada y no podía hablar en ese momento.<\/p>\n<p>Nos llamaron unos miembros que estaban de visita desde Nueva Jersey y necesitaban bendiciones, así que tuvimos la oportunidad de dárselas. ¡También tienen algunas referencias para nosotros aquí!<\/p>\n<p>Sobre el título del correo, sí, leyeron bien. De alguna manera me ha ido bien en Facebook con mis publicaciones del Evangelio medio esporádicas, tanto que ahora Facebook está difundiendo mis cosas como creador de contenido, ¡y esto quizás me permita llegar a más personas! Así que estoy emocionado y abierto a cualquier idea de publicaciones para seguir intentando recoger a Israel. Una última cosa de esta semana antes del pensamiento espiritual:<\/p>\n<p>Nos despertamos el domingo en la mañana, hacemos nuestro horario normal, salimos temprano para el consejo de barrio y luego... ¡Nuestro bendito carro DESAPARECIÓ!<\/p>\n<p>Resulta que hay un permiso con calcomanía obligatorio que no conocíamos y que nuestro carro no tenía porque es muy nuevo. Y eso que llevo viviendo en este complejo con este carro 3 cambios (18 semanas, casi 5 meses). Al final un miembro pasó por nosotros y el Élder Tucker (nuestro coordinador de vehículos) pudo ir a sacarlo del corralón, pero qué manera de empezar el día. Algo que he aprendido y que quiero compartir de estos cambios aquí en Tampa como entrenador y líder de distrito es que el Señor nos conoce, nos llamó y nos capacita.<\/p>\n<p>No sabía todo sobre ser líder de distrito, ni sobre el área nueva, ni cómo capacitar exactamente según las necesidades de mis compañeros. Cometí errores, pero como me pusieron en esa zona de crecimiento, sintiéndome incómodo, crecí mucho más de lo que habría crecido sin eso.<\/p>\n<p>¡Sean buenos con ustedes mismos! ¡Dios les ayudará! ¡La Expiación es el camino!<\/p>\n<p class=\"sign\">Los amo mucho! Hasta que esté en mi área nueva!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>sid<\/li>\n<li>Facebook Marketplace chistoso<\/li>\n<li>preparando la llamada de zona<\/li>\n<li>meme<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-10-24_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-24_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-24_0_2.jpg\" alt=\"\"><\/figure><\/div>", "text": "Pues eh, ahora soy 🧍‍♂️creador de contenido de Facebook 💫 Buenos días amigos! ¡Esta fue la última semana de los cambios y estuvo increíble! Mis compañeros y yo crecimos muchísimo juntos y nos divertimos un montón. Estoy muy agradecido por el tiempo que pasé con ellos. Lo cual supongo que da a entender que mi reinado del terror en Tampa se acabó. ¡Voy a reabrir Largo Sp (para élderes) con el Élder LuTu! Estoy emocionado de regresar a uno de mis lugares favoritos y con un querido amigo/hijo misional. El Élder Towne es el único que se queda, pero pronto se va a Brasil 🇧🇷. El Élder Rogers se va a Dade City con el Élder Dean. En fin, hablemos del resto de la semana Tuvimos nuestro último consejo de distrito, que estuvo divertido. Al principio de verdad pensé que habría muy pocos cambios, sobre todo en mi compañerismo, pero hay bastantes. Hicimos 2 intercambios esta semana: uno con South Tampa y el otro con los líderes de zona. Todos élderes fenomenales. No voy a ser líder de distrito el próximo cambio, pero no es por castigo ni nada; como misioneros se nos dan oportunidades para aprender y alguien más la necesita más ahorita. Me encantó, pero también me alegra tener más tiempo para enfocarme en mi área. Tocamos muchas puertas esta semana, más que nada preparando el futuro, ya que la mayoría de la gente estaba ocupada y no podía hablar en ese momento. Nos llamaron unos miembros que estaban de visita desde Nueva Jersey y necesitaban bendiciones, así que tuvimos la oportunidad de dárselas. ¡También tienen algunas referencias para nosotros aquí! Sobre el título del correo, sí, leyeron bien. De alguna manera me ha ido bien en Facebook con mis publicaciones del Evangelio medio esporádicas, tanto que ahora Facebook está difundiendo mis cosas como creador de contenido, ¡y esto quizás me permita llegar a más personas! Así que estoy emocionado y abierto a cualquier idea de publicaciones para seguir intentando recoger a Israel. Una última cosa de esta semana antes del pensamiento espiritual: Nos despertamos el domingo en la mañana, hacemos nuestro horario normal, salimos temprano para el consejo de barrio y luego... ¡Nuestro bendito carro DESAPARECIÓ! Resulta que hay un permiso con calcomanía obligatorio que no conocíamos y que nuestro carro no tenía porque es muy nuevo. Y eso que llevo viviendo en este complejo con este carro 3 cambios (18 semanas, casi 5 meses). Al final un miembro pasó por nosotros y el Élder Tucker (nuestro coordinador de vehículos) pudo ir a sacarlo del corralón, pero qué manera de empezar el día. Algo que he aprendido y que quiero compartir de estos cambios aquí en Tampa como entrenador y líder de distrito es que el Señor nos conoce, nos llamó y nos capacita. No sabía todo sobre ser líder de distrito, ni sobre el área nueva, ni cómo capacitar exactamente según las necesidades de mis compañeros. Cometí errores, pero como me pusieron en esa zona de crecimiento, sintiéndome incómodo, crecí mucho más de lo que habría crecido sin eso. ¡Sean buenos con ustedes mismos! ¡Dios les ayudará! ¡La Expiación es el camino! Los amo mucho! Hasta que esté en mi área nueva! Élder Jacobo Fotos: sid Facebook Marketplace chistoso preparando la llamada de zona meme"}, {"id": "l72", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">OCT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 72 · Largo", "title": "👻 Feliz Halloween 🎃", "date": "2022-10-31T13:49:00", "group": "2022-10", "html": "<div class=\"body\"><p>🧟‍♂️🤺¡Feliz noche de brujas!🧛‍♀️🥷<\/p>\n<p>Estou trabalhando duro aqui em Largo e tudo vai muito bem!<\/p>\n<p>Esta semana, la verdad, al principio fue desalentadora, ¡pero las cosas se ven mejor! Los cambios fueron el martes y nos dimos cuenta de que esto sería mucho más difícil de lo que pensábamos. Vivimos en Gulfport (la esquina de Saint Pete), compartiendo carro, y en un área casi muerta.<\/p>\n<p>Cuando me fui de Largo, estaba a reventar de amigos y había muchísimo trabajo por hacer. Ahora parece que estamos trabajando casi desde cero.<\/p>\n<p>Por suerte, tenemos unos miembros bestiales que se morían de ganas de que regresaran los élderes y han arrancado a toda velocidad con nosotros. Todavía hay mucho trabajo por hacer, pero poco a poco estamos encontrando más amigos y nos estamos esforzando por fortalecer las relaciones con los miembros.<\/p>\n<p>Tuvimos nuestro festival de otoño &amp; trunk or treat, y la conferencia de estaca. Las dos actividades muy divertidas, con algo de correr de aquí para allá asegurándonos de que todo estuviera bien. ¡Chequen la foto de la cajuela!<\/p>\n<p>Lo último, que de verdad me alegró la semana, fue el domingo. El domingo, después de la conferencia de estaca, nos fuimos a Tampa. ¡Mi amiga Yolennis se bautizó y quería que yo la bautizara! Fue increíble y una experiencia muy especial. ¡Pero el domingo no terminó ahí!<\/p>\n<p>También vi a otros amigos/miembros y pude despedirme en persona. Hugo estaba ahí y había tenido un accidente en el trabajo; yo estaba ahí por el bautismo y también pude estar ahí para él.<\/p>\n<p>Luego pude pasar a ver a la familia Franco y despedirme de ellos también. Toda una cadena de milagros de Dios que me permitió estar ahí para mis amigos antes de estar de lleno en St. Pete.<\/p>\n<p>Mosíah 24<\/p>\n<p>12 Y Alma y su pueblo no alzaron la voz al Señor su Dios, sino que le volcaron sus corazones; y él conoció los pensamientos de sus corazones.<\/p>\n<p>13 Y aconteció que la voz del Señor vino a ellos en sus aflicciones, diciendo: Alzad vuestras cabezas y animaos, porque sé del convenio que me habéis hecho; y yo haré convenio con mi pueblo y lo libraré del cautiverio.<\/p>\n<p>14 Y también aliviaré las cargas que pongan sobre vuestros hombros, de manera que no podréis sentirlas sobre vuestras espaldas, mientras estéis en servidumbre; y esto haré para que me seáis testigos en lo futuro, y para que sepáis de seguro que yo, Dios el Señor, visito a mi pueblo en sus aflicciones.<\/p>\n<p>Por medio de nosotros y de otros, Dios visita a nuestros amigos y a nosotros en nuestras aflicciones. ¡Confíen en Él!<\/p>\n<p class=\"sign\">Los amo muito!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Gyro<\/li>\n<li>Élder Chevy<\/li>\n<li>El Élder Owen &amp; nosotros<\/li>\n<li>¡El Élder LuTu &amp; yo otra vez juntos!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-10-31_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-31_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-31_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-31_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "👻 Feliz Halloween 🎃 🧟‍♂️🤺¡Feliz noche de brujas!🧛‍♀️🥷 Estou trabalhando duro aqui em Largo e tudo vai muito bem! Esta semana, la verdad, al principio fue desalentadora, ¡pero las cosas se ven mejor! Los cambios fueron el martes y nos dimos cuenta de que esto sería mucho más difícil de lo que pensábamos. Vivimos en Gulfport (la esquina de Saint Pete), compartiendo carro, y en un área casi muerta. Cuando me fui de Largo, estaba a reventar de amigos y había muchísimo trabajo por hacer. Ahora parece que estamos trabajando casi desde cero. Por suerte, tenemos unos miembros bestiales que se morían de ganas de que regresaran los élderes y han arrancado a toda velocidad con nosotros. Todavía hay mucho trabajo por hacer, pero poco a poco estamos encontrando más amigos y nos estamos esforzando por fortalecer las relaciones con los miembros. Tuvimos nuestro festival de otoño & trunk or treat, y la conferencia de estaca. Las dos actividades muy divertidas, con algo de correr de aquí para allá asegurándonos de que todo estuviera bien. ¡Chequen la foto de la cajuela! Lo último, que de verdad me alegró la semana, fue el domingo. El domingo, después de la conferencia de estaca, nos fuimos a Tampa. ¡Mi amiga Yolennis se bautizó y quería que yo la bautizara! Fue increíble y una experiencia muy especial. ¡Pero el domingo no terminó ahí! También vi a otros amigos/miembros y pude despedirme en persona. Hugo estaba ahí y había tenido un accidente en el trabajo; yo estaba ahí por el bautismo y también pude estar ahí para él. Luego pude pasar a ver a la familia Franco y despedirme de ellos también. Toda una cadena de milagros de Dios que me permitió estar ahí para mis amigos antes de estar de lleno en St. Pete. Mosíah 24 12 Y Alma y su pueblo no alzaron la voz al Señor su Dios, sino que le volcaron sus corazones; y él conoció los pensamientos de sus corazones. 13 Y aconteció que la voz del Señor vino a ellos en sus aflicciones, diciendo: Alzad vuestras cabezas y animaos, porque sé del convenio que me habéis hecho; y yo haré convenio con mi pueblo y lo libraré del cautiverio. 14 Y también aliviaré las cargas que pongan sobre vuestros hombros, de manera que no podréis sentirlas sobre vuestras espaldas, mientras estéis en servidumbre; y esto haré para que me seáis testigos en lo futuro, y para que sepáis de seguro que yo, Dios el Señor, visito a mi pueblo en sus aflicciones. Por medio de nosotros y de otros, Dios visita a nuestros amigos y a nosotros en nuestras aflicciones. ¡Confíen en Él! Los amo muito! Élder Jacobo Fotos: Gyro Élder Chevy El Élder Owen & nosotros ¡El Élder LuTu & yo otra vez juntos!"}, {"id": "l73", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["BR", "WS"], "moments": ["Baptism"], "extra": "Brazil Samoa", "kind": "Carta 73 · Largo", "title": "Buscando con todo & milagros", "date": "2022-11-07T12:45:00", "group": "2022-11", "html": "<div class=\"body\"><p>Talofa!<\/p>\n<p>¡Otra semana en Largo y esta estuvo mucho mejor! Todavía hemos estado buscando más que nada, pero estamos viendo algo de progreso.<\/p>\n<p>También empecé a aprender algo de samoano 🇼🇸 🇦🇸 con el Élder Lutu, lo cual ha sido un pequeño reto divertido. Nos hemos dado cuenta de que nos pusieron juntos por muchas razones (muchas todavía por descubrir), pero una de las principales son los idiomas y las culturas. Hablamos inglés y español, yo también hablo portugués y él habla samoano, así que estamos conectando con muchísima gente: latinos, brasileños y polinesios. ¡Esperamos que, trabajando con los miembros de cada barrio y hablando con todos, la zona explote y la obra progrese un montón!<\/p>\n<p>El lunes fue Halloween y, a diferencia del año pasado que nos quedamos adentro, tuvimos un reto de búsqueda. Igual regresamos más temprano de lo normal, pero hubo un reto entre las zonas y toda la misión de quién encontraba a más personas. Nuestra zona le ganó a la zona de Ocala, pero el campeón general fue Lakeland. También jugamos pickleball más temprano como distrito, disfrazados de Halloween, en el día de preparación. El martes fue nuestro primer consejo de distrito y pudimos fijar metas y conocer a los otros misioneros. Este cambio debería estar increíble. También pude ir de intercambio con el Élder Inkley, que fue una fiesta. Como ya dije, hemos estado buscando muchísimo, lo que nos ha llevado a dar muchas referencias, ¡pero también a encontrar una familia en nuestra área! Definitivamente un milagro. Poco a poco hemos ido conociendo mejor a los miembros compartiendo mensajes, pero esta semana debería irnos mejor porque más gente está disponible.<\/p>\n<p>Encontré a una de nuestras amigas por Facebook, lo cual estuvo padre porque normalmente se siente que publicar no sirve de nada, y ella de verdad está interesada en aprender ahorita. Les cuento de Yanet la próxima semana después de nuestra siguiente lección.<\/p>\n<p>Lo último importante de esta semana fue el funeral. El esposo de la Hermana Januaria falleció a los 62 años; fue bastante repentino e impactante para la familia, así que por favor oren por ellos. Tuvimos un servicio muy bonito para él el sábado, pero les queda mucho por sanar.<\/p>\n<p>La oración ha sido nuestra arma secreta esta semana. Oramos pidiendo ayuda, para encontrar personas, dones espirituales, etc. Y llegan siempre y cuando hagamos nuestra parte y los busquemos.<\/p>\n<p>DyC 46<\/p>\n<p>8 Por tanto, cuidaos a fin de que no seáis engañados; y para que no seáis engañados, buscad diligentemente los mejores dones, recordando siempre para qué son dados;<\/p>\n<p>9 porque de cierto os digo que se dan para el beneficio de los que me aman y guardan todos mis mandamientos, y de los que procuran hacerlo; para que se beneficien todos los que me buscan o me piden, que piden y no por una señal para satisfacer sus concupiscencias.<\/p>\n<p>10 Y además, de cierto os digo que quisiera que siempre recordaseis y retuvieseis en vuestras mentes cuáles son esos dones que se dan a la iglesia<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Élder Iacopo<\/p>\n<p>P.D. Nos estábamos preguntando cómo íbamos a bautizar a alguien, ya que no sabíamos si teníamos a alguien firme, ¡pero luego nos llegó una referencia que tiene fecha! Estamos súper emocionados y muy bendecidos por el Padre Celestial<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>lagartija en una cama de hojas<\/li>\n<li>chambeando en Facebook<\/li>\n<li>El Élder Owen y unos pájaros jaja<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-11-07_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-07_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "Buscando con todo & milagros Talofa! ¡Otra semana en Largo y esta estuvo mucho mejor! Todavía hemos estado buscando más que nada, pero estamos viendo algo de progreso. También empecé a aprender algo de samoano 🇼🇸 🇦🇸 con el Élder Lutu, lo cual ha sido un pequeño reto divertido. Nos hemos dado cuenta de que nos pusieron juntos por muchas razones (muchas todavía por descubrir), pero una de las principales son los idiomas y las culturas. Hablamos inglés y español, yo también hablo portugués y él habla samoano, así que estamos conectando con muchísima gente: latinos, brasileños y polinesios. ¡Esperamos que, trabajando con los miembros de cada barrio y hablando con todos, la zona explote y la obra progrese un montón! El lunes fue Halloween y, a diferencia del año pasado que nos quedamos adentro, tuvimos un reto de búsqueda. Igual regresamos más temprano de lo normal, pero hubo un reto entre las zonas y toda la misión de quién encontraba a más personas. Nuestra zona le ganó a la zona de Ocala, pero el campeón general fue Lakeland. También jugamos pickleball más temprano como distrito, disfrazados de Halloween, en el día de preparación. El martes fue nuestro primer consejo de distrito y pudimos fijar metas y conocer a los otros misioneros. Este cambio debería estar increíble. También pude ir de intercambio con el Élder Inkley, que fue una fiesta. Como ya dije, hemos estado buscando muchísimo, lo que nos ha llevado a dar muchas referencias, ¡pero también a encontrar una familia en nuestra área! Definitivamente un milagro. Poco a poco hemos ido conociendo mejor a los miembros compartiendo mensajes, pero esta semana debería irnos mejor porque más gente está disponible. Encontré a una de nuestras amigas por Facebook, lo cual estuvo padre porque normalmente se siente que publicar no sirve de nada, y ella de verdad está interesada en aprender ahorita. Les cuento de Yanet la próxima semana después de nuestra siguiente lección. Lo último importante de esta semana fue el funeral. El esposo de la Hermana Januaria falleció a los 62 años; fue bastante repentino e impactante para la familia, así que por favor oren por ellos. Tuvimos un servicio muy bonito para él el sábado, pero les queda mucho por sanar. La oración ha sido nuestra arma secreta esta semana. Oramos pidiendo ayuda, para encontrar personas, dones espirituales, etc. Y llegan siempre y cuando hagamos nuestra parte y los busquemos. DyC 46 8 Por tanto, cuidaos a fin de que no seáis engañados; y para que no seáis engañados, buscad diligentemente los mejores dones, recordando siempre para qué son dados; 9 porque de cierto os digo que se dan para el beneficio de los que me aman y guardan todos mis mandamientos, y de los que procuran hacerlo; para que se beneficien todos los que me buscan o me piden, que piden y no por una señal para satisfacer sus concupiscencias. 10 Y además, de cierto os digo que quisiera que siempre recordaseis y retuvieseis en vuestras mentes cuáles son esos dones que se dan a la iglesia Los amo! Élder Iacopo P.D. Nos estábamos preguntando cómo íbamos a bautizar a alguien, ya que no sabíamos si teníamos a alguien firme, ¡pero luego nos llegó una referencia que tiene fecha! Estamos súper emocionados y muy bendecidos por el Padre Celestial Fotos: lagartija en una cama de hojas chambeando en Facebook El Élder Owen y unos pájaros jaja"}, {"id": "l74", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": ["MX", "BR", "WS"], "moments": ["Holidays"], "extra": "Mexico Brazil Samoa", "kind": "Carta 74 · Largo", "title": "⚡️Volando chispas, 🤯llegando milagros, y nosotros nomás viviendo 🤙", "date": "2022-11-14T13:43:00", "group": "2022-11", "html": "<div class=\"body\"><p>Manuia Soifua!<\/p>\n<p>¡Bendecidas/Buenas tardes!<\/p>\n<p>Sí, sigo aprendiendo samoano, pero oigan, hay que encontrar cosas que te gusten y mostrarles tu amor a los demás. La cultura es muy importante para muchos: Latinoamérica, los brasileños, los polinesios, y hasta las pequeñas tradiciones familiares (como las galletas de la familia Jacobs en Navidad). ¡Todo eso es importante para quienes somos!<\/p>\n<p>Somos hijos de Dios<\/p>\n<p>Hijos del convenio<\/p>\n<p>Discípulos de Jesús el Cristo<\/p>\n<p>2 Nefi 25:<\/p>\n<p>26 Y hablamos de Cristo, nos regocijamos en Cristo, predicamos de Cristo, profetizamos de Cristo y escribimos según nuestras profecías, para que nuestros hijos sepan a qué fuente han de acudir para la remisión de sus pecados Fa'afetai!<\/p>\n<p>¡Gracias!<\/p>\n<p>En fin, vamos a esta semana...<\/p>\n<p>El martes tuvimos otro consejo de distrito y lo terminamos con sushi en Sushi Kabuki. Luego tuvimos un intercambio buenísimo con el Élder Devere, de redes sociales. Estuvo increíble ver cómo seguir aplicándolas a la obra misional y hacer crecer mi \"libro de área personal\", o sea, la gente que se ha sentido atraída al Evangelio por mí siendo yo mismo en línea.<\/p>\n<p>Esta semana estamos haciendo un #becausehegave #PorqueÉlnosdio para difundir gratitud y pensamientos edificantes. ¡Díganme si quieren unirse y les puedo mandar contenido ya hecho para que empiecen!<\/p>\n<p>Tenemos un nuevo amigo bien entusiasmado que se llama Javi, que sabe mucho de la Biblia y fue muy receptivo al Libro de Mormón. No se pierdan la próxima semana y las siguientes lecciones.<\/p>\n<p>Lo de las chispas en el título es por unos problemas con la secadora... nuestra secadora se descompuso de la nada y tuvimos que secar la ropa al aire por un tiempo. El problema de la secadora lo causó un enchufe en mal estado, que descubrimos el Élder Hammond (nuestro coordinador de vivienda) y yo cuando salieron chispas volando del enchufe mientras barríamos las pelusas 🐰, por suerte sin quemaduras 😉 Nuestro gran milagro de esta semana empezó el jueves en la noche con unas visitas rápidas. Estábamos buscando a un miembro pero sin suerte; cuando nos íbamos, dejamos una tarjeta en uno de los carros, pero tuve el sentimiento de que debíamos ponerla en los dos carros, lo que hizo que al día siguiente nos llegara un mensaje de Fermin. Él había hablado con misioneros en España, pero no así; nuestra tarjeta parece que de verdad lo tocó y quería hablar. Compartimos la Restauración del Evangelio y está muy interesado en aprender más con nosotros y con su propio estudio. Seguir al Espíritu es increíble.<\/p>\n<p>Comimos comida buenísima en el restaurante de unos miembros, en una fiesta de Acción de Gracias y de nuestra propia cocina. La vida es buena<\/p>\n<p class=\"sign\">Los amo chamos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>tienda de segunda mano (reto tipo intercambio de regalos de 5$)<\/li>\n<li>auténtica comida mexicana de la Hermana Isela en su restaurante Los Amigos<\/li>\n<li>atardecer<\/li>\n<li>vibra de la tarde<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-11-14_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-14_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-14_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-14_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-14_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-14_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-14_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "⚡️Volando chispas, 🤯llegando milagros, y nosotros nomás viviendo 🤙 Manuia Soifua! ¡Bendecidas/Buenas tardes! Sí, sigo aprendiendo samoano, pero oigan, hay que encontrar cosas que te gusten y mostrarles tu amor a los demás. La cultura es muy importante para muchos: Latinoamérica, los brasileños, los polinesios, y hasta las pequeñas tradiciones familiares (como las galletas de la familia Jacobs en Navidad). ¡Todo eso es importante para quienes somos! Somos hijos de Dios Hijos del convenio Discípulos de Jesús el Cristo 2 Nefi 25: 26 Y hablamos de Cristo, nos regocijamos en Cristo, predicamos de Cristo, profetizamos de Cristo y escribimos según nuestras profecías, para que nuestros hijos sepan a qué fuente han de acudir para la remisión de sus pecados Fa'afetai! ¡Gracias! En fin, vamos a esta semana... El martes tuvimos otro consejo de distrito y lo terminamos con sushi en Sushi Kabuki. Luego tuvimos un intercambio buenísimo con el Élder Devere, de redes sociales. Estuvo increíble ver cómo seguir aplicándolas a la obra misional y hacer crecer mi \"libro de área personal\", o sea, la gente que se ha sentido atraída al Evangelio por mí siendo yo mismo en línea. Esta semana estamos haciendo un #becausehegave #PorqueÉlnosdio para difundir gratitud y pensamientos edificantes. ¡Díganme si quieren unirse y les puedo mandar contenido ya hecho para que empiecen! Tenemos un nuevo amigo bien entusiasmado que se llama Javi, que sabe mucho de la Biblia y fue muy receptivo al Libro de Mormón. No se pierdan la próxima semana y las siguientes lecciones. Lo de las chispas en el título es por unos problemas con la secadora... nuestra secadora se descompuso de la nada y tuvimos que secar la ropa al aire por un tiempo. El problema de la secadora lo causó un enchufe en mal estado, que descubrimos el Élder Hammond (nuestro coordinador de vivienda) y yo cuando salieron chispas volando del enchufe mientras barríamos las pelusas 🐰, por suerte sin quemaduras 😉 Nuestro gran milagro de esta semana empezó el jueves en la noche con unas visitas rápidas. Estábamos buscando a un miembro pero sin suerte; cuando nos íbamos, dejamos una tarjeta en uno de los carros, pero tuve el sentimiento de que debíamos ponerla en los dos carros, lo que hizo que al día siguiente nos llegara un mensaje de Fermin. Él había hablado con misioneros en España, pero no así; nuestra tarjeta parece que de verdad lo tocó y quería hablar. Compartimos la Restauración del Evangelio y está muy interesado en aprender más con nosotros y con su propio estudio. Seguir al Espíritu es increíble. Comimos comida buenísima en el restaurante de unos miembros, en una fiesta de Acción de Gracias y de nuestra propia cocina. La vida es buena Los amo chamos! Elder Jacobs Fotos: tienda de segunda mano (reto tipo intercambio de regalos de 5$) auténtica comida mexicana de la Hermana Isela en su restaurante Los Amigos atardecer vibra de la tarde"}, {"id": "l75", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Holidays"], "extra": "", "kind": "Carta 75 · Largo", "title": "Porque Él dio 😇", "date": "2022-11-21T12:03:00", "group": "2022-11", "html": "<div class=\"body\"><p>Malo soifua!<\/p>\n<p>Esta semana no pasó mucho, pero igual estuvo bien.<\/p>\n<p>Muchos amigos estuvieron ocupados o nos dejaron en visto, así que se cancelaron muchas lecciones y nos quedó tiempo para buscar y conocer a los miembros. El carro del Élder Owen también estuvo en el taller esta semana, lo que limitó nuestro tiempo con él, pero está súper listo para arrancar esta semana. Nuestro amigo Fermin, del que les conté la semana pasada, ya no está muy interesado en reunirse con nosotros, pero seguimos siendo amigos y hablamos seguido. Una lección importante: ser amigos primero y enseñar gracias a esa amistad y ese amor ya establecidos. ¡Espero aprender más de él sobre idiomas, ya que es lingüista!<\/p>\n<p>Tuvimos un devocional interreligioso de Acción de Gracias que incluyó discursos de nuestro presidente de estaca, monjes, rabinos judíos, reverendos y unos números musicales increíbles. Una experiencia muy divertida, padre y a ratos rara. Estoy intentando tomar más fotos y hacer más recuerdos, lo que nos llevó a visitar el muelle a la hora de la cena/atardecer, junto con otras cosas random como los pavorreales que andan por el vecindario. Me encanta mi tiempo aquí a pesar de los contratiempos y de la chamba lenta.<\/p>\n<p>¡Recibimos otra referencia de Facebook y él también tiene fecha bautismal! El anterior no contestó y no funcionó, pero Emilio está muy emocionado por aprender más e intentar venir a la iglesia. ¡De hecho es alguien a quien le enseñé la última vez que estuve aquí! Un buen reencuentro con un viejo amigo.<\/p>\n<p>La luz del sol es limitada estos días, así que andamos a las carreras para aprovecharla toda y no pasar mucho frío, pero Florida sigue siendo bipolar. Ayer nos estábamos congelando y hoy estamos sudando otra vez.<\/p>\n<p>Ya viene el Día de Acción de Gracias, tenemos un montón de planes para visitar gente, y esta semana como misión la pasamos publicando gratitud.<\/p>\n<p>#becausehegave<\/p>\n<p>Vivir con más gratitud le ayuda a uno a recordar y sentir el amor infinito y perfecto de Dios. Me gusta \"Cuenta tus bendiciones\", sobre todo la estrofa 4:<\/p>\n<p>Así, en medio del conflicto, sea grande o pequeño,<\/p>\n<p>no te desanimes; Dios está sobre todo.<\/p>\n<p>Cuenta tus muchas bendiciones; ángeles vendrán,<\/p>\n<p>ayuda y consuelo te darán hasta el final de tu jornada...<\/p>\n<p class=\"sign\">Los amo mucho,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>atardecer en el muelle<\/li>\n<li>cena en casa del Élder Owen<\/li>\n<li>Noche de fútbol<\/li>\n<li>el granjero Owen<\/li>\n<li>pavorreales<\/li>\n<li>El Élder Lutu dormido<\/li>\n<li>Walmart<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-11-21_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-21_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "Porque Él dio 😇 Malo soifua! Esta semana no pasó mucho, pero igual estuvo bien. Muchos amigos estuvieron ocupados o nos dejaron en visto, así que se cancelaron muchas lecciones y nos quedó tiempo para buscar y conocer a los miembros. El carro del Élder Owen también estuvo en el taller esta semana, lo que limitó nuestro tiempo con él, pero está súper listo para arrancar esta semana. Nuestro amigo Fermin, del que les conté la semana pasada, ya no está muy interesado en reunirse con nosotros, pero seguimos siendo amigos y hablamos seguido. Una lección importante: ser amigos primero y enseñar gracias a esa amistad y ese amor ya establecidos. ¡Espero aprender más de él sobre idiomas, ya que es lingüista! Tuvimos un devocional interreligioso de Acción de Gracias que incluyó discursos de nuestro presidente de estaca, monjes, rabinos judíos, reverendos y unos números musicales increíbles. Una experiencia muy divertida, padre y a ratos rara. Estoy intentando tomar más fotos y hacer más recuerdos, lo que nos llevó a visitar el muelle a la hora de la cena/atardecer, junto con otras cosas random como los pavorreales que andan por el vecindario. Me encanta mi tiempo aquí a pesar de los contratiempos y de la chamba lenta. ¡Recibimos otra referencia de Facebook y él también tiene fecha bautismal! El anterior no contestó y no funcionó, pero Emilio está muy emocionado por aprender más e intentar venir a la iglesia. ¡De hecho es alguien a quien le enseñé la última vez que estuve aquí! Un buen reencuentro con un viejo amigo. La luz del sol es limitada estos días, así que andamos a las carreras para aprovecharla toda y no pasar mucho frío, pero Florida sigue siendo bipolar. Ayer nos estábamos congelando y hoy estamos sudando otra vez. Ya viene el Día de Acción de Gracias, tenemos un montón de planes para visitar gente, y esta semana como misión la pasamos publicando gratitud. #becausehegave Vivir con más gratitud le ayuda a uno a recordar y sentir el amor infinito y perfecto de Dios. Me gusta \"Cuenta tus bendiciones\", sobre todo la estrofa 4: Así, en medio del conflicto, sea grande o pequeño, no te desanimes; Dios está sobre todo. Cuenta tus muchas bendiciones; ángeles vendrán, ayuda y consuelo te darán hasta el final de tu jornada... Los amo mucho, Elder Jacobs Fotos: atardecer en el muelle cena en casa del Élder Owen Noche de fútbol el granjero Owen pavorreales El Élder Lutu dormido Walmart"}, {"id": "l76", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": ["VE", "WS"], "moments": ["Baptism", "Holidays"], "extra": "Venezuela Samoa", "kind": "Carta 76 · Largo", "title": "Cómo casi exploto 🤯🦃🫔", "date": "2022-11-28T15:07:00", "group": "2022-11", "html": "<div class=\"body\"><p>Feliz día de acción de gracias!<\/p>\n<p>Espero que tuvieran mucha comida y tiempo con familia y amigos<\/p>\n<p>Esta semana estuvo muy bien, mucho mejor que la anterior. Empezamos la semana con unas visitas rápidas a miembros que nos presentaron a Haydee, Franklin y los Tuinakavandra (de Fiyi). Todas las visitas estuvieron increíbles y nos dieron algunas referencias en las que tenemos muchas esperanzas, pero eso lo veremos esta semana.<\/p>\n<p>El martes no tuvimos consejo de distrito, pero igual tuvimos un intercambio que estuvo increíble y nos dio un montón de lecciones de contacto. ¡Puede que también hayamos encontrado una nueva familia para enseñar! Yaima &amp; Rafael<\/p>\n<p>El resto de la semana, la obra misional con amigos y miembros fue bastante tranquila: lecciones que se caían, reprogramar y visitas random. Algo muy padre pasó con Emilio. Le enseñé la última vez que estuve aquí y se acuerda bien de mí y también de las lecciones. Nomás estamos trabajando en que venga a la iglesia.<\/p>\n<p>El Día del Pavo, Thanksgiving, día de acción de gracias estuvo épico. Tuvimos consejo de distrito y luego un almuerzo de distrito buenísimo (bueno, más o menos, aparte de lo que yo traje/hice, ya que soy el único que sabe cocinar). También tuvimos otro almuerzo con miembros de la estaca que no tienen familia, una carne asada con unos samoanos y una cena con el tío Fatu (otro samoano). Lo mejor de la semana fue el bautismo de Jorge &amp; Ester el domingo. Pude regresar y disfrutar estar con la familia Franco. De verdad son de las personas más padres y amorosas que conozco y estoy muy emocionado por su futuro. Recuerden que el Espíritu es clave en todas las cosas:<\/p>\n<p>El profeta José nos dio el ejemplo de cómo recibir dirección y consuelo espirituales continuos por medio del Espíritu Santo.<\/p>\n<p>La primera decisión que tomó fue ser humilde ante Dios.<\/p>\n<p>La segunda fue orar con fe en el Señor Jesucristo.<\/p>\n<p>La tercera fue obedecer con exactitud. La obediencia puede significar moverse con rapidez. Puede significar prepararse. O puede significar esperar con paciencia más inspiración.<\/p>\n<p>Y la cuarta es orar para conocer las necesidades y el corazón de los demás y cómo ayudarlos por el Señor. José oró por los santos en angustia cuando estaba en la cárcel. He tenido la oportunidad de observar a los profetas de Dios mientras oran, piden inspiración, reciben dirección y actúan conforme a ella.<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2018/04/his-spirit-to-be-with-you?lang=eng<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Intercambio con el Élder Sierra<\/li>\n<li>pato<\/li>\n<li>la hermana Isela haciendo su magia con los tacos otra vez<\/li>\n<li>Acción de Gracias del distrito<\/li>\n<li>¡Franklin &amp; Raul nos visitaron desde Brandon!<\/li>\n<li>hallaca (platillo navideño tradicional venezolano)<\/li>\n<li>un postre súper rico (¡tienen que probarlo!)<\/li>\n<li>bautismo (los Franco &amp; yo pudimos ver a Nicolas)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-11-28_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-28_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-28_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_7.jpg\" alt=\"\"><
