. La tercera fue obedecer con exactitud. La obediencia puede significar moverse con rapidez. Puede significar prepararse. O puede significar esperar con paciencia más inspiración. Y la cuarta es orar para conocer las necesidades y el corazón de los demás y cómo ayudarlos por el Señor. José oró por los santos en angustia cuando estaba en la cárcel. He tenido la oportunidad de observar a los profetas de Dios mientras oran, piden inspiración, reciben dirección y actúan conforme a ella. https://www.churchofjesuschrist.org/study/general-conference/2018/04/his-spirit-to-be-with-you?lang=eng Los amo! Elder Jacobs Fotos: Intercambio con el Élder Sierra pato la hermana Isela haciendo su magia con los tacos otra vez Acción de Gracias del distrito ¡Franklin & Raul nos visitaron desde Brandon! hallaca (platillo navideño tradicional venezolano) un postre súper rico (¡tienen que probarlo!) bautismo (los Franco & yo pudimos ver a Nicolas)"}, {"id": "l77", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">DIC 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": [], "moments": ["Holidays"], "extra": "", "kind": "Carta 77 · Largo", "title": "El fin de Largo...", "date": "2022-12-05T12:11:00", "group": "2022-12", "html": "<div class=\"body\"><p>Hola! Como están amigos y familiares?<\/p>\n<p>Sí, así es, llegué al final de mi tiempo en Largo. Llegaron los cambios y me voy a Fort Myers. Estoy emocionado porque ahí hay mucho trabajo, sobre todo en portugués. El Élder Lutu se queda.<\/p>\n<p>Esta semana estuvo bien, aunque tristemente no pasó mucho con los amigos. Tuvimos que dejar a muchos porque estaban muy ocupados y, la verdad, no estaban interesados. Lo mejor fue que hubo 5 amigos en la iglesia, porque una miembro trajo a todos sus nietos ya grandes. ¡¡Veremos si pronto les podemos enseñar!!<\/p>\n<p>¡El devocional de Navidad estuvo buenísimo! Y también Luz de las naciones, ¡vean los dos lo antes posible! Música, mensajes y espíritu increíbles.<\/p>\n<p>Hicimos un montón de visitas a miembros, ganamos más confianza y conseguimos referencias. También hicimos un intercambio buenísimo con el Élder Condie. Fue divertido estar con él y aprender tanto.<\/p>\n<p>Perdón por el correo corto, no pasó mucho y estoy ocupado empacando. Cuéntenme cómo están USTEDES y voy a intentar contestarles<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>águila calva<\/li>\n<li>¡Cena con el Élder Owen!<\/li>\n<li>una vasija nativo americana de Arizona<\/li>\n<li>🐙<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-12-05_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-05_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-05_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-05_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "El fin de Largo... Hola! Como están amigos y familiares? Sí, así es, llegué al final de mi tiempo en Largo. Llegaron los cambios y me voy a Fort Myers. Estoy emocionado porque ahí hay mucho trabajo, sobre todo en portugués. El Élder Lutu se queda. Esta semana estuvo bien, aunque tristemente no pasó mucho con los amigos. Tuvimos que dejar a muchos porque estaban muy ocupados y, la verdad, no estaban interesados. Lo mejor fue que hubo 5 amigos en la iglesia, porque una miembro trajo a todos sus nietos ya grandes. ¡¡Veremos si pronto les podemos enseñar!! ¡El devocional de Navidad estuvo buenísimo! Y también Luz de las naciones, ¡vean los dos lo antes posible! Música, mensajes y espíritu increíbles. Hicimos un montón de visitas a miembros, ganamos más confianza y conseguimos referencias. También hicimos un intercambio buenísimo con el Élder Condie. Fue divertido estar con él y aprender tanto. Perdón por el correo corto, no pasó mucho y estoy ocupado empacando. Cuéntenme cómo están USTEDES y voy a intentar contestarles Los amo! Élder Jacobo Fotos: águila calva ¡Cena con el Élder Owen! una vasija nativo americana de Arizona 🐙"}, {"id": "l78", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">DIC 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": ["VE", "BR"], "moments": ["Holidays"], "extra": "Venezuela Brazil", "kind": "Carta 78 · Fort Myers", "title": "🇧🇷😎 Brazileros por todos lados! 🇧🇷", "date": "2022-12-12T15:03:00", "group": "2022-12", "html": "<div class=\"body\"><p>Boa tarde amigos, espero que estejam bem e tiveram uma boa semana. A minha foi muito bem!<\/p>\n<p>Me está encantando mi nueva área y todas las cosas divertidas que estamos haciendo. Al Élder O'Neill y a mí también nos va súper bien, con muchas risas y buen trabajo. Incluida la bici, que es algo medio nuevo para mí porque antes tuve la suerte de no tener que usarla mucho. Tristemente, alguien se robó mis luces y el asiento de mi bici, así que ojalá los disfrute y el Espíritu le dé un buen zape por robar. Probablemente esta es la vez que más rápido he llegado a conocer a los miembros. Hemos tenido comidas con miembros, lecciones, la iglesia y otras reuniones, y es increíble cuánto quieren ayudarnos.<\/p>\n<p>Tenemos unos amigos muy padres: Melissa, Pablo, Julio, doina, yamila, Omar y muchos más que estoy intentando conocer. Nuestra clase de inglés está buenísima ¡y hay brasileños ahí! Me enseñaron unas palabras que usan mucho, pero son jerga y no las supieron explicar bien, así que todavía estoy tratando de descifrarlas.<\/p>\n<p>¡Pero hay brasileños por todos lados! Literalmente por todos lados cerca de donde vivimos, lo que nos ha llevado a tener muchas interacciones padres y a fortalecer mi habilidad para hablar. Hasta encontramos una nueva familia (¡y más posibles también!): Sandro, Hector, Victor y su esposa, a quien todavía no conocemos. Y pude practicar más con la familia Omar, que se mudó al barrio hace apenas un mes y con quienes comimos el domingo en la noche.<\/p>\n<p>Este fin de semana es nuestra fiesta de Navidad y el jueves es la conferencia de zona de Navidad, así que hay muchas cosas padres esta semana, pero eso también significa una manejada larguísima. Eso es algo que he aprendido de la zona de Fort Myers: viajes largos, millas insuficientes, todos andan en bici.<\/p>\n<p>Pero me está encantando mi tiempo aquí y me está yendo muy bien.<\/p>\n<p>Aquí está una escritura padre que leí esta semana en mi estudio<\/p>\n<p class=\"sign\">Los amo muito,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>almacén del obispo<\/li>\n<li>🐝<\/li>\n<li>me regalaron V8 de parte de Messia (nueva amiga brasileña)<\/li>\n<li>Madi, la perrita de nuestros vecinos, vino a visitarnos mientras hacíamos nuestros contactos de la mañana<\/li>\n<li>Katy (los moon pies venezolanos, muuuucho mejores)<\/li>\n<li>los niños de la Primaria nos atacaron con calcomanías para una actividad 😳 😆<\/li>\n<li>cena con la familia Omar<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>Alma 26:<\/p>\n<p>11 Mas Ammón le dijo: No me jacto de mi propia fuerza, ni de mi propia sabiduría; mas he aquí, mi gozo es completo; sí, mi corazón rebosa de gozo, y me regocijaré en mi Dios.<\/p>\n<p>12 Sí, sé que nada soy; en cuanto a mi fuerza, soy débil; por tanto, no me jactaré de mí mismo, sino que me gloriaré en mi Dios, porque con su fuerza puedo hacer todas las cosas; sí, he aquí, hemos obrado muchos grandes milagros en esta tierra, por los cuales alabaremos su nombre para siempre.<\/p><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-12-12_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-12_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-12_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-12_0_8.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_406.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🇧🇷😎 Brazileros por todos lados! 🇧🇷 Boa tarde amigos, espero que estejam bem e tiveram uma boa semana. A minha foi muito bem! Me está encantando mi nueva área y todas las cosas divertidas que estamos haciendo. Al Élder O'Neill y a mí también nos va súper bien, con muchas risas y buen trabajo. Incluida la bici, que es algo medio nuevo para mí porque antes tuve la suerte de no tener que usarla mucho. Tristemente, alguien se robó mis luces y el asiento de mi bici, así que ojalá los disfrute y el Espíritu le dé un buen zape por robar. Probablemente esta es la vez que más rápido he llegado a conocer a los miembros. Hemos tenido comidas con miembros, lecciones, la iglesia y otras reuniones, y es increíble cuánto quieren ayudarnos. Tenemos unos amigos muy padres: Melissa, Pablo, Julio, doina, yamila, Omar y muchos más que estoy intentando conocer. Nuestra clase de inglés está buenísima ¡y hay brasileños ahí! Me enseñaron unas palabras que usan mucho, pero son jerga y no las supieron explicar bien, así que todavía estoy tratando de descifrarlas. ¡Pero hay brasileños por todos lados! Literalmente por todos lados cerca de donde vivimos, lo que nos ha llevado a tener muchas interacciones padres y a fortalecer mi habilidad para hablar. Hasta encontramos una nueva familia (¡y más posibles también!): Sandro, Hector, Victor y su esposa, a quien todavía no conocemos. Y pude practicar más con la familia Omar, que se mudó al barrio hace apenas un mes y con quienes comimos el domingo en la noche. Este fin de semana es nuestra fiesta de Navidad y el jueves es la conferencia de zona de Navidad, así que hay muchas cosas padres esta semana, pero eso también significa una manejada larguísima. Eso es algo que he aprendido de la zona de Fort Myers: viajes largos, millas insuficientes, todos andan en bici. Pero me está encantando mi tiempo aquí y me está yendo muy bien. Aquí está una escritura padre que leí esta semana en mi estudio Los amo muito, Elder Jacobs Fotos: almacén del obispo 🐝 me regalaron V8 de parte de Messia (nueva amiga brasileña) Madi, la perrita de nuestros vecinos, vino a visitarnos mientras hacíamos nuestros contactos de la mañana Katy (los moon pies venezolanos, muuuucho mejores) los niños de la Primaria nos atacaron con calcomanías para una actividad 😳 😆 cena con la familia Omar Alma 26: 11 Mas Ammón le dijo: No me jacto de mi propia fuerza, ni de mi propia sabiduría; mas he aquí, mi gozo es completo; sí, mi corazón rebosa de gozo, y me regocijaré en mi Dios. 12 Sí, sé que nada soy; en cuanto a mi fuerza, soy débil; por tanto, no me jactaré de mí mismo, sino que me gloriaré en mi Dios, porque con su fuerza puedo hacer todas las cosas; sí, he aquí, hemos obrado muchos grandes milagros en esta tierra, por los cuales alabaremos su nombre para siempre. Más de esta semana"}, {"id": "l79", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">DIC 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Holidays"], "extra": "", "kind": "Carta 79 · Fort Myers", "title": "🎄🎅Feliz Natal! & villancicos 🎶🎵", "date": "2022-12-26T08:52:00", "group": "2022-12", "html": "<div class=\"body\"><p>Feliz Natal!<\/p>\n<p>Espero que todos hayan podido disfrutar dulces, canciones y tiempo con la familia y los amigos. Yo pude y estuvo genial. Con la Navidad esta semana y las celebraciones latinas empezando el 24, la obra iba bien y luego casi se detuvo por completo.<\/p>\n<p>El martes tuvimos un montón de lecciones en portugués, lo cual estuvo increíble pero también me hizo muy humilde, porque en algunos momentos podía enseñar fácilmente, pero en otros fue más difícil dependiendo de su Sotaqui (acento) y de los principios que enseñábamos. También pudimos hablar con algunas personas nuevas que recibimos como referencias y estamos emocionados de ver qué pasará con ellas en el futuro. 🤞¡Esperamos que haya un bautismo pronto!<\/p>\n<p>Este año disfrutamos cantar villancicos. El año pasado nos quedamos adentro haciendo otras cosas, hablando con la familia o con miembros, pero este año vivimos el gozo de cantar. Nos juntamos como misioneros y distritos varias veces a cantar villancicos y fue increíble poder hablar con tanta gente, cada uno en su idioma, y también sentir al Espíritu testificar de las canciones y su mensaje. Vimos a mucha gente sentirse más amada y rodeada de amigos mientras los visitábamos.<\/p>\n<p>DyC 25<\/p>\n<p>12 Porque mi alma se deleita en el canto del corazón; sí, la canción de los justos es una oración para mí, y será contestada con una bendición sobre su cabeza.<\/p>\n<p>13 Por lo tanto, eleva tu corazón y regocíjate, y adhiérete a los convenios que has hecho.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>¡corbatas de llamas!<\/li>\n<li>galletas<\/li>\n<li>cantando villancicos con los otros élderes de español<\/li>\n<li>¡este fin de semana bajamos a los 40s (°F)!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-12-26_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-26_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-26_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-26_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-26_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "🎄🎅Feliz Natal! & villancicos 🎶🎵 Feliz Natal! Espero que todos hayan podido disfrutar dulces, canciones y tiempo con la familia y los amigos. Yo pude y estuvo genial. Con la Navidad esta semana y las celebraciones latinas empezando el 24, la obra iba bien y luego casi se detuvo por completo. El martes tuvimos un montón de lecciones en portugués, lo cual estuvo increíble pero también me hizo muy humilde, porque en algunos momentos podía enseñar fácilmente, pero en otros fue más difícil dependiendo de su Sotaqui (acento) y de los principios que enseñábamos. También pudimos hablar con algunas personas nuevas que recibimos como referencias y estamos emocionados de ver qué pasará con ellas en el futuro. 🤞¡Esperamos que haya un bautismo pronto! Este año disfrutamos cantar villancicos. El año pasado nos quedamos adentro haciendo otras cosas, hablando con la familia o con miembros, pero este año vivimos el gozo de cantar. Nos juntamos como misioneros y distritos varias veces a cantar villancicos y fue increíble poder hablar con tanta gente, cada uno en su idioma, y también sentir al Espíritu testificar de las canciones y su mensaje. Vimos a mucha gente sentirse más amada y rodeada de amigos mientras los visitábamos. DyC 25 12 Porque mi alma se deleita en el canto del corazón; sí, la canción de los justos es una oración para mí, y será contestada con una bendición sobre su cabeza. 13 Por lo tanto, eleva tu corazón y regocíjate, y adhiérete a los convenios que has hecho. Los amo! Elder Jacobs Fotos: ¡corbatas de llamas! galletas cantando villancicos con los otros élderes de español ¡este fin de semana bajamos a los 40s (°F)!"}, {"id": "l80", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ENE 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CU\">🇨🇺 Cuba<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["CU", "BR"], "moments": [], "extra": "Cuba Brazil", "kind": "Carta 80 · Fort Myers", "title": "🎊🎉Feliz ano novo 🤯 2️⃣0️⃣2️⃣3️⃣", "date": "2023-01-02T09:50:00", "group": "2023-01", "html": "<div class=\"body\"><p>¡Feliz año nuevo! Espero que hayan disfrutado comida y cosas o algo así. Nosotros nos fuimos a dormir como siempre y escuchamos unos fuegos artificiales.<\/p>\n<p>Esta semana me hizo valorar mucho mi cuerpo y nuestro carro. Con carro compartido, un área enorme y mucha gente a quien visitar/enseñar, nos quedamos casi sin millas esta última semana y solo manejamos el miércoles. Así que decir que estoy cansado es quedarse corto, pero he disfrutado arreglar mi bici y andar paseando. No todos los días son tan buenos por el clima o por la cantidad de millas que hay que pedalear, pero definitivamente vale la pena. Así también hemos tenido más contacto con la gente y hasta algunos milagros.<\/p>\n<p>Encontramos a una miembro caminando con sus hijos; al principio pasamos de largo, pero luego el Élder O'Neill dijo que deberíamos dar la vuelta, que es lo que yo también medio pensé. Ella nos vio, nos reconoció y había orado para que regresáramos. Estuvo padre poder escucharla y ver cómo podemos apoyarla. Vino a la iglesia y los miembros la recibieron con los brazos abiertos 😁 Esta semana me enseñó mucho sobre el albedrío y el plan de Dios. Teníamos muchas lecciones agendadas, que llenaron nuestra semana casi de inmediato, casi sin espacio libre para el martes en la tarde, lo cual estuvo increíble. Pero, como descubrimos durante la semana, pronto muchas se cancelaron o se reprogramaron, dejando huecos vacíos a última hora y a nosotros saliendo a buscar, pasando a ver a gente y revisando nuestra lista de posibles personas a quienes enseñar. Fue muy frustrante, pero también sé cuánto nos enseñó, y las cosas que pudimos hacer en su lugar fueron mejores.<\/p>\n<p>2 Nefi 27:23<\/p>\n<p>Porque he aquí, yo soy Dios; y soy un Dios de milagros; y manifestaré al mundo que soy el mismo ayer, hoy y para siempre; y no obro entre los hijos de los hombres sino de conformidad con su fe.<\/p>\n<p>En cuanto al resto de la semana:<\/p>\n<ul class=\"bul\">\n<li>terminé 2 Nefi en portugués<\/li>\n<li>año nuevo<\/li>\n<li>intercambio con el Élder Cook (nos divertimos un montón andando en bici y siguiendo al Espíritu sobre a quién visitar)<\/li>\n<li>andar en bici por la ciudad sin manos es lo nuevo<\/li>\n<li>ahora la iglesia es a las 11 🙏<\/li>\n<li>hice un pernil de cerdo épico (arroz cubano, frijoles negros y pimientos) 😋<\/li>\n<li>¡He podido tener conversaciones bastante padres y más complejas en portugués! Hablamos de la gramática del inglés y de por qué los que hablan portugués pueden pronunciar el inglés mejor que los que hablan español<\/li>\n<\/ul>\n<p>Como ya dije, las lecciones canceladas hicieron la semana más lenta, además de las fiestas, pero todo está bien. ¡Recuerden que Dios los ama!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>intercambio con el Élder Cook(ie)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-02_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-02_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "🎊🎉Feliz ano novo 🤯 2️⃣0️⃣2️⃣3️⃣ ¡Feliz año nuevo! Espero que hayan disfrutado comida y cosas o algo así. Nosotros nos fuimos a dormir como siempre y escuchamos unos fuegos artificiales. Esta semana me hizo valorar mucho mi cuerpo y nuestro carro. Con carro compartido, un área enorme y mucha gente a quien visitar/enseñar, nos quedamos casi sin millas esta última semana y solo manejamos el miércoles. Así que decir que estoy cansado es quedarse corto, pero he disfrutado arreglar mi bici y andar paseando. No todos los días son tan buenos por el clima o por la cantidad de millas que hay que pedalear, pero definitivamente vale la pena. Así también hemos tenido más contacto con la gente y hasta algunos milagros. Encontramos a una miembro caminando con sus hijos; al principio pasamos de largo, pero luego el Élder O'Neill dijo que deberíamos dar la vuelta, que es lo que yo también medio pensé. Ella nos vio, nos reconoció y había orado para que regresáramos. Estuvo padre poder escucharla y ver cómo podemos apoyarla. Vino a la iglesia y los miembros la recibieron con los brazos abiertos 😁 Esta semana me enseñó mucho sobre el albedrío y el plan de Dios. Teníamos muchas lecciones agendadas, que llenaron nuestra semana casi de inmediato, casi sin espacio libre para el martes en la tarde, lo cual estuvo increíble. Pero, como descubrimos durante la semana, pronto muchas se cancelaron o se reprogramaron, dejando huecos vacíos a última hora y a nosotros saliendo a buscar, pasando a ver a gente y revisando nuestra lista de posibles personas a quienes enseñar. Fue muy frustrante, pero también sé cuánto nos enseñó, y las cosas que pudimos hacer en su lugar fueron mejores. 2 Nefi 27:23 Porque he aquí, yo soy Dios; y soy un Dios de milagros; y manifestaré al mundo que soy el mismo ayer, hoy y para siempre; y no obro entre los hijos de los hombres sino de conformidad con su fe. En cuanto al resto de la semana: terminé 2 Nefi en portugués año nuevo intercambio con el Élder Cook (nos divertimos un montón andando en bici y siguiendo al Espíritu sobre a quién visitar) andar en bici por la ciudad sin manos es lo nuevo ahora la iglesia es a las 11 🙏 hice un pernil de cerdo épico (arroz cubano, frijoles negros y pimientos) 😋 ¡He podido tener conversaciones bastante padres y más complejas en portugués! Hablamos de la gramática del inglés y de por qué los que hablan portugués pueden pronunciar el inglés mejor que los que hablan español Como ya dije, las lecciones canceladas hicieron la semana más lenta, además de las fiestas, pero todo está bien. ¡Recuerden que Dios los ama! Los amo, Elder Jacobs Fotos: intercambio con el Élder Cook(ie)"}, {"id": "l81", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ENE 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Carta 81 · Fort Myers", "title": "🇧🇷 Tiempo brasileño e intercambios 🔄", "date": "2023-01-09T12:33:00", "group": "2023-01", "html": "<div class=\"body\"><p>Oi! Beleza?<\/p>\n<p>¿Todo bonito?<\/p>\n<p>Nuestra semana estuvo bonita, disfrutamos de un clima excelente y todavía algo de calor en las tardes, pero eso es de esperarse aquí. La semana empezó súper bien con un lunes en la noche muy guiado por el Espíritu, que nos llevó a unas lecciones increíbles y a una nueva familia brasileña para enseñar.<\/p>\n<p>Luego vino el loco doble intercambio.<\/p>\n<p>Sí, estuve fuera de mi área 48 horas (más o menos), ¡pero al Élder O'Neill le fue súper bien! ¡Dio un montón de lecciones en español y hasta algunas en portugués él solo!<\/p>\n<p>Mientras yo andaba tranquilo enseñando en inglés con el Élder Anderson y luego en español con el Élder Nielson al día siguiente. Fueron buenos intercambios, pero se sintió súper raro una vez de vuelta en el área y con el Élder O'Neill.<\/p>\n<p>El resto de la semana estuvo bastante bien; teníamos algunas lecciones agendadas y algunas se cayeron, lo cual tristemente se ha vuelto lo normal.<\/p>\n<p>Encontramos otras 2 familias brasileñas más<\/p>\n<p>Definitivamente todavía me cuesta a veces hablar portugués, ya sea en ciertas situaciones de enseñanza o en la plática casual, pero definitivamente está mejorando y se nota, porque la gente ha estado más abierta con nosotros y el Espíritu ha testificado muy fuertemente. También tuvimos entrevistas con el Presidente, que estuvieron increíbles. Veremos qué pasa en los cambios, tiene algunas ideas de cambios 👀<\/p>\n<p>En fin, aquí está el pensamiento de esta semana:<\/p>\n<p>\"...¿cómo es que no sabes la respuesta a esta pregunta?” Él simplemente se encogió de hombros, sonrió y dijo con confianza: “Jesús”.<\/p>\n<p>La respuesta es Jesús<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2022/10/52olsen?lang=eng<\/p>\n<p>Sé que Cristo es la respuesta aun cuando nos sentimos impotentes y sin esperanza. Él siempre está con nosotros y siempre nos ama sin importar las circunstancias, los pecados o lo que podamos pensar.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Élder Nielson (diversión de intercambio)<\/li>\n<li>traduciendo a todo vapor<\/li>\n<li>cantando villancicos hace un tiempo<\/li>\n<li>¡qué vista increíble!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-01-09_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-09_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-09_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-09_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-09_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "🇧🇷 Tiempo brasileño e intercambios 🔄 Oi! Beleza? ¿Todo bonito? Nuestra semana estuvo bonita, disfrutamos de un clima excelente y todavía algo de calor en las tardes, pero eso es de esperarse aquí. La semana empezó súper bien con un lunes en la noche muy guiado por el Espíritu, que nos llevó a unas lecciones increíbles y a una nueva familia brasileña para enseñar. Luego vino el loco doble intercambio. Sí, estuve fuera de mi área 48 horas (más o menos), ¡pero al Élder O'Neill le fue súper bien! ¡Dio un montón de lecciones en español y hasta algunas en portugués él solo! Mientras yo andaba tranquilo enseñando en inglés con el Élder Anderson y luego en español con el Élder Nielson al día siguiente. Fueron buenos intercambios, pero se sintió súper raro una vez de vuelta en el área y con el Élder O'Neill. El resto de la semana estuvo bastante bien; teníamos algunas lecciones agendadas y algunas se cayeron, lo cual tristemente se ha vuelto lo normal. Encontramos otras 2 familias brasileñas más Definitivamente todavía me cuesta a veces hablar portugués, ya sea en ciertas situaciones de enseñanza o en la plática casual, pero definitivamente está mejorando y se nota, porque la gente ha estado más abierta con nosotros y el Espíritu ha testificado muy fuertemente. También tuvimos entrevistas con el Presidente, que estuvieron increíbles. Veremos qué pasa en los cambios, tiene algunas ideas de cambios 👀 En fin, aquí está el pensamiento de esta semana: \"...¿cómo es que no sabes la respuesta a esta pregunta?” Él simplemente se encogió de hombros, sonrió y dijo con confianza: “Jesús”. La respuesta es Jesús https://www.churchofjesuschrist.org/study/general-conference/2022/10/52olsen?lang=eng Sé que Cristo es la respuesta aun cuando nos sentimos impotentes y sin esperanza. Él siempre está con nosotros y siempre nos ama sin importar las circunstancias, los pecados o lo que podamos pensar. Los amo! Élder Jacobo Fotos: Élder Nielson (diversión de intercambio) traduciendo a todo vapor cantando villancicos hace un tiempo ¡qué vista increíble!"}, {"id": "l82", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ENE 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><\/div>", "cultures": ["PE"], "moments": [], "extra": "Peru", "kind": "Carta 82 · Fort Myers", "title": "Nuevo crecimiento 🌱 pero el final de otro cambio🤳", "date": "2023-01-16T17:46:00", "group": "2023-01", "html": "<div class=\"body\"><p>Oi! Deus lhe abençoe!<\/p>\n<p>¡Hola! ¡Dios te bendiga!<\/p>\n<p>Fue otra semana nomás disfrutando la vida misional, sobre todo aquí en Rio Vista. Tuvimos más intercambios esta semana, pero separados, así que no tan estresante. Y hemos estado bastante ocupados como siempre. Ojalá la próxima semana se calme más y podamos manejar mejor todo.<\/p>\n<p>Nuestra semana empezó con una lección con Doina, una persona que encontramos al principio del cambio pero a la que no habíamos podido contactar. Pasamos a verla y ha estado leyendo y diciéndoles a otros que tiene una iglesia (o sea, la nuestra) y que le gusta, a pesar de que solo la visitamos una vez hace tiempo. ¡Qué emoción!<\/p>\n<p>Luego una lección con un converso reciente y su esposa, lo cual es emocionante porque ella se ve muy emocionada y con ganas de leer más del Libro de Mormón (app). ¡Disponible para ustedes en su celular!<\/p>\n<p>Tuvimos la clase de inglés el miércoles después de una semana de descanso y llegó mucha gente, ¡y luego tuvimos nuestra primera en Fort Myers! ¡Otro éxito, y debería seguir creciendo!<\/p>\n<p>El sábado fuimos verdaderamente bendecidos 🙌 😇 🙏 y almorzamos y cenamos con miembros. El almuerzo fue una comida súper increíble con nuestros amigos Miguel, Lourdes, Wilson y Zarela, junto con sus hijos y la familia Rodriguez del barrio. Comimos pollada &amp; huacaina, los dos platillos muy típicos y sabrosos de Perú 🇵🇪. Vean las fotos de la salsa \"huacaina\" y del postre \"combinado\"<\/p>\n<p>Teníamos tanta hambre que empezamos a comer antes de siquiera pensar en tomarle foto al plato fuerte jaja. La cantidad de recuerdos divertidos sobre Perú, la cultura y los chistes estuvo súper divertida y me hizo sentir como en casa.<\/p>\n<p>La cena también estuvo buena, pero no tiene mucha historia.<\/p>\n<p>El domingo fue una W enorme (W = dub = victoria) porque tuvimos nuestra primera clase de Escuela Dominical en portugués 🇧🇷 un avance sin duda, y nuestros amigos se sintieron muy agradecidos por esa adaptación y por poder aprender mucho más.<\/p>\n<p>No hay pensamiento espiritual porque se nos acabó el tiempo, así que vayan a leer Alma 5, ¡está súper épico!<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<ul class=\"bul\">\n<li>vaca<\/li>\n<li>Pão de Quiejo (pan de queso)<\/li>\n<li>cuchillos<\/li>\n<li>almuerzo que hice 😋<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-16_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-16_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-16_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-16_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Nuevo crecimiento 🌱 pero el final de otro cambio🤳 Oi! Deus lhe abençoe! ¡Hola! ¡Dios te bendiga! Fue otra semana nomás disfrutando la vida misional, sobre todo aquí en Rio Vista. Tuvimos más intercambios esta semana, pero separados, así que no tan estresante. Y hemos estado bastante ocupados como siempre. Ojalá la próxima semana se calme más y podamos manejar mejor todo. Nuestra semana empezó con una lección con Doina, una persona que encontramos al principio del cambio pero a la que no habíamos podido contactar. Pasamos a verla y ha estado leyendo y diciéndoles a otros que tiene una iglesia (o sea, la nuestra) y que le gusta, a pesar de que solo la visitamos una vez hace tiempo. ¡Qué emoción! Luego una lección con un converso reciente y su esposa, lo cual es emocionante porque ella se ve muy emocionada y con ganas de leer más del Libro de Mormón (app). ¡Disponible para ustedes en su celular! Tuvimos la clase de inglés el miércoles después de una semana de descanso y llegó mucha gente, ¡y luego tuvimos nuestra primera en Fort Myers! ¡Otro éxito, y debería seguir creciendo! El sábado fuimos verdaderamente bendecidos 🙌 😇 🙏 y almorzamos y cenamos con miembros. El almuerzo fue una comida súper increíble con nuestros amigos Miguel, Lourdes, Wilson y Zarela, junto con sus hijos y la familia Rodriguez del barrio. Comimos pollada & huacaina, los dos platillos muy típicos y sabrosos de Perú 🇵🇪. Vean las fotos de la salsa \"huacaina\" y del postre \"combinado\" Teníamos tanta hambre que empezamos a comer antes de siquiera pensar en tomarle foto al plato fuerte jaja. La cantidad de recuerdos divertidos sobre Perú, la cultura y los chistes estuvo súper divertida y me hizo sentir como en casa. La cena también estuvo buena, pero no tiene mucha historia. El domingo fue una W enorme (W = dub = victoria) porque tuvimos nuestra primera clase de Escuela Dominical en portugués 🇧🇷 un avance sin duda, y nuestros amigos se sintieron muy agradecidos por esa adaptación y por poder aprender mucho más. No hay pensamiento espiritual porque se nos acabó el tiempo, así que vayan a leer Alma 5, ¡está súper épico! Los amo! Elder Jacobs vaca Pão de Quiejo (pan de queso) cuchillos almuerzo que hice 😋"}, {"id": "l83", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ENE 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><\/div>", "cultures": ["PE", "BR", "HT"], "moments": [], "extra": "Peru Brazil Haiti", "kind": "Carta 83 · Fort Myers", "title": "Llanta 💥, nuevo 👼 y limpieza 🧼🪣", "date": "2023-01-23T11:00:00", "group": "2023-01", "html": "<div class=\"body\"><p>Ôpa! Como foi a sua semana?<\/p>\n<p>La nuestra estuvo bastante bien, pero definitivamente loca, ocupada y diferente a las semanas de cambios anteriores.<\/p>\n<p>La primera mitad de la semana fue con el Élder O'Neill y estuvo bastante divertida.<\/p>\n<p>Nos enteramos de que se va a Peace River y que yo estaría otra vez con el Élder Towne, pero entrenando también. Mientras estaba con el Élder O'Neill tuvimos unas comidas bastante buenas con miembros (más comida peruana épica), se me reventó por completo la llanta a 30 minutos de la casa y comimos de los tacos más buenos de la vida.<\/p>\n<p>El jueves fueron los cambios, que siempre son una locura, pero además íbamos a recoger al Élder Wahlberg. Es de Bear Lake, Utah, y tiene muchísimo fuego para ser nuevecito, está increíble.<\/p>\n<p>Su primera lección no fue en español... sí... ya sé, medio que es el idioma asignado mío y de él, pero su primera lección fue en portugués, y salió muy bien.<\/p>\n<p>También hemos estado limpiando, como dice mi título. Cambiamos de apartamento con los élderes de criollo para tener más espacio para todos. Pero hubo 2 problemas enormes. 1. Mudar todas nuestras cosas. 2. La cantidad impresionante de porquería/basura/desorden/tierra/mugre o como le quieran llamar. Ese apartamento no estaba limpio y no lo había estado en mucho tiempo.<\/p>\n<p>Por fin ya lo está, después de mañana, tarde y noche de limpiar, organizar y 9 bolsas de basura.<\/p>\n<p>En fin, disfruten las fotos divertidas.<\/p>\n<p>Vencer al mundo y hallar descanso<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2022/10/47nelson?lang=eng<\/p>\n<p>Este discurso está súper increíble. Aprendemos sobre la importancia de las cosas pequeñas y de los convenios para vencer las pruebas y dificultades del mundo.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>papa loca<\/li>\n<li>comida panameña<\/li>\n<li>bicis ponchadas otra vez y la misión de rescate<\/li>\n<li>pasamos a ver a Genesis &amp; Yolennis mientras estábamos en Tampa por los cambios<\/li>\n<li>día de bici con el Élder O'Neill<\/li>\n<li>comida peruana (la que lleva huevo)<\/li>\n<li>oveja de la tienda de bicis<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-23_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-23_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-23_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-23_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-23_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-23_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-23_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "Llanta 💥, nuevo 👼 y limpieza 🧼🪣 Ôpa! Como foi a sua semana? La nuestra estuvo bastante bien, pero definitivamente loca, ocupada y diferente a las semanas de cambios anteriores. La primera mitad de la semana fue con el Élder O'Neill y estuvo bastante divertida. Nos enteramos de que se va a Peace River y que yo estaría otra vez con el Élder Towne, pero entrenando también. Mientras estaba con el Élder O'Neill tuvimos unas comidas bastante buenas con miembros (más comida peruana épica), se me reventó por completo la llanta a 30 minutos de la casa y comimos de los tacos más buenos de la vida. El jueves fueron los cambios, que siempre son una locura, pero además íbamos a recoger al Élder Wahlberg. Es de Bear Lake, Utah, y tiene muchísimo fuego para ser nuevecito, está increíble. Su primera lección no fue en español... sí... ya sé, medio que es el idioma asignado mío y de él, pero su primera lección fue en portugués, y salió muy bien. También hemos estado limpiando, como dice mi título. Cambiamos de apartamento con los élderes de criollo para tener más espacio para todos. Pero hubo 2 problemas enormes. 1. Mudar todas nuestras cosas. 2. La cantidad impresionante de porquería/basura/desorden/tierra/mugre o como le quieran llamar. Ese apartamento no estaba limpio y no lo había estado en mucho tiempo. Por fin ya lo está, después de mañana, tarde y noche de limpiar, organizar y 9 bolsas de basura. En fin, disfruten las fotos divertidas. Vencer al mundo y hallar descanso https://www.churchofjesuschrist.org/study/general-conference/2022/10/47nelson?lang=eng Este discurso está súper increíble. Aprendemos sobre la importancia de las cosas pequeñas y de los convenios para vencer las pruebas y dificultades del mundo. Los amo! Elder Jacobs Fotos: papa loca comida panameña bicis ponchadas otra vez y la misión de rescate pasamos a ver a Genesis & Yolennis mientras estábamos en Tampa por los cambios día de bici con el Élder O'Neill comida peruana (la que lleva huevo) oveja de la tienda de bicis"}, {"id": "l84", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ENE 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 84 · Fort Myers", "title": "Semana de búsqueda 👊✊️👊", "date": "2023-01-30T14:53:00", "group": "2023-01", "html": "<div class=\"body\"><p>Buenas tardes!<\/p>\n<p>Sí, estoy escribiendo esto medio tarde, pero ni modo.<\/p>\n<p>Esta semana definitivamente fue otra cosa. Empezó bastante lenta y normal con un intercambio. Estuvo súper divertido con el Élder Gonzalez otra vez, pero esta vez en nuestra área.<\/p>\n<p>Un tema común esta semana fue que se cancelaban lecciones y luego encontrábamos gente nueva a quien enseñar, así que bastante increíble. ¡Sobre todo porque encontramos 13 amigos esta semana (en su mayoría familias!) y nuestro distrito encontró 51!<\/p>\n<p>¡También nos ganamos un almuerzo gratis de los líderes de zona!<\/p>\n<p>También tuvimos la capacitación especializada, la reunión de capacitación para los entrenadores y sus nuevos misioneros, y eso tomó todo el día... nos levantamos a las 4:30, salimos a las 6 y llegamos a la casa a las 9 de la noche. Mucho manejar/estar sentado, lo cual es muy difícil, sobre todo porque a mí me cuesta quedarme quieto y concentrarme.<\/p>\n<p>Versión corta del fin de semana:<\/p>\n<ul class=\"bul\">\n<li>encontramos a un montón de gente (como ya dije, pero brasileños &amp; hispanos)<\/li>\n<li>¡encontramos a una antigua referencia a la que no habíamos podido contactar porque no teníamos dirección, pero luego tocamos a su puerta!<\/li>\n<li>¡me felicitaron por mi portugués y mi habilidad para explicar las Escrituras!<\/li>\n<li>muchas lecciones canceladas<\/li>\n<\/ul>\n<p>Muchas lecciones de contacto = Espíritu súper poderoso<\/p>\n<ul class=\"bul\">\n<li>Hice una entrevista bautismal (Paul es todo un crack y se bautizó el domingo)<\/li>\n<li>Se habla mucho de un grupo brasileño 👀 seguimos orando porque ahorita es solo una idea<\/li>\n<\/ul>\n<p>Esta semana terminé Alma en mi lectura de O Livro de Mormon. ¡Sean rectos, no se mueran en la guerra, acuérdense de lo que les dijo su mamá!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p>Élder Jacó<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>hora de la pizza<\/li>\n<li>¿una armadura en el porche de alguien?<\/li>\n<li>ajedrez gigante<\/li>\n<li>carne seca de bisonte (demasiado suave y mala textura, pero buen sabor)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-30_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-30_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-30_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-30_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Semana de búsqueda 👊✊️👊 Buenas tardes! Sí, estoy escribiendo esto medio tarde, pero ni modo. Esta semana definitivamente fue otra cosa. Empezó bastante lenta y normal con un intercambio. Estuvo súper divertido con el Élder Gonzalez otra vez, pero esta vez en nuestra área. Un tema común esta semana fue que se cancelaban lecciones y luego encontrábamos gente nueva a quien enseñar, así que bastante increíble. ¡Sobre todo porque encontramos 13 amigos esta semana (en su mayoría familias!) y nuestro distrito encontró 51! ¡También nos ganamos un almuerzo gratis de los líderes de zona! También tuvimos la capacitación especializada, la reunión de capacitación para los entrenadores y sus nuevos misioneros, y eso tomó todo el día... nos levantamos a las 4:30, salimos a las 6 y llegamos a la casa a las 9 de la noche. Mucho manejar/estar sentado, lo cual es muy difícil, sobre todo porque a mí me cuesta quedarme quieto y concentrarme. Versión corta del fin de semana: encontramos a un montón de gente (como ya dije, pero brasileños & hispanos) ¡encontramos a una antigua referencia a la que no habíamos podido contactar porque no teníamos dirección, pero luego tocamos a su puerta! ¡me felicitaron por mi portugués y mi habilidad para explicar las Escrituras! muchas lecciones canceladas Muchas lecciones de contacto = Espíritu súper poderoso Hice una entrevista bautismal (Paul es todo un crack y se bautizó el domingo) Se habla mucho de un grupo brasileño 👀 seguimos orando porque ahorita es solo una idea Esta semana terminé Alma en mi lectura de O Livro de Mormon. ¡Sean rectos, no se mueran en la guerra, acuérdense de lo que les dijo su mamá! Los amo, Élder Jacó Fotos: hora de la pizza ¿una armadura en el porche de alguien? ajedrez gigante carne seca de bisonte (demasiado suave y mala textura, pero buen sabor)"}, {"id": "l85", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEB 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Carta 85 · Fort Myers", "title": "¡Mis rodillas quieren explotar! 😐💥", "date": "2023-02-06T10:40:00", "group": "2023-02", "html": "<div class=\"body\"><p>Buenos días amigos 🌅👋<\/p>\n<p>Tuvimos una semana bastante buena, considerando todo. Definitivamente tuvimos algunos problemas, pero todo salió bien. Mis rodillas están cansadas de tanto andar en bici y de los vientos tan fuertes que nos tocaron. Si dejabas de pedalear, prácticamente te parabas (la verdad, deberíamos haber caminado, íbamos tan lento). Pero Dios es bueno y se nos dan muchas bendiciones, milagros y poder.<\/p>\n<p>Me encantó esta escritura esta semana: Mormón 9:24<\/p>\n<p>Y estas señales seguirán a los que crean: En mi nombre echarán fuera demonios; hablarán en nuevas lenguas; tomarán serpientes; y si bebieren cosa mortífera, no les hará daño; sobre los enfermos pondrán sus manos, y sanarán;<\/p>\n<p>De seguro hemos visto muchos milagros como estos en nuestras vidas; yo sé que los he visto en mi misión.<\/p>\n<p>Otras cosas que pasaron:<\/p>\n<ul class=\"bul\">\n<li>Tuvimos conferencia de zona y estuvo súper increíble<\/li>\n<li>lección súper increíble con una referencia, estamos emocionados de enseñarle al resto de la familia la próxima vez<\/li>\n<li>intercambio épico con el Élder Rupp<\/li>\n<li>camión de tacos, segunda ronda 😋<\/li>\n<\/ul>\n<p>Tristemente se nos cancelaron muchas lecciones, lo cual estuvo triste, y al parecer nuestros amigos no entienden que eso nos pone tristes porque sigue pasando, pero entonces nomás vamos a buscar nuevos amigos y les enseñamos, así que nos mantenemos bastante ocupados.<\/p>\n<p>También fuimos a la panadería brasileña, que estuvo súper deliciosa. Sus dulces, los brigadeiros, son puritita azúcar 🥴 y lo más densos posible, pero definitivamente valen la pena.<\/p>\n<p>Espero que tenham uma boa semana com muitos milagrinhos!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>brigadeiros<\/li>\n<li>hora de DQ<\/li>\n<li>taquería (¡tacos!)<\/li>\n<li>amigos brasileños &amp; BBQ Churrasco (se dice como chu-rras-co)<\/li>\n<li>brazmarket<\/li>\n<li>¡una imagen de escritura para compartir que me encanta!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-02-06_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-06_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_7.jpg\" alt=\"\"><\/figure><\/div>", "text": "¡Mis rodillas quieren explotar! 😐💥 Buenos días amigos 🌅👋 Tuvimos una semana bastante buena, considerando todo. Definitivamente tuvimos algunos problemas, pero todo salió bien. Mis rodillas están cansadas de tanto andar en bici y de los vientos tan fuertes que nos tocaron. Si dejabas de pedalear, prácticamente te parabas (la verdad, deberíamos haber caminado, íbamos tan lento). Pero Dios es bueno y se nos dan muchas bendiciones, milagros y poder. Me encantó esta escritura esta semana: Mormón 9:24 Y estas señales seguirán a los que crean: En mi nombre echarán fuera demonios; hablarán en nuevas lenguas; tomarán serpientes; y si bebieren cosa mortífera, no les hará daño; sobre los enfermos pondrán sus manos, y sanarán; De seguro hemos visto muchos milagros como estos en nuestras vidas; yo sé que los he visto en mi misión. Otras cosas que pasaron: Tuvimos conferencia de zona y estuvo súper increíble lección súper increíble con una referencia, estamos emocionados de enseñarle al resto de la familia la próxima vez intercambio épico con el Élder Rupp camión de tacos, segunda ronda 😋 Tristemente se nos cancelaron muchas lecciones, lo cual estuvo triste, y al parecer nuestros amigos no entienden que eso nos pone tristes porque sigue pasando, pero entonces nomás vamos a buscar nuevos amigos y les enseñamos, así que nos mantenemos bastante ocupados. También fuimos a la panadería brasileña, que estuvo súper deliciosa. Sus dulces, los brigadeiros, son puritita azúcar 🥴 y lo más densos posible, pero definitivamente valen la pena. Espero que tenham uma boa semana com muitos milagrinhos! Los amo, Elder Jacobs Fotos: brigadeiros hora de DQ taquería (¡tacos!) amigos brasileños & BBQ Churrasco (se dice como chu-rras-co) brazmarket ¡una imagen de escritura para compartir que me encanta!"}, {"id": "l86", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEB 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 86 · Fort Myers", "title": "Me llamo poco poco 🥸", "date": "2023-02-13T07:05:00", "group": "2023-02", "html": "<div class=\"body\"><p>Olá pessoal! Tudo bem?<\/p>\n<p>Tivemos uma semana muito boa<\/p>\n<p>Disfrutamos algunas cosas divertidas esta semana, además de andar en bici como siempre, pero con un viento tremendo. Nada épico. 0/10, no lo recomiendo. El viento de verdad puede arruinarte el día porque de repente te quedas sin energía.<\/p>\n<p>El lunes en la noche se nos arruinaron un montón de planes porque las direcciones no eran correctas y la gente no estaba interesada. Pero sí nos dijeron que no fuéramos a los antros, que Dios nos ama, y más tarde encontramos una nueva familia para enseñar. ¡Así que yupi! El martes cobramos nuestro almuerzo de distrito gratis de los líderes de zona yendo a la padaria (panadería brasileña) y cada uno pidió el X-tudo. ¡Por mucho una de las mejores hamburguesas que he comido! (Papitas fritas, tocino, huevo, jamón, pastrami y mozzarella fresca, junto con lo normal de una hamburguesa)<\/p>\n<p>A nuestro amigo Juan le está yendo muy bien; definitivamente esta semana le vamos a fijar una fecha bautismal. Nuestras lecciones han sido muy espirituales y en esta última oró con nosotros, ya que no lo había hecho, acerca del Libro de Mormón. Él sabe que \"es real\", como dijo. 🥳<\/p>\n<p>Esta semana cenamos con los Newville, de ahí el título del correo. Él casi no sabe español, así que dice que se llama poco a poco o \"poco poco\" porque aprende una palabra al año jaja.<\/p>\n<p>El domingo estuvo súper increíble. Encontramos otra familia, los Blandon, cenamos con los Cole y les fijamos fecha a nuestros amigos Ilene &amp; João.<\/p>\n<p>Fuimos y les enseñamos otra vez sobre José Smith, junto con algunos mandamientos. Nos fuimos por el tiempo sin fijar la fecha, pero sentimos que debíamos llamarlos al llegar a la casa e intentarlo entonces. Llamamos, los dos contestaron en el teléfono de él, ¡y luego estaban súper dispuestos! ¡No se lo pierdan!<\/p>\n<p>Oren por esos amigos, junto con estos:<\/p>\n<ul class=\"bul\">\n<li>Damaris &amp; Elivam (están leyendo y son súper increíbles, estamos emocionados de fijarles una fecha pronto)<\/li>\n<li>Marklane<\/li>\n<li>Eduardo Tuil<\/li>\n<li>John &amp; Nice<\/li>\n<li>Edmar &amp; Liz<\/li>\n<li>José Luis<\/li>\n<\/ul>\n<p>Esta semana terminé el Libro de Mormón en portugués, y una de las cosas más grandes que aprendí fue cuántas veces se habla de Cristo y cuántas veces Él o Dios intentan bendecirnos, guiarnos, ayudarnos y hablarnos.<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>X-Tudo<\/li>\n<li>cena con los Cole<\/li>\n<li>Harambo &amp; el Élder Stevens<\/li>\n<li>lugar padre para fotos<\/li>\n<li>memes del día de San Valentín<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2023-02-13_0_0.png\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-13_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_8.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_9.jpg\" alt=\"\"><\/figure><\/div>", "text": "Me llamo poco poco 🥸 Olá pessoal! Tudo bem? Tivemos uma semana muito boa Disfrutamos algunas cosas divertidas esta semana, además de andar en bici como siempre, pero con un viento tremendo. Nada épico. 0/10, no lo recomiendo. El viento de verdad puede arruinarte el día porque de repente te quedas sin energía. El lunes en la noche se nos arruinaron un montón de planes porque las direcciones no eran correctas y la gente no estaba interesada. Pero sí nos dijeron que no fuéramos a los antros, que Dios nos ama, y más tarde encontramos una nueva familia para enseñar. ¡Así que yupi! El martes cobramos nuestro almuerzo de distrito gratis de los líderes de zona yendo a la padaria (panadería brasileña) y cada uno pidió el X-tudo. ¡Por mucho una de las mejores hamburguesas que he comido! (Papitas fritas, tocino, huevo, jamón, pastrami y mozzarella fresca, junto con lo normal de una hamburguesa) A nuestro amigo Juan le está yendo muy bien; definitivamente esta semana le vamos a fijar una fecha bautismal. Nuestras lecciones han sido muy espirituales y en esta última oró con nosotros, ya que no lo había hecho, acerca del Libro de Mormón. Él sabe que \"es real\", como dijo. 🥳 Esta semana cenamos con los Newville, de ahí el título del correo. Él casi no sabe español, así que dice que se llama poco a poco o \"poco poco\" porque aprende una palabra al año jaja. El domingo estuvo súper increíble. Encontramos otra familia, los Blandon, cenamos con los Cole y les fijamos fecha a nuestros amigos Ilene & João. Fuimos y les enseñamos otra vez sobre José Smith, junto con algunos mandamientos. Nos fuimos por el tiempo sin fijar la fecha, pero sentimos que debíamos llamarlos al llegar a la casa e intentarlo entonces. Llamamos, los dos contestaron en el teléfono de él, ¡y luego estaban súper dispuestos! ¡No se lo pierdan! Oren por esos amigos, junto con estos: Damaris & Elivam (están leyendo y son súper increíbles, estamos emocionados de fijarles una fecha pronto) Marklane Eduardo Tuil John & Nice Edmar & Liz José Luis Esta semana terminé el Libro de Mormón en portugués, y una de las cosas más grandes que aprendí fue cuántas veces se habla de Cristo y cuántas veces Él o Dios intentan bendecirnos, guiarnos, ayudarnos y hablarnos. Los amo, Élder Jacobo Fotos: X-Tudo cena con los Cole Harambo & el Élder Stevens lugar padre para fotos memes del día de San Valentín"}, {"id": "l87", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEB 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colombia<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["VE", "CO", "BR"], "moments": [], "extra": "Venezuela Colombia Brazil", "kind": "Carta 87 · Fort Myers", "title": "❤️ Feliz día de San Valentín 😋🥩", "date": "2023-02-20T13:10:00", "group": "2023-02", "html": "<div class=\"body\"><p>Olá gente! Beleza?<\/p>\n<p>Tuvimos una semana bastante buena, considerando todo. Sí, todavía tuvimos problemas con lecciones canceladas y con miembros demasiado ocupados para venir a ayudarnos a enseñar. También tuve mucho dolor en la rodilla, pero parece que ya se me está quitando. Hicimos muchas visitas rápidas esta semana, visitando a miembros y a personas que podrían tener interés.<\/p>\n<p>Esta semana también comimos picanha. Es un corte de carne mega delicioso que hacen los brasileños 🇧🇷, solo que esta vez lo hicieron nuestros miembros venezolanos 🇻🇪 &amp; colombianos 🇨🇴. La primera vez esta semana estaba demasiado cocida, pero igual buena. La segunda estuvo fenomenal. Vayan a comprarse un poco si pueden, o vayan a un Rodigios (un tipo de restaurante brasileño del que me habló el Élder Towne). A João &amp; Ilene les está yendo muy bien; ella estuvo enferma esta semana y se quedó sin voz, oren por ellos. Nos dieron un pastel buenísimo &amp; unas mini bolitas de cordon bleu (una especie de pan salado), súper increíble<\/p>\n<p>A Damaris &amp; Elivam también les está yendo muy bien; todavía están buscando una respuesta del Espíritu sobre el Libro de Mormón. Tuvimos una reunión de toda la misión para los de español. Yo dirigí en español a pesar de que casi todo lo demás fue en inglés... Igual estuvo bastante bien 🇺🇲<\/p>\n<p>Casi me muero esta semana. Me dieron un dulce bien rico, pero estaba hecho de nuez de la India... Por suerte el Benadryl es lo máximo 🐐 He empezado a ver más videos del Libro de Mormón y me encantan. ¡Por favor vayan a verlos y empiecen a leer el Libro de Mormón otra vez!<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Manatee Park (tristemente no vimos nada)<\/li>\n<li>árbol gigante (Edison &amp; Ford Winter Estates)<\/li>\n<li>dulce de nuez de la India<\/li>\n<li>Cena con los Aguero<\/li>\n<li>Conferencia de zona<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-02-20_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-20_0_6.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_407.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_408.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "❤️ Feliz día de San Valentín 😋🥩 Olá gente! Beleza? Tuvimos una semana bastante buena, considerando todo. Sí, todavía tuvimos problemas con lecciones canceladas y con miembros demasiado ocupados para venir a ayudarnos a enseñar. También tuve mucho dolor en la rodilla, pero parece que ya se me está quitando. Hicimos muchas visitas rápidas esta semana, visitando a miembros y a personas que podrían tener interés. Esta semana también comimos picanha. Es un corte de carne mega delicioso que hacen los brasileños 🇧🇷, solo que esta vez lo hicieron nuestros miembros venezolanos 🇻🇪 & colombianos 🇨🇴. La primera vez esta semana estaba demasiado cocida, pero igual buena. La segunda estuvo fenomenal. Vayan a comprarse un poco si pueden, o vayan a un Rodigios (un tipo de restaurante brasileño del que me habló el Élder Towne). A João & Ilene les está yendo muy bien; ella estuvo enferma esta semana y se quedó sin voz, oren por ellos. Nos dieron un pastel buenísimo & unas mini bolitas de cordon bleu (una especie de pan salado), súper increíble A Damaris & Elivam también les está yendo muy bien; todavía están buscando una respuesta del Espíritu sobre el Libro de Mormón. Tuvimos una reunión de toda la misión para los de español. Yo dirigí en español a pesar de que casi todo lo demás fue en inglés... Igual estuvo bastante bien 🇺🇲 Casi me muero esta semana. Me dieron un dulce bien rico, pero estaba hecho de nuez de la India... Por suerte el Benadryl es lo máximo 🐐 He empezado a ver más videos del Libro de Mormón y me encantan. ¡Por favor vayan a verlos y empiecen a leer el Libro de Mormón otra vez! Los amo! Elder Jacobs Fotos: Manatee Park (tristemente no vimos nada) árbol gigante (Edison & Ford Winter Estates) dulce de nuez de la India Cena con los Aguero Conferencia de zona Más de esta semana"}, {"id": "l88", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEB 2023<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 88 · Fort Myers", "title": "👾Abandonando mi área 🦅", "date": "2023-02-27T11:52:00", "group": "2023-02", "html": "<div class=\"body\"><p>Opa! blz? Eu tô de bola<\/p>\n<p>¡Hola! ¿Todo bonito? Aquí nomás relajado<\/p>\n<p>¡Esta semana estuvo genial! (No, en realidad no abandoné mi área, pero sí estuve fuera de ella bastante tiempo). El miércoles fue el CLM (Consejo de Líderes de la Misión); salí a las 5 de la mañana y regresé a las 6 de la tarde. Al día siguiente manejamos a Tampa y también regresamos a las 6 de la tarde. Cambiamos nuestro carro viejo y al Élder Towne por un Nissan Rogue nuevecito.<\/p>\n<p>*No es cierto, lo dejamos ahí para que estuviera cerca del aeropuerto. Voló esta mañana 🥲<\/p>\n<p>El resto de la semana estuvo bastante bien; nos retaron al Facebook Boot Camp. O sea, usar Facebook todos los días, aprender nuevas formas de usarlo y encontrar muchos amigos nuevos. La verdad fue bastante exitoso y divertido. ¡Terminamos el reto de 7 días y nos ganamos una calcomanía! Nos la van a dar más adelante esta semana.<\/p>\n<p>¡Esta semana hicimos servicio! Algo muy raro para mí, ya que a la mayoría de los hispanos no les gusta que les sirvan. Algo que aprendí esta semana fue cuánto quiero a nuestros amigos y cuánto me gusta estar con ellos. DyC 84:77 dice... Y otra vez os digo, amigos míos, porque de aquí en adelante os llamaré amigos, es propio que os dé este mandamiento, que lleguéis a ser como mis amigos en los días en que estaba con ellos, viajando para predicar el evangelio en mi poder;<\/p>\n<p>Ustedes son mis amigos y me importa cada uno de ustedes. Cristo nos invita a ser Sus amigos y a profundizar nuestro discipulado. Quiero mucho a los amigos a quienes estoy enseñando ahora y me sentí triste los días que tuve menos tiempo para estar con ellos. ¡Confíen en su Salvador y en mí como sus amigos!<\/p>\n<p class=\"sign\">Los amo mucho!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Cuscús &amp; azúcar con canela<\/li>\n<li>El Élder Argyle &amp; yo en el CLM<\/li>\n<li>¡ah, pues sí!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-02-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-27_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "👾Abandonando mi área 🦅 Opa! blz? Eu tô de bola ¡Hola! ¿Todo bonito? Aquí nomás relajado ¡Esta semana estuvo genial! (No, en realidad no abandoné mi área, pero sí estuve fuera de ella bastante tiempo). El miércoles fue el CLM (Consejo de Líderes de la Misión); salí a las 5 de la mañana y regresé a las 6 de la tarde. Al día siguiente manejamos a Tampa y también regresamos a las 6 de la tarde. Cambiamos nuestro carro viejo y al Élder Towne por un Nissan Rogue nuevecito. *No es cierto, lo dejamos ahí para que estuviera cerca del aeropuerto. Voló esta mañana 🥲 El resto de la semana estuvo bastante bien; nos retaron al Facebook Boot Camp. O sea, usar Facebook todos los días, aprender nuevas formas de usarlo y encontrar muchos amigos nuevos. La verdad fue bastante exitoso y divertido. ¡Terminamos el reto de 7 días y nos ganamos una calcomanía! Nos la van a dar más adelante esta semana. ¡Esta semana hicimos servicio! Algo muy raro para mí, ya que a la mayoría de los hispanos no les gusta que les sirvan. Algo que aprendí esta semana fue cuánto quiero a nuestros amigos y cuánto me gusta estar con ellos. DyC 84:77 dice... Y otra vez os digo, amigos míos, porque de aquí en adelante os llamaré amigos, es propio que os dé este mandamiento, que lleguéis a ser como mis amigos en los días en que estaba con ellos, viajando para predicar el evangelio en mi poder; Ustedes son mis amigos y me importa cada uno de ustedes. Cristo nos invita a ser Sus amigos y a profundizar nuestro discipulado. Quiero mucho a los amigos a quienes estoy enseñando ahora y me sentí triste los días que tuve menos tiempo para estar con ellos. ¡Confíen en su Salvador y en mí como sus amigos! Los amo mucho! Elder Jacobs Fotos: Cuscús & azúcar con canela El Élder Argyle & yo en el CLM ¡ah, pues sí!"}, {"id": "l89", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 89 · Fort Myers", "title": "Otra más", "date": "2023-03-06T06:29:00", "group": "2023-03", "html": "<div class=\"body\"><p>Ôpa 👋 como vocês vão?<\/p>\n<p>Esta semana estuvo bastante bien. Tuvimos cambios y me despedí del Élder Wahlberg. Ahora está en Tampa, una de mis áreas anteriores favoritas; le va a ir muy bien y todos lo van a recibir bien, hasta mis conversos recientes de ahí.<\/p>\n<p>¡Recogí al Élder Kroeger! Es de Clinton, Utah, y creció hablando español e inglés. Así que nos metimos de lleno a la acción. Está aprendiendo portugués porque él también se va a Campinas, Brasil. Ojalá no se vaya tan pronto. (Por cierto, es mi nuevo misionero #10 jajaa)<\/p>\n<p>La semana empezó medio lenta, pero luego se animó. Pudimos visitar a Juan esta semana y hablamos mucho del plan de Dios y de los mandamientos. ¡Fijamos una fecha bautismal para el 21 de marzo! Todavía tiene que venir a la iglesia 2 veces, pero su familia todavía siente la pérdida que acaban de sufrir. Por favor oren por él y su familia (los Gómez). Encontramos algunos amigos nuevos esta semana, les está yendo bien, pero por favor oren por estos amigos:<\/p>\n<ul class=\"bul\">\n<li>João &amp; Ilene<\/li>\n<li>Damaris &amp; Elivam (están enfermos otra vez)<\/li>\n<li>Jose Miguel &amp; Kelly<\/li>\n<li>Edmar<\/li>\n<\/ul>\n<p>Tuvimos una lección increíble con la familia Aguirre; estamos ayudando a preparar a Jesus para el bautismo. Es un buen muchacho y estamos emocionados de seguir ayudándolo.<\/p>\n<p>No hay grandes historias esta semana ni fotos (se me olvidó sacar más), pero espero que su semana haya estado buena.<\/p>\n<p>Esta semana he aprendido mucho en mi estudio sobre los atributos cristianos y las metas/planes. Alguien que planea bien tiene presentes sus metas, las reevalúa constantemente para encontrar lo que funciona mejor y es una persona de oración. Las buenas metas son inspiradas, alcanzables y lo suficientemente altas para exigirnos. Cristo (&amp; cómo actuó) nos muestra la importancia de hacer esas cosas y siempre mostrar amor.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Ceviche (lo hicimos nosotros)<\/li>\n<li>arepas<\/li>\n<li>alguien no estaba contento con nuestro carro<\/li>\n<li>conociendo al Élder Kroeger<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-03-06_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-06_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-06_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Otra más Ôpa 👋 como vocês vão? Esta semana estuvo bastante bien. Tuvimos cambios y me despedí del Élder Wahlberg. Ahora está en Tampa, una de mis áreas anteriores favoritas; le va a ir muy bien y todos lo van a recibir bien, hasta mis conversos recientes de ahí. ¡Recogí al Élder Kroeger! Es de Clinton, Utah, y creció hablando español e inglés. Así que nos metimos de lleno a la acción. Está aprendiendo portugués porque él también se va a Campinas, Brasil. Ojalá no se vaya tan pronto. (Por cierto, es mi nuevo misionero #10 jajaa) La semana empezó medio lenta, pero luego se animó. Pudimos visitar a Juan esta semana y hablamos mucho del plan de Dios y de los mandamientos. ¡Fijamos una fecha bautismal para el 21 de marzo! Todavía tiene que venir a la iglesia 2 veces, pero su familia todavía siente la pérdida que acaban de sufrir. Por favor oren por él y su familia (los Gómez). Encontramos algunos amigos nuevos esta semana, les está yendo bien, pero por favor oren por estos amigos: João & Ilene Damaris & Elivam (están enfermos otra vez) Jose Miguel & Kelly Edmar Tuvimos una lección increíble con la familia Aguirre; estamos ayudando a preparar a Jesus para el bautismo. Es un buen muchacho y estamos emocionados de seguir ayudándolo. No hay grandes historias esta semana ni fotos (se me olvidó sacar más), pero espero que su semana haya estado buena. Esta semana he aprendido mucho en mi estudio sobre los atributos cristianos y las metas/planes. Alguien que planea bien tiene presentes sus metas, las reevalúa constantemente para encontrar lo que funciona mejor y es una persona de oración. Las buenas metas son inspiradas, alcanzables y lo suficientemente altas para exigirnos. Cristo (& cómo actuó) nos muestra la importancia de hacer esas cosas y siempre mostrar amor. Los amo! Elder Jacobs Fotos: Ceviche (lo hicimos nosotros) arepas alguien no estaba contento con nuestro carro conociendo al Élder Kroeger"}, {"id": "l90", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"SV\">🇸🇻 El Salvador<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🌀 Huracán<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["SV"], "moments": ["Baptism", "Hurricane", "Temple"], "extra": "El Salvador", "kind": "Carta 90 · Fort Myers", "title": "Otra montaña 🏔️ que escalar", "date": "2023-03-13T09:16:00", "group": "2023-03", "html": "<div class=\"body\"><p>Ôpa Hola hey bonswa yabbadabbadoo<\/p>\n<p>¿Cómo están?<\/p>\n<p>¡Las cosas van bastante bien! Esta semana pasaron un montón de cosas, así que les voy a contar más o menos día por día. Bora lá! Esta semana empezó otro reto de búsqueda, y el distrito que pierda le rapa la cabeza a su líder de distrito. Más sobre eso después. Encontramos a una pareja de El Salvador, pero para el final de la semana se dieron cuenta de que estaban demasiado ocupados y por ahora ya no les estamos enseñando.<\/p>\n<p>El martes teníamos el horario casi completamente libre, así que le dimos con todo a buscar y a intentar enseñar a nuestros amigos. Encontramos a un nuevo amigo, Tiago, que leyó la Biblia, luego oró para aprender más, ¡y justo después tocamos a su puerta! Estaba muy emocionado de vernos y tuvimos una gran plática sobre el arrepentimiento y el amor &amp; la gracia de Dios. También les enseñamos a Damaris &amp; su familia y luego a Edmar &amp; la suya, las dos lecciones buenísimas.<\/p>\n<p>Loreina tiene 2 años y es hija de Damaris. Es súper linda y medio loquita, pero esta última lección fue otra cosa. ¡Vio al Élder Kroeger y de inmediato se enamoró de él! Nomás hablaba y hablaba con él y hasta lo abrazó. ¡Lo más chistoso es que le dejó leche materna encima! (En la cultura latinoamericana, bebé = hambre -&gt; a darle pecho ya, y Loreina todavía toma pecho, le dio hambre al final y pues... se imaginan).<\/p>\n<p>El miércoles tuvimos unas lecciones increíbles. Nos reunimos con Juan y le enseñamos sobre la iglesia y los pasos para bautizarse y seguir en el camino hacia Dios. Conseguimos más información sobre la licencia de matrimonio para preparar a João e Ilene y conocimos a una señora muy dulce llamada Tally. También fuimos a casa de la Hermana Leedman y le ayudamos a rescatar algunas cosas de su casa, porque durante el huracán un árbol gigante la partió justo por la mitad y tienen que reconstruir todo. Así que movimos algunas cosas y le desarmamos el garaje. Bastante divertido, me encantó ayudarla y básicamente jugar a los legos de adulto kkkkkkk El jueves tuvimos la capacitación especializada en Tampa. La reunión y capacitación para los nuevos misioneros y sus entrenadores. Estuvimos fuera de 6 de la mañana a 9 de la noche, igual que la vez pasada.<\/p>\n<p>El viernes estuvo un poco más lento con lecciones canceladas, pero encontramos más amigos, le enseñamos a la familia Aguirre para preparar a Jesus para el bautismo (eso salió súper bien), y pudimos ayudar en la clase de inglés y acomodar sillas para la conferencia de estaca. La mayor parte de nuestro fin de semana después de eso fue andar en bici a las citas y tocar puertas. Se cancelaron algunas lecciones, pero dimos bastantes lecciones en la puerta y hasta nos dejaron pasar. Uno de nuestros nuevos amigos era una referencia, así que le llamamos y tuvimos una lección por teléfono. Luego se puso a cantar \"Fiesta para Jesus\" (por cierto, también llamó esta mañana para platicar y cantó \"Jesus el camino\", otro temazo de canción pentecostal) y quiere ir a predicar con nosotros kkkkkkkk. Lo de la \"montaña que escalar\" del título de mi correo es por la asistencia a la iglesia. Tuvimos conferencia de estaca el sábado y el domingo en la noche, pero solo vinieron 1 amigo y 1 converso reciente. Posiblemente por el cambio de horario, la iglesia a las 9 en vez de a las 11, o simplemente decidieron no venir. Pero esa es nuestra próxima meta: que más gente venga a la iglesia, sienta el Espíritu y haga amigos ahí. ¡Oren por eso!<\/p>\n<p>Mi pensamiento de esta semana viene de la conferencia de estaca:<\/p>\n<p>Se habló mucho de la obra misional y de ser \"salvadores de los hombres\", junto con seguir hasta la más pequeña impresión. Lo que de verdad me tocó esta semana fue lo de nuestra espiritualidad o, en mi caso, el \"subidón espiritual\". Mucha gente sabe que los misioneros tienen un espíritu muy fuerte, y es por su enfoque en los demás, como lo hizo Cristo, y por sus buenos hábitos. Ahora que voy a llegar al final de mi misión, de verdad debería esforzarme por seguir haciendo muchas de esas mismas cosas en casa. La importancia de IOLT (iglesia, oración, lectura de las Escrituras y asistencia al templo): son tan importantes para mantener nuestra conexión con Dios y Su guía. Hay muchas cosas en la vida: buenas, mejores y excelentes. Las excelentes son las cosas que tienen valor eterno o que son de mayor importancia. Los invito a todos a orar y buscar guía sobre una o 2 cosas que agregar/mejorar para mantener y hacer crecer su espiritualidad.<\/p>\n<p class=\"sign\">los amo mucho!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>invitaciones para la conferencia de estaca... ¡Hicimos un montón!<\/li>\n<li>servicio<\/li>\n<li>cuando recogí al Élder Kroeger<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-03-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-13_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div  haga amigos ahí. ¡Oren por eso! Mi pensamiento de esta semana viene de la conferencia de estaca: Se habló mucho de la obra misional y de ser \"salvadores de los hombres\", junto con seguir hasta la más pequeña impresión. Lo que de verdad me tocó esta semana fue lo de nuestra espiritualidad o, en mi caso, el \"subidón espiritual\". Mucha gente sabe que los misioneros tienen un espíritu muy fuerte, y es por su enfoque en los demás, como lo hizo Cristo, y por sus buenos hábitos. Ahora que voy a llegar al final de mi misión, de verdad debería esforzarme por seguir haciendo muchas de esas mismas cosas en casa. La importancia de IOLT (iglesia, oración, lectura de las Escrituras y asistencia al templo): son tan importantes para mantener nuestra conexión con Dios y Su guía. Hay muchas cosas en la vida: buenas, mejores y excelentes. Las excelentes son las cosas que tienen valor eterno o que son de mayor importancia. Los invito a todos a orar y buscar guía sobre una o 2 cosas que agregar/mejorar para mantener y hacer crecer su espiritualidad. los amo mucho! Élder Jacobo Fotos: invitaciones para la conferencia de estaca... ¡Hicimos un montón! servicio cuando recogí al Élder Kroeger Más de esta semana"}, {"id": "l91", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"DO\">🇩🇴 República Dominicana<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["MX", "DO", "BR"], "moments": ["Baptism"], "extra": "Mexico Dominican Republic Brazil", "kind": "Carta 91 · Fort Myers", "title": "¿¡Un misterio de asesinato?! 🔪🩸☠️", "date": "2023-03-20T10:32:00", "group": "2023-03", "html": "<div class=\"body\"><p>Olá pessoal!<\/p>\n<p>Tuvimos una semana bastante buena, llena de lecciones. Vamos lá!<\/p>\n<p>Empezamos la semana buscando un montón y visitando amigos. João &amp; Irene terminaron su curso de matrimonio y fijamos la cita para su boda el viernes en la mañana. Estamos súper emocionados, y también los miembros del barrio, sobre todo los que han estado apoyándolos y queriendo crear un grupo en portugués. El presidente Gardner también está muy emocionado. Se van a bautizar el 25 (sábado) a las 6pm, ¡avísenme si quieren el enlace!<\/p>\n<p>Tenemos algunos amigos nuevos, pero no han estado cumpliendo los compromisos como leer el Libro de Mormón o venir a la iglesia. Por favor oren para que sientan el Espíritu y entiendan su importancia.<\/p>\n<p>Nuestro amigo Daniel siempre nos canta o nos manda canciones. Estoy aprendiendo un montón de cantos religiosos mexicanos. Algo muy padre de esta semana fue encontrar otra familia de miembros parciales. Recibimos una referencia de los otros élderes que estaban tocando puertas. Debora es de España, pero su esposo es de República Dominicana y ha sido miembro toda su vida. No muy activo, pero sabe que las otras iglesias simplemente no son lo mismo. Les enseñamos a los dos y vamos a regresar esta semana. Estoy súper emocionado por lo que viene, y quieren que también le enseñemos a su hija.<\/p>\n<p>La vida ha estado bien, así que nada más oren por los amigos como ya les dije. Y por el don de lenguas para nosotros.<\/p>\n<p>Sobre el título: el domingo en la mañana nos despertamos y nuestro carro y todo lo de afuera estaba acordonado con cinta de la policía. Había un cadáver y una camioneta random afuera, justo enfrente de nuestra ventana. Vivimos en el segundo piso y pudimos ver toda la investigación. No vimos el cuerpo (estaba cubierto) y llegamos a la iglesia a tiempo, pero estuvo interesante.<\/p>\n<p>Esta semana les agrego una grabación de voz del pensamiento espiritual.<\/p>\n<p>Moroni 10:32<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class
