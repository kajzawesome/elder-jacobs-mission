n? OK, pero ¿qué tan seguido y cuánto? ¿O para qué día quiero terminar el libro de ____? También aplica a otras cosas de la vida como el ejercicio, la música, la escuela, los deportes, los videojuegos. Pero esta semana he notado lo mucho mejor que trabajamos con metas y los milagros que vemos. Mencioné que el Élder Seamons nos retó a 40 lecciones la próxima semana, pero es porque él y sus compañeros se pusieron esa meta y han estado trabajando en ella con metas diarias más pequeñas. La lograron y tenían un montón de milagros increíbles que compartirnos. ¡No olviden darle like, comentar y suscribirse! (OK, ahora sí ya le paro) Cuidense! Elder Jacobs P.D. Leo cada correo que me llega, pero no puedo responder hasta el lunes. ¡Y a veces se me olvida responder o no me da tiempo, así que lo siento mucho! ¡Ojalá me sigan escribiendo porque me encanta saber de ustedes! Fotos: Conferencia de zona de Lakeland (de izquierda a derecha: Élder Seamons, Astorga, Dana, Izu, yo, Olayan, Campbell, Zamor, Lauritzen y Jacobs) lluvia nuestros cortes recién hechos estando afuera bajo la lluvia fría más lluvia lección por teléfono Más de esta semana"}, {"id": "l22", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 22 · Lakeland", "title": "¡La semana de las 40 lecciones! 🤤🔥🛸", "date": "2021-11-15T07:41:00", "group": "2021-11", "html": "<div class=\"body\"><p>Buenos Días amigos!<\/p>\n<p>¡La última semana de estos cambios estuvo increíble! Pura chamba por momentos, pero definitivamente llena de milagros. Algo que mis compañeros y yo empezamos a hacer para valorar los milagros de cada día es que, ya en la cama, decimos cuál creemos que fue el milagro del día. También es interesante porque normalmente escogemos cosas diferentes.<\/p>\n<p>Milagros de esta semana:<\/p>\n<ul class=\"bul\">\n<li>¡42 lecciones enseñadas!<\/li>\n<li>¡21 amigos nuevos! (¡nuestra meta era 7!)<\/li>\n<li>comidas con miembros 🌮🌯🫔🥙<\/li>\n<li>una 2a oportunidad de hablar con alguien (hablé con el papá de este muchacho y no tiene mucho interés, pero ayer hablé con el muchacho mismo ¡y tiene MUCHÍSIMO interés! La última vez que lo vi medio lo ignoré y no le hablé, pero me alegra que me dieran una 2a oportunidad)<\/li>\n<li>¡Nuestro distrito tuvo 112 lecciones y encontró 40 amigos!<\/li>\n<li>¡y muchos más!<\/li>\n<\/ul>\n<p>Para citar al Élder Maxwell (creo; no pude volver a encontrar el discurso ni la cita exacta),<\/p>\n<p>\"Debemos contar nuestras bendiciones, pero también hacer que cuenten\"<\/p>\n<p>Otras cosas que pasaron esta semana. Le dimos clase de inglés a un miembro y a sus amigos. No saben mucho más que unos cuantos chistes, así que estuvo bastante chistoso, jajaja. ¡Tuve 2 intercambios! En el primero me quedé con el Élder Olayan mientras el Élder Izu y el Élder Dana se cambiaron. Buen intercambio, y de verdad nos motivó para la semana de más de 40 lecciones, ya que el Élder Dana y los demás de Gibsonia lo habían logrado antes. En el 2o me fui a Gibsonia 🐟 con el Élder Astorga y el Élder Dana. Nuestro día salió bastante bien; tristemente se nos cancelaron lecciones y nos costó conseguir más, pero en general fue un buen intercambio.<\/p>\n<p>No pasaron muchas otras cosas porque estuvimos casi todo el tiempo afuera caminando, platicando &amp; a veces tocando puertas. Pero estuvo divertido.<\/p>\n<p class=\"sign\">Los amo amigos míos y hasta luego!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Noticias de cambios: el Élder Olayan se va a casa (se cumplieron los 2 años), ¡el Élder Izu y yo nos vamos a Cypress Gardens East! El Élder Izu estuvo ahí los cambios antes de estos aquí en el lado oeste, así que ahora regresamos jaja.<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>¡Nuestros muebles nuevos! (No pregunten dónde ni cómo los conseguimos, pero confíen en el proceso. ¡También está bastante cómodo! Esto es solo medio banco de capilla)<\/li>\n<li>¡El bautismo de Juan Zamora! (por fin conseguí la foto del bautismo de Juan, al que no pude ir porque me cambiaron la semana anterior. El Élder Ricks con el Élder Makechine y su misionero en capacitación)<\/li>\n<li>Empanadas con los compañeros<\/li>\n<li>Carro-autobús grandote (no el más grande que vi esta semana, pero yo iba manejando, así que no hay foto del enorme)<\/li>\n<li>Huarache (una tostada grande, más o menos; el mío era de al pastor 🤤)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-11-15_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-15_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-15_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-15_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-15_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-15_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_094.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_095.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_096.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_097.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_098.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_099.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_100.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_101.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_102.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_103.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_104.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "¡La semana de las 40 lecciones! 🤤🔥🛸 Buenos Días amigos! ¡La última semana de estos cambios estuvo increíble! Pura chamba por momentos, pero definitivamente llena de milagros. Algo que mis compañeros y yo empezamos a hacer para valorar los milagros de cada día es que, ya en la cama, decimos cuál creemos que fue el milagro del día. También es interesante porque normalmente escogemos cosas diferentes. Milagros de esta semana: ¡42 lecciones enseñadas! ¡21 amigos nuevos! (¡nuestra meta era 7!) comidas con miembros 🌮🌯🫔🥙 una 2a oportunidad de hablar con alguien (hablé con el papá de este muchacho y no tiene mucho interés, pero ayer hablé con el muchacho mismo ¡y tiene MUCHÍSIMO interés! La última vez que lo vi medio lo ignoré y no le hablé, pero me alegra que me dieran una 2a oportunidad) ¡Nuestro distrito tuvo 112 lecciones y encontró 40 amigos! ¡y muchos más! Para citar al Élder Maxwell (creo; no pude volver a encontrar el discurso ni la cita exacta), \"Debemos contar nuestras bendiciones, pero también hacer que cuenten\" Otras cosas que pasaron esta semana. Le dimos clase de inglés a un miembro y a sus amigos. No saben mucho más que unos cuantos chistes, así que estuvo bastante chistoso, jajaja. ¡Tuve 2 intercambios! En el primero me quedé con el Élder Olayan mientras el Élder Izu y el Élder Dana se cambiaron. Buen intercambio, y de verdad nos motivó para la semana de más de 40 lecciones, ya que el Élder Dana y los demás de Gibsonia lo habían logrado antes. En el 2o me fui a Gibsonia 🐟 con el Élder Astorga y el Élder Dana. Nuestro día salió bastante bien; tristemente se nos cancelaron lecciones y nos costó conseguir más, pero en general fue un buen intercambio. No pasaron muchas otras cosas porque estuvimos casi todo el tiempo afuera caminando, platicando & a veces tocando puertas. Pero estuvo divertido. Los amo amigos míos y hasta luego! Elder Jacobs Noticias de cambios: el Élder Olayan se va a casa (se cumplieron los 2 años), ¡el Élder Izu y yo nos vamos a Cypress Gardens East! El Élder Izu estuvo ahí los cambios antes de estos aquí en el lado oeste, así que ahora regresamos jaja. Fotos: ¡Nuestros muebles nuevos! (No pregunten dónde ni cómo los conseguimos, pero confíen en el proceso. ¡También está bastante cómodo! Esto es solo medio banco de capilla) ¡El bautismo de Juan Zamora! (por fin conseguí la foto del bautismo de Juan, al que no pude ir porque me cambiaron la semana anterior. El Élder Ricks con el Élder Makechine y su misionero en capacitación) Empanadas con los compañeros Carro-autobús grandote (no el más grande que vi esta semana, pero yo iba manejando, así que no hay foto del enorme) Huarache (una tostada grande, más o menos; el mío era de al pastor 🤤) Más de esta semana"}, {"id": "l23", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><\/div>", "cultures": ["HT"], "moments": [], "extra": "Haiti", "kind": "Carta 23 · Winter Haven", "title": "🦍🐟 Misión: sobrevivir...🏴‍☠️", "date": "2021-11-22T06:00:00", "group": "2021-11", "html": "<div class=\"body\"><p>Buenos Días mis amigos!<\/p>\n<p>No les voy a mentir, esta semana estuvo un poco difícil. Llegar los dos nuevos a un área y empezar de cero es difícil. Pasar de un área donde me sé las calles casi perfecto, con mucha gente nueva a quien enseñar y donde conozco bien a los miembros, a un área nueva donde ninguno de los dos conoce mucho, seguimos conociendo a los miembros pero no de este lado, y casi no hay amigos a quienes enseñar. Sí tratamos de sacarle el mejor provecho contactando a gente que el Élder Izu recordaba de hace 2 cambios y con las demás cosas misionales (sobre todo buscar gente esta semana).<\/p>\n<p>En general, después de darle con todo y ponernos a chambearle buscando gente, sí nos divertimos mucho y empezamos a ver qué hacer con esta área nueva. ¡Lo mejor de estos cambios es que ahora estamos en la parte este, o sea del lado de Winterhaven, pero seguimos en el mismo barrio y la misma zona, y hasta nos quedamos en el mismo distrito!<\/p>\n<p>El día de cambios fue divertido pero también triste. Pude volver a ver a muchos de los otros misioneros que conozco, como el Élder CJ Ricks, Nelson, Jenson, etc. Pero tuvimos que despedirnos del Élder Olayan. Fuimos por malteadas de Wawa (porque en Utah no hay) y en los cambios nos despedimos. El Élder Izu y yo nos aseguramos de ponernos las corbatas que él nos cambió.<\/p>\n<p>Otras cosas de esta semana: fuimos a la noche de fútbol (con algunos miembros del barrio, y todos tratan de llevar amigos para que también podamos encontrar gente nueva a quien enseñar). Súper divertido; empezó a llover.<\/p>\n<p>Encontramos 5 haitianos por accidente mientras buscábamos latinos. Todo un milagro porque la verdad no hay muchos, pero ayer encontramos a los haitianos en el pajar.<\/p>\n<p>¡Espero que todo esté bien y nos vemos la próxima semana con muchísimo más de qué platicar!<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Arte callejero de Winterhaven<\/li>\n<li>pez grandote<\/li>\n<li>Fuente de corazón<\/li>\n<li>despedida del Élder Olayan<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-11-22_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-22_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-11-22_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-22_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_105.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_106.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_107.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_108.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_109.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_110.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_111.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_112.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🦍🐟 Misión: sobrevivir...🏴‍☠️ Buenos Días mis amigos! No les voy a mentir, esta semana estuvo un poco difícil. Llegar los dos nuevos a un área y empezar de cero es difícil. Pasar de un área donde me sé las calles casi perfecto, con mucha gente nueva a quien enseñar y donde conozco bien a los miembros, a un área nueva donde ninguno de los dos conoce mucho, seguimos conociendo a los miembros pero no de este lado, y casi no hay amigos a quienes enseñar. Sí tratamos de sacarle el mejor provecho contactando a gente que el Élder Izu recordaba de hace 2 cambios y con las demás cosas misionales (sobre todo buscar gente esta semana). En general, después de darle con todo y ponernos a chambearle buscando gente, sí nos divertimos mucho y empezamos a ver qué hacer con esta área nueva. ¡Lo mejor de estos cambios es que ahora estamos en la parte este, o sea del lado de Winterhaven, pero seguimos en el mismo barrio y la misma zona, y hasta nos quedamos en el mismo distrito! El día de cambios fue divertido pero también triste. Pude volver a ver a muchos de los otros misioneros que conozco, como el Élder CJ Ricks, Nelson, Jenson, etc. Pero tuvimos que despedirnos del Élder Olayan. Fuimos por malteadas de Wawa (porque en Utah no hay) y en los cambios nos despedimos. El Élder Izu y yo nos aseguramos de ponernos las corbatas que él nos cambió. Otras cosas de esta semana: fuimos a la noche de fútbol (con algunos miembros del barrio, y todos tratan de llevar amigos para que también podamos encontrar gente nueva a quien enseñar). Súper divertido; empezó a llover. Encontramos 5 haitianos por accidente mientras buscábamos latinos. Todo un milagro porque la verdad no hay muchos, pero ayer encontramos a los haitianos en el pajar. ¡Espero que todo esté bien y nos vemos la próxima semana con muchísimo más de qué platicar! Los amo Elder Jacobs Fotos: Arte callejero de Winterhaven pez grandote Fuente de corazón despedida del Élder Olayan Más de esta semana"}, {"id": "l24", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Holidays"], "extra": "", "kind": "Carta 24 · Winter Haven", "title": "🍁🍂 Feliz día de acción de gracias! 🦃🦤", "date": "2021-11-29T09:49:00", "group": "2021-11", "html": "<div class=\"body\"><p>Buenas! Mis amigos!<\/p>\n<p>¡Esta semana estuvo bastante bien, sobre todo porque fue Día de Acción de Gracias! Espero que todos hayan tenido un buen Día de Acción de Gracias y hayan comido mucho como yo. Tuvimos comida de Acción de Gracias con nuestro distrito, que estuvo increíble (cada quien tuvo su propio Martinelli's jaja), y luego más tarde un miembro nos invitó a cenar. Cocinaron varios pavos y guarniciones; estuvo increíble (y además nos dieron muchas sobras).<\/p>\n<p>Pasamos mucho tiempo buscando gente, o sea caminando y platicando, y a veces tocando puertas. Así que no fue una semana con mucha acción, ¡pero sí le pusimos fecha bautismal a nuestro amigo Arnulfo! Está súper emocionado y le encanta lo que siente en la iglesia, así que nosotros también estamos súper emocionados.<\/p>\n<p>Algo que quería compartir de mi estudio de esta semana es el poder que tenemos cuando hablamos. Estaba leyendo un discurso que se llama \"La lengua de los ángeles\". Fue un discurso súper increíble del Élder Holland y definitivamente señaló muchas cosas que he visto como misionero. La manera en que decimos las cosas importa, porque cómo reaccione la persona va a depender de lo que entiende y de sus antecedentes. También importa como familia, amigos y desconocidos. Hay muchas cosas en el discurso y no puedo explicarlo todo, así que vayan a leerlo.<\/p>\n<p>Hasta la proxima,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Día de Acción de Gracias<\/li>\n<li>perrita (Hachi) nos siguió un buen rato<\/li>\n<li>probé la Malta (estaba más o menos)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-11-29_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-29_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-29_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-29_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-29_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_113.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_114.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_115.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🍁🍂 Feliz día de acción de gracias! 🦃🦤 Buenas! Mis amigos! ¡Esta semana estuvo bastante bien, sobre todo porque fue Día de Acción de Gracias! Espero que todos hayan tenido un buen Día de Acción de Gracias y hayan comido mucho como yo. Tuvimos comida de Acción de Gracias con nuestro distrito, que estuvo increíble (cada quien tuvo su propio Martinelli's jaja), y luego más tarde un miembro nos invitó a cenar. Cocinaron varios pavos y guarniciones; estuvo increíble (y además nos dieron muchas sobras). Pasamos mucho tiempo buscando gente, o sea caminando y platicando, y a veces tocando puertas. Así que no fue una semana con mucha acción, ¡pero sí le pusimos fecha bautismal a nuestro amigo Arnulfo! Está súper emocionado y le encanta lo que siente en la iglesia, así que nosotros también estamos súper emocionados. Algo que quería compartir de mi estudio de esta semana es el poder que tenemos cuando hablamos. Estaba leyendo un discurso que se llama \"La lengua de los ángeles\". Fue un discurso súper increíble del Élder Holland y definitivamente señaló muchas cosas que he visto como misionero. La manera en que decimos las cosas importa, porque cómo reaccione la persona va a depender de lo que entiende y de sus antecedentes. También importa como familia, amigos y desconocidos. Hay muchas cosas en el discurso y no puedo explicarlo todo, así que vayan a leerlo. Hasta la proxima, Elder Jacobs Fotos: Día de Acción de Gracias perrita (Hachi) nos siguió un buen rato probé la Malta (estaba más o menos) Más de esta semana"}, {"id": "l25", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DIC 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": [], "moments": ["Holidays"], "extra": "", "kind": "Carta 25 · Winter Haven", "title": "¡Feliz diciembre!", "date": "2021-12-06T12:38:00", "group": "2021-12", "html": "<div class=\"body\"><p>Buenas amigos!<\/p>\n<p>¡Feliz diciembre! Esta semana estuvo bien y muy productiva. ¡La próxima semana también pinta muy bien!<\/p>\n<p>No sé si haya algo muy especial que compartir esta semana, pero supongo que puedo compartir algunas cosas que consideré milagros: por fin pudimos contactar a algunos de nuestros amigos y tuvimos unas lecciones 🔥.<\/p>\n<p>¡Encontramos a gente súper escogida! Aceptaron muy bien la Restauración.<\/p>\n<p>Después de toda una noche de horario estelar (mandando mensajes por Facebook) y muy poco movimiento (#SinAnunciosNuevos), tuvimos una lección y al señor pareció gustarle mucho el mensaje ¡y quiere ir a la iglesia!<\/p>\n<p>Cosas divertidas:<\/p>\n<p>Visitamos el nugget de pollo quemado en Eloise (búsquenlo en Google, es real jaja)<\/p>\n<p>El Élder Dana vino de intercambio con nosotros y se tomó una foto con un Santa negro.<\/p>\n<p>También hicimos que 3 perros nos quisieran tanto que trataron de seguirnos mientras caminábamos.<\/p>\n<p>#buenosperritos<\/p>\n<p>Este sábado, como misión, vamos a conocer y escuchar al Élder Soares junto con algunos otros.<\/p>\n<p>Cuidense mis queridos amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>unicornio más o menos jaja<\/li>\n<li>nuestro árbol de Navidad 🎄<\/li>\n<li>letrero chistoso<\/li>\n<li>probé un raspado de Pelican<\/li>\n<li>hidrante roto (nos lavaron el carro gratis)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-12-06_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-12-06_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-06_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-06_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_116.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_117.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_118.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_119.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "¡Feliz diciembre! Buenas amigos! ¡Feliz diciembre! Esta semana estuvo bien y muy productiva. ¡La próxima semana también pinta muy bien! No sé si haya algo muy especial que compartir esta semana, pero supongo que puedo compartir algunas cosas que consideré milagros: por fin pudimos contactar a algunos de nuestros amigos y tuvimos unas lecciones 🔥. ¡Encontramos a gente súper escogida! Aceptaron muy bien la Restauración. Después de toda una noche de horario estelar (mandando mensajes por Facebook) y muy poco movimiento (#SinAnunciosNuevos), tuvimos una lección y al señor pareció gustarle mucho el mensaje ¡y quiere ir a la iglesia! Cosas divertidas: Visitamos el nugget de pollo quemado en Eloise (búsquenlo en Google, es real jaja) El Élder Dana vino de intercambio con nosotros y se tomó una foto con un Santa negro. También hicimos que 3 perros nos quisieran tanto que trataron de seguirnos mientras caminábamos. #buenosperritos Este sábado, como misión, vamos a conocer y escuchar al Élder Soares junto con algunos otros. Cuidense mis queridos amigos, Elder Jacobs Fotos: unicornio más o menos jaja nuestro árbol de Navidad 🎄 letrero chistoso probé un raspado de Pelican hidrante roto (nos lavaron el carro gratis) Más de esta semana"}, {"id": "l26", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DIC 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["PR", "BR"], "moments": ["Baptism"], "extra": "Puerto Rico Brazil", "kind": "Carta 26 · Winter Haven", "title": "📈💰 Apóstol del Señor 🦤🎰", "date": "2021-12-13T07:01:00", "group": "2021-12", "html": "<div class=\"body\"><p>Buenas! Amigos míos,<\/p>\n<p>Qué pasao? (¿Qué onda?, pero en jerga puertorriqueña). ¡Esta semana nos fue muy bien y hay mucho trabajo que hacer la próxima también! Estoy emocionado.<\/p>\n<p>¡El lunes tuvimos la entrevista bautismal de Arnulfo! Todo salió muy bien (fue en medio de un 🌶 Chili's porque estábamos esperando la comida. Él quería mostrarnos su agradecimiento). Todavía no tiene fecha de bautismo porque el trabajo está de locos para él y necesita tener los domingos libres por completo para que no haya problemas en el futuro. Ojalá sea pronto. Él sabe lo importante que es.<\/p>\n<p>Encontramos a un señor muy increíble que se llama Miguel. ¡Le pusimos fecha para el 19! Habla prácticamente solo inglés, así que ahora le están enseñando los otros élderes, pero lo vemos en la iglesia ¡y ojalá en su bautismo esta semana! Nos pararon en la calle 2 veces mientras andábamos en bici. Uno era un señor bastante buena onda que quería nuestra opinión sobre la interpretación de algunos versículos de la Biblia, y la otra vez fueron 2 señoras vendiendo paneles solares. Querían hablar con nosotros porque somos \"los tocapuertas originales\", y cuando supieron que somos bilingües nos dijeron \"el estándar de oro\". Una plática bastante chistosa porque también nos pidieron consejos para tocar puertas jaja (sí nos dieron agua, así que eso estuvo lindo. Fue una semana muy calurosa). ¡Los mensajes en horario estelar (de 6 a 9pm respondiendo mensajes y comentarios en anuncios de Facebook para tratar de agendar lecciones y mandar referencias) salieron muy bien esta semana! Encontramos 5 amigos nuevos y pudimos mandarlos a otras áreas dentro y fuera de la misión y, por suerte, a nuestra propia área. ¡Terminábamos una lección y otra persona decía que quería platicar y también mandaba su número! Fue increíble, puras lecciones una tras otra.<\/p>\n<p>Lo último súper increíble de esta semana fue el Élder Soares. Él, junto con 3 de los Setenta (el Élder Holland, Patrick y Johnson), vino a Florida. ¡Hablaron a los jóvenes adultos el jueves en la noche, a los hispanohablantes el viernes y el sábado en la mañana a nuestra misión! En la tarde, a los líderes. Fue súper divertido poder ver a todos los otros misioneros, tomarnos una foto todos juntos y luego escuchar las palabras de un apóstol. ¡También es un señor bastante chistoso! El inglés es su 5o idioma después del portugués, español, francés e italiano, así que dijo algunas frases chistosas y estaba dispuesto a reírse de sí mismo. Todos sus mensajes para nosotros giraron mucho en torno a nuestro propósito divino y nuestro llamamiento como misioneros, aunque no lo planearon juntos. Esta semana empecé Helamán. Los nefitas y los lamanitas tienen paz y guerra y paz otra vez, pero solo cuando Cristo está en el centro. También hay muchas más bendiciones cuando Cristo y los mandamientos son su primera prioridad. Como misionero, casi todo eso es bastante fácil de hacer, pero a veces nos distraemos con otras cosas de menos valor. Lo bueno, lo mejor y lo excelente, como dicen algunos sabios. A veces la manera de llegar a ser mejores es dejar atrás las cosas menores, porque ya tenemos las mejores cosas, pero se nos olvida ponerlas en nuestro horario porque las cosas menores ocupan el espacio. Pasta luego mis queridos amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Boba Fett &amp; Baby Yoda<\/li>\n<li>sopes (básicamente una tostada, pero con la masa frita en forma de tazón para que todo se quede mejor adentro)<\/li>\n<li>perritos que nos siguieron por todos lados (si me dieran un centavo por cada vez que un perro me ha seguido, tendría bastantes centavos [¿de qué caricatura es?])<\/li>\n<li>nacimiento que hizo Miguel<\/li>\n<li>Chippy y el Élder Izu durante nuestra lección<\/li>\n<li>minion<\/li>\n<li>rana &amp; 🦎☠<\/li>\n<li>nuestro árbol ya tiene adornos<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-12-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-13_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-13_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_0_5.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-13_1_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-13_1_1.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_1_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_2_0.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_120.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_121.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_122.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_123.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_124.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "📈💰 Apóstol del Señor 🦤🎰 Buenas! Amigos míos, Qué pasao? (¿Qué onda?, pero en jerga puertorriqueña). ¡Esta semana nos fue muy bien y hay mucho trabajo que hacer la próxima también! Estoy emocionado. ¡El lunes tuvimos la entrevista bautismal de Arnulfo! Todo salió muy bien (fue en medio de un 🌶 Chili's porque estábamos esperando la comida. Él quería mostrarnos su agradecimiento). Todavía no tiene fecha de bautismo porque el trabajo está de locos para él y necesita tener l sionero también ha estado bastante bien. Puedo seguir enseñando, pero también ayudar a llevar el espíritu navideño.<\/p>\n<p>Tuvimos la fiesta de Navidad del barrio, que estuvo súper divertida. Vinieron algunos amigos y hubo un montón de comida rica, música y vibra navideña 🎄. 2 miembros nos dieron regalos 🎁. Una corbata nueva y un collar puertorriqueño, chéquenlo en las fotos. El miércoles tuvimos conferencia de zona. Fue súper increíble volver a ver a algunos de los otros misioneros (el Élder Nelson &amp; su nuevo misionero en capacitación, o sea mi 3er hermano).<\/p>\n<p>Esta semana tuve intercambio del lunes en la noche al miércoles en la mañana. El Élder Seamons &amp; el Élder Dana vinieron a acompañarme en Cypress Gardens. Fue súper divertido. Intentamos hablar con un pájaro loco que tenía un señor. ¡Le dimos clase de inglés a un montón de gente! Fue una locura, pero increíble.<\/p>\n<p>¡El domingo se bautizó Miguel! El Élder Izu y yo lo encontramos la semana pasada, pero como habla prácticamente solo inglés, tuvimos que pasárselo a los otros élderes. Por suerte su bautismo fue antes de nuestra reunión, así que también pudimos ir y dar discursos. Estaba súper emocionado.<\/p>\n<p>El barrio también tuvo su primer coro de Navidad, así que eso estuvo padre.<\/p>\n<p>Esta semana estuvo bien, aunque medio no me acuerdo de ella.<\/p>\n<p>Acabo de llegar a 3 Nefi en mi lectura. Me encantan todas las profecías de Cristo. Definitivamente los animo a leer algunas escrituras sobre lo que Cristo hizo por nosotros o por qué Su nacimiento es tan importante.<\/p>\n<p>Feliz Navidad a todos (\"quédate con el cambio, animal asqueroso\", me encanta Mi pobre angelito),<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.D. Por favor oren para que nuestros amigos se sientan mejor pronto (sobre todo Vidal, que tiene unas piedras en el riñón bastante feas)<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Bautismo de Miguel<\/li>\n<li>corbatas<\/li>\n<li>collar<\/li>\n<li>pájaro<\/li>\n<li>oreja de elefante (y ni siquiera es la más grande que he visto)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-12-20_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-20_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-20_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_125.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_126.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_127.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_128.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_129.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_130.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_131.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_132.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_133.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_134.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_135.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_136.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_137.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_138.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_139.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_140.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🎊🎁 Feliz Navidad 🎄 ¡Feliz Navidad, mis queridos amigos! La Navidad es una de mis épocas favoritas del año y como misionero también ha estado bastante bien. Puedo seguir enseñando, pero también ayudar a llevar el espíritu navideño. Tuvimos la fiesta de Navidad del barrio, que estuvo súper divertida. Vinieron algunos amigos y hubo un montón de comida rica, música y vibra navideña 🎄. 2 miembros nos dieron regalos 🎁. Una corbata nueva y un collar puertorriqueño, chéquenlo en las fotos. El miércoles tuvimos conferencia de zona. Fue súper increíble volver a ver a algunos de los otros misioneros (el Élder Nelson & su nuevo misionero en capacitación, o sea mi 3er hermano). Esta semana tuve intercambio del lunes en la noche al miércoles en la mañana. El Élder Seamons & el Élder Dana vinieron a acompañarme en Cypress Gardens. Fue súper divertido. Intentamos hablar con un pájaro loco que tenía un señor. ¡Le dimos clase de inglés a un montón de gente! Fue una locura, pero increíble. ¡El domingo se bautizó Miguel! El Élder Izu y yo lo encontramos la semana pasada, pero como habla prácticamente solo inglés, tuvimos que pasárselo a los otros élderes. Por suerte su bautismo fue antes de nuestra reunión, así que también pudimos ir y dar discursos. Estaba súper emocionado. El barrio también tuvo su primer coro de Navidad, así que eso estuvo padre. Esta semana estuvo bien, aunque medio no me acuerdo de ella. Acabo de llegar a 3 Nefi en mi lectura. Me encantan todas las profecías de Cristo. Definitivamente los animo a leer algunas escrituras sobre lo que Cristo hizo por nosotros o por qué Su nacimiento es tan importante. Feliz Navidad a todos (\"quédate con el cambio, animal asqueroso\", me encanta Mi pobre angelito), Elder Jacobs P.D. Por favor oren para que nuestros amigos se sientan mejor pronto (sobre todo Vidal, que tiene unas piedras en el riñón bastante feas) Fotos: Bautismo de Miguel corbatas collar pájaro oreja de elefante (y ni siquiera es la más grande que he visto) Más de esta semana"}, {"id": "l28", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DIC 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": [], "moments": ["Holidays"], "extra": "", "kind": "Carta 28 · Winter Haven", "title": "🎊🎆🐉Feliz año nuevo! 🎉✨", "date": "2021-12-27T06:46:00", "group": "2021-12", "html": "<div class=\"body\"><p>¡Espero que todos hayan tenido una Nochebuena y una Navidad increíbles!<\/p>\n<p>(sí, mencioné la Nochebuena porque fue cuando la mayoría de nuestros amigos celebraron. Celebran en la noche hasta muy tarde y duermen todo el 25).<\/p>\n<p>Ser misionero en la época navideña es genial, pero en Nochebuena y Navidad no tanto. Al final sí encontramos algo que hacer (hornear galletas y llevarlas a la gente). También es una tradición familiar, así que disfruté mucho compartirla con el Élder Izu y con otros misioneros también.<\/p>\n<p>También algunos miembros nos dieron de comer esas dos noches y, claro, abrimos regalos 🎁. 👔👔👔 En Navidad nos juntamos para un brunch de distrito y comimos un montón.<\/p>\n<p>Esta semana platicamos con un \"former\" que tiene un testimonio muy fuerte del Evangelio y del Libro de Mormón; el único problema es que ahorita está bastante ocupado, así que ojalá después de Año Nuevo podamos empezar a enseñarle otra vez. ¡También encontramos a 2 miembros que se desconectaron de la Iglesia cuando se mudaron, así que pudimos ayudar con eso! (¡Más poseedores del sacerdocio!) Tuvimos entrevistas con el presidente y su esposa. Al presidente se le hizo tarde, pero la hermana Hollingsworth ya había terminado, así que todos volvimos a entrar y tuvimos una entrevista en grupo con ella jaja. Me encanta poder reunirme con ellos, recibir ayuda y sentir su amor. Por cierto, mamá, me quieren mucho y no quieren que te preocupes jaja.<\/p>\n<p>En fin, los amamos mucho amigos. Espero que su Año Nuevo también sea increíble. Cuéntenme si tienen algún propósito chistoso este año,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>El Élder Izu y yo haciendo galletas<\/li>\n<li>Recorte de cartón de Luke Skywalker del intercambio de elefante blanco<\/li>\n<li>resultados del intercambio de elefante blanco<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-12-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-12-27_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_141.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_142.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_143.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_144.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_145.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_146.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_147.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_148.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🎊🎆🐉Feliz año nuevo! 🎉✨ ¡Espero que todos hayan tenido una Nochebuena y una Navidad increíbles! (sí, mencioné la Nochebuena porque fue cuando la mayoría de nuestros amigos celebraron. Celebran en la noche hasta muy tarde y duermen todo el 25). Ser misionero en la época navideña es genial, pero en Nochebuena y Navidad no tanto. Al final sí encontramos algo que hacer (hornear galletas y llevarlas a la gente). También es una tradición familiar, así que disfruté mucho compartirla con el Élder Izu y con otros misioneros también. También algunos miembros nos dieron de comer esas dos noches y, claro, abrimos regalos 🎁. 👔👔👔 En Navidad nos juntamos para un brunch de distrito y comimos un montón. Esta semana platicamos con un \"former\" que tiene un testimonio muy fuerte del Evangelio y del Libro de Mormón; el único problema es que ahorita está bastante ocupado, así que ojalá después de Año Nuevo podamos empezar a enseñarle otra vez. ¡También encontramos a 2 miembros que se desconectaron de la Iglesia cuando se mudaron, así que pudimos ayudar con eso! (¡Más poseedores del sacerdocio!) Tuvimos entrevistas con el presidente y su esposa. Al presidente se le hizo tarde, pero la hermana Hollingsworth ya había terminado, así que todos volvimos a entrar y tuvimos una entrevista en grupo con ella jaja. Me encanta poder reunirme con ellos, recibir ayuda y sentir su amor. Por cierto, mamá, me quieren mucho y no quieren que te preocupes jaja. En fin, los amamos mucho amigos. Espero que su Año Nuevo también sea increíble. Cuéntenme si tienen algún propósito chistoso este año, Elder Jacobs Fotos: El Élder Izu y yo haciendo galletas Recorte de cartón de Luke Skywalker del intercambio de elefante blanco resultados del intercambio de elefante blanco Más de esta semana"}, {"id": "l29", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">ENE 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": ["HT"], "moments": ["Baptism", "Holidays"], "extra": "Haiti", "kind": "Carta 29 · Winter Haven", "title": "🐊Feliz año nuevo! 🦕🎉🎊🎆🎇✨", "date": "2022-01-03T09:28:00", "group": "2022-01", "html": "<div class=\"body\"><p>¡Wuuu 2022, baby! Es broma, es medio raro, sobre todo porque alguien me dijo que voy a ser misionero todo este próximo año.<\/p>\n<p>Buenas amigos míos!<\/p>\n<p>Como le va? O si por alguna razón saben criollo haitiano: koman w ye?<\/p>\n<p>Voy a aprender más frases en criollo haitiano porque si me dieran un centavo por cada vez que conocí a un haitiano, mi español no me alcanzó y necesitaba algo de criollo haitiano, tendría 4 centavos. No es mucho, pero es raro que haya pasado 4 veces. Esta semana nos fue bastante bien, un poco más lenta que la semana de Navidad, sorprendentemente, pero bien de todos modos. ¡Le pusimos fecha a nuestro amigo Quincy! También le hemos estado enseñando a su esposa, pero esta última vez no estaba, así que en la próxima lección veremos si quieren el mismo día. 😄<\/p>\n<p>Nos metimos a escondidas a un fraccionamiento cerrado para tratar de visitar a un \"former\", pero no estaban. Cuando intentamos salir, nos quedamos atrapados.... hay un código en la reja para entrar y salir.... por suerte, después de 5 min de aporrear teclas tratando de adivinar, llegó una señora mayor muy amable y usó su control.<\/p>\n<p>Lake Wales es un lugar raro<\/p>\n<p>Esta semana tuvimos unas lecciones increíbles con nuestros amigos Francisco &amp; Jocelyn y también con Antonio. Están súper cerca de estar listos para el bautismo. Durante la lección con Antonio, hasta nos dijo que querría bautizarse en cuanto supiera un poquito más. Año Nuevo fue un día normal, más o menos. No pasó gran cosa y de 6 a 9pm teníamos que estar en el departamento. No vimos fuegos artificiales por los árboles.<\/p>\n<p>¡Los cambios son mañana y me quedo con el Élder Izu!<\/p>\n<p>Mucho amor!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>nueva amiga Queen (la cerdita de Antonio)<\/li>\n<li>un señor de los mensajes de Facebook<\/li>\n<li>última foto del distrito<\/li>\n<li>Nefi helado<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-01-03_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-03_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-03_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-01-03_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-01-03_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_149.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_150.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🐊Feliz año nuevo! 🦕🎉🎊🎆🎇✨ ¡Wuuu 2022, baby! Es broma, es medio raro, sobre todo porque alguien me dijo que voy a ser misionero todo este próximo año. Buenas amigos míos! Como le va? O si por alguna razón saben criollo haitiano: koman w ye? Voy a aprender más frases en criollo haitiano porque si me dieran un centavo por cada vez que conocí a un haitiano, mi español no me alcanzó y necesitaba algo de criollo haitiano, tendría 4 centavos. No es mucho, pero es raro que haya pasado 4 veces. Esta semana nos fue bastante bien, un poco más lenta que la semana de Navidad, sorprendentemente, pero bien de todos modos. ¡Le pusimos fecha a nuestro amigo Quincy! También le hemos estado enseñando a su esposa, pero esta última vez no estaba, así que en la próxima lección veremos si quieren el mismo día. 😄 Nos metimos a escondidas a un fraccionamiento cerrado para tratar de visitar a un \"former\", pero no estaban. Cuando intentamos salir, nos quedamos atrapados.... hay un código en la reja para entrar y salir.... por suerte, después de 5 min de aporrear teclas tratando de adivinar, llegó una señora mayor muy amable y usó su control. Lake Wales es un lugar raro Esta semana tuvimos unas lecciones increíbles con nuestros amigos Francisco & Jocelyn y también con Antonio. Están súper cerca de estar listos para el bautismo. Durante la lección con Antonio, hasta nos dijo que querría bautizarse en cuanto supiera un poquito más. Año Nuevo fue un día normal, más o menos. No pasó gran cosa y de 6 a 9pm teníamos que estar en el departamento. No vimos fuegos artificiales por los árboles. ¡Los cambios son mañana y me quedo con el Élder Izu! Mucho amor! Elder Jacobs Fotos: nueva amiga Queen (la cerdita de Antonio) un señor de los mensajes de Facebook última foto del distrito Nefi helado Más de esta semana"}, {"id": "l30", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">ENE 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🐊 Caimanes<\/span><\/div>", "cultures": ["MX"], "moments": ["Baptism", "Gators"], "extra": "Mexico", "kind": "Carta 30 · Winter Haven", "title": "🐊 Ok, esto no es épico 🤒🤕", "date": "2022-01-10T07:10:00", "group": "2022-01", "html": "<div class=\"body\"><p>Buenos Días amigos míos! No se preocupen, no estoy enfermo, ni mi compañero. Pero muchos de nuestros amigos sí, de ahí el título. ¡Fuera de eso, esta semana nos fue muy bien!<\/p>\n<p>Pasamos bastante tiempo en Haines City aunque está lejos. Estamos empezando a tener un buen número de amigos allá. Unas señoras nos dieron tacos (de carne asada) y salsa (me ardieron los labios 30 min, pero sabe rico). Encontramos un órgano eléctrico (tristemente no funcionaba) y lo metimos a escondidas al departamento de los otros élderes (acuérdense de cerrar sus puertas con llave, niños).<\/p>\n<p>Esta semana tuvimos unas lecciones increíbles con amigos: Antonio, Francisco &amp; Jocelyn, Maria, Juan &amp; Ydasty, la familia Perez Ortiz, Araceli e Hipolito. Algunas personas han pedido una lista rápida de nuestros amigos para poder orar por ellos, así que ahí está. ⬆️Buena suerte pronunciando algunos de los nombres 😉<\/p>\n<p>Araceli cocina buenísimo. Nos hizo unos sopes caseros (mandé una foto de unos en un correo anterior; básicamente masa frita y luego cosas de tostada encima). Cocina todo el día los viernes. Tal vez tengamos que pasar otra vez a ver si nos da más; dice que tiene las mejores enchiladas. 🤩🧐<\/p>\n<p>¡Arnulfo vino otra vez a la iglesia! Y tenemos lección este miércoles. Esperamos por fin poder bautizarlo, porque ya hizo todo, solo que la vida estaba muy agitada.<\/p>\n<p>Por favor oren también por nuestros miembros, porque solo tuvimos 1 hora de iglesia y vinieron como 25 personas por el covid, la gripa, etc. Al final me tocó tocar el piano a trompicones con mis habilidades súper limitadas, pero por lo menos hubo música. Un reto que tenemos el Élder Izu y yo es solo español de 10am a 9pm. A veces es bastante difícil, pero está muy padre hacerlo porque hace que las conversaciones sean más naturales/fáciles y a veces hasta empieza conversaciones. \"Sí, ya sé que soy gringo, pero hablo español. Sí, el Élder Izu parece mexicano, pero habla menos de lo que pensaban\", son ejemplos de lo que tenemos que decir o explicar seguido.<\/p>\n<p>Esta semana he estado estudiando sobre la virtud mientras me preparo para dar una capacitación en nuestro consejo de distrito el martes. Así que he leído un montón de discursos (la mayoría para las mujeres jóvenes) y escrituras. Básicamente, si quieres ser más virtuoso y más como Cristo, necesitas esforzarte por tener mejores cosas en tu vida y buscar las cosas de Dios. Otra cosa es pensar siempre en cosas buenas; así tu mente está ocupada y a la tentación le cuesta más trabajo entrar. ¡Busquen la manera de tener más la mano de Dios en su vida y sean virtuosos, amigos!<\/p>\n<p>Espero que vayan bien y tengan una buena semana amigos! Hasta la proxima,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>nuestros tacos de camarón caseros 🌮 😋 🍤 🦐<\/li>\n<li>mural de caimán bien chido<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-10_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-10_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-10_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_151.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_152.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_153.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_154.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_155.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_156.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_157.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_158.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_159.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐊 Ok, esto no es épico 🤒🤕 Buenos Días amigos míos! No se preocupen, no estoy enfermo, ni mi compañero. Pero muchos de nuestros amigos sí, de ahí el título. ¡Fuera de eso, esta semana nos fue muy bien! Pasamos bastante tiempo en Haines City aunque está lejos. Estamos empezando a tener un buen número de amigos allá. Unas señoras nos dieron tacos (de carne asada) y salsa (me ardieron los labios 30 min, pero sabe rico). Encontramos un órgano eléctrico (tristemente no funcionaba) y lo metimos a escondidas al departamento de los otros élderes (acuérdense de cerrar sus puertas con llave, niños). Esta semana tuvimos unas lecciones increíbles con amigos: Antonio, Francisco & Jocelyn, Maria, Juan & Ydasty, la familia Perez Ortiz, Araceli e Hipolito. Algunas personas han pedido una lista rápida de nuestros amigos para poder orar por ellos, así que ahí está. ⬆️Buena suerte pronunciando algunos de los nombres 😉 Araceli cocina buenísimo. Nos hizo unos sopes caseros (mandé una foto de unos en un correo anterior; básicamente masa frita y luego cosas de tostada encima). Cocina todo el día los viernes. Tal vez tengamos que pasar otra vez a ver si nos da más; dice que tiene las mejores enchiladas. 🤩🧐 ¡Arnulfo vino otra vez a la iglesia! Y tenemos lección este miércoles. Esperamos por fin poder bautizarlo, porque ya hizo todo, solo que la vida estaba muy agitada. Por favor oren también por nuestros miembros, porque solo tuvimos 1 hora de iglesia y vinieron como 25 personas por el covid, la gripa, etc. Al final me tocó tocar el piano a trompicones con mis habilidades súper limitadas, pero por lo menos hubo música. Un reto que tenemos el Élder Izu y yo es solo español de 10am a 9pm. A veces es bastante difícil, pero está muy padre hacerlo porque hace que las conversaciones sean más naturales/fáciles y a veces hasta empieza conversaciones. \"Sí, ya sé que soy gringo, pero hablo español. Sí, el Élder Izu parece mexicano, pero habla menos de lo que pensaban\", son ejemplos de lo que tenemos que decir o explicar seguido. Esta semana he estado estudiando sobre la virtud mientras me preparo para dar una capacitación en nuestro consejo de distrito el martes. Así que he leído un montón de discursos (la mayoría para las mujeres jóvenes) y escrituras. Básicamente, si quieres ser más virtuoso y más como Cristo, necesitas esforzarte por tener mejores cosas en tu vida y buscar las cosas de Dios. Otra cosa es pensar siempre en cosas buenas; así tu mente está ocupada y a la tentación le cuesta más trabajo entrar. ¡Busquen la manera de tener más la mano de Dios en su vida y sean virtuosos, amigos! Espero que vayan bien y tengan una buena semana amigos! Hasta la proxima, Elder Jacobs Fotos: nuestros tacos de camarón caseros 🌮 😋 🍤 🦐 mural de caimán bien chido Más de esta semana"}, {"id": "l31", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">ENE 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><\/div>", "cultures": ["PR"], "moments": [], "extra": "Puerto Rico", "kind": "Carta 31 · Winter Haven", "title": "Car-by", "date": "2022-01-17T10:57:00", "group": "2022-01", "html": "<p class=\"tnote\">Se me olvidó ponerle título a este cuando lo mandé, así que le puse uno después.<\/p><div class=\"body\"><p>Hola Qué tal bröthers?<\/p>\n<p>A Vidal, converso reciente, le encanta decir eso ya que está aprendiendo inglés.<\/p>\n<p>Tuve una buena semana; todavía hubo algunos momentos difíciles/malos, pero sin ellos el resto de la semana no parecería tan bueno. Oposición en todas las cosas, como dice Nefi en 2 Nefi 2.<\/p>\n<p>En fin, la semana estuvo muy buena porque encontramos algunas zonas nuevas donde buscar, ¡lo que significa amigos nuevos! Se ven muy emocionados y aceptaron con gusto el Libro de Mormón. Tristemente no tenemos ninguno, porque Salt Lake no ha mandado más en español desde hace unos meses, así que rip.<\/p>\n<p>¡Carlos, nuestro líder misional de barrio, vino con nosotros a un montón de lecciones y eso estuvo increíble! Tener miembros en las lecciones ayuda a que nuestros amigos tengan personas que ya conocen en la iglesia, y en nuestro caso alguien que sabe el idioma a la perfección, así que puede poner ejemplos increíbles para ayudar al amigo a atar cabos.<\/p>\n<p>El jueves por fin arreglaron nuestro carro, una abolladura pequeña atrás a la izquierda de los misioneros de antes, pero tuvimos que esperar al seguro. Así que mientras esperábamos, nos subimos al carro con los de Winterhaven y fuimos un cuarteto por un día. Sorprendentemente tuvimos mucho éxito y mucha unidad de compañerismo.<\/p>\n<p>Vimos un R.T.I.: roedor de tamaño inusual, o sea una zarigüeya enorme (tristemente no hay foto)<\/p>\n<p>Fuimos a Taco Bell, vimos un carro increíble temático de Kirby, se fue y no alcanzamos a tomarle foto. ¡Pero luego fuimos a un vecindario cualquiera y en la primera casa ahí estaba! ¡Y el dueño, Orlando, es de Puerto Rico y le encantó nuestro mensaje! Vamos a regresar esta semana.<\/p>\n<p>¡Espero que todos estén bien y la estén rompiendo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>carro de Kirby<\/li>\n<li>Intenté cocinar salmón 😋🔥🔥 (la verdad no sé qué hago, pero me estoy volviendo todo un MasterChef, bienvenidos a Flavortown)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-17_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-17_0_1.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_160.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_161.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_162.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_163.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_164.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_165.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_166.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_167.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_168.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_169.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Car-by Se me olvidó ponerle título a este cuando lo mandé, así que le puse uno después. Hola Qué tal bröthers? A Vidal, converso reciente, le encanta decir eso ya que está aprendiendo inglés. Tuve una buena semana; todavía hubo algunos momentos difíciles/malos, pero sin ellos el resto de la semana no parecería tan bueno. Oposición en todas las cosas, como dice Nefi en 2 Nefi 2. En fin, la semana estuvo muy buena porque encontramos algunas zonas nuevas donde buscar, ¡lo que significa amigos nuevos! Se ven muy emocionados y aceptaron con gusto el Libro de Mormón. Tristemente no tenemos ninguno, porque Salt Lake no ha mandado más en español desde hace unos meses, así que rip. ¡Carlos, nuestro líder misional de barrio, vino con nosotros a un montón de lecciones y eso estuvo increíble! Tener miembros en las lecciones ayuda a que nuestros amigos tengan personas que ya conocen en la iglesia, y en nuestro caso alguien que sabe el idioma a la perfección, así que puede poner ejemplos increíbles para ayudar al amigo a atar cabos. El jueves por fin arreglaron nuestro carro, una abolladura pequeña atrás a la izquierda de los misioneros de antes, pero tuvimos que esperar al seguro. Así que mientras esperábamos, nos subimos al carro con los de Winterhaven y fuimos un cuarteto por un día. Sorprendentemente tuvimos mucho éxito y mucha unidad de compañerismo. Vimos un R.T.I.: roedor de tamaño inusual, o sea una zarigüeya enorme (tristemente no hay foto) Fuimos a Taco Bell, vimos un carro increíble temático de Kirby, se fue y no alcanzamos a tomarle foto. ¡Pero luego fuimos a un vecindario cualquiera y en la primera casa ahí estaba! ¡Y el dueño, Orlando, es de Puerto Rico y le encantó nuestro mensaje! Vamos a regresar esta semana. ¡Espero que todos estén bien y la estén rompiendo! Elder Jacobs Fotos: carro de Kirby Intenté cocinar salmón 😋🔥🔥 (la verdad no sé qué hago, pero me estoy volviendo todo un MasterChef, bienvenidos a Flavortown) Más de esta semana"}, {"id": "l32", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">ENE 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><\/div>", "cultures": ["VE"], "moments": [], "extra": "Venezuela", "kind": "Carta 32 · Winter Haven", "title": "📈 Noticias de último esguince 👟🏴‍☠️", "date": "2022-01-24T11:20:00", "group": "2022-01", "html": "<div class=\"body\"><p>Ok, entonces después de mi último correo todos empezaron a jugar básquetbol 🏀 y todo iba bien hasta que el Élder Izu saltó por un rebote, cayó mal y se dobló/torció el tobillo. Luego pasamos unas horas en urgencias. Por suerte no hay nada roto; por ahora anda con muletas, ojalá pueda empezar a caminar un poco esta semana porque las muletas duelen (los que las han usado saben).<\/p>\n<p>En fin, nuestros amigos están bien. La mayoría se enfermó bastante esta semana por el cambio de clima. Pasamos de los 70 u 80 grados a los 50, con mucho viento. Nosotros también nos estuvimos congelando un poco a ratos, pero no nos enfermamos, así que qué bueno. La clase de inglés estuvo bien. Enseñamos \"wouldn't've\" y contracciones x2 como \"whom'std'nt've\" jajaa, pero les encantó. Esta semana tuvimos conferencia de zona. Lean sus escrituras y oren. ¡Dios los ama! La mayoría de lo que aprendí aplica más que nada a los misioneros y a mí personalmente, así que busquen revelación personal.<\/p>\n<p>¡También nuestro amigo José nos pasó algo de música porque al parecer es músico! Avísenme si quieren talento increíble y música venezolana.<\/p>\n<p>El resto de la semana estuvo bastante bien.<\/p>\n<p class=\"sign\">Los amo y buena suerte esta semana sois bestias!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>hora de las muletas<\/li>\n<li>clase de inglés<\/li>\n<li>Conferencia de zona<\/li>\n<li>naranjas tiradas de un camión grande<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-24_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-24_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-24_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-24_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-24_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-24_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-24_0_6.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_170.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_171.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_172.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "📈 Noticias de último esguince 👟🏴‍☠️ Ok, entonces después de mi último correo todos empezaron a jugar básquetbol 🏀 y todo iba bien hasta que el Élder Izu saltó por un rebote, cayó mal y se dobló/torció el tobillo. Luego pasamos unas horas en urgencias. Por suerte no hay nada roto; por ahora anda con muletas, ojalá pueda empezar a caminar un poco esta semana porque las muletas duelen (los que las han usado saben). En fin, nuestros amigos están bien. La mayoría se enfermó bastante esta semana por el cambio de clima. Pasamos de los 70 u 80 grados a los 50, con mucho viento. Nosotros también nos estuvimos congelando un poco a ratos, pero no nos enfermamos, así que qué bueno. La clase de inglés estuvo bien. Enseñamos \"wouldn't've\" y contracciones x2 como \"whom'std'nt've\" jajaa, pero les encantó. Esta semana tuvimos conferencia de zona. Lean sus escrituras y oren. ¡Dios los ama! La mayoría de lo que aprendí aplica más que nada a los misioneros y a mí personalmente, así que busquen revelación personal. ¡También nuestro amigo José nos pasó algo de música porque al parecer es músico! Avísenme si quieren talento increíble y música venezolana. El resto de la semana estuvo bastante bien. Los amo y buena suerte esta semana sois bestias! Elder Jacobs Fotos: hora de las muletas clase de inglés Conferencia de zona naranjas tiradas de un camión grande Más de esta semana"}, {"id": "l33", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">ENE 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 33 · Winter Haven", "title": "🥳🌊 ¡Ya viene el tren de los bautismos! 😇🤕", "date": "2022-01-31T07:37:00", "group": "2022-01", "html": "<div class=\"body\"><p>¿Qué tal queridos amigos?<\/p>\n<p>¡Esta semana estuvo excelente! Aunque empecé la semana con una conmoción cerebral leve, que no fue nada divertida, puro dolor de cabeza constante, tuvimos mucho éxito.<\/p>\n<p>A diferencia de las semanas anteriores, tuvimos un montón de lecciones con nuestros amigos, lo que nos dejó muy poco tiempo para salir a seguir buscando gente nueva a quien enseñar. Pero al final igual encontramos 8 personas nuevas esta semana.<\/p>\n<p>La razón por la que el título de este correo es \"tren de los bautismos\" es 1. el tren de la Biblia de Johnny Cash 🚅😎🛤 y 2. muchos de nuestros amigos han expresado el deseo de bautizarse pronto. Erby, Jhon, José y Antonio (26 de feb.) han expresado este deseo y, si no lo hemos hecho ya, ojalá les pongamos fecha esta semana 🌊🌊🌊.<\/p>\n<p>Otras cosas que pasaron esta semana:<\/p>\n<ul class=\"bul\">\n<li>un frío tremendo esta semana...<\/li>\n<li>¡El Élder Izu ya pudo apoyar un poco el pie!<\/li>\n<li>vimos unos perros 🐕 🐶 increíbles<\/li>\n<li>Toqué el piano en la sacramental otra vez<\/li>\n<li>también en la Primaria 🤩<\/li>\n<li>le enseñé a Vidal la frase \"what's pop'in?\"<\/li>\n<\/ul>\n<p>Esta semana terminé 4 Nefi y empecé Mormón. Me encanta la parte de que no hay \"-itas\", sino un solo pueblo, hijos de Cristo. El discurso del Élder Holland de la conferencia pasada habla de eso muy bien, vayan a leerlo.<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2021/10/12holland?lang=eng<\/p>\n<p>Esta semana tenemos entrevistas con el presidente y la hermana Hollingsworth, lo que significa que solo faltan 2 semanas para los cambios. El tiempo vuela. También tengo un intercambio esta semana con los asistentes del presidente (APs), así que les cuento cómo me va. manténganse calientes<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>perrita bien padre, husky + canino, de ahí el color del pelaje (se me olvidó su nombre, perdón)<\/li>\n<li>Dillon, el perrito de Vidal (trae puesto su ponchito)<\/li>\n<li>Elder Izu tenía hambre<\/li>\n<li>Dibujé a Shrek<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-31_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-31_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-31_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-31_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-31_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_173.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_174.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_175.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_176.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🥳🌊 ¡Ya viene el tren de los bautismos! 😇🤕 ¿Qué tal queridos amigos? ¡Esta semana estuvo excelente! Aunque empecé la semana con una conmoción cerebral leve, que no fue nada divertida, puro dolor de cabeza constante, tuvimos mucho éxito. A diferencia de las semanas anteriores, tuvimos un montón de lecciones con nuestros amigos, lo que nos dejó muy poco tiempo para salir a seguir buscando gente nueva a quien enseñar. Pero al final igual encontramos 8 personas nuevas esta semana. La razón por la que el título de este correo es \"tren de los bautismos\" es 1. el tren de la Biblia de Johnny Cash 🚅😎🛤 y 2. muchos de nuestros amigos han expresado el deseo de bautizarse pronto. Erby, Jhon, José y Antonio (26 de feb.) han expresado este deseo y, si no lo hemos hecho ya, ojalá les pongamos fecha esta semana 🌊🌊🌊. Otras cosas que pasaron esta semana: un frío tremendo esta semana... ¡El Élder Izu ya pudo apoyar un poco el pie! vimos unos perros 🐕 🐶 increíbles Toqué el piano en la sacramental otra vez también en la Primaria 🤩 le enseñé a Vidal la frase \"what's pop'in?\" Esta semana terminé 4 Nefi y empecé Mormón. Me encanta la parte de que no hay \"-itas\", sino un solo pueblo, hijos de Cristo. El discurso del Élder Holland de la conferencia pasada habla de eso muy bien, vayan a leerlo. https://www.churchofjesuschrist.org/study/general-conference/2021/10/12holland?lang=eng Esta semana tenemos entrevistas con el presidente y la hermana Hollingsworth, lo que significa que solo faltan 2 semanas para los cambios. El tiempo vuela. También tengo un intercambio esta semana con los asistentes del presidente (APs), así que les cuento cómo me va. manténganse calientes Los amo! Elder Jacobs Fotos: perrita bien padre, husky + canino, de ahí el color del pelaje (se me olvidó su nombre, perdón) Dillon, el perrito de Vidal (trae puesto su ponchito) Elder Izu tenía hambre Dibujé a Shrek Más de esta semana"}, {"id": "l34", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">FEB 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">🎄 Días festivos<\/span><\/div>", "cultures": ["PR"], "moments": ["Baptism", "Holidays"], "extra": "Puerto Rico", "kind": "Carta 34 · Winter Haven", "title": "¡Cuarentena por 🅱️ovid y ETs!", "date": "2022-02-07T05:48:00", "group": "2022-02", "html": "<div class=\"body\"><p>Sí, leyeron bien. Perdón, abuela Fox, pero ya me compuse (ya no soy un tritón)<\/p>\n<p>Hola amigos!<\/p>\n<p>Esta semana fue pues... una semana perdida, la verdad no pasó mucho. El lunes pasado, y de hecho desde el fin de semana, el Élder Izu y yo nos sentíamos raros, pero no le dimos mucha importancia. El lunes en la noche sentía que me moría, ¡pero teníamos trabajo que hacer! Luego el martes en la mañana me sentía tan mal que quería voltearme y morirme para que se me quitara el dolor de cabeza y todo lo demás. La Hermana Meese, la enfermera de la misión, nos dijo que nos hiciéramos la prueba, pero me sentía tan mal que no me podía mover. Por suerte, los élderes de Winterhaven nos compraron pruebas y clarísimo: teníamos el 🅱️ovid.<\/p>\n<p>Por si les interesan mis síntomas: me estaba congelando pero sudando a chorros, y viceversa. El dolor de cabeza era constante e implacable, y solo bajaba un poco con analgésicos. Y me dolía un poco el cuerpo, pero sobre todo después de estornudar, y eso dolía muchísimo.<\/p>\n<p>Todo bien ahora! Ya no estoy enfermo y ya salimos de la cuarentena (5 días adentro y de 5 a 10 con cubrebocas siempre que estemos cerca de otros). No pasó mucho de trabajo misional porque estábamos muy enfermos, pero otros misioneros y miembros nos dejaron cosas como botanas, pistolas Nerf y medicina.<\/p>\n<p>Arnulfo vino a la iglesia y también nuestros amigos José y Ydasty. A todos les gustó y al hijo de José &amp; Ydasty le encantó la Primaria (la hermana Leticia lo sobornó con una galleta jaja). ¡Las hermanas tuvieron un bautismo y ellos también fueron! Pero (siempre hay un pero), anoche nos llamaron los AP. Los cambios son la próxima semana, así que la llamada llegó temprano, pero es porque nos van a hacer un ET, un cambio de emergencia. El Élder Izu se va a Tampa Spanish y yo me voy a Peace River en la zona de Fort Myers (un área/rama en inglés que tiene misioneros de habla hispana para cuando encuentran a algún latino). Cypress Gardens East va a quedar vacía una semana y luego ¿la llenarán en los cambios? Eso último es un misterio porque nos faltan misioneros de habla hispana. Una buena parte de la misión fue reasignada mientras esperaban visas y que abrieran las fronteras, y ahora ya todo está bien.<\/p>\n<p>Amo el barrio y me da tristeza irme, pero algún día voy a volver y me emociona probar algo nuevo. Vayan a escuchar algunas canciones de Funky porque son música épica en español y todas relacionadas con el Evangelio. Me gustan mucho Soy tu Dios &amp; Todavía (la primera trata de los milagros del Antiguo Testamento y el Dios de Israel, y la otra del hijo pródigo). Si no saben español probablemente igual puedan disfrutar la música, pero ojo, la letra no se traduce directo porque Funky es puertorriqueño y usan mucho slang.<\/p>\n<p>Disfrasao' también está buena. Si no quieren buscar en Google o son misioneros, avísenme y les mando las canciones.<\/p>\n<p class=\"sign\">Los amo muchísimo queridos amigos! Espero que no estén enfermos cómo yo estuve<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>cuarentena (cuando por fin nos sentimos lo bastante bien para vestirnos normal)<\/li>\n<li>Fotos viejas que se me olvidaron del intercambio de regalos de Navidad y del otro día<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-02-07_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-07_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-07_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_177.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "¡Cuarentena por 🅱️ovid y ETs! Sí, leyeron bien. Perdón, abuela Fox, pero ya me compuse (ya no soy un tritón) Hola amigos! Esta semana fue pues... una semana perdida, la verdad no pasó mucho. El lunes pasado, y de hecho desde el fin de semana, el Élder Izu y yo nos sentíamos raros, pero no le dimos mucha importancia. El lunes en la noche sentía que me moría, ¡pero teníamos trabajo que hacer! Luego el martes en la mañana me sentía tan mal que quería voltearme y morirme para que se me quitara el dolor de cabeza y todo lo demás. La Hermana Meese, la enfermera de la misión, nos dijo que nos hiciéramos la prueba, pero me sentía tan mal que no me podía mover. Por suerte, los élderes de Winterhaven nos compraron pruebas y clarísimo: teníamos el 🅱️ovid. Por si les interesan mis síntomas: me estaba congelando pero sudando a chorros, y viceversa. El dolor de cabeza era constante e implacable, y solo bajaba un poco con analgésicos. Y me dolía un poco el cuerpo, pero sobre todo después de estornudar, y eso dolía muchísimo. Todo bien ahora! Ya no estoy enfermo y ya salimos de la cuarentena (5 días adentro y de 5 a 10 con cubrebocas siempre que estemos cerca de otros). No pasó mucho de trabajo misional porque estábamos muy enfermos, pero otros misioneros y miembros nos dejaron cosas como botanas, pistolas Nerf y medicina. Arnulfo vino a la iglesia y también nuestros amigos José y Ydasty. A todos les gustó y al hijo de José & Ydasty le encantó la Primaria (la hermana Leticia lo sobornó con una galleta jaja). ¡Las hermanas tuvieron un bautismo y ellos también fueron! Pero (siempre hay un pero
