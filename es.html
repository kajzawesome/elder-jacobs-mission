ituras, porque si no hacemos las dos cosas, nuestro bienestar espiritual decae y además le hacemos trampa al Espíritu. Necesitamos equilibrio en todo. Así que traten de descubrir si necesitan esforzarse más por ese don que quieren o estudiar más para asegurarse de que el Espíritu esté ahí para ayudarles a recibirlo. Los amo, Elder Jacobs Fotos: lambo @ la iglesia Buffet estilo campestre de Fred's con el Hermano Mosher capitán🇺🇸 Una conversa reciente nos depiló las cejas con hilo (sí, parezco drogado... dolió, ¿ok?..) 🚜🌻 Bob Ross Más de esta semana"}, {"id": "l54", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 54 · Tampa", "title": "👾Capítulo 8 (8.ª área): compuertas🏄‍♂️", "date": "2022-06-27T06:56:00", "group": "2022-06", "html": "<div class=\"body\"><p>Bom día meus queridos amigos,<\/p>\n<p>Como vôces están?<\/p>\n<p>Llegué a la gran ciudad. La buena y vieja Tampa Bay, y ha sido otra cosa. Mi área más grande anterior (por población) era Largo, alias St. Pete, y esta área es todavía más y sobre todo más concentrada. Una gran sorpresa que ni mi compañero, el Élder Dean, ni yo esperábamos fue la posibilidad de cubrir más que nuestra estaca. Por la cantidad de misioneros de español, de áreas y de misioneros que todavía están en capacitación, el área/zona vecina de arriba se cerró para español. Así que por ahora también cubrimos Odessa. RIP nuestras millas y el tiempo manejando.<\/p>\n<p>El lunes dije algunas de mis últimas despedidas a la querida familia Hernández Avalrez, junto con una empacada intensa esa noche. Fue bonito poder estar con los otros élderes durante el P-day y con una de mis familias favoritas que conocí en Brandon. El martes fueron los cambios, como siempre, y tomamos algunas fotos antes de despedirnos de mis antiguos compañeros y de algunos misioneros que se iban a casa (RIP mi papá, el Élder Nelson). El resto del día fue un caos tratando de instalarnos y también enseñar y buscar en la noche.<\/p>\n<p>Aquí sí tenemos clase de inglés; estoy casi seguro de que casi todas las áreas tienen. Así que pude enseñarla el miércoles en la noche. También hay noche de fútbol, pero por lo que pasó en la Corte Suprema había posibles disturbios y nos avisaron que nos quedáramos adentro. Eso estuvo medio feo... muy feo... teníamos buenos planes pero tuvimos que replanear. El domingo estuvo increíble. Algunos amigos vinieron a la iglesia, los hermanaron muchísimo y encontramos unos miembros buenísimos para llevar a las lecciones. También nos pidieron, junto con los otros élderes, que fuéramos a dar nuestro testimonio porque un discursante no pudo estar. Lo agradecí mucho porque así pude presentarme un poco más. Hablé del hijo pródigo y del amor de Dios, más que nada porque de verdad es cierto. Podemos irnos en busca de más bendiciones, paz, gozo, pero al final solo Dios y Su amor serán lo mejor. Me encanta esa parábola y esa verdad sencilla: el amor de Dios es incondicional, pero Él también quiere que lleguemos a ser mejores.<\/p>\n<p>Ahorita las \"compuertas\" son los otros élderes y la enorme cantidad de referencias. Ellos salen a buscar y hablan con todo el mundo, y luego nos mandan a cada persona que habla español, así que tenemos que hacer un montón de llamadas y visitas. Es una locura, y la mayoría de verdad quiere hablar; así fue como encontramos a María.<\/p>\n<p>Estos son nuestros amigos actuales, por si pueden orar por ellos:<\/p>\n<ul class=\"bul\">\n<li>Ada &amp; Julian<\/li>\n<li>Alan<\/li>\n<li>Carlos<\/li>\n<li>Blanca<\/li>\n<li>Margarita<\/li>\n<li>Luis Enrique<\/li>\n<li>María (¡fue una referencia y ya vio la película de la Restauración!)<\/li>\n<li>Greisy, Omar, &amp; Veronica<\/li>\n<li>Letty<\/li>\n<li>Guadalina<\/li>\n<li>Dary<\/li>\n<\/ul>\n<p class=\"sign\">Los amo y espero por su mensaje y como fue su Semana! Pasta luego!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Selfies del Élder Dean &amp; yo<\/li>\n<li>Despidiéndome del Élder Nelson<\/li>\n<li>Familia Hernández Avalrez<\/li>\n<li>Alexis<\/li>\n<li>mapache<\/li>\n<li>Zapatos en el congelador (nos dijeron que tal vez teníamos chinches, así que empezamos a tomar precauciones; ya veremos si tenemos, porque no hemos visto ni sentido nada. RIP los otros élderes que sí tienen ahorita)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-06-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_7.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_318.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_319.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_320.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_321.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_322.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_323.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_324.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_325.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_326.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_327.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_328.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "👾Capítulo 8 (8.ª área): compuertas🏄‍♂️ Bom día meus queridos amigos, Como vôces están? Llegué a la gran ciudad. La buena y vieja Tampa Bay, y ha sido otra cosa. Mi área más grande anterior (por población) era Largo, alias St. Pete, y esta área es todavía más y sobre todo más concentrada. Una gran sorpresa que ni mi compañero, el Élder Dean, ni yo esperábamos fue la posibilidad de cubrir más que nuestra estaca. Por la cantidad de misioneros de español, de áreas y de misioneros que todavía están en capacitación, el área/zona vecina de arriba se cerró para español. Así que por ahora también cubrimos Odessa. RIP nuestras millas y el tiempo manejando. El lunes dije algunas de mis últimas despedidas a la querida familia Hernández Avalrez, junto con una empacada intensa esa noche. Fue bonito poder estar con los otros élderes durante el P-day y con una de mis familias favoritas que conocí en Brandon. El martes fueron los cambios, como siempre, y tomamos algunas fotos antes de despedirnos de mis antiguos compañeros y de algunos misioneros que se iban a casa (RIP mi papá, el Élder Nelson). El resto del día fue un caos tratando de instalarnos y también enseñar y buscar en la noche. Aquí sí tenemos clase de inglés; estoy casi seguro de que casi todas las áreas tienen. Así que pude enseñarla el miércoles en la noche. También hay noche de fútbol, pero por lo que pasó en la Corte Suprema había posibles disturbios y nos avisaron que nos quedáramos adentro. Eso estuvo medio feo... muy feo... teníamos buenos planes pero tuvimos que replanear. El domingo estuvo increíble. Algunos amigos vinieron a la iglesia, los hermanaron muchísimo y encontramos unos miembros buenísimos para llevar a las lecciones. También nos pidieron, junto con los otros élderes, que fuéramos a dar nuestro testimonio porque un discursante no pudo estar. Lo agradecí mucho porque así pude presentarme un poco más. Hablé del hijo pródigo y del amor de Dios, más que nada porque de verdad es cierto. Podemos irnos en busca de más bendiciones, paz, gozo, pero al final solo Dios y Su amor serán lo mejor. Me encanta esa parábola y esa verdad sencilla: el amor de Dios es incondicional, pero Él también quiere que lleguemos a ser mejores. Ahorita las \"compuertas\" son los otros élderes y la enorme cantidad de referencias. Ellos salen a buscar y hablan con todo el mundo, y luego nos mandan a cada persona que habla español, así que tenemos que hacer un montón de llamadas y visitas. Es una locura, y la mayoría de verdad quiere hablar; así fue como encontramos a María. Estos son nuestros amigos actuales, por si pueden orar por ellos: Ada & Julian Alan Carlos Blanca Margarita Luis Enrique María (¡fue una referencia y ya vio la película de la Restauración!) Greisy, Omar, & Veronica Letty Guadalina Dary Los amo y espero por su mensaje y como fue su Semana! Pasta luego! Elder Jacobs Fotos: Selfies del Élder Dean & yo Despidiéndome del Élder Nelson Familia Hernández Avalrez Alexis mapache Zapatos en el congelador (nos dijeron que tal vez teníamos chinches, así que empezamos a tomar precauciones; ya veremos si tenemos, porque no hemos visto ni sentido nada. RIP los otros élderes que sí tienen ahorita) Más de esta semana"}, {"id": "l55", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 55 · Tampa", "title": "✨️🇺🇲Feliz Día de Independencia🎆🎇", "date": "2022-07-04T11:46:00", "group": "2022-07", "html": "<div class=\"body\"><p>¡Feliz 4 de julio, amigos!<\/p>\n<p>Espero que puedan disfrutar hoy con unos fuegos artificiales divertidos, carne asada, familia, amigos, etc.<\/p>\n<p>Cuéntenme qué onda por correo, por Messenger (para que sepan, no puedo responder ahí) o mándenme unas fotos. Tristemente no podemos usar fuegos artificiales de ningún tipo, pero hoy planeamos ir a algún lado a comer BBQ con el distrito. Bueno, esta semana estuvo medio difícil; la enorme cantidad de trabajo (o sea, referencias) que nos llegaba fue un poco estresante, pero sobrevivimos, encontramos la forma de que todo funcionara y hoy podemos descansar un poco para asegurarnos de poder hacerlo otra vez esta semana. A nuestros amigos les va súper bien, ¡Letty quiere bautizarse!<\/p>\n<p>Le enseñamos el lunes en la noche. Vive con un miembro y su familia, así que fuimos el lunes, comimos unas baleadas buenísimas y luego enseñamos. Hablamos del árbol de la vida y también del Evangelio (fe, arrepentimiento, bautismo, Espíritu Santo y perseverar hasta el fin). Estamos emocionados por ella, solo necesitamos encontrar un horario más constante para reunirnos, pero está leyendo un montón en el Libro de Mormón.<\/p>\n<p>El martes fui a mi primer intercambio como líder de distrito. El Élder Huffaker, de South Tampa, vino conmigo para hablar español. Estuvo bastante divertido; qué bueno que podré hacer más en las próximas semanas. ¡Está trabajando en su español para poder ayudar más! La clase de inglés de esta semana estuvo increíble, vino más gente. Uno de ellos es mi nuevo amigo, Diogo (Yi-o-gu), que, por si no se dieron cuenta, no es como se pronunciaría su nombre en español: él habla portugués. Por suerte, hace un tiempo había empezado a aprender portugués, así que pude enseñarle inglés. Es buenísimo y estoy emocionado de seguir aprendiendo más portugués con él y de enseñarle inglés.<\/p>\n<p>Me tomé un coco 🥥 fresco entero y le enseñamos a la señora que nos dio los cocos. ¡También pudimos reunirnos con María! Tenía muchísimas ganas de reunirse, pero necesitábamos que viniera un hombre con nosotros para entrar a su casa. Fue una lección buenísima sobre el plan de salvación y ya quiero ver qué pasa este miércoles.<\/p>\n<p>Tristemente no hubo fútbol el viernes en la noche. Mi suerte, supongo. En 6 semanas en Largo nunca se hizo, y en 18 en Cypress Gardens se hizo 1 o 2 veces. ¡Ojalá pronto!<\/p>\n<p>No hay mucho más que contar del sábado o del domingo, salvo que hemos estado llamando o pasando a ver a las referencias, y hemos visto Milagros increíbles de personas que buscaban desesperadamente una iglesia o algún tipo de luz, y entonces llegamos nosotros y les ayudamos.<\/p>\n<p>He aprendido muchísimo sobre cómo el Señor nos prepara y nos da la manera de hacer Su obra. Pude empezar a usar más mi portugués y mejorarlo, me sentí abrumado por la cantidad de trabajo y entonces empecé a confiar en el Espíritu, me preocupé por enseñar y encontré una manera de enseñar de forma sencilla y poderosa, etc. Mi misión me ha grabado muchas escrituras, y yo también testifico con Nefi:<\/p>\n<p>Iré y haré lo que el Señor ha mandado, porque sé que él nunca da mandamientos a los hijos de los hombres sin prepararles la vía para que cumplan lo que les ha mandado Nefi 3:7<\/p>\n<p class=\"sign\">Los amo muito meus amigos, bom día!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos<\/p>\n<ul class=\"bul\">\n<li>¡Diogo en la iglesia con nosotros!<\/li>\n<li>APs &amp; Irmão Benicio<\/li>\n<li>meme<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-07-04_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-04_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-04_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_329.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_330.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_331.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_332.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "✨️🇺🇲Feliz Día de Independencia🎆🎇 ¡Feliz 4 de julio, amigos! Espero que puedan disfrutar hoy con unos fuegos artificiales divertidos, carne asada, familia, amigos, etc. Cuéntenme qué onda por correo, por Messenger (para que sepan, no puedo responder ahí) o mándenme unas fotos. Tristemente no podemos usar fuegos artificiales de ningún tipo, pero hoy planeamos ir a algún lado a comer BBQ con el distrito. Bueno, esta semana estuvo medio difícil; la enorme cantidad de trabajo (o sea, referencias) que nos llegaba fue un poco estresante, pero sobrevivimos, encontramos la forma de que todo funcionara y hoy podemos descansar un poco para asegurarnos de poder hacerlo otra vez esta semana. A nuestros amigos les va súper bien, ¡Letty quiere bautizarse! Le enseñamos el lunes en la noche. Vive con un miembro y su familia, así que fuimos el lunes, comimos unas baleadas buenísimas y luego enseñamos. Hablamos del árbol de la vida y también del Evangelio (fe, arrepentimiento, bautismo, Espíritu Santo y perseverar hasta el fin). Estamos emocionados por ella, solo necesitamos encontrar un horario más constante para reunirnos, pero está leyendo un montón en el Libro de Mormón. El martes fui a mi primer intercambio como líder de distrito. El Élder Huffaker, de South Tampa, vino conmigo para hablar español. Estuvo bastante divertido; qué bueno que podré hacer más en las próximas semanas. ¡Está trabajando en su español para poder ayudar más! La clase de inglés de esta semana estuvo increíble, vino más gente. Uno de ellos es mi nuevo amigo, Diogo (Yi-o-gu), que, por si no se dieron cuenta, no es como se pronunciaría su nombre en español: él habla portugués. Por suerte, hace un tiempo había empezado a aprender portugués, así que pude enseñarle inglés. Es buenísimo y estoy emocionado de seguir aprendiendo más portugués con él y de enseñarle inglés. Me tomé un coco 🥥 fresco entero y le enseñamos a la señora que nos dio los cocos. ¡También pudimos reunirnos con María! Tenía muchísimas ganas de reunirse, pero necesitábamos que viniera un hombre con nosotros para entrar a su casa. Fue una lección buenísima sobre el plan de salvación y ya quiero ver qué pasa este miércoles. Tristemente no hubo fútbol el viernes en la noche. Mi suerte, supongo. En 6 semanas en Largo nunca se hizo, y en 18 en Cypress Gardens se hizo 1 o 2 veces. ¡Ojalá pronto! No hay mucho más que contar del sábado o del domingo, salvo que hemos estado llamando o pasando a ver a las referencias, y hemos visto Milagros increíbles de personas que buscaban desesperadamente una iglesia o algún tipo de luz, y entonces llegamos nosotros y les ayudamos. He aprendido muchísimo sobre cómo el Señor nos prepara y nos da la manera de hacer Su obra. Pude empezar a usar más mi portugués y mejorarlo, me sentí abrumado por la cantidad de trabajo y entonces empecé a confiar en el Espíritu, me preocupé por enseñar y encontré una manera de enseñar de forma sencilla y poderosa, etc. Mi misión me ha grabado muchas escrituras, y yo también testifico con Nefi: Iré y haré lo que el Señor ha mandado, porque sé que él nunca da mandamientos a los hijos de los hombres sin prepararles la vía para que cumplan lo que les ha mandado Nefi 3:7 Los amo muito meus amigos, bom día! Elder Jacobs Fotos ¡Diogo en la iglesia con nosotros! APs & Irmão Benicio meme Más de esta semana"}, {"id": "l56", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Carta 56 · Tampa", "title": "🧉A Vida dum missioneiro é boa 🐲", "date": "2022-07-11T07:40:00", "group": "2022-07", "html": "<div class=\"body\"><p>Ola e bom día meus queridos amigos! Estou aquí na cidade de Tampa desfrutando todo, todo bem!<\/p>\n<p>Esta semana ha sido increíble más que nada por 2 cosas. 1. El Espíritu y algunas otras influencias me regañaron bastante fuerte, y 2. Los cambios que hice después trajeron algunos Milagros. Eso de verdad es algo difícil de aceptar, y vaya que lo fue el lunes, pero después de unas horas y para el día siguiente de verdad sentí esa tristeza según Dios y sentí un alivio enorme al arrepentirme y hacer los cambios. Sé que la corrección es difícil de aceptar, pero al final es necesaria.<\/p>\n<p>8 Pero cuantas veces se arrepentían y pedían perdón, con verdadera intención, se les perdonaba.<\/p>\n<p>Moroni 6:8<\/p>\n<p>En fin, a lo que pasó, aparte del portugués al principio del correo, porque lo estoy aprendiendo y me ha ido bien esta semana.<\/p>\n<p>Tuve un intercambio con los líderes de zona 😳 nah, es broma, estuvo tranquilo. Yo enseñé todo porque ellos no hablan español, pero sí saben una que otra cosa de liderazgo, así que eso me ayudó a saber cómo ayudar mejor a mi distrito. Tuvimos conferencia de zona y nos enfocamos en algunas herramientas y cosas clave para ayudarnos a ser maestros expertos. Enseñar como ángeles. (1 Nefi 11)<\/p>\n<p>Diogo me contestó un montón de preguntas de portugués y yo le enseñé inglés. También le compartí un mensaje corto y entendió mi portugués perfectamente. Aos pocos!<\/p>\n<p>Esta semana enseñamos muchísimo y estuvo increíble. Tenemos una familia pequeña a la que empezamos a enseñar; vinieron a la iglesia el domingo, les encantó muchísimo y además tienen un montón de amigos miembros. Estoy emocionado de verlos progresar. Vinieron 7 amigos a la iglesia, lo cual fue una locura tratando de hablar con todos y acomodarlos. Sé que el Libro de Mormón es la palabra de Dios y testifica con muchísimo poder de la verdad en todos los idiomas. Dios es un Padre eterno y amoroso que quiere ayudarnos, y por eso hemos sido bendecidos con el sacrificio de Su Hijo. Ese sacrificio no es una curita que sirve para todo; es un don infinitamente poderoso, hecho a la medida y disponible para todos, que solo necesitamos alcanzar y usar. Como élder, amigo, hermano, etc., doy mi testimonio innegable de estas cosas y nunca lo negaré, en el nombre de Jesucristo. Amén.<\/p>\n<p>Os amo a todos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>compa de la basura<\/li>\n<li>pollo envuelto en tocino (churrasco brasileño)<\/li>\n<li>Charlie (¡gracias por la foto, familia!)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-07-11_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-11_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-11_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_333.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🧉A Vida dum missioneiro é boa 🐲 Ola e bom día meus queridos amigos! Estou aquí na cidade de Tampa desfrutando todo, todo bem! Esta semana ha sido increíble más que nada por 2 cosas. 1. El Espíritu y algunas otras influencias me regañaron bastante fuerte, y 2. Los cambios que hice después trajeron algunos Milagros. Eso de verdad es algo difícil de aceptar, y vaya que lo fue el lunes, pero después de unas horas y para el día siguiente de verdad sentí esa tristeza según Dios y sentí un alivio enorme al arrepentirme y hacer los cambios. Sé que la corrección es difícil de aceptar, pero al final es necesaria. 8 Pero cuantas veces se arrepentían y pedían perdón, con verdadera intención, se les perdonaba. Moroni 6:8 En fin, a lo que pasó, aparte del portugués al principio del correo, porque lo estoy aprendiendo y me ha ido bien esta semana. Tuve un intercambio con los líderes de zona 😳 nah, es broma, estuvo tranquilo. Yo enseñé todo porque ellos no hablan español, pero sí saben una que otra cosa de liderazgo, así que eso me ayudó a saber cómo ayudar mejor a mi distrito. Tuvimos conferencia de zona y nos enfocamos en algunas herramientas y cosas clave para ayudarnos a ser maestros expertos. Enseñar como ángeles. (1 Nefi 11) Diogo me contestó un montón de preguntas de portugués y yo le enseñé inglés. También le compartí un mensaje corto y entendió mi portugués perfectamente. Aos pocos! Esta semana enseñamos muchísimo y estuvo increíble. Tenemos una familia pequeña a la que empezamos a enseñar; vinieron a la iglesia el domingo, les encantó muchísimo y además tienen un montón de amigos miembros. Estoy emocionado de verlos progresar. Vinieron 7 amigos a la iglesia, lo cual fue una locura tratando de hablar con todos y acomodarlos. Sé que el Libro de Mormón es la palabra de Dios y testifica con muchísimo poder de la verdad en todos los idiomas. Dios es un Padre eterno y amoroso que quiere ayudarnos, y por eso hemos sido bendecidos con el sacrificio de Su Hijo. Ese sacrificio no es una curita que sirve para todo; es un don infinitamente poderoso, hecho a la medida y disponible para todos, que solo necesitamos alcanzar y usar. Como élder, amigo, hermano, etc., doy mi testimonio innegable de estas cosas y nunca lo negaré, en el nombre de Jesucristo. Amén. Os amo a todos! Elder Jacobs Fotos: compa de la basura pollo envuelto en tocino (churrasco brasileño) Charlie (¡gracias por la foto, familia!) Más de esta semana"}, {"id": "l57", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><\/div>", "cultures": ["BR", "HT"], "moments": [], "extra": "Brazil Haiti", "kind": "Carta 57 · Tampa", "title": "😵Contra el viento 🌬y marea 🌊", "date": "2022-07-18T08:21:00", "group": "2022-07", "html": "<div class=\"body\"><p>Hola amigos,<\/p>\n<p>\"Contra todo pronóstico\" es lo que eso significa, y creo que describe bastante bien esta semana.<\/p>\n<p>Esta semana tuvimos algunos desafíos con los amigos, la falta de tiempo y nuestra salud, pero al final fue muy productiva.<\/p>\n<p>Para empezar la semana, ¡pensamos que habíamos encontrado otra familia! Hemos estado orando y buscando con mucho empeño, y por eso hemos encontrado parejas y familias que se pueden apoyar unas a otras, pero tristemente algunas decidieron no reunirse con nosotros por ahora. Tal vez en el futuro.<\/p>\n<p>El martes, después del consejo de distrito, el Élder Astorga y yo hicimos un intercambio en mi área. Fue buenísimo servir con él otra vez; lo conocí cuando estaba en Lakeland. Visitamos a una referencia que resultó ser haitiano. Los primeros minutos fueron raros y nos costó comunicarnos porque él sabe francés y criollo y muy poco español. ¡Pero luego le pregunté por el portugués y sí sabía! Pude practicar mi portugués y ayudarlo a ponerse en contacto con los élderes de criollo. ¡Qué buena onda!<\/p>\n<p>Pero el martes no terminó tan bien. Después de la cena empecé a sentir un dolor terrible en medio del estómago que fue empeorando conforme avanzaba la noche. Para las 7:45 ya no aguantaba, así que nos retiramos a la casa a hacer Facebook y llamadas mientras yo trataba de descansar. El dolor no se me quitó, así que llamé a nuestra coordinadora de salud misional, la Hermana Meese. Conseguí unas Tums y todo pareció estar bien.<\/p>\n<p>El miércoles fue un buen día, unas lecciones muy buenas con amigos, y la clase de inglés siempre es lo máximo. Diogo de verdad quiere que lo visite en 🇧🇷 Brasil, así que ese es otro viaje para después de la misión. Voy a ir a visitarlo, quedarme con su familia y comer churrasco, un tipo de BBQ brasileño.<\/p>\n<p>Franklin, alias Chiky (homie), de Brandon, nos pidió que lo ayudáramos a celebrar el cumpleaños de su hermano en Tampa, así que platicamos con ellos y celebramos. Deberíamos poder empezar a enseñarles a ellos también.<\/p>\n<p>El tres leches congelado es una sensación y una experiencia interesante. Aunque no lo recomiendo del todo<\/p>\n<p>El viernes fue cuando todo dejó de ir bien otra vez. Había estado tomando Tums y sintiéndome mejor hasta la hora de la comida del viernes. Terminamos visitando a nuestro converso reciente Milton y luego nos dijeron que fuéramos a urgencias, donde pasamos las siguientes 7 horas. Al final no era apendicitis ni nada, solo tenía el estómago muy mal, así que tengo unas medicinas y de verdad tengo que cuidar lo que como.<\/p>\n<p>El resto del fin de semana igual lo pasamos proselitando, Milagros, lecciones buenísimas, pero yo no estaba al 100%. ¡No se preocupen, ya me estoy recuperando!<\/p>\n<p>2 Nefi 22:2 o Isaías 12:2<\/p>\n<p>He aquí, Dios es mi salvación; confiaré y no temeré, porque el Señor Jehová es mi fortaleza y mi canción; y también ha llegado a ser mi salvación.<\/p>\n<p>Amo la paz, la esperanza y el conocimiento que vienen por medio de mi Salvador. ¡Sé que Él vive! ¡Él es mi fortaleza y puede ser la de ustedes, siempre que pidan y crean en Su nombre!<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>🌧 🌦 🌂 🌈<\/li>\n<li>Patos dinosaurio<\/li>\n<li>Urgencias<\/li>\n<li>¡Élder Dean &amp; cachorrito!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-07-18_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-18_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-18_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-18_0_3.jpg\ lass=\"stamps\"><span class=\"stamp c\" data-c=\"CU\">🇨🇺 Cuba<\/span><\/div>", "cultures": ["CU"], "moments": [], "extra": "Cuba", "kind": "Carta 58 · Tampa", "title": "La buena vida", "date": "2022-07-25T15:39:00", "group": "2022-07", "html": "<div class=\"body\"><p>Buenas tardes!<\/p>\n<p>¡Todo va súper bien! Ya me siento mejor otra vez; comer Chick-fil-A hoy estuvo increíble. Y la semana estuvo bastante decente.<\/p>\n<p>Ser líder de distrito me dio mucho trabajo esta semana. 3 intercambios y 3 más esta semana. Y las llamadas y reuniones de siempre. En general la semana estuvo bien, pero definitivamente rara, porque antes nos estaba yendo muy bien (sobre todo como distrito) y luego llegó esta semana y, en comparación, estuvo fatal.<\/p>\n<p>Sí tuvimos muchas lecciones y encontramos algunos amigos nuevos, pero otros amigos nos dejaron y no había muchos miembros disponibles para ayudarnos en las lecciones.<\/p>\n<p>Hoy tengo muy poco tiempo para escribir, ¡así que perdón! Esta semana fue mucho tocar puertas y hacer llamadas, sin nada muy especial. Los cambios son en una semana, así que probablemente la próxima no tendré mucho tiempo.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>hurones<\/li>\n<li>pájaro<\/li>\n<li>unos bagres con espinas<\/li>\n<li>¡mi nueva placa en portugués!<\/li>\n<li>patos<\/li>\n<li>pizza cubana<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-07-25_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_339.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_340.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_341.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_342.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_343.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "La buena vida Buenas tardes! ¡Todo va súper bien! Ya me siento mejor otra vez; comer Chick-fil-A hoy estuvo increíble. Y la semana estuvo bastante decente. Ser líder de distrito me dio mucho trabajo esta semana. 3 intercambios y 3 más esta semana. Y las llamadas y reuniones de siempre. En general la semana estuvo bien, pero definitivamente rara, porque antes nos estaba yendo muy bien (sobre todo como distrito) y luego llegó esta semana y, en comparación, estuvo fatal. Sí tuvimos muchas lecciones y encontramos algunos amigos nuevos, pero otros amigos nos dejaron y no había muchos miembros disponibles para ayudarnos en las lecciones. Hoy tengo muy poco tiempo para escribir, ¡así que perdón! Esta semana fue mucho tocar puertas y hacer llamadas, sin nada muy especial. Los cambios son en una semana, así que probablemente la próxima no tendré mucho tiempo. Los amo! Elder Jacobs Fotos: hurones pájaro unos bagres con espinas ¡mi nueva placa en portugués! patos pizza cubana Más de esta semana"}, {"id": "l59", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AGO 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colombia<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["CO", "BR"], "moments": ["Baptism"], "extra": "Colombia Brazil", "kind": "Carta 59 · Tampa", "title": "🦤🇨🇴 Locura de un Bautismo! 🌊", "date": "2022-08-01T07:54:00", "group": "2022-08", "html": "<div class=\"body\"><p>Ola amigos! Sim! Um Bautismo!<\/p>\n<p>El Élder Dean y yo trabajamos muy duro esta semana y este cambio, y pudimos vivir el bautismo de nuestro amigo Julian. Oramos juntos el jueves en la noche y recibió una respuesta para bautizarse... ¡este domingo! Andábamos corriendo como pollos sin cabeza tratando de tener todo listo, además de 3 intercambios esta semana, así que fue otra cosa.<\/p>\n<p>Esta semana fui hasta New Port Richey, en la Zona Odessa. Fue interesante, pero no pasó mucho por la cantidad de lluvia. Pero ya puedo decir que he servido en Odessa (más o menos).<\/p>\n<p>También tuvimos nuestro último consejo de distrito. El Élder Dean toca el violín y nos tocó la música. Estuvo muy bueno; en general fue una reunión medio loca, pero el Espíritu se sintió muy fuerte, sobre todo con los testimonios y la música. Recibimos una referencia buenísima del Hermano Betancourt. Es de 🇨🇴 Colombia y algún día nos va a enseñar a tocar sus tambores, ¡pero resulta que él sale a tocar puertas! Fue misionero de barrio y en ese entonces los misioneros no podían tocar puertas, así que él toca puertas y nos refiere gente, jaja. ¡La lección estuvo buenísima! Tuvimos otra esta semana con el mismo amigo, Leonardo. Mi portugués está mejorando. Estoy encontrando más confianza para hablarlo y, con eso, mi fluidez está decente; todavía estoy trabajando en algunas conjugaciones y vocabulario, pero aos pocos (poco a poco), como me enseñó Diogo.<\/p>\n<p>Compramos picanha, un corte de res brasileño, y comimos como reyes. Muchos intercambios esta semana, pero todo bien. Esta semana leí Jacob 5. Noté varias cosas interesantes, pero quiero enfocarme en esta frase: \"Me aflige perder este árbol\"<\/p>\n<p>Este árbol es un hijo de Dios; ustedes son hijos amados a quienes Él hará cualquier cosa por ayudar. Ahorita yo soy siervo de la viña, igual que mis compañeros misioneros, aquí para ayudar al Señor y mostrarles a ustedes el mismo amor y cuidado.<\/p>\n<p>Dios los ama, los conoce y quiere ayudarlos, pero a veces nosotros mismos hacemos que sea difícil recibir esa ayuda. Testifico de ello en el nombre de Jesucristo. Amén.<\/p>\n<p class=\"sign\">Los amo! Até mais tarde!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Bautismo de Julian<\/li>\n<li>El Élder Mott en intercambio bajo el aguacero<\/li>\n<li>la siesta Mott<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-08-01_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-01_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-01_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-01_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-01_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_344.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_345.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_346.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🦤🇨🇴 Locura de un Bautismo! 🌊 Ola amigos! Sim! Um Bautismo! El Élder Dean y yo trabajamos muy duro esta semana y este cambio, y pudimos vivir el bautismo de nuestro amigo Julian. Oramos juntos el jueves en la noche y recibió una respuesta para bautizarse... ¡este domingo! Andábamos corriendo como pollos sin cabeza tratando de tener todo listo, además de 3 intercambios esta semana, así que fue otra cosa. Esta semana fui hasta New Port Richey, en la Zona Odessa. Fue interesante, pero no pasó mucho por la cantidad de lluvia. Pero ya puedo decir que he servido en Odessa (más o menos). También tuvimos nuestro último consejo de distrito. El Élder Dean toca el violín y nos tocó la música. Estuvo muy bueno; en general fue una reunión medio loca, pero el Espíritu se sintió muy fuerte, sobre todo con los testimonios y la música. Recibimos una referencia buenísima del Hermano Betancourt. Es de 🇨🇴 Colombia y algún día nos va a enseñar a tocar sus tambores, ¡pero resulta que él sale a tocar puertas! Fue misionero de barrio y en ese entonces los misioneros no podían tocar puertas, así que él toca puertas y nos refiere gente, jaja. ¡La lección estuvo buenísima! Tuvimos otra esta semana con el mismo amigo, Leonardo. Mi portugués está mejorando. Estoy encontrando más confianza para hablarlo y, con eso, mi fluidez está decente; todavía estoy trabajando en algunas conjugaciones y vocabulario, pero aos pocos (poco a poco), como me enseñó Diogo. Compramos picanha, un corte de res brasileño, y comimos como reyes. Muchos intercambios esta semana, pero todo bien. Esta semana leí Jacob 5. Noté varias cosas interesantes, pero quiero enfocarme en esta frase: \"Me aflige perder este árbol\" Este árbol es un hijo de Dios; ustedes son hijos amados a quienes Él hará cualquier cosa por ayudar. Ahorita yo soy siervo de la viña, igual que mis compañeros misioneros, aquí para ayudar al Señor y mostrarles a ustedes el mismo amor y cuidado. Dios los ama, los conoce y quiere ayudarlos, pero a veces nosotros mismos hacemos que sea difícil recibir esa ayuda. Testifico de ello en el nombre de Jesucristo. Amén. Los amo! Até mais tarde! Elder Jacobs Fotos: Bautismo de Julian El Élder Mott en intercambio bajo el aguacero la siesta Mott Más de esta semana"}, {"id": "l60", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AGO 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 60 · Tampa", "title": "¡Tengo gemelos! 👨‍👦👨‍👦 otro Bautismo 🌊", "date": "2022-08-08T11:22:00", "group": "2022-08", "html": "<div class=\"body\"><p>Ola!<\/p>\n<p>¡Otra semana terminada y bastante movida!<\/p>\n<p>El lunes fue nuestro último P-day como el distrito anterior y lo terminamos con sushi ilimitado en Koizis.<\/p>\n<p>El martes fueron los cambios y me despedí del Élder Dean, que ahora está en Dade City. ¡Pero me quedé sin compañeros! Estuve con el Élder Morris y el Élder Cullimore mientras los 3 esperábamos hasta el jueves, cuando llegaban a Florida nuestros nuevos misioneros en capacitación. Fue un trío increíble, muy divertido, pero también interesante porque nos quedamos en mi área y solo yo hablaba español. Tocamos muchas puertas, ¡pero después del martes &amp; el miércoles ya teníamos lecciones programadas para el resto de la semana! El jueves por fin conocí al Élder Franson &amp; al Élder O'Neill. 2 hijos, compañeros en el CCM, ¡soy papá de gemelos! Empezamos su primer día con un montón de lecciones y preparando a Oner para su bautismo del sábado. Ese ritmo de lecciones siguió el resto de la semana y apenas tuvimos tiempo para estudiar español/portugués.<\/p>\n<p>Estamos enseñando a una familia brasileña de São Paulo, así que ha sido increíble para mi portugués y para ver cómo ahora puedo convivir con más personas y bendecirlas.<\/p>\n<p>¡El presidente Gardiner y su familia llegaron a Florida esta semana! Los conocimos por Zoom, pero luego ellos, él, su esposa y su hija Hannah, de 12 años, vinieron a nuestro bautismo el sábado.<\/p>\n<p>Esta semana quiero testificar más acerca de que Dios contesta las oraciones. Esta semana conocimos a Rigo y a su familia (&amp; a su pato mascota, Pito) porque recibimos una referencia, pero resulta que él vio la película de la Restauración y oró para aprender más, ¡y nosotros llegamos y pudimos contestar todas sus preguntas! He estado orando por familias y por maneras de practicar más portugués, y sigo recibiendo esa ayuda.<\/p>\n<p>Mateo 7:7<\/p>\n<p>Testifico que Dios sí escucha su súplica y quiere ayudarlos, ¡confíen en Él!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Jesús los ama<\/li>\n<li>El bautismo de Oner<\/li>\n<li>Donas del bautismo<\/li>\n<li>adiós, Élder Dean<\/li>\n<li>¡Misioneros en capacitación!<\/li>\n<li>El 1.er día ya encontró un pez<\/li>\n<li>camaleón<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-08-08_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-08_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-08_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-08_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-08_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-08_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_347.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_348.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "¡Tengo gemelos! 👨‍👦👨‍👦 otro Bautismo 🌊 Ola! ¡Otra semana terminada y bastante movida! El lunes fue nuestro último P-day como el distrito anterior y lo terminamos con sushi ilimitado en Koizis. El martes fueron los cambios y me despedí del Élder Dean, que ahora está en Dade City. ¡Pero me quedé sin compañeros! Estuve con el Élder Morris y el Élder Cullimore mientras los 3 esperábamos hasta el jueves, cuando llegaban a Florida nuestros nuevos misioneros en capacitación. Fue un trío increíble, muy divertido, pero también interesante porque nos quedamos en mi área y solo yo hablaba español. Tocamos muchas puertas, ¡pero después del martes & el miércoles ya teníamos lecciones programadas para el resto de la semana! El jueves por fin conocí al Élder Franson & al Élder O'Neill. 2 hijos, compañeros en el CCM, ¡soy papá de gemelos! Empezamos su primer día con un montón de lecciones y preparando a Oner para su bautismo del sábado. Ese ritmo de lecciones siguió el resto de la semana y apenas tuvimos tiempo para estudiar español/portugués. Estamos enseñando a una familia brasileña de São Paulo, así que ha sido increíble para mi portugués y para ver cómo ahora puedo convivir con más personas y bendecirlas. ¡El presidente Gardiner y su familia llegaron a Florida esta semana! Los conocimos por Zoom, pero luego ellos, él, su esposa y su hija Hannah, de 12 años, vinieron a nuestro bautismo el sábado. Esta semana quiero testificar más acerca de que Dios contesta las oraciones. Esta semana conocimos a Rigo y a su familia (& a su pato mascota, Pito) porque recibimos una referencia, pero resulta que él vio la película de la Restauración y oró para aprender más, ¡y nosotros llegamos y pudimos contestar todas sus preguntas! He estado orando por familias y por maneras de practicar más portugués, y sigo recibiendo esa ayuda. Mateo 7:7 Testifico que Dios sí escucha su súplica y quiere ayudarlos, ¡confíen en Él! Los amo, Elder Jacobs Fotos: Jesús los ama El bautismo de Oner Donas del bautismo adiós, Élder Dean ¡Misioneros en capacitación! El 1.er día ya encontró un pez camaleón Más de esta semana"}, {"id": "l61", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AGO 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 61 · Tampa", "title": "😁La panda sonrisa 🐼(la pandilla de la sonrisa)🐊", "date": "2022-08-15T12:49:00", "group": "2022-08", "html": "<div class=\"body\"><p>Sonríe porque Jesús te ama!<\/p>\n<p>Buenos días amigos, espero que la semana fue buena!<\/p>\n<p>Nuestra semana estuvo buena, ocupada, difícil a ratos, pero gratificante. Hemos estado muy ocupados enseñando a amigos, con actividades, conversos recientes, etc... de todo.<\/p>\n<p>El lunes pasado fue una manera increíble de empezar la semana. Otra lección con Rigo, esta vez sobre el plan de salvación, ¡y fijamos una fecha bautismal para el 28! También nos tomamos una foto con Pìto &amp; él.<\/p>\n<p>El martes fue el primer consejo de distrito del cambio, y 14 misioneros en 1 distrito es mucho poder. También una fiesta constante 🥳. Nos pusimos unas metas buenísimas y aprendimos juntos, que es lo que inspiró mi pensamiento de hoy. Esta semana también hicimos un intercambio con los élderes de Carrollwood. Fue divertido estar con el Élder Robinson y también una buena manera de aprender. El Élder Franson &amp; el Élder O’Neill están emocionados de hacer más; lo disfrutaron.<\/p>\n<p>Disfruté la oportunidad de ir a la capacitación especializada con el Élder Franson &amp; el Élder O'Neill. Nos divertimos mucho viendo a los otros capacitadores y a sus misioneros en capacitación, aprendiendo, sintiendo el Espíritu, y hasta haciendo contactos en la calle en el campus de USF. Esta semana también pudimos disfrutar haciendo algo de servicio: movimos tierra para un jardín y limpiamos el edificio de la iglesia. Esta semana hubo una actividad para adivinar quién era el líder de distrito, así que aquí está toda la propaganda del Élder Jacobs, jaja. Mi pensamiento/mensaje de hoy se basa en un discurso/capacitación llamado \"el 4.º misionero\". Hay una gráfica que habla del cuadrante de los Milagros. A los misioneros con mucho amor y altas expectativas les va bien, pero para traer Milagros también se necesita una gran actitud y un gran esfuerzo. Cristo fue un ejemplo perfecto de amor, expectativas, actitud y esfuerzo, y por eso se produjeron tantos Milagros, y se siguen produciendo en Su nombre.<\/p>\n<p>Os amo que tenha uma boa semana!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>foto en etch-a-sketch &amp; otros dibujos<\/li>\n<li>Rigo, Pìto y nosotros<\/li>\n<li>La panda Sonrisa<\/li>\n<li>caja de delfín<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-08-15_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-15_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-15_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-15_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-15_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-15_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-15_0_6.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_349.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "😁La panda sonrisa 🐼(la pandilla de la sonrisa)🐊 Sonríe porque Jesús te ama! Buenos días amigos, espero que la semana fue buena! Nuestra semana estuvo buena, ocupada, difícil a ratos, pero gratificante. Hemos estado muy ocupados enseñando a amigos, con actividades, conversos recientes, etc... de todo. El lunes pasado fue una manera increíble de empezar la semana. Otra lección con Rigo, esta vez sobre el plan de salvación, ¡y fijamos una fecha bautismal para el 28! También nos tomamos una foto con Pìto & él. El martes fue el primer consejo de distrito del cambio, y 14 misioneros en 1 distrito es mucho poder. También una fiesta constante 🥳. Nos pusimos unas metas buenísimas y aprendimos juntos, que es lo que inspiró mi pensamiento de hoy. Esta semana también hicimos un intercambio con los élderes de Carrollwood. Fue divertido estar con el Élder Robinson y también una buena manera de aprender. El Élder Franson & el Élder O’Neill están emocionados de hacer más; lo disfrutaron. Disfruté la oportunidad de ir a la capacitación especializada con el Élder Franson & el Élder O'Neill. Nos divertimos mucho viendo a los otros capacitadores y a sus misioneros en capacitación, aprendiendo, sintiendo el Espíritu, y hasta haciendo contactos en la calle en el campus de USF. Esta semana también pudimos disfrutar haciendo algo de servicio: movimos tierra para un jardín y limpiamos el edificio de la iglesia. Esta semana hubo una actividad para adivinar quién era el líder de distrito, así que aquí está toda la propaganda del Élder Jacobs, jaja. Mi pensamiento/mensaje de hoy se basa en un discurso/capacitación llamado \"el 4.º misionero\". Hay una gráfica que habla del cuadrante de los Milagros. A los misioneros con mucho amor y altas expectativas les va bien, pero para traer Milagros también se necesita una gran actitud y un gran esfuerzo. Cristo fue un ejemplo perfecto de amor, expectativas, actitud y esfuerzo, y por eso se produjeron tantos Milagros, y se siguen produciendo en Su nombre. Os amo que tenha uma boa semana! Elder Jacobs Fotos: foto en etch-a-sketch & otros dibujos Rigo, Pìto y nosotros La panda Sonrisa caja de delfín Más de esta semana"}, {"id": "l62", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AGO 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><\/div>", "cultures": ["VE", "HT"], "moments": [], "extra": "Venezuela Haiti", "kind": "Carta 62 · Tampa", "title": "🤯Una semana loca 🐊& muchos venezolanos 🇻🇪", "date": "2022-08-22T14:46:00", "group": "2022-08", "html": "<div class=\"body\"><p>Hola Ola Amigos!<\/p>\n<p>Esta semana fue otra increíble, pero, como dice mi título, medio diferente/loca/frustrante. Digo frustrante por la cantidad de lecciones programadas que no se dieron, o en las que no vino ningún miembro a ayudarnos a enseñar y a hermanar a nuestros amigos.<\/p>\n<p>Por favor, traten de salir y ayudar a los misioneros con sus amigos: con aventones o en las lecciones.<\/p>\n<p>El resto de la semana estuvo bien. Tristemente, el Élder Morris se enfermó bastante, así que por favor oren para que se recupere pronto. Hemos estado tratando de hacer todo lo que podemos para ayudarlo, pero por ahora parece que la recuperación va lenta. Hoy se puso mal otra vez, así que ya veremos cómo sigue.<\/p>\n<p>Tuvimos una reunión con el presidente, la Hermana Gardiner y Hannah Gardiner, su hija. Pudimos conocerlos más, sus planes y cómo va a avanzar la misión. Estoy bastante emocionado; tienen muchísimo deseo de estar aquí y trabajar. También le enseñamos a Hugo &amp; su familia el miércoles, lo cual estuvo increíble. Él vino otra vez a la iglesia, pero su familia no pudo faltar al trabajo. Trajo a un amigo, y nuestro amigo Guillermo también, así que ya empezamos nuestro pequeño Corrillo (grupo de amigos) de venezolanos.<\/p>\n<p>Hice un intercambio con los élderes de JAS, que estuvo bastante divertido, muy diferente al español, pero divertido. También pude convivir con los élderes de criollo, ya que viven juntos. ¡El Élder O’Neill y el Élder Franson dirigieron el área solos! ¡Sin ayuda mía con el español! Pero lo disfrutaron y les fue súper bien.<\/p>\n<p>Esta semana llenamos nuestro tiempo libre tocando puertas y visitando a miembros, tratando de fortalecer el barrio, conocer a los miembros y conseguir ayuda en las lecciones o Referencias. Eso nos llevó a un momento muy especial: administrar la Santa Cena a una familia con el Irmão Benicio. Fue una reunión sacramental tan sencilla y tan dulce, con testimonios; nunca olvidaré ese momento. Me gusta esta escritura y enseñanza de Cristo, que más o menos enseña esa misma idea de las experiencias espirituales sencillas a solas. Mateo 6<\/p>\n<p>6 Mas tú, cuando ores, entra en tu cámara, y cerrada tu puerta, ora a tu Padre que está en secreto; y tu Padre que ve en secreto te recompensará en público.<\/p>\n<p>7 Y al orar, no uséis vanas repeticiones, como los gentiles, que piensan que por su palabrería serán oídos.<\/p>\n<p>8 No os hagáis, pues, semejantes a ellos, porque vuestro Padre sabe de qué cosas tenéis necesidad, antes que vosotros le pidáis<\/p>\n<p class=\"sign\">Los amo hasta luego!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Pokémon de McDonald's<\/li>\n<li>Hugo &amp; su familia<\/li>\n<li>Nuevo tech deck/escritorio armado<\/li>\n<li>Soy un ángel 😇<\/li>\n<li>capacitación especializada<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-08-22_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-22_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-22_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-22_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-22_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-22_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_350.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_351.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_352.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🤯Una semana loca 🐊& muchos venezolanos 🇻🇪 Hola Ola Amigos! Esta semana fue otra increíble, pero, como dice mi título, medio diferente/loca/frustrante. Digo frustrante por la cantidad de lecciones programadas que no se dieron, o en las que no vino ningún miembro a ayudarnos a enseñar y a hermanar a nuestros amigos. Por favor, traten de salir y ayudar a los misioneros con sus amigos: con aventones o en las lecciones. El resto de la semana estuvo bien. Tristemente, el Élder Morris se enfermó bastante, así que por favor oren para que se recupere pronto. Hemos estado tratando de hacer todo lo que podemos para ayudarlo, pero por ahora parece que la recuperación va lenta. Hoy se puso mal otra vez, así que ya veremos cómo sigue. Tuvimos una reunión con el presidente, la Hermana Gardiner y Hannah Gardiner, su hija. Pudimos conocerlos más, sus planes y cómo va a avanzar la misión. Estoy bastante emocionado; tienen muchísimo deseo de estar aquí y trabajar. También le enseñamos a Hugo & su familia el miércoles, lo cual estuvo increíble. Él vino otra vez a la iglesia, pero su familia no pudo faltar al trabajo. Trajo a un amigo, y nuestro amigo Guillermo también, así que ya empezamos nuestro pequeño Corrillo (grupo de amigos) de venezolanos. Hice un intercambio con los élderes de JAS, que estuvo bastante divertido, muy diferente al español, pero divertido. También pude convivir con los élderes de criollo, ya que viven juntos. ¡El Élder O’Neill y el Élder Franson dirigieron el área solos! ¡Sin ayuda mía con el español! Pero lo disfrutaron y les fue súper bien. Esta semana llenamos nuestro tiempo libre tocando puertas y visitando a miembros, tratando de fortalecer el barrio, conocer a los miembros y conseguir ayuda en las lecciones o Referencias. Eso nos llevó a un momento muy especial: administrar la Santa Cena a una familia con el Irmão Benicio. Fue una reunión sacramental tan sencilla y tan dulce, con testimonios; nunca olvidaré ese momento. Me gusta esta escritura y enseñanza de Cristo, que más o menos enseña esa misma idea de las experiencias espirituales sencillas a solas. Mateo 6 6 Mas tú, cuando ores, entra en tu cámara, y cerrada tu puerta, ora a tu Padre que está en secreto; y tu Padre que ve en secreto te recompensará en público. 7 Y al orar, no uséis vanas repeticiones, como los gentiles, que piensan que por su palabrería serán oídos. 8 No os hagáis, pues, semejantes a ellos, porque vuestro Padre sabe de qué cosas tenéis necesidad, antes que vosotros le pidáis Los amo hasta luego! Elder Jacobs Fotos: Pokémon de McDonald's Hugo & su familia Nuevo tech deck/escritorio armado Soy un ángel 😇 capacitación especializada Más de esta semana"}, {"id": "l63", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AGO 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colombia<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["CO", "BR"], "moments": ["Baptism"], "extra": "Colombia Brazil", "kind": "Carta 63 · Tampa", "title": "🤡☠️Locura🤯🥳", "date": "2022-08-29T05:59:00", "group": "2022-08", "html": "<div class=\"body\"><p>Bom día! Como vôces vão? Como foi a semana?<\/p>\n<p>Esta semana estuvo bastante bien, bastante estresante, así que estoy agradecido por el P-day y un rato para relajarme. Teníamos bastante obra misional que hacer, pero más que eso fue tratar de asegurar la seguridad y el transporte de otros misioneros por un choque &amp; otra visita al hospital del Élder Morris; por favor sigan orando por él y su recuperación. El martes, después del consejo de distrito, tuvimos un banquete gigante de pollo frito 🍗 🐔 no hay fotos, pero eran 2 charolas grandes llenas. Luego hicimos un intercambio con South Tampa que salió bastante bien.<\/p>\n<p>Esta semana estuvo muy mojada, nos empapamos varias veces.<\/p>\n<p>El miércoles tuvimos la clase de inglés y luego una lição (lección) increíble con la familia Vieira y el Irmão (hermano) Aluxe. Son súper dulces y sinceros, y estoy emocionado de verlos de blanco algún día (todavía no hay fecha). ¡Les vamos a llevar Pokémon para darle a su hijo, João; tiene 6 años, ama Pokémon y habla muchísimo!<\/p>\n<p>El jueves y el viernes fueron días de locos por la vuelta al hospital que ya mencioné, y luego otros élderes de mi distrito tuvieron un choque feo en la autopista. Todos están bien, el carro quedó pérdida total, cuerpos adoloridos. Así que tratamos de tener nuestras lecciones, pero terminó siendo un ajetreo tremendo tratando de ayudar a todos.<\/p>\n<p>Tenemos un amigo nuevo que se llama Christian; tiene 25 años y es de Colombia. Es súper buena onda para platicar y a veces habla demasiado, pero así sabemos que le apasiona el Evangelio.<\/p>\n<p>Preparamos, tuvimos y limpiamos una boda para Alexander &amp; Luísa Garabito. Fue divertido, y al día siguiente, después de la iglesia, se bautizaron ellos y su hija Julianna.<\/p>\n<p>Esta escritura se me ha quedado toda la semana desde que la escuché el martes.<\/p>\n<p>Dios confía mucho en nosotros y quiere darnos revelación. Debemos seguir fieles y pidiéndola.<\/p>\n<p class=\"sign\">Los amo! El libro es poderosa y la iglesia asombroso!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Rio de Janeiro (Google Maps)<\/li>\n<li>El Irmão Aluxe &amp; nuestra nueva familia brasileña Vieira (a su niño le encanta Pokémon jaja)<\/li>\n<li>caja de delfín (no OtterBox jaja)<\/li>\n<li>Diogo &amp; nosotros<\/li>\n<li>travesuras<\/li>\n<li>¡La boda de los Garabito!<\/li>\n<li>Una publicación que hice sobre el folclor brasileño, ¡mándenme algunas de las historias de los personajes, por favor!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-08-29_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-29_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-08-29_0_4.jpeg\" alt=\"\"><\/figure> ", "date": "2022-09-05T14:08:00", "group": "2022-09", "html": "<div class=\"body\"><p>Como estan amigos! Siempre una Fiesta y estamos muchas payasadas acá! 🤡🥳<\/p>\n<p>Espero que hayan tenido una semana genial; la nuestra estuvo bastante bien.<\/p>\n<p>Volvimos a ponernos en contacto con nuestra amiga María. Todavía no es muy buena para contestarnos, pero tiene un deseo enorme de aprender, así que estoy emocionado de que podamos empezar a enseñarle otra vez. También empezamos a enseñar a la novia de Enrique, que pronto será su esposa. En general, muchos amigos nuevos y buenísimos esta semana. No hubo lecciones en portugués, nuestros amigos no pudieron reunirse, pero sigo practicando mucho (es difícil con recursos más limitados).<\/p>\n<p>¡Nuestra amiga Emmelina ya tiene fecha! Lleva un tiempo aprendiendo y ahora siempre está esperando nuestros mensajes. Estoy súper emocionado por ella. Por favor oren por su salud.<\/p>\n<p>Probé lasaña venezolana; la hicieron Hugo &amp; su familia. Muy buena, diferente, pero sí me gustó, y tuvimos una lección buenísima. Ya veremos cuándo podemos fijar una fecha con ellos.<\/p>\n<p>Sabe a jamón, queso, salsa roja, carne molida, pasta y, básicamente, solo un poquito diferente. En la clase de inglés hicimos un laberinto con sillas y pusimos a los alumnos a practicar dar indicaciones. Luego hice lo mismo con mis misioneros en capacitación para que practicaran escuchar (se me olvidó tomar foto).<\/p>\n<p>No hay mucho más que contar; hemos estado dándole duro tratando de limpiar nuestro libro de área y terminar otras cosas. Ojalá podamos terminar todo esto y volver a tocar puertas como en los viejos tiempos (sí lo hicimos un poco esta semana)..<\/p>\n<p>Pensamiento de la semana: Mosíah 8<\/p>\n<p>16 Y Amón dijo que un vidente es revelador y también profeta; y ningún hombre puede tener un don más grande, a menos que posea el poder de Dios, lo cual ningún hombre puede; no obstante, Dios puede conceder un gran poder a un hombre. 17 Pero un vidente puede saber de cosas que han pasado y también de cosas futuras; y por medio de ellos todas las cosas serán reveladas, o más bien, las cosas secretas serán manifestadas, y las cosas ocultas saldrán a la luz, y lo que no es sabido será dado a conocer por ellos, y también por medio de ellos se darán a conocer cosas que de otra manera no se podrían saber. 18 Así Dios ha dispuesto un medio para que el hombre, por medio de la fe, pueda efectuar grandes milagros; por tanto, llega a ser un gran beneficio para sus semejantes.<\/p>\n<p>Todos somos muy bendecidos de poder recibir revelación y, de cierta manera, llegar a ser videntes. Y a veces nuestra respuesta es no, pero no un no para siempre, sino un ahorita no. ¡Confíen en Dios!<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs 🦆<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>buzones de Florida<\/li>\n<li>hora de la Primaria jaja<\/li>\n<li>hicimos un reel en Facebook (esta vez en inglés)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-09-05_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-09-05_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_362.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_363.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "lasaña & un laberinto Como estan amigos! Siempre una Fiesta y estamos muchas payasadas acá! 🤡🥳 Espero que hayan tenido una semana genial; la nuestra estuvo bastante bien. Volvimos a ponernos en contacto con nuestra amiga María. Todavía no es muy buena para contestarnos, pero tiene un deseo enorme de aprender, así que estoy emocionado de que podamos empezar a enseñarle otra vez. También empezamos a enseñar a la novia de Enrique, que pronto será su esposa. En general, muchos amigos nuevos y buenísimos esta semana. No hubo lecciones en portugués, nuestros amigos no pudieron reunirse, pero sigo practicando mucho (es difícil con recursos más limitados). ¡Nuestra amiga Emmelina ya tiene fecha! Lleva un tiempo aprendiendo y ahora siempre está esperando nuestros mensajes. Estoy súper emocionado por ella. Por favor oren por su salud. Probé lasaña venezolana; la hicieron Hugo & su familia. Muy buena, diferente, pero sí me gustó, y tuvimos una lección buenísima. Ya veremos cuándo podemos fijar una fecha con ellos. Sabe a jamón, queso, salsa roja, carne molida, pasta y, básicamente, solo un poquito diferente. En la clase de inglés hicimos un laberinto con sillas y pusimos a los alumnos a practicar dar indicaciones. Luego hice lo mismo con mis misioneros en capacitación para que practicaran escuchar (se me olvidó tomar foto). No hay mucho más que contar; hemos estado dándole duro tratando de limpiar nuestro libro de área y terminar otras cosas. Ojalá podamos terminar todo esto y volver a tocar puertas como en los viejos tiempos (sí lo hicimos un poco esta semana).. Pensamiento de la semana: Mosíah 8 16 Y Amón dijo que un vidente es revelador y también profeta; y ningún hombre puede tener un don más grande, a menos que posea el poder de Dios, lo cual ningún hombre puede; no obstante, Dios puede conceder un gran poder a un hombre. 17 Pero un vidente puede saber de cosas que han pasado y también de cosas futuras; y por medio de ellos todas las cosas serán reveladas, o más bien, las cosas secretas serán manifestadas, y las cosas ocultas saldrán a la luz, y lo que no es sabido será dado a conocer por ellos, y también por medio de ellos se darán a conocer cosas que de otra manera no se podrían saber. 18 Así Dios ha dispuesto un medio para que el hombre, por medio de la fe, pueda efectuar grandes milagros; por tanto, llega a ser un gran beneficio para sus semejantes. Todos somos muy bendecidos de poder recibir revelación y, de cierta manera, llegar a ser videntes. Y a veces nuestra respuesta es no, pero no un no para siempre, sino un ahorita no. ¡Confíen en Dios! Los amo! Elder Jacobs 🦆 Fotos: buzones de Florida hora de la Primaria jaja hicimos un reel en Facebook (esta vez en inglés) Más de esta semana"}, {"id": "l65", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SEP 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["BR", "HT"], "moments": ["Baptism"], "extra": "Brazil Haiti", "kind": "Carta 65 · Tampa", "title": "💪El escuadrón cuádruple🤡🤡🤡🤡", "date": "2022-09-12T12:43:00", "group": "2022-09", "html": "<div class=\"body\"><p>Otra semana terminada y otro traslado! Y fue buenisimo!<\/p>\n<p>Para explicar el título del correo: el lunes en la noche nos enteramos de que íbamos a recibir al Élder Gundersen. ¡Y nos convertimos en cuarteto el jueves, porque su compañero anterior y otros misioneros de criollo haitiano iban a recibir misioneros en capacitación/compañeros nuevos!<\/p>\n<p>Esta semana hicimos 2 intercambios, uno con Carrollwood (Élder Griffin) y el otro con South Tampa (Élder Day). Súper divertidos, y de verdad pude ver cuánto han crecido estos élderes en este cambio.<\/p>\n<p>A nuestros amigos les va súper bien. ¡Samuel tiene fecha bautismal para el 25! ¡La familia de Diogo llega el sábado! Y encontramos un montón más de gente nueva.<\/p>\n<p>En parte por ser cuarteto. Mientras 2 de nosotros enseñábamos las lecciones programadas, los otros 2 tenían los teléfonos y estaban programando más citas o tocando puertas cerca. ¡Absolutamente GOAT! 🐐<\/p>\n<p>Tuvimos entrevistas con el presidente, lo cual estuvo increíble: conocerlo más, el plan para el futuro de la misión y también ver al Espíritu obrar por medio de él. También tenemos noticias de cambios:<\/p>\n<p>Élder O'Neill a Rio Vista A<\/p>\n<p>Élder Franson a Dade City Esp. (¡con el Élder Dean!)<\/p>\n<p>Élder Gundersen a Rio Vista B<\/p>\n<p>¡Y yo me quedo y recibo al Élder Rogers (que acaba de terminar su capacitación) y a un misionero nuevo! (¡Él va a ir a Brasil, así que puedo ayudarle a enseñar y practicar portugués!)<\/p>\n<p>Este fin de semana fue la conferencia de estaca, lo que se tradujo en mucho poder espiritual y comida extra para nosotros jaja. El Élder Ojediran habló mucho sobre el Espíritu y la Santa Cena, y de cómo tomamos la Santa Cena, recibimos el Espíritu más plenamente y luego eso nos impulsa a mantenernos limpios/arrepentirnos, y continuamos el ciclo con la Santa Cena. Así que este próximo domingo piensen más en Cristo y en el Espíritu mientras toman la Santa Cena<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>meme del cuarteto<\/li>\n<li>conferencia de estaca con TODOS los misioneros<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-09-12_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-12_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-12_1_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-09-12_1_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "💪El escuadrón cuádruple🤡🤡🤡🤡 Otra semana terminada y otro traslado! Y fue buenisimo! Para explicar el título del correo: el lunes en la noche nos enteramos de que íbamos a recibir al Élder Gundersen. ¡Y nos convertimos en cuarteto el jueves, porque su compañero anterior y otros misioneros de criollo haitiano iban a recibir misioneros en capacitación/compañeros nuevos! Esta semana hicimos 2 intercambios, uno con Carrollwood (Élder Griffin) y el otro con South Tampa (Élder Day). Súper divertidos, y de verdad pude ver cuánto han crecido estos élderes en este cambio. A nuestros amigos les va súper bien. ¡Samuel tiene fecha bautismal para el 25! ¡La familia de Diogo llega el sábado! Y encontramos un montón más de gente nueva. En parte por ser cuarteto. Mientras 2 de nosotros enseñábamos las lecciones programadas, los otros 2 tenían los teléfonos y estaban programando más citas o tocando puertas cerca. ¡Absolutamente GOAT! 🐐 Tuvimos entrevistas con el presidente, lo cual estuvo increíble: conocerlo más, el plan para el futuro de la misión y también ver al Espíritu obrar por medio de él. También tenemos noticias de cambios: Élder O'Neill a Rio Vista A Élder Franson a Dade City Esp. (¡con el Élder Dean!) Élder Gundersen a Rio Vista B ¡Y yo me quedo y recibo al Élder Rogers (que acaba de terminar su capacitación) y a un misionero nuevo! (¡Él va a ir a Brasil, así que puedo ayudarle a enseñar y practicar portugués!) Este fin de semana fue la conferencia de estaca, lo que se tradujo en mucho poder espiritual y comida extra para nosotros jaja. El Élder Ojediran habló mucho sobre el Espíritu y la Santa Cena, y de cómo tomamos la Santa Cena, recibimos el Espíritu más plenamente y luego eso nos impulsa a mantenernos limpios/arrepentirnos, y continuamos el ciclo con la Santa Cena. Así que este próximo domingo piensen más en Cristo y en el Espíritu mientras toman la Santa Cena Los amo! Elder Jacobs Fotos: meme del cuarteto conferencia de estaca con TODOS los misioneros"}, {"id": "l66", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SEP 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 66 · Tampa", "title": "👨‍👦Meu novo filho!🤡", "date": "2022-09-19T08:01:00", "group": "2022-09", "html": "<div class=\"body\"><p>Bom día meus queridos amigos!<\/p>\n<p>Tive uma semana muitíssima boa e legal na missão!<\/p>\n<p>Como en el último correo, los cambios fueron el martes y perdí a mis compañeros, pero todo bien, tengo unos igual de increíbles. El Élder Rogers es súper chistoso y es de Round Valley, AZ, ¡y el Élder Towne (nuestro nuevecito misionero en capacitación) es de Gilbert! ¡Qué suerte, triple AZ!<\/p>\n<p>El Élder Towne a la larga se va a ir, no sé cuándo, depende de la visa, ¡a Campinas, Brasil! Ha sido un sueño hablar portugués con él y con los amigos, junto con el chorro interminable de chistes en nuestro compañerismo en general. Mientras esperábamos recogerlo el jueves, estuvimos con el Élder Argyle. Él y yo fuimos compañeros hace unos meses, pero solo 6 días, ¡y por fin llegamos a poco más de una semana jaja!<\/p>\n<p>El principio de la semana, antes de recibir al Élder Towne, fueron un montón de lecciones y tratar de encontrar gente sin mucho éxito, pero ni modo. Nuestra clase de inglés ha estado creciendo y tiene muy buena vibra, así que estoy emocionado por su futuro. Samuel se va a bautizar la próxima semana, no se lo pierdan 😉<\/p>\n<p>Yolennis, la novia de Enrique, también se va a bautizar en unas semanas.<\/p>\n<p>A nuestros otros amigos les va súper bien. ¡Nicolás quiere bautizarse, vino a la iglesia ayer y le encantó! Emmelina todavía quiere, pero su salud no está muy bien. A Guillermo y Génesis y sus hijos (Jorge, Ester y Guillermo Jr.) les va bien; también vinieron a la iglesia, pero todavía están buscando un nuevo departamento/casa. Así que oren por estos amigos.<\/p>\n<p>Algo que dijo el presidente y que me encantó es: \"Estamos aquí para inspirar\", porque en lugar de dejar caer el martillo, Cristo siempre se mantuvo firme en Sus creencias, pero animó e inspiró a otros a cambiar y mejorar. Somos Sus discípulos y, como tales, debemos tratar de emularlo y ser ejemplo de los creyentes.<\/p>\n<p>1 Timoteo 4:12<\/p>\n<p>Ninguno tenga en poco tu juventud; sino sé ejemplo de los creyentes en palabra, en conducta, en amor, en espíritu, en fe y en pureza<\/p>\n<p>Bueno, estoy emocionado por este cambio y por el futuro. Cuéntenme lo que esté pasando en sus vidas. El viernes tenemos la capacitación especializada y podré ver a más amigos misioneros &amp; volvernos locos buscando en el campus de USF, jaja.<\/p>\n<p class=\"sign\">Los Amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Élder Rogers &amp; Élder Argyle<\/li>\n<li>¡Élder Towne!<\/li>\n<li>Hora de Pokémon<\/li>\n<li>Cuarteto<\/li>\n<li>¡Bye bye, mijos!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-09-19_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_364.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_365.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_366.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_367.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_368.jpg\" alt=\"\"><\/
