kind": "Carta 11 · Dade City", "title": "🐊🌭 ¡Gatordog! 🤤", "date": "2021-08-30T06:21:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola Amigos!<\/p>\n<p>Esta semana estuvo un poco más lenta por el aumento de casos de covid. Más de nuestros amigos lo tienen, así que no pudimos platicar en persona. Ojalá esta próxima semana podamos hacer algunas videollamadas. Por favor oren por ellos, porque se están poniendo muy enfermos: Isabel y Jaime y sus familias.<\/p>\n<p>Esta semana fui a otro intercambio a Wesley Chapel, pero esta vez con el Élder Kimball, nuestro líder de distrito. Estuvo muy divertido. Pude andar en bici otra vez. ¡Esa sola tarde recorrimos 16 millas! Al final tenía las piernas bastante cansadas, pero nos apuramos a llegar a casa porque parecía que iba a llover. Entramos, guardamos las bicis y empezó a caer un aguacero; ¡qué suerte! Luego, al día siguiente, caminé 5 millas buscando gente.<\/p>\n<p>Esta semana comimos cosas raras. Me comí un gatordog y unas cyclone tators. Bastante buenos. Las tators eran solo papitas Lays torcidas y refritas, y el gator-dog era solo un hot dog grande con carne de más calidad (yo pedí uno normal con todo para vivir la experiencia). También probé más tacos de otra troca de tacos. Definitivamente no tan buenos como los de la troquita morada a la que siempre vamos, pero pude probar los de buche (aguaditos nomás, no tan buenos como el al pastor). Y los Thorton nos dieron más comida. No tan rara, pero fue otra comida como de 5 tiempos, porque ella se asegura de que quedemos llenísimos. Prácticamente necesitamos silla de ruedas después de comer, pero está tan rico jaja.<\/p>\n<p>¡Esta semana tuvimos entrevistas y salieron muy bien! Quiero mucho al presidente y a la hermana Hollingsworth. Son increíbles. Eso sí, nos enteramos de que por el covid está prohibido tocar puertas de cualquier forma y tenemos que usar cubrebocas para hacer contactos en la calle. Esto es muy difícil para nuestra pequeña área latina, sobre todo porque a ellos no les importa mucho, pero para cuidar la imagen de la Iglesia y hacer lo correcto para no propagar el covid tenemos que cambiar. Ojalá la clase de inglés que vamos a empezar nos ayude a encontrar gente sin nuestras otras formas de siempre.<\/p>\n<p>¡Lo último importante de esta semana fue el bautismo de Domingo! Al final sí se mudó a Tampa el miércoles, pero el Presidente dijo que, como era domingo, podíamos ir a hacerlo, pero en Tampa. Yo lo sumergí y al parecer estaba emocionado, porque dije amén y él nomás se fue para atrás. Estaba listo jaja. Luego el Élder Nelson lo confirmó y el resto del servicio estuvo genial.<\/p>\n<p>Esta semana sí nos dieron noticias de los cambios. El Élder Nelson se va a Ocala a terminar de capacitar al Élder Esplin (el otro élder de español que llegó conmigo), porque su entrenador se va a casa. Yo me quedo, a cargo del área, y recibo al Élder Ricks. El Élder Nelson me ha contado algunas cosas que ha oído y suena increíble, pero me da tristeza perder al Élder Nelson. (No es el Élder Ricks con el que vivimos, sino otro. Esto va a estar confuso.) Los élderes de inglés también se van con los cambios. El Élder Ricks se queda y va a capacitar, pero el Élder Ballif va a abrir Sarasota desde cero y también va a capacitar. A todos les va a ir increíble, pero da un poco de tristeza que se vayan.<\/p>\n<p>Nos Vemos pronto mis amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P. D. Un chavo gay le estuvo coqueteando al Élder Nelson las 2 horas completas de la iglesia. Fue súper raro e incómodo con todo lo que decía y cómo lo tocaba, porque se sentó justo a nuestro lado. Pero le dimos un Libro de Mormón y nuestro número como siempre. Ya veremos si pasa algo más jaja.<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>en bici con el Élder Kimball<\/li>\n<li>último consejo de distrito + líderes de zona (sin el Élder Peters, porque lo cambiaron de emergencia, pero tenemos al Élder Mehr)<\/li>\n<li>gator dog<\/li>\n<li>tacos<\/li>\n<li>nuevo élder 🐕 jaja<\/li>\n<li>Skippy, nuestra amiga lagartija (muerta)<\/li>\n<li>¡El bautismo de Domingo!<\/li>\n<li>el cerdo más gordo del mundo (se llama Princess)<\/li>\n<li>típica entrada de casa rara de Dade City, Florida<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-08-30_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-08-30_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-08-30_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-30_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_8.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_045.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_046.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_047.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_048.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_049.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_050.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐊🌭 ¡Gatordog! 🤤 Hola Amigos! Esta semana estuvo un poco más lenta por el aumento de casos de covid. Más de nuestros amigos lo tienen, así que no pudimos platicar en persona. Ojalá esta próxima semana podamos hacer algunas videollamadas. Por favor oren por ellos, porque se están poniendo muy enfermos: Isabel y Jaime y sus familias. Esta semana fui a otro intercambio a Wesley Chapel, pero esta vez con el Élder Kimball, nuestro líder de distrito. Estuvo muy divertido. Pude andar en bici otra vez. ¡Esa sola tarde recorrimos 16 millas! Al final tenía las piernas bastante cansadas, pero nos apuramos a llegar a casa porque parecía que iba a llover. Entramos, guardamos las bicis y empezó a caer un aguacero; ¡qué suerte! Luego, al día siguiente, caminé 5 millas buscando gente. Esta semana comimos cosas raras. Me comí un gatordog y unas cyclone tators. Bastante buenos. Las tators eran solo papitas Lays torcidas y refritas, y el gator-dog era solo un hot dog grande con carne de más calidad (yo pedí uno normal con todo para vivir la experiencia). También probé más tacos de otra troca de tacos. Definitivamente no tan buenos como los de la troquita morada a la que siempre vamos, pero pude probar los de buche (aguaditos nomás, no tan buenos como el al pastor). Y los Thorton nos dieron más comida. No tan rara, pero fue otra comida como de 5 tiempos, porque ella se asegura de que quedemos llenísimos. Prácticamente necesitamos silla de ruedas después de comer, pero está tan rico jaja. ¡Esta semana tuvimos entrevistas y salieron muy bien! Quiero mucho al presidente y a la hermana Hollingsworth. Son increíbles. Eso sí, nos enteramos de que por el covid está prohibido tocar puertas de cualquier forma y tenemos que usar cubrebocas para hacer contactos en la calle. Esto es muy difícil para nuestra pequeña área latina, sobre todo porque a ellos no les importa mucho, pero para cuidar la imagen de la Iglesia y hacer lo correcto para no propagar el covid tenemos que cambiar. Ojalá la clase de inglés que vamos a empezar nos ayude a encontrar gente sin nuestras otras formas de siempre. ¡Lo último importante de esta semana fue el bautismo de Domingo! Al final sí se mudó a Tampa el miércoles, pero el Presidente dijo que, como era domingo, podíamos ir a hacerlo, pero en Tampa. Yo lo sumergí y al parecer estaba emocionado, porque dije amén y él nomás se fue para atrás. Estaba listo jaja. Luego el Élder Nelson lo confirmó y el resto del servicio estuvo genial. Esta semana sí nos dieron noticias de los cambios. El Élder Nelson se va a Ocala a terminar de capacitar al Élder Esplin (el otro élder de español que llegó conmigo), porque su entrenador se va a casa. Yo me quedo, a cargo del área, y recibo al Élder Ricks. El Élder Nelson me ha contado algunas cosas que ha oído y suena increíble, pero me da tristeza perder al Élder Nelson. (No es el Élder Ricks con el que vivimos, sino otro. Esto va a estar confuso.) Los élderes de inglés también se van con los cambios. El Élder Ricks se queda y va a capacitar, pero el Élder Ballif va a abrir Sarasota desde cero y también va a capacitar. A todos les va a ir increíble, pero da un poco de tristeza que se vayan. Nos Vemos pronto mis amigos, Elder Jacobs P. D. Un chavo gay le estuvo coqueteando al Élder Nelson las 2 horas completas de la iglesia. Fue súper raro e incómodo con todo lo que decía y cómo lo tocaba, porque se sentó justo a nuestro lado. Pero le dimos un Libro de Mormón y nuestro número como siempre. Ya veremos si pasa algo más jaja. Fotos: en bici con el Élder Kimball último consejo de distrito + líderes de zona (sin el Élder Peters, porque lo cambiaron de emergencia, pero tenemos al Élder Mehr) gator dog tacos nuevo élder 🐕 jaja Skippy, nuestra amiga lagartija (muerta) ¡El bautismo de Domingo! el cerdo más gordo del mundo (se llama Princess) típica entrada de casa rara de Dade City, Florida Más de esta semana"}, {"id": "l12", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SEP 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 12 · Dade City", "title": "🚙 Nuevos compañeros 🎉", "date": "2021-09-06T12:37:00", "group": "2021-09", "html": "<div class=\"body\"><p>Hola mis amigos!<\/p>\n<p>Les seré honesto: después de enterarme de que el Élder Nelson se iba, no estaba tan feliz ni emocionado por esta semana, pero el Élder Ricks, mi entrenador que habla español, no el otro con el que vivimos (sí, es confuso y todavía no sabemos bien cómo distinguirlos), también es bastante buena onda. Es de Mesa, Arizona, y es muy trabajador, igual que yo y que el Élder Nelson. Aunque definitivamente al principio fue un ajuste, estoy seguro de que vamos a seguir trabajando duro y llevándonos bien. Esta semana hemos estado haciendo un montón de contactos en la calle, porque es una de las pocas formas de trabajar bien nuestra área. Es bastante divertido y difícil, pero ya me está saliendo bastante bien sacarle plática a cualquiera. El don de lenguas y el llamamiento de misionero definitivamente también ayudan. De verdad me he dado cuenta de lo bueno que es mi español, porque ahora somos compañeros mucho más parejos, a diferencia de antes, cuando yo era tan nuevo y el Élder Nelson llevaba tanto tiempo en el área. Pero al mismo tiempo el Élder Ricks me ha estado ayudando a ver algunas formas de mejorar. Como pequeños errores de gramática o acordarme de conjugar los verbos cuando tal y tal. A veces puede parecer molesto, pero a estas alturas estoy mejorando muchísimo. ¡El otro Élder Ricks también recibió a su misionero en capacitación esta semana! Se llama Élder Leonard. Es de la zona de St. George, Utah, y es bastante buena onda. Lo aventaron directo al fuego por unos amigos transgénero que el Élder Ricks y el Élder Ballif hicieron antes de que él llegara.<\/p>\n<p>Esta semana también hemos hecho más contacto con miembros y lecciones con miembros. Nos dimos cuenta de que, aunque ya llevo 7 semanas en esta área, no conocía muy bien a los miembros, así que hemos estado esforzándonos por conocerlos compartiendo mensajes y comiendo comida buenísima. 🤤<\/p>\n<ul class=\"bul\">\n<li>cambiamos una llanta esta semana (fue todo un aprendizaje y estuvo difícil porque el carro de la señora era súper viejo y ella se rio de nosotros casi todo el tiempo)<\/li>\n<li>tuvimos nuestra primera clase de inglés (llegaron 2 personas, pero mañana deberían llegar más)<\/li>\n<li>fuimos a Chick-fil-A (¿qué es lo que siempre piden ahí? El mío es el sándwich de pollo picante dx)<\/li>\n<li>llamada de Zoom con toda la misión (caótica y divertida)<\/li>\n<li>alguien nos pagó las bebidas en el Circle K 😎<\/li>\n<li>un señor loco con un acordeón dejó que el Élder Ricks lo intentara (súper chistoso y raro)<\/li>\n<li>vimos un búho de cerca mientras caminábamos<\/li>\n<\/ul>\n<p>Cuidanse mis amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Nosotros después de cambiar la llanta<\/li>\n<li>El Élder Ricks intentando tocar el acordeón<\/li>\n<li>Búho 🦉<\/li>\n<li>el Hermano Miño y yo en la actividad de la rama<\/li>\n<\/ul>\n<p>⚠️ aviso ⚠️<\/p>\n<p>Esta semana hay algo de sangre, pero es tan padre y tan raro que no podía no compartirlo.<\/p>\n<ul class=\"bul\">\n<li>cigarra muerta<\/li>\n<li>armadillo muerto (con sangre)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2021-09-06_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-09-06_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-06_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-06_0_4.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-09-06_0_5.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_051.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_052.jpg\" alt=\"\"><\/figure><figure pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SEP 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 13 · Dade City", "title": "¡Semana de servicio!", "date": "2021-09-13T10:56:00", "group": "2021-09", "html": "<div class=\"body\"><p>Buenos Días todos!<\/p>\n<p>¡Esta semana ha estado increíble! Un montón de historias y milagros, claro. Definitivamente he aprendido que cuando confiamos en el Señor y hacemos nuestro mejor esfuerzo, vemos milagros. Esta semana hemos estado a todo lo que da buscando gente. Nuestra clase de inglés ha funcionado más o menos para encontrar gente, pero la mayor parte de nuestra suerte está en caminar por las calles. Ni yo ni el Élder Ricks habíamos sido nunca tan extrovertidos o amigables, pero hacemos nuestro mejor esfuerzo y funciona. Solo tratamos de ser amigos de todos, lo cual también nos ha llevado a dar servicio improvisado y a platicar de la Iglesia. Probablemente es mi parte favorita del día, además de enseñar lecciones a nuestros amigos. De hecho, encontramos a nuestro amigo Alex nomás caminando por Dade City. Es súper amable y le gusta aprender sobre religión porque siente que se le abre la mente. En nuestra primera lección con él esta semana le enseñamos la Restauración y a la vez le respondimos sus preguntas sobre todo lo demás. Estuvo súper increíble, sobre todo porque yo no sabía que sabía todas las respuestas a sus preguntas, pero gracias a algo de mi estudio random y a tratar de ayudarlo, pude hacerlo. Además, el Élder Ricks no se sentía muy bien ese día porque le pusieron la 2.ª dosis de la vacuna del covid.<\/p>\n<ul class=\"bul\">\n<li>Al Élder Ricks le pusieron la 2.ª dosis y se durmió durante el estudio de idioma, la comida y la cena (hasta roncó jaja)<\/li>\n<li>dimos servicio a alguien que no es miembro (sacamos postes viejos de una cerca para que pudieran poner una nueva)<\/li>\n<li>cambiamos otra llanta (a una señora se le ponchó y nos paramos a ayudar. Bueno, \"nosotros\" quiere decir el Élder C. Ricks, el otro)⚙<\/li>\n<li>pasamos con nuestros amigos Elida y Horacio para compartir un mensaje, pero terminamos ayudándolos a armar su nuevo comedor⚒<\/li>\n<\/ul>\n<p>¡pudimos dar servicio 3 veces en una semana!<\/p>\n<ul class=\"bul\">\n<li>por fin conocí al Hermano Araya (¡es masón! Tiene mucha historia padre y cosas de espadas) ⚔<\/li>\n<li>intentamos usar las redes sociales, pero ningún latino de nuestra área las usa, así que quedamos como 🤡<\/li>\n<li>¡tacos gratis otra vez! Esta señora nos quiere mucho a los 'Muchachos' jajaja🌮🌯<\/li>\n<li>tuvimos una conferencia de estaca increíble con el Élder M. Holland<\/li>\n<li>tuvimos el Cara a cara con el Élder Bednar<\/li>\n<\/ul>\n<p>Cuidanse amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>dibujamos un unicornio con nuestros plumones nuevos<\/li>\n<li>alguien nos regaló una bolsa de camarones.. 🍤<\/li>\n<li>atrapando ranas 🐸<\/li>\n<li>El Élder Ricks cortándose el pelo en el porche de este señor<\/li>\n<li>tacos gratis<\/li>\n<li>mi colección de notitas adhesivas hasta ahora. ¿Cuáles son algunas de sus frases favoritas que debería agregar?<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-09-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-09-13_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-13_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-13_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-13_0_5.jpg\" alt=\"\"><\/figure><\/div>", "text": "¡Semana de servicio! Buenos Días todos! ¡Esta semana ha estado increíble! Un montón de historias y milagros, claro. Definitivamente he aprendido que cuando confiamos en el Señor y hacemos nuestro mejor esfuerzo, vemos milagros. Esta semana hemos estado a todo lo que da buscando gente. Nuestra clase de inglés ha funcionado más o menos para encontrar gente, pero la mayor parte de nuestra suerte está en caminar por las calles. Ni yo ni el Élder Ricks habíamos sido nunca tan extrovertidos o amigables, pero hacemos nuestro mejor esfuerzo y funciona. Solo tratamos de ser amigos de todos, lo cual también nos ha llevado a dar servicio improvisado y a platicar de la Iglesia. Probablemente es mi parte favorita del día, además de enseñar lecciones a nuestros amigos. De hecho, encontramos a nuestro amigo Alex nomás caminando por Dade City. Es súper amable y le gusta aprender sobre religión porque siente que se le abre la mente. En nuestra primera lección con él esta semana le enseñamos la Restauración y a la vez le respondimos sus preguntas sobre todo lo demás. Estuvo súper increíble, sobre todo porque yo no sabía que sabía todas las respuestas a sus preguntas, pero gracias a algo de mi estudio random y a tratar de ayudarlo, pude hacerlo. Además, el Élder Ricks no se sentía muy bien ese día porque le pusieron la 2.ª dosis de la vacuna del covid. Al Élder Ricks le pusieron la 2.ª dosis y se durmió durante el estudio de idioma, la comida y la cena (hasta roncó jaja) dimos servicio a alguien que no es miembro (sacamos postes viejos de una cerca para que pudieran poner una nueva) cambiamos otra llanta (a una señora se le ponchó y nos paramos a ayudar. Bueno, \"nosotros\" quiere decir el Élder C. Ricks, el otro)⚙ pasamos con nuestros amigos Elida y Horacio para compartir un mensaje, pero terminamos ayudándolos a armar su nuevo comedor⚒ ¡pudimos dar servicio 3 veces en una semana! por fin conocí al Hermano Araya (¡es masón! Tiene mucha historia padre y cosas de espadas) ⚔ intentamos usar las redes sociales, pero ningún latino de nuestra área las usa, así que quedamos como 🤡 ¡tacos gratis otra vez! Esta señora nos quiere mucho a los 'Muchachos' jajaja🌮🌯 tuvimos una conferencia de estaca increíble con el Élder M. Holland tuvimos el Cara a cara con el Élder Bednar Cuidanse amigos, Elder Jacobs Fotos: dibujamos un unicornio con nuestros plumones nuevos alguien nos regaló una bolsa de camarones.. 🍤 atrapando ranas 🐸 El Élder Ricks cortándose el pelo en el porche de este señor tacos gratis mi colección de notitas adhesivas hasta ahora. ¿Cuáles son algunas de sus frases favoritas que debería agregar?"}, {"id": "l14", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SEP 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 14 · Dade City", "title": "¡¡Liderando el área!! 😳🤯", "date": "2021-09-20T10:54:00", "group": "2021-09", "html": "<div class=\"body\"><p>Hola amigos mios!<\/p>\n<p>Como fue su semana? ¿Cómo les fue esta semana?<\/p>\n<p>Aquí en el Dirty Dade nos ha estado lloviendo como nunca jaja. Siempre decimos que necesitamos lavar el carro, pero luego llueve y queda bien otra vez. Y después nos metemos por el camino de tierra que lleva a la casa jaja.<\/p>\n<p>El lunes pasado tuvimos una actividad de distrito jugando spike ball y tirando un balón de fútbol americano. Pero alguien, o sea yo, lo dejó atorado en medio de la palmera... Luego el Élder Kimball tiró nuestro otro balón para sacarlo y también se quedó atorado... Esta semana nos despedimos del Élder Kimball porque ya puede irse a su asignación original en Brasil. Lo bueno es que lo voy a ver después de la misión en BYU. Como él se fue, el Élder Ricks, mi compañero, ahora es el nuevo líder de distrito. Y por eso yo dirigí el área esta semana.<\/p>\n<p>Los líderes de distrito hacen intercambios con los misioneros de su distrito; y como yo soy el asistente no oficial del líder de distrito, a mí también me toca. Yo me quedé en Dade City mientras el Élder Ricks se fue a Tampa con los líderes de zona, y a mí me tocó el Élder Petersen de Tampa español. Nuestro día pintaba bastante bien hasta que llegamos a Dade City y se nos cancelaron todas las lecciones, así que tuve que inventar algo sobre la marcha.<\/p>\n<p>¡Al final logré contactar a la familia de Jaime y tuvimos una lección increíble y los invitamos a empezar a pensar en el bautismo!<\/p>\n<p>El resto de la semana estuvo bastante increíble. Hemos estado haciendo un montón de contactos en la calle y esta semana intentamos ir directo al grano. Decíamos hola y preguntábamos cómo estaban, pero después directo a decir lo que hacemos y si les gustaría escuchar un mensaje. Así podíamos hablar con más gente y no perder tiempo conociendo a personas solo para descubrir, tristemente, que no quieren hablar con nosotros sobre nuestro verdadero propósito. Gracias a eso encontramos 6 amigos nuevos el sábado. Eso es todo por esta semana, pero esta semana también pinta bastante bien. Hoy es el cumple del Élder Ricks y el jueves es la conferencia de zona y también mi cumple.<\/p>\n<p>Cuidense por allí,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>consejo de distrito y despedida del Élder Kimball<\/li>\n<li>una chistosa<\/li>\n<li>troca enooorme<\/li>\n<li>Cena con un miembro (comimos bien)<\/li>\n<li>Almuerzo de cumple en Chick-fil-A hoy<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_065.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_066.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_067.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_068.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_069.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_070.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_071.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_072.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "¡¡Liderando el área!! 😳🤯 Hola amigos mios! Como fue su semana? ¿Cómo les fue esta semana? Aquí en el Dirty Dade nos ha estado lloviendo como nunca jaja. Siempre decimos que necesitamos lavar el carro, pero luego llueve y queda bien otra vez. Y después nos metemos por el camino de tierra que lleva a la casa jaja. El lunes pasado tuvimos una actividad de distrito jugando spike ball y tirando un balón de fútbol americano. Pero alguien, o sea yo, lo dejó atorado en medio de la palmera... Luego el Élder Kimball tiró nuestro otro balón para sacarlo y también se quedó atorado... Esta semana nos despedimos del Élder Kimball porque ya puede irse a su asignación original en Brasil. Lo bueno es que lo voy a ver después de la misión en BYU. Como él se fue, el Élder Ricks, mi compañero, ahora es el nuevo líder de distrito. Y por eso yo dirigí el área esta semana. Los líderes de distrito hacen intercambios con los misioneros de su distrito; y como yo soy el asistente no oficial del líder de distrito, a mí también me toca. Yo me quedé en Dade City mientras el Élder Ricks se fue a Tampa con los líderes de zona, y a mí me tocó el Élder Petersen de Tampa español. Nuestro día pintaba bastante bien hasta que llegamos a Dade City y se nos cancelaron todas las lecciones, así que tuve que inventar algo sobre la marcha. ¡Al final logré contactar a la familia de Jaime y tuvimos una lección increíble y los invitamos a empezar a pensar en el bautismo! El resto de la semana estuvo bastante increíble. Hemos estado haciendo un montón de contactos en la calle y esta semana intentamos ir directo al grano. Decíamos hola y preguntábamos cómo estaban, pero después directo a decir lo que hacemos y si les gustaría escuchar un mensaje. Así podíamos hablar con más gente y no perder tiempo conociendo a personas solo para descubrir, tristemente, que no quieren hablar con nosotros sobre nuestro verdadero propósito. Gracias a eso encontramos 6 amigos nuevos el sábado. Eso es todo por esta semana, pero esta semana también pinta bastante bien. Hoy es el cumple del Élder Ricks y el jueves es la conferencia de zona y también mi cumple. Cuidense por allí, Elder Jacobs Fotos: consejo de distrito y despedida del Élder Kimball una chistosa troca enooorme Cena con un miembro (comimos bien) Almuerzo de cumple en Chick-fil-A hoy Más de esta semana"}, {"id": "l15", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SEP 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 15 · Dade City", "title": "Hice una publicación en redes sociales 😬... ¡Y funcionó!🤯🥵🥳", "date": "2021-09-27T13:53:00", "group": "2021-09", "html": "<div class=\"body\"><p>Hola mis amigos!<\/p>\n<p>Otra semana se pasó volando y me encanta la vida de misionero. También gracias a todos los que responden mis correos, me mandan cartas y me felicitaron por mi cumpleaños esta semana. Aunque solo puedo responder por correo o por carta, de verdad lo aprecio todo y lo veo todo.<\/p>\n<p>¡Esta semana fue pura chamba! Llovió dos veces en la semana, lo que hizo que las lecciones y buscar gente fueran bastante difíciles, pero también vimos algunos milagros.<\/p>\n<p>Esta semana también tuvimos conferencia de zona. Me gustó muchísimo y en mi opinión fue todavía más divertida porque también era mi cumpleaños. Así que sentí que estaba aprendiendo y a la vez de fiesta con mi familia de la misión. Parte de la conferencia de zona fue un montón de capacitaciones sobre redes sociales. Me sentí tan mal durante una parte de la capacitación porque hablamos de lo bueno, lo mejor y lo excelente. Tenemos muchas herramientas para enseñar y buscar, pero hay distintos niveles de cómo usarlas mejor, sin mencionar asegurarnos de usarlas para cumplir nuestro propósito misional de invitar a TODOS a venir a Cristo. En ese momento me di cuenta de lo mucho que no habíamos estado usando algunas herramientas como las redes sociales. ¡Pero entonces una de mis publicaciones sobre oraciones y mensajes de esperanza gratis empezó a explotar! De repente me llegaban montones de notificaciones de likes, comentarios y mensajes directos. ¡Tuve que silenciar el teléfono! Aunque no todo era amable ni con buenas intenciones, sí vimos buenos resultados y ¡agendamos una lección! El otro milagro de esta semana probablemente fue cuando estuve de intercambio con el Élder Leonard en Dade City inglés. Los élderes de inglés, sobre todo el Élder Ballif cuando todavía estaba aquí, han estado enseñando a una familia increíble en la que solo algunos son miembros. Ya los había mencionado antes porque una vez fuimos a cenar con ellos en Shabbat. Pero a quien han estado enseñando desde hace un tiempo es a su hija Eliana. Ya le han enseñado prácticamente todo para el bautismo, pero tiene algunas inquietudes. ¡Pero cuando fuimos el sábado en la mañana por 🍙donas🍩 y una lección, pudimos ponerle fecha! ¡Fue súper especial y los dos pensamos al instante en el mismo día!<\/p>\n<p>Algo que aprendí esta semana es sobre la planificación. Planificar ayuda mucho, sobre todo cuando cada hueco está lleno para usar bien el tiempo, pero no deberíamos planificar solo para llenar huecos. Los mejores resultados llegan cuando planificamos pensando en nuestros amigos. El viernes teníamos un hueco bastante grande, pero nos acordamos de que algunos de nuestros amigos estaban pasando por cosas difíciles. Decidimos hornear galletas y luego llevárselas. Nos dijeron que les cambió completamente el ánimo y les ayudó a ver que estamos ahí para enseñarles, pero también, y lo más importante, para ser sus amigos.<\/p>\n<p>Bueno, eso es todo de mi parte esta semana. Sigo intentando encontrar más maneras de buscar gente en redes sociales, sobre todo personas que hablan español, así que mándenme ideas o historias de éxito que hayan visto.<\/p>\n<p>He intentado agregar como amigos a miembros y a sus amigos, preguntas sobre la mejor comida y ahora oraciones/mensajes de esperanza gratis (lo último es lo que ha funcionado).<\/p>\n<p class=\"sign\">Hasta luego y cuidese!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Cumple en Miños<\/li>\n<li>Conferencia de zona<\/li>\n<li>La lagartija de bolsillo del Élder Ricks🦎<\/li>\n<\/ul>\n<p>Animales atropellados:<\/p>\n<ul class=\"bul\">\n<li>¿¡pez?!?!?!🐟<\/li>\n<li>rana🐸<\/li>\n<li>serpiente🐍<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-09-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-09-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_073.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Hice una publicación en redes sociales 😬... ¡Y funcionó!🤯🥵🥳 Hola mis amigos! Otra semana se pasó volando y me encanta la vida de misionero. También gracias a todos los que responden mis correos, me mandan cartas y me felicitaron por mi cumpleaños esta semana. Aunque solo puedo responder por correo o por carta, de verdad lo aprecio todo y lo veo todo. ¡Esta semana fue pura chamba! Llovió dos veces en la semana, lo que hizo que las lecciones y buscar gente fueran bastante difíciles, pero también vimos algunos milagros. Esta semana también tuvimos conferencia de zona. Me gustó muchísimo y en mi opinión fue todavía más divertida porque también era mi cumpleaños. Así que sentí que estaba aprendiendo y a la vez de fiesta con mi familia de la misión. Parte de la conferencia de zona fue un montón de capacitaciones sobre redes sociales. Me sentí tan mal durante una parte de la capacitación porque hablamos de lo bueno, lo mejor y lo excelente. Tenemos muchas herramientas para enseñar y buscar, pero hay distintos niveles de cómo usarlas mejor, sin mencionar asegurarnos de usarlas para cumplir nuestro propósito misional de invitar a TODOS a venir a Cristo. En ese momento me di cuenta de lo mucho que no habíamos estado usando algunas herramientas como las redes sociales. ¡Pero entonces una de mis publicaciones sobre oraciones y mensajes de esperanza gratis empezó a explotar! De repente me llegaban montones de notificaciones de likes, comentarios y mensajes directos. ¡Tuve que silenciar el teléfono! Aunque no todo era amable ni con buenas intenciones, sí vimos buenos resultados y ¡agendamos una lección! El otro milagro de esta semana probablemente fue cuando estuve de intercambio con el Élder Leonard en Dade City inglés. Los élderes de inglés, sobre todo el Élder Ballif cuando todavía estaba aquí, han estado enseñando a una familia increíble en la que solo algunos son miembros. Ya los había mencionado antes porque una le": "¿Escasez de fechas? ¡Para nada!", "date": "2021-10-04T09:26:00", "group": "2021-10", "html": "<div class=\"body\"><p>Buenos Días amigos míos!<\/p>\n<p>Espero que todos hayan tenido la oportunidad de ver la Conferencia General este fin de semana. Hubo unos mensajes muy buenos. Mis favoritos fueron los del Élder Holland y el Élder Gilbert. Cuéntenme algunas cosas padres que aprendieron o cuáles fueron sus favoritos. Esta semana tuve otro intercambio; el Élder Mehr me acompañó en Dade City. Nos rechazaron un montón de señores mayores en casas rodantes, además de una campaña para firmar los Convenios? Bastante chistoso, en nuestra opinión. Pero más tarde esa noche también conocimos a gente buena onda.<\/p>\n<p>¡Esta semana también les pusimos fecha a 2 de nuestros amigos! Nos enteramos de que en nuestra misión hay escasez de fechas bautismales, así que nos pusimos manos a la obra para ponerles fecha. Juan, una referencia increíble de un miembro que está taaan listo para bautizarse, y Gustavo, un amigo al que ya le habían enseñado antes (a eso le dicen \"former\"). Lee mucho el Libro de Mormón y ora mucho. Perdió a su hermano, que era miembro, así que cuando le enseñamos el plan de salvación fue súper especial y le preguntamos si quería volver a ver a su hermano. Lecciones súper especiales con los dos.<\/p>\n<p>No pasaron muchas cosas chistosas esta semana, aunque casi atropellamos a un armadillo vivo. Qué animales tan raros. El martes me doblé el pie, así que el resto de la semana me ha dolido. Me dolía casi todo el tiempo, excepto durante la mejor hora para proselitismo (6-9pm) caminando por el Dirty Dade. Definitivamente un milagro. Y ahora ya casi está sanado por completo. De verdad quisiera tener más historias (no es que lo espiritual o los milagros estén mal) como mi compañero esta semana, así que les voy a contar lo que le pasó a él mientras estaba en Wesley Chapel por el intercambio. Él y el Élder Jenson estaban haciendo contactos en la calle cuando intentaron hablar con un señor. No contestó, así que se fueron, pero pensaron que deberían intentarlo una última vez. Esta vez, cuando se acercaron, el tipo se enojó un poco y dijo: \"¡Nunca se acerquen al carro de un hombre que no conocen! Porque no saben si trae pistola, ¡sigan caminando!\"<\/p>\n<p>Siguieron caminando y no les pasó nada, pero definitivamente traía una pistola, si no, ¿por qué diría eso? Jajaja 🔫<\/p>\n<p>En fin, los cambios ya casi terminan, así que el próximo fin de semana nos vamos a enterar de las noticias.<\/p>\n<p>Hasta la próxima semana,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Gator dogs de Coney Island 🐊<\/li>\n<li>Atardecer<\/li>\n<li>perro 🐕<\/li>\n<li>El Élder Mehr &amp; yo en bicis<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-10-04_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-10-04_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-04_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-10-04_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-04_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_074.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_075.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_076.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "¿Escasez de fechas? ¡Para nada! Buenos Días amigos míos! Espero que todos hayan tenido la oportunidad de ver la Conferencia General este fin de semana. Hubo unos mensajes muy buenos. Mis favoritos fueron los del Élder Holland y el Élder Gilbert. Cuéntenme algunas cosas padres que aprendieron o cuáles fueron sus favoritos. Esta semana tuve otro intercambio; el Élder Mehr me acompañó en Dade City. Nos rechazaron un montón de señores mayores en casas rodantes, además de una campaña para firmar los Convenios? Bastante chistoso, en nuestra opinión. Pero más tarde esa noche también conocimos a gente buena onda. ¡Esta semana también les pusimos fecha a 2 de nuestros amigos! Nos enteramos de que en nuestra misión hay escasez de fechas bautismales, así que nos pusimos manos a la obra para ponerles fecha. Juan, una referencia increíble de un miembro que está taaan listo para bautizarse, y Gustavo, un amigo al que ya le habían enseñado antes (a eso le dicen \"former\"). Lee mucho el Libro de Mormón y ora mucho. Perdió a su hermano, que era miembro, así que cuando le enseñamos el plan de salvación fue súper especial y le preguntamos si quería volver a ver a su hermano. Lecciones súper especiales con los dos. No pasaron muchas cosas chistosas esta semana, aunque casi atropellamos a un armadillo vivo. Qué animales tan raros. El martes me doblé el pie, así que el resto de la semana me ha dolido. Me dolía casi todo el tiempo, excepto durante la mejor hora para proselitismo (6-9pm) caminando por el Dirty Dade. Definitivamente un milagro. Y ahora ya casi está sanado por completo. De verdad quisiera tener más historias (no es que lo espiritual o los milagros estén mal) como mi compañero esta semana, así que les voy a contar lo que le pasó a él mientras estaba en Wesley Chapel por el intercambio. Él y el Élder Jenson estaban haciendo contactos en la calle cuando intentaron hablar con un señor. No contestó, así que se fueron, pero pensaron que deberían intentarlo una última vez. Esta vez, cuando se acercaron, el tipo se enojó un poco y dijo: \"¡Nunca se acerquen al carro de un hombre que no conocen! Porque no saben si trae pistola, ¡sigan caminando!\" Siguieron caminando y no les pasó nada, pero definitivamente traía una pistola, si no, ¿por qué diría eso? Jajaja 🔫 En fin, los cambios ya casi terminan, así que el próximo fin de semana nos vamos a enterar de las noticias. Hasta la próxima semana, Elder Jacobs Fotos: Gator dogs de Coney Island 🐊 Atardecer perro 🐕 El Élder Mehr & yo en bicis Más de esta semana"}, {"id": "l17", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">OCT 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"DO\">🇩🇴 República Dominicana<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["DO"], "moments": ["Baptism"], "extra": "Dominican Republic", "kind": "Carta 17 · Dade City", "title": "🐊 ¡¿Qué?! Ya estoy todo grande 🥸👨‍🎓🏴‍☠️", "date": "2021-10-11T09:38:00", "group": "2021-10", "html": "<div class=\"body\"><p>Buenos Días amigos míos!<\/p>\n<p>Esta semana ha sido increíble y, tristemente, según me enteré, la última en el Dirty Dade City. Me enteré ayer como a la hora de la cena. Me voy a Lakeland con el Élder Olayan y el Élder Izu. ¡El Élder Olayan va a \"morir\" (regresar a casa) y el Élder Izu va a terminar su capacitación conmigo! Yo apenas terminé mi capacitación, así que espero que salga bien. También significa, tristemente, que tal vez no pueda ir al bautismo de Juan el próximo domingo. Le voy a preguntar al presidente, pero si no, será por Zoom.<\/p>\n<p>Las otras noticias de cambios que recibimos son: el Élder Ricks se va a República Dominicana el 28, pero antes le tocan el Élder Makechnie y un nuevo misionero en capacitación. El Élder Ricks (no mi compañero, pero del mismo departamento) se va a Sarasota con el Élder Miller. Y el Élder Leonard se queda y recibe al Élder Hansen. Hay muchos cambios en el distrito y en toda la misión, así que está bastante loco.<\/p>\n<p>¡Esta semana tuvimos 2 intercambios! Uno con el otro Élder Ricks conmigo en Dade City español y el otro en Wesley Chapel con el Élder Jenson. Los dos fueron súper divertidos y aprendí mucho sobre ellos y sobre cómo mejorar. Luego, el viernes, el Élder Thompson y el Élder Eaton hicieron intercambio con los élderes de inglés. Así que pudimos convivir un poco con el Élder Thompson, que es chistosísimo. Nos reímos un montón con sus chistes e historias graciosas.<\/p>\n<p>Esta semana nos dieron un 3er teléfono. La señal con T-Mobile y AT&amp;T ha estado malísima porque vivimos y trabajamos en el quinto pino. Así que nos dieron un 3er teléfono con Verizon (si no funciona, nos ponen wifi). Por suerte ha funcionado de maravilla, pero esta semana fue un poquito molesto. Intentamos activarlo el martes en la mañana, pero no supimos nada hasta el miércoles. Ese día decidimos dejarlo en la casa porque no habíamos sabido nada cuando salimos del departamento. Y con nuestra suerte, se activó mientras estábamos en Dade City (a 25 min manejando de la casa), así que nos quedamos sin teléfono. Ya está todo resuelto y tenemos que acordarnos del 3er teléfono, lo cual es medio molesto/chistoso porque es el mismo modelo y la misma funda que el del Élder Ricks.<\/p>\n<p>El sábado pasado tuvimos una noche cultural latinoamericana de la estaca. Estuvo súper increíble, con un montón de comida, decoraciones, música y bailes de todos esos países. Vinieron muchísimos miembros, amigos y otros misioneros, así que fue todo un éxito. La gente nos seguía llenando los platos de comida si los veían vacíos cuando pasábamos por su mesa jaja. Estos cambios han sido geniales y hemos visto muchísimos milagros, sobre todo cuando simplemente hemos andado por las calles yendo a donde sentimos la inspiración. Esta semana nos metimos a una zona nueva que nunca se había trabajado y encontramos unos amigos nuevos que parecen bastante interesados. Sé que el Salvador camina con nosotros todos los días y estoy emocionado por los próximos cambios. (Ojalá mi español sea suficientemente bueno para capacitar...).<\/p>\n<p>Bueno, me voy al día de preparación, a empacar y a despedirme de la gente de aquí.<\/p>\n<p>Hasta la proxima semana, cuando ya esté en mi nueva área y con nuevos compañeros,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>tie-dye del distrito<\/li>\n<li>El Élder Jenson &amp; yo con nuestros juguetes de Cajita Feliz de Hei Hei (Moana) haciendo contactos en la calle<\/li>\n<li>nube loca<\/li>\n<li>en la iglesia (el Élder Ricks &amp; yo)<\/li>\n<li>Nosotros y los Miño (Joaquin, Jared, Hermana Lucy Miño, &amp; Hermano Juan Miño)<\/li>\n<\/ul>\n<p>Advertencia: la parte de los animales atropellados, claro<\/p>\n<ul class=\"bul\">\n<li>gato...<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-10-11_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-10-11_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-10-11_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-10-11_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-11_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_077.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_078.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_079.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_080.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_081.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐊 ¡¿Qué?! Ya estoy todo grande 🥸👨‍🎓🏴‍☠️ Buenos Días amigos míos! Esta semana ha sido increíble y, tristemente, según me enteré, la última en el Dirty Dade City. Me enteré ayer como a la hora de la cena. Me voy a Lakeland con el Élder Olayan y el Élder Izu. ¡El Élder Olayan va a \"morir\" (regresar a casa) y el Élder Izu va a terminar su capacitación conmigo! Yo apenas terminé mi cap  y bailes de todos esos países. Vinieron muchísimos miembros, amigos y otros misioneros, así que fue todo un éxito. La gente nos seguía llenando los platos de comida si los veían vacíos cuando pasábamos por su mesa jaja. Estos cambios han sido geniales y hemos visto muchísimos milagros, sobre todo cuando simplemente hemos andado por las calles yendo a donde sentimos la inspiración. Esta semana nos metimos a una zona nueva que nunca se había trabajado y encontramos unos amigos nuevos que parecen bastante interesados. Sé que el Salvador camina con nosotros todos los días y estoy emocionado por los próximos cambios. (Ojalá mi español sea suficientemente bueno para capacitar...). Bueno, me voy al día de preparación, a empacar y a despedirme de la gente de aquí. Hasta la proxima semana, cuando ya esté en mi nueva área y con nuevos compañeros, Elder Jacobs Fotos: tie-dye del distrito El Élder Jenson & yo con nuestros juguetes de Cajita Feliz de Hei Hei (Moana) haciendo contactos en la calle nube loca en la iglesia (el Élder Ricks & yo) Nosotros y los Miño (Joaquin, Jared, Hermana Lucy Miño, & Hermano Juan Miño) Advertencia: la parte de los animales atropellados, claro gato... Más de esta semana"}, {"id": "l18", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">OCT 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><\/div>", "cultures": ["PR"], "moments": [], "extra": "Puerto Rico", "kind": "Carta 18 · Lakeland", "title": "✌Bienvenidos from Lakeland 💦🐊", "date": "2021-10-18T15:41:00", "group": "2021-10", "html": "<div class=\"body\"><p>Hola amigos!<\/p>\n<p>Esta semana ha estado bastante increíble gracias a mis nuevos compañeros y mi nueva área. Lakeland está súper padre y es muy diferente al Dirty Dade, pero para bien. Mis compañeros, el Élder Olayan y el Élder Izu, son súper buena onda. El Élder Olayan se va al final de estos cambios, así que nos considera a los dos sus misioneros en capacitación, vibra de misionero veterano. El Élder Izu es un compañero/misionero en capacitación/hijo de misión bastante increíble. Es medio puertorriqueño pero no sabía español antes, así que todos asumen que sabe más que nosotros los gringos, pero luego empieza a hablar y se confunden porque todavía está aprendiendo y su apariencia engaña (igual que con nosotros los gringos; a mí todavía a veces me preguntan si sé español y luego los sorprendo cuando hablo). ¡Pero le está yendo muy bien! Sabe un montón, quizás más de lo que yo sabía al principio de mis segundos cambios. El área está bastante padre por todos los lagos y la gente que conocemos. Muchos latinos, pero dispersos por la ciudad. Dade City es diminuto en comparación. Me está costando acordarme de los nombres y las direcciones ya que ahora yo manejo, pero ahí voy. Tenemos un buen número de amigos, pero nos cuesta llevarlos a la iglesia porque el edificio está lejos. Antes había 2 ramas, pero se juntaron para formar un barrio y entonces cambió el edificio. Estamos tratando de organizar mejor los aventones.<\/p>\n<p>La única historia de esta semana es de un señor haciendo \"porche-logía\" (teología en su porche). Nos llamó y empezamos a platicar porque tenía algunas preguntas sobre nuestra iglesia, pero rápido nos dimos cuenta de que lowkey quería atacarnos o, como él lo llama, \"abrirnos los ojos\". Trataba de explicarnos todo tipo de cosas sobre las razas y en la Biblia, e interpretaba los versículos totalmente diferente a nosotros, así que se molestó con nosotros. Al final nos dimos cuenta de que solo quería convencernos de que Jesús era negro y de que todas las pinturas estaban mal.<\/p>\n<p>La próxima semana me aseguraré de organizarme mejor para poder escribir más. Porque estoy bastante seguro de que tengo más historias, solo que se me están olvidando.<\/p>\n<p class=\"sign\">Hasta luego,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>un accidente que vimos<\/li>\n<li>foto en los cambios antes de irme<\/li>\n<li>minicoco<\/li>\n<li>probé el pho y estaba bastante bueno (creo que todavía me gusta más el ramen)<\/li>\n<\/ul>\n<p>La próxima semana me acordaré de mandar una foto de mis nuevos compañeros<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-10-18_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-10-18_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-10-18_0_2.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_082.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_083.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "✌Bienvenidos from Lakeland 💦🐊 Hola amigos! Esta semana ha estado bastante increíble gracias a mis nuevos compañeros y mi nueva área. Lakeland está súper padre y es muy diferente al Dirty Dade, pero para bien. Mis compañeros, el Élder Olayan y el Élder Izu, son súper buena onda. El Élder Olayan se va al final de estos cambios, así que nos considera a los dos sus misioneros en capacitación, vibra de misionero veterano. El Élder Izu es un compañero/misionero en capacitación/hijo de misión bastante increíble. Es medio puertorriqueño pero no sabía español antes, así que todos asumen que sabe más que nosotros los gringos, pero luego empieza a hablar y se confunden porque todavía está aprendiendo y su apariencia engaña (igual que con nosotros los gringos; a mí todavía a veces me preguntan si sé español y luego los sorprendo cuando hablo). ¡Pero le está yendo muy bien! Sabe un montón, quizás más de lo que yo sabía al principio de mis segundos cambios. El área está bastante padre por todos los lagos y la gente que conocemos. Muchos latinos, pero dispersos por la ciudad. Dade City es diminuto en comparación. Me está costando acordarme de los nombres y las direcciones ya que ahora yo manejo, pero ahí voy. Tenemos un buen número de amigos, pero nos cuesta llevarlos a la iglesia porque el edificio está lejos. Antes había 2 ramas, pero se juntaron para formar un barrio y entonces cambió el edificio. Estamos tratando de organizar mejor los aventones. La única historia de esta semana es de un señor haciendo \"porche-logía\" (teología en su porche). Nos llamó y empezamos a platicar porque tenía algunas preguntas sobre nuestra iglesia, pero rápido nos dimos cuenta de que lowkey quería atacarnos o, como él lo llama, \"abrirnos los ojos\". Trataba de explicarnos todo tipo de cosas sobre las razas y en la Biblia, e interpretaba los versículos totalmente diferente a nosotros, así que se molestó con nosotros. Al final nos dimos cuenta de que solo quería convencernos de que Jesús era negro y de que todas las pinturas estaban mal. La próxima semana me aseguraré de organizarme mejor para poder escribir más. Porque estoy bastante seguro de que tengo más historias, solo que se me están olvidando. Hasta luego, Elder Jacobs Fotos: un accidente que vimos foto en los cambios antes de irme minicoco probé el pho y estaba bastante bueno (creo que todavía me gusta más el ramen) La próxima semana me acordaré de mandar una foto de mis nuevos compañeros Más de esta semana"}, {"id": "l19", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">OCT 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 19 · Lakeland", "title": "🍙🍩🐊¡Comida gratis! 🌮🌯🍔🌭", "date": "2021-10-25T13:06:00", "group": "2021-10", "html": "<div class=\"body\"><p>Bienvenidos de nuevo amigos míos,<\/p>\n<p>Otra semana terminada en la tierra de los lagos, Lakeland. Me encanta estar aquí y estoy aprendiendo constantemente. Esta semana aprendí más sobre capacitar porque el Élder Seamons (Neamons jaja, nuestro líder de distrito) vino de intercambio. Fue súper divertido. Lowkey fue como pasar el día con un amigo, pero haciendo la obra misional y viendo muchísimo éxito. Esta semana fue bastante normal, con los estudios de siempre y luego buscar gente/lecciones. ¡Lo mejor de esta semana fueron todas las comidas gratis y que nuestros amigos vinieron a la iglesia! Vinieron 2 amigos a la iglesia aunque está a 35 min. Esta semana nos dieron de comer 3 veces así nomás. Llegábamos a una casa para pasar a ver cómo estaban y quizás enseñar, pero nuestra suerte esta semana era: llegamos, nos invitan a pasar, como esta?, compartimos un mensaje, ¡y luego nos servían comida que acababan de hacer! Súper rico y épico; sobre todo porque algunas de esas veces no habíamos llevado comida y estábamos lejos del departamento.<\/p>\n<p>Mi favorita fue ayer, domingo, porque entramos ¡y era noche de ensayo de la banda! Tuvimos concierto, compartimos un mensaje y luego comimos. Muy épico; ojalá el video se vea bien.<\/p>\n<p>¡A seguir la fiesta, gente! Me voy a regresar a jugar cierto juego de cartas sin nombre sobre monstruos de bolsillo...jijiji Hasta lasaña, pero que no te manche,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Atardecer<\/li>\n<li>boleto al cielo (de Vidal, un converso nuevo jaja) 🥳<\/li>\n<li>una de las muchas fotos raras del intercambio con el Élder Nuff Neamons 🦍<\/li>\n<li>¡pasamos de visita, nos dieron de comer y escuchamos tocar a una banda! 😎🪅 (el Élder Olayan con la lengua de fuera mientras se rockea)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-10-25_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-25_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-25_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_084.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_085.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🍙🍩🐊¡Comida gratis! 🌮🌯🍔🌭 Bienvenidos de nuevo amigos míos, Otra semana terminada en la tierra de los lagos, Lakeland. Me encanta estar aquí y estoy aprendiendo constantemente. Esta semana aprendí más sobre capacitar porque el Élder Seamons (Neamons jaja, nuestro líder de distrito) vino de intercambio. Fue súper divertido. Lowkey fue como pasar el día con un amigo, pero haciendo la obra misional y viendo muchísimo éxito. Esta semana fue bastante normal, con los estudios de siempre y luego buscar gente/lecciones. ¡Lo mejor de esta semana fueron todas las comidas gratis y que nuestros amigos vinieron a la iglesia! Vinieron 2 amigos a la iglesia aunque está a 35 min. Esta semana nos dieron de comer 3 veces así nomás. Llegábamos a una casa para pasar a ver cómo estaban y quizás enseñar, pero nuestra suerte esta semana era: llegamos, nos invitan a pasar, como esta?, compartimos un mensaje, ¡y luego nos servían comida que acababan de hacer! Súper rico y épico; sobre todo porque algunas de esas veces no habíamos llevado comida y estábamos lejos del departamento. Mi favorita fue ayer, domingo, porque entramos ¡y era noche de ensayo de la banda! Tuvimos concierto, compartimos un mensaje y luego comimos. Muy épico; ojalá el video se vea bien. ¡A seguir la fiesta, gente! Me voy a regresar a jugar cierto juego de cartas sin nombre sobre monstruos de bolsillo...jijiji Hasta lasaña, pero que no te manche, Elder Jacobs Fotos: Atardecer boleto al cielo (de Vidal, un converso nuevo jaja) 🥳 una de las muchas fotos raras del intercambio con el Élder Nuff Neamons 🦍 ¡pasamos de visita, nos dieron de comer y escuchamos tocar a una banda! 😎🪅 (el Élder Olayan con la lengua de fuera mientras se rockea) Más de esta semana"}, {"id": "l20", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 20 · Lakeland", "title": "👻 Feliz noche de brujas 🛸 y conferencia de zona 🪅", "date": "2021-11-01T05:44:00", "group": "2021-11", "html": "<div class=\"body\"><p>Hola mis amigos, cómo les va?<\/p>\n<p>¡Feliz Halloween atrasado! 👻<\/p>\n<p>¡Y también feliz noviembre!<\/p>\n<p>¡Esta semana estuvo puro 🔥 porque pusimos 3 fechas bautismales! Nuestra amiga Danicha &amp; su esposo Javier, a quien no le habíamos enseñado antes, y nuestro amigo Teodoro. Esta semana empezamos a notar que algunos de nuestros amigos no han sido muy firmes con sus compromisos, así que llegamos a la etapa de \"o se bautizan o los soltamos\". Tuvimos varias lecciones esta semana que se cancelaron a última hora o la gente no estaba en casa como habían dicho, y eso fue lo que provocó esta fase. Nos salió a favor porque ahora sabemos que a estos amigos sí les importa, solo que la vida ha estado ocupada, pero el bautismo es su deseo. Aunque esa falta de lecciones fijas fue molesta, significó que caminamos y platicamos con gente un montón. Dimos unas lecciones bastante padres al momento con algunas personas y de hecho tal vez podamos regresar a platicar más. No es igual que Dade City, donde siempre hay gente afuera, pero tal vez en las próximas semanas, ya que el clima se está poniendo fresquito. La otra cosa increíble de esta semana fue la conferencia de zona. Aprendimos muchas cosas que de verdad respondieron algunas de mis preguntas como capacitador. Siento que lo estoy haciendo bien, pero hay otras veces que sé que simplemente no entiendo cómo enseñarle/ayudarle al Élder Izu a entender y progresar un poquito más, pero por eso la conferencia de zona y el Élder Olayan me ayudan tanto.<\/p>\n<p>El enfoque principal de la conferencia de zona fue Predicad Mi Evangelio (PME) y el Libro de Mormón. Necesitamos asegurarnos de aplicar PME todos los días para ser mejores misioneros, pero también el Libro de Mormón, para tener un testimonio fuerte y el Espíritu con nosotros cuando enseñamos. El Libro de Mormón ha sido un tema bastante constante durante más o menos el último mes en otros consejos de distrito y en la última conferencia de zona. Personalmente, nunca había entendido su poder hasta hace poco. Las escrituras que compartimos de él y la diferencia que siento los días que sí lo leo de verdad me han fortalecido el testimonio. Ahora sé más que nunca que este libro es como la Biblia, o incluso mejor, y puede cambiar vidas. Esta semana leí una de mis historias favoritas, sobre los anti-nefi-lehitas. Amaban tanto al Señor, aprendieron del Espíritu y se arrepintieron, al grado de que no quisieron pelear más para mostrar lo dedicados que estaban a seguir a Cristo y guardar los mandamientos. Es difícil ser así de justo y a la vez amar a todos (sobre todo a esos que atacan a la Iglesia), pero por medio de Cristo podemos ser un solo pueblo para que ya no haya más \"-itas\" (4 Nefi 1:17).<\/p>\n<p>Lo último que quiero compartir esta semana es sobre la autoridad que tienen los misioneros. Esta semana de verdad he notado en varias situaciones que la gente confía en nosotros y reconoce quiénes somos. A veces hasta nos cuentan cosas muy personales, y ha sido muy especial que nos reconozcan como representantes así. También funciona al revés. Cuando reconocemos quiénes son ellos como amigos e hijos de Dios, se vuelve mucho más fácil enseñarles y también entenderles, aunque sea en otro idioma (a veces con acentos muy difíciles).<\/p>\n<p>Les amo muchísimos mis amigos (perdón si esperaban un poquito más de cosas chistosas/historias, pero quería compartir más de lo espiritual y del crecimiento que he tenido y visto) hasta la próxima,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>🤮🎃<\/li>\n<li>estatua nueva porque los élderes de Gibsonia siguen recogiendo objetos al azar de la orilla de la carretera y metiéndolos a escondidas<\/li>\n<li>bici estática ^^^^<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-11-01_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-01_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-01_0_2.jpg\" alt=\"\"><\/figure><\/div>", "text": "👻 Feliz noche de brujas 🛸 y conferencia de zona 🪅 Hola mis amigos, cómo les va? ¡Feliz Halloween atrasado! 👻 ¡Y también feliz noviembre! ¡Esta semana estuvo puro 🔥 porque pusimos 3 fechas bautismales! Nuestra amiga Danicha & su esposo Javier, a quien no le habíamos enseñado antes, y nuestro amigo Teodoro. Esta semana empezamos a notar que algunos de nuestros amigos no han sido muy firmes con sus compromisos, así que llegamos a la etapa de \"o se bautizan o los soltamos\". Tuvimos varias lecciones esta semana que se cancelaron a última hora o la gente no estaba en casa como habían dicho, y eso fue lo que provocó esta fase. Nos salió a favor porque ahora sabemos que a estos amigos sí les importa, solo que la vida ha estado ocupada, pero el bautismo es su deseo. Aunque esa falta de lecciones fijas fue molesta, significó que caminamos y platicamos con gente un montón. Dimos unas lecciones bastante padres al momento con algunas personas y de hecho tal vez podamos regresar a platicar más. No es igual que Dade City, donde siempre hay gente afuera, pero tal vez en las próximas semanas, ya que el clima se está poniendo fresquito. La otra cosa increíble de esta semana fue la conferencia de zona. Aprendimos muchas cosas que de verdad respondieron algunas de mis preguntas como capacitador. Siento que lo estoy haciendo bien, pero hay otras veces que sé que simplemente no entiendo cómo enseñarle/ayudarle al Élder Izu a entender y progresar un poquito más, pero por eso la conferencia de zona y el Élder Olayan me ayudan tanto. El enfoque principal de la conferencia de zona fue Predicad Mi Evangelio (PME) y el Libro de Mormón. Necesitamos asegurarnos de aplicar PME todos los días para ser mejores misioneros, pero también el Libro de Mormón, para tener un testimonio fuerte y el Espíritu con nosotros cuando enseñamos. El Libro de Mormón ha sido un tema bastante constante durante más o menos el último mes en otros consejos de distrito y en la última conferencia de zona. Personalmente, nunca había entendido su poder hasta hace poco. Las escrituras que compartimos de él y la diferencia que siento los días que sí lo leo de verdad me han fortalecido el testimonio. Ahora sé más que nunca que este libro es como la Biblia, o incluso mejor, y puede cambiar vidas. Esta semana leí una de mis historias favoritas, sobre los anti-nefi-lehitas. Amaban tanto al Señor, aprendieron del Espíritu y se arrepintieron, al grado de que no quisieron pelear más para mostrar lo dedicados que estaban a seguir a Cristo y guardar los mandamientos. Es difícil ser así de justo y a la vez amar a todos (sobre todo a esos que atacan a la Iglesia), pero por medio de Cristo podemos ser un solo pueblo para que ya no haya más \"-itas\" (4 Nefi 1:17). Lo último que quiero compartir esta semana es sobre la autoridad que tienen los misioneros. Esta semana de verdad he notado en varias situaciones que la gente confía en nosotros y reconoce quiénes somos. A veces hasta nos cuentan cosas muy personales, y ha sido muy especial que nos reconozcan como representantes así. También funciona al revés. Cuando reconocemos quiénes son ellos como amigos e hijos de Dios, se vuelve mucho más fácil enseñarles y también entenderles, aunque sea en otro idioma (a veces con acentos muy difíciles). Les amo muchísimos mis amigos (perdón si esperaban un poquito más de cosas chistosas/historias, pero quería compartir más de lo espiritual y del crecimiento que he tenido y visto) hasta la próxima, Elder Jacobs Fotos: 🤮🎃 estatua nueva porque los élderes de Gibsonia siguen recogiendo objetos al azar de la orilla de la carretera y metiéndolos a escondidas bici estática ^^^^"}, {"id": "l21", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haití<\/span><\/div>", "cultures": ["HT"], "moments": [], "extra": "Haiti", "kind": "Carta 21 · Lakeland", "title": "🍌😎 Ahora soy un élder de criollo haitiano 🇭🇹", "date": "2021-11-08T05:23:00", "group": "2021-11", "html": "<div class=\"body\"><p>Bienvenidos amigos de nuevo a mi canal! Jajaja jk<\/p>\n<p>Esta semana estuvo llena de lecciones increíbles y el futuro también pinta bien. De hecho, nuestro líder de distrito, el Élder Seamons, nos retó a dar 40 lecciones la próxima semana; así que estoy emocionado y nervioso por ver cómo nos va. ¡También está haciendo un frío 🥶! Florida y frío no parecían cosas reales, pero hemos estado usando chamarras/suéteres bastante seguido. Y se supone que va a empeorar.<\/p>\n<p>¡El título de esta semana es porque fui de intercambios otra vez! Esta vez los líderes de zona, el Élder Campbell &amp; el Élder Jacobs (ahora \"Sr.\" porque lleva más tiempo en la misión), vinieron a Lakeland con el Élder Izu. El Élder Olayan se fue a Lake Wales con el Élder Lauritzen y yo me fui a Winterhaven criollo con el Élder Zamor. Los intercambios salieron súper bien, todos aprendimos cosas muy buenas y nos divertimos. El criollo tiene algunas partes parecidas al español, pero fuera de eso nada, así que fue medio difícil en algunas lecciones. Por suerte el Élder Zamor es un crack y me traducía muy bien, y la mayoría de la gente entendía algo de inglés. Hasta tuvimos clase de inglés. Un señor de la clase vivió 4 años en Chile, así que sabe español y así nos comunicamos. También quedó muy impresionado con mi español 😎.<\/p>\n<p>También tuvimos entrevistas con el presidente y la hermana Hollingsworth, ya que los cambios casi terminan. Se aseguraron bien de decirme que siempre hable español cuando pueda y que haga más dramatizaciones, porque me va a ayudar a mí y a mis compañeros. Esta semana tuvimos una lección de traspaso muy padre. Las hermanas de Highland encontraron a un señor por su anuncio de Biblia gratis; él sabía algo de inglés y quería aprender más, y también sobre la Biblia. La barrera del idioma terminó siendo demasiado, así que las preguntas/respuestas no se entendían del todo, y por eso ahora les estamos enseñando nosotros. La lección de esta semana, después de que las hermanas nos presentaron, fue una locura. Al principio estaban confundidos de por qué estábamos ahí porque les dijeron que venían misioneros de español jaja, y luego cuando se dieron cuenta de que sí hablamos, se abrieron las compuertas...<\/p>\n<p>Estuvimos ahí 2 horas tratando de responder su monte Everest de preguntas. Son súper buena onda y vamos a regresar para responder más 😅<\/p>\n<p>Una de las mejores cosas de esta semana, aunque toda la semana estuvo bastante bien, fue la noticia del cambio de horario. Como de 6 a 9pm, el \"horario estelar\", ya va a estar oscuro, ¡ahora sí podemos estar afuera a esa hora! Podemos volver a hacer visitas sin planear después de que oscurece y tocar puertas de forma estratégica. Definitivamente estoy emocionado por esto porque vamos a poder hacer muchas menos llamadas en la tarde cuando se caen los planes, y en vez de eso salir a caminar y platicar, y luego quizás tocar unas cuantas puertas.<\/p>\n<p>Esta semana, como distrito, hemos estado poniendo metas en nuestros compañerismos y luego mandando un mensaje en la noche diciendo cómo nos fue. Las metas son tan importantes porque sin algo en mente hacia lo cual trabajar es difícil, casi imposible, seguirle dando. Si quieres hacer crecer tu testimonio, necesitas pensar cómo lo vas a hacer. ¿Escrituras y oración? OK, pero ¿qué tan seguido y cuánto? ¿O para qué día quiero terminar el libro de ____? También aplica a otras cosas de la vida como el ejercicio, la música, la escuela, los deportes, los videojuegos. Pero esta semana he notado lo mucho mejor que trabajamos con metas y los milagros que vemos.<\/p>\n<p>Mencioné que el Élder Seamons nos retó a 40 lecciones la próxima semana, pero es porque él y sus compañeros se pusieron esa meta y han estado trabajando en ella con metas diarias más pequeñas. La lograron y tenían un montón de milagros increíbles que compartirnos.<\/p>\n<p>¡No olviden darle like, comentar y suscribirse! (OK, ahora sí ya le paro)<\/p>\n<p>Cuidense!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.D. Leo cada correo que me llega, pero no puedo responder hasta el lunes. ¡Y a veces se me olvida responder o no me da tiempo, así que lo siento mucho! ¡Ojalá me sigan escribiendo porque me encanta saber de ustedes!<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Conferencia de zona de Lakeland (de izquierda a derecha: Élder Seamons, Astorga, Dana, Izu, yo, Olayan, Campbell, Zamor, Lauritzen y Jacobs)<\/li>\n<li>lluvia<\/li>\n<li>nuestros cortes recién hechos estando afuera bajo la lluvia fría<\/li>\n<li>más lluvia<\/li>\n<li>lección por teléfono<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-11-08_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-08_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-08_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-08_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-11-08_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-11-08_0_5.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\
