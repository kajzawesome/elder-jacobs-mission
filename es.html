4T10:01:00", "group": "2022-02", "html": "<div class=\"body\"><p>Hola a todos desde en medio de la nada. Bueno, sí estoy en algún lugar, solo que probablemente nadie ha oído de él. Vivimos en Wauchula y cubrimos los pueblos de alrededor: Arcadia, Myakka City, Bowling Green y otros más chiquitos. Nuestra área es súper rural. Puros pueblitos, tráilers, casitas, campos y cosas así. Por ejemplo, tenemos un Walmart súper chiquito, Family Dollars y Dollar Generals como tiendas, junto con Wendy's, Burger King, McDonald's y Taco Bell. Tristemente no hay Chick-fil-A. Los misioneros más cercanos están a una hora, así que estamos bastante aislados.<\/p>\n<p>La semana estuvo bastante bien, enseñamos una buena cantidad de lecciones, por suerte casi todas en español, y los miembros de aquí de verdad quieren ayudar con las lecciones, lo cual ha sido increíble. También les gusta darnos de comer; puede que sí o puede que no hayamos tenido 2 comidas con miembros por accidente porque llegamos y ya habían preparado comida.<\/p>\n<p>El Élder Gundersen y yo conectamos al instante y no hemos parado de reírnos, lo que nos hizo pensar que nos iban a cambiar jaja. Los cambios normales son el martes y por suerte los dos nos quedamos, pero a los otros élderes (estamos en un distrito de puros élderes) les van a hacer whitewash.<\/p>\n<p>La verdad no pasó nada súper loco esta semana, pero sí conocimos a unos tipos increíbles, Misael &amp; Josue. Querían aprender inglés, pero cuando platicamos de nuestro propósito y aclaramos las expectativas, estuvieron abiertos al Evangelio y dijeron que habían estado buscando una iglesia. ¡Y luego vinieron al día siguiente manejando un poco más de una hora para llegar! Chequen la foto<\/p>\n<p>Aunque me cambiaron, todavía estaba lo bastante cerca para poder ir a bautizar a nuestro amigo Arnulfo! Estaba muy feliz y listo para empezar una nueva etapa de su vida. Fue una experiencia súper especial y compartió su testimonio, ¡lo cual fue increíble!<\/p>\n<p class=\"sign\">Los amo muchísimo y Sean excelentes!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Josue, el Élder Gundersen, Misael y yo<\/li>\n<li>¡El bautismo de Arnulfo!<\/li>\n<li>1 de 6 cajas de fresas frescas 🍓 que nos regaló nuestro amigo Clemente<\/li>\n<li>Los lentes de sol del Élder Gundersen y sus habilidades en el piano<\/li>\n<li>yuju día de preparación<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-02-14_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-02-14_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-14_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-14_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-14_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_178.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_179.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_180.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_181.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🗿🪐 ¡En medio de la nada & bautismo! 🌊 Hola a todos desde en medio de la nada. Bueno, sí estoy en algún lugar, solo que probablemente nadie ha oído de él. Vivimos en Wauchula y cubrimos los pueblos de alrededor: Arcadia, Myakka City, Bowling Green y otros más chiquitos. Nuestra área es súper rural. Puros pueblitos, tráilers, casitas, campos y cosas así. Por ejemplo, tenemos un Walmart súper chiquito, Family Dollars y Dollar Generals como tiendas, junto con Wendy's, Burger King, McDonald's y Taco Bell. Tristemente no hay Chick-fil-A. Los misioneros más cercanos están a una hora, así que estamos bastante aislados. La semana estuvo bastante bien, enseñamos una buena cantidad de lecciones, por suerte casi todas en español, y los miembros de aquí de verdad quieren ayudar con las lecciones, lo cual ha sido increíble. También les gusta darnos de comer; puede que sí o puede que no hayamos tenido 2 comidas con miembros por accidente porque llegamos y ya habían preparado comida. El Élder Gundersen y yo conectamos al instante y no hemos parado de reírnos, lo que nos hizo pensar que nos iban a cambiar jaja. Los cambios normales son el martes y por suerte los dos nos quedamos, pero a los otros élderes (estamos en un distrito de puros élderes) les van a hacer whitewash. La verdad no pasó nada súper loco esta semana, pero sí conocimos a unos tipos increíbles, Misael & Josue. Querían aprender inglés, pero cuando platicamos de nuestro propósito y aclaramos las expectativas, estuvieron abiertos al Evangelio y dijeron que habían estado buscando una iglesia. ¡Y luego vinieron al día siguiente manejando un poco más de una hora para llegar! Chequen la foto Aunque me cambiaron, todavía estaba lo bastante cerca para poder ir a bautizar a nuestro amigo Arnulfo! Estaba muy feliz y listo para empezar una nueva etapa de su vida. Fue una experiencia súper especial y compartió su testimonio, ¡lo cual fue increíble! Los amo muchísimo y Sean excelentes! Elder Jacobs Fotos: Josue, el Élder Gundersen, Misael y yo ¡El bautismo de Arnulfo! 1 de 6 cajas de fresas frescas 🍓 que nos regaló nuestro amigo Clemente Los lentes de sol del Élder Gundersen y sus habilidades en el piano yuju día de preparación Más de esta semana"}, {"id": "l36", "area": 4, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">PEACE RIVER, FL<\/span><span class=\"pm-d\">FEB 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 36 · Peace River", "title": "Agrio pero dulce", "date": "2022-02-21T11:17:00", "group": "2022-02", "html": "<div class=\"body\"><p>Hemlo mis amigos<\/p>\n<p>Esta semana estuvo bastante bien pero, como insinúa mi título, difícil.<\/p>\n<p>La semana empezó con que dejamos (dejamos de enseñar) a algunos amigos. Fue muy difícil por el amor que les tenemos y pensábamos que estaban listos para el bautismo; pero conforme tuvimos lecciones, se hizo evidente que todavía no era su momento.<\/p>\n<p>Luego nos pusimos en modo grind de buscar: en bici, caminando, amigos de miembros, básicamente todo lo que pudiéramos hacer. Eso trajo unos milagros increíbles en los que fuimos herramientas en las manos del Señor.<\/p>\n<p>Cada día de esta semana encontramos a 1 persona que nos necesitaba desesperadamente. Ya fuera una bendición, una escritura o a veces solo alguien que la escuchara.<\/p>\n<p>Algo chistoso que pasó esta semana fue cuando estábamos esperando a que Daniel saliera para platicar. Estábamos en su porche y de repente quedé 30 centímetros más abajo. Tenía el pie sobre una tabla podrida y me hundí al instante. El Élder Gundersen y yo nada más nos quedamos viendo un segundo, totalmente sorprendidos, hasta que dije: \"¡pues ayúdame a subir ya!\" Jaja<\/p>\n<p>Di un discurso el domingo (sorpresa de último minuto) y, como no me dieron tema, sentí que debía hablar de la Expiación. Que fue más o menos el tema de la reunión sacramental #revelación. Lo compartiría, pero solo tengo unas notas/escrituras rápidas apuntadas porque tuve 15 min para prepararme.<\/p>\n<p>Isaías 53:3-6, 2 Nefi 9:5-8, 1 Corintios 15:22<\/p>\n<p class=\"sign\">Los amo y Sean excelentes!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>la shamrock shake está buena, no la había probado<\/li>\n<li>reeses (no vale la pena, para que sepan)<\/li>\n<li>si<\/li>\n<li>video random de esta semana<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-02-21_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-21_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-21_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_182.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_183.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_184.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_185.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Agrio pero dulce Hemlo mis amigos Esta semana estuvo bastante bien pero, como insinúa mi título, difícil. La semana empezó con que dejamos (dejamos de enseñar) a algunos amigos. Fue muy difícil por el amor que les tenemos y pensábamos que estaban listos para el bautismo; pero conforme tuvimos lecciones, se hizo evidente que todavía no era su momento. Luego nos pusimos en modo grind de buscar: en bici, caminando, amigos de miembros, básicamente todo lo que pudiéramos hacer. Eso trajo unos milagros increíbles en los que fuimos herramientas en las manos del Señor. Cada día de esta semana encontramos a 1 persona que nos necesitaba desesperadamente. Ya fuera una bendición, una escritura o a veces solo alguien que la escuchara. Algo chistoso que pasó esta semana fue cuando estábamos esperando a que Daniel saliera para platicar. Estábamos en su porche y de repente quedé 30 centímetros más abajo. Tenía el pie sobre una tabla podrida y me hundí al instante. El Élder Gundersen y yo nada más nos quedamos viendo un segundo, totalmente sorprendidos, hasta que dije: \"¡pues ayúdame a subir ya!\" Jaja Di un discurso el domingo (sorpresa de último minuto) y, como no me dieron tema, sentí que debía hablar de la Expiación. Que fue más o menos el tema de la reunión sacramental #revelación. Lo compartiría, pero solo tengo unas notas/escrituras rápidas apuntadas porque tuve 15 min para prepararme. Isaías 53:3-6, 2 Nefi 9:5-8, 1 Corintios 15:22 Los amo y Sean excelentes! Elder Jacobs Fotos: la shamrock shake está buena, no la había probado reeses (no vale la pena, para que sepan) si video random de esta semana Más de esta semana"}, {"id": "l37", "area": 4, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">PEACE RIVER, FL<\/span><span class=\"pm-d\">FEB 2022<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 37 · Peace River", "title": "🐶🐺 Perros, desveladas 🌚, viajes en carretera 🚙 y humo 🔥", "date": "2022-02-28T08:59:00", "group": "2022-02", "html": "<div class=\"body\"><p>Buenoooooos dìaaaas mis queridos amigos!<\/p>\n<p>Qué lo que?<\/p>\n<p>Hemos tenido una semana increíble con un montón de lecciones y nuestros amigos van bien. Estamos batallando un poco porque casi solo tenemos amigos que hablan español en una rama en inglés. Los pocos miembros que hablan español aquí están muy ocupados, pero ojalá encontremos la manera de superar eso, además de encontrar más gente de habla inglesa a quien enseñar.<\/p>\n<p>Esta semana nos llamaron para hacer mensajería para la página de Facebook, pero luego nos volvieron a llamar para decirnos que no íbamos a hacer 1 día a la semana por 3 horas, o sea mensajería en horario estelar, sino que somos el equipo nocturno. De 9 a 10:30 pm todas las noches estamos en todas las páginas. Ha estado bien, a veces un poco lento, otras veces demasiaaado ocupado, y el nuevo horario de sueño, levantándonos y acostándonos una hora más tarde, está rarísimo.<\/p>\n<p>Esta semana me persiguieron perros dos veces. Una en mi bici en la noche, esa estuvo cerca. Apenas vi su cara a 15 cm de mi pie, luego se dio cuenta y empezó a ladrar y a correr más rápido. Nunca había pedaleado tan rápido. El otro era súper amigable, viejo, pero enorme, así que cuando se dio cuenta de que nos íbamos quiso jugar. Me mordía la mano, intentaba brincarme encima y me jalaba del brazo con el hocico por la calle mientras caminábamos. Más divertido, pero asqueroso, y me dolió la mano.<\/p>\n<p>Algo que he empezado a notar es que a todos lados que vamos es un viaje en carretera. El consejo de distrito es en Fort Myers, así que una hora a Port Charlotte y luego otros 45 min compartiendo carro. Luego también tuvimos intercambios esta semana con Rio Vista Spanish, que viven en Fort Myers. Además, 30 min a Arcadia, y vamos seguido.<\/p>\n<p>Una vez, estando en Arcadia esta semana, hubo un incendio enorme cerca, así que nos estaba cayendo un montón de ceniza y la estábamos respirando. Absolutamente horrible. Al Élder Gundersen le entró ceniza en el ojo y tuvimos que ir a urgencias. Ya todo bien, pero rip.<\/p>\n<p>Por favor oren por nuestros amigos:<\/p>\n<p>Santos, Sharon, Nan, Edwin, Misael &amp; Josue, Hna. Cepoudy (conversa reciente), Clemente, Erasto &amp; Isaac, Maria &amp; José y Lazara.<\/p>\n<p>Traducir en la iglesia sigue siendo difícil (los discursantes casi nunca bajan la velocidad ni dicen qué escrituras/citas están usando), cualquier consejo de mis amigos hispanohablantes se agradece muchísimo. Por ahora sigo intentándolo, ampliando mi vocabulario y gramática. Nuestro tiwi (la caja tonta del carro que monitorea cómo manejamos; pregúntenle a un misionero o busquen inthinc box para saber más) se descompuso esta semana. ¡Hurra! Pero luego lo arreglaron.<\/p>\n<p>Esta semana fui de intercambio a Fort Myers y estuve con el Élder Nelson, ¡mi primerísimo compañero! Fue súper divertido<\/p>\n<p class=\"sign\">Hasta luego, dèjenme saber qué pasao' en sus vidas! Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>#1 en la liga diamante de Duolingo 😎<\/li>\n<li>poniendo a nuestro líder de distrito a hablarle por teléfono a estos hámsteres de juguete tontos que repiten todo lo que dices<\/li>\n<li>humo<\/li>\n<li>meme #poderdelsacerdocio<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-02-28_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-28_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-28_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-28_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_186.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_187.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🐶🐺 Perros, desveladas 🌚, viajes en carretera 🚙 y humo 🔥 Buenoooooos dìaaaas mis queridos amigos! Qué lo que? Hemos tenido una semana increíble con un montón de lecciones y nuestros amigos van bien. Estamos batallando un poco porque casi solo tenemos amigos que hablan español en una rama en inglés. Los pocos miembros que hablan español aquí están muy ocupados, pero ojalá encontremos la manera de superar eso, además de encontrar más gente de habla inglesa a quien enseñar. Esta semana nos llamaron para hacer mensajería para la página de Facebook, pero luego nos volvieron a llamar para decirnos que no íbamos a hacer 1 día a la semana por 3 horas, o sea mensajería en horario estelar, sino que somos el equipo nocturno. De 9 a 10:30 pm todas las noches estamos en todas las páginas. Ha estado bien, a veces un poco lento, otras veces demasiaaado ocupado, y el nuevo horario de sueño, levantándonos y acostándonos una hora más tarde, está rarísimo. Esta semana me persiguieron perros dos veces. Una en mi bici en la noche, esa estuvo cerca. Apenas vi su cara a 15 cm de mi pie, luego se dio cuenta y empezó a ladrar y a correr más rápido. Nunca había pedaleado tan rápido. El otro era súper amigable, viejo, pero enorme, así que cuando se dio  FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["MX"], "moments": ["Baptism", "Temple"], "extra": "Mexico", "kind": "Carta 38 · Peace River", "title": "🛤¡Viaje al templo! ⛪& Una Fiesta 🥳", "date": "2022-03-07T11:14:00", "group": "2022-03", "html": "<div class=\"body\"><p>Qué tal amigos?<\/p>\n<p>Todo bien acá en Peace River. No les voy a mentir, tuvimos una semana bastante ocupada.<\/p>\n<p>Lo mejor de esta semana fue ir al templo. Fuimos el miércoles pero casi nos lo perdemos. No escuchamos la alarma de las 5 am y despertamos a las 6 (cuando ya teníamos que salir) con los otros élderes con los que íbamos a compartir carro golpeando la puerta y tocando el timbre. La adrenalina fue real y de alguna manera llegamos a tiempo antes de que todos se fueran en las camionetas.<\/p>\n<p>Esta semana estuvo bien, nada demasiado emocionante en cuanto a nuevos amigos. Sí encontramos bastantes, pero la mayoría por Facebook y para otras áreas de la misión #referralgrind<\/p>\n<p>¡A nuestro amigo Santos le va súper bien! De verdad ha estado aprendiendo mucho y ayer tuvimos una lección increíble sobre la primera parte del plan de salvación: enfocándonos en su potencial divino y en la Expiación. Anoche todo le hizo clic y de verdad entiende a su Salvador.<\/p>\n<p>¡Esta semana pudimos hablar otra vez con Nan! Ha estado mucho en Plant City cuidando a su mamá, pero también platicando con los misioneros de allá. ¡Decidió que quiere bautizarse! Aunque me da tristeza que no voy a poder verlo... Ah sí, me van a hacer ET otra vez (2.ª vez). Me voy a la zona de St. Petersburg, al área Largo Spanish B. Haciendo whitewash con el Élder Schauers (aprendió suficiente español en la misión para pasar de inglés a español jajaja épico). Estoy emocionado pero triste de irme tan pronto. He oído que la rama es súper increíble y la zona está bastante padre, pero me da tristeza dejar Fort Myers.<\/p>\n<p>Esta semana terminé el Libro de Mormón en español. Me encantan las últimas palabras de Moroni, 10:32-34. Fue súper increíble ver que al principio de leerlo me costaba muchísimo entender, pero ahora, 9 meses después, prefiero leer (básicamente hacer cualquier cosa) en español.<\/p>\n<p class=\"sign\">Los amo y espero que tengan una buena semana llena de milagros!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Templo<\/li>\n<li>guajolotes<\/li>\n<li>meme que hice<\/li>\n<li>QEPD lasaña<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>Y sobre lo de la fiesta: fuimos a una fiesta de cumpleaños mexicana de la nieta de unos amigos y había un tanque para tirar gente al agua y muchas otras cosas divertidas. Medio raro porque somos misioneros y además había alcohol, así que nos fuimos temprano...<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-03-07_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-07_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-07_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-07_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-07_0_4.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-07_1_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-07_1_1.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_188.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_189.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_190.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure cla inglés a español jajaja épico). Estoy emocionado pero triste de irme tan pronto. He oído que la rama es súper increíble y la zona está bastante padre, pero me da tristeza dejar Fort Myers. Esta semana terminé el Libro de Mormón en español. Me encantan las últimas palabras de Moroni, 10:32-34. Fue súper increíble ver que al principio de leerlo me costaba muchísimo entender, pero ahora, 9 meses después, prefiero leer (básicamente hacer cualquier cosa) en español. Los amo y espero que tengan una buena semana llena de milagros! Elder Jacobs Fotos: Templo guajolotes meme que hice QEPD lasaña Y sobre lo de la fiesta: fuimos a una fiesta de cumpleaños mexicana de la nieta de unos amigos y había un tanque para tirar gente al agua y muchas otras cosas divertidas. Medio raro porque somos misioneros y además había alcohol, así que nos fuimos temprano... Más de esta semana"}, {"id": "l39", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"AR\">🇦🇷 Argentina<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["VE", "AR"], "moments": ["Temple"], "extra": "Venezuela Argentina", "kind": "Carta 39 · Largo", "title": "🏟🌋 Larrrrgoooooo 🤩", "date": "2022-03-14T07:18:00", "group": "2022-03", "html": "<div class=\"body\"><p>Ola! Bon día!<\/p>\n<p>Todo bem? Bueno, un cambio de emergencia y un whitewash han sido toda una experiencia esta semana. El Élder Schauers, mi compañero, es increíble, pero aunque él es el compañero mayor, el compañero mayor soy yo. Apenas lleva 5 semanas sirviendo en un área de español, así que yo dirijo todo lo que es en español. El Élder Schauers es de Bozeman, Montana, y nos llevamos muy bien. Esta semana salió muy bien, no encontramos un montón de amigos nuevos para enseñar ni enseñamos una cantidad loca, porque nos hemos enfocado mucho en contactar a los amigos y a la rama y luego en crear relaciones. Supongo que nuestra pasadita con el presidente de rama salió bien, porque me pidieron dar un discurso el domingo. También salió muy bien.<\/p>\n<p>Tenemos bastantes amigos, todos bastante increíbles, la mayoría de Venezuela, pero bastante ocupados. #vidadeciudadgrande Aquí van algunos de sus nombres:<\/p>\n<p>Endrina, Solmar, Zaher, Emilio, Juan, Juan Carlos y Blanca. Hay más, solo que todavía no los hemos contactado en persona.<\/p>\n<p>Juan Carlos de hecho es nuevo, así que cuando nos vimos el sábado en la tarde le enseñamos la Restauración. Lo absorbió todo, hizo muy buenas preguntas y nos dijo que más o menos ya conoce nuestra iglesia y que, por la lección, cree lo mismo que le enseñamos. Estamos emocionados por la próxima semana. ¡A Endrina, Solmar y Zaher les gustó mucho el amor de la rama y la paz que sintieron en la iglesia! Juan es bastante nuevo en esto de la religión, pero también va bien.<\/p>\n<p>Algo común que he visto aquí es que la rama está muy involucrada y hay mucha gente que llega a la iglesia así nomás y luego empezamos a enseñarles, así que es increíble. ¡Sobre todo nuestro 3er compañero, el Élder Owen! Es de Argentina, miembro desde hace más de 30 años, y le encanta ayudarnos. Viene los días que no está en el templo ¡y nos lleva en carro a todos lados! 65 años y sigue dándole con los misioneros. Siente que es su llamamiento hacerlo. La rama también se ha dado cuenta de que es difícil que la gente se sienta amada o haga cambios grandes en su vida para vivir el Evangelio si no tiene el apoyo adecuado. Así que hay un programa para enseñar inglés, encontrar trabajo, ayudar con inmigración, comida, etc.<\/p>\n<p>¡Me está encantando esta área, la rama, mi compañero, todo! La ciudad grande se siente muy rara después de dejar un área con una población de ¿5,000 tal vez? Aquí hay 1 millón en St. Petersburg y las áreas cercanas.<\/p>\n<p>Aquí va un discurso que me encantó esta semana:<\/p>\n<p>\"Absorbidos en la voluntad del Padre\" Neal A. Maxwell, oct. 1995<\/p>\n<p class=\"sign\">Los amo muchísimo queridos amigos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>nuestro carro PZZ A55 (interprétenlo como quieran jaja)<\/li>\n<li>el viaje a la nueva área<\/li>\n<li>tacos de postre<\/li>\n<li>Élder Owen<\/li>\n<li>unos memes<\/li>\n<li>La zona de Fort Myers en el templo la semana pasada<\/li>\n<li>Video del desafío de zona<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-03-14_0_0.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-14_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-14_0_6.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-03-14_0_7.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_198.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_199.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_200.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_201.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_202.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_203.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_204.jpg\" alt=\"\"><\/figure> nseñarles, así que es increíble. ¡Sobre todo nuestro 3er compañero, el Élder Owen! Es de Argentina, miembro desde hace más de 30 años, y le encanta ayudarnos. Viene los días que no está en el templo ¡y nos lleva en carro a todos lados! 65 años y sigue dándole con los misioneros. Siente que es su llamamiento hacerlo. La rama también se ha dado cuenta de que es difícil que la gente se sienta amada o haga cambios grandes en su vida para vivir el Evangelio si no tiene el apoyo adecuado. Así que hay un programa para enseñar inglés, encontrar trabajo, ayudar con inmigración, comida, etc. ¡Me está encantando esta área, la rama, mi compañero, todo! La ciudad grande se siente muy rara después de dejar un área con una población de ¿5,000 tal vez? Aquí hay 1 millón en St. Petersburg y las áreas cercanas. Aquí va un discurso que me encantó esta semana: \"Absorbidos en la voluntad del Padre\" Neal A. Maxwell, oct. 1995 Los amo muchísimo queridos amigos! Elder Jacobs Fotos: nuestro carro PZZ A55 (interprétenlo como quieran jaja) el viaje a la nueva área tacos de postre Élder Owen unos memes La zona de Fort Myers en el templo la semana pasada Video del desafío de zona Más de esta semana"}, {"id": "story", "kind": "En mis propias palabras · el don de lenguas", "title": "Llamado al portugués", "date": null, "group": "2022-03", "html": "<div class=\"body\"><p>Empezó durante mi primera vez en Largo. Mi compañero, el Élder Schauers, y yo habíamos recibido una referencia en línea para ir a visitar a una señora. Su nombre y todo se veía normal. Pero cuando llegamos a la casa y tocamos la puerta, ella abrió, y su español sonaba raro.<\/p><p>Yo estaba confundido, pero el Élder Schauers rápido se dio cuenta de que era portugués. Usó el poquito de portugués que sabía para hablar con ella y le preguntó si se reuniría con las hermanas misioneras, porque una de ellas sabía un poco más de portugués que nosotros y tal vez podría enseñarle.<\/p><p>No sé por qué, pero al salir de su casa sentí que había fallado, y estaba medio frustrado. Hablé mucho con el Élder Schauers y simplemente no tenía sentido. ¿Por qué nos mandaron ahí si no podíamos enseñarle? Ella de verdad quería aprender más.<\/p><p>Le dimos seguimiento con las hermanas misioneras y nos dijeron que le habían enseñado una pequeña lección, pero que fue difícil y no pudieron continuar. Yo todavía sentía que debía seguir aprendiendo más sobre esto y pensarlo, porque de verdad resonaba en mi alma.<\/p><p>Así que más tarde esa noche estaba orando. Me arrodillé pensando en todo esto y tuve la impresión de que tal vez era tiempo de que la misión se adaptara, y de que yo podía ser uno de los primeros y necesitaba aprender portugués. Y en particular, que se me había dado el don de lenguas y que era tiempo de usarlo de una manera más elevada.<\/p><p>No hice mucho el resto de la semana porque no tenía materiales para estudiar. Pero pude hablar con el Élder Schauers y conseguir más información sobre cosas que él había visto u oído, y sobre las diferencias en la cultura y el idioma. Ese fue un buen primer paso: simplemente tener curiosidad y seguir pensando en ello, porque la verdad nunca se me salió de la mente.<\/p><p>Después tuvimos que regresar a la oficina de la misión por más materiales y, estando ahí, pregunté si tenían algún material en portugués. Dijeron: \"Bueno, déjame ver\", y se pusieron a buscar. \"Ah, mira, esto lo acaban de dejar ayer\". Era un Predicad Mi Evangelio en portugués, y creo que también había un libro de gramática portuguesa y un Libro de Mormón en portugués. Con esos tres materiales, supe que tenía que ser el momento. Seguramente era la voluntad de Dios que yo aprendiera portugués.<\/p><p>Luego tuve que irme de Largo por un tiempo. Hubo más cambios y cambios grandes en la misión, y me fui a Brandon con otro compañero, el Élder Huntsman. Ahí, muchas veces usaba mi tiempo de estudio de idioma para estudiar solo portugués en vez de español. Era difícil y sentía que no estaba mejorando. Sabía algunas cosas, y el Élder Huntsman y los otros misioneros con los que hablaba ahí sabían pedacitos de portugués, pero era difícil saber si de verdad estaba aprendiendo el idioma sin interactuar con hablantes nativos. Pero no me podía rendir. Sentía que tenía que seguir, así que seguí estudiando todo lo que pude.<\/p><p>Después de Brandon, me asignaron a capacitar a un misionero en Tampa. Para entonces ya me defendía. Podía tener una conversación muy básica, y cuando tenía dudas simplemente usaba una palabra en español, porque se parecían lo suficiente como para que funcionara.<\/p><p>Mientras estaba capacitando en Tampa, terminamos teniendo un bautismo justo cuando nuestros presidentes de misión cambiaron de los Hollingsworth a los Gardiner. Los Gardiner llegaron y vinieron a nuestro bautismo. Tristemente no fueron muchos miembros, pero después del bautismo estaban platicando con nosotros y el presidente Gardiner notó que mi placa de misionero estaba en portugués, porque yo había pedido una unas semanas antes.<\/p><p>Le expliqué que había estado aprendiendo portugués y que sentía que era algo importante que yo aprendiera e hiciera. Él estaba un poco confundido, porque supuso que yo había estado esperando una visa para ir a servir y enseñar en Brasil. Mientras seguíamos hablando, pareció que el Espíritu como que lo tocó de golpe. Su cara cambió de repente y dijo: \"Tendremos que hablar más después\".<\/p><p>Así que seguí el resto de mi tiempo en Tampa con el Élder Dean en español, pero poco a poco iba encontrando cada vez más brasileños y hablantes nativos de portugués, y pude conectar con ellos. Hasta conocí a una pareja del barrio en inglés que era de Brasil, y me dieron buenos consejos y de verdad me apoyaron para aprender el idioma.<\/p><p>Terminé enseñando a una familia de dos por un tiempo. Gracias a eso, y a ir y venir hablando con el presidente Gardiner, pudimos poner las cosas en marcha y ver hasta dónde podía llegar y crecer esto para el futuro de la misión.<\/p><p>Al siguiente cambio me asignaron a capacitar a dos misioneros al mismo tiempo. Eso fue divertido, y para entonces hicimos todavía más en portugués. Después me asignaron otro misionero para capacitar. Esta vez estaba con el Élder Rogers. Su capacitación acababa de terminar, pero había sido muy accidentada: muchas capacitaciones incompletas y, en general, la calidad de vida. La misión es difícil, pero se supone que te diviertas. Así que, de cierta manera, estaba capacitando a él y al Élder Towne, que acababa de llegar. El Élder Towne originalmente había sido asignado a Campinas, Brasil, y estaba esperando su visa.<\/p><p>Un dato curioso: la Misión Brasil Campinas es la misma misión a la que fue llamada a servir mi esposa, Tayna. Esa conexión en común, de compañeros y de la misión, fue más o menos lo que nos hizo empezar a platicar después, cuando ya había regresado a casa.<\/p><p>El Élder Towne fue una gran bendición para mí, porque había llegado del CCM hablando portugués. Así como yo podía ayudarlo a aprender español y a ser un buen misionero, él podía ayudarme a aprender portugués y a conectar con la gente de una manera diferente, porque la cultura es un poco distinta a la del resto de Latinoamérica. Con su ayuda, de verdad despegamos enseñando lecciones en portugués, y el presidente Gardiner vio nuestros esfuerzos y se emocionó muchísimo.<\/p><p>Intentamos empezar un grupo o rama en portugués en Tampa, porque había bastantes miembros en la Estaca Tampa y también en la Estaca Odessa, pero nunca se concretó. Después me mandaron de regreso a Largo y, finalmente, a Fort Myers para la última parte de mi misión.<\/p><p>Fort Myers es donde de verdad pasó. Despegó. Empezamos un grupo. Ayudé a una pareja, João e Irene, a casarse. Fueron súper especiales para mí. Se bautizaron, y nos estábamos preparando para ayudar a sus hijos a llegar ahí también, y para ayudarlos a ir al templo a recibir su investidura. Desafortunadamente no pude ir al templo con ellos, porque hubo algunas complicaciones para llevarlos, y yo tuve que regresar a casa.<\/p><p>En mis últimos cambios en Fort Myers, mi compañero fue el Élder Kroeger. Él también estaba asignado a Campinas, Brasil, así que estar con él, ayudarlo con su portugués y hacer la obra misional juntos fue una gran ayuda para seguir mejorando mis habilidades. También estuvo padre ver que él y el Élder Towne pudieron conocerse en la misión de Campinas, y que ahí también conocieron a Tayna.<\/p><p>Pero al final, fue increíble ver la diferencia que hizo seguir al Espíritu: cómo bendijo mi vida en la misión y me permitió conectar con más personas, ayudar a más gente a escuchar el Evangelio y ayudar a que la misión creciera. Ahora la misión tiene una rama en portugués en Tampa y un grupo en portugués en Fort Myers que sigue creciendo, y están llamando misioneros de Brasil y de todas partes para hablar portugués y enseñar el Evangelio en ese idioma.<\/p><p>A lo largo de mi misión vi el don de lenguas en acción. Muchas veces tuve la oportunidad de ser el traductor en clases de la Escuela Dominical y otras reuniones de la Iglesia, traduciendo del inglés al español o del español al portugués. Cada vez, mi capacidad aumentaba y me mostraba cómo Dios estaba bendiciendo mis esfuerzos y multiplicándolos.<\/p><p>En los últimos meses de mi misión, mientras reflexionaba sobre mis metas y lo que quería hacer al llegar a casa, sentí la impresión de seguir aprendiendo portugués.<\/p><p>Así que fui a BYU, donde más adelante me graduaría con una especialidad en Sistemas de Información y una subespecialidad en portugués. Mientras seguía aprendiendo portugués, seguí las impresiones del Espíritu. Una de las impresiones que tuve en mi misión fue que parte de aprender portugués era para conocer a mi esposa.<\/p><p>Tayna y yo conectamos por primera vez en Mutual. Platicamos un poco, pero no le dimos mucho seguimiento. Como un año después volvimos a conectar, y empecé a salir con ella el 7 de febrero de 2025. Ese agosto, después de terminar mis prácticas en la Universidad de São Paulo, fui a visitarla y le propuse matrimonio. Y después nos casaríamos.<\/p><\/div><div class=\"quotes\"><div class=\"more-h\">De mis cartas<\/div><ul><li><span class=\"qd\">26 de junio de 2021<\/span>Definitivamente fue difícil al principio y todavía puede serlo, pero puedo testificar que el don de lenguas de verdad está ahí para aquellos que el Señor necesita.<\/li><li><span class=\"qd\">21 de marzo de 2022<\/span>No, no sé portugués, pero sé algunas frases random.<\/li><li><span class=\"qd\">11 de julio de 2022<\/span>También le compartí un mensaje corto y entendió mi portugués perfectamente.<\/li><li><span class=\"qd\">8 de agosto de 2022<\/span>He estado orando por familias y por maneras de practicar más portugués, y sigo recibiendo esa ayuda.<\/li><li><span class=\"qd\">16 de enero de 2023<\/span>El domingo fue una W enorme (W = dub = victoria) porque tuvimos nuestra primera clase de Escuela Dominical en portugués 🇧🇷 un avance sin duda, y nuestros amigos se sintieron muy agradecidos por esa adaptación y por poder aprender mucho más.<\/li><li><span class=\"qd\">10 de abril de 2023<\/span>Tuve la oportunidad de confirmar a João en la reunión sacramental (estaba súper nervioso de hacerlo en portugués, pero Dios definitivamente me ha estado preparando y aumentando mis habilidades).<\/li><li><span class=\"qd\">22 de mayo de 2023<\/span>Todavía me quedan unos días más, estoy emocionado de ir al templo con nuestros conversos recientes para hacer bautismos (en português), pero si quiero que recuerden algo, es que he amado mi misión, servir a los demás, aprender y trabajar duro.<\/li><\/ul><\/div>", "text": "Llamado al portugués Empezó durante mi primera vez en Largo. Mi compañero, el Élder Schauers, y yo habíamos recibido una referencia en línea para ir a visitar a una señora. Su nombre y todo se veía normal. Pero cuando llegamos a la casa y tocamos la puerta, ella abrió, y su español sonaba ra ndiera portugués. Luego tuve que irme de Largo por un tiempo. Hubo más cambios y cambios grandes en la misión, y me fui a Brandon con otro compañero, el Élder Huntsman. Ahí, muchas veces usaba mi tiempo de estudio de idioma para estudiar solo portugués en vez de español. Era difícil y sentía que no estaba mejorando. Sabía algunas cosas, y el Élder Huntsman y los otros misioneros con los que hablaba ahí sabían pedacitos de portugués, pero era difícil saber si de verdad estaba aprendiendo el idioma sin interactuar con hablantes nativos. Pero no me podía rendir. Sentía que tenía que seguir, así que seguí estudiando todo lo que pude. Después de Brandon, me asignaron a capacitar a un misionero en Tampa. Para entonces ya me defendía. Podía tener una conversación muy básica, y cuando tenía dudas simplemente usaba una palabra en español, porque se parecían lo suficiente como para que funcionara. Mientras estaba capacitando en Tampa, terminamos teniendo un bautismo justo cuando nuestros presidentes de misión cambiaron de los Hollingsworth a los Gardiner. Los Gardiner llegaron y vinieron a nuestro bautismo. Tristemente no fueron muchos miembros, pero después del bautismo estaban platicando con nosotros y el presidente Gardiner notó que mi placa de misionero estaba en portugués, porque yo había pedido una unas semanas antes. Le expliqué que había estado aprendiendo portugués y que sentía que era algo importante que yo aprendiera e hiciera. Él estaba un poco confundido, porque supuso que yo había estado esperando una visa para ir a servir y enseñar en Brasil. Mientras seguíamos hablando, pareció que el Espíritu como que lo tocó de golpe. Su cara cambió de repente y dijo: \"Tendremos que hablar más después\". Así que seguí el resto de mi tiempo en Tampa con el Élder Dean en español, pero poco a poco iba encontrando cada vez más brasileños y hablantes nativos de portugués, y pude conectar con ellos. Hasta conocí a una pareja del barrio en inglés que era de Brasil, y me dieron buenos consejos y de verdad me apoyaron para aprender el idioma. Terminé enseñando a una familia de dos por un tiempo. Gracias a eso, y a ir y venir hablando con el presidente Gardiner, pudimos poner las cosas en marcha y ver hasta dónde podía llegar y crecer esto para el futuro de la misión. Al siguiente cambio me asignaron a capacitar a dos misioneros al mismo tiempo. Eso fue divertido, y para entonces hicimos todavía más en portugués. Después me asignaron otro misionero para capacitar. Esta vez estaba con el Élder Rogers. Su capacitación acababa de terminar, pero había sido muy accidentada: muchas capacitaciones incompletas y, en general, la calidad de vida. La misión es difícil, pero se supone que te diviertas. Así que, de cierta manera, estaba capacitando a él y al Élder Towne, que acababa de llegar. El Élder Towne originalmente había sido asignado a Campinas, Brasil, y estaba esperando su visa. Un dato curioso: la Misión Brasil Campinas es la misma misión a la que fue llamada a servir mi esposa, Tayna. Esa conexión en común, de compañeros y de la misión, fue más o menos lo que nos hizo empezar a platicar después, cuando ya había regresado a casa. El Élder Towne fue una gran bendición para mí, porque había llegado del CCM hablando portugués. Así como yo podía ayudarlo a aprender español y a ser un buen misionero, él podía ayudarme a aprender portugués y a conectar con la gente de una manera diferente, porque la cultura es un poco distinta a la del resto de Latinoamérica. Con su ayuda, de verdad despegamos enseñando lecciones en portugués, y el presidente Gardiner vio nuestros esfuerzos y se emocionó muchísimo. Intentamos empezar un grupo o rama en portugués en Tampa, porque había bastantes miembros en la Estaca Tampa y también en la Estaca Odessa, pero nunca se concretó. Después me mandaron de regreso a Largo y, finalmente, a Fort Myers para la última parte de mi misión. Fort Myers es donde de verdad pasó. Despegó. Empezamos un grupo. Ayudé a una pareja, João e Irene, a casarse. Fueron súper especiales para mí. Se bautizaron, y nos estábamos preparando para ayudar a sus hijos a llegar ahí también, y para ayudarlos a ir al templo a recibir su investidura. Desafortunadamente no pude ir al templo con ellos, porque hubo algunas complicaciones para llevarlos, y yo tuve que regresar a casa. En mis últimos cambios en Fort Myers, mi compañero fue el Élder Kroeger. Él también estaba asignado a Campinas, Brasil, así que estar con él, ayudarlo con su portugués y hacer la obra misional juntos fue una gran ayuda para seguir mejorando mis habilidades. También estuvo padre ver que él y el Élder Towne pudieron conocerse en la misión de Campinas, y que ahí también conocieron a Tayna. Pero al final, fue increíble ver la diferencia que hizo seguir al Espíritu: cómo bendijo mi vida en la misión y me permitió conectar con más personas, ayudar a más gente a escuchar el Evangelio y ayudar a que la misión creciera. Ahora la misión tiene una rama en portugués en Tampa y un grupo en portugués en Fort Myers que sigue creciendo, y están llamando misioneros de Brasil y de todas partes para hablar portugués y enseñar el Evangelio en ese idioma. A lo largo de mi misión vi el don de lenguas en acción. Muchas veces tuve la oportunidad de ser el traductor en clases de la Escuela Dominical y otras reuniones de la Iglesia, traduciendo del inglés al español o del español al portugués. Cada vez, mi capacidad aumentaba y me mostraba cómo Dios estaba bendiciendo mis esfuerzos y multiplicándolos. En los últimos meses de mi misión, mientras reflexionaba sobre mis metas y lo que quería hacer al llegar a casa, sentí la impresión de seguir aprendiendo portugués. Así que fui a BYU, donde más adelante me graduaría con una especialidad en Sistemas de Información y una subespecialidad en portugués. Mientras seguía aprendiendo portugués, seguí las impresiones del Espíritu. Una de las impresiones que tuve en mi misión fue que parte de aprender portugués era para conocer a mi esposa. Tayna y yo conectamos por primera vez en Mutual. Platicamos un poco, pero no le dimos mucho seguimiento. Como un año después volvimos a conectar, y empecé a salir con ella el 7 de febrero de 2025. Ese agosto, después de terminar mis prácticas en la Universidad de São Paulo, fui a visitarla y le propuse matrimonio. Y después nos casaríamos. De mis cartas 26 de junio de 2021 Definitivamente fue difícil al principio y todavía puede serlo, pero puedo testificar que el don de lenguas de verdad está ahí para aquellos que el Señor necesita. 21 de marzo de 2022 No, no sé portugués, pero sé algunas frases random. 11 de julio de 2022 También le compartí un mensaje corto y entendió mi portugués perfectamente. 8 de agosto de 2022 He estado orando por familias y por maneras de practicar más portugués, y sigo recibiendo esa ayuda. 16 de enero de 2023 El domingo fue una W enorme (W = dub = victoria) porque tuvimos nuestra primera clase de Escuela Dominical en portugués 🇧🇷 un avance sin duda, y nuestros amigos se sintieron muy agradecidos por esa adaptación y por poder aprender mucho más. 10 de abril de 2023 Tuve la oportunidad de confirmar a João en la reunión sacramental (estaba súper nervioso de hacerlo en portugués, pero Dios definitivamente me ha estado preparando y aumentando mis habilidades). 22 de mayo de 2023 Todavía me quedan unos días más, estoy emocionado de ir al templo con nuestros conversos recientes para hacer bautismos (en português), pero si quiero que recuerden algo, es que he amado mi misión, servir a los demás, aprender y trabajar duro."}, {"id": "l40", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["MX", "BR"], "moments": [], "extra": "Mexico Brazil", "kind": "Carta 40 · Largo", "title": "🛹 grind de buscar pero igual bastante increíble 🐑", "date": "2022-03-21T10:53:00", "group": "2022-03", "html": "<div class=\"body\"><p>Bom día! No, no sé portugués, pero sé algunas frases random. Tal vez en el futuro.<\/p>\n<p>Esta semana estuvo bastante bien en general, pero definitivamente fue difícil. Empezamos la semana bastante bien, pero luego tuvimos que dejar de enseñar a la mayoría de nuestros amigos...<\/p>\n<p>Los amigos que sí se quedaron van súper bien; sigue siendo una batalla para que hagan los cambios necesarios para seguir el Evangelio, pero le están echando ganas.<\/p>\n<p>Hemos aprendido mucho sobre cómo y cuándo buscar para ser lo más efectivos posible.<\/p>\n<p>Esta semana nos divertimos haciendo unos videos para la página de Facebook de la clase de inglés gratis que tiene la misión, junto con todas las demás payasadas.<\/p>\n<p>Payasadas como que empecé a aprender a usar un tech deck y también una patineta de verdad, pero es un proceso. Nuestro amigo Juan Carlos fue a la iglesia en inglés porque le quedaba más cerca y, sin hablar mucho inglés, eso sí es hablar de fe y obras. Lo vamos a ver la próxima semana en nuestra rama, ya que por fin le encontramos quién lo lleve.<\/p>\n<p>Otras cosas divertidas que pasaron: un contacto en la calle nos llevó a una carne asada (barbacoa mexicana) súper buena; noche de juegos del quórum de élderes (resulta que el dominó es un juego muy popular entre los latinos. Y eran unos salvajes jugándolo); el Élder Schauers está aprendiendo un montón de español para llevar solo 6 semanas como misionero de habla hispana (mi hijo de 30 años que apenas está aprendiendo a hablar, como nos gusta bromear, porque antes servía en inglés); y un miembro nos regaló una fruta deliciosa (bolitas naranjas, no me acuerdo cómo les dijo).<\/p>\n<p>Buena suerte amigos, los amo y oro cada día por ustedes,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Comida en Walmart<\/li>\n<li>Hora de arepas<\/li>\n<li>detrás de cámaras de nuestros videos de la clase de inglés<\/li>\n<li>lluvia<\/li>\n<li>truco de tech deck jejee<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-03-21_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-21_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-21_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-21_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-21_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_209.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_210.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_211.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_212.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_213.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_214.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_215.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🛹 grind de buscar pero igual bastante increíble 🐑 Bom día! No, no sé portugués, pero sé algunas frases random. Tal vez en el futuro. Esta semana estuvo bastante bien en general, pero definitivamente fue difícil. Empezamos la semana bastante bien, pero luego tuvimos que dejar de enseñar a la mayoría de nuestros amigos... Los amigos que sí se quedaron van súper bien; sigue siendo una batalla para que hagan los cambios necesarios para seguir el Evangelio, pero le están echando ganas. Hemos aprendido mucho sobre cómo y cuándo buscar para ser lo más efectivos posible. Esta semana nos divertimos haciendo unos videos para la página de Facebook de la clase de inglés gratis que tiene la misión, junto con todas las demás payasadas. Payasadas como que empecé a aprender a usar un tech deck y también una patineta de verdad, pero es un proceso. Nuestro amigo Juan Carlos fue a la iglesia en inglés porque le quedaba más cerca y, sin hablar mucho inglés, eso sí es hablar de fe y obras. Lo vamos a ver la próxima semana en nuestra rama, ya que por fin le encontramos quién lo lleve. Otras cosas divertidas que pasaron: un contacto en la calle nos llevó a una carne asada (barbacoa mexicana) súper buena; noche de juegos del quórum de élderes (resulta que el dominó es un juego muy popular entre los latinos. Y eran unos salvajes jugándolo); el Élder Schauers está aprendiendo un montón de español para llevar solo 6 semanas como misionero de habla hispana (mi hijo de 30 años que apenas está aprendiendo a hablar, como nos gusta bromear, porque antes servía en inglés); y un miembro nos regaló una fruta deliciosa (bolitas naranjas, no me acuerdo cómo les dijo). Buena suerte amigos, los amo y oro cada día por ustedes, Elder Jacobs Fotos: Comida en Walmart Hora de arepas detrás de cámaras de nuestros videos de la clase de inglés lluvia truco de tech deck jejee Más de esta semana"}, {"id": "l41", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HN\">🇭🇳 Honduras<\/span><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": ["HN"], "moments": ["Baptism"], "extra": "Honduras", "kind": "Carta 41 · Largo", "title": "🎪Bienvenidos a payaso-ville🤡", "date": "2022-03-28T07:15:00", "group": "2022-03", "html": "<div class=\"body\"><p>Población: nosotros<\/p>\n<p>Buenas buenas buenas! Queridos amigos ¿que lo que?<\/p>\n<p>Contexto: mi compañero y yo nos declaramos payasos por todas las tonterías que hacemos<\/p>\n<p>¡Nuestra semana estuvo increíble y de verdad se notó que nuestros esfuerzos están dando fruto, porque pasaron muchas cosas!<\/p>\n<p>Noche de hogar con el presidente de rama y cantamos \"Old McDonald\"; esa canción es muuucho más larga de lo que recordaba. Pero todo bien, tuvimos una actividad y una lección divertidas, ojalá los niños nos hayan entendido y no se hayan distraído mucho. ¡Encontramos a una familia esta semana y más tarde en la semana les pusimos fecha para su bautismo! Son catrachos (de Honduras 🇭🇳) y súper abiertos a escuchar sobre el Evangelio. Estamos emocionados de verlos progresar más.<\/p>\n<p>A nuestro amigo Juan le va muchísimo mejor esta semana. Ha estado batallando mucho con problemas de salud y necesitaba ver a un doctor, pero la cita más pronto disponible era en mayo y le costaba conseguirla porque su inglés no es perfecto. Así que cuando fuimos a enseñarle, también intentamos llamar por él y preguntar si había cancelaciones, ¡y sí había! Para dentro de una semana a partir de hoy, que es cuando mando este correo. Estaba muy agradecido y definitivamente fue un milagro para todos nosotros. En la lección, además, terminó enseñándonos él la Restauración porque se acordaba y se dio cuenta de lo importante que es, y se está emocionando por la Conferencia General. También tuvimos una lección 🔥 con Endrina, Zaher y Carlos (el esposo de Solmar; ella tristemente no estaba). Teníamos a 2 miembros con nosotros y básicamente enseñamos sobre las familias eternas, dejamos que los miembros los bombardearan con su testimonio y luego nos fuimos, dejándolos con ganas de más. Endrina terminó viniendo a la iglesia también con su hijo de 2 años, Lucas; ¡es tremendo pero tan lindo! La iglesia estuvo increíble esta semana por muchas cosas: Juan Carlos fue otra vez al barrio en inglés porque no consigue quién lo lleve a Largo, pero sabe que la iglesia es importante; Rafael se bautizó (amigo de las hermanas, pero también nuestro, ¡nos quiere mucho!); nuestro amigo Washington vino al bautismo, a la iglesia, y tuvimos una lección después de la iglesia (durante el bautismo nos preguntó si se podía bautizar en su cumpleaños, el 22 de abril, ¡estamos súper emocionados!); y otros amigos vinieron a la iglesia, buen día. De Washington es de quien de verdad quiero hablar hoy. Se reunió con los misioneros hace 40 años y se iba a bautizar, pero luego se ocupó y se mudó. Ya tiene muchísima fe y quiere bautizarse porque no puede volver a perder la oportunidad. No pierdan sus oportunidades, porque Dios de verdad está tratando de ayudarnos y bendecirnos, pero muchas veces nos distraemos con cosas menores o tentaciones, así que sigan el ejemplo de Washington y el consejo de esta escritura.<\/p>\n<p>1 Nefi 10:19<\/p>\n<p>Noticias de cambios: yo me quedo, pero el Élder Schauers, muy tristemente, se va a Rio Vista en Fort Myers. Mucho amor,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>El amigo Washington en la iglesia<\/li>\n<li>Una calcomanía chistosa que vimos<\/li>\n<li>Caballote<\/li>\n<li>Mega pizza<\/li>\n<li>hora del jugo<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-03-28_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-28_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-28_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-28_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-28_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_216.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_217.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_218.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\">< /span><\/div>", "cultures": ["PR"], "moments": ["Temple"], "extra": "Puerto Rico", "kind": "Carta 42 · Largo", "title": "Ok, nada más voy 🧍‍♂️🔫🧍‍♂️ acabando con compañeros", "date": "2022-04-04T12:34:00", "group": "2022-04", "html": "<div class=\"body\"><p>Como etan Utede? (Así dicen los puertorriqueños \"como están ustedes\", porque se comen mucho la s)<\/p>\n<p>Todo ha estado increíble, sobre todo desde que anunciaron un templo en mi misión 🙌 😎 🙏  ❤ 👌<\/p>\n<p>Los cambios fueron el martes y me tocó el Élder Argyle y ha sido increíble. Esta semana hemos estado enseñando a un montón de nuestros amigos, pero sobre todo le estuvimos dando con todo para que más gente venga a nuestra clase de inglés, ¡y valió la pena! Por lo demás, nuestros amigos van súper bien, han estado sintiendo el Espíritu y progresando en el Evangelio muy bien, ¡sobre todo los que vinieron a la conferencia y la vieron con nosotros! Aunque verla en español es muy difícil, porque después de unas horas ya nada más quería relajarme y escucharla en inglés. Ni modo, buena práctica.<\/p>\n<p>Un tema común fue la obra misional. Me encanta ser misionero y ayudar a los demás es lo máximo. De verdad les diría que sirvan una misión si no están seguros o están pensando en no hacerlo por ahora, porque yo nunca cambiaría este tiempo que he tenido. Y los que son mayores o no pueden, busquen maneras de servir a los demás y simplemente compartan lo que saben.<\/p>\n<p>En cuanto al título de este correo: me va a llegar un nuevo élder que viene de Chile y a mi compañero lo van a sacar con un cambio de emergencia. Ya acabé con otro. Debo ser bueno en esto o algo así: 4 semanas con el Élder Gundersen, 3 con el Élder Schauers y 1 con el Élder Argyle.<\/p>\n<p>En fin, los amo chamacos y espero que tengan una buena semana<\/p>\n<p>Mucho amor y abrazos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos<\/p>\n<ul class=\"bul\">\n<li>nosotros, los payasos<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-04-04_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-04_0_1.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_225.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Ok, nada más voy 🧍‍♂️🔫🧍‍♂️ acabando con compañeros Como etan Utede? (Así dicen los puertorriqueños \"como están ustedes\", porque se comen mucho la s) Todo ha estado increíble, sobre todo desde que anunciaron un templo en mi misión 🙌 😎 🙏 ❤ 👌 Los cambios fueron el martes y me tocó el Élder Argyle y ha sido increíble. Esta semana hemos estado enseñando a un montón de nuestros amigos, pero sobre todo le estuvimos dando con todo para que más gente venga a nuestra clase de inglés, ¡y valió la pena! Por lo demás, nuestros amigos van súper bien, han estado sintiendo el Espíritu y progresando en el Evangelio muy bien, ¡sobre todo los que vinieron a la conferencia y la vieron con nosotros! Aunque verla en español es muy difícil, porque después de unas horas ya nada más quería relajarme y escucharla en inglés. Ni modo, buena práctica. Un tema común fue la obra misional. Me encanta ser misionero y ayudar a los demás es lo máximo. De verdad les diría que sirvan una misión si no están seguros o están pensando en no hacerlo por ahora, porque yo nunca cambiaría este tiempo que he tenido. Y los que son mayores o no pueden, busquen maneras de servir a los demás y simplemente compartan lo que saben. En cuanto al título de este correo: me va a llegar un nuevo élder que viene de Chile y a mi compañero lo van a sacar con un cambio de emergencia. Ya acabé con otro. Debo ser bueno en esto o algo así: 4 semanas con el Élder Gundersen, 3 con el Élder Schauers y 1 con el Élder Argyle. En fin, los amo chamacos y espero que tengan una buena semana Mucho amor y abrazos! Elder Jacobs Fotos nosotros, los payasos Más de esta semana"}, {"id": "l43", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">ABR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Bautismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 43 · Largo", "title": "👨‍💻👩‍💻JAS por un día 🤡", "date": "2022-04-11T08:57:00", "group": "2022-04", "html": "<div class=\"body\"><p>...Sí, eso estuvo raro, no me gustó, devuélvanme a mis amigos hispanos...<\/p>\n<p>Ola! Boa noite!<\/p>\n<p>Sí, estuve en JAS un poco más de un día y eso fue... interesante. No estuvo mal, solo muy diferente. ¡Pero ya me llegó mi nuevo compañero!<\/p>\n<p>El Élder Carson, de Payson, Utah. Es de una granja enorme (la grande de visones, para el abuelo y la abuela Jacobs. Sí, ya sé que iban a preguntar). Estuvo en Chile sus 12 semanas de capacitación que pasa todo misionero, pero ahora está aquí por razones médicas. Llegó el miércoles en la mañana después de volar toda la noche. Ha sido súper divertido capacitarlo y ayudarlo a acostumbrarse a la nueva misión.<\/p>\n<p>Con eso, no ha cambiado mucho desde la semana pasada en cuanto a amigos, por falta de tiempo en nuestra área. Sí encontramos una noche a Carlos y a Leonardo, y son buenísima onda. Estaban afuera relajándose cuando llegamos a preguntarles si podíamos compartir un mensaje; luego hablamos del Libro de Mormón, compartimos una escritura, hablamos de perseverar hasta el fin y aclaramos las expectativas de lo que hacemos. ¡¿Y luego los dos dijeron que querían bautizarse?!? Estamos súper emocionados por ellos esta semana.<\/p>\n<p>Esta semana también tuvimos la oportunidad de ir a la capacitación especializada. Una mini conferencia de zona/reunión de capacitación para misioneros recién llegados y sus capacitadores. Siempre divertida y útil. Se siente diferente del otro lado, porque la última vez que pude ir yo era el capacitado. (Les mando la foto en cuanto la tenga, o está en la página de Facebook de nuestra misión)<\/p>\n<p>El domingo fue la conferencia de estaca y estuvo divertida. Vinieron Washington y Juan Carlos y la pasaron bien. También están bastante emocionados por sus bautismos que vienen, el 22 &amp; 23 respectivamente.<\/p>\n<p>Dios los ama, pórtense bien, cuéntenme cómo les va de vez en cuando para saber que no están muertos<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>el distrito (versión de la semana pasada)<\/li>\n<li>Los élderes de JAS y yo en el aeropuerto<\/li>\n<li>🦩<\/li>\n<li>¡El primer día del Élder Carson!<\/li>\n<li>Noche de empanadas + tacos<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-04-11_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-11_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_6.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-11_0_7.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Más de esta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_226.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_227.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_228.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_229.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\
