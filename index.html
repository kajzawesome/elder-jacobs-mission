. She's so awesome and is already trying to get her recommend to go to the temple but she got some hard news. She has some pretty severe damage to her retina and the diagnosis said she could could blind fairly soon. She's looking to go to a specialist to get some more council and what to do but it's really hard for her. We gave her a blessing yesterday and she has really good friends in the ward but your prayers for her would mean the world to me. This week's thought is Romans 5:8 now interpret it as you will (one guy this week did that very liberally) but I really love this scripture. I know that God lives and loves us despite our mistakes. Trust in him! Romans 5:8 But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us. Los amo muchísimo! Elder Jacobs Pictures: us in our jerseys one sticker I got some random stuff we saw at the flea market Mexico Brazil"}, {"id": "l96", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">APR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CU\">🇨🇺 Cuba<\/span><span class=\"stamp c\" data-c=\"NI\">🇳🇮 Nicaragua<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["CU", "NI", "BR", "HT"], "moments": ["Baptism"], "extra": "Cuba Nicaragua Brazil Haiti", "kind": "Letter 96 · Fort Myers", "title": "🐂 boi 😎", "date": "2023-04-24T05:44:00", "group": "2023-04", "html": "<div class=\"body\"><p>Oi galera, bom dia!<\/p>\n<p>I hope you had a marvelous week and are doing well.<\/p>\n<p>We are doing great here and had a fairly successful week. The big L we took was no friends coming to church after inviting a lot of people. Everything else was good.<\/p>\n<p>Monday we started off with some finding and found 2 more Brazilian families. Along with some Spanish and a few Haitians to send off as referrals.<\/p>\n<p>Tuesday also was more finding since our lessons canceled but on the bright side we taught Evandro. He&#x27;s also from Brazil and came to English class but is very interested in growing his spiritual life and coming closer to God. He was excited for his own Book of Mormon and to come to church but he left out of town so hopefully this week. We also made another stop into the BrazMarket and I got a Chifre de Boi 🐂 or Ox Horn. It&#x27;s used for a tradicional drink from Brazil: Tererê<\/p>\n<p>We had a lesson with Marliet, she&#x27;s looking for a church and stuff but another church started visiting her. We&#x27;re hoping she&#x27;ll want to meet again and we can go by in person to give her a Book of Mormon. She&#x27;s from Cuba and has faith like no other.<\/p>\n<p>We also visited Jose this week. He&#x27;s a returning member and is doing great. He actually joined in for João&#x27;s ordination of the Aaronic priesthood. In our visit we had the chance to talk to his roommates and realize how much we still don&#x27;t know. They are from 3 different states in Brazil and each say things differently and have their own words. It was a fun challenge. Friday I went to Lehigh on exchange with the Zone leaders. It was fun with Elder Sellers but with our entire day having lessons planned then none of them happening it was tough to say the least.<\/p>\n<p>We met a new guy and his son, they&#x27;re from Nicaragua. We had a cool first lesson and then realized why he was asking so many questions. Besides a true desire to learn he wants to be baptized. We&#x27;re talking more about it this coming visit. E aí gente, that&#x27;s basically it.<\/p>\n<p>I&#x27;d love to hear about you and your lives. Even though I do come home somewhat soon (May 27) I would love to talk now. Today&#x27;s thought comes from General conference:<\/p>\n<p>President Russell M. Nelson has declared: “The Good Shepherd lovingly cares for all sheep of His fold, and we are His true undershepherds. Our privilege is to bear His love and to add our own love to friends and neighbors﻿—feeding, tending, and nurturing them﻿—as the Savior would have us do.”<\/p>\n<ul class=\"bul\">\n<li>Elder Uceda, &quot;The lord Jesus Christ teaches us to minister&quot;<\/li>\n<\/ul>\n<p>If we love our friends, we are willing to do almost anything for them. We leave our personal affairs to go and be &quot;saviors&quot; to them and their afflictions. Don&#x27;t forget our friends and their needs nor Christ&#x27;s example to us. Ministering can happen in person or digitally, frequently or rarely, and in short visits or long ones. But in whatever way we do it and follow the spirit, its very important.<\/p>\n<p class=\"sign\">Los amo muchísimo!<\/p>\n<p>Elder Jacobo<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Us with Mozart (he likes to play the piano!)<\/li>\n<li>Chifre de Boi 🐂 Ox horn cup<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-04-24_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-24_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-24_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-24_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "🐂 boi 😎 Oi galera, bom dia! I hope you had a marvelous week and are doing well. We are doing great here and had a fairly successful week. The big L we took was no friends coming to church after inviting a lot of people. Everything else was good. Monday we started off with some finding and found 2 more Brazilian families. Along with some Spanish and a few Haitians to send off as referrals. Tuesday also was more finding since our lessons canceled but on the bright side we taught Evandro. He's also from Brazil and came to English class but is very interested in growing his spiritual life and coming closer to God. He was excited for his own Book of Mormon and to come to church but he left out of town so hopefully this week. We also made another stop into the BrazMarket and I got a Chifre de Boi 🐂 or Ox Horn. It's used for a tradicional drink from Brazil: Tererê We had a lesson with Marliet, she's looking for a church and stuff but another church started visiting her. We're hoping she'll want to meet again and we can go by in person to give her a Book of Mormon. She's from Cuba and has faith like no other. We also visited Jose this week. He's a returning member and is doing great. He actually joined in for João's ordination of the Aaronic priesthood. In our visit we had the chance to talk to his roommates and realize how much we still don't know. They are from 3 different states in Brazil and each say things differently and have their own words. It was a fun challenge. Friday I went to Lehigh on exchange with the Zone leaders. It was fun with Elder Sellers but with our entire day having lessons planned then none of them happening it was tough to say the least. We met a new guy and his son, they're from Nicaragua. We had a cool first lesson and then realized why he was asking so many questions. Besides a true desire to learn he wants to be baptized. We're talking more about it this coming visit. E aí gente, that's basically it. I'd love to hear about you and your lives. Even though I do come home somewhat soon (May 27) I would love to talk now. Today's thought comes from General conference: President Russell M. Nelson has declared: “The Good Shepherd lovingly cares for all sheep of His fold, and we are His true undershepherds. Our privilege is to bear His love and to add our own love to friends and neighbors﻿—feeding, tending, and nurturing them﻿—as the Savior would have us do.” Elder Uceda, \"The lord Jesus Christ teaches us to minister\" If we love our friends, we are willing to do almost anything for them. We leave our personal affairs to go and be \"saviors\" to them and their afflictions. Don't forget our friends and their needs nor Christ's example to us. Ministering can happen in person or digitally, frequently or rarely, and in short visits or long ones. But in whatever way we do it and follow the spirit, its very important. Los amo muchísimo! Elder Jacobo Pictures: Us with Mozart (he likes to play the piano!) Chifre de Boi 🐂 Ox horn cup Cuba Nicaragua Brazil Haiti"}, {"id": "l97", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAY 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["HT"], "moments": ["Baptism"], "extra": "Haiti", "kind": "Letter 97 · Fort Myers", "title": "MPL grind 🐂", "date": "2023-05-01T11:03:00", "group": "2023-05", "html": "<div class=\"body\"><p>Alo galera!<\/p>\n<p>Foi uma semana maravilhosa!<\/p>\n<p>We did a MPL (member participating lesson) challenge and luckily we did not lose so we got to make the bad food losers reward not eat it.<\/p>\n<p>(Tuna burgers + other terrible spices and things)<\/p>\n<p>We had many awesome lessons with our friends this week, partially due to members coming with us and the spirit being so strong. One lesson we were struggling to help a friend understand the importance of baptism and the gift of the holy ghost but then I was struck with a memory and an idea.<\/p>\n<p>I remember how special my baptism was, the special gifts received, and some of the things taught. One was about a blanket/towel and the spirit.<\/p>\n<p>I was able to then help our friend Jesus (10yrs) have a similar talk then experience of wrapping him with the spirit aka the blanket. It was awesome.<\/p>\n<p>Don&#x27;t bench the spirit!<\/p>\n<p>We also had some great member visits allowing us to better connect with them to the point they want us over even more jaja. Don&#x27;t have enough time for that and all our other missionary duties but that&#x27;s a great change. We did an exchange with the Creole Elders. I was with Elder Randolph trying to speak creole. I was able to do somethings but it&#x27;s so hard to listen and understand enough which is why he really impressed me because he&#x27;s only been out 7 months. Great time together.<\/p>\n<p>We sadly did not set any baptismal dates this week but should this next week. We know it&#x27;s in their future here soon but felt inspired to wait. So you get to wait til next week as well!<\/p>\n<p>That was more or less our week. We&#x27;ve been doing some more phone call lessons to talk with more people so hopefully we can grow our teaching pool aka number of friends/people being taught.<\/p>\n<p>I&#x27;ve been relistening to conference and this week I loved hearing Elder Meurs talk about how Christ heals us. We are never to far from the atonement and his love. Go read!<\/p>\n<p>We found out Friday night that Elder Anderson is coming this Friday and we will have a mission wide meeting with him! I&#x27;m super excited!<\/p>\n<p class=\"sign\">Los amo! Vejo-te mais tarde!<\/p>\n<p>Elder Jacobo<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>cursed burgers<\/li>\n<li>puppy<\/li>\n<li>limo<\/li>\n<li>my shake was super thick like ice cream 🍨<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-05-01_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-01_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-01_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-01_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-01_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "MPL grind 🐂 Alo galera! Foi uma semana maravilhosa! We did a MPL (member participating lesson) challenge and luckily we did not lose so we got to make the bad food losers reward not eat it. (Tuna burgers + other terrible spices and things) We had many awesome lessons with our friends this week, partially due to members coming with us and the spirit being so strong. One lesson we were struggling to help a friend understand the importance of baptism and the gift of the holy ghost but then I was struck with a memory and an idea. I remember how special my baptism was, the special gifts received, and some of the things taught. One was about a blanket/towel and the spirit. I was able to then help our friend Jesus (10yrs) have a similar talk then experience of wrapping him with the spirit aka the blanket. It was awesome. Don't bench the spirit! We also had some great member visits allowing us to better connect with them to the point they want us over even more jaja. Don't have enough time for that and all our other missionary duties but that's a great change. We did an exchange with the Creole Elders. I was with Elder Randolph trying to speak creole. I was able to do somethings but it's so hard to listen and understand enough which is why he really impressed me because he's only been out 7 months. Great time together. We sadly did not set any baptismal dates this week but should this next week. We know it's in their future here soon but felt inspired to wait. So you get to wait til next week as well! That was more or less our week. We've been doing some more phone call lessons to talk with more people so hopefully we can grow our teaching pool aka number of friends/people being taught. I've been relistening to conference and this week I loved hearing Elder Meurs talk about how Christ heals us. We are never to far from the atonement and his love. Go read! We found out Friday night that Elder Anderson is coming this Friday and we will have a mission wide meeting with him! I'm super excited! Los amo! Vejo-te mais tarde! Elder Jacobo Pictures: cursed burgers puppy limo my shake was super thick like ice cream 🍨 Haiti"}, {"id": "l98", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAY 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"NI\">🇳🇮 Nicaragua<\/span><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><\/div>", "cultures": ["MX", "NI", "PE"], "moments": [], "extra": "Mexico Nicaragua Peru", "kind": "Letter 98 · Fort Myers", "title": "Hearing from an Apostle of the Lord", "date": "2023-05-08T06:41:00", "group": "2023-05", "html": "<div class=\"body\"><p>Oi galerinha!<\/p>\n<p>Oye familia!<\/p>\n<p>Hope you&#x27;ve had a good week, lots of stuff accomplished or just the usual week of work done.<\/p>\n<p>Our week was pretty good, it was definitely slower because of big chunks of time inside or doing other things. We have a ton of potential friends aka yellow dots aka people that we might teach if they really want to and have time. Hence lots of time inside calling and texting these people.<\/p>\n<p>I also had some doctor appointments and then on Friday we went to Tampa to hear Elder Anderson speak to our mission. That was super awesome but it did mean we did nothing in our area because of 3 hours of driving up then again down. We had a fire church tour with our new friend Paulo. He&#x27;s from Peru and is feeling pretty sad because he has 2 kids and it just was his daughter&#x27;s 3rd birthday. Pray for him.<\/p>\n<p>Had another awesome lesson with Debora &amp; Darwin. They have been making a lot of progress with reading and Darwin has been remembering commandments and implementing them immediately. We also had Brother Mata join, it was fire. Quite a few phone call lessons hopefully we can meet in person.<\/p>\n<p>Shaify is from Nicaragua and wants to come to church. Just trying to figure that out since he lives in Lehigh (our church is in Fort Myers).<\/p>\n<p>Also taught Elias &amp; Nascer again on Saturday. They&#x27;re doing good but we&#x27;re trying to get them to focus on the basic doctrine since sometimes the questions asked are very deep and off topic from our lesson.<\/p>\n<p>Our recent convert Alejandro made us dinner one night and it was so nice to eat and talk with him. We had a fun time talking about video games, music, and funny stories.<\/p>\n<p>Last thing before talking more about Elder Anderson and my spiritual thought.<\/p>\n<p>Blessings<\/p>\n<p>We&#x27;ve had the opportunity these past 2 weeks to do many blessings of health. One yesterday, one Thursday, one 2 weeks ago on Monday. With more possibilities this week.<\/p>\n<p>I&#x27;m so grateful for the opportunity to serve in this capacity, see people change and feel the spirit, but also to have this power available. Don&#x27;t forget it is.<\/p>\n<p>This Thursday we went to some non-members whose family (members in Mexico) called us and told us to go. It was so special to see them have a bigger glimmer of hope then afterwards to feel the spirit testify of that power. I also felt impressed to give the wife one of comfort. What a beautiful experience.<\/p>\n<p>Elder Anderson talked about a few things, so did his wife and some stake presidents that were there; but the biggest take away I had and that you can implement too is scripture power.<\/p>\n<p>They talked a lot about the power in the scriptures and not only reading them but knowing them. Having verse written on hearts, some only by where they are and general idea and others by memory. That way in the tempest of life we don&#x27;t need to scramble for a scripture, we already know it, it&#x27;s part of our being, and we&#x27;ve already been founded upon our rock, Jesus Christ.<\/p>\n<p>Go find a favorite scripture and start memorizing where it is and if you can the words.<\/p>\n<p class=\"sign\">Los amo mucho! Que tenham uma super boa semana!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>empanadas<\/li>\n<li>tampa road trip/pit stop<\/li>\n<li>badly done license plate<\/li>\n<li>finally got to see the Nelsons from my home ward while in Tampa<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-05-08_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-08_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "Hearing from an Apostle of the Lord Oi galerinha! Oye familia! Hope you've had a good week, lots of stuff accomplished or just the usual week of work done. Our week was pretty good, it was definitely slower because of big chunks of time inside or doing other things. We have a ton of potential friends aka yellow dots aka people that we might teach if they really want to and have time. Hence lots of time inside calling and texting these people. I also had some doctor appointments and then on Friday we went to Tampa to hear Elder Anderson speak to our mission. That was super awesome but it did mean we did nothing in our area because of 3 hours of driving up then again down. We had a fire church tour with our new friend Paulo. He's from Peru and is feeling pretty sad because he has 2 kids and it just was his daughter's 3rd birthday. Pray for him. Had another awesome lesson with Debora & Darwin. They have been making a lot of progress with reading and Darwin has been remembering commandments and implementing them immediately. We also had Brother Mata join, it was fire. Quite a few phone call lessons hopefully we can meet in person. Shaify is from Nicaragua and wants to come to church. Just trying to figure that out since he lives in Lehigh (our church is in Fort Myers). Also taught Elias & Nascer again on Saturday. They're doing good but we're trying to get them to focus on the basic doctrine since sometimes the questions asked are very deep and off topic from our lesson. Our recent convert Alejandro made us dinner one night and it was so nice to eat and talk with him. We had a fun time talking about video games, music, and funny stories. Last thing before talking more about Elder Anderson and my spiritual thought. Blessings We've had the opportunity these past 2 weeks to do many blessings of health. One yesterday, one Thursday, one 2 weeks ago on Monday. With more possibilities this week. I'm so grateful for the opportunity to serve in this capacity, see people change and feel the spirit, but also to have this power available. Don't forget it is. This Thursday we went to some non-members whose family (members in Mexico) called us and told us to go. It was so special to see them have a bigger glimmer of hope then afterwards to feel the spirit testify of that power. I also felt impressed to give the wife one of comfort. What a beautiful experience. Elder Anderson talked about a few things, so did his wife and some stake presidents that were there; but the biggest take away I had and that you can implement too is scripture power. They talked a lot about the power in the scriptures and not only reading them but knowing them. Having verse written on hearts, some only by where they are and general idea and others by memory. That way in the tempest of life we don't need to scramble for a scripture, we already know it, it's part of our being, and we've already been founded upon our rock, Jesus Christ. Go find a favorite scripture and start memorizing where it is and if you can the words. Los amo mucho! Que tenham uma super boa semana! Elder Jacobs Pictures: empanadas tampa road trip/pit stop badly done license plate finally got to see the Nelsons from my home ward while in Tampa Mexico Nicaragua Peru"}, {"id": "l99", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAY 2023<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Letter 99 · Fort Myers", "title": "A Harmonica 👨‍🎤 Solo?! 🎶", "date": "2023-05-15T05:32:00", "group": "2023-05", "html": "<div class=\"body\"><p>Que onda chimichangas?<\/p>\n<p>How was the week? Hopefully you all enjoyed something Good and for any mother&#x27;s a wonderful mother&#x27;s day. The ward bought roses so Elder Franson and I got to pass those out Sunday morning and see everyone smile 😁 it was wonderful.<\/p>\n<p>We were able to teach Paulo again and he&#x27;s pretty cool. Still super busy and stuck with his job which doesn&#x27;t allow him to come to church but he&#x27;s very open to learn and was excited to get his own book of Mormon.<\/p>\n<p>We made cookies 🍪 for our hit list. We made a list of people (members and friends) to go by give cookies and make sure they know we love them. Also to check in on how they are doing. That was fun, but we still have some more families to go by so round 2 this week.<\/p>\n<p>We met a big &#x27;ol dog named Stitch. So much fun.<\/p>\n<p>Mowed a lawn with a member for an inactive member, then she came to the mother&#x27;s day party and church! Lots of phone lessons scheduled but not many answered.<\/p>\n<p>We had a soccer ⚽ night Thursday and while not as many people came as we hoped we still really enjoyed it and got to see new faces.<\/p>\n<p>Friday was Zone conference along with my final interview. It was a great experience. We also did an all men&#x27;s choir of Army of Helaman. The interview was cool, i enjoyed being able to talk to President Gardiner longer and review many of the things I&#x27;ve learned throughout the mission by areas and companions.<\/p>\n<p>Saturday night we had a mother&#x27;s day party. Bishop also at that party asked me to play my harmonica in Sacrament because another member told him I could. That was stressful but it went well, I played we thank thee o God for a prophet. I was so worried to play in front of the ward that when we got home Saturday I just started practicing and I felt like it wasn&#x27;t working. I took a break, read a chapter in my book of Mormon then tried again. I was able to perfectly building my confidence and allowing me to sleep well. I know that if we trust God and put him first he will always help us. And now, O my son Helaman, behold, thou art in thy youth, and therefore, I beseech of thee that thou wilt hear my words and learn of me; for I do know that whosoever shall put their trust in God shall be supported in their trials, and their troubles, and their afflictions, and shall be lifted up at the last day.<\/p>\n<p>Alma 36:3<\/p>\n<p>https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/36?id=p3&amp;lang=eng#p3<\/p>\n<p class=\"sign\">Los amo! You only get 1 more weekly,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.S. missionary friends- here ya&#x27; go kaj.jacobs@gmail.com add me to your weeklys and stay in contact!<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>stitch<\/li>\n<li>Elder Jenson and I with Heihei (we got this together in my second transfer)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-05-15_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-15_0_1.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_414.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_415.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_416.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_417.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_418.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_419.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_420.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_421.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "A Harmonica 👨‍🎤 Solo?! 🎶 Que onda chimichangas? How was the week? Hopefully you all enjoyed something Good and for any mother's a wonderful mother's day. The ward bought roses so Elder Franson and I got to pass those out Sunday morning and see everyone smile 😁 it was wonderful. We were able to teach Paulo again and he's pretty cool. Still super busy and stuck with his job which doesn't allow him to come to church but he's very open to learn and was excited to get his own book of Mormon. We made cookies 🍪 for our hit list. We made a list of people (members and friends) to go by give cookies and make sure they know we love them. Also to check in on how they are doing. That was fun, but we still have some more families to go by so round 2 this week. We met a big 'ol dog named Stitch. So much fun. Mowed a lawn with a member for an inactive member, then she came to the mother's day party and church! Lots of phone lessons scheduled but not many answered. We had a soccer ⚽ night Thursday and while not as many people came as we hoped we still really enjoyed it and got to see new faces. Friday was Zone conference along with my final interview. It was a great experience. We also did an all men's choir of Army of Helaman. The interview was cool, i enjoyed being able to talk to President Gardiner longer and review many of the things I've learned throughout the mission by areas and companions. Saturday night we had a mother's day party. Bishop also at that party asked me to play my harmonica in Sacrament because another member told him I could. That was stressful but it went well, I played we thank thee o God for a prophet. I was so worried to play in front of the ward that when we got home Saturday I just started practicing and I felt like it wasn't working. I took a break, read a chapter in my book of Mormon then tried again. I was able to perfectly building my confidence and allowing me to sleep well. I know that if we trust God and put him first he will always help us. And now, O my son Helaman, behold, thou art in thy youth, and therefore, I beseech of thee that thou wilt hear my words and learn of me; for I do know that whosoever shall put their trust in God shall be supported in their trials, and their troubles, and their afflictions, and shall be lifted up at the last day. Alma 36:3 https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/36?id=p3&lang=eng#p3 Los amo! You only get 1 more weekly, Elder Jacobs P.S. missionary friends- here ya' go kaj.jacobs@gmail.com add me to your weeklys and stay in contact! Pictures: stitch Elder Jenson and I with Heihei (we got this together in my second transfer) More from this week "}, {"id": "l100", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAY 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": ["PE", "BR", "HT"], "moments": ["Baptism", "Temple"], "extra": "Peru Brazil Haiti", "kind": "Letter 100 · Fort Myers", "title": "El fin *not click bait* 🪤", "date": "2023-05-22T05:54:00", "group": "2023-05", "html": "<div class=\"body\"><p>Oí bom dia galera!<\/p>\n<p>Lhes amo muito, não se esqueçam disso!<\/p>\n<p>It&#x27;s not click bait, this is the last email because I&#x27;m going home Saturday. It&#x27;s been an amazing 2 years and I&#x27;m so grateful for all that I learned and people I met. Here&#x27;s my email again for those of you serving I&#x27;d love to receive your weeklys or random texts on messenger.<\/p>\n<p>kaj.jacobs@gmail.com<\/p>\n<p>Let&#x27;s get on with what happened this week!<\/p>\n<p>We started off baking and cooking with José. I learned how to make his famous cookies from his company in Brazil: Cookbel<\/p>\n<p>Sister Gardiner asked to join our district council and it was awesome. We enjoyed practice teaching members with her and hearing her ideas and feeling her love for us and our areas.<\/p>\n<p>We went out to eat at The Patio, a super nice Peruvian restaurant. Had some of the most bus&#x27;in food ever there. And tons of leftovers too!<\/p>\n<p>Wednesday I was with Elder Bartschi for an exchange. We enjoyed ourselves in the super hot afternoon finding pretty much the whole day. We found quite a few Haitians for his area and a few Latinos as well. We were so tired, the sun basically saps your strength when it&#x27;s so hot.<\/p>\n<p>We had an awesome lesson with Paulo then he joined us and our ward for our soccer ⚽ night and absolutely loved it. I&#x27;m getting better but I&#x27;m still &quot;manquito&quot; aka armless aka the friend on the team who&#x27;s funny but super bad. We had another awesome set of lessons Friday night with the Aguirres, Juan and Moises. We&#x27;re excited to see their progress this week and set a baptismal date with Jesus the Aguirre&#x27;s son.<\/p>\n<p>We had all our lessons cancel Saturday then some car trouble but in the end it was a good day. Found an elect lady who is excited to meet again, Yani. We also went to the flea market during lunch as a district. Check the poncho I got! Sunday was full of goodbyes, I even got to bear my testimony since it was my last. I&#x27;ve been here for 6 months and it feels like forever and I&#x27;ve loved it all. So I enjoyed that along with throughout the week we&#x27;ve been dropping off cookies to people helping them feel our love and appreciation but also say goodbye.<\/p>\n<p>I still have a few more days, I&#x27;m excited to go to the temple with our recent converts for baptisms (in português) but if I want you to remember I have loved my mission, serving others, learning, and working hard. I know that God lives and his son Jesus Christ has his arm outstretched to save us when our faith falters like Peters did. The gospel is a message of joy and blesses our families just as much as it does to individuals. May your joy be full in Christ as mine is. 1 And now it came to pass that as Alma was journeying from the land of Gideon southward, away to the land of Manti, behold, to his astonishment, he met with the sons of Mosiah journeying towards the land of Zarahemla. 2 Now these sons of Mosiah were with Alma at the time the angel first appeared unto him; therefore Alma did rejoice exceedingly to see his brethren; and what added more to his joy, they were still his brethren in the Lord; yea, and they had waxed strong in the knowledge of the truth; for they were men of a sound understanding and they had searched the scriptures diligently, that they might know the word of God.<\/p>\n<p>3 But this is not all; they had given themselves to much prayer, and fasting; therefore they had the spirit of prophecy, and the spirit of revelation, and when they taught, they taught with power and authority of God.<\/p>\n<p>Alma 17:1-3<\/p>\n<p>Lhes amo muito, beijos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>El Pátio<\/li>\n<li>poncho<\/li>\n<li>cooking with Jose<\/li>\n<li>adventures of phonecalls<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>Also June 11 at 9am Arizona time is my homecoming<\/p><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-05-22_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-22_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-22_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_8.jpg\" alt=\"\"><\/figure><\/div>", "text": "El fin *not click bait* 🪤 Oí bom dia galera! Lhes amo muito, não se esqueçam disso! It's not click bait, this is the last email because I'm going home Saturday. It's been an amazing 2 years and I'm so grateful for all that I learned and people I met. Here's my email again for those of you serving I'd love to receive your weeklys or random texts on messenger. kaj.jacobs@gmail.com Let's get on with what happened this week! We started off baking and cooking with José. I learned how to make his famous cookies from his company in Brazil: Cookbel Sister Gardiner asked to join our district council and it was awesome. We enjoyed practice teaching members with her and hearing her ideas and feeling her love for us and our areas. We went out to eat at The Patio, a super nice Peruvian restaurant. Had some of the most bus'in food ever there. And tons of leftovers too! Wednesday I was with Elder Bartschi for an exchange. We enjoyed ourselves in the super hot afternoon finding pretty much the whole day. We found quite a few Haitians for his area and a few Latinos as well. We were so tired, the sun basically saps your strength when it's so hot. We had an awesome lesson with Paulo then he joined us and our ward for our soccer ⚽ night and absolutely loved it. I'm getting better but I'm still \"manquito\" aka armless aka the friend on the team who's funny but super bad. We had another awesome set of lessons Friday night with the Aguirres, Juan and Moises. We're excited to see their progress this week and set a baptismal date with Jesus the Aguirre's son. We had all our lessons cancel Saturday then some car trouble but in the end it was a good day. Found an elect lady who is excited to meet again, Yani. We also went to the flea market during lunch as a district. Check the poncho I got! Sunday was full of goodbyes, I even got to bear my testimony since it was my last. I've been here for 6 months and it feels like forever and I've loved it all. So I enjoyed that along with throughout the week we've been dropping off cookies to people helping them feel our love and appreciation but also say goodbye. I still have a few more days, I'm excited to go to the temple with our recent converts for baptisms (in português) but if I want you to remember I have loved my mission, serving others, learning, and working hard. I know that God lives and his son Jesus Christ has his arm outstretched to save us when our faith falters like Peters did. The gospel is a message of joy and blesses our families just as much as it does to individuals. May your joy be full in Christ as mine is. 1 And now it came to pass that as Alma was journeying from the land of Gideon southward, away to the land of Manti, behold, to his astonishment, he met with the sons of Mosiah journeying towards the land of Zarahemla. 2 Now these sons of Mosiah were with Alma at the time the angel first appeared unto him; therefore Alma did rejoice exceedingly to see his brethren; and what added more to his joy, they were still his brethren in the Lord; yea, and they had waxed strong in the knowledge of the truth; for they were men of a sound understanding and they had searched the scriptures diligently, that they might know the word of God. 3 But this is not all; they had given themselves to much prayer, and fasting; therefore they had the spirit of prophecy, and the spirit of revelation, and when they taught, they taught with power and authority of God. Alma 17:1-3 Lhes amo muito, beijos! Elder Jacobs Pictures: El Pátio poncho cooking with Jose adventures of phonecalls Also June 11 at 9am Arizona time is my homecoming Peru Brazil Haiti"}, {"id": "home", "kind": "Home", "title": "Back home · June 2023", "date": null, "group": "end", "html": "<div class=\"cover-r\"><img class=\"portrait\" src=\"images/cover.jpg\" alt=\"Elder Jacobs, June 2023\"><\/div>", "text": "Back home · June 2023  "}, {"id": "talk", "kind": "Homecoming talk", "title": "Growing our relationship with Christ", "date": "2023-06-11T09:00:00", "html": "<div class=\"talk\"><h3>Intros<\/h3>\n<ul><li>Good morning / reintroduce myself (it&#x27;s been basically 3 years)<\/li><li>Where<\/li><li>Missionary purpose<\/li><li>Some funny joke: “por fa vor” vs “por favor”<\/li><\/ul>\n<h3>A few things I learned<\/h3>\n<ul><li>Other cultures<\/li><li>Bleach is a no-no with colored clothes<\/li><li>Humidity<\/li><li>True enduring joy<\/li><li>Who am I (President Nelson devo)<ul><li>A child of God<\/li><li>A disciple of Christ<\/li><li>A child of the covenant<\/li><\/ul><\/li><\/ul>\n<h3>What does relationship mean?<\/h3>\n<ul><li>Something emotional like dating or marriage<\/li><li>Behavioral<\/li><li>A connection of similar things<\/li><\/ul>\n<p>We want to behave well towards others but what helps us to do that is to be connected with Christ. To become so similar or Christ-like that our behavior changes and others feel Him through us.<\/p>\n<p>I&#x27;m going to explain some things on how to grow our relationship with Christ. I experienced these and myself grew with them.<\/p>\n<h3>Things I did to grow my relationship with Christ and help others do the same<\/h3>\n<ol><li>Church, Prayer, Reading scriptures (CPR)<ul><li>Church: the sacrament<ul><li>Benefits like the Spirit, learning, friends (our friends)<\/li><li>Christ is the focus, thus the sacrament<\/li><li>Mosiah 14:4–5: “Surely he has borne our griefs, and carried our sorrows; yet we did esteem him stricken, smitten of God, and afflicted. But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him; and with his stripes we are healed.”<\/li><\/ul><\/li><li>Prayer: sweet hour of prayer<ul><li>Levels of prayer / basics<\/li><li>“Secret prayer”: “Where Can I Turn for Peace,” 3rd verse: “He answers privately, reaches my reaching”<\/li><li>My experience + friends<\/li><\/ul><\/li><li>Study, not read nor skim<\/li><\/ul><\/li><li>The first principles and ordinances of the gospel<ul><li>Faith: not trust or being part of a religion but rather a desire and action because of spiritual apprehension rather than proof<\/li><li>Repentance: a full change and turn towards God<ul><li>The Atonement is for everyone: others outside the gospel, those learning of the gospel, and especially ourselves<\/li><\/ul><\/li><li>Baptism: the first covenant, the cleansing or washing<ul><li>Like gold<\/li><\/ul><\/li><li>Gift of the Holy Ghost: cleansing and companion<ul><li>One of the biggest promises we can have<\/li><li>Levels of understanding: know everything, or know little but desire (Jesus)<\/li><\/ul><\/li><li>Enduring to the end: to abide or persevere<ul><li>“The word abide denotes remaining fixed or stable and enduring without yielding. Elder Jeffrey R. Holland explained that ‘abiding’ as an action means ‘[to] stay—but [to] stay forever.’ That is the call of the gospel message to … everyone … in the world.” (Elder Bednar, April 2023)<\/li><li>The Francos &amp; Batistas: scared, but desired eternal blessings as a family<\/li><\/ul><\/li><\/ul><\/li><li>Seeking spiritual experiences<ul><li>Special time with God<ul><li>Prayer<\/li><li>Private and group situations<\/li><\/ul><\/li><li>Consistent spiritual confirmations<ul><li>Seeking for uplifting and enlightening rather than rehearsing doubts with other doubters<\/li><li>Kneeling with Julian<\/li><\/ul><\/li><li>Service<ul><li>Christ always served<\/li><li>The hurricane clean-up, blessings, and the bishop&#x27;s storehouse<\/li><\/ul><\/li><\/ul><\/li><\/ol>\n<blockquote class=\"hymn\">When Christ shall come, with shout of acclamation,<br>And take me home, what joy shall fill my heart!<br>Then I shall bow, in humble adoration,<br>And then proclaim, my God, how great thou art!<\/blockquote>\n<h3>Testimony<\/h3>\n<ul><li>Christ<\/li><li>Scriptures<\/li><li>Prayer<\/li><li>Gift of tongues<\/li><li>Friends and family<\/li><li>Music<\/li><li>Spiritual hugs and pulls towards the light<ul><li>We can all have that<\/li><\/ul><\/li><li>Spiritual light and our ways of revelation<ul><li>Prayed for visions/dreams<\/li><li>I have my spiritual gifts, my relationship with God, and He trusts me the same as anyone else<\/li><li>LOVE<\/li><\/ul><\/li><\/ul><\/div>", "group": "end", "text": "Growing our relationship with Christ Intros Good morning / reintroduce myself (it's been basically 3 years) Where Missionary purpose Some funny joke: “por fa vor” vs “por favor” A few things I learned Other cultures Bleach is a no-no with colored clothes Humidity True enduring joy Who am I (President Nelson devo) A child of God A disciple of Christ A child of the covenant What does relationship mean? Something emotional like dating or marriage Behavioral A connection of similar things We want to behave well towards others but what helps us to do that is to be connected with Christ. To become so similar or Christ-like that our behavior changes and others feel Him through us. I'm going to explain some things on how to grow our relationship with Christ. I experienced these and myself grew with them. Things I did to grow my relationship with Christ and help others do the same Church, Prayer, Reading scriptures (CPR) Church: the sacrament Benefits like the Spirit, learning, friends (our friends) Christ is the focus, thus the sacrament Mosiah 14:4–5: “Surely he has borne our griefs, and carried our sorrows; yet we did esteem him stricken, smitten of God, and afflicted. But he was wounded for our transgressions, he was bruised for our iniquities; the chastisement of our peace was upon him; and with his stripes we are healed.” Prayer: sweet hour of prayer Levels of prayer / basics “Secret prayer”: “Where Can I Turn for Peace,” 3rd verse: “He answers privately, reaches my reaching” My experience + friends Study, not read nor skim The first principles and ordinances of the gospel Faith: not trust or being part of a religion but rather a desire and action because of spiritual apprehension rather than proof Repentance: a full change and turn towards God The Atonement is for everyone: others outside the gospel, those learning of the gospel, and especially ourselves Baptism: the first covenant, the cleansing or washing Like gold Gift of the Holy Ghost: cleansing and companion One of the biggest promises we can have Levels of understanding: know everything, or know little but desire (Jesus) Enduring to the end: to abide or persevere “The word abide denotes remaining fixed or stable and enduring without yielding. Elder Jeffrey R. Holland explained that ‘abiding’ as an action means ‘[to] stay—but [to] stay forever.’ That is the call of the gospel message to … everyone … in the world.” (Elder Bednar, April 2023) The Francos & Batistas: scared, but desired eternal blessings as a family Seeking spiritual experiences Special time with God Prayer Private and group situations Consistent spiritual confirmations Seeking for uplifting and enlightening rather than rehearsing doubts with other doubters Kneeling with Julian Service Christ always served The hurricane clean-up, blessings, and the bishop's storehouse When Christ shall come, with shout of acclamation, And take me home, what joy shall fill my heart! Then I shall bow, in humble adoration, And then proclaim, my God, how great thou art! Testimony Christ Scriptures Prayer Gift of tongues Friends and family Music Spiritual hugs and pulls towards the light We can all have that Spiritual light and our ways of revelation Prayed for visions/dreams I have my spiritual gifts, my relationship with God, and He trusts me the same as anyone else LOVE "}, {"id": "culture", "kind": "Notes", "title": "Culture stuff", "date": "2023-01-09T06:00:00", "html": "<div class=\"culture\"><div class=\"recipe\"><h3>Agua de horchata<\/h3><ul><li>1/2 cup de harina de arroz<\/li><li>2 cup regular milk<\/li><li>1 condensed milk<\/li><li>1tsp vanilla<\/li><li>1tsp cinnamon<\/li><li>1/4 cup sugar<\/li><\/ul><p>Add water to your leaking<\/p><p>Mix together and add ice<\/p><\/div><div class=\"countries\"><div class=\"country\"><h3>🇲🇽 Mexico<\/h3><p><b>Capital:<\/b> Distrito Federal (&quot;DF&quot;)<\/p><p><b>Espresiones famosa:<\/b> Ándale! Apoco! No me digas! Órale! Híjoles!<\/p><p class=\"lbl\">Estados<\/p><ul><li>Hidalgo<\/li><\/ul><p><b>A. Dialecto:<\/b> Otomi<\/p><ul><li>&quot;quehatsi&quot; como esta?<\/li><li>&quot;isqudaí&quot; buenas tardes!<\/li><li>Puebla (Poblanos)<\/li><\/ul><p><b>A. Comida Tipica:<\/b> Mole<\/p><ul><li>Oaxaca<\/li><\/ul><p><b>A. Comida famosa:<\/b> &quot;Tlayudas&quot; (tortillas que son grandes como un sope)<\/p><ul><li>Veracruz<\/li><\/ul><p>A. Los &quot;Jarochos&quot; o &quot;Costeños (personas viven cerca dela costa)&quot;<\/p><ul><li>Michóacan (los Tarascos)<\/li><\/ul><p><b>Ciudad:<\/b> Parangaricutirimicuaro<\/p><p><b>Dialecto:<\/b> Tarasco<\/p><\/div><div class=\"country\"><h3>🇨🇴 Colombia<\/h3><p><b>Capital:<\/b> Bogotá (los Rolos)<\/p><ul><li>&quot;eterna primavera&quot;<\/li><\/ul><p><b>Expresiones:<\/b> chevere! (Cool/awesome) Bacano! (Good/awesome) parcero (amigo) que mi ave (mucho gusto or maybe not a real phrase unsure)<\/p><p>Medellin- &quot;Paisa&quot;<\/p><p>Caliroso - Drippy<\/p><p class=\"lbl\">Comida Tipica<\/p><ul><li>arrepas<\/li><li>chocolate con quezo<\/li><li>pan de bono (hay que probarlo!)<\/li><\/ul><\/div><div class=\"country\"><h3>🇻🇪 Venezuela<\/h3><p><b>Capital:<\/b> Caracas<\/p><p><b>Expresiones:<\/b> chévere!<\/p><ul><li>Juego: pelota de goma (Personas de Maracaibo)<\/li><\/ul><p class=\"lbl\">Comidas Tipicas<\/p><ul><li>Arrepas (no se compare con Colombia)<\/li><li>&quot;Caraotas&quot; -beans<\/li><li>&quot;wasacaca&quot; -ranch basically<\/li><li>hallacas -Venezuelan tamales for christmas time<\/li><\/ul><p class=\"lbl\">Musica<\/p><ul><li>&quot;otra noche de ilusión&quot;<\/li><li>La gainta: una tipa de cancion de la navidad<\/li><\/ul><\/div><div class=\"country\"><h3>🇭🇳 Honduras<\/h3><p><b>Capital:<\/b> Tegucigalpa<\/p><ul><li>los Catrachos<\/li><\/ul><p><b>Expresiones:<\/b> más hizo! Medo gallo (cool guy)<\/p><\/div><div class=\"country\"><h3> El Salvador<\/h3><p><b>Capital:<\/b> San Salvador<\/p><p><b>Comida Tipica:<\/b> Pupusas<\/p><\/div><div class=\"country\"><h3>🇨🇱 Chile<\/h3><p><b>Expressiones:<\/b> bacán (cool!) ; buena po!<\/p><p><b>Capital:<\/b> Santiago<\/p><p class=\"lbl\">Cominda Tipica<\/p><ul><li>completos- sanchicha<\/li><li>Pastel de Choclo (corn cake with meat)<\/li><li>Empanadas<\/li><li>Calzones Rotos- una fritura<\/li><\/ul><\/div><div class=\"country\"><h3>🇳🇮 Nicaragua<\/h3><p><b>Capital:<\/b> Managua<\/p><p>&quot;Los Nicas&quot;<\/p><p class=\"lbl\">Comida Tipica<\/p><ul><li>Tostadas<\/li><li>Tamales<\/li><li>tortillas de Maíz<\/li><li>gallo pinto<\/li><\/ul><p><b>Expressions:<\/b> maje (amigo) al puro cien (💯 percent)<\/p><\/div><div class=\"country\"><h3>🇪🇨 Ecuador<\/h3><p><b>Capital:<\/b> Quito<\/p><p class=\"lbl\">Comidas famosas/ típica<\/p><ul><li>La guatita (la panza de vaca)<\/li><li>Cuy (guine pig) con las papas cocinadas<\/li><li>siempre tienen papas<\/li><li>muchísimas sopas<\/li><\/ul><p class=\"lbl\">Dialetos<\/p><ul><li>Kichwa<\/li><\/ul><p>Me voy a camello &quot;I&#x27;m going to work&quot;<\/p><p>Chuchaqui &quot;Hungover- noun&quot;<\/p><p>Chumalo &quot;Drunk person&quot;<\/p><p>Ese man<\/p><\/div><div class=\"country\"><h3>🇬🇹 Guatemala<\/h3><ul><li>&quot;Chapin&quot; un Guatemalteco<\/li><li>habla dialectos como &quot;Mam&quot;<\/li><\/ul><p><b>Comida Tipica:<\/b> Chuscutas con Taccines (tortilla w/ beans)<\/p><\/div><div class=\"country\"><h3>🇵🇪 Peru<\/h3><p><b>Capital:<\/b> Lima~Machu Pichu<\/p><p><b>Dialecto:<\/b> Quechua (Alileichu?~Como estas?)<\/p><p class=\"lbl\">Ciudades<\/p><p>Arrequipa (las montañas)<\/p><p>Iquitos( la sierra)<\/p><p class=\"lbl\">Comida Tipica<\/p><p>Ají de Gallina( HAY QUE PROBAR!!!)<\/p><p>Cerviché(cuidado; its raw fish but it tastes good!)<\/p><p>Patatas (tienen 200+ variedades de Patatas; mas de Idaho!!)<\/p><p>Inca Cola- su soda famosa (hay que probar!)<\/p><\/div><div class=\"country\"><h3>🇦🇷 Argentina<\/h3><p><b>Capital:<\/b> Buenos Aires<\/p><p><b>Juego Famoso:<\/b> Fútbol<\/p><p class=\"lbl\">Comida Famosa<\/p><ul><li>bistec<\/li><li>empanadas<\/li><li>mate- su bebida famosa<\/li><li>milanesa<\/li><li>facherito (drippy, great, awesome)<\/li><\/ul><p><b>Frases:<\/b> che (oye! Che! Hey best friend - very informal)<\/p><\/div><div class=\"country\"><h3>🇨🇷 Costa Rica<\/h3><p>Los &quot;Ticos&quot;<\/p><p><b>Expresiones:<\/b> &quot;Pura vida&quot; (good)<\/p><p class=\"lbl\">Cominda tipica<\/p><p>Gallo pinto<\/p><\/div><div class=\"country\"><h3>🇨🇺 Cuba<\/h3><p><b>Capital:<\/b> Havana<\/p><p><b>Comida tipica:<\/b> ropa vieja, tostones, bacalao(cod), cuban sándwich, arroz y frijoles negros<\/p><ul><li>Las Tunas una ciudad hermosa<\/li><\/ul><p><b>Expresiones:<\/b> como esta la cosa? Que bolá? Mi accede (amigo)<\/p><\/div><div class=\"country\"><h3>🇵🇷 Puerto Rico<\/h3><p><b>Capital:<\/b> San Juan<\/p><ul><li>Los Boricuas (les gusta tener este apodo)<\/li><\/ul><p class=\"lbl\">Ciudades<\/p><p class=\"lbl\">Comida tipica<\/p><ul><li>MOFONGO<\/li><li>arroz con abichuela (beans)<\/li><li>arroz con grandules( chickpeas)<\/li><li>tostones; platano frito<\/li><li>Pinchos (bbq)<\/li><\/ul><p><b>Expresiones:<\/b> ay bendito!<\/p><\/div><div class=\"country\"><h3>🇩🇴 Republica Dominicana<\/h3><p><b>Capital:<\/b> Santo Domingo<\/p><p><b>Expresiones:<\/b> ay! mi madre! Que lo que? De lo mío (homie) pana (amigo/a)<\/ <script>
const P = JSON.parse(document.getElementById('data').textContent);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const $ = id => document.getElementById(id);
const fmt = iso => { if (!iso) return ''; const d = new Date(iso); return `${d.getDate()} ${MONL[d.getMonth()]} ${d.getFullYear()}`; };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
P.forEach(p => p.ntext = norm(p.text));
const EMOJI = /[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}\uFE0F\u200D\u20E3]/gu;
// letter-style emojis (🅱️ovid, 🆘) become real letters before other emojis are hidden
const WORDMOJI = { '\u{1F197}': 'OK', '\u{1F192}': 'COOL', '\u{1F195}': 'NEW', '\u{1F193}': 'FREE', '\u{1F199}': 'UP', '\u{1F198}': 'SOS', '\u{1F196}': 'NG', '\u{1F191}': 'CL', '\u{1F194}': 'ID', '\u{1F19A}': 'VS', 'ℹ': 'i' };
const toLetters = t => t
  .replace(/[\u{1F130}-\u{1F149}]/gu, c => String.fromCharCode(c.codePointAt(0) - 0x1F130 + 65))
  .replace(/[\u{1F170}-\u{1F189}]/gu, c => String.fromCharCode(c.codePointAt(0) - 0x1F170 + 65))
  .replace(/[Ⓐ-Ⓩ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x24B6 + 65))
  .replace(/[ⓐ-ⓩ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x24D0 + 97))
  .replace(/[\u{1F191}-\u{1F19A}ℹ]/gu, c => WORDMOJI[c] || c);
const stripE = t => toLetters(t).replace(EMOJI, '').replace(/ {2,}/g, ' ');
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

let cur = 0, terms = [];

function render(i, dir) {
  cur = Math.max(0, Math.min(P.length - 1, i));
  const p = P[cur], art = $('art');
  art.classList.toggle('is-cover', p.id === 'cover');
  art.classList.toggle('has-pm', !!p.post);
  const body = p.id === 'gallery' && typeof galleryHTML === 'function' ? galleryHTML(p) : p.html;
  art.innerHTML = p.id === 'cover' ? p.html : `${p.post || ''}<div class="kicker">${esc(p.kind)}${p.date ? ' · ' + fmt(p.date) : ''}</div><h1>${esc(p.title)}</h1>${p.stamps || ''}${body}`;
  art.querySelectorAll('img').forEach(im => { im.loading = 'lazy'; im.decoding = 'async'; });
  art.classList.remove('split'); document.body.classList.remove('wide');
  if (p.id[0] === 'l') {
    const pics = [...art.querySelectorAll(':scope > .photos, :scope > .more')];
    if (pics.length) {
      const aside = document.createElement('aside'); aside.className = 'pics'; aside.setAttribute('aria-label', 'Photos from this week');
      pics.forEach(x => aside.append(x));
      const txt = document.createElement('div'); txt.className = 'txt';
      while (art.firstChild) txt.append(art.firstChild);
      art.append(txt, aside); art.classList.add('split'); document.body.classList.add('wide');
    }
  }
  if (p.id === 'map' && typeof showArea === 'function') showArea(selArea, false);
  hideTip(); if (!['cover', 'map', 'gallery'].includes(p.id)) gloss(art);
  art.classList.remove('anim-next','anim-prev'); void art.offsetWidth;
  if (dir) art.classList.add(dir > 0 ? 'anim-next' : 'anim-prev');
  const prev = P[cur-1], next = P[cur+1];
  for (const [b, q, lbl] of [[$('prevCard'), prev, '← Previous'], [$('nextCard'), next, 'Next →']]) {
    b.disabled = !q; b.innerHTML = q ? `<span class="k">${lbl}</span><span class="t">${esc(q.title)}</span>` : '';
  }
  $('prevSide').disabled = $('prevDock').disabled = !prev;
  $('nextSide').disabled = $('nextDock').disabled = !next;
  $('pos').textContent = `${cur + 1} / ${P.length}`;
  $('dockMid').innerHTML = `${esc(p.kind)}<br>${p.date ? fmt(p.date) : ''}`;
  $('prog').style.width = ((cur + 1) / P.length * 100) + '%';
  if (location.hash !== '#' + p.id) history.replaceState(null, '', '#' + p.id);
  store.set('mission-page', p.id);
  document.title = silly ? (p.id === 'cover' ? p.title : `${p.title} · Elder Jacobs' Mission`) : stripE(p.id === 'cover' ? p.title : `${p.title} · Elder Jacobs' Mission`).trim();
  $('mapBtn').classList.toggle('on', p.id === 'map'); $('galBtn').classList.toggle('on', p.id === 'gallery');
  if (terms.length) highlight(art, terms); else window.scrollTo({ top: 0 });
  markList();
}
const go = d => { if (P[cur + d]) render(cur + d, d); };
const goId = id => { const i = P.findIndex(p => p.id === id); if (i >= 0) render(i, i > cur ? 1 : -1); };

['prevSide','prevDock','prevCard'].forEach(id => $(id).onclick = () => { terms = []; go(-1); });
['nextSide','nextDock','nextCard'].forEach(id => $(id).onclick = () => { terms = []; go(1); });

/* swipe */
let sx = 0, sy = 0, st = 0;
document.addEventListener('touchstart', e => { if (e.touches.length !== 1) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive: true });
document.addEventListener('touchend', e => {
  if ($('drawer').classList.contains('open') || $('lb').classList.contains('open')) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && Date.now() - st < 600) { terms = []; go(dx < 0 ? 1 : -1); }
});

/* drawer */
let searchMode = false;
const openDrawer = (search, focus = search) => {
  searchMode = !!search; $('drawer').classList.toggle('searching', searchMode); $('dTitle').textContent = searchMode ? 'Search' : 'Contents';
  drawList();
  $('drawer').classList.add('open'); $('scrim').classList.add('open');
  const c = $('list').querySelector('.item.cur'); if (c && !searchMode) c.scrollIntoView({ block: 'center' }); else $('list').scrollTop = 0;
  if (focus) setTimeout(() => $('q').focus(), 50); };
const closeDrawer = () => { $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); };
$('menuBtn').onclick = () => openDrawer(false);
$('searchBtn').onclick = () => openDrawer(true);
$('closeBtn').onclick = closeDrawer; $('scrim').onclick = closeDrawer;
$('homeBtn').onclick = () => { terms = []; goId('cover'); };
$('mapBtn').onclick = () => { terms = []; goId('map'); };
$('galBtn').onclick = () => { terms = []; goId('gallery'); };

const dated = P.map((p, i) => ({ p, i })).filter(x => x.p.date && x.p.id[0] === 'l');
const years = [...new Set(dated.map(x => x.p.date.slice(0, 4)))];

/* date jump: the letter written on/after that day covers it */
$('dateIn').min = dated[0].p.date.slice(0, 10); $('dateIn').max = dated[dated.length - 1].p.date.slice(0, 10);
$('dateIn').onchange = e => {
  const v = e.target.value; if (!v) return;
  const hit = dated.find(x => x.p.date.slice(0, 10) >= v) || dated[dated.length - 1];
  terms = []; render(hit.i, hit.i > cur ? 1 : -1); closeDrawer();
};

/* list + search */
function groupedHTML(pool) {
  let html = '', last = '';
  pool.forEach(({ p, i }) => {
    const g = p.group;
    if (g !== last) {
      const label = g === 'start' ? 'Beginning' : g === 'end' ? 'Home & extras' : `${MONL[+g.slice(5) - 1]} ${g.slice(0, 4)}`;
      html += `<div class="grp" data-g="${g}">${label}</div>`; last = g;
    }
    html += `<button class="item" data-i="${i}"><span class="t">${esc(p.title)}</span><span class="d">${esc(p.kind)}${p.date ? ' · ' + fmt(p.date) : ''}</span></button>`;
  });
  return html;
}
function drawList() {
  const sm = typeof searchMode !== 'undefined' && searchMode;
  const q = sm ? norm($('q').value.trim()) : '';
  const L = $('list');
  const active = sm && typeof FILTERS !== 'undefined' ? FILTERS.filter(f => SEL[f.k].size) : [];
  if (typeof drawFilterUI === 'function') drawFilterUI();
  const all = P.map((p, i) => ({ p, i }));
  if (!q && !active.length) { L.innerHTML = groupedHTML(all); markList(); return; }
  const pool = active.length ? all.filter(x => active.every(f => f.get(x.p).some(v => SEL[f.k].has(v)))) : all;
  if (!q) {
    L.innerHTML = `<div class="count">${pool.length} ${pool.length === 1 ? 'letter' : 'letters'}</div>` +
      (pool.length ? groupedHTML(pool) : `<div class="empty">No letters match these filters</div>`);
    markList(); return;
  }
  const words = q.split(/\s+/).filter(Boolean);
  const hits = [];
  pool.forEach(({ p, i }) => {
    if (!words.every(w => p.ntext.includes(w))) return;
    const n = words.reduce((a, w) => a + p.ntext.split(w).length - 1, 0);
    const at = p.ntext.indexOf(words[0]);
    const a = Math.max(0, at - 60), b = Math.min(p.text.length, at + 110);
    let snip = (a ? '…' : '') + p.text.slice(a, b) + (b < p.text.length ? '…' : '');
    hits.push({ i, p, n, snip });
  });
  L.innerHTML = `<div class="count">${hits.length ? hits.length + (hits.length === 1 ? ' letter' : ' letters') : ''}</div>` + (hits.length
    ? hits.map(h => `<button class="item" data-i="${h.i}"><span class="t">${markStr(h.p.title, words)}</span>
        <span class="d">${esc(h.p.kind)}${h.p.date ? ' · ' + fmt(h.p.date) : ''} · ${h.n} match${h.n === 1 ? '' : 'es'}</span>
        <span class="s">${markStr(h.snip, words)}</span></button>`).join('')
    : `<div class="empty">Nothing found for “${esc($('q').value)}”</div>`);
}
function markStr(s, words) {
  const ns = norm(s); let out = '', k = 0;
  const re = new RegExp(words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
  for (const m of ns.matchAll(re)) { out += esc(s.slice(k, m.index)) + '<mark>' + esc(s.slice(m.index, m.index + m[0].length)) + '</mark>'; k = m.index + m[0].length; }
  return out + esc(s.slice(k));
}
function highlight(root, words) {
  const re = new RegExp(words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  let first = null;
  for (const t of nodes) {

  [["pão de queijo","pão de quiejo"], "Food · Brazil", "Chewy little cheese bread rolls."],
  [["brigadeiro","brigadeiros"], "Food · Brazil", "A chocolate fudge ball rolled in sprinkles – at every Brazilian party."],
  [["churrasco"], "Food · Brazil", "Brazilian barbecue – meat grilled on big skewers."],
  [["picanha"], "Food · Brazil", "The top sirloin cap, the favourite cut at a Brazilian barbecue."],
  [["farofa","farrofa"], "Food · Brazil", "Toasted cassava flour sprinkled over food."],
  [["tererê","terere"], "Drink · Paraguay & Brazil", "Yerba mate tea served ice-cold, often sipped from a horn cup."],
  // Other languages
  [["talofa"], "Samoan", "Hello."],
  [["malo soifua"], "Samoan", "A greeting – roughly “hello, good health to you.”"],
  [["fa'afetai","faafetai"], "Samoan", "Thank you."],
  [["usos","uso"], "Samoan", "Brother / cousin – what Samoan guys call each other."],
  [["koman w ye","koman ou ye"], "Haitian Creole", "How are you?"],
  [["shabbat shalom"], "Hebrew", "“Peaceful Sabbath” – a Jewish Sabbath greeting."],
];
const GLK = new Map(), glTerms = [];
const glKey = s => s.toLowerCase().replace(/[’]/g, "'").replace(/\s+/g, ' ');
GL.forEach((g, i) => g[0].forEach(t => { GLK.set(glKey(t), i); glTerms.push(t); }));
glTerms.sort((a, b) => b.length - a.length);
const GLRE = new RegExp("(?<![\\p{L}\\p{M}'’])(" + glTerms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+').replace(/'/g, "['’]")).join('|') + ")(?![\\p{L}\\p{M}])", 'giu');
const SAID = /^[!?.,'’"”]*(\s*\(|\s*[-–—=]\s|\s+[-–—=])/; // he already explained it right after
function gloss(root) {
  const used = new Set(), skip = 'h1,.kicker,.stamps,button,a,svg,mark,.gl,script,style';
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest(skip) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const ns = []; while (w.nextNode()) ns.push(w.currentNode);
  for (const t of ns) {
    const s = t.nodeValue; GLRE.lastIndex = 0;
    const ms = [...s.matchAll(GLRE)]; if (!ms.length) continue;
    const frag = document.createDocumentFragment(); let k = 0, any = false;
    for (const m of ms) {
      const i = GLK.get(glKey(m[0])); if (i === undefined || used.has(i)) continue;
      used.add(i); // first time on each page only
      if (SAID.test(s.slice(m.index + m[0].length, m.index + m[0].length + 4))) continue;
      frag.append(s.slice(k, m.index));
      const sp = document.createElement('span'); sp.className = 'gl'; sp.dataset.g = i; sp.tabIndex = 0; sp.setAttribute('role', 'button');
      sp.textContent = m[0]; frag.append(sp); k = m.index + m[0].length; any = true;
    }
    if (!any) continue;
    frag.append(s.slice(k)); t.replaceWith(frag);
  }
}
const tip = document.createElement('div'); tip.className = 'gtip'; tip.hidden = true; tip.setAttribute('role', 'tooltip'); document.body.append(tip);
let tipEl = null;
function hideTip() { if (tipEl) tipEl.classList.remove('on'); tipEl = null; tip.hidden = true; }
function showTip(el) {
  const g = GL[+el.dataset.g]; if (!g) return;
  hideTip(); tipEl = el; el.classList.add('on');
  tip.innerHTML = `<b>${esc(el.textContent)}</b><span class="o">${esc(g[1])}</span><p>${esc(g[2])}</p>`;
  const W = Math.min(300, innerWidth - 32); tip.style.width = W + 'px'; tip.hidden = false;
  const r = el.getClientRects()[0] || el.getBoundingClientRect(), h = tip.offsetHeight;
  const x = Math.max(16, Math.min(innerWidth - 16 - W, r.left + r.width / 2 - W / 2));
  let y = r.bottom + 8; if (y + h > innerHeight - 12) y = Math.max(8, r.top - 8 - h);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
document.addEventListener('click', e => {
  const g = e.target.closest('.gl');
  if (g) { e.stopPropagation(); if (g === tipEl) hideTip(); else showTip(g); return; }
  if (!e.target.closest('.gtip')) hideTip();
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !tip.hidden) { hideTip(); e.stopImmediatePropagation(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('gl')) { e.preventDefault(); showTip(e.target); }
}, true);
addEventListener('scroll', hideTip, { passive: true }); addEventListener('resize', hideTip);

/* Journal (default, no emojis) vs Silly mode */
let silly = store.get('mission-silly') === '1';
const ORIG = new WeakMap();
function cleanTree(root) {
  if (silly || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const ns = []; while (w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n => { const v = n.nodeValue; EMOJI.lastIndex = 0; if (EMOJI.test(v)) { const c = stripE(v); n.nodeValue = /^\s*$/.test(c) && v.trim() ? '' : c; } });
}
const mo = new MutationObserver(ms => { if (silly) return; ms.forEach(m => m.addedNodes.forEach(n => n.nodeType === 1 ? cleanTree(n) : n.nodeType === 3 && cleanTree(n.parentNode))); });
function applyMode() {
  document.documentElement.classList.toggle('silly', silly);
  $('modeBtn').setAttribute('aria-pressed', String(silly)); $('modeBtn').title = silly ? 'Journal mode: hide emojis' : 'Silly mode: show emojis';
  if (silly) mo.disconnect(); else { mo.observe(document.body, { childList: true, subtree: true }); cleanTree(document.body); }
}
$('modeBtn').onclick = () => { silly = !silly; store.set('mission-silly', silly ? '1' : '0'); applyMode(); render(cur, 0); drawList(); if (silly) location.reload(); };
applyMode();

/* lightbox */
let lbList = [], lbI = 0;
$('art').addEventListener('click', e => {
  const im = e.target.closest('figure img'); if (!im || P[cur].id === 'cover') return;
  lbList = [...$('art').querySelectorAll('figure img')]; lbI = lbList.indexOf(im); showLb();
});
function showLb() { $('lbImg').src = lbList[lbI].src; $('lbC').textContent = `${lbI + 1} / ${lbList.length}`; $('lb').classList.add('open'); }
const lbGo = d => { lbI = (lbI + d + lbList.length) % lbList.length; showLb(); };
$('lbL').onclick = e => { e.stopPropagation(); lbGo(-1); }; $('lbR').onclick = e => { e.stopPropagation(); lbGo(1); };
$('lbX').onclick = () => $('lb').classList.remove('open');
$('lb').onclick = e => { if (e.target === $('lb')) $('lb').classList.remove('open'); };
let lsx = 0;
$('lb').addEventListener('touchstart', e => lsx = e.touches[0].clientX, { passive: true });
$('lb').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - lsx; if (Math.abs(dx) > 50) lbGo(dx < 0 ? 1 : -1); });

/* keyboard */
document.addEventListener('keydown', e => {
  const lb = $('lb').classList.contains('open'), dr = $('drawer').classList.contains('open');
  if (e.key === 'Escape') { if (lb) $('lb').classList.remove('open'); else if ($('filters').querySelector('.dd.open')) closeDD(); else closeDrawer(); return; }
  if (lb) { if (e.key === 'ArrowLeft') lbGo(-1); if (e.key === 'ArrowRight') lbGo(1); return; }
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); openDrawer(true); return; }
  if (dr) return;
  if (e.key === 'ArrowLeft') { terms = []; go(-1); }
  if (e.key === 'ArrowRight') { terms = []; go(1); }
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id !== P[cur].id) goId(id); });

drawList();
const start = location.hash.slice(1) || store.get('mission-page');
const si = Math.max(0, P.findIndex(p => p.id === start));
render(si, 0);
