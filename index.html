 "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Letter 55 · Tampa", "title": "✨️🇺🇲Feliz Día de Independencia🎆🎇", "date": "2022-07-04T11:46:00", "group": "2022-07", "html": "<div class=\"body\"><p>Happy Fourth of July Amigos!<\/p>\n<p>Hope you can enjoy today with some fun fireworks, BBQ, family, friends, etc.<\/p>\n<p>Let me know what&#x27;s up through an email, messenger (fyi I can&#x27;t respond), or drop me some pictures. We can&#x27;t use fireworks of any kind sadly but we&#x27;re planning on going somewhere to get BBQ with the district today. Well this week was kinda hard, the sheer amount of work (aka referrals) flying in was a little stressful but we survived, found a way to make everything work, and can rest a bit today to make sure we can do it again this one. Our friends are doing pretty awesome, Letty wants to be baptized!<\/p>\n<p>We taught her Monday night. She is living with a member and his family so we went over Monday, ate some awesome baliadas, and then taught. We talked about the tree of life and also the gospel (faith, repentance, baptism, holy ghost, and endure to the end). We are excited for her we just need to find a more consistent time to meet but she&#x27;s reading a ton in the Book of Mormon.<\/p>\n<p>Tuesday I went on my first exchange as district leader. Elder Huffaker from South Tampa joined me to speak Spanish. It was pretty fun glad I can do more in the coming weeks. He&#x27;s working on his Spanish to try to help more! English class this week was pretty awesome we had more people come. One being my new friend, Diogo (Gee-o-goo) which if you didn&#x27;t realize is now how you would pronounce his name in Spanish, he speaks Portuguese. Luckily I had started some time back learning Portuguese I so I was able to teach him English. He is so awesome and I&#x27;m excited to keep learning more Portuguese from him and to teach him English.<\/p>\n<p>Drank an entire fresh coconut 🥥 and taught the lady that gave us the cocos. Also got to meet with Maria! She wanted to meet so badly but we needed a guy to come with to enter her home. It was a fire lesson about the plan of salvation and I can&#x27;t wait to see what happenes this Wednesday.<\/p>\n<p>No soccer friday night sadly. Kinda my luck I guess. 6 weeks in Largo never happened and 18 in cypress gardens and happened 1 or 2 times. Hopefully soon!<\/p>\n<p>Nothing much else to mention for Saturday or Sunday but that we&#x27;ve been calling or passing by the referrals and we&#x27;ve seen some awesome Miracles of people desperately looking for church or some type of light and then we come along and help.<\/p>\n<p>I&#x27;ve learned so much about how the lord prepares us and a way to do his work. I was able to start to use my Portuguese more and improve it more, I became overwhelmed with the amount of work then started to trust in the spirit, I have worried about teaching and found a way to teach simply and powerfully, etc. My mission has engraven many scriptures into me I also testify with Nephi:<\/p>\n<p>I will go and do the things which the Lord hath commanded, for I know that the Lord giveth no commandments unto the children of men, save he shall prepare a way for them that they may accomplish the thing which he commandeth them Nephi 3:7<\/p>\n<p class=\"sign\">Los amo muito meus amigos, bom día!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures<\/p>\n<ul class=\"bul\">\n<li>Diogo @ church with us!<\/li>\n<li>APs &amp; Irmão Benicio<\/li>\n<li>meme<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-07-04_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-04_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-04_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_329.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_330.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_331.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_332.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "✨️🇺🇲Feliz Día de Independencia🎆🎇 Happy Fourth of July Amigos! Hope you can enjoy today with some fun fireworks, BBQ, family, friends, etc. Let me know what's up through an email, messenger (fyi I can't respond), or drop me some pictures. We can't use fireworks of any kind sadly but we're planning on going somewhere to get BBQ with the district today. Well this week was kinda hard, the sheer amount of work (aka referrals) flying in was a little stressful but we survived, found a way to make everything work, and can rest a bit today to make sure we can do it again this one. Our friends are doing pretty awesome, Letty wants to be baptized! We taught her Monday night. She is living with a member and his family so we went over Monday, ate some awesome baliadas, and then taught. We talked about the tree of life and also the gospel (faith, repentance, baptism, holy ghost, and endure to the end). We are excited for her we just need to find a more consistent time to meet but she's reading a ton in the Book of Mormon. Tuesday I went on my first exchange as district leader. Elder Huffaker from South Tampa joined me to speak Spanish. It was pretty fun glad I can do more in the coming weeks. He's working on his Spanish to try to help more! English class this week was pretty awesome we had more people come. One being my new friend, Diogo (Gee-o-goo) which if you didn't realize is now how you would pronounce his name in Spanish, he speaks Portuguese. Luckily I had started some time back learning Portuguese I so I was able to teach him English. He is so awesome and I'm excited to keep learning more Portuguese from him and to teach him English. Drank an entire fresh coconut 🥥 and taught the lady that gave us the cocos. Also got to meet with Maria! She wanted to meet so badly but we needed a guy to come with to enter her home. It was a fire lesson about the plan of salvation and I can't wait to see what happenes this Wednesday. No soccer friday night sadly. Kinda my luck I guess. 6 weeks in Largo never happened and 18 in cypress gardens and happened 1 or 2 times. Hopefully soon! Nothing much else to mention for Saturday or Sunday but that we've been calling or passing by the referrals and we've seen some awesome Miracles of people desperately looking for church or some type of light and then we come along and help. I've learned so much about how the lord prepares us and a way to do his work. I was able to start to use my Portuguese more and improve it more, I became overwhelmed with the amount of work then started to trust in the spirit, I have worried about teaching and found a way to teach simply and powerfully, etc. My mission has engraven many scriptures into me I also testify with Nephi: I will go and do the things which the Lord hath commanded, for I know that the Lord giveth no commandments unto the children of men, save he shall prepare a way for them that they may accomplish the thing which he commandeth them Nephi 3:7 Los amo muito meus amigos, bom día! Elder Jacobs Pictures Diogo @ church with us! APs & Irmão Benicio meme More from this week Brazil"}, {"id": "l56", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Letter 56 · Tampa", "title": "🧉A Vida dum missioneiro é boa 🐲", "date": "2022-07-11T07:40:00", "group": "2022-07", "html": "<div class=\"body\"><p>Ola e bom día meus queridos amigos! Estou aquí na cidade de Tampa desfrutando todo, todo bem!<\/p>\n<p>This week has been awesome because of 2 things mostly. 1. I was scolded pretty hard by the spirit and some other influences, and 2. The changes I made afterwards brought some Miracles. That is truly something hard to accept and boy was it Monday but after a few hours and by the following day I truly felt that Godly sorrow and felt so relieved to repent and make the changes. I know that correction is difficult to accept but in the end needed.<\/p>\n<p>8 But as oft as they repented and sought forgiveness, with real intent, they were forgiven.<\/p>\n<p>Moroni 6:8<\/p>\n<p>Anyways onto the things that happened, besides the portugese in the beginning of the email because I&#x27;m learning that and it&#x27;s been going well this week.<\/p>\n<p>Had an exchange with the Zone Leaders 😳 nah jk it was chill. I taught everything since they don&#x27;t span the Spanish but they do know a thing or two about leadership so that was helpful to know how to help my district better. We had Zone Conference and focused on some key tools and things to help us be master teachers. Teaching like angles. (1 Nephi 11)<\/p>\n<p>Diogo answered a bunch of my questions for portugese and I taught him English. I also shared a short message with him and he understood my Portuguese perfectly. Aos pocos!<\/p>\n<p>Lots of teaching this week and it was awesome. We have a small family we started teaching and they came to church Sunday flipping loved it and have tons of member friends too. I&#x27;m excited to see them go forward. We had 7 friends come to church which was crazy trying to talk to them all and get them situated. I know the Book of Mormon is the word of God and it testifies so powerfully of the truth in every language. God is a loving eternal father that wants to help us which is why we have been blessed with his son&#x27;s sacrifice. That sacrifice is not a fit all band-aid it is an infinitely powerful, specifically made, available to all gift that we just need to reach out and use. As an Elder, friend, brother, etc. I bear my undeniable witness of those things and I will never deny it, in the name of Jesus Christ amen.<\/p>\n<p>Os amo a todos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>trash buddy<\/li>\n<li>bacon rapped chicken (Brazilian bbq)<\/li>\n<li>Charlie (thx for the pic fam!)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-07-11_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-11_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-11_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_333.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🧉A Vida dum missioneiro é boa 🐲 Ola e bom día meus queridos amigos! Estou aquí na cidade de Tampa desfrutando todo, todo bem! This week has been awesome because of 2 things mostly. 1. I was scolded pretty hard by the spirit and some other influences, and 2. The changes I made afterwards brought some Miracles. That is truly something hard to accept and boy was it Monday but after a few hours and by the following day I truly felt that Godly sorrow and felt so relieved to repent and make the changes. I know that correction is difficult to accept but in the end needed. 8 But as oft as they repented and sought forgiveness, with real intent, they were forgiven. Moroni 6:8 Anyways onto the things that happened, besides the portugese in the beginning of the email because I'm learning that and it's been going well this week. Had an exchange with the Zone Leaders 😳 nah jk it was chill. I taught everything since they don't span the Spanish but they do know a thing or two about leadership so that was helpful to know how to help my district better. We had Zone Conference and focused on some key tools and things to help us be master teachers. Teaching like angles. (1 Nephi 11) Diogo answered a bunch of my questions for portugese and I taught him English. I also shared a short message with him and he understood my Portuguese perfectly. Aos pocos! Lots of teaching this week and it was awesome. We have a small family we started teaching and they came to church Sunday flipping loved it and have tons of member friends too. I'm excited to see them go forward. We had 7 friends come to church which was crazy trying to talk to them all and get them situated. I know the Book of Mormon is the word of God and it testifies so powerfully of the truth in every language. God is a loving eternal father that wants to help us which is why we have been blessed with his son's sacrifice. That sacrifice is not a fit all band-aid it is an infinitely powerful, specifically made, available to all gift that we just need to reach out and use. As an Elder, friend, brother, etc. I bear my undeniable witness of those things and I will never deny it, in the name of Jesus Christ amen. Os amo a todos! Elder Jacobs Pictures: trash buddy bacon rapped chicken (Brazilian bbq) Charlie (thx for the pic fam!) More from this week Brazil"}, {"id": "l57", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><\/div>", "cultures": ["BR", "HT"], "moments": [], "extra": "Brazil Haiti", "kind": "Letter 57 · Tampa", "title": "😵Contra el viento 🌬y marea 🌊", "date": "2022-07-18T08:21:00", "group": "2022-07", "html": "<div class=\"body\"><p>Hola amigos,<\/p>\n<p>&quot;Against all odds&quot; is what that means and it explains this week fairly well I think.<\/p>\n<p>We had some challenges with friends, lack of time, and our personal health this week but in the end it was still very productive.<\/p>\n<p>To start off the week, we thought we found another family! We have been earnestly praying and seeking and because of that finding couples and families that can support one another but sadly some of these have decided to not meet with us for the time being. Maybe in the future.<\/p>\n<p>Tuesday after district council, Elder Astorga and I went on exchange in my area. It was a blast serving with him again. I first met him while in Lakeland. We visited a referral who ended up being a Haitian. The first few minutes were strange and a struggle trying to communicate because he knows French and Creole and very little Spanish. But then I asked him about portugese and He did! I was able to practice my Portuguese and help him get in contact with the Creole Elders. Pretty sweet!<\/p>\n<p>But Tuesday didn&#x27;t end that great. After dinner I soon began fighting an extreme pain in the middle of my stomach which became worse as the night went on. By 745 I could stand it so we retreated home to do some Facebook and calls while I tried to rest. Pain didn&#x27;t end up going away and so I call our missionary health coordinator, sister Meese. I got some tums and all seemed well.<\/p>\n<p>Wednesday was a good day, some cool lessons with friends and English class is always a blast. Diogo really wants me to visit him in 🇧🇷 Brazil so that&#x27;s another after mission trip. I&#x27;m going to visit, stay with his family, and eat some churrasco a type of Brazilian BBQ.<\/p>\n<p>Franklin, aka Chiky (homie) from Brandon, asked us to help celebrate his brothers b-day in Tampa so we talked with them and celebrated. We should be able to start teaching them as well.<\/p>\n<p>Frozen tres leches is an interesting sensation and experience. Not fully recommended tho<\/p>\n<p>Friday was when everything stopped going as well again. I had been using tums and feeling better until lunchtime on Friday. We ended up visiting our recent Convert Milton then were told to go to the ER where we spent the next 7 hours. In the end, no appendicitis or anything just some really upset my stomach and so I have some meds and really have to watch what I eat.<\/p>\n<p>The rest of the weekend was still spent proselytizing, Miracles, cool lessons but just not 100% myself. Don&#x27;t worry, I&#x27;m getting better!<\/p>\n<p>2 Nephi 22:2 or Isaiah 12:2<\/p>\n<p>Behold, God is my salvation; I will trust, and not be afraid; for the Lord Jehovah is my strength and my song; he also has become my salvation.<\/p>\n<p>I love the peace, hope, and knowledge that comes through my savior. I know he lives! He is my strength and can be yours as long as you ask and believe on his name!<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p>Elder Jacobo<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>🌧 🌦 🌂 🌈<\/li>\n<li>Dino ducks<\/li>\n<li>ER<\/li>\n<li>Elder Dean &amp; Puppy!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-07-18_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-18_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-18_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-18_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_334.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_335.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_336.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_337.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_338.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "😵Contra el viento 🌬y marea 🌊 Hola amigos, \"Against all odds\" is what that means and it explains this week fairly well I think. We had some challenges with friends, lack of time, and our personal health this week but in the end it was still very productive. To start off the week, we thought we found another family! We have been earnestly praying and seeking and because of that finding couples and families that can support one another but sadly some of these have decided to not meet with us for the time being. Maybe in the future. Tuesday after district council, Elder Astorga and I went on exchange in my area. It was a blast serving with him again. I first met him while in Lakeland. We visited a referral who ended up being a Haitian. The first few minutes were strange and a struggle trying to communicate because he knows French and Creole and very little Spanish. But then I asked him about portugese and He did! I was able to practice my Portuguese and help him get in contact with the Creole Elders. Pretty sweet! But Tuesday didn't end that great. After dinner I soon began fighting an extreme pain in the middle of my stomach which became worse as the night went on. By 745 I could stand it so we retreated home to do some Facebook and calls while I tried to rest. Pain didn't end up going away and so I call our missionary health coordinator, sister Meese. I got some tums and all seemed well. Wednesday was a good day, some cool lessons with friends and English class is always a blast. Diogo really wants me to visit him in 🇧🇷 Brazil so that's another after mission trip. I'm going to visit, stay with his family, and eat some churrasco a type of Brazilian BBQ. Franklin, aka Chiky (homie) from Brandon, asked us to help celebrate his brothers b-day in Tampa so we talked with them and celebrated. We should be able to start teaching them as well. Frozen tres leches is an interesting sensation and experience. Not fully recommended tho Friday was when everything stopped going as well again. I had been using tums and feeling better until lunchtime on Friday. We ended up visiting our recent Convert Milton then were told to go to the ER where we spent the next 7 hours. In the end, no appendicitis or anything just some really upset my stomach and so I have some meds and really have to watch what I eat. The rest of the weekend was still spent proselytizing, Miracles, cool lessons but just not 100% myself. Don't worry, I'm getting better! 2 Nephi 22:2 or Isaiah 12:2 Behold, God is my salvation; I will trust, and not be afraid; for the Lord Jehovah is my strength and my song; he also has become my salvation. I love the peace, hope, and knowledge that comes through my savior. I know he lives! He is my strength and can be yours as long as you ask and believe on his name! Los amo Elder Jacobo Pictures: 🌧 🌦 🌂 🌈 Dino ducks ER Elder Dean & Puppy! More from this week Brazil Haiti"}, {"id": "l58", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CU\">🇨🇺 Cuba<\/span><\/div>", "cultures": ["CU"], "moments": [], "extra": "Cuba", "kind": "Letter 58 · Tampa", "title": "The sweet life", "date": "2022-07-25T15:39:00", "group": "2022-07", "html": "<div class=\"body\"><p>Buenas tardes!<\/p>\n<p>Everything is going great! I&#x27;m feeling better again, eating some Chick-fil-A was awesome today. And the week was pretty decent.<\/p>\n<p>Being district leader made a lot of work this week. 3 exchanges and 3 more this week. And the usual phone calls and meetings. This week overall was good but definitely strange because of how good we were doing previously (especially as a district) then this week hit and in comparison it sucked.<\/p>\n<p>We did have lots of lessons, find some new friends but we had some other friends drop us and not very many members available to help us in lessons.<\/p>\n<p>I&#x27;m very short for time writing today so I&#x27;m sorry! Lots of tracking and phone calls this week with nothing too special. Transfers are in a week so probably won&#x27;t have tons of time next.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>ferrets<\/li>\n<li>bird<\/li>\n<li>some spiky catfish<\/li>\n<li>my new portugese tag!<\/li>\n<li>ducks<\/li>\n<li>cuban pizza<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-07-25_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_339.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_340.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_341.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_342.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_343.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "The sweet life Buenas tardes! Everything is going great! I'm feeling better again, eating some Chick-fil-A was awesome today. And the week was pretty decent. Being district leader made a lot of work this week. 3 exchanges and 3 more this week. And the usual phone calls and meetings. This week overall was good but definitely strange because of how good we were doing previously (especially as a district) then this week hit and in comparison it sucked. We did have lots of lessons, find some new friends but we had some other friends drop us and not very many members available to help us in lessons. I'm very short for time writing today so I'm sorry! Lots of tracking and phone calls this week with nothing too special. Transfers are in a week so probably won't have tons of time next. Los amo! Elder Jacobs Pictures: ferrets bird some spiky catfish my new portugese tag! ducks cuban pizza More from this week Cuba"}, {"id": "l59", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AUG 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colombia<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["CO", "BR"], "moments": ["Baptism"], "extra": "Colombia Brazil", "kind": "Letter 59 · Tampa", "title": "🦤🇨🇴 Locura de un Bautismo! 🌊", "date": "2022-08-01T07:54:00", "group": "2022-08", "html": "<div class=\"body\"><p>Ola amigos! Sim! Um Bautismo!<\/p>\n<p>Elder Dean and I worked really hard this week and transfer and got to experience the baptism of our friend Julian. We prayed together Thursday night and he got an answer for baptism... this Sunday! We ran around like headless chickens trying to get everything done plus 3 exchanges this week so it was something else.<\/p>\n<p>I went all the way to New Port Richey in the Odessa Zone this week. It was interesting but not much happened because of the amount of rain. But I can say I&#x27;ve served in Odessa now (more or less).<\/p>\n<p>We also had our last district council. Elder Dean plays the violin and played the music for us. It was really good, somewhat crazy meeting overall but the Spirit was so strong especially with testimonies and music. We got a pretty awesome referral from Hermano Betancourt. He&#x27;s from 🇨🇴 Colombia and going to teach us how to play his drums some time but he apparently goes tracting! He was a ward missionary and back then the missionaries couldn&#x27;t tract so he tracts and refers jaja! The lesson was sweet! Another one this week with the same friend Leonardo. My Portuguese is improving. I&#x27;m finding more confidence to speak it and with that my fluidity is decent still working on some conjugation and vocabulary but aos pocos (little by little) as Diogo taught me.<\/p>\n<p>We bought some Picanha, a Brazilian cut of steak, and ate like kings. Lots of exchanges this week but all is good. This week I read Jacob 5. There was a little of cool things I noticed but I want to focus on this phrase: &quot;It grieveth me that I should lose this tree&quot;<\/p>\n<p>This tree is a child of God, you a beloved child that he will do anything to help. I currently am the servant of the vineyard as are my fellow missionaries, here to help the lord and show you the same love and care.<\/p>\n<p>God loves you, knows you, and wants to help you but sometimes we ourselves make it difficult to receive it. I testify of that in the name of Jesus Christ, amen.<\/p>\n<p class=\"sign\">Los amo! Até mais tarde!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Baptism of Julian<\/li>\n<li>Elder Mott on exchange in the downpour<\/li>\n<li>the Mott nap<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-08-01_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-01_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-01_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-01_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-01_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_344.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_345.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_346.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🦤🇨🇴 Locura de un Bautismo! 🌊 Ola amigos! Sim! Um Bautismo! Elder Dean and I worked really hard this week and transfer and got to experience the baptism of our friend Julian. We prayed together Thursday night and he got an answer for baptism... this Sunday! We ran around like headless chickens trying to get everything done plus 3 exchanges this week so it was something else. I went all the way to New Port Richey in the Odessa Zone this week. It was interesting but not much happened because of the amount of rain. But I can say I've served in Odessa now (more or less). We also had our last district council. Elder Dean plays the violin and played the music for us. It was really good, somewhat crazy meeting overall but the Spirit was so strong especially with testimonies and music. We got a pretty awesome referral from Hermano Betancourt. He's from 🇨🇴 Colombia and going to teach us how to play his drums some time but he apparently goes tracting! He was a ward missionary and back then the missionaries couldn't tract so he tracts and refers jaja! The lesson was sweet! Another one this week with the same friend Leonardo. My Portuguese is improving. I'm finding more confidence to speak it and with that my fluidity is decent still working on some conjugation and vocabulary but aos pocos (little by little) as Diogo taught me. We bought some Picanha, a Brazilian cut of steak, and ate like kings. Lots of exchanges this week but all is good. This week I read Jacob 5. There was a little of cool things I noticed but I want to focus on this phrase: \"It grieveth me that I should lose this tree\" This tree is a child of God, you a beloved child that he will do anything to help. I currently am the servant of the vineyard as are my fellow missionaries, here to help the lord and show you the same love and care. God loves you, knows you, and wants to help you but sometimes we ourselves make it difficult to receive it. I testify of that in the name of Jesus Christ, amen. Los amo! Até mais tarde! Elder Jacobs Pictures: Baptism of Julian Elder Mott on exchange in the downpour the Mott nap More from this week Colombia Brazil"}, {"id": "l60", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AUG 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Letter 60 · Tampa", "title": "I have twins! 👨‍👦👨‍👦 otro Bautismo 🌊", "date": "2022-08-08T11:22:00", "group": "2022-08", "html": "<div class=\"body\"><p>Ola!<\/p>\n<p>Another week done and pretty eventful!<\/p>\n<p>Monday was our last pday as the old district and we ended it with endless sushi at Koizis.<\/p>\n<p>Tuesday was transfers and I said goodbye to Elder Dean, now in Dade City. But I was without companions! I was with Elder Morris and Cullimore while all 3 of us waited until Thursday when our new trainees get in to Florida. It was awesome trio very fun but also interesting because we stayed in my area but only I could speak Spanish. We did a lot of tracting but after Tuesday &amp; Wednesday we had lessons setup for the rest of the week! Thursday was when I finally met Elder Franson &amp; O&#x27;Neill. 2 sons, companions in the MTC, I&#x27;m a dad to twins! We got to start their first day with a bunch of lessons and preparing Oner for his baptism Saturday. That pattern of lessons followed the rest of the week with barely making time to study Spanish/portugese.<\/p>\n<p>We are teaching a Brazilian family from São Paulo, so it&#x27;s been awesome for my Portuguese and seeing how I can interact and bless more people now.<\/p>\n<p>President Gardiner and his family made it this week to Florida! We got to meet them over zoom but then they, him, his wife, and 12yo daughter Hannah came to our baptism Saturday.<\/p>\n<p>This week I want to testify more about God answering prayers. We met Rigo and his family this week (&amp; pet duck pito) because we got a referral but apparently he saw the Restoration movie and prayed to learn more and we came by and were able to answer all his questions! I&#x27;ve been praying for families and ways to practice more Portuguese and I keep receiving that help.<\/p>\n<p>Matthew 7:7<\/p>\n<p>I testify God does hear your plea and want to help, trust in him!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Jesus loves you<\/li>\n<li>Oner&#x27;s baptism<\/li>\n<li>Bap donuts<\/li>\n<li>bye Elder Dean<\/li>\n<li>Trainees!<\/li>\n<li>1st day already found a fish<\/li>\n<li>chameleon<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-08-08_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-08_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-08_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-08_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-08_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-08_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_347.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_348.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "I have twins! 👨‍👦👨‍👦 otro Bautismo 🌊 Ola! Another week done and pretty eventful! Monday was our last pday as the old district and we ended it with endless sushi at Koizis. Tuesday was transfers and I said goodbye to Elder Dean, now in Dade City. But I was without companions! I was with Elder Morris and Cullimore while all 3 of us waited until Thursday when our new trainees get in to Florida. It was awesome trio very fun but also interesting because we stayed in my area but only I could speak Spanish. We did a lot of tracting but after Tuesday & Wednesday we had lessons setup for the rest of the week! Thursday was when I finally met Elder Franson & O'Neill. 2 sons, companions in the MTC, I'm a dad to twins! We got to start their first day with a bunch of lessons and preparing Oner for his baptism Saturday. That pattern of lessons followed the rest of the week with barely making time to study Spanish/portugese. We are teaching a Brazilian family from São Paulo, so it's been awesome for my Portuguese and seeing how I can interact and bless more people now. President Gardiner and his family made it this week to Florida! We got to meet them over zoom but then they, him, his wife, and 12yo daughter Hannah came to our baptism Saturday. This week I want to testify more about God answering prayers. We met Rigo and his family this week (& pet duck pito) because we got a referral but apparently he saw the Restoration movie and prayed to learn more and we came by and were able to answer all his questions! I've been praying for families and ways to practice more Portuguese and I keep receiving that help. Matthew 7:7 I testify God does hear your plea and want to help, trust in him! Los amo, Elder Jacobs Pictures: Jesus loves you Oner's baptism Bap donuts bye Elder Dean Trainees! 1st day already found a fish chameleon More from this week Brazil"}, {"id": "l61", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AUG 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 61 · Tampa", "title": "😁La panda sonrisa 🐼(the smile gang)🐊", "date": "2022-08-15T12:49:00", "group": "2022-08", "html": "<div class=\"body\"><p>Sonríe porque Jesús te ama!<\/p>\n<p>Buenos días amigos, espero que la semana fue buena!<\/p>\n<p>Our week was good, busy, tough at times but rewarding. We have been staying very busy with teaching friends, activities, recent converts, ect.. the works.<\/p>\n<p>Last Monday was an awesome way to start the week. Another lesson with Rigo, this time the plan of salvation, and setting a baptism date for the 28th! We also snagged a pic with Pìto &amp; Him.<\/p>\n<p>Tuesday was the first district council of the transfer and 14 missionaries in 1 district is a lot of power. Also a constant party 🥳. We set some pretty awesome goals and learned together. Which is what inspired my thought today. We also did an exchange this week with the Carrollwood Elders. It was fun to be with Elder Robinson and also a good way to learn. Elder Franson &amp; Elder O’Neill are excited to do more, they enjoyed it.<\/p>\n<p>I enjoyed the opportunity going to Specialized training with Elder Franson &amp; Elder O&#x27;Neill. We had a lot of fun seeing the other trainers and their trainees, learning, feeling the spirit, and even street contacting on USF campus. We&#x27;ve also been able to enjoy doing some service this week, moving dirt for a garden and cleaning our church building. This week there was an activity trying to guess the district leader so here is all the Elder Jacobs propaganda jaja My thought/message for today is based on a talk/training called the 4th missionary. There is a chart that talks about the quadrant of Miracles. Missionaries with high love and high expectations do well but in order to bring Miracles it also requires high attitude and high effort. Christ was a perfect example of love, expectations, attitude, and effort which is why so many Miracles were brought forth and continue to do so in his name.<\/p>\n<p>Os amo que tenha uma boa semana!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>etch-a-sketch pic &amp; other sketches<\/li>\n<li>Rigo, Pìto and us<\/li>\n<li>La panda Sonrisa<\/li>\n<li>dolphin box<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-08-15_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-15_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-15_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-15_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-15_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-15_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-15_0_6.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_349.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "😁La panda sonrisa 🐼(the smile gang)🐊 Sonríe porque Jesús te ama! Buenos días amigos, espero que la semana fue buena! Our week was good, busy, tough at times but rewarding. We have been staying very busy with teaching friends, activities, recent converts, ect.. the works. Last Monday was an awesome way to start the week. Another lesson with Rigo, this time the plan of salvation, and setting a baptism date for the 28th! We also snagged a pic with Pìto & Him. Tuesday was the first district council of the transfer and 14 missionaries in 1 district is a lot of power. Also a constant party 🥳. We set some pretty awesome goals and learned together. Which is what inspired my thought today. We also did an exchange this week with the Carrollwood Elders. It was fun to be with Elder Robinson and also a good way to learn. Elder Franson & Elder O’Neill are excited to do more, they enjoyed it. I enjoyed the opportunity going to Specialized training with Elder Franson & Elder O'Neill. We had a lot of fun seeing the other trainers and their trainees, learning, feeling the spirit, and even street contacting on USF campus. We've also been able to enjoy doing some service this week, moving dirt for a garden and cleaning our church building. This week there was an activity trying to guess the district leader so here is all the Elder Jacobs propaganda jaja My thought/message for today is based on a talk/training called the 4th missionary. There is a chart that talks about the quadrant of Miracles. Missionaries with high love and high expectations do well but in order to bring Miracles it also requires high attitude and high effort. Christ was a perfect example of love, expectations, attitude, and effort which is why so many Miracles were brought forth and continue to do so in his name. Os amo que tenha uma boa semana! Elder Jacobs Pictures: etch-a-sketch pic & other sketches Rigo, Pìto and us La panda Sonrisa dolphin box More from this week "}, {"id": "l62", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AUG 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><\/div>", "cultures": ["VE", "HT"], "moments": [], "extra": "Venezuela Haiti", "kind": "Letter 62 · Tampa", "title": "🤯A wacky week 🐊& lots of Venezuelans 🇻🇪", "date": "2022-08-22T14:46:00", "group": "2022-08", "html": "<div class=\"body\"><p>Hola Ola Amigos!<\/p>\n<p>This week was another awesome one but as my title says kinda different/wacky/frustrating. I say frustrating because of the amount of lessons set up that didn&#x27;t happen or we didn&#x27;t have a member come to help us teach and friendship our friends.<\/p>\n<p>Please try to go out and help the missionaries with friends: rides or lessons.<\/p>\n<p>The rest of the week was good. Sadly, Elder Morris got really sick and so please pray for a quick recovery for him. We&#x27;ve been trying to do anything we can to help him but it seems to be a slow recovery for now. Today it got bad again so we&#x27;ll see how it will progress.<\/p>\n<p>We had a meeting on with President, Sister, and Hannah Gardiner their daughter. We got to learn more about them, their plans, and how the mission will move forward. I&#x27;m pretty excited, they have so much desire to be here and work. We also taught Hugo &amp; his family on Wenesday which was awesome. He came to church again but his family couldn&#x27;t get work off. He brought a friend and so did our friend Guillermo so we have started our little Corrillo (friend group) of Venezuelans.<\/p>\n<p>I did an exchange with the YSA elders which was pretty fun, very different than Spanish, but fun. I also got to hang out with the Creole Elders since they live together. Elder O’Neill and Elder Franson lead the area solo! No Spanish help from me! But they enjoyed it and did super well.<\/p>\n<p>We filled our extra time this week knocking doors and visiting members trying to strengthen the ward, get to know members, and get help in lessons or Referrals. Which lead to a really special moment administering the Sacrament to a family with Irmão Benicio. It was such a simple sweet testimony Sacrament meeting, I&#x27;ll never forget that moment. I like this scripture and teaching from christ which kinda teaches that same idea of simple spiritual experiences alone. Matthew 6<\/p>\n<p>6 But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly.<\/p>\n<p>7 But when ye pray, use not vain repetitions, as the heathen do: for they think that they shall be heard for their much speaking.<\/p>\n<p>8 Be not ye therefore like unto them: for your Father knoweth what things ye have need of, before ye ask him<\/p>\n<p class=\"sign\">Los amo hasta luego!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Pokémon from McDonald&#x27;s<\/li>\n<li>Hugo &amp; Family<\/li>\n<li>New techdeck/desk set up<\/li>\n<li>I&#x27;m an angel 😇<\/li>\n<li>specialized<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-08-22_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-22_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-22_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-22_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-22_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-22_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_350.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_351.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_352.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🤯A wacky week 🐊& lots of Venezuelans 🇻🇪 Hola Ola Amigos! This week was another awesome one but as my title says kinda different/wacky/frustrating. I say frustrating because of the amount of lessons set up that didn't happen or we didn't have a member come to help us teach and friendship our friends. Please try to go out and help the missionaries with friends: rides or lessons. The rest of the week was good. Sadly, Elder Morris got really sick and so please pray for a quick recovery for him. We've been trying to do anything we can to help him but it seems to be a slow recovery for now. Today it got bad again so we'll see how it will progress. We had a meeting on with President, Sister, and Hannah Gardiner their daughter. We got to learn more about them, their plans, and how the mission will move forward. I'm pretty excited, they have so much desire to be here and work. We also taught Hugo & his family on Wenesday which was awesome. He came to church again but his family couldn't get work off. He brought a friend and so did our friend Guillermo so we have started our little Corrillo (friend group) of Venezuelans. I did an exchange with the YSA elders which was pretty fun, very different than Spanish, but fun. I also got to hang out with the Creole Elders since they live together. Elder O’Neill and Elder Franson lead the area solo! No Spanish help from me! But they enjoyed it and did super well. We filled our extra time this week knocking doors and visiting members trying to strengthen the ward, get to know members, and get help in lessons or Referrals. Which lead to a really special moment administering the Sacrament to a family with Irmão Benicio. It was such a simple sweet testimony Sacrament meeting, I'll never forget that moment. I like this scripture and teaching from christ which kinda teaches that same idea of simple spiritual experiences alone. Matthew 6 6 But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly. 7 But when ye pray, use not vain repetitions, as the heathen do: for they think that they shall be heard for their much speaking. 8 Be not ye therefore like unto them: for your Father knoweth what things ye have need of, before ye ask him Los amo hasta luego! Elder Jacobs Pictures: Pokémon from McDonald's Hugo & Family New techdeck/desk set up I'm an angel 😇 specialized More from this week Venezuela Haiti"}, {"id": "l63", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AUG 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colombia<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["CO", "BR"], "moments": ["Baptism"], "extra": "Colombia Brazil", "kind": "Letter 63 · Tampa", "title": "🤡☠️Locura🤯🥳", "date": "2022-08-29T05:59:00", "group": "2022-08", "html": "<div class=\"body\"><p>Bom día! Como vôces vão? Como foi a semana?<\/p>\n<p>This week was pretty good, pretty stressful so I&#x27;m grateful for pday and some time to chill. We had quite of bit of missionary work to do but more than that was trying to ensure other missionaries&#x27; safety and transportation due to a wreck &amp; another visit to the hospital for Elder Morris; please continue to pray for him and his recovery. Tuesday after district we had a giant feast of fried chicken 🍗 🐔  no pictures but it was 2 large cookie sheets full of it. Then we did an exchange with South Tampa which went fairly well.<\/p>\n<p>This week was very wet, got soaked a few times.<\/p>\n<p>Wednesday, we had english class then an awesome lição (lesson) with the Vieira Family and Irmão (brother) Aluxe. They are super sweet and sincere and I&#x27;m excited to see them in white eventually (no set day for now yet) We are bring Pokémon to give to their son, João, he&#x27;s 6, loves pokemon, and talks a lot!<\/p>\n<p>Thursday and Friday were crazy days because of the previously mentioned return to the hospital then other Elders in my district got in a bad wreck on the freeway. Everyone fine, car totaled, sore bodies. So we tried to have our lessons but it ended up being a lot of hustle and bustle trying to help everyone.<\/p>\n<p>We have a new friend named Christian; he is 25 and from Colombia. He is super cool to talk to and sometimes to much but that&#x27;s how we know henis passionate for the gospel.<\/p>\n<p>We set up, had, and cleaned up a wedding for Alexander &amp; Luísa Garabito. It was fun and they following day after church they were baptized and their daughter Julianna.<\/p>\n<p>This scripture has stuck with me all week since I heard it on Tuesday.<\/p>\n<p>God has a lot of trust in us and wants to give us revelation. We must continue faithfully and asking for it.<\/p>\n<p class=\"sign\">Los amo! El libro es poderosa y la iglesia asombroso!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Rio de Janeiro (Google maps)<\/li>\n<li>Irmão Aluxe &amp; our new Brazilian family Vieira (their little boy loves pokemon jaja)<\/li>\n<li>dolphin box (not otterbox jaja)<\/li>\n<li>Diogo &amp; us<\/li>\n<li>shenanigans<\/li>\n<li>Garabitas wedding!<\/li>\n<li>Brazilian folklore post I made, send me some of the stories for the characters please!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-08-29_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-29_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-08-29_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_7.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-08-29_0_8.png\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_353.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_354.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_355.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_356.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_357.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_358.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_359.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_360.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_361.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🤡☠️Locura🤯🥳 Bom día! Como vôces vão? Como foi a semana? This week was pretty good, pretty stressful so I'm grateful for pday and some time to chill. We had quite of bit of missionary work to do but more than that was trying to ensure other missionaries' safety and transportation due to a wreck & another visit to the hospital for Elder Morris; please continue to pray for him and his recovery. Tuesday after district we had a giant feast of fried chicken 🍗 🐔 no pictures but it was 2 large cookie sheets full of it. Then we did an exchange with South Tampa which went fairly well. This week was very wet, got soaked a few times. Wednesday, we had english class then an awesome lição (lesson) with the Vieira Family and Irmão (brother) Aluxe. They are super sweet and sincere and I'm excited to see them in white eventually (no set day for now yet) We are bring Pokémon to give to their son, João, he's 6, loves pokemon, and talks a lot! Thursday and Friday were crazy days because of the previously mentioned return to the hospital then other Elders in my district got in a bad wreck on the freeway. Everyone fine, car totaled, sore bodies. So we tried to have our lessons but it ended up being a lot of hustle and bustle trying to help everyone. We have a new friend named Christian; he is 25 and from Colombia. He is super cool to talk to and sometimes to much but that's how we know henis passionate for the gospel. We set up, had, and cleaned up a wedding for Alexander & Luísa Garabito. It was fun and they following day after church they were baptized and their daughter Julianna. This scripture has stuck with me all week since I heard it on Tuesday. God has a lot of trust in us and wants to give us revelation. We must continue faithfully and asking for it. Los amo! El libro es poderosa y la iglesia asombroso! Elder Jacobs Pictures: Rio de Janeiro (Google maps) Irmão Aluxe & our new Brazilian family Vieira (their little boy loves pokemon jaja) dolphin box (not otterbox jaja) Diogo & us shenanigans Garabitas wedding! Brazilian folklore post I made, send me some of the stories for the characters please! More from this week Colombia Brazil"}, {"id": "l64", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SEP 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><\/div>", "cultures": ["VE"], "moments": [], "extra": "Venezuela", "kind": "Letter 64 · Tampa", "title": "lasagna & a maze", "date": "2022-09-05T14:08:00", "group": "2022-09", "html": "<div class=\"body\"><p>Como estan amigos! Siempre una Fiesta y estamos muchas payasadas acá! 🤡🥳<\/p>\n<p>I hope you&#x27;ve had a radical week, our week was pretty good.<\/p>\n<p>We&#x27;ve gotten back into contact with our friend Maria. She still isn&#x27;t great at answering us but has a huge desire to learn so I&#x27;m excited that we get to start teaching her once again. We&#x27;ve also started teaching Enrique&#x27;s girlfriend soon to be wife. Overall lots of cool new friends this week. No lessons in portugese, our friends couldn&#x27;t meet  but still practicing a lot (its hard with more limited resources).<\/p>\n<p>Our friend Emmelina is on date now! She has been learning a while and now is constantly waiting our messages. I&#x27;m super excited for her. Please pray for her health.<\/p>\n<p>I tried Venezuelan lasagna, Hugo &amp; his family made it. Very good, different but I did like it and we had a pretty fire lesson. We&#x27;ll see when we can set a date with them.<\/p>\n<p>Tastes like ham, cheese, red sauce, ground beef, noodles, and just slightly different basically. In enlgish class, we made a maze out of chairs and had the students practice giving directions. Then I did the same for my trainees to practice their listening (forgot to grab a pic).<\/p>\n<p>Nothing much else to note, we&#x27;ve been grinding trying to clean our area book and finish other stuff. Hopefully we can finish all these and get to some good &#x27;ol tracting (did get some done this week)..<\/p>\n<p>Thought for the week: Mosiah 8<\/p>\n<p>16 And Ammon said that a seer is a revelator and a prophet also; and a gift which is greater can no man have, except he should possess the power of God, which no man can; yet a man may have great power given him from God. 17 But a seer can know of things which are past, and also of things which are to come, and by them shall all things be revealed, or, rather, shall secret things be made manifest, and hidden things shall come to light, and things which are not known shall be made known by them, and also things shall be made known by them which otherwise could not be known. 18 Thus God has provided a means that man, through faith, might work mighty miracles; therefore he becometh a great benefit to his fellow beings.<\/p>\n<p>We are all so blessed to receive revelation and in a way become a seer. And sometimes our answer is no but not a no forever but not now. Trust in God!<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs 🦆<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>mail boxes of Florida<\/li>\n<li>primary time jaja<\/li>\n<li>we made a reel on Facebook (this time in english)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-09-05_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-09-05_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_362.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_363.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "lasagna & a maze Como estan amigos! Siempre una Fiesta y estamos muchas payasadas acá! 🤡🥳 I hope you've had a radical week, our week was pretty good. We've gotten back into contact with our friend Maria. She still isn't great at answering us but has a huge desire to learn so I'm excited that we get to start teaching her once again. We've also started teaching Enrique's girlfriend soon to be wife. Overall lots of cool new friends this week. No lessons in portugese, our friends couldn't meet but still practicing a lot (its hard with more limited resources). Our friend Emmelina is on date now! She has been learning a while and now is constantly waiting our messages. I'm super excited for her. Please pray for her health. I tried Venezuelan lasagna, Hugo & his family made it. Very good, different but I did like it and we had a pretty fire lesson. We'll see when we can set a date with them. Tastes like ham, cheese, red sauce, ground beef, noodles, and just slightly different basically. In enlgish class, we made a maze out of chairs and had the students practice giving directions. Then I did the same for my trainees to practice their listening (forgot to grab a pic). Nothing much else to note, we've been grinding trying to clean our area book and finish other stuff. Hopefully we can finish all these and get to some good 'ol tracting (did get some done this week).. Thought for the week: Mosiah 8 16 And Ammon said that a seer is a revelator and a prophet also; and a gift which is greater can no man have, except he should possess the power of God, which no man can; yet a man may have great power given him from God. 17 But a seer can know of things which are past, and also of things which are to come, and by them shall all things be revealed, or, rather, shall secret things be made manifest, and hidden things shall come to light, and things which are not known shall be made known by them, and also things shall be made known by them which otherwise could not be known. 18 Thus God has provided a means that man, through faith, might work mighty miracles; therefore he becometh a great benefit to his fellow beings. We are all so blessed to receive revelation and in a way become a seer. And sometimes our answer is no but not a no forever but not now. Trust in God! Los amo! Elder Jacobs 🦆 Pictures: mail boxes of Florida primary time jaja we made a reel on Facebook (this time in english) More from this week Venezuela"}, {"id": "l65", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SEP 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["BR", "HT"], "moments": ["Baptism"], "extra": "Brazil Haiti", "kind": "Letter 65 · Tampa", "title": "💪Quad Squad🤡🤡🤡🤡", "date": "2022-09-12T12:43:00", "group": "2022-09", "html": "<div class=\"body\"><p>Otra semana terminada y otro traslado! Y fue buenisimo!<\/p>\n<p>To explain the title of the email, we found out Monday night that we would be receiving Elder Gundersen! And become a quad on Thursday since his previous companion and other Haitian Creole missionaries were getting trainees/new companions.<\/p>\n<p>We did 2 exchanges this week, one with Carrollwood (Elder Griffin) and the other with South Tampa (Elder Day). Super fun and got to really see how much these Elders have grown this transfer.<\/p>\n<p>Our friends are doing great. Samuel has a baptism date for the 25th! Diogo&#x27;s family gets here on Saturday! And we found a ton more new peeps.<\/p>\n<p>Part if that being the quad. While 2 of us were teaching set lessons the other 2 had the phones and were setting up more appointments or knocking doors nearby. Absolutely goated! 🐐<\/p>\n<p>We had interviews with President which was awesome getting to know him more, the plan for the future of the mission, and also the spirit work through him. We also have transfer news:<\/p>\n<p>Elder O&#x27;Neill to Rio Vista A<\/p>\n<p>Elder Franson to Dade City Sp (with Elder Dean!)<\/p>\n<p>Elder Gundersen to Rio Vista B<\/p>\n<p>And I am staying and getting Elder Rogers (just finished his training) and a new missionary! (He will be going to Brazil so I can help teach and practice portugese!)<\/p>\n<p>Stake Conference was this weekend which resulted in lots of spiritual power and extra food for us jaja. Elder Ojediran talked a lot about the spirit and the Sacrament and how we take the Sacrament get the spirit more fully then are pushed to keep clean/repent and continue the cycle with the Sacrament. So this next Sunday think more about Christ and the spirit while taking the Sacrament<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>quad meme<\/li>\n<li>stake conference with ALL the missionaries<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-09-12_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-12_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-12_1_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-09-12_1_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "💪Quad Squad🤡🤡🤡🤡 Otra semana terminada y otro traslado! Y fue buenisimo! To explain the title of the email, we found out Monday night that we would be receiving Elder Gundersen! And become a quad on Thursday since his previous companion and other Haitian Creole missionaries were getting trainees/new companions. We did 2 exchanges this week, one with Carrollwood (Elder Griffin) and the other with South Tampa (Elder Day). Super fun and got to really see how much these Elders have grown this transfer. Our friends are doing great. Samuel has a baptism date for the 25th! Diogo's family gets here on Saturday! And we found a ton more new peeps. Part if that being the quad. While 2 of us were teaching set lessons the other 2 had the phones and were setting up more appointments or knocking doors nearby. Absolutely goated! 🐐 We had interviews with President which was awesome getting to know him more, the plan for the future of the mission, and also the spirit work through him. We also have transfer news: Elder O'Neill to Rio Vista A Elder Franson to Dade City Sp (with Elder Dean!) Elder Gundersen to Rio Vista B And I am staying and getting Elder Rogers (just finished his training) and a new missionary! (He will be going to Brazil so I can help teach and practice portugese!) Stake Conference was this weekend which resulted in lots of spiritual power and extra food for us jaja. Elder Ojediran talked a lot about the spirit and the Sacrament and how we take the Sacrament get the spirit more fully then are pushed to keep clean/repent and continue the cycle with the Sacrament. So this next Sunday think more about Christ and the spirit while taking the Sacrament Los amo! Elder Jacobs Pictures: quad meme stake conference with ALL the missionaries Brazil Haiti"}, {"id": "l66", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SEP 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Letter 66 · Tampa", "title": "👨‍👦Meu novo filho!🤡", "date": "2022-09-19T08:01:00", "group": "2022-09", "html": "<div class=\"body\"><p>Bom día meus queridos amigos!<\/p>\n<p>Tive uma semana muitíssima boa e legal na missão!<\/p>\n<p>As in the last email, transfers was Tuesday and I lost my companions but all is good, I have some equally awesome ones. Elder Rogers is super funny and from Round Valley, AZ and Elder Towne (our brand new trainee) is from Gilbert! What luck triple AZ!<\/p>\n<p>Elder Towne will eventually leave, not sure when depends on visa, to Capinas, Brazil! It&#x27;s been a dream speaking portugese with him and friends along with the sheer stream of jokes in our companionship as a whole. While waiting to get him on Thrusday we were with Elder Argyle! He and I were companions a few months ago but only for 6 days and now I&#x27;ve finally hit a little over a week jaja!<\/p>\n<p>The beginning of the week before we got Elder Towne was a bunch of lessons and trying to find not to much avail but oh well. Our English class has been growing and has a lot of good fun vibes so I&#x27;m excited for the future of it. Samuel will be baptized next week, stay tuned for that 😉<\/p>\n<p>Yolennis, Enrique&#x27;s girlfriend, will be baptized in a few weeks as well.<\/p>\n<p>Our other friends are doing super well. Nicolas wants to be baptized and came to church yesterday and loved it! Emmelina still wants to but her health is not the greatest. Guillermo and Genesis and their kids (Jorge, Ester, and Guillermo jr.) Are doing well, also came to church but are still looking for a new apartment/ house. So pray for these friends.<\/p>\n<p>Something President said that I loved is, &quot;We are here to inspire&quot; because instead of dropping the hammer Christ always stood firm in his beliefs but encouraged and inspired others to change and improvement. We are his disciples and as such should try to emulate him and be an example of the believers.<\/p>\n<p>1 Timothy 4:12<\/p>\n<p>Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity<\/p>\n<p>Well I&#x27;m excited for this transfer and the future. Let me know anything going on in your lives. Friday we have specialized and I&#x27;ll get to see more missionary friends &amp; go crazy finding on USF campus lol.<\/p>\n<p class=\"sign\">Los Amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Elder Rogers &amp; Elder Argyle<\/li>\n<li>Elder Towne!<\/li>\n<li>Pokémon time<\/li>\n<li>Quad<\/li>\n<li>Bye bye Mijos!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-09-19_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_364.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_365.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_366.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_367.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_368.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "👨‍👦Meu novo filho!🤡 Bom día meus queridos amigos! Tive uma semana muitíssima boa e legal na missão! As in the last email, transfers was Tuesday and I lost my companions but all is good, I have some equally awesome ones. Elder Rogers is super funny and from Round Valley, AZ and Elder Towne (our brand new trainee) is from Gilbert! What luck triple AZ! Elder Towne will eventually leave, not sure when depends on visa, to Capinas, Brazil! It's been a dream speaking portugese with him and friends along with the sheer stream of jokes in our companionship as a whole. While waiting to get him on Thrusday we were with Elder Argyle! He and I were companions a few months ago but only for 6 days and now I've finally hit a little over a week jaja! The beginning of the week before we got Elder Towne was a bunch of lessons and trying to find not to much avail but oh well. Our English class has been growing and has a lot of good fun vibes so I'm excited for the future of it. Samuel will be baptized next week, stay tuned for that 😉 Yolennis, Enrique's girlfriend, will be baptized in a few weeks as well. Our other friends are doing super well. Nicolas wants to be baptized and came to church yesterday and loved it! Emmelina still wants to but her health is not the greatest. Guillermo and Genesis and their kids (Jorge, Ester, and Guillermo jr.) Are doing well, also came to church but are still looking for a new apartment/ house. So pray for these friends. Something President said that I loved is, \"We are here to inspire\" because instead of dropping the hammer Christ always stood firm in his beliefs but encouraged and inspired others to change and improvement. We are his disciples and as such should try to emulate him and be an example of the believers. 1 Timothy 4:12 Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity Well I'm excited for this transfer and the future. Let me know anything going on in your lives. Friday we have specialized and I'll get to see more missionary friends & go crazy finding on USF campus lol. Los Amo, Elder Jacobs Pictures: Elder Rogers & Elder Argyle Elder Towne! Pokémon time Quad Bye bye Mijos! More from this week Brazil"}, {"id": "l67", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SEP 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🌀 Hurricane<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism", "Hurricane"], "extra": "Brazil", "kind": "Letter 67 · Tampa", "title": "🌤La tranquilidad antes de la tormenta🌀🌊", "date": "2022-09-26T05:22:00", "group": "2022-09", "html": "<div class=\"body\"><p>Gracias a todos! I did have a good birthday Friday. Most of Friday was a meeting for Trainers &amp; Trainees but afterwards we got dinner at Chick-fil-A.<\/p>\n<p>This week was pretty fun and even though the title says calm before.the storm, this week felt like a tormentita in some parts aswell.<\/p>\n<p>Last Monday evening was super bomb, we got to teach our Brazilian family again and they had a lot of questions about the plan of salvation (what a coincidence that&#x27;s what we had planned to teach). Sadly our Member was working and couldn&#x27;t make it so our lesson was long trying to explain everything well enough in our limited portugese (Elder Towne &amp; I) but they enjoyed it. We also gave João, he&#x27;s 6, some Pokémon!<\/p>\n<p>Tuesday we had a fire district council and a exchange with South Tampa Elders. We did stop by + knocking on our way home and found a member family that had just moved in a week prior.<\/p>\n<p>I taught Elder Towne &amp; Rogers how to have an awesome weekly planning session... aka Make Arepas. Absolutely goated. Idk why these aren&#x27;t more popular.<\/p>\n<p>And the best part was our friend, Samuel, got baptized finally yesterday! He had been waiting months and finally was ready. It was a super sweet service and I know we&#x27;ll see lots of good things out of him.<\/p>\n<p>We got news Friday if the Hurricane from President Gardiner. So we have been preparing with water, food, gas, ect. But we&#x27;ll see how under or over prepared we are. My companions and I are getting evacuated from our apartment to the mission home in Wesley Chapel today. We&#x27;ll see how missionary work happens this week.<\/p>\n<p>Matthew 6:6 But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly<\/p>\n<p>I have been trying to have a secret pray once a day and it has really helped me with my relationship with God. I know he lives, listens and answers my prayers but not only answer talks to me and you as we act and ask in faith.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Samuel&#x27;s baptism<\/li>\n<li>Spanish meme<\/li>\n<li>Elder Rogers trying to be free from zipties (he did it himself 🤡 we eventually found scissors)<\/li>\n<li>Elder Rogers and I from behind? (Elder Nelson snapped the pic)<\/li>\n<li>my new crocs (yes Ryan, I do like them shouldn&#x27;t have waited so long)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-09-26_0_0.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-09-26_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-26_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-26_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-26_0_4.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-09-26_0_5.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_369.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_370.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_371.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_372.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_373.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_374.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_375.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_376.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_377.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_378.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_379.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_380.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🌤La tranquilidad antes de la tormenta🌀🌊 Gracias a todos! I did have a good birthday Friday. Most of Friday was a meeting for Trainers & Trainees but afterwards we got dinner at Chick-fil-A. This week was pretty fun and even though the title says calm before.the storm, this week felt like a tormentita in some parts aswell. Last Monday evening was super bomb, we got to teach our Brazilian family again and they had a lot of questions about the plan of salvation (what a coincidence that's what we had planned to teach). Sadly our Member was working and couldn't make it so our lesson was long trying to explain everything well enough in our limited portugese (Elder Towne & I) but they enjoyed it. We also gave João, he's 6, some Pokémon! Tuesday we had a fire district council and a exchange with South Tampa Elders. We did stop by + knocking on our way home and found a member family that had just moved in a week prior. I taught Elder Towne & Rogers how to have an awesome weekly planning session... aka Make Arepas. Absolutely goated. Idk why these aren't more popular. And the best part was our friend, Samuel, got baptized finally yesterday! He had been waiting months and finally was ready. It was a super sweet service and I know we'll see lots of good things out of him. We got news Friday if the Hurricane from President Gardiner. So we have been preparing with water, food, gas, ect. But we'll see how under or over prepared we are. My companions and I are getting evacuated from our apartment to the mission home in Wesley Chapel today. We'll see how missionary work happens this week. Matthew 6:6 But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly I have been trying to have a secret pray once a day and it has really helped me with my relationship with God. I know he lives, listens and answers my prayers but not only answer talks to me and you as we act and ask in faith. Los amo! Elder Jacobs Pictures: Samuel's baptism Spanish meme Elder Rogers trying to be free from zipties (he did it himself 🤡 we eventually found scissors) Elder Rogers and I from behind? (Elder Nelson snapped the pic) my new crocs (yes Ryan, I do like them shouldn't have waited so long) More from this week Brazil"}, {"id": "l68", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span cl
