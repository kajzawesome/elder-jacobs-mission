ing because of his jokes and funny stories.<\/p>\n<p>This week we got a 3rd phone. Our service has been really bad with t-mobile and AT&amp;T since we live and work in the boonies. So we have been given a 3rd phone that is through Verizon (if it doesn&#x27;t work we get wifi). Luckily it has been working phenomenally but was a little annoying this week. We tried activating it in the morning of Tuesday but didn&#x27;t hear anything til Wednesday. The day we decided to leave it home because we hadn&#x27;t heard anything when we left the apartment. And with our luck it activated while we were out at Dade city (25min drive home) so we were without a phone. It&#x27;s all figured out now and we have to remember the 3rd phone which is kinda annoying/funny since it&#x27;s the same one and case as Elder Ricks&#x27;.<\/p>\n<p>This last Saturday we had a stake Latin America cultural night. It was super awesome with tons of food, decorations, music, and dancing from all these different countries. Tons of members, friends, and other missionaries came so it was a huge success. The people just kept piling up our plates with food if they were empty and we walked by their table haha. This transfer has been great and seen tons of miracles especially when we have just wandered the streets going where we feel prompted. This week we wandered into a new area that had never been touched and found some new friends who seem pretty interested. I know the savior walks with us everyday and I&#x27;m excited for this upcoming transfer. (Hopefully my spanish is good enough to train...).<\/p>\n<p>Well I&#x27;m off to p-day, packing, and saying bye to people here.<\/p>\n<p>Hasta la proxima semana when I&#x27;ll be in my new area and with new companions,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>district tyedye<\/li>\n<li>Elder Jenson &amp; I with our Happy meal toy hei heis (moana) street contacting<\/li>\n<li>crazy cloud<\/li>\n<li>church (Elder Ricks &amp; I)<\/li>\n<li>Us and the Miños (Joaquin, Jared, Hermana Lucy Miño, &amp; Hermano Juan Miño)<\/li>\n<\/ul>\n<p>Warning: road kill part of course<\/p>\n<ul class=\"bul\">\n<li>cat...<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-10-11_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-10-11_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-10-11_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-10-11_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-11_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_077.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_078.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_079.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_080.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_081.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐊 What?! I'm all grown up now 🥸👨‍🎓🏴‍☠️ Buenos Días amigos míos! This week has been awesome and sadly as I found out my last one in the Dirty Dade city. I found out yesterday around dinner time. I will be leaving to Lakeland to go with Elder Olayan and Izu. Elder Olayan will be dying (going home) and Elder Izu is finishing his training with me! I just finished my training so I hope this goes well. It also sadly means that I may not be able to go to Juan's baptism next Sunday. I'm going to ask president but if not it'll be by zoom. The other transfer news we recieved is: Elder Ricks is going to the Dominican Republic the 28th but before then getting Elder Makechnie and a fresh trainee. Elder Ricks (not my companion but same apartment) is going to Sarasota with Elder Miller. And Elder Leonard is staying and receiving Elder Hansen. There are a lot of changes in the district and mission all around so pretty crazy. This week we had 2 exchanges! One with the other Elder Ricks in Dade city spanish with me and the other in Wesley Chapel with Elder Jenson. Both were super fun and I learned a lot about them and how to improve. Then on Friday Elder Thompson and Eaton exchanged with the english elders. So we kinda got to hangout with Elder Thompson who his hilarious. Lots of laughing because of his jokes and funny stories. This week we got a 3rd phone. Our service has been really bad with t-mobile and AT&T since we live and work in the boonies. So we have been given a 3rd phone that is through Verizon (if it doesn't work we get wifi). Luckily it has been working phenomenally but was a little annoying this week. We tried activating it in the morning of Tuesday but didn't hear anything til Wednesday. The day we decided to leave it home because we hadn't heard anything when we left the apartment. And with our luck it activated while we were out at Dade city (25min drive home) so we were without a phone. It's all figured out now and we have to remember the 3rd phone which is kinda annoying/funny since it's the same one and case as Elder Ricks'. This last Saturday we had a stake Latin America cultural night. It was super awesome with tons of food, decorations, music, and dancing from all these different countries. Tons of members, friends, and other missionaries came so it was a huge success. The people just kept piling up our plates with food if they were empty and we walked by their table haha. This transfer has been great and seen tons of miracles especially when we have just wandered the streets going where we feel prompted. This week we wandered into a new area that had never been touched and found some new friends who seem pretty interested. I know the savior walks with us everyday and I'm excited for this upcoming transfer. (Hopefully my spanish is good enough to train...). Well I'm off to p-day, packing, and saying bye to people here. Hasta la proxima semana when I'll be in my new area and with new companions, Elder Jacobs Pictures: district tyedye Elder Jenson & I with our Happy meal toy hei heis (moana) street contacting crazy cloud church (Elder Ricks & I) Us and the Miños (Joaquin, Jared, Hermana Lucy Miño, & Hermano Juan Miño) Warning: road kill part of course cat... More from this week Dominican Republic"}, {"id": "l18", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">OCT 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><\/div>", "cultures": ["PR"], "moments": [], "extra": "Puerto Rico", "kind": "Letter 18 · Lakeland", "title": "✌Bienvenidos from Lakeland 💦🐊", "date": "2021-10-18T15:41:00", "group": "2021-10", "html": "<div class=\"body\"><p>Hola amigos!<\/p>\n<p>This week has been pretty awesome because of my new companions and area. Lakeland is super cool and very different from the Dirty Dade but in a good way. My companions, Elder Olayan and Izu, are super awesome. Elder Olayan leaves at the end of this transfer so he considers us both his trainees, old missionary vibes. Elder Izu is pretty awesome companion/trainee/mission son. He is part Puerto Rican but didn&#x27;t know spanish before so everyone asumes that he knows more than us gringos but then he starts speaking and they are confused because he is still learning and his looks deceive (just like us gringos, I&#x27;m still getting asked sometimes if I know spanish then I surprise them when I talk). He is doing really well though! Knows a ton maybe more than I did at the beginning of my second transfer. The area is pretty cool because of all the lakes and people we meet. Lots of latinos but scattered about in the city. Dade City is puny in comparison. I&#x27;m struggling to remember names and directions since I&#x27;m the driver now but I&#x27;m getting there. We have a decent number of friends but Struggle with getting them to church because the building is far. There used to be 2 branches but then they combined to be a ward and so the building changed. We&#x27;re trying to figure out rides better.<\/p>\n<p>The only story from this week is a guy doing porch-ology (theology at his porch). He called us over and we started talking because he had some questions about our church but quickly realized that he low-key wanted to bash or has he calls it &quot;open our eyes.&quot; He was trying to explain to us all sorts of things about races and in the Bible and totally interpreted verses differently than we did so he got annoyed at us. In the end, we realized his was just trying to make us believe that Jesus was black and all the pictures were wrong.<\/p>\n<p>Next week I&#x27;ll make sure to make better time so I can type more. Because I&#x27;m pretty sure I have more stories I just am forgetting.<\/p>\n<p class=\"sign\">Hasta luego,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>accident we saw<\/li>\n<li>picture at transfers before leaving<\/li>\n<li>mini coconut<\/li>\n<li>tried Pho it was pretty good (I think I like Ramen more still)<\/li>\n<\/ul>\n<p>Next week I&#x27;ll remember a picture of my new companions<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-10-18_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-10-18_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-10-18_0_2.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_082.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_083.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "✌Bienvenidos from Lakeland 💦🐊 Hola amigos! This week has been pretty awesome because of my new companions and area. Lakeland is super cool and very different from the Dirty Dade but in a good way. My companions, Elder Olayan and Izu, are super awesome. Elder Olayan leaves at the end of this transfer so he considers us both his trainees, old missionary vibes. Elder Izu is pretty awesome companion/trainee/mission son. He is part Puerto Rican but didn't know spanish before so everyone asumes that he knows more than us gringos but then he starts speaking and they are confused because he is still learning and his looks deceive (just like us gringos, I'm still getting asked sometimes if I know spanish then I surprise them when I talk). He is doing really well though! Knows a ton maybe more than I did at the beginning of my second transfer. The area is pretty cool because of all the lakes and people we meet. Lots of latinos but scattered about in the city. Dade City is puny in comparison. I'm struggling to remember names and directions since I'm the driver now but I'm getting there. We have a decent number of friends but Struggle with getting them to church because the building is far. There used to be 2 branches but then they combined to be a ward and so the building changed. We're trying to figure out rides better. The only story from this week is a guy doing porch-ology (theology at his porch). He called us over and we started talking because he had some questions about our church but quickly realized that he low-key wanted to bash or has he calls it \"open our eyes.\" He was trying to explain to us all sorts of things about races and in the Bible and totally interpreted verses differently than we did so he got annoyed at us. In the end, we realized his was just trying to make us believe that Jesus was black and all the pictures were wrong. Next week I'll make sure to make better time so I can type more. Because I'm pretty sure I have more stories I just am forgetting. Hasta luego, Elder Jacobs Pictures: accident we saw picture at transfers before leaving mini coconut tried Pho it was pretty good (I think I like Ramen more still) Next week I'll remember a picture of my new companions More from this week Puerto Rico"}, {"id": "l19", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">OCT 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Letter 19 · Lakeland", "title": "🍙🍩🐊Free food! 🌮🌯🍔🌭", "date": "2021-10-25T13:06:00", "group": "2021-10", "html": "<div class=\"body\"><p>Bienvenidos de nuevo amigos míos,<\/p>\n<p>Another week done in the land of lakes, Lakeland. I&#x27;m loving my time here and I&#x27;m constantly learning. This week I have learned more on training since Elder Seamons (Neamons jaja our district leader) came over on exchange. It was super fun. Lowkey was just like hanging out with a friend all day but also doing missionary work seeing tons of success. This week was pretty normal with the usual studies and then finding/lessons. The best things of this week was all the free meals and friends came to church. We had 2 friends come to church even though it&#x27;s 35min away. We got fed 3 times this week just randomly. We would show up to a house to stop by, see how they are doing, and possibly teach but our luck this week would be: we show up, get invited in, como esta?, share a message, then they would plate up some food they had just made! Super good and epic; especially since some of those times we hadn&#x27;t brought food but were far from the apartment.<\/p>\n<p>My favorite one was yesterday, Sunday, because we went in and it was band practice night! We got to have a show, share a message, and then eat. Very epic hopefully the video looks fine.<\/p>\n<p>Party on folks! I&#x27;m going to get back to playing a certain unnamed card game about pocket monsters...teehee Hasta lasagna but don&#x27;t get it on ya,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Sunset<\/li>\n<li>ticket to heaven (from Vidal a new Convert jaja) 🥳<\/li>\n<li>one of the many weird Pictures from exchange with Elder Nuff Neamons 🦍<\/li>\n<li>stopped by and got fed and heard a band play! 😎🪅 (Elder Olayan has his tongue out while rocking out)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-10-25_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-25_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-25_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_084.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_085.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🍙🍩🐊Free food! 🌮🌯🍔🌭 Bienvenidos de nuevo amigos míos, Another week done in the land of lakes, Lakeland. I'm loving my time here and I'm constantly learning. This week I have learned more on training since Elder Seamons (Neamons jaja our district leader) came over on exchange. It was super fun. Lowkey was just like hanging out with a friend all day but also doing missionary work seeing tons of success. This week was pretty normal with the usual studies and then finding/lessons. The best things of this week was all the free meals and friends came to church. We had 2 friends come to church even though it's 35min away. We got fed 3 times this week just randomly. We would show up to a house to stop by, see how they are doing, and possibly teach but our luck this week would be: we show up, get invited in, como esta?, share a message, then they would plate up some food they had just made! Super good and epic; especially since some of those times we hadn't brought food but were far from the apartment. My favorite one was yesterday, Sunday, because we went in and it was band practice night! We got to have a show, share a message, and then eat. Very epic hopefully the video looks fine. Party on folks! I'm going to get back to playing a certain unnamed card game about pocket monsters...teehee Hasta lasagna but don't get it on ya, Elder Jacobs Pictures: Sunset ticket to heaven (from Vidal a new Convert jaja) 🥳 one of the many weird Pictures from exchange with Elder Nuff Neamons 🦍 stopped by and got fed and heard a band play! 😎🪅 (Elder Olayan has his tongue out while rocking out) More from this week "}, {"id": "l20", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 20 · Lakeland", "title": "👻 Feliz noche de brujas 🛸 & Zone conference 🪅", "date": "2021-11-01T05:44:00", "group": "2021-11", "html": "<div class=\"body\"><p>Hola mis amigos, cómo les va?<\/p>\n<p>Late happy Halloween! 👻<\/p>\n<p>Also happy November!<\/p>\n<p>This week was straight 🔥 because we set 3 baptism dates! Our friend Danicha &amp; her husband, Javier, who we hadn&#x27;t taught before, and our friend Teodoro. This week we had beginning to notice that some of our friends haven&#x27;t been super solid in their commitments so we got to the dunk&#x27;em or drop&#x27;em stage. We had multiple lessons this week that got canceled last minute or they weren&#x27;t home like the said which is what caused this fase. It worked out in our favor because now we know that these friends actually do care just lifes been busy but baptism is there desire. While these lack of set lessons was annoying, it meant we did a lot of walkie talkie. We taught some pretty cool on the spot lessons with some people and actually may be able to come back to talk more. It&#x27;s not the same as Dade city where there are always people outside but maybe in these next few weeks since the weather is cooling down nicely. The other awesome thing this week was Zone conference. We learned a lot of things that really answered some of my questions as a trainer. I feel like I&#x27;m doing alright but there are other times that I know I just don&#x27;t understand how to teach/help Elder Izu understand and progress that little more but that&#x27;s why Zone conference and Elder Olayan are so helpful to me.<\/p>\n<p>The big focus of Zone conference was preach my gospel (pmg) and the book of Mormon. We need to make sure we are applying everyday PMG to become better missionaries but also the book of Mormon so we have a strong testimony and spirit with us when we teach. The book of Mormon has been a pretty constant theme for the past month or so in other district councils and the last Zone conference. Personally I&#x27;ve never understood its power until recently. The scriptures we share from it and the difference I feel the days I do read have really been a testimony builder. I know now more that ever that this book is like or even better than the Bible and can change lives. I read one of my favorite stories this week about the Anti-Nephi-lehites. They loved the lord so much, learned from the spirit, and repented that they would not fight anymore to show how dedicated they were to follow Christ and keep the commandments. It&#x27;s hard to be this righteous and also loving to everyone (especially those bashers out there) but through christ we can be one people so there are no more -ites (4 Nephi 1:17).<\/p>\n<p>The last thing I want to share this week is about the authority missionaries have. I&#x27;ve really noticed this week in various situations that people trust and recognize who we are. They even sometimes reveal some really personal things and it&#x27;s been really special to be recognized as such representatives. It also works the other way. When we recognize who they are as a friend and child of God it becomes so much easier to teach them and also understand despite it being a different language (with at times very hard accents).<\/p>\n<p>Les amo muchísimos mis amigos (sorry if you were hoping for a little more funny/story time but I wanted to share some more of the spiritual stuff and growth I&#x27;ve had and seen) hasta la próxima,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>🤮🎃<\/li>\n<li>new statue because Gibsonia Elders keep picking up random objects from the side of the road and sneaking them in<\/li>\n<li>exercise bike ^^^^<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-11-01_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-01_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-01_0_2.jpg\" alt=\"\"><\/figure><\/div>", "text": "👻 Feliz noche de brujas 🛸 & Zone conference 🪅 Hola mis amigos, cómo les va? Late happy Halloween! 👻 Also happy November! This week was straight 🔥 because we set 3 baptism dates! Our friend Danicha & her husband, Javier, who we hadn't taught before, and our friend Teodoro. This week we had beginning to notice that some of our friends haven't been super solid in their commitments so we got to the dunk'em or drop'em stage. We had multiple lessons this week that got canceled last minute or they weren't home like the said which is what caused this fase. It worked out in our favor because now we know that these friends actually do care just lifes been busy but baptism is there desire. While these lack of set lessons was annoying, it meant we did a lot of walkie talkie. We taught some pretty cool on the spot lessons with some people and actually may be able to come back to talk more. It's not the same as Dade city where there are always people outside but maybe in these next few weeks since the weather is cooling down nicely. The other awesome thing this week was Zone conference. We learned a lot of things that really answered some of my questions as a trainer. I feel like I'm doing alright but there are other times that I know I just don't understand how to teach/help Elder Izu understand and progress that little more but that's why Zone conference and Elder Olayan are so helpful to me. The big focus of Zone conference was preach my gospel (pmg) and the book of Mormon. We need to make sure we are applying everyday PMG to become better missionaries but also the book of Mormon so we have a strong testimony and spirit with us when we teach. The book of Mormon has been a pretty constant theme for the past month or so in other district councils and the last Zone conference. Personally I've never understood its power until recently. The scriptures we share from it and the difference I feel the days I do read have really been a testimony builder. I know now more that ever that this book is like or even better than the Bible and can change lives. I read one of my favorite stories this week about the Anti-Nephi-lehites. They loved the lord so much, learned from the spirit, and repented that they would not fight anymore to show how dedicated they were to follow Christ and keep the commandments. It's hard to be this righteous and also loving to everyone (especially those bashers out there) but through christ we can be one people so there are no more -ites (4 Nephi 1:17). The last thing I want to share this week is about the authority missionaries have. I've really noticed this week in various situations that people trust and recognize who we are. They even sometimes reveal some really personal things and it's been really special to be recognized as such representatives. It also works the other way. When we recognize who they are as a friend and child of God it becomes so much easier to teach them and also understand despite it being a different language (with at times very hard accents). Les amo muchísimos mis amigos (sorry if you were hoping for a little more funny/story time but I wanted to share some more of the spiritual stuff and growth I've had and seen) hasta la próxima, Elder Jacobs Pictures: 🤮🎃 new statue because Gibsonia Elders keep picking up random objects from the side of the road and sneaking them in exercise bike ^^^^ "}, {"id": "l21", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><\/div>", "cultures": ["HT"], "moments": [], "extra": "Haiti", "kind": "Letter 21 · Lakeland", "title": "🍌😎 I'm now a Haitian creole Elder 🇭🇹", "date": "2021-11-08T05:23:00", "group": "2021-11", "html": "<div class=\"body\"><p>Bienvenidos amigos de nuevo to my channel! Jajaja jk<\/p>\n<p>This week was filled with awesome lessons and the future also looks good. Our district leader, Elder Seamons, actually has challenged us to teach 40 lessons next week; so I&#x27;m excited and nervous to see how that goes. It also is getting 🥶 cold! Florida and cold did not seem like a reality but we&#x27;ve been wearing jackets/sweaters quite a bit. And it&#x27;s supposed to get worse.<\/p>\n<p>The title this week is because I went on exchanges again! This time the Zone leaders, Elder Campbell &amp; Jacobs (now Sr. Since he&#x27;s been in the mission longer), came to Lakeland with Elder Izu. Elder Olayan went to Lake Wales with Elder lauritzen and I went to Winterhaven Creole with Elder Zamor. The exchanges went super well, everyone learned some great things and had a fun time. Creole has some parts that are similar to spanish but otherwise nada so it was kinda difficult for some lessons. Luckily Elder Zamor is a boss and could translate for me very well and most people understood some english. We even had English class. One guy from the class lived in Chile for 4 years so he knows spanish and that&#x27;s how we communicated. He also was very impressed with my spanish 😎.<\/p>\n<p>We also had interviews with President and Sister Hollingsworth since the transfer is almost over. They really made sure to let me know to always speak spanish when I can and to do more roleplays because it will help me and my companions. This week we had a really cool pass off lesson. The Highland sisters found a guy on their free Bible ad and he knew some English and wanted to learn more while also about the Bible. The language barrier ended being a little too much so questions/ answers weren&#x27;t fully understood which is why we are now teaching them. The lesson this week after being introduced by the sisters was crazy. They at first were confused why we were there because they were told spanish missionaries are coming jaja then when the realized we can speak the flood gates opened...<\/p>\n<p>We were there for 2hours trying to answer their mount Everest of questions. They are super cool and we&#x27;re going to go over again to answer more 😅<\/p>\n<p>One of the best things this week, although this week was pretty good, was news about daylight savings. Because 6-9pm, &#x27;prime time&#x27;, will be in the dark, we can now be out then! We can have unplanned stop bys after dark again and strategic tract. Definitely excited for this because we can do a lot less phone calls in the evening when stuff falls through instead go walkie-talkie and then maybe a little knockie.<\/p>\n<p>This week as a district we have been setting goals in our companionships then sending a text in the evening saying how it went. Goals are so important because without something in mind to work towards its hard almost impossible to keep at it. If you want to grow your testimony you need to figure how you will do that. Scriptures and prayer? OK well how often and how much? Or by what day do I want to get through the book of ____? It also applies to other things in life like exercise, music, school, sports, video games. But I&#x27;ve noticed this week how much better we work with goals and the miracles we see.<\/p>\n<p>I mentioned how Elder Seamons challenged us to 40 lessons next week but that&#x27;s because he and his companions set that goal and have been working at it by smaller daily goals. They achieved it and had a lot of awesome miracles to share with us about it.<\/p>\n<p>Don&#x27;t forget to like, comment, and subscribe! (OK I&#x27;m really going to stop now)<\/p>\n<p>Cuidense!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.S. I read every email I get but just can&#x27;t respond til Monday. And sometimes I forget to respond or don&#x27;t have time so I&#x27;m super sorry! Hopefully you still email me because I love hearing from you guys!<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Lakeland Zone conference (left around to the right: Elder Seamons, Astorga, Dana, Izu, me, Olayan, Campbell, Zamor, Lauritzen, and Jacobs)<\/li>\n<li>rain<\/li>\n<li>our fresh cuts while out in the cold rain<\/li>\n<li>more rain<\/li>\n<li>phone lesson<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-11-08_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-08_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-08_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-08_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-11-08_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-11-08_0_5.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_086.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/ex lot of awesome miracles to share with us about it. Don't forget to like, comment, and subscribe! (OK I'm really going to stop now) Cuidense! Elder Jacobs P.S. I read every email I get but just can't respond til Monday. And sometimes I forget to respond or don't have time so I'm super sorry! Hopefully you still email me because I love hearing from you guys! Pictures: Lakeland Zone conference (left around to the right: Elder Seamons, Astorga, Dana, Izu, me, Olayan, Campbell, Zamor, Lauritzen, and Jacobs) rain our fresh cuts while out in the cold rain more rain phone lesson More from this week Haiti"}, {"id": "l22", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 22 · Lakeland", "title": "The 40 lesson week! 🤤🔥🛸", "date": "2021-11-15T07:41:00", "group": "2021-11", "html": "<div class=\"body\"><p>Buenos Días amigos!<\/p>\n<p>The final week of this transfer was awesome! A grind at times but definitely miracle filled. Something my companions and I have started doing to appreciate the miracles each day is once in bed we say what we thought was the miracle of the day. It&#x27;s also interesting because we typically choose different things.<\/p>\n<p>Miracles this week:<\/p>\n<ul class=\"bul\">\n<li>42 lessons taught!<\/li>\n<li>21 new friends! (our goal was 7!)<\/li>\n<li>member meals 🌮🌯🫔🥙<\/li>\n<li>2nd chance to talk to someone (I talked to this guys dad and he doesnt have interest too much but yesterday I talked to the guy himself who has a TON of interest! The last time I saw him I kinda ignored talking to him but I&#x27;m glad I was given a 2nd chance)<\/li>\n<li>Our district had 112 lessons and 40 friends found!<\/li>\n<li>and many more!<\/li>\n<\/ul>\n<p>To quote Elder Maxwell (I think, wasn&#x27;t able to find the talk again or exact quote),<\/p>\n<p>&quot;We should count our blessings but also make them count&quot;<\/p>\n<p>Other stuff that happened this week. We taught english class to a member and his friends. They don&#x27;t know much but a few jokes so it was pretty funny, jajaja. I had 2 exchanges! The first I stayed with Elder Olayan while Elder Izu and Dana switched. Good exchange and it really motivated us for the 40+ lesson week since the previous Elder Dana and the others in Gibsonia had done it. The 2nd one I went to Gibsonia 🐟 with Elder Astorga and Dana. Our day went pretty well, sadly had lessons cancel and struggled to get more but overall still a good exchange.<\/p>\n<p>Not much other stuff happened because we were almost constantly outside doing the Walkie, Talkie &amp; sometimes we Knockie. But it was fun.<\/p>\n<p class=\"sign\">Los amo amigos míos y hasta luego!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Transfer news: Elder Olayan is going home (the 2yrs are up), Elder Izu and I are going to Cypress Gardens East! Elder Izu was there the other transfer before this one here in the west side so now we go back jaja.<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Our new furniture! (Don&#x27;t ask where or how we got it but trust the process. Its pretty comfy too! This is only half a pew)<\/li>\n<li>Juan Zamora&#x27;s Baptism! (finally got the picture of Juan&#x27;s baptism that I missed because I was transfered the week before. Elder Ricks with Elder Makechine and their trainee)<\/li>\n<li>Empanadas with the Companions<\/li>\n<li>Big Bus car (not the biggest I saw this week but I was driving sooo no pic of the huge one)<\/li>\n<li>Huarache (big tostado more or less, I had Al pastor on it 🤤)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-11-15_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-15_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-15_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-15_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-15_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-15_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_094.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_095.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_096.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_097.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_098.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_099.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_100.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_101.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_102.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_103.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_104.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "The 40 lesson week! 🤤🔥🛸 Buenos Días amigos! The final week of this transfer was awesome! A grind at times but definitely miracle filled. Something my companions and I have started doing to appreciate the miracles each day is once in bed we say what we thought was the miracle of the day. It's also interesting because we typically choose different things. Miracles this week: 42 lessons taught! 21 new friends! (our goal was 7!) member meals 🌮🌯🫔🥙 2nd chance to talk to someone (I talked to this guys dad and he doesnt have interest too much but yesterday I talked to the guy himself who has a TON of interest! The last time I saw him I kinda ignored talking to him but I'm glad I was given a 2nd chance) Our district had 112 lessons and 40 friends found! and many more! To quote Elder Maxwell (I think, wasn't able to find the talk again or exact quote), \"We should count our blessings but also make them count\" Other stuff that happened this week. We taught english class to a member and his friends. They don't know much but a few jokes so it was pretty funny, jajaja. I had 2 exchanges! The first I stayed with Elder Olayan while Elder Izu and Dana switched. Good exchange and it really motivated us for the 40+ lesson week since the previous Elder Dana and the others in Gibsonia had done it. The 2nd one I went to Gibsonia 🐟 with Elder Astorga and Dana. Our day went pretty well, sadly had lessons cancel and struggled to get more but overall still a good exchange. Not much other stuff happened because we were almost constantly outside doing the Walkie, Talkie & sometimes we Knockie. But it was fun. Los amo amigos míos y hasta luego! Elder Jacobs Transfer news: Elder Olayan is going home (the 2yrs are up), Elder Izu and I are going to Cypress Gardens East! Elder Izu was there the other transfer before this one here in the west side so now we go back jaja. Pictures: Our new furniture! (Don't ask where or how we got it but trust the process. Its pretty comfy too! This is only half a pew) Juan Zamora's Baptism! (finally got the picture of Juan's baptism that I missed because I was transfered the week before. Elder Ricks with Elder Makechine and their trainee) Empanadas with the Companions Big Bus car (not the biggest I saw this week but I was driving sooo no pic of the huge one) Huarache (big tostado more or less, I had Al pastor on it 🤤) More from this week "}, {"id": "l23", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><\/div>", "cultures": ["HT"], "moments": [], "extra": "Haiti", "kind": "Letter 23 · Winter Haven", "title": "🦍🐟 Mission: survive...🏴‍☠️", "date": "2021-11-22T06:00:00", "group": "2021-11", "html": "<div class=\"body\"><p>Buenos Días mis amigos!<\/p>\n<p>Not going to lie, this week was a bit of a hard one. Whitewashing is hard. Going from an area where I know the roads almost perfectly, lots of new people to teach, and know the members well then going into a new area where neither of us really know much, still know the members just not on this side, and not really any friends to teach. We did try to make the best of it by contacting people Elder Izu remembered from 2 transfers ago and the other missionary stuff (mostly finding this week).<\/p>\n<p>Overall, after full sending it and going finding grind we did have a lot of fun and start to see what to do with this new area. The best part about this transfer is that we are now in the East part aka Winterhaven side but still the same ward and Zone and we even kept the same district!<\/p>\n<p>Transfer day was fun but also sad. I got to see a lot of the other missionaries I know again like Elder CJ Ricks, Nelson, Jenson, ect. But we had to say goodbye to Elder Olayan. We got Wawa shakes (since there aren&#x27;t any in Utah) and at transfers said bye. Elder Izu and I made sure to wear the ties he traded us.<\/p>\n<p>Some other things from thus week: we went to noche de fútbol (soccer night with some ward members and everyone tries to bring friends so we can find new people to teach too). Super fun it started raining.<\/p>\n<p>Found 5 Haitians on accident while looking for latinos. Quite a miracle since there really aren&#x27;t much but yesterday found the Haitians in the haystack.<\/p>\n<p>Hope all is well and I&#x27;ll see you next week with a ton more to talk about!<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Winterhaven street art<\/li>\n<li>big fish<\/li>\n<li>Heart fountain<\/li>\n<li>goodbyes with Elder Olayan<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-11-22_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-22_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-11-22_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-22_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_105.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_106.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_107.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_108.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_109.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_110.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_111.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_112.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🦍🐟 Mission: survive...🏴‍☠️ Buenos Días mis amigos! Not going to lie, this week was a bit of a hard one. Whitewashing is hard. Going from an area where I know the roads almost perfectly, lots of new people to teach, and know the members well then going into a new area where neither of us really know much, still know the members just not on this side, and not really any friends to teach. We did try to make the best of it by contacting people Elder Izu remembered from 2 transfers ago and the other missionary stuff (mostly finding this week). Overall, after full sending it and going finding grind we did have a lot of fun and start to see what to do with this new area. The best part about this transfer is that we are now in the East part aka Winterhaven side but still the same ward and Zone and we even kept the same district! Transfer day was fun but also sad. I got to see a lot of the other missionaries I know again like Elder CJ Ricks, Nelson, Jenson, ect. But we had to say goodbye to Elder Olayan. We got Wawa shakes (since there aren't any in Utah) and at transfers said bye. Elder Izu and I made sure to wear the ties he traded us. Some other things from thus week: we went to noche de fútbol (soccer night with some ward members and everyone tries to bring friends so we can find new people to teach too). Super fun it started raining. Found 5 Haitians on accident while looking for latinos. Quite a miracle since there really aren't much but yesterday found the Haitians in the haystack. Hope all is well and I'll see you next week with a ton more to talk about! Los amo Elder Jacobs Pictures: Winterhaven street art big fish Heart fountain goodbyes with Elder Olayan More from this week Haiti"}, {"id": "l24", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Holidays"], "extra": "", "kind": "Letter 24 · Winter Haven", "title": "🍁🍂 Feliz día de acción de gracias! 🦃🦤", "date": "2021-11-29T09:49:00", "group": "2021-11", "html": "<div class=\"body\"><p>Buenas! Mis amigos!<\/p>\n<p>This week was pretty good especially since there was Thanksgiving! I hope you all had a Thanksgiving and ate a lot of food like I did. We had Thanksgiving lunch with our district which was awesome (we each had our own martinelli jaja) and then later a member had us over for dinner. They cooked multiple turkeys and sides; it was awesome (plus lots of leftovers from them).<\/p>\n<p>We spent a lot of time finding aka the Walkie talkie and sometimes we knockie. So not super eventful week but we did get our friend Arnulfo on a baptism date! He is super excited and loves the feeling he has at church so we are also super pumped.<\/p>\n<p>Something I wanted to share from my study this week is the power we have when we speak. I was ready a talk called, &quot;the tongue of angles.&quot; It was super awesome talk from Elder Holland and it definitely pointed out a lot of things I&#x27;ve seen as a missionary. The way we say things matter because depending on the person&#x27;s understanding and their background will depend how they react. Also as family, friends, and strangers it matters. There are a lot of things from the talk so I can&#x27;t explain everything so go read it.<\/p>\n<p>Hasta la proxima,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Thanksgiving<\/li>\n<li>dog (hachi) she followed us for a while<\/li>\n<li>tried Malta (was aight)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-11-29_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-29_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-29_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-29_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-29_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_113.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_114.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_115.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🍁🍂 Feliz día de acción de gracias! 🦃🦤 Buenas! Mis amigos! This week was pretty good especially since there was Thanksgiving! I hope you all had a Thanksgiving and ate a lot of food like I did. We had Thanksgiving lunch with our district which was awesome (we each had our own martinelli jaja) and then later a member had us over for dinner. They cooked multiple turkeys and sides; it was awesome (plus lots of leftovers from them). We spent a lot of time finding aka the Walkie talkie and sometimes we knockie. So not super eventful week but we did get our friend Arnulfo on a baptism date! He is super excited and loves the feeling he has at church so we are also super pumped. Something I wanted to share from my study this week is the power we have when we speak. I was ready a talk called, \"the tongue of angles.\" It was super awesome talk from Elder Holland and it definitely pointed out a lot of things I've seen as a missionary. The way we say things matter because depending on the person's understanding and their background will depend how they react. Also as family, friends, and strangers it matters. There are a lot of things from the talk so I can't explain everything so go read it. Hasta la proxima, Elder Jacobs Pictures: Thanksgiving dog (hachi) she followed us for a while tried Malta (was aight) More from this week "}, {"id": "l25", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DEC 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": [], "moments": ["Holidays"], "extra": "", "kind": "Letter 25 · Winter Haven", "title": "Happy December!", "date": "2021-12-06T12:38:00", "group": "2021-12", "html": "<div class=\"body\"><p>Buenas amigos!<\/p>\n<p>Happy December! This week was good and very productive. This next week is looking great too!<\/p>\n<p>Idk if there is anything really special to share this week but I guess I can share a few things I considered miracles: Got in contact with some of our friends finally and had some 🔥 lessons.<\/p>\n<p>Found some super elect people! They were so accepting of the restoration.<\/p>\n<p>After all night of prime time (messaging on Facebook) and very little happening (#NoNewAds) we had a lesson and they guy seemed to really like the message and want to go to church!<\/p>\n<p>Fun stuff:<\/p>\n<p>Visited the burnt chicken nugget in Eloise (check Google it&#x27;s real jaja)<\/p>\n<p>Elder Dana came on exchanges with us and took a picture with black Santa.<\/p>\n<p>Also made 3 dogs love us so much they tried following us as we walked around.<\/p>\n<p>#goodboys<\/p>\n<p>This Saturday we get to meet and listen to Elder Soares along with some other as a mission.<\/p>\n<p>Cuidense mis queridos amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>unicorn kinda jaha<\/li>\n<li>our Christmas tree 🎄<\/li>\n<li>funny sign<\/li>\n<li>tried a Pelican snow cone<\/li>\n<li>broken firehydrant (we got a free car wash)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-12-06_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-12-06_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-06_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-06_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_116.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_117.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_118.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_119.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Happy December! Buenas amigos! Happy December! This week was good and very productive. This next week is looking great too! Idk if there is anything really special to share this week but I guess I can share a few things I considered miracles: Got in contact with some of our friends finally and had some 🔥 lessons. Found some super elect people! They were so accepting of the restoration. After all night of prime time (messaging on Facebook) and very little happening (#NoNewAds) we had a lesson and they guy seemed to really like the message and want to go to church! Fun stuff: Visited the burnt chicken nugget in Eloise (check Google it's real jaja) Elder Dana came on exchanges with us and took a picture with black Santa. Also made 3 dogs love us so much they tried following us as we walked around. #goodboys This Saturday we get to meet and listen to Elder Soares along with some other as a mission. Cuidense mis queridos amigos, Elder Jacobs Pictures: unicorn kinda jaha our Christmas tree 🎄 funny sign tried a Pelican snow cone broken firehydrant (we got a free car wash) More from this week "}, {"id": "l26", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DEC 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["PR", "BR"], "moments": ["Baptism"], "extra": "Puerto Rico Brazil", "kind": "Letter 26 · Winter Haven", "title": "📈💰 Apostle of the Lord 🦤🎰", "date": "2021-12-13T07:01:00", "group": "2021-12", "html": "<div class=\"body\"><p>Buenas! Amigos míos,<\/p>\n<p>Qué pasao? (What&#x27;s up but Puerto Rican slang). This week went really great and lots of work to do this next one too! I&#x27;m excited.<\/p>\n<p>Monday we had Arnulfo&#x27;s baptism interview! Everything went great (it was in the middle of a 🌶 chiles because we were waiting for our food. He wanted to show his appreciation for us). Still doesn&#x27;t have a baptism date because work is crazy for him and he needs to get Sundays off completely so there are no problems in the future. It should hopefully happen soon. He knows how important it is.<\/p>\n<p>We found a really awesome guy named Miguel. We put him on date for the 19th! He speaks pretty much only English so the other elders are now teaching him but we see him at church and hopefully his baptism this week! We got stopped in the street 2x while on bikes. One guy was pretty cool and wanted our insight on some Bible verses interpretations and the other was 2 ladys selling solar. They wanted to talk to us because we are &quot;the original door knockers&quot; and when they found out we are bilingual we got called &quot;the Golden standard.&quot; Pretty funny interaction because they also asked for tips when knocking doors jaja (they did give us water so that was nice. It was a really hot week). Prime time messaging (6-9pm replying to messages and comments on Facebook ads trying to set up lessons and send referrals) went really well this week! We found 5 new friends and were able to send them off to other areas inside, outside the mission and our own area luckily. We would finish one lesson then someone else would say they want to talk and send their number as well! It was awesome just tons of back to back lessons.<\/p>\n<p>The last super awesome thing from this week was Elder Soares. He along with 3 of the 70s (Elder Holland, Patrick, and Johnson) came to Florida. They talked to the young adults Thursday night, spanish speakers Friday, and Saturday morning to our mission! Evening to leadership. It was super fun to be able to see all the other missionaries, take a picture all together, then hear the words of an apostle. He is a pretty funny guy too! English his is 5th language after Portuguese, spanish, French, and Italian so there were funny phrases he said and he was willing to laugh at himself. All of their words to us were very much themed around our divine purpose and calling as missionaries although they did not plan together. This week I&#x27;ve begun Helaman. The Nefites and lamanites have peace and war and peace again but only when there is Christ at the center. There are also a lot more blessing when Christ and commandments are their first priority. As a missionary most of that is pretty easy to do but sometimes we get distracted by other things of less value. Good, better, and best as some wise men say. Sometimes the way to become better is to leave lesser things behind because we already have the best things but forget to put them in our schedule because of lesser things taking up space. Pasta luego mis queridos amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Boba fett &amp; baby Yoda<\/li>\n<li>slopes (basically tostado but fried dough bowl to keep everything in better)<\/li>\n<li>puppies that followed us around (if I had a nickel for every time a dog followed me I&#x27;d have quite a few nickels [name that show])<\/li>\n<li>nativity that Miguel made<\/li>\n<li>chippy and Elder Izu during our lesson<\/li>\n<li>minion<\/li>\n<li>frog &amp; 🦎☠<\/li>\n<li>our tree now has ornaments<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-12-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-13_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-13_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_0_5.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-13_1_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-13_1_1.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_1_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_2_0.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_120.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_121.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_122.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_123.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_124.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "📈💰 Apostle of the Lord 🦤🎰 Buenas! Amigos míos, Qué pasao? (What's up but Puerto Rican slang). This week went really great and lots of work to do this next one too! I'm excited. Monday we had Arnulfo's baptism interview! Everything went great (it was in the middle of a 🌶 chiles because we were waiting for our food. He wanted to show his appreciation for us). Still doesn't have a baptism date because work is crazy for him and he needs to get Sundays off completely so there are no problems in the future. It should hopefully happen soon. He knows how important it is. We found a really awesome guy named Miguel. We put him on date for the 19th! He speaks pretty much only English so the other elders are now teaching him but we see him at church and hopefully his baptism this week! We got stopped in the street 2x while on bikes. One guy was pretty cool and wanted our insight on some Bible verses interpretations and the other was 2 ladys selling solar. They wanted to talk to us because we are \"the original door knockers\" and when they found out we are bilingual we got called \"the Golden standard.\" Pretty funny interaction because they also asked for tips when knocking doors jaja (they did give us water so that was nice. It was a really hot week). Prime time messaging (6-9pm replying to messages and comments on Facebook ads trying to set up lessons and send referrals) went really well this week! We found 5 new friends and were able to send them off to other areas inside, outside the mission and our own area luckily. We would finish one lesson then someone else would say they want to talk and send their number as well! It was awesome just tons of back to back lessons. The last super awesome thing from this week was Elder Soares. He along with 3 of the 70s (Elder Holland, Patrick, and Johnson) came to Florida. They talked to the young adults Thursday night, spanish speakers Friday, and Saturday morning to our mission! Evening to leadership. It was super fun to be able to see all the other missionaries, take a picture all together, then hear the words of an apostle. He is a pretty funny guy too! English his is 5th language after Portuguese, spanish, French, and Italian so there were funny phrases he said and he was willing to laugh at himself. All of their words to us were very much themed around our divine purpose and calling as missionaries although they did not plan together. This week I've begun Helaman. The Nefites and lamanites have peace and war and peace again but only when there is Christ at the center. There are also a lot more blessing when Christ and commandments are their first priority. As a missionary most of that is pretty easy to do but sometimes we get distracted by other things of less value. Good, better, and best as some wise men say. Sometimes the way to become better is to leave lesser things behind because we already have the best things but forget to put them in our schedule because of lesser things taking up space. Pasta luego mis queridos amigos, Elder Jacobs Pictures: Boba fett & baby Yoda slopes (basically tostado but fried dough bowl to keep everything in better) puppies that followed us around (if I had a nickel for every time a dog followed me I'd have quite a few nickels [name that show]) nativity that Miguel made chippy and Elder Izu during our lesson minion frog & 🦎☠ our tree now has ornaments More from this week Puerto Rico Brazil"}, {"id": "l27", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DEC 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": ["PR"], "moments": ["Baptism", "Holidays"], "extra": "Puerto Rico", "kind": "Letter 27 · Winter Haven", "title": "🎊🎁 Feliz Navidad 🎄", "date": "2021-12-20T11:59:00", "group": "2021-12", "html": "<div class=\"body\"><p>Merry Christmas mis queridos amigos!<\/p>\n<p>Christmas is one of my favorite times of years and as a missionary it&#x27;s been pretty good too. I get to continue teaching but also helping bring the Christmas spirit.<\/p>\n<p>We had our ward Christmas party which was super fun. We had some friends come and there was tons of good food, music, and Christmas 🎄 vibes. 2 members gave us gifts 🎁. A new tie and a Puerto Rican necklace peep the pics. We had Zone conference Wednesday. It was super awesome to see some of the other missionaries again (Elder Nelson &amp; his new trainee aka my 3rd brother).<\/p>\n<p>Exchange this week from Monday night to Wednesday morning. Elder Seamons &amp; Dana came to join me in cypress gardens. It was super fun. We tried talking to a crazy bird some guy had. Taught enlgish class to a bunch of people! It was crazy but awesome.<\/p>\n<p>Sunday Miguel was baptized! Elder Izu and I found him last week but since he pretty much only speaks English had to pass him off to the other elders. Luckily his baptism was before our church so we got to go as well and give talks. He was so excited.<\/p>\n<p>Ward also had its first christmas choir so that was cool.<\/p>\n<p>This week was good even though I kinda don&#x27;t remember it.<\/p>\n<p>I just made it to 3 Nephi in my reading. I love all the prophesies of christ. Definitely encourage you to go read some scriptures about what christ did for us or why his birth is so important.<\/p>\n<p>Merry Christmas yall (&quot;eat lead you filthy animal&quot; I love homealone),<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.S. please pray for our friends to feel better soon (especially Vidal who has some pretty bad kidney stones)<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Miguel&#x27;s baptism<\/li>\n<li>ties<\/li>\n<li>necklace<\/li>\n<li>bird<\/li>\n<li>elephant ear (not even the biggest one I&#x27;ve seen)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-12-20_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-20_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-20_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_125.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_126.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_127.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_128.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_129.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_130.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_131.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_132.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_133.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_134.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_135.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_136.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_137.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_138.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_139.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_140.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🎊🎁 Feliz Navidad 🎄 Merry Christmas mis queridos amigos! Christmas is one of my favorite times of years and as a missionary it's been pretty good too. I get to continue teaching but also helping bring the Christmas spirit. We had our ward Christmas party which was super fun. We had some friends come and there was tons of good food, music, and Christmas 🎄 vibes. 2 members gave us gifts 🎁. A new tie and a Puerto Rican necklace peep the pics. We had Zone conference Wednesday. It was super awesome to see some of the other missionaries again (Elder Nelson & his new trainee aka my 3rd brother). Exchange this week from Monday night to Wednesday morning. Elder Seamons & Dana came to join me in cypress gardens. It was super fun. We tried talking to a crazy bird some guy had. Taught enlgish class to a bunch of people! It was crazy but awesome. Sunday Miguel was baptized! Elder Izu and I found him last week but since he pretty much only speaks English had to pass him off to the other elders. Luckily his baptism was before our church so we got to go as well and give talks. He was so excited. Ward also had its first christmas choir so that was cool. This week was good even though I kinda don't remember it. I just made it to 3 Nephi in my reading. I love all the prophesies of christ. Definitely encourage you to go read some scriptures about what christ did for us or why his birth is so important. Merry Christmas yall (\"eat lead you filthy animal\" I love homealone), Elder Jacobs P.S. please pray for our friends to feel better soon (especially Vidal who has some pretty bad kidney stones) Pictures: Miguel's baptism ties necklace bird elephant ear (not even the biggest one I've seen) More from this week Puerto Rico"}, {"id": "l28", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DEC 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": [], "moments": ["Holidays"], "extra": "", "kind": "Letter 28 · Winter Haven", "title": "🎊🎆🐉Feliz año nuevo! 🎉✨", "date": "2021-12-27T06:46:00", "group": "2021-12", "html": "<div class=\"body\"><p>I hope that everyone had an amazing Christmas eve and day!<\/p>\n<p>(yes I mentioned Christmas eve because that&#x27;s when most of our friends celebrated. Celebrate in the evening until late at night and sleep all of the 25th).<\/p>\n<p>Being a missionary during Christmas time is great but Christmas eve and day not really. We did end up finding something to do (baking and dropping off cookies). It&#x27;s also a family tradition so I really enjoyed sharing it with Elder Izu and some other missionaries as well.<\/p>\n<p>We also had some members feed us those two nights and of course we opened presents 🎁. 👔👔👔 We got together for district brunch and ate a bunch of food on Christmas.<\/p>\n<p>This week we talked to a former that has a really strong testimony of the gospel and Book of Mormon the only problem is he is pretty busy right now so hopefully after the new year we can start teaching him again. Also found 2 members who got disconnected from the church when the moved so we were able to help with that! (More preisthood holders!) Had interviews with President and his wife. President ended up running behind but Sister Hollingsworth was finished so we all just went back in and had a group interview with her jaja. I love being able to meet with then and get help and feel their love. BTW Mom they love me and don&#x27;t want you to worry jaja.<\/p>\n<p>Anyways, los amamos mucho amigos. I hope your new years is awesome too. Let me know if you have a funny resolution this year,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Elder Izu and I making cookies<\/li>\n<li>Luke Skywalker cardboard cut out from white elephant<\/li>\n<li>white elephant results<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-12-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-12-27_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_141.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_142.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_143.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_144.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_145.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_146.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_147.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_148.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🎊🎆🐉Feliz año nuevo! 🎉✨ I hope that everyone had an amazing Christmas eve and day! (yes I mentioned Christmas eve because that's when most of our friends celebrated. Celebrate in the evening until late at night and sleep all of the 25th). Being a missionary during Christmas time is great but Christmas eve and day not really. We did end up finding something to do (baking and dropping off cookies). It's also a family tradition so I really enjoyed sharing it with Elder Izu and some other missionaries as well. We also had some members feed us those two nights and of course we opened presents 🎁. 👔👔👔 We got together for district brunch and ate a bunch of food on Christmas. This week we talked to a former that has a really strong testimony of the gospel and Book of Mormon the only problem is he is pretty busy right now so hopefully after the new year we can start teaching him again. Also found 2 members who got disconnected from the church when the moved so we were able to help with that! (More preisthood holders!) Had interviews with President and his wife. President ended up running behind but Sister Hollingsworth was finished so we all just went back in and had a group interview with her jaja. I love being able to meet with then and get help and feel their love. BTW Mom they love me and don't want you to worry jaja. Anyways, los amamos mucho amigos. I hope your new years is awesome too. Let me know if you have a funny resolution this year, Elder Jacobs Pictures: Elder Izu and I making cookies Luke Skywalker cardboard cut out from white elephant white elephant results More from this week "}, {"id": "l29", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">JAN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": ["HT"], "moments": ["Baptism", "Holidays"], "extra": "Haiti", "kind": "Letter 29 · Winter Haven", "title": "🐊Feliz año nuevo! 🦕🎉🎊🎆🎇✨", "date": "2022-01-03T09:28:00", "group": "2022-01", "html": "<div class=\"body\"><p>Woooo 2022 baybee! Just kidding, it&#x27;s kinda weird, especially since someone told me I&#x27;ll be a missionary this entire next year.<\/p>\n<p>Buenas amigos míos!<\/p>\n<p>Como le va? Or if you for some reason know Haitian Creole: koman w ye?<\/p>\n<p>I&#x27;m going to learn more phrases in Haitian creole because if I had a nickel for everytime I met a Haitian and my spamish only got so far and I needed some Haitian Creole, I&#x27;d have 4 nickels. It isn&#x27;t a lot but it&#x27;s Strange it&#x27;s happened 4 times. This week went pretty well, a little slower than Christmas week surprisingly but good nonetheless. We put our friend Quincy on date! We also have been teaching his wide but she wasn&#x27;t there this last time so next lesson we&#x27;ll see if they want to the same day. 😄<\/p>\n<p>We snuck into a gated community to try to stop by a former but they weren&#x27;t there. When we tried to leave we got stuck.... there is a gate code to get in and out.... luckily after 5min of key smashing trying to guess a nice old lady came and used her clicker.<\/p>\n<p>Lake Wales is a strange place<\/p>\n<p>We had some awesome lessons with our friends Francisco &amp; Jocelyn and also Antonio this week. They are super close to being ready for baptism. During the lesson with Antonio he even told us he would want to once he knew a bit more. New years was a normal day more or less. Nothing much happened and 6-9pm we had to be in the apartment. Didn&#x27;t see any fireworks because of trees.<\/p>\n<p>Transfers are tomorrow and I am staying with Elder Izu!<\/p>\n<p>Mucho amor!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>new friend Queen (Antonio&#x27;s pig)<\/li>\n<li>some guy from face book messaging<\/li>\n<li>district final picture<\/li>\n<li>icy nefi<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-01-03_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-03_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-03_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-01-03_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-01-03_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_149.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_150.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🐊Feliz año nuevo! 🦕🎉🎊🎆🎇✨ Woooo 2022 baybee! Just kidding, it's kinda weird, especially since someone told me I'll be a missionary this entire next year. Buenas amigos míos! Como le va? Or if you for some reason know Haitian Creole: koman w ye? I'm going to learn more phrases in Haitian creole because if I had a nickel for everytime I met a Haitian and my spamish only got so far and I needed some Haitian Creole, I'd have 4 nickels. It isn't a lot but it's Strange it's happened 4 times. This week went pretty well, a little slower than Christmas week surprisingly but good nonetheless. We put our friend Quincy on date! We also have been teaching his wide but she wasn't there this last time so next lesson we'll see if they want to the same day. 😄 We snuck into a gated community to try to stop by a former but they weren't there. When we tried to leave we got stuck.... there is a gate code to get in and out.... luckily after 5min of key smashing trying to guess a nice old lady came and used her clicker. Lake Wales is a strange place We had some awesome lessons with our friends Francisco & Jocelyn and also Antonio this week. They are super close to being ready for baptism. During the lesson with Antonio he even told us he would want to once he knew a bit more. New years was a normal day more or less. Nothing much happened and 6-9pm we had to be in the apartment. Didn't see any fireworks because of trees. Transfers are tomorrow and I am staying with Elder Izu! Mucho amor! Elder Jacobs Pictures: new friend Queen (Antonio's pig) some guy from face book messaging district final picture icy nefi More from this week Haiti"}, {"id": "l30", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">JAN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🐊 Gators<\/span><\/div>", "cultures": ["MX"], "moments": ["Baptism", "Gators"], "extra": "Mexico", "kind": "Letter 30 · Winter Haven", "title": "🐊 Ok this is not epic 🤒🤕", "date": "2022-01-10T07:10:00", "group": "2022-01", "html": "<div class=\"body\"><p>Buenos Días amigos míos! Don&#x27;t worry I&#x27;m not sick or my companion. But lots of our friends hence the title. Otherwise this week went really well!<\/p>\n<p>Spent a decent amount of time in haines city despite it being far. We are starting to get a decent number of friends there. Some ladys gave us some tacos (carne asada) and salsa (my lips Hurt for 30min but it tastes good). We found an electric organ (sadly didn&#x27;t work) and snuck it into the other Elders&#x27; apartment (remember to lock your doors kiddos).<\/p>\n<p>Had some awesome lessons with friends this week: Antonio, Francisco &amp; jocelyn, Maria, Juan &amp; Ydasty, Perez Ortiz family, Araceli, and Hipolito. Some people have asked for a quick list of our friends so they can pray for them so there it is. ⬆️Good luck pronouncing some of the names 😉<\/p>\n<p>Araceli is a bomb cook. She made us some homemade sopes (I sent a picture in a past email of some, basically friend dough then tostada stuff on top). She cooks all day Fridays. Might have to go by again and see if she&#x27;ll give us more, she claims to have the best enchiladas. 🤩🧐<\/p>\n<p>Arnulfo came to church again! And we have a lesson this Wednesday. Hoping we can finally get him baptized since he has already done everything just life was hectic.<\/p>\n<p>Please pray for our members too because we only had 1 hour of church and about 25 people come because of covid, flu, ect. I ended up fumbling my way through the piano with my very limited skills but at least we had it. One challenge Elder Izu and I have is only spanish from 10am to 9pm. It&#x27;s pretty hard sometimes but pretty cool to do it because it makes conversations more natural/easy and sometimes even starts conversations. &quot;Yes I know I&#x27;m a gringo but speaking spanish. Yes Elder Izu looks Mexican but speaks less than you originally thought &quot; examples we have to say or explain frequently.<\/p>\n<p>I&#x27;ve been studying virtue this week as I prepare for a giving a training in our district council tuesday. So I&#x27;ve read a bunch of talks (mostly to young women) and scriptures. Basically if you want to be more virtuous and christlike you need to strive to have better things in your life and seek the things of God. Another thing is always thinking in good things that way your mind is occupied making temptation harder to enter. Go find a way to have more of God&#x27;s hand in your life and be virtuous friends!<\/p>\n<p>Espero que vayan bien y tengan una buena semana amigos! Hasta la proxima,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>our homemade shrimp tacos 🌮 😋 🍤 🦐<\/li>\n<li>sick gator mural<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-10_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"
