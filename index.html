ass=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OCT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌀 Hurricane<\/span><\/div>", "cultures": [], "moments": ["Hurricane"], "extra": "", "kind": "Letter 68 · Tampa", "title": "🌀🌩🌧 Storm ČhÆśƏřŞ🏃‍♂️💨", "date": "2022-10-03T12:55:00", "group": "2022-10", "html": "<div class=\"body\"><p>Boa tarde!<\/p>\n<p>This week was definitely different and eye opening (no we did not chase the storm)<\/p>\n<p>Because of the incoming hurricane 🌀 we were evacuated Monday morning last week. Some missionaries were sent to other apartments more inland/north, churches and the mission home. I was fortunate enough to be at the mission home with many other missionaries and the Gardiners.<\/p>\n<p>It was very strange being a missionary while also removed from normal activities. Monday after moving to the mission home in Wesley Chapel the day followed like normal but with online teaching in the evening. Tuesday we also were allowed to go out but still limited because being evacuated. We served others in Zephyrhills (which if you remember is where I started my mission) and went into Betmar. It was fun and great helping prep others for the hurricane. Wednesday we were locked inside, and same with some of Thursday so here&#x27;s a list of things done to keep ourselves somewhat sane:<\/p>\n<ul class=\"bul\">\n<li>contact friends<\/li>\n<li>Facebook posts &amp; finding<\/li>\n<li>singing<\/li>\n<li>studying (Spanish, portugese, and the scriptures)<\/li>\n<li>tech decks<\/li>\n<li>teaching Mr.Bingly to lay down then attempt roll-over<\/li>\n<li>marking book of Mormons to give out<\/li>\n<li>start learning to play the harmonica<\/li>\n<li>board games<\/li>\n<li>Joseph Smith movie<\/li>\n<li>share favorite scriptures (mine is alma 5:14)<\/li>\n<li>be absolutely bored<\/li>\n<\/ul>\n<p>It was hard because we felt absolutely useless being stuck like that but we are all safe and pur friends in Tampa since it changed path. But it has caused a lot of damage in Leheigh Acres and Fort Myers. Pray for the members, friends, and missionaries there! We have been hosting a companionship from Peace river (Fort Myers zone) because of apartment damage.<\/p>\n<p>We got back Thursday afternoon and have been trying to get our momentum going again. Our zone theme of All gas no brakes was put on hold #FrickYouSatan<\/p>\n<p>But we have been able to get back into the groove and teach and find. Conference was absolutely bomb. 3 Nefi 5:13<\/p>\n<p>Behold, I am a disciple of Jesus Christ, the Son of God. I have been called of him to declare his word among his people, that they might have everlasting life.<\/p>\n<p>This scripture is what I started thinking of once back into groove. I am a disciple and called of God and will not waste any time left on my mission. I had my eyes open on how terrible it feels to be given a stewardship but unable to complete. We all have a chance to share our testimony with others like some speakers explained in conference.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>mission home pics<\/li>\n<li>Turtle we saved (he almost bit me)<\/li>\n<li>specialized<\/li>\n<li>aftermath by our apartment<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-10-03_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-03_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-03_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-03_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-03_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-03_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_381.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_382.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_383.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_384.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_385.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_386.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_387.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_388.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_389.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_390.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_391.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_392.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_393.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_394.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_395.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_396.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_397.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_398.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_399.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_400.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_401.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_402.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_403.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_404.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_405.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🌀🌩🌧 Storm ČhÆśƏřŞ🏃‍♂️💨 Boa tarde! This week was definitely different and eye opening (no we did not chase the storm) Because of the incoming hurricane 🌀 we were evacuated Monday morning last week. Some missionaries were sent to other apartments more inland/north, churches and the mission home. I was fortunate enough to be at the mission home with many other missionaries and the Gardiners. It was very strange being a missionary while also removed from normal activities. Monday after moving to the mission home in Wesley Chapel the day followed like normal but with online teaching in the evening. Tuesday we also were allowed to go out but still limited because being evacuated. We served others in Zephyrhills (which if you remember is where I started my mission) and went into Betmar. It was fun and great helping prep others for the hurricane. Wednesday we were locked inside, and same with some of Thursday so here's a list of things done to keep ourselves somewhat sane: contact friends Facebook posts & finding singing studying (Spanish, portugese, and the scriptures) tech decks teaching Mr.Bingly to lay down then attempt roll-over marking book of Mormons to give out start learning to play the harmonica board games Joseph Smith movie share favorite scriptures (mine is alma 5:14) be absolutely bored It was hard because we felt absolutely useless being stuck like that but we are all safe and pur friends in Tampa since it changed path. But it has caused a lot of damage in Leheigh Acres and Fort Myers. Pray for the members, friends, and missionaries there! We have been hosting a companionship from Peace river (Fort Myers zone) because of apartment damage. We got back Thursday afternoon and have been trying to get our momentum going again. Our zone theme of All gas no brakes was put on hold #FrickYouSatan But we have been able to get back into the groove and teach and find. Conference was absolutely bomb. 3 Nefi 5:13 Behold, I am a disciple of Jesus Christ, the Son of God. I have been called of him to declare his word among his people, that they might have everlasting life. This scripture is what I started thinking of once back into groove. I am a disciple and called of God and will not waste any time left on my mission. I had my eyes open on how terrible it feels to be given a stewardship but unable to complete. We all have a chance to share our testimony with others like some speakers explained in conference. Los amo! Elder Jacobs Pictures: mission home pics Turtle we saved (he almost bit me) specialized aftermath by our apartment More from this week "}, {"id": "l69", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OCT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><\/div>", "cultures": ["VE"], "moments": [], "extra": "Venezuela", "kind": "Letter 69 · Tampa", "title": "🌀Helping 🤝 Hands & more!🤠", "date": "2022-10-10T12:36:00", "group": "2022-10", "html": "<div class=\"body\"><p>Buenas tardes a todos!<\/p>\n<p>Fue una semana llena de sorpresas y bendiciones!<\/p>\n<p>This week was really awesome and action packed for various reasons and events. One thing I learned was taking things for granted. Things like a normal missionary week full of teaching, a house with power and running water, home cooked meal, ect. Our week was good and we got a lot of stuff done but it was different than others.<\/p>\n<p>We had Zone Conference this week, President Gardiner&#x27;s first, and it was awesome. We got to focus on PMG (Preach My Gospel) and The Book of Mormon which lead to a Jeopardy game of the 2.<\/p>\n<p>We struggled getting lessons set then actually go through which lead to some tracting and stop bys but still not much. Definitely trying to get everything rolling this week.<\/p>\n<p>We got a flat this week while having Elder Moon 🌙 🌚 It was fun because it lead to some fun conversations street contacting walking around waiting for Pep boys to finish. We taught 2 lessons in English and that was hard jaja; definitely not used to that (my english sentence structures be 🆘️) and there is a reason I was called to teach in Spanish 😅 We had a fire scripture reading lesson with the Francos again this week and got fed another dish from Venezuela 🇻🇪 but this one was an appetizer she randomly made up! Tostadas kinda forgot picture since it was so good. We also ran around prepping for service on Saturday!<\/p>\n<p>We had no idea what we were supposed to bring because we didn&#x27;t know what type of work we&#x27;d be doing. We joined our ward at 4:30am and made our helping hands crew of 16 (Saturday but only 7 Sunday since most didnt stay) and we&#x27;re put on tree duty. We had so much fun going ham on trees with the members. They just don&#x27;t give a crap and go crazy with chainsaws and other methods of taking down and hauling trees out to help clean people&#x27;s yards. Got very burned and a pretty tired body so today has been nice to rest. We camped the night (not something most missionaries can say) and got back around 5pm.<\/p>\n<p>Enjoy this scripture and your week!<\/p>\n<p>D&amp;C 111<\/p>\n<p>6 Concern not yourselves about Zion, for I will deal mercifully with her.<\/p>\n<p>7 Tarry in this place, and in the regions round about;<\/p>\n<p>8 And the place where it is my will that you should tarry, for the main, shall be signalized unto you by the peace and power of my Spirit, that shall flow unto you<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>tree stuff<\/li>\n<li>frog<\/li>\n<li>Nemo<\/li>\n<li>flat tire<\/li>\n<li>muking<\/li>\n<li>camping<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-10-10_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-10_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-10_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-10_0_8.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-10_0_9.jpg\" alt=\"\"><\/figure><\/div>", "text": "🌀Helping 🤝 Hands & more!🤠 Buenas tardes a todos! Fue una semana llena de sorpresas y bendiciones! This week was really awesome and action packed for various reasons and events. One thing I learned was taking things for granted. Things like a normal missionary week full of teaching, a house with power and running water, home cooked meal, ect. Our week was good and we got a lot of stuff done but it was different than others. We had Zone Conference this week, President Gardiner's first, and it was awesome. We got to focus on PMG (Preach My Gospel) and The Book of Mormon which lead to a Jeopardy game of the 2. We struggled getting lessons set then actually go through which lead to some tracting and stop bys but still not much. Definitely trying to get everything rolling this week. We got a flat this week while having Elder Moon 🌙 🌚 It was fun because it lead to some fun conversations street contacting walking around waiting for Pep boys to finish. We taught 2 lessons in English and that was hard jaja; definitely not used to that (my english sentence structures be 🆘️) and there is a reason I was called to teach in Spanish 😅 We had a fire scripture reading lesson with the Francos again this week and got fed another dish from Venezuela 🇻🇪 but this one was an appetizer she randomly made up! Tostadas kinda forgot picture since it was so good. We also ran around prepping for service on Saturday! We had no idea what we were supposed to bring because we didn't know what type of work we'd be doing. We joined our ward at 4:30am and made our helping hands crew of 16 (Saturday but only 7 Sunday since most didnt stay) and we're put on tree duty. We had so much fun going ham on trees with the members. They just don't give a crap and go crazy with chainsaws and other methods of taking down and hauling trees out to help clean people's yards. Got very burned and a pretty tired body so today has been nice to rest. We camped the night (not something most missionaries can say) and got back around 5pm. Enjoy this scripture and your week! D&C 111 6 Concern not yourselves about Zion, for I will deal mercifully with her. 7 Tarry in this place, and in the regions round about; 8 And the place where it is my will that you should tarry, for the main, shall be signalized unto you by the peace and power of my Spirit, that shall flow unto you Los amo, Elder Jacobs Pictures: tree stuff frog Nemo flat tire muking camping Venezuela"}, {"id": "l70", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OCT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": ["VE", "PE", "HT"], "moments": ["Baptism", "Temple"], "extra": "Venezuela Peru Haiti", "kind": "Letter 70 · Tampa", "title": "🇻🇪🎊🎉🎈Birthdays & new friends 🇭🇳🇵🇪", "date": "2022-10-17T11:51:00", "group": "2022-10", "html": "<div class=\"body\"><p>Que ondan payasos<\/p>\n<p>Todo bien aquí, milagros y bautismos muy pronto!<\/p>\n<p>This week we&#x27;ve been doing a bunch of Referral work trying to see how many actually are available and interested in messages and it lead to us finding Darwín &amp; Luis.<\/p>\n<p>Darwín is super awesome, very kind and funny. He&#x27;s from Homduras 🇭🇳 and saw something different in the English Elders and so we got invited over. We taught him 2 this week and I&#x27;m excited to see his progression. Pray for him to find a way to make it to church.<\/p>\n<p>Luis is from Peru 🇵🇪  also fairly young and very polite. Already has a ton of knowledge of the church from seeing the temple, missionaries ect. There in Peru. We taught him 2 this week and are working with him so he realizes that church is more important that more work.<\/p>\n<p>We remodeled the entire apartment because we now have Creole living with us. It was kinda frustrating at first especially before it happened but now it just feels so right and it&#x27;s fun having them there. Also mission tip: living with more elders = bulk buy = overall lest $ spent = 🏆 ✌️<\/p>\n<p>Did some exchanges this week with Elders in my district and it was super fun (too fun for photos, sorry I&#x27;m trying to get more)<\/p>\n<p>Our district really pushed this week to teach a ton more and do 1 lesson with Member present (MPL) a day because a MPL keeps the DL (district leader = Me) away. Lots of Miracles from that.<\/p>\n<p>We went and taught our Venezuelan family which also turned out to be a birthday party. We sang, ate lots of food, and talked about eternal family through baptism and the temple (they said yes soon we&#x27;ll tell you the day!) Our other friends are doing well, thinking about baptism so please pray for them and their testimonies. Along with protection, jobs and health (all that good stuff)<\/p>\n<p>I&#x27;ve been loving restudying general conference and invite y&#x27;all to do the same. Here is a current favorite talk- This Day by Elder Rasband<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2022/10/17rasband?lang=eng<\/p>\n<p>Last week of the transfer, let&#x27;s get it!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Venezuelan b-day party<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-10-17_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-17_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "🇻🇪🎊🎉🎈Birthdays & new friends 🇭🇳🇵🇪 Que ondan payasos Todo bien aquí, milagros y bautismos muy pronto! This week we've been doing a bunch of Referral work trying to see how many actually are available and interested in messages and it lead to us finding Darwín & Luis. Darwín is super awesome, very kind and funny. He's from Homduras 🇭🇳 and saw something different in the English Elders and so we got invited over. We taught him 2 this week and I'm excited to see his progression. Pray for him to find a way to make it to church. Luis is from Peru 🇵🇪 also fairly young and very polite. Already has a ton of knowledge of the church from seeing the temple, missionaries ect. There in Peru. We taught him 2 this week and are working with him so he realizes that church is more important that more work. We remodeled the entire apartment because we now have Creole living with us. It was kinda frustrating at first especially before it happened but now it just feels so right and it's fun having them there. Also mission tip: living with more elders = bulk buy = overall lest $ spent = 🏆 ✌️ Did some exchanges this week with Elders in my district and it was super fun (too fun for photos, sorry I'm trying to get more) Our district really pushed this week to teach a ton more and do 1 lesson with Member present (MPL) a day because a MPL keeps the DL (district leader = Me) away. Lots of Miracles from that. We went and taught our Venezuelan family which also turned out to be a birthday party. We sang, ate lots of food, and talked about eternal family through baptism and the temple (they said yes soon we'll tell you the day!) Our other friends are doing well, thinking about baptism so please pray for them and their testimonies. Along with protection, jobs and health (all that good stuff) I've been loving restudying general conference and invite y'all to do the same. Here is a current favorite talk- This Day by Elder Rasband https://www.churchofjesuschrist.org/study/general-conference/2022/10/17rasband?lang=eng Last week of the transfer, let's get it! Los amo, Elder Jacobs Pictures: Venezuelan b-day party Venezuela Peru Haiti"}, {"id": "l71", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OCT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Letter 71 · Tampa", "title": "Sooo uh I'm now a Facebook 🧍‍♂️content creator 💫", "date": "2022-10-24T08:11:00", "group": "2022-10", "html": "<div class=\"body\"><p>Buenos días amigos!<\/p>\n<p>This was the last week of the transfer and absolutely awesome! My companions and I grew so much together and had a lot of fun! So thankful for my time with them.<\/p>\n<p>Which I guess hints that my rein of terror over Tampa is over. I&#x27;m going to be reopening Largo Sp (for Elders) with Elder LuTu! I&#x27;m excited to return to one of my favorite places and with a dear friend/mission son. Elder Towne is the only one staying but will be leaving for Brazil 🇧🇷 soon. Elder Rogers is going to Dade City with Elder Dean. Anyways lets talk about the rest of the week<\/p>\n<p>We had our last district council which was fun and I definitely originally thought there would be minimal change especially in my companionship but there is a decent amount. We did 2 exchanges this week: one with South Tampa and the other with the Zone Leaders. All phenomenal Elders.<\/p>\n<p>I will not be district leader next transfer but not out of punishment or anything, as missionaries we are given Opportunities to learn and someone else needs it more right now. I loved it but also am glad to have more time to focus on my area. We did a lot of knocking this week with mostly setting up for the future since majority of people were busy and couldn&#x27;t talk immediately.<\/p>\n<p>We got a call from some members visiting from New Jersey but in need of blessings to we had the opportunity to do that. They also have a few referrals for us here!<\/p>\n<p>For the title of the email, yes you read that right. I somehow have been doing good on Facebook with my somewhat infrequent gospel posts that Facebook is now sending my stuff out as a content creator and this may lead to me being able to reach out to more people! So I&#x27;m excited and open to any ideas of posts so I can keep trying to gather Israel One last thing from this week before the spiritual thought,<\/p>\n<p>We wake up Sunday morning, do our normal schedule, get out the door early for ward council then... Our freaking Car is MISSING<\/p>\n<p>turns out there is a required sticker permit that we didn&#x27;t know about and wasn&#x27;t on our car since it&#x27;s so new. Also I&#x27;ve been living in this complex with this car for 3 transfers (18 weeks almost 5 months). We ended up getting picked up by a member and Elder Tucker (our vehicle coordinator) was able to go get it from the tow yard but what a way to start the day. Something I&#x27;ve learned and what to share from these transfers here in Tampa as a trainer and district leader is that the Lord knows us, called us, and qualifies us.<\/p>\n<p>I did not know everything about district leader, about the new area, or how to train exactly to the needs of my companions. I made mistakes but because I was put into that growth zone feeling uncomfortable I grew so much more that I could&#x27;ve without.<\/p>\n<p>Be nice to yourself! God will help you! The atonement is the way!<\/p>\n<p class=\"sign\">Los amo mucho! Hasta que esté en mi área nueva!<\/p>\n<p>Elder Jacobo<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>sid<\/li>\n<li>funny Facebook market place<\/li>\n<li>zone call set up<\/li>\n<li>meme<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-10-24_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-24_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-24_0_2.jpg\" alt=\"\"><\/figure><\/div>", "text": "Sooo uh I'm now a Facebook 🧍‍♂️content creator 💫 Buenos días amigos! This was the last week of the transfer and absolutely awesome! My companions and I grew so much together and had a lot of fun! So thankful for my time with them. Which I guess hints that my rein of terror over Tampa is over. I'm going to be reopening Largo Sp (for Elders) with Elder LuTu! I'm excited to return to one of my favorite places and with a dear friend/mission son. Elder Towne is the only one staying but will be leaving for Brazil 🇧🇷 soon. Elder Rogers is going to Dade City with Elder Dean. Anyways lets talk about the rest of the week We had our last district council which was fun and I definitely originally thought there would be minimal change especially in my companionship but there is a decent amount. We did 2 exchanges this week: one with South Tampa and the other with the Zone Leaders. All phenomenal Elders. I will not be district leader next transfer but not out of punishment or anything, as missionaries we are given Opportunities to learn and someone else needs it more right now. I loved it but also am glad to have more time to focus on my area. We did a lot of knocking this week with mostly setting up for the future since majority of people were busy and couldn't talk immediately. We got a call from some members visiting from New Jersey but in need of blessings to we had the opportunity to do that. They also have a few referrals for us here! For the title of the email, yes you read that right. I somehow have been doing good on Facebook with my somewhat infrequent gospel posts that Facebook is now sending my stuff out as a content creator and this may lead to me being able to reach out to more people! So I'm excited and open to any ideas of posts so I can keep trying to gather Israel One last thing from this week before the spiritual thought, We wake up Sunday morning, do our normal schedule, get out the door early for ward council then... Our freaking Car is MISSING turns out there is a required sticker permit that we didn't know about and wasn't on our car since it's so new. Also I've been living in this complex with this car for 3 transfers (18 weeks almost 5 months). We ended up getting picked up by a member and Elder Tucker (our vehicle coordinator) was able to go get it from the tow yard but what a way to start the day. Something I've learned and what to share from these transfers here in Tampa as a trainer and district leader is that the Lord knows us, called us, and qualifies us. I did not know everything about district leader, about the new area, or how to train exactly to the needs of my companions. I made mistakes but because I was put into that growth zone feeling uncomfortable I grew so much more that I could've without. Be nice to yourself! God will help you! The atonement is the way! Los amo mucho! Hasta que esté en mi área nueva! Elder Jacobo Pictures: sid funny Facebook market place zone call set up meme Brazil"}, {"id": "l72", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">OCT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 72 · Largo", "title": "👻 Happy Halloween 🎃", "date": "2022-10-31T13:49:00", "group": "2022-10", "html": "<div class=\"body\"><p>🧟‍♂️🤺¡Feliz noche de brujas!🧛‍♀️🥷<\/p>\n<p>Estou trabalhando duro aqui em Largo e tudo vai muito bem!<\/p>\n<p>This week was honestly disheartening at first but things are looking better! Transfers was Tuesday and we realized how much harder this would be than originally anticipated. Living in Gulfport (the corner of Saint Pete), on car share, and an almost dead area.<\/p>\n<p>When I left Largo, it was bursting with friends and so much work to be done. Now it seems that we are working from a almost bare foundation.<\/p>\n<p>Luckily, we have some beast members who have been itching from Elders to be brought back and have hit the ground running with us. Still a lot of work to be done but we are getting some more friends slowly and are trying hard to strengthen relationships with members.<\/p>\n<p>We had our fall festival &amp; trunk or treat and Stake Conference. Both very fun activities with some running around trying to make sure everything was good. Peep the trunk pic!<\/p>\n<p>The last thing, which really made my week, was Sunday. Sunday, after Stake Conference, we left for Tampa. My friend Yolennis got baptized and wanted me to do it! It was so awesome and a very special experience. But Sunday did not end there!<\/p>\n<p>I also saw other friends/members and was able to saw goodbye in person. Hugo was there and had an accident in work, I was there for the baptism, and was also able to be there for him.<\/p>\n<p>Then I was able to stop by the Franco family and saw goodbye to them as well. Just a chain of Miracles from God allowing me to be there for friends before being all in St. Pete.<\/p>\n<p>Mosiah 24<\/p>\n<p>12 And Alma and his people did not raise their voices to the Lord their God, but did pour out their hearts to him; and he did know the thoughts of their hearts.<\/p>\n<p>13 And it came to pass that the voice of the Lord came to them in their afflictions, saying: Lift up your heads and be of good comfort, for I know of the covenant which ye have made unto me; and I will covenant with my people and deliver them out of bondage.<\/p>\n<p>14 And I will also ease the burdens which are put upon your shoulders, that even you cannot feel them upon your backs, even while you are in bondage; and this will I do that ye may stand as witnesses for me hereafter, and that ye may know of a surety that I, the Lord God, do visit my people in their afflictions.<\/p>\n<p>Through us and others, God visits our friends and us in our afflictions. Trust in him!<\/p>\n<p class=\"sign\">Los amo muito!<\/p>\n<p>Elder Jacobo<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Gyro<\/li>\n<li>Elder Chevy<\/li>\n<li>Elder Owen &amp; Us<\/li>\n<li>Elder LuTu &amp; I back again!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-10-31_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-31_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-31_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-31_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "👻 Happy Halloween 🎃 🧟‍♂️🤺¡Feliz noche de brujas!🧛‍♀️🥷 Estou trabalhando duro aqui em Largo e tudo vai muito bem! This week was honestly disheartening at first but things are looking better! Transfers was Tuesday and we realized how much harder this would be than originally anticipated. Living in Gulfport (the corner of Saint Pete), on car share, and an almost dead area. When I left Largo, it was bursting with friends and so much work to be done. Now it seems that we are working from a almost bare foundation. Luckily, we have some beast members who have been itching from Elders to be brought back and have hit the ground running with us. Still a lot of work to be done but we are getting some more friends slowly and are trying hard to strengthen relationships with members. We had our fall festival & trunk or treat and Stake Conference. Both very fun activities with some running around trying to make sure everything was good. Peep the trunk pic! The last thing, which really made my week, was Sunday. Sunday, after Stake Conference, we left for Tampa. My friend Yolennis got baptized and wanted me to do it! It was so awesome and a very special experience. But Sunday did not end there! I also saw other friends/members and was able to saw goodbye in person. Hugo was there and had an accident in work, I was there for the baptism, and was also able to be there for him. Then I was able to stop by the Franco family and saw goodbye to them as well. Just a chain of Miracles from God allowing me to be there for friends before being all in St. Pete. Mosiah 24 12 And Alma and his people did not raise their voices to the Lord their God, but did pour out their hearts to him; and he did know the thoughts of their hearts. 13 And it came to pass that the voice of the Lord came to them in their afflictions, saying: Lift up your heads and be of good comfort, for I know of the covenant which ye have made unto me; and I will covenant with my people and deliver them out of bondage. 14 And I will also ease the burdens which are put upon your shoulders, that even you cannot feel them upon your backs, even while you are in bondage; and this will I do that ye may stand as witnesses for me hereafter, and that ye may know of a surety that I, the Lord God, do visit my people in their afflictions. Through us and others, God visits our friends and us in our afflictions. Trust in him! Los amo muito! Elder Jacobo Pictures: Gyro Elder Chevy Elder Owen & Us Elder LuTu & I back again! "}, {"id": "l73", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["BR", "WS"], "moments": ["Baptism"], "extra": "Brazil Samoa", "kind": "Letter 73 · Largo", "title": "Finding grind & Miracles", "date": "2022-11-07T12:45:00", "group": "2022-11", "html": "<div class=\"body\"><p>Talofa!<\/p>\n<p>Another week in Largo and this one was a lot better! We still have been doing mostly finding but are seeing some progress.<\/p>\n<p>I also have started learning some Samoan 🇼🇸 🇦🇸 from Elder Lutu which has been a fun little challenge. We have realized that we have been put together for many reasons (many still to be found) but one main one is languages and cultures. We speak English and Spanish, I also speak portugese and He speaks Samoan so we are connecting with lots of people: Latinos, Brazilians, and Polys. We are hoping that by working with members in every ward and talking to everyone the Zone will pop off and the work progress a ton!<\/p>\n<p>Monday was Halloween and unlike last year of staying inside we had a finding challenge. We still returned earlier than normal but had a challenge between zones and the while mission of who could find the most. Our Zone beat the Ocala Zone but the overall champ was Lakeland. We also played pickleball earlier as a district in Halloween costumes for pday. Tuesday was our first district council and we were able to set to goals and get to know the other missionaries. This transfer should be awesome. I also was able to go on exchange with Elder Inkley which was a party. We have been doing lots of finding like I already said which has lead to us giving lots of referrals but also finding a family in our area! Definitely miracle. Slowly been working on getting to know the members better by sharing messages but should be more successful this week as more people are available.<\/p>\n<p>I found one of our friends over Facebook which was cool since normally it feels like posting does nothing and she is really interested in learning right now. Update you on Yanet next week after.pur next lesson.<\/p>\n<p>The last big thing from this week was the funeral. Hermana Januaria&#x27;s husband passed away at 62, it was pretty sudden and shocking to the family so please pray for them. We had a very nice service Saturday for him but a lot of healing up ahead for them.<\/p>\n<p>Prayer has been our secret weapon this week. We pray for help, to find people, spiritual gifts, ect. And they come as long as we do our part and seek them.<\/p>\n<p>D&amp;C 46<\/p>\n<p>8 Wherefore, beware lest ye are deceived; and that ye may not be deceived seek ye earnestly the best gifts, always remembering for what they are given;<\/p>\n<p>9 For verily I say unto you, they are given for the benefit of those who love me and keep all my commandments, and him that seeketh so to do; that all may be benefited that seek or that ask of me, that ask and not for a sign that they may consume it upon their lusts.<\/p>\n<p>10 And again, verily I say unto you, I would that ye should always remember, and always retain in your minds what those gifts are, that are given unto the church<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Elder Iacopo<\/p>\n<p>P.S. we have been wondering how we will baptize anyone since we don&#x27;t know if we have anyone to solid but then we got a referral that has a date! We are super excited and so blessed by Heavenly Father<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>lizard on leaf bed<\/li>\n<li>the facebook grind<\/li>\n<li>Elder Owen and some birds jaja<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-11-07_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-07_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "Finding grind & Miracles Talofa! Another week in Largo and this one was a lot better! We still have been doing mostly finding but are seeing some progress. I also have started learning some Samoan 🇼🇸 🇦🇸 from Elder Lutu which has been a fun little challenge. We have realized that we have been put together for many reasons (many still to be found) but one main one is languages and cultures. We speak English and Spanish, I also speak portugese and He speaks Samoan so we are connecting with lots of people: Latinos, Brazilians, and Polys. We are hoping that by working with members in every ward and talking to everyone the Zone will pop off and the work progress a ton! Monday was Halloween and unlike last year of staying inside we had a finding challenge. We still returned earlier than normal but had a challenge between zones and the while mission of who could find the most. Our Zone beat the Ocala Zone but the overall champ was Lakeland. We also played pickleball earlier as a district in Halloween costumes for pday. Tuesday was our first district council and we were able to set to goals and get to know the other missionaries. This transfer should be awesome. I also was able to go on exchange with Elder Inkley which was a party. We have been doing lots of finding like I already said which has lead to us giving lots of referrals but also finding a family in our area! Definitely miracle. Slowly been working on getting to know the members better by sharing messages but should be more successful this week as more people are available. I found one of our friends over Facebook which was cool since normally it feels like posting does nothing and she is really interested in learning right now. Update you on Yanet next week after.pur next lesson. The last big thing from this week was the funeral. Hermana Januaria's husband passed away at 62, it was pretty sudden and shocking to the family so please pray for them. We had a very nice service Saturday for him but a lot of healing up ahead for them. Prayer has been our secret weapon this week. We pray for help, to find people, spiritual gifts, ect. And they come as long as we do our part and seek them. D&C 46 8 Wherefore, beware lest ye are deceived; and that ye may not be deceived seek ye earnestly the best gifts, always remembering for what they are given; 9 For verily I say unto you, they are given for the benefit of those who love me and keep all my commandments, and him that seeketh so to do; that all may be benefited that seek or that ask of me, that ask and not for a sign that they may consume it upon their lusts. 10 And again, verily I say unto you, I would that ye should always remember, and always retain in your minds what those gifts are, that are given unto the church Los amo! Elder Iacopo P.S. we have been wondering how we will baptize anyone since we don't know if we have anyone to solid but then we got a referral that has a date! We are super excited and so blessed by Heavenly Father Pictures: lizard on leaf bed the facebook grind Elder Owen and some birds jaja Brazil Samoa"}, {"id": "l74", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": ["MX", "BR", "WS"], "moments": ["Holidays"], "extra": "Mexico Brazil Samoa", "kind": "Letter 74 · Largo", "title": "⚡️Sparks flyin, 🤯Miracles incomin, and we just livin 🤙", "date": "2022-11-14T13:43:00", "group": "2022-11", "html": "<div class=\"body\"><p>Manuia Soifua!<\/p>\n<p>Blessed/Good afternoon!<\/p>\n<p>Yes, still learning Samoan but hey gotta find things you like and show your love to others. Culture is very important to many- Latin America, Brazilians, Polys, and even the small family traditions (like the Jacobs family cookies during Christmas). Everything like that is important to who we are!<\/p>\n<p>We are Children of God<\/p>\n<p>Children of the Covenant<\/p>\n<p>Disciples of Jesus the Christ<\/p>\n<p>2 Nephi 25:<\/p>\n<p>26 And we talk of Christ, we rejoice in Christ, we preach of Christ, we prophesy of Christ, and we write according to our prophecies, that our children may know to what source they may look for a remission of their sins Fa&#x27;afetai!<\/p>\n<p>Thanks!<\/p>\n<p>Anyways onto this week...<\/p>\n<p>Tuesday we had another district council and ended it with Sushi at Sushi kabuki. We then had a fire exchange with Elder Devere from Social media. It was awesome to see how to continue to apply it to missionary work and grow my &quot;personal areabook&quot; aka people who have been drawn to the gospel by me being myself online.<\/p>\n<p>This week we are doing a #becausehegave #PorqueÉlnosdio to spread gratitude and uplifting thoughts Let me know if you want to join me and I can send some pre-made content to get you started!<\/p>\n<p>We have a hype new friend named Javi who knows a lot about the Bible and was very receptive to the Book of Mormon. Stay tuned for next week and coming lessons.<\/p>\n<p>Sparks is in the title because of some Dryer problems... our dryer broke randomly and caused to air dry our clothes temporarily. The dryer problem was caused by a bad outlet which was discovers by Elder Hammond (our housing coordinator) and me having sparks fly out of the outlet while sweeping away the dust bunnies 🐰, luckily no burns 😉 Our big miracle this week started Thursday night by stop bys. We were looking for a member but no luck as we were leaving we left a pass along card in one of the cars but I had a feeling we needed to put it in both cars which lead to us getting a message the following day from Fermin. He had talked but not like missionaries in Spain but our card seemed to really touch him and he wanted to talk. We shared the Restoration of the Gospel and he is really interested in learning more from us and his own studies. Following the spirit is awesome.<\/p>\n<p>We had some awesome food at a Members restaurant, Thanksgiving party, and our own cooking. Life is good<\/p>\n<p class=\"sign\">Los amo chamos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>thrift store (5$ kinda white elefant challenge)<\/li>\n<li>authentic Mexican food from Hermana Isela in her restaurant Los Amigos<\/li>\n<li>sunset<\/li>\n<li>evening vibin<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-11-14_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-14_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-14_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-14_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-14_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-14_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-14_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "⚡️Sparks flyin, 🤯Miracles incomin, and we just livin 🤙 Manuia Soifua! Blessed/Good afternoon! Yes, still learning Samoan but hey gotta find things you like and show your love to others. Culture is very important to many- Latin America, Brazilians, Polys, and even the small family traditions (like the Jacobs family cookies during Christmas). Everything like that is important to who we are! We are Children of God Children of the Covenant Disciples of Jesus the Christ 2 Nephi 25: 26 And we talk of Christ, we rejoice in Christ, we preach of Christ, we prophesy of Christ, and we write according to our prophecies, that our children may know to what source they may look for a remission of their sins Fa'afetai! Thanks! Anyways onto this week... Tuesday we had another district council and ended it with Sushi at Sushi kabuki. We then had a fire exchange with Elder Devere from Social media. It was awesome to see how to continue to apply it to missionary work and grow my \"personal areabook\" aka people who have been drawn to the gospel by me being myself online. This week we are doing a #becausehegave #PorqueÉlnosdio to spread gratitude and uplifting thoughts Let me know if you want to join me and I can send some pre-made content to get you started! We have a hype new friend named Javi who knows a lot about the Bible and was very receptive to the Book of Mormon. Stay tuned for next week and coming lessons. Sparks is in the title because of some Dryer problems... our dryer broke randomly and caused to air dry our clothes temporarily. The dryer problem was caused by a bad outlet which was discovers by Elder Hammond (our housing coordinator) and me having sparks fly out of the outlet while sweeping away the dust bunnies 🐰, luckily no burns 😉 Our big miracle this week started Thursday night by stop bys. We were looking for a member but no luck as we were leaving we left a pass along card in one of the cars but I had a feeling we needed to put it in both cars which lead to us getting a message the following day from Fermin. He had talked but not like missionaries in Spain but our card seemed to really touch him and he wanted to talk. We shared the Restoration of the Gospel and he is really interested in learning more from us and his own studies. Following the spirit is awesome. We had some awesome food at a Members restaurant, Thanksgiving party, and our own cooking. Life is good Los amo chamos! Elder Jacobs Pictures: thrift store (5$ kinda white elefant challenge) authentic Mexican food from Hermana Isela in her restaurant Los Amigos sunset evening vibin Mexico Brazil Samoa"}, {"id": "l75", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Holidays"], "extra": "", "kind": "Letter 75 · Largo", "title": "Because he gave 😇", "date": "2022-11-21T12:03:00", "group": "2022-11", "html": "<div class=\"body\"><p>Malo soifua!<\/p>\n<p>This week was not super eventful but still good.<\/p>\n<p>We had lots of friends busy/ghosting us so it left lots of lessons canceled and time to find and get to know members. Elder Owen&#x27;s car was also in the shop this week limiting our time with him but he&#x27;s super ready to get going this week. Our friend Fermin, who I talked about last week, is no longer very interested in meeting with us but we are still friends and talk often. An important lesson learned from being friends first and teaching because of that already established friendship and love. I&#x27;m hoping to learn more from him about languages since he is a linguist!<\/p>\n<p>We had an interfaith Thanksgiving devotional which included talks from, our stake president, monks, Jewish Rabbis, Reverends, and some awesome musical numbers. A very fun, cool, and at times strange experience. I&#x27;m trying to take more pictures and make more memories which lead to us visiting the pier at dinner/sunset along with other random stuff like the peacocks wandering the neighborhood. I&#x27;m loving my time here despite setbacks and the slow grind.<\/p>\n<p>We received another referral from Facebook and he also has a baptism date! The last one didn&#x27;t answer and work our but Emilio is very excited to learn more and try to come to church. He actually is someone I taught last time I was here! A good reunion with an old friend.<\/p>\n<p>The sun light is limited these days making us scramble to use it all and not get to cold but Florida is still bipolar. Yesterday we were freezing and today we are sweating again.<\/p>\n<p>Thanksgiving is coming up we have a bunch of plans of visiting people and this week was spent as a mission posting gratitude.<\/p>\n<p>#becausehegave<\/p>\n<p>Living life with more gratitude helps one remember and feel God&#x27;s infinite and perfect love. I like &quot;Count your blessings&quot; especially Verse 4:<\/p>\n<p>So amid the conflict, whether great or small,<\/p>\n<p>Do not be discouraged; God is over all.<\/p>\n<p>Count your many blessings; angels will attend,<\/p>\n<p>Help and comfort give you to your journey’s end...<\/p>\n<p class=\"sign\">Los amo mucho,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>sunset at the pier<\/li>\n<li>dinner at Elder Owen&#x27;s<\/li>\n<li>Fútbol night<\/li>\n<li>farmer Owen<\/li>\n<li>peacocks<\/li>\n<li>Sleepy Elder Lutu<\/li>\n<li>Walmart<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-11-21_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-21_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "Because he gave 😇 Malo soifua! This week was not super eventful but still good. We had lots of friends busy/ghosting us so it left lots of lessons canceled and time to find and get to know members. Elder Owen's car was also in the shop this week limiting our time with him but he's super ready to get going this week. Our friend Fermin, who I talked about last week, is no longer very interested in meeting with us but we are still friends and talk often. An important lesson learned from being friends first and teaching because of that already established friendship and love. I'm hoping to learn more from him about languages since he is a linguist! We had an interfaith Thanksgiving devotional which included talks from, our stake president, monks, Jewish Rabbis, Reverends, and some awesome musical numbers. A very fun, cool, and at times strange experience. I'm trying to take more pictures and make more memories which lead to us visiting the pier at dinner/sunset along with other random stuff like the peacocks wandering the neighborhood. I'm loving my time here despite setbacks and the slow grind. We received another referral from Facebook and he also has a baptism date! The last one didn't answer and work our but Emilio is very excited to learn more and try to come to church. He actually is someone I taught last time I was here! A good reunion with an old friend. The sun light is limited these days making us scramble to use it all and not get to cold but Florida is still bipolar. Yesterday we were freezing and today we are sweating again. Thanksgiving is coming up we have a bunch of plans of visiting people and this week was spent as a mission posting gratitude. #becausehegave Living life with more gratitude helps one remember and feel God's infinite and perfect love. I like \"Count your blessings\" especially Verse 4: So amid the conflict, whether great or small, Do not be discouraged; God is over all. Count your many blessings; angels will attend, Help and comfort give you to your journey’s end... Los amo mucho, Elder Jacobs Pictures: sunset at the pier dinner at Elder Owen's Fútbol night farmer Owen peacocks Sleepy Elder Lutu Walmart "}, {"id": "l76", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": ["VE", "WS"], "moments": ["Baptism", "Holidays"], "extra": "Venezuela Samoa", "kind": "Letter 76 · Largo", "title": "How I almost exploded 🤯🦃🫔", "date": "2022-11-28T15:07:00", "group": "2022-11", "html": "<div class=\"body\"><p>Feliz día de acción de gracias!<\/p>\n<p>Espero que tuvieran mucha comida y tiempo con familia y amigos<\/p>\n<p>This week was very good much better than the last. We started the week with some member stop bys which introduced us to Haydee, Franklin, and The Tuinakavandras (from fiji). All visits were awesome and led to some Referrals which we have high hopes for but to be seen this week.<\/p>\n<p>We did not have district council Tuesday but still had an exchange which was awesome and led to a bunch of on contact lessons! We may have found a new family to teach as well! Yaima &amp; Rafael<\/p>\n<p>The rest of the week missionary work with friends and members went fairly uneventful, lessons failing, rescheduling, and random visits. One really cool thing happened with Emilio. I taught him last time I was here and he remembers me well and still remembers the lessons too. Just working on getting him to church.<\/p>\n<p>Turkey day, Thanksgiving, día de acción de gracias was epic. We had district council then a bomb district lunch (actually met besides the things I brought/made since I am the only one who knows how to cook). We also had another lunch with members of the stake who don&#x27;t have family, a bbq with some Samoans, and a dinner with Uncle Fatu (another Samoan) The highlight of the week was Jorge&#x27;s &amp; Ester&#x27;s baptism Sunday. I was able to go back and enjoy being with the Franco family. They truly are some of the coolest and most loving people I know and I&#x27;m so excited for their future. Remember the spirit is key in all things:<\/p>\n<p>The Prophet Joseph set an example for us of how to receive continual spiritual direction and comfort through the Holy Ghost.<\/p>\n<p>The first choice he made was to be humble before God.<\/p>\n<p>The second was to pray with faith in the Lord Jesus Christ.<\/p>\n<p>The third was to obey exactly. Obedience may mean to move quickly. It may mean to prepare. Or it may mean to wait in patience for further inspiration.<\/p>\n<p>And the fourth is to pray to know the needs and hearts of others and how to help them for the Lord. Joseph prayed for the Saints in distress when he was in prison. It has been my opportunity to observe the prophets of God as they pray, ask for inspiration, receive direction, and act on it.<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2018/04/his-spirit-to-be-with-you?lang=eng<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Exchange with Elder Sierra<\/li>\n<li>duck<\/li>\n<li>hermana Isela doing her magic tacos once again<\/li>\n<li>district Thanksgiving<\/li>\n<li>Franklin &amp; Raul visited us from Brandon!<\/li>\n<li>hallaca (traditional Venezuelan Christmas dish)<\/li>\n<li>super good treat (must try!)<\/li>\n<li>baptism (the Francos &amp; I got to see Nicolas)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-11-28_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-28_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-28_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-28_0_8.jpg\" alt=\"\"><\/figure><\/div>", "text": "How I almost exploded 🤯🦃🫔 Feliz día de acción de gracias! Espero que tuvieran mucha comida y tiempo con familia y amigos This week was very good much better than the last. We started the week with some member stop bys which introduced us to Haydee, Franklin, and The Tuinakavandras (from fiji). All visits were awesome and led to some Referrals which we have high hopes for but to be seen this week. We did not have district council Tuesday but still had an exchange which was awesome and led to a bunch of on contact lessons! We may have found a new family to teach as well! Yaima & Rafael The rest of the week missionary work with friends and members went fairly uneventful, lessons failing, rescheduling, and random visits. One really cool thing happened with Emilio. I taught him last time I was here and he remembers me well and still remembers the lessons too. Just working on getting him to church. Turkey day, Thanksgiving, día de acción de gracias was epic. We had district council then a bomb district lunch (actually met besides the things I brought/made since I am the only one who knows how to cook). We also had another lunch with members of the stake who don't have family, a bbq with some Samoans, and a dinner with Uncle Fatu (another Samoan) The highlight of the week was Jorge's & Ester's baptism Sunday. I was able to go back and enjoy being with the Franco family. They truly are some of the coolest and most loving people I know and I'm so excited for their future. Remember the spirit is key in all things: The Prophet Joseph set an example for us of how to receive continual spiritual direction and comfort through the Holy Ghost. The first choice he made was to be humble before God. The second was to pray with faith in the Lord Jesus Christ. The third was to obey exactly. Obedience may mean to move quickly. It may mean to prepare. Or it may mean to wait in patience for further inspiration. And the fourth is to pray to know the needs and hearts of others and how to help them for the Lord. Joseph prayed for the Saints in distress when he was in prison. It has been my opportunity to observe the prophets of God as they pray, ask for inspiration, receive direction, and act on it. https://www.churchofjesuschrist.org/study/general-conference/2018/04/his-spirit-to-be-with-you?lang=eng Los amo! Elder Jacobs Pictures: Exchange with Elder Sierra duck hermana Isela doing her magic tacos once again district Thanksgiving Franklin & Raul visited us from Brandon! hallaca (traditional Venezuelan Christmas dish) super good treat (must try!) baptism (the Francos & I got to see Nicolas) Venezuela Samoa"}, {"id": "l77", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">DEC 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": [], "moments": ["Holidays"], "extra": "", "kind": "Letter 77 · Largo", "title": "El fin de Largo...", "date": "2022-12-05T12:11:00", "group": "2022-12", "html": "<div class=\"body\"><p>Hola! Como están amigos y familiares?<\/p>\n<p>Yup that&#x27;s right, I&#x27;ve come to the end of my time in Largo. Transfers have come and I&#x27;m leaving to Fort Myers. I&#x27;m excited because there is a lot of work there especially portugese. Elder Lutu is staying.<\/p>\n<p>This week went well, not a ton happened with friends sadly. We had to drop a lot of them due to busyness and frankly being uninterested. The best thing was 5 friends at church since a member brought all her urbanized grandkids. We&#x27;ll see if they can be taught soon!!<\/p>\n<p>The Christmas devotional was fire! Also Luz de las naciones go watch both of those asap! Awesome music, messages and spirit.<\/p>\n<p>We did a bunch of member visits, got some more trust built and Referrals. Also did a fire exchange with Elder Condie. It was fun to be with him and learn so much.<\/p>\n<p>Sorry for the short email, not much happened and I&#x27;m busy packing. Let me know how YOU are and I&#x27;ll try to respond back<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Elder Jacobo<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>bald eagle<\/li>\n<li>Dinner with Elder Owen!<\/li>\n<li>some AZ native American pot<\/li>\n<li>🐙<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-12-05_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-05_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-05_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-05_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "El fin de Largo... Hola! Como están amigos y familiares? Yup that's right, I've come to the end of my time in Largo. Transfers have come and I'm leaving to Fort Myers. I'm excited because there is a lot of work there especially portugese. Elder Lutu is staying. This week went well, not a ton happened with friends sadly. We had to drop a lot of them due to busyness and frankly being uninterested. The best thing was 5 friends at church since a member brought all her urbanized grandkids. We'll see if they can be taught soon!! The Christmas devotional was fire! Also Luz de las naciones go watch both of those asap! Awesome music, messages and spirit. We did a bunch of member visits, got some more trust built and Referrals. Also did a fire exchange with Elder Condie. It was fun to be with him and learn so much. Sorry for the short email, not much happened and I'm busy packing. Let me know how YOU are and I'll try to respond back Los amo! Elder Jacobo Pictures: bald eagle Dinner with Elder Owen! some AZ native American pot 🐙 "}, {"id": "l78", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">DEC 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": ["VE", "BR"], "moments": ["Holidays"], "extra": "Venezuela Brazil", "kind": "Letter 78 · Fort Myers", "title": "🇧🇷😎 Brazileros por todos lados! 🇧🇷", "date": "2022-12-12T15:03:00", "group": "2022-12", "html": "<div class=\"body\"><p>Boa tarde amigos, espero que estejam bem e tiveram uma boa semana. A minha foi muito bem!<\/p>\n<p>I&#x27;m loving my new area and all the fun things we&#x27;re doing. Elder O&#x27;Neill and I are doing great as well lots of laughs and good work. Including bike which is something kinda new since I&#x27;ve been lucky enough to not do much before. Sadly someone stole my lights and bike seat so hopefully they enjoy that and get smacked by the spirit for stealing. This is probably the fastest I&#x27;ve ever been able to get to know members too. We&#x27;ve had Member meals, lessons, church and other meetings and it is so awesome how much they want to help us.<\/p>\n<p>We have some cool friends: Melissa, Pablo, Julio, doina, yamila, Omar, and many more I&#x27;m trying to know. Our English class is super lit and their are Brazilians there! They taught me some words they use a lot but it&#x27;s slang and they couldn&#x27;t really explain so I&#x27;m still trying to figure those out.<\/p>\n<p>But there are Brazilians everywhere! Like literally everywhere near where we live which has lead to lots of cool interactions and strengthening my ability to speak. We even found a new family (more possible ones too!)- Sandro, Hector, Victor and his wife who we have yet to meet. And I got to practice more with the Omar family who just moved into the ward a month ago and we ate with on Sunday night.<\/p>\n<p>This weekend is our Christmas party and Thursday is Christmas zone conference so lots of cool things this week but also that means a fat car drive. That&#x27;s something I&#x27;ve learned about the Fort Myers zone: long drives, not enough miles, everyone bikes.<\/p>\n<p>But I&#x27;m loving my time here and it&#x27;s going great.<\/p>\n<p>Here&#x27;s a cool scripture I read this week in my studies<\/p>\n<p class=\"sign\">Los amo muito,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>bishops store house<\/li>\n<li>🐝<\/li>\n<li>got V8 from Messia (new Brazilian friend)<\/li>\n<li>Madi our neighbors dog came and visited while doing our morning contacts<\/li>\n<li>Katy (Venezuelan moon pies soooo much better)<\/li>\n<li>primary kids attacked with stickers for an activity 😳 😆<\/li>\n<li>dinner with Omar family<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>Alma 26:<\/p>\n<p>11 But Ammon said unto him: I do not boast in my own strength, nor in my own wisdom; but behold, my joy is full, yea, my heart is brim with joy, and I will rejoice in my God.<\/p>\n<p>12 Yea, I know that I am nothing; as to my strength I am weak; therefore I will not boast of myself, but I will boast of my God, for in his strength I can do all things; yea, behold, many mighty miracles we have wrought in this land, for which we will praise his name forever.<\/p><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-12-12_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-12_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-12_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-12_0_8.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_406.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🇧🇷😎 Brazileros por todos lados! 🇧🇷 Boa tarde amigos, espero que estejam bem e tiveram uma boa semana. A minha foi muito bem! I'm loving my new area and all the fun things we're doing. Elder O'Neill and I are doing great as well lots of laughs and good work. Including bike which is something kinda new since I've been lucky enough to not do much before. Sadly someone stole my lights and bike seat so hopefully they enjoy that and get smacked by the spirit for stealing. This is probably the fastest I've ever been able to get to know members too. We've had Member meals, lessons, church and other meetings and it is so awesome how much they want to help us. We have some cool friends: Melissa, Pablo, Julio, doina, yamila, Omar, and many more I'm trying to know. Our English class is super lit and their are Brazilians there! They taught me some words they use a lot but it's slang and they couldn't really explain so I'm still trying to figure those out. But there are Brazilians everywhere! Like literally everywhere near where we live which has lead to lots of cool interactions and strengthening my ability to speak. We even found a new family (more possible ones too!)- Sandro, Hector, Victor and his wife who we have yet to meet. And I got to practice more with the Omar family who just moved into the ward a month ago and we ate with on Sunday night. This weekend is our Christmas party and Thursday is Christmas zone conference so lots of cool things this week but also that means a fat car drive. That's something I've learned about the Fort Myers zone: long drives, not enough miles, everyone bikes. But I'm loving my time here and it's going great. Here's a cool scripture I read this week in my studies Los amo muito, Elder Jacobs Pictures: bishops store house 🐝 got V8 from Messia (new Brazilian friend) Madi our neighbors dog came and visited while doing our morning contacts Katy (Venezuelan moon pies soooo much better) primary kids attacked with stickers for an activity 😳 😆 dinner with Omar family Alma 26: 11 But Ammon said unto him: I do not boast in my own strength, nor in my own wisdom; but behold, my joy is full, yea, my heart is brim with joy, and I will rejoice in my God. 12 Yea, I know that I am nothing; as to my strength I am weak; therefore I will not boast of myself, but I will boast of my God, for in his strength I can do all things; yea, behold, many mighty miracles we have wrought in this land, for which we will praise his name forever. More from this week Venezuela Brazil"}, {"id": "l79", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">DEC 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Holidays"], "extra": "", "kind": "Letter 79 · Fort Myers", "title": "🎄🎅Feliz Natal! & Caroling 🎶🎵", "date": "2022-12-26T08:52:00", "group": "2022-12", "html": "<div class=\"body\"><p>Feliz Natal!<\/p>\n<p>I hope you all have been able to enjoy sweets, songs and time with family and friends. I was able to and it was great. With Christmas this week and Latinos celebrations starting on the 24th the work was going well then almost completely stopped.<\/p>\n<p>We had a bunch of portugese lessons Tuesday which was awesome but also very humbling as I could easily teach at some moments but others proved more difficult depending on their Sotaqui (accent) and the principles taught. We also were able to talk to a few new people we received as Referrals and we are excited to see what will happen with then in the future. 🤞baptism soon we hope!<\/p>\n<p>We enjoyed caroling this year. Last year we stayed inside doing other things, talking to family, or with members but this year we experienced the joy of singing. We gathered as missionaries and districts multiple times to carol and it was awesome to be able to talk to so many people, each in their language, and also to feel the spirit testify of the songs and their message. We saw many people feel more loved and surround be friends as we visited them.<\/p>\n<p>D&amp;C 25<\/p>\n<p>12 For my soul delighteth in the song of the heart; yea, the song of the righteous is a prayer unto me, and it shall be answered with a blessing upon their heads.<\/p>\n<p>13 Wherefore, lift up thy heart and rejoice, and cleave unto the covenants which thou hast made.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>llama ties!<\/li>\n<li>cookies<\/li>\n<li>caroling with the other Spanish élderes<\/li>\n<li>we hit 40s this weekend!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-12-26_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-26_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-26_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-26_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-26_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "🎄🎅Feliz Natal! & Caroling 🎶🎵 Feliz Natal! I hope you all have been able to enjoy sweets, songs and time with family and friends. I was able to and it was great. With Christmas this week and Latinos celebrations starting on the 24th the work was going well then almost completely stopped. We had a bunch of portugese lessons Tuesday which was awesome but also very humbling as I could easily teach at some moments but others proved more difficult depending on their Sotaqui (accent) and the principles taught. We also were able to talk to a few new people we received as Referrals and we are excited to see what will happen with then in the future. 🤞baptism soon we hope! We enjoyed caroling this year. Last year we stayed inside doing other things, talking to family, or with members but this year we experienced the joy of singing. We gathered as missionaries and districts multiple times to carol and it was awesome to be able to talk to so many people, each in their language, and also to feel the spirit testify of the songs and their message. We saw many people feel more loved and surround be friends as we visited them. D&C 25 12 For my soul delighteth in the song of the heart; yea, the song of the righteous is a prayer unto me, and it shall be answered with a blessing upon their heads. 13 Wherefore, lift up thy heart and rejoice, and cleave unto the covenants which thou hast made. Los amo! Elder Jacobs Pictures: llama ties! cookies caroling with the other Spanish élderes we hit 40s this weekend! "}, {"id": "l80", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">JAN 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CU\">🇨🇺 Cuba<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["CU", "BR"], "moments": [], "extra": "Cuba Brazil", "kind": "Letter 80 · Fort Myers", "title": "🎊🎉Feliz ano novo 🤯 2️⃣0️⃣2️⃣3️⃣", "date": "2023-01-02T09:50:00", "group": "2023-01", "html": "<div class=\"body\"><p>Happy new year! Hope you enjoyed some food and stuff or something. We went to bed like normal and heard some fireworks.<\/p>\n<p>This week has made me really appreciate my body and our car. With car share, a massive area, and lots of people to visit/teach we were left with almost no miles for this last week only driving on Wednesday. So to say I&#x27;m tired is an understatement but I have enjoyed fixing my bike up and cruising. Not everyday is as good because of weather or sheer amount of miles to bike but it definitely is rewarding. We also have experienced more contact with people this way and even some Miracles.<\/p>\n<p>We found a member and her kids walking around, originally we passed by but then Elder O&#x27;Neill said we should turn which is what I kinda thought too. She saw us, recognized us, and prayed we would come back. It was cool to be able to listen to her and see how we can support her. She came to church and was embraced by the members 😁 This week taught me a lot about agency and God&#x27;s plan. We had many lessons set up filling our week up almost immediately with almost no room left by Tuesday afternoon, which was awesome. But as we found with the week soon many of those canceled or rescheduled leaving empty slots last minute and us going finding, stopping by people, and going through our list of possible people to teach. It was really frustrating but I also know how much it taught us and the things we were able to do instead were better.<\/p>\n<p>2 Nephi 27:23<\/p>\n<p>For behold, I am God; and I am a God of miracles; and I will show unto the world that I am the same yesterday, today, and forever; and I work not among the children of men save it be according to their faith.<\/p>\n<p>As far as the rest of the week:<\/p>\n<ul class=\"bul\">\n<li>finished 2 Nefi in Portuguese<\/li>\n<li>new year<\/li>\n<li>exchange with Elder Cook (we had a ton of fun biking and following the spirit of who to visit)<\/li>\n<li>biking around town with no hands is the new thing<\/li>\n<li>church at 11 now 🙏<\/li>\n<li>made an epic pork roast (cuban rice, black beans, and peppers) 😋<\/li>\n<li>I&#x27;ve been able to have some pretty cool and more complex conversations in Portuguese! We talked about English grammar and why Portuguese speakers can better pronounce English than Spanish<\/li>\n<\/ul>\n<p>Liek I already said the canceled lessons made the week slower plus the holidays but all is well. Remember God loves you!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>exchange with Elder Cook(ie)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-02_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-02_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "🎊🎉Feliz ano novo 🤯 2️⃣0️⃣2️⃣3️⃣ Happy new year! Hope you enjoyed some food and stuff or something. We went to bed like normal and heard some fireworks. This week has made me really appreciate my body and our car. With car share, a massive area, and lots of people to visit/teach we were left with almost no miles for this last week only driving on Wednesday. So to say I'm tired is an understatement but I have enjoyed fixing my bike up and cruising. Not everyday is as good because of weather or sheer amount of miles to bike but it definitely is rewarding. We also have experienced more contact with people this way and even some Miracles. We found a member and her kids walking around, originally we passed by but then Elder O'Neill said we should turn which is what I kinda thought too. She saw us, recognized us, and prayed we would come back. It was cool to be able to listen to her and see how we can support her. She came to church and was embraced by the members 😁 This week taught me a lot about agency and God's plan. We had many lessons set up filling our week up almost immediately with almost no room left by Tuesday afternoon, which was awesome. But as we found with the week soon many of those canceled or rescheduled leaving empty slots last minute and us going finding, stopping by people, and going through our list of possible people to teach. It was really frustrating but I also know how much it taught us and the things we were able to do instead were better. 2 Nephi 27:23 For behold, I am God; and I am a God of miracles; and I will show unto the world that I am the same yesterday, today, and forever; and I work not among the children of men save it be according to their faith. As far as the rest of the week: finished 2 Nefi in Portuguese new year exchange with Elder Cook (we had a ton of fun biking and following
