so a guy who served 23 tours in iraq and gas a bionic knuckle. *None of this is real they are just crazy* I guess I have a lot to look forward to haha. Hope all of you who celebrated pioneer day had some fun. We just worked like usual.🦎 My milagro (miracle) this week was probably the Miño family. They are some super awesome members who fellowship with everyone no matter how new they are to the branch, even me. I was having some low blood sugar and was out of sugar for it and so we stopped by which allowed us to talk, introduce myself, and we got a popsicle. Definitely a blessing in the 95° 100% humidity. Living and working in the Jungle,🦎 Elder Jacobs Pictures this week: Flying over florida Wild pineapple Porcelain donkey Elder Nelson annoyed a con man for and got for free Huge rain storm Friday evening. There is a reason Florida is called the lightning capital of the world. We had umbrellas but the amount of rain and wind made them useless so we were soaked. Local Florida man not caring about the rain only his lawnmower P day with the Elders (Elder Nelson, Elder Ballif, Elder Ricks, and me) More from this week Argentina"}, {"id": "l7", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AUG 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"GT\">🇬🇹 Guatemala<\/span><span class=\"stamp m\">🐊 Gators<\/span><\/div>", "cultures": ["GT"], "moments": ["Gators"], "extra": "Guatemala", "kind": "Letter 7 · Dade City", "title": "Qué Mojado! (how wet!)", "date": "2021-08-02T15:43:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola familia y mis amigos<\/p>\n<p>This week has come and gone already but it is nice to be able to enjoy some more AC and chill on p-day. I always thought the AZ was pretty hot, and it is, but not the same misery as Florida right now. It is constantly around 90° if not more and almost 100% humidity. Which not only means its hot but wet and easily dehydrated because it gets sucked out of you. And you are wet from the humidity, sweat, and sometimes the rain. Besides that I love it here, me encanta Dade city. Tuesday was fairly uneventful but still good. We had district council in the morning which was great and then later we had prime time. Prime time is 6-9pm and we just message people who respond to posts and Facebook ads. It was super slow last time so I hope next time is a little better but it was still fun to respond and just hangout with Elder Nelson and talk. Side note about social media missionary work: Our area is one of the leaders of missionary work on social media which is super cool because of some of our ideas get implemented worldwide. The most recent and greatest is SEO (search engine optimization). The social media elders and sisters realized that our church had some problems when searched on any websites because they were lacking the proper tags and current info which makes us more likely to come up. For example: if someone searched Christian church our church would be last because we weren&#x27;t even tagged as one until recently. This and many other things (phone numbers for church buildings will be missionary numbers or time for sacrament on Google maps ect.) will be implemented soon so thats exciting.<\/p>\n<p>Wednesday we got soaked. If I had a nickel everything umbrellas do nothing so we give up and get soaked I&#x27;d have 2 nickels which isn&#x27;t a lot but weird it happen twice (not really, it&#x27;s florida summer definitely going to continue to happen). I hate it when it rains because every Latino in a 30 mile radius hide inside, but we did fine a new family, the Valesquez from Guatemala. We stood on their doorstep and gave the first vision (I know have James 1:5 and Joseph&#x27;s account memorized in spanish) and we got a second lesson. Also the nickname for Dade city is &quot;the dirty dade&quot; because it&#x27;s a pretty poor area so when it rains it gets suuuuper dirty/muddy/sandy. Our car was pretty nasty this week with everything we tracked in.<\/p>\n<p>All the other days were fairly bland with a few members meals, thanks English elders for letting us tag along and mentioning us when talking about it hehe.<\/p>\n<p>Friday was awesome because of specialized Training. All the new trainees and trainers go and get taught by president, his wife, and other missionary leaders. Super awesome, got some great revelation on how to continue to improve myself and missionary work. Also got to see some of the missionaries which is always fun.<\/p>\n<p>Today (p-day) we played some volleyball as a district and got sushi. So pretty awesome end to an alright week. So here&#x27;s to the next.<\/p>\n<p>That&#x27;s all for now amigos. By next time I will have tried a gator-dog (gator meat hotdog) so I&#x27;ll let you know how that tastes.<\/p>\n<p>Con mucho amor como siempre,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pics: sorry for not a ton. I&#x27;ll have to get better at just taking them so I can have tons of awesomeness to remember my mission by and share with y&#x27;all<\/p>\n<ul class=\"bul\">\n<li>Pineapple and lizard 🦎<\/li>\n<li>Huge grasshopper (3 inches) they are everywhere as well<\/li>\n<li>Una Baca (cow in spanish but spelled wrong. Cow in spanish is Vaca but most people can&#x27;t spell well and v&amp;b make the same noise in spanish)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-08-02_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-02_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-02_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_029.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_030.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_031.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Qué Mojado! (how wet!) Hola familia y mis amigos This week has come and gone already but it is nice to be able to enjoy some more AC and chill on p-day. I always thought the AZ was pretty hot, and it is, but not the same misery as Florida right now. It is constantly around 90° if not more and almost 100% humidity. Which not only means its hot but wet and easily dehydrated because it gets sucked out of you. And you are wet from the humidity, sweat, and sometimes the rain. Besides that I love it here, me encanta Dade city. Tuesday was fairly uneventful but still good. We had district council in the morning which was great and then later we had prime time. Prime time is 6-9pm and we just message people who respond to posts and Facebook ads. It was super slow last time so I hope next time is a little better but it was still fun to respond and just hangout with Elder Nelson and talk. Side note about social media missionary work: Our area is one of the leaders of missionary work on social media which is super cool because of some of our ideas get implemented worldwide. The most recent and greatest is SEO (search engine optimization). The social media elders and sisters realized that our church had some problems when searched on any websites because they were lacking the proper tags and current info which makes us more likely to come up. For example: if someone searched Christian church our church would be last because we weren't even tagged as one until recently. This and many other things (phone numbers for church buildings will be missionary numbers or time for sacrament on Google maps ect.) will be implemented soon so thats exciting. Wednesday we got soaked. If I had a nickel everything umbrellas do nothing so we give up and get soaked I'd have 2 nickels which isn't a lot but weird it happen twice (not really, it's florida summer definitely going to continue to happen). I hate it when it rains because every Latino in a 30 mile radius hide inside, but we did fine a new family, the Valesquez from Guatemala. We stood on their doorstep and gave the first vision (I know have James 1:5 and Joseph's account memorized in spanish) and we got a second lesson. Also the nickname for Dade city is \"the dirty dade\" because it's a pretty poor area so when it rains it gets suuuuper dirty/muddy/sandy. Our car was pretty nasty this week with everything we tracked in. All the other days were fairly bland with a few members meals, thanks English elders for letting us tag along and mentioning us when talking about it hehe. Friday was awesome because of specialized Training. All the new trainees and trainers go and get taught by president, his wife, and other missionary leaders. Super awesome, got some great revelation on how to continue to improve myself and missionary work. Also got to see some of the missionaries which is always fun. Today (p-day) we played some volleyball as a district and got sushi. So pretty awesome end to an alright week. So here's to the next. That's all for now amigos. By next time I will have tried a gator-dog (gator meat hotdog) so I'll let you know how that tastes. Con mucho amor como siempre, Elder Jacobs Pics: sorry for not a ton. I'll have to get better at just taking them so I can have tons of awesomeness to remember my mission by and share with y'all Pineapple and lizard 🦎 Huge grasshopper (3 inches) they are everywhere as well Una Baca (cow in spanish but spelled wrong. Cow in spanish is Vaca but most people can't spell well and v&b make the same noise in spanish) More from this week Guatemala"}, {"id": "l8", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AUG 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🐊 Gators<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Gators"], "extra": "", "kind": "Letter 8 · Dade City", "title": "Los perros", "date": "2021-08-09T15:19:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola todos,<\/p>\n<p>This week has been pretty good. The branch is slowly filling callings and growing; so that&#x27;s been awesome to see. Our friend Jaime got confirmed Sunday 3 weeks after his baptism lol (we were pretty worried about that because if not done soon enough he would need to be rebaptised. But that takes months as we found out. Also no this isn&#x27;t my baptism he was done before I got to Florida). We also have been able to find a fair amount of new amigos to teach this week so thats been great.<\/p>\n<p>Now I know what you want to know is how was the gator-dog but... I didn&#x27;t try it sadly. We went Tuesday after district council but the place was still closed from their vacation for the summer. Hopefully I&#x27;ll try it this coming week or the following. But we did try something strange, Panda Buffet. Think of a ghetto building like waffle house or something like that because that&#x27;s what it is. The inside was actually decent and the price was super cheap. We soon found out why. This all you can eat Chinese buffet was something else. It all looked pretty normal and some stuff was good but not overall many of us had stomach aches that night. The sisters in our district might hate us now haha but it was an experience.<\/p>\n<p>I was part of an exchange this week. I went with Elder Peters for a day to see how another area works and just overall learn. That&#x27;s basically why these happen. It was pretty good (I got to ride bikes around for the first time unlike our usual drive somewhere then walk) and I got along with him very well but definitely prefer Elder Nelson. Wednesday we got to celebrate Brother Graham&#x27;s birthday with him and his wife. It was super fun and good food. Peep the silly picture.<\/p>\n<p>The rest of the week was pretty normal except the dogs; hence the title of the email. There were so many dogs out this week. Most of them tried to chase us or whatnot but we just walked calmly and were careful but some got to close in my opinion. So, I just held my hand everything the just stopped dead in their tracks. Pretty amazing and honestly inexplicable (considering the dogs were Dobermans, pittbulls, chihuahuas, and other angry dogs).<\/p>\n<p>The only other thing to share this week is our free authentic tacos we got. We were planning on going to the taco truck that everyone goes to for dinner but Elder Nelson is friends with the lady who runs it. So when walked up and ordered our 5 tacos each (ready to pay) she told us go sit and wait because she likes us muchachos haha. I got steak, chicken, and al pastor. Boy that al pastor is soo good.<\/p>\n<p>Anyways a pretty good week, filled with little miracles. Faith with works brings miracles.<\/p>\n<p class=\"sign\">Hasta luego amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.S. We have Zone conference Thursday so I&#x27;m pretty excited. Also I just hit 2 months as a missionary.<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>riding bikes through forest<\/li>\n<li>angry dog in a tree<\/li>\n<li>elephant ear plant (super huuge)<\/li>\n<li>free tacos<\/li>\n<li>banana bread I made<\/li>\n<li>the Grahams at bday party<\/li>\n<li>car wash pday (Elder Ballif and I were going to get haircuts hence not in missionary clothes)<\/li>\n<li>raspberry fruit salad making<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-08-09_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-09_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-09_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-09_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-09_0_4.jpg\" alt=\"\" rings miracles. Hasta luego amigos, Elder Jacobs P.S. We have Zone conference Thursday so I'm pretty excited. Also I just hit 2 months as a missionary. Pictures: riding bikes through forest angry dog in a tree elephant ear plant (super huuge) free tacos banana bread I made the Grahams at bday party car wash pday (Elder Ballif and I were going to get haircuts hence not in missionary clothes) raspberry fruit salad making More from this week "}, {"id": "l9", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AUG 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🌀 Hurricane<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Hurricane"], "extra": "", "kind": "Letter 9 · Dade City", "title": "Shabbat Shalom", "date": "2021-08-16T06:01:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola amigos,<\/p>\n<p>Dade City is great as usual and this week has been pretty good. The week was fairly chill and normal so this email will have a lot of randomness jajaja.<\/p>\n<p>Zone Conference was Thursday and it was awesome. We heard trainings from our mission president, his wife, the AP&#x27;s, and a few other missionaries who were asked. All of it was amazing I have sooo many notes (not normal for me unless I&#x27;m really engaged) and the spirit really made sure I had a list of how to improve. Elder Nelson and I have taken all of the invitations to study and improve with and used them. It&#x27;s especially important these coming months to do those and be obedient because of the huge influx of new missionaries. At the end of this month we should get 25 English elders, 2 spanish elders, 2 English sisters, and 1 spanish sister. 30 missionaries! By the ender of October 50% of the mission will be training or getting trained. So we got to set a good example and follow all rules even the new ones that president gave. I&#x27;ve noticed a lot of good things from obedience to rules and the spirit so trying to be perfectly obedient should bring even more as hard as it sounds.<\/p>\n<p>Don&#x27;t bench the spirit!<\/p>\n<p>High love -&gt; high expectations<\/p>\n<p>Were probably my favorite quotes from Zone conference. When prompted by the spirit, follow. No one likes to feel useless or a bench warmer. And with high love are high expectations from family, friends, and our Heavenly father. So we need to do all we can to show that same love back.<\/p>\n<p>Friday evening we had the opportunity to eat with a member and her family. Her name is Alison. She was baptized last year and her husband some moths after. They have 2 kids and are all very nice. She was a devoted jew before hand and somehow found missionaries and they never mentioned Christ when teaching her (if they would have she would&#x27;ve stopped having lessons because jews don&#x27;t believe Christ was the messiah). Her testimony is super cool because of that and she still does a lot of Jewish things because of her heritage and family traditions. We got to celebrate Shabbat with her and her family. Shabbat is the holy day when Christ rested after making the world. It starts 5pm Friday and goes til 5pm Saturday. If you were a super strict jew, like she was, you can&#x27;t do anything considered work. Turning on a light, cleaning, not even pressing a button. The gretting is Shabbat shalom which means good sabbath. We said some Hebrew and talked about the history (all super cool). Apparently all of the Church history occured on a Jewish holiday and some of the things Alma and Amuleck and other prophets do in the book of Mormon are Jewish.<\/p>\n<p>It&#x27;s been raining quite a bit hear with hurricane Fred but we are inland a bunch (as much as you can for florida) so we&#x27;ve been fine. The rest of the week has been fine and our branch is wanting to help us with our missionary efforts so hopefully it can grow. Here&#x27;s a list of other things that happened.<\/p>\n<ul class=\"bul\">\n<li>(last week but I forgot to say) I learned how to solve a rubiks cube<\/li>\n<li>elder Nelson can fart on command lol<\/li>\n<li>Weird food from sisters (health nuts and they want to give us stuff but it&#x27;s kinda 🤮 no me gusta kale)<\/li>\n<li>our friend Domingo is on date (for baptism) on the 29th<\/li>\n<li>Domingo rode over an hour to church by bike since the ride we arranged for him fell through (he&#x27;s definitely a legend)<\/li>\n<li>Big dog (a special needs friend) said Elder Nelson can be his best man (not that he is actually getting married)<\/li>\n<li>Quesedilla waffles. We got bored of our normal looking Quesedillas so we made them in our waffle iron for new shapes<\/li>\n<\/ul>\n<p class=\"sign\">Hasta luego,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pics:<\/p>\n<ul class=\"bul\">\n<li>goofy red glasses elder Nelson has<\/li>\n<li>the start of the dead animal picture collection (mole, bird, snake, and boar)<\/li>\n<li>like lizards frogs are found everywhere (especially smashed in the road, I&#x27;ll send a picture next week jaja)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-08-16_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_043.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_044.jpg\" alt=\"\"><\/figure><\/div>  and she still does a lot of Jewish things because of her heritage and family traditions. We got to celebrate Shabbat with her and her family. Shabbat is the holy day when Christ rested after making the world. It starts 5pm Friday and goes til 5pm Saturday. If you were a super strict jew, like she was, you can't do anything considered work. Turning on a light, cleaning, not even pressing a button. The gretting is Shabbat shalom which means good sabbath. We said some Hebrew and talked about the history (all super cool). Apparently all of the Church history occured on a Jewish holiday and some of the things Alma and Amuleck and other prophets do in the book of Mormon are Jewish. It's been raining quite a bit hear with hurricane Fred but we are inland a bunch (as much as you can for florida) so we've been fine. The rest of the week has been fine and our branch is wanting to help us with our missionary efforts so hopefully it can grow. Here's a list of other things that happened. (last week but I forgot to say) I learned how to solve a rubiks cube elder Nelson can fart on command lol Weird food from sisters (health nuts and they want to give us stuff but it's kinda 🤮 no me gusta kale) our friend Domingo is on date (for baptism) on the 29th Domingo rode over an hour to church by bike since the ride we arranged for him fell through (he's definitely a legend) Big dog (a special needs friend) said Elder Nelson can be his best man (not that he is actually getting married) Quesedilla waffles. We got bored of our normal looking Quesedillas so we made them in our waffle iron for new shapes Hasta luego, Elder Jacobs Pics: goofy red glasses elder Nelson has the start of the dead animal picture collection (mole, bird, snake, and boar) like lizards frogs are found everywhere (especially smashed in the road, I'll send a picture next week jaja) More from this week "}, {"id": "l10", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AUG 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colombia<\/span><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"GT\">🇬🇹 Guatemala<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["CO", "MX", "GT"], "moments": ["Baptism"], "extra": "Colombia Mexico Guatemala", "kind": "Letter 10 · Dade City", "title": "Covid - almost", "date": "2021-08-23T06:51:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola Amigos!<\/p>\n<p>This week has been pretty interesting and will be a bit longer that usual but here it goes.<\/p>\n<p>Last p-day we had a district activity play some board games and eating food which was pretty fun. But, the next day during district council one of the sisters found out she may have been exposed to Covid and if she tested positive we would all need to quarantine. Luckily it was negative but... Elder Ricks, one of the English missionaries we live with, was feeling kinda sick so we had to quarantine until he got tested the next day. Luckily he was also negative and tuesday night we don&#x27;t go anywhere because of prime time, facebook messaging. We still didn&#x27;t like the feeling that we were confined though.<\/p>\n<p>Wednesday was fairly normal with missionary coordination meeting in the evening. We did get some Guatemala tamales from the Chapín family we have started to teach; however, they may not be interested because as we left they tried to give back the book of Mormon we gave them. We&#x27;ll have to see next time we stop by but we definitely aren&#x27;t taking our book back jajaja.<\/p>\n<p>(The tamales weren&#x27;t very good. Chapíns or Guatemalans put anything and everything in tamales so there was chicken but still with bones and other stuff. We also found hair)<\/p>\n<p>Thursday we got up early to meet our friend Domingo in person! He is super cool and chill. We found out he already quit coffee and tea since we told him the commandments. We actually brought some hot chocolate mix to try to help him but he quit cold turkey, qué genial! He&#x27;s from Chiapas, Mexico. He knows a dialect from there and spanish (also a bit of English but not much) but he works in a Chinese restaurant jajaja. His boss and coworkers are Chinese and barely speak English and he can only really understand. They get along though and he doesn&#x27;t hate his job or work on Sundays so that&#x27;s good. His baptism is this next Sunday so I&#x27;m pretty excited.<\/p>\n<p>Friday we did some service at this thrift store... It was something the hermanas set up for us all to do but turns out the thrift shop is owned by another church and we basically accidentally signed up to volunteer as a regular thing. It was alright and we aren&#x27;t planning on going back because it was kinda a waste of time and we aren&#x27;t supposed to do stuff like that.<\/p>\n<p>Saturday is the mess of the week; so much happened. We had service in the morning for the Thortons which afterwards they fed us a feast. Sister Thorthon has so many random skills and hobbies, she is super fun to talk to and she makes amazing food. We had smoothies, juice, chicken &amp; shrimp Alfredo, burgers, hotdogs, steak, Chick-fil-A, and Colombian wafers with dulce de leche (caramel made from milk). And it was all home made!! And I ate it all! We all had such a big stomachache from it but it was kinda worth it.<\/p>\n<p>The rest of the day we got cleaned up and ready for Dade city per most afternoons. Saturdays are crazy because we usually stop by all of our friends houses to remind them about church but we also had some other lessons. We were running all over the place. The big lesson that night was with a young woman named Ashleigh. She is 23 and looking for more friends. She got out of the army because of an injury so now she is doing school. She actually had already heard of the Church so she was the one who saw us walking around and yelled to us to talk earlier in the week. We had a lesson on the restoration with her and the English Elders which went really well. She even asked how to pray, we told her, then went right into doing it! And she came to church the next day!<\/p>\n<p>Sunday was pretty good except when we found out we had talks to give in an hour! We rushed to write those and prepare for church. We both finished and it went pretty well. President Cuevas, of the branch, said I sound like Elder Richard G Scott does in spanish (he translated his own talks into spanish).<\/p>\n<p>My talk was on teaching like Christ did. So my list of things to do that are: teach with the spirit, teach simply, and teach with love. I also felt like love, share, and Invite could be counted as love because share and invite are acts of love if done right. I refered to preach my gospel and come follow. Recommend looking at both of those because of the good ideas and great scriptures.<\/p>\n<p>Ashleigh came to church and some members became her best friends instantly and she even stayed after church for the baptism in the English ward. I think the English ward will have another in a couple weeks because of how much she wants to learn.<\/p>\n<p>Here is a short list if you don&#x27;t have much time to read all this:<\/p>\n<ul class=\"bul\">\n<li>2 Covid scares<\/li>\n<li>Guatemalan tamales (very strange)<\/li>\n<li>met Domingo in person!<\/li>\n<li>service kinda<\/li>\n<li>more service and a feast<\/li>\n<li>awesome pass off lesson with the English elders and Ashleigh (yes, that&#x27;s how her parents spelled her name)<\/li>\n<li>English elders had a baptism<\/li>\n<li>Ashleigh came to church<\/li>\n<li>I gave my first talk in spanish<\/li>\n<\/ul>\n<p>We were supposed to have exchanges with our district leader and our zone leaders this week but with the craziness of emergency transfers we couldn&#x27;t. The emergency transfers are because of missionaries going home a bit early so they make it for school.<\/p>\n<p>Also I&#x27;ve been in Florida for 1 month now and I wouldn&#x27;t change it.<\/p>\n<p class=\"sign\">Hasta luego Amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pics!!<\/p>\n<ul class=\"bul\">\n<li>Green frog<\/li>\n<li>crazy looking spider<\/li>\n<li>the tamales<\/li>\n<li>pigeon someone captured<\/li>\n<li>specialized Training (middle back)<\/li>\n<li>Zone conference (middle back)<\/li>\n<li>Sunset<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>I have other dead critters this week but some don&#x27;t like it. This is your warning ⚠️<\/p>\n<ul class=\"bul\">\n<li>big grasshopper<\/li>\n<li>chicken<\/li>\n<li>frog<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-08-23_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-23_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-23_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_1_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_1_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_1_2.jpg\" alt=\"\"><\/figure><\/div>", "text": "Covid - almost Hola Amigos! This week has been pretty interesting and will be a bit longer that usual but here it goes. Last p-day we had a district activity play some board games and eating food which was pretty fun. But, the next day during district council one of the sisters found out she may have been exposed to Covid and if she tested positive we would all need to quarantine. Luckily it was negative but... Elder Ricks, one of the English missionaries we live with, was feeling kinda sick so we had to quarantine until he got tested the next day. Luckily he was also negative and tuesday night we don't go anywhere because of prime time, facebook messaging. We still didn't like the feeling that we were confined though. Wednesday was fairly normal with missionary coordination meeting in the evening. We did get some Guatemala tamales from the Chapín family we have started to teach; however, they may not be interested because as we left they tried to give back the book of Mormon we gave them. We'll have to see next time we stop by but we definitely aren't taking our book back jajaja. (The tamales weren't very good. Chapíns or Guatemalans put anything and everything in tamales so there was chicken but still with bones and other stuff. We also found hair) Thursday we got up early to meet our friend Domingo in person! He is super cool and chill. We found out he already quit coffee and tea since we told him the commandments. We actually brought some hot chocolate mix to try to help him but he quit cold turkey, qué genial! He's from Chiapas, Mexico. He knows a dialect from there and spanish (also a bit of English but not much) but he works in a Chinese restaurant jajaja. His boss and coworkers are Chinese and barely speak English and he can only really understand. They get along though and he doesn't hate his job or work on Sundays so that's good. His baptism is this next Sunday so I'm pretty excited. Friday we did some service at this thrift store... It was something the hermanas set up for us all to do but turns out the thrift shop is owned by another church and we basically accidentally signed up to volunteer as a regular thing. It was alright and we aren't planning on going back because it was kinda a waste of time and we aren't supposed to do stuff like that. Saturday is the mess of the week; so much happened. We had service in the morning for the Thortons which afterwards they fed us a feast. Sister Thorthon has so many random skills and hobbies, she is super fun to talk to and she makes amazing food. We had smoothies, juice, chicken & shrimp Alfredo, burgers, hotdogs, steak, Chick-fil-A, and Colombian wafers with dulce de leche (caramel made from milk). And it was all home made!! And I ate it all! We all had such a big stomachache from it but it was kinda worth it. The rest of the day we got cleaned up and ready for Dade city per most afternoons. Saturdays are crazy because we usually stop by all of our friends houses to remind them about church but we also had some other lessons. We were running all over the place. The big lesson that night was with a young woman named Ashleigh. She is 23 and looking for more friends. She got out of the army because of an injury so now she is doing school. She actually had already heard of the Church so she was the one who saw us walking around and yelled to us to talk earlier in the week. We had a lesson on the restoration with her and the English Elders which went really well. She even asked how to pray, we told her, then went right into doing it! And she came to church the next day! Sunday was pretty good except when we found out we had talks to give in an hour! We rushed to write those and prepare for church. We both finished and it went pretty well. President Cuevas, of the branch, said I sound like Elder Richard G Scott does in spanish (he translated his own talks into spanish). My talk was on teaching like Christ did. So my list of things to do that are: teach with the spirit, teach simply, and teach with love. I also felt like love, share, and Invite could be counted as love because share and invite are acts of love if done right. I refered to preach my gospel and come follow. Recommend looking at both of those because of the good ideas and great scriptures. Ashleigh came to church and some members became her best friends instantly and she even stayed after church for the baptism in the English ward. I think the English ward will have another in a couple weeks because of how much she wants to learn. Here is a short list if you don't have much time to read all this: 2 Covid scares Guatemalan tamales (very strange) met Domingo in person! service kinda more service and a feast awesome pass off lesson with the English elders and Ashleigh (yes, that's how her parents spelled her name) English elders had a baptism Ashleigh came to church I gave my first talk in spanish We were supposed to have exchanges with our district leader and our zone leaders this week but with the craziness of emergency transfers we couldn't. The emergency transfers are because of missionaries going home a bit early so they make it for school. Also I've been in Florida for 1 month now and I wouldn't change it. Hasta luego Amigos, Elder Jacobs Pics!! Green frog crazy looking spider the tamales pigeon someone captured specialized Training (middle back) Zone conference (middle back) Sunset I have other dead critters this week but some don't like it. This is your warning ⚠️ big grasshopper chicken frog Colombia Mexico Guatemala"}, {"id": "l11", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AUG 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🐊 Gators<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Gators"], "extra": "", "kind": "Letter 11 · Dade City", "title": "🐊🌭 Gatordog! 🤤", "date": "2021-08-30T06:21:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola Amigos!<\/p>\n<p>This week was a little slower because of the increase of covid cases. More of our friends have it so we couldn&#x27;t talk in person. Hopefully this next week we can do some video calls. Please pray for them because they are getting really sick: Isabel and Jaime and their families.<\/p>\n<p>I went on another exchange this week to Wesley Chapel but this time with Elder Kimball, our district leader. It was a lot of fun. I got to ride bikes again. In that one evening we went 16 miles! My legs were pretty tired by the end of it but we hurried home because it looked like it was going to rain. We walked inside, put the bikes away, and it starting pouring; what luck! Then the next day I walked 5 miles while finding.<\/p>\n<p>We had some strange food this week. I had a gatordog and cyclone tators. Pretty good. The tators were just twisted re- fried lays potato chips and the gator-dog was just a big hot dog with more quality meat (I just got a normal one with everything on it to have the experience). I also tried some more tacos from a different taco truck. Definitely not as good as the little purple one we normally go to but I got to try hog maws (just squishy not as good al pastor). And the Thortons gave us more food. Not really weird but it was another like 5 course meal because she makes sure we are stuffed. Practically need a wheelchair after eating but it so good jaja.<\/p>\n<p>Had interviews this week which went great! I love President and Sister Hollingsworth. They are so amazing. We did find out that because of covid tracking in any form is banned and we need to wear masks to street contact. This is really hard for our little Latino area especially since they don&#x27;t really care but to uphold the church&#x27;s look and be good about not spreading covid we need to change. Hopefully our English class that we are starting will allow us to find people with out our other typical ways.<\/p>\n<p>The last big thing this week was Domino&#x27;s Baptism! He did end up moving to Tampa Wednesday but President said because it was Sunday we could come and do it but in Tampa. I dunked him and he was apparently excited because I said amen and he just tipped back. He was ready jaja. Elder Nelson then confirmed him and the rest of the service was great.<\/p>\n<p>This week we did get some transfer news. Elder Nelson is leaving to Ocala to finish training Elder Esplin (the other spanish Elder that came in with me) since his trainer is going home. I&#x27;ll be staying, leading the area, and receiving Elder Ricks. Elder Nelson has told me some of the things he has heard and it sounds awesome but I am sad to lose Elder Nelson. (This is not the Elder Ricks we live with but a different one. This will be confusing) The English Elders are also transferring. Elder Ricks is staying and training but Elder Ballif is whitewashing Sarasota and training. They&#x27;ll all do awesome but it is kinda sad that they&#x27;llbe leaving.<\/p>\n<p>Nos Vemos pronto mis amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.S. Elder Nelson got hit on the entire 2 hours of church by a gay guy. It was super weird and uncomfy with all the things he was saying and touching him since he sat right next to us. But we gave him a book of Mormon and our number like normal. We&#x27;ll see if anything else happens jaja.<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>biking with Elder Kimball<\/li>\n<li>last district council + Zone Leaders (no Elder Peters since he got emergency transfered but we have Elder Mehr)<\/li>\n<li>gator dog<\/li>\n<li>tacos<\/li>\n<li>new elder 🐕 jaja<\/li>\n<li>Skippy our lizard friend (dead)<\/li>\n<li>Domingo&#x27;s Baptism!<\/li>\n<li>fatest pig ever (named princess)<\/li>\n<li>classic strange Dade city Florida driveway<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-08-30_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-08-30_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-08-30_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-30_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_8.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_045.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_046.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_047.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_048.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_049.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_050.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐊🌭 Gatordog! 🤤 Hola Amigos! This week was a little slower because of the increase of covid cases. More of our friends have it so we couldn't talk in person. Hopefully this next week we can do some video calls. Please pray for them because they are getting really sick: Isabel and Jaime and their families. I went on another exchange this week to Wesley Chapel but this time with Elder Kimball, our district leader. It was a lot of fun. I got to ride bikes again. In that one evening we went 16 miles! My legs were pretty tired by the end of it but we hurried home because it looked like it was going to rain. We walked inside, put the bikes away, and it starting pouring; what luck! Then the next day I walked 5 miles while finding. We had some strange food this week. I had a gatordog and cyclone tators. Pretty good. The tators were just twisted re- fried lays potato chips and the gator-dog was just a big hot dog with more quality meat (I just got a normal one with everything on it to have the experience). I also tried some more tacos from a different taco truck. Definitely not as good as the little purple one we normally go to but I got to try hog maws (just squishy not as good al pastor). And the Thortons gave us more food. Not really weird but it was another like 5 course meal because she makes sure we are stuffed. Practically need a wheelchair after eating but it so good jaja. Had interviews this week which went great! I love President and Sister Hollingsworth. They are so amazing. We did find out that because of covid tracking in any form is banned and we need to wear masks to street contact. This is really hard for our little Latino area especially since they don't really care but to uphold the church's look and be good about not spreading covid we need to change. Hopefully our English class that we are starting will allow us to find people with out our other typical ways. The last big thing this week was Domino's Baptism! He did end up moving to Tampa Wednesday but President said because it was Sunday we could come and do it but in Tampa. I dunked him and he was apparently excited because I said amen and he just tipped back. He was ready jaja. Elder Nelson then confirmed him and the rest of the service was great. This week we did get some transfer news. Elder Nelson is leaving to Ocala to finish training Elder Esplin (the other spanish Elder that came in with me) since his trainer is going home. I'll be staying, leading the area, and receiving Elder Ricks. Elder Nelson has told me some of the things he has heard and it sounds awesome but I am sad to lose Elder Nelson. (This is not the Elder Ricks we live with but a different one. This will be confusing) The English Elders are also transferring. Elder Ricks is staying and training but Elder Ballif is whitewashing Sarasota and training. They'll all do awesome but it is kinda sad that they'llbe leaving. Nos Vemos pronto mis amigos, Elder Jacobs P.S. Elder Nelson got hit on the entire 2 hours of church by a gay guy. It was super weird and uncomfy with all the things he was saying and touching him since he sat right next to us. But we gave him a book of Mormon and our number like normal. We'll see if anything else happens jaja. Pictures: biking with Elder Kimball last district council + Zone Leaders (no Elder Peters since he got emergency transfered but we have Elder Mehr) gator dog tacos new elder 🐕 jaja Skippy our lizard friend (dead) Domingo's Baptism! fatest pig ever (named princess) classic strange Dade city Florida driveway More from this week "}, {"id": "l12", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SEP 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Letter 12 · Dade City", "title": "🚙 Nuevos compañeros 🎉", "date": "2021-09-06T12:37:00", "group": "2021-09", "html": "<div class=\"body\"><p>Hola mis amigos!<\/p>\n<p>I&#x27;ll be honest after learning that Elder Nelson was going to be leaving I wasnt that happy or excited for this week but Elder Ricks, my trainer who speaks Spanish not the other one we live with (yes its confusing and we don&#x27;t really know yet how to differentiate) , is also pretty cool. He is from Mesa, AZ and is a hard worker, just like I am and Elder Nelson is. While it definitely was an adjustment at first, I&#x27;m sure we will continue to work hard and get along well. This week we&#x27;ve been doing a ton of street contacting because it&#x27;s one of the only ways to work our area well. It&#x27;s pretty fun and hard but I&#x27;m getting pretty good at just hitting up a conversation with anyone. The gift of tongues and the calling of a missionary definitely helps too. I&#x27;ve really come to realize how good my spanish is because we are a lot more equal companions unlike before since I was so new and Elder Nelson had been in the area for so long. But at the same time Elder Ricks has been helping me realize some ways to improve. Such as small grammar mistakes or remembering to conjugate verbs when xyz. At times it can seem annoying but I&#x27;m improving drastically at this point. The other Elder Ricks got his trainee this week as well! His name is Elder Leonard. He is from St. George, Utah area and is pretty cool. He got thrown right into the fire because of some transgender friends Elder Ricks and Ballif made before he came in.<\/p>\n<p>This week we&#x27;ve also done some more members contact and member lessons. We realized that while I have been in this are for 7 weeks now I didn&#x27;t know the members great so we have been working and getting to know them by sharing messages and eating great food. 🤤<\/p>\n<ul class=\"bul\">\n<li>changed a tire this week (that was a learning experience and hard because the old lady&#x27;s car was super old and she laughed at us almost the entire time)<\/li>\n<li>had our first English class (2 people showed up but more should tomorrow)<\/li>\n<li>got Chick-fil-A (what&#x27;s your go to there? Mines spicy chicken sandwich dx)<\/li>\n<li>entire mission zoom call (chaotic and fun)<\/li>\n<li>someone paid for our drinks at circle K 😎<\/li>\n<li>crazy guy with an accordion let Elder Ricks try (super funny and strange)<\/li>\n<li>saw an owl up close while walking around<\/li>\n<\/ul>\n<p>Cuidanse mis amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Us after changing the tire<\/li>\n<li>Elder Ricks trying to play the accordion<\/li>\n<li>Owl 🦉<\/li>\n<li>me and Hermano Miño at the branch activity<\/li>\n<\/ul>\n<p>⚠️ warning ⚠️<\/p>\n<p>There is some blood this week but it&#x27;s so cool and strange I couldn&#x27;t not share.<\/p>\n<ul class=\"bul\">\n<li>dead cicada<\/li>\n<li>dead armadillo (bloody)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2021-09-06_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-09-06_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-06_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-06_0_4.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-09-06_0_5.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_051.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_052.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_053.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_054.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_055.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_056.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_057.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_058.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_059.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_060.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_061.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_062.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_063.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_064.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🚙 Nuevos compañeros 🎉 Hola mis amigos! I'll be honest after learning that Elder Nelson was going to be leaving I wasnt that happy or excited for this week but Elder Ricks, my trainer who speaks Spanish not the other one we live with (yes its confusing and we don't really know yet how to differentiate) , is also pretty cool. He is from Mesa, AZ and is a hard worker, just like I am and Elder Nelson is. While it definitely was an adjustment at first, I'm sure we will continue to work hard and get along well. This week we've been doing a ton of street contacting because it's one of the only ways to work our area well. It's pretty fun and hard but I'm getting pretty good at just hitting up a conversation with anyone. The gift of tongues and the calling of a missionary definitely helps too. I've really come to realize how good my spanish is because we are a lot more equal companions unlike before since I was so new and Elder Nelson had been in the area for so long. But at the same time Elder Ricks has been helping me realize some ways to improve. Such as small grammar mistakes or remembering to conjugate verbs when xyz. At times it can seem annoying but I'm improving drastically at this point. The other Elder Ricks got his trainee this week as well! His name is Elder Leonard. He is from St. George, Utah area and is pretty cool. He got thrown right into the fire because of some transgender friends Elder Ricks and Ballif made before he came in. This week we've also done some more members contact and member lessons. We realized that while I have been in this are for 7 weeks now I didn't know the members great so we have been working and getting to know them by sharing messages and eating great food. 🤤 changed a tire this week (that was a learning experience and hard because the old lady's car was super old and she laughed at us almost the entire time) had our first English class (2 people showed up but more should tomorrow) got Chick-fil-A (what's your go to there? Mines spicy chicken sandwich dx) entire mission zoom call (chaotic and fun) someone paid for our drinks at circle K 😎 crazy guy with an accordion let Elder Ricks try (super funny and strange) saw an owl up close while walking around Cuidanse mis amigos, Elder Jacobs Pictures: Us after changing the tire Elder Ricks trying to play the accordion Owl 🦉 me and Hermano Miño at the branch activity ⚠️ warning ⚠️ There is some blood this week but it's so cool and strange I couldn't not share. dead cicada dead armadillo (bloody) More from this week "}, {"id": "l13", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SEP 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Letter 13 · Dade City", "title": "Service week!", "date": "2021-09-13T10:56:00", "group": "2021-09", "html": "<div class=\"body\"><p>Buenos Días todos!<\/p>\n<p>This week has been awesome! Tons of stories and miracles of course. I&#x27;ve definitely been learning when we trust in the Lord and do our best we will see miracles. This week we have been on the finding grind. Our English class has been going alright for finding but most of our luck is walking the streets. Neither me or Elder Ricks have ever been so outgoing or friendly but we try our best and it works. We just try to be everyone&#x27;s friend which has also led to impromptu service and talks about the church. It&#x27;s probably my favorite part of the day besides teaching lessons to our friends. We actually found our friend Alex from just walking around Dade city. He is super nice and likes to learn about religion because he feels like his mind is opened. Our first lesson with him this week we taught the restoration while also answering his questions about everything else. It was super awesome, especially since I didn&#x27;t know I knew all the answers to his questions but thanks to some of my random studying and trying to help him, I was able to. Elder Ricks also wasn&#x27;t really feeling great that day because he got his 2nd dose of the covid vaccine.<\/p>\n<ul class=\"bul\">\n<li>Elder Ricks got his 2nd dose and slept during Language study, lunch, and dinner (he even scored lol)<\/li>\n<li>did service for a non member (pulled out old fence posts so a new one could be put)<\/li>\n<li>changed another tire (some lady got a flat and we stopped to help. We meaning Elder C. Ricks the other one)⚙<\/li>\n<li>stopped by our friends Elida and Horacio to share a message but ended up helping them build their new dining room table set⚒<\/li>\n<\/ul>\n<p>3 times we got to give service in one week!<\/p>\n<ul class=\"bul\">\n<li>finally got to met Hermano Araya (he&#x27;s a free mason! Got lots of cool history and sword stuff) ⚔<\/li>\n<li>tried to use social media but no latinos in our area use it so we are 🤡<\/li>\n<li>free tacos again! This lady loves us &#x27;Muchachos&#x27; jajaja🌮🌯<\/li>\n<li>had an awesome stake conference with Elder M. Holland<\/li>\n<li>had the face to face with Elder Bednar<\/li>\n<\/ul>\n<p>Cuidanse amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>drew a unicorn with our fresh markers<\/li>\n<li>someone gave us a bag of shrimp.. 🍤<\/li>\n<li>catching frogs 🐸<\/li>\n<li>Elder Ricks getting his haircut on this guy&#x27;s porch<\/li>\n<li>free tacos<\/li>\n<li>my collection of sticky notes so far. What are some of your favorite quotes I should add?<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-09-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-09-13_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-13_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-13_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-13_0_5.jpg\" alt=\"\"><\/figure><\/div>", "text": "Service week! Buenos Días todos! This week has been awesome! Tons of stories and miracles of course. I've definitely been learning when we trust in the Lord and do our best we will see miracles. This week we have been on the finding grind. Our English class has been going alright for finding but most of our luck is walking the streets. Neither me or Elder Ricks have ever been so outgoing or friendly but we try our best and it works. We just try to be everyone's friend which has also led to impromptu service and talks about the church. It's probably my favorite part of the day besides teaching lessons to our friends. We actually found our friend Alex from just walking around Dade city. He is super nice and likes to learn about religion because he feels like his mind is opened. Our first lesson with him this week we taught the restoration while also answering his questions about everything else. It was super awesome, especially since I didn't know I knew all the answers to his questions but thanks to some of my random studying and trying to help him, I was able to. Elder Ricks also wasn't really feeling great that day because he got his 2nd dose of the covid vaccine. Elder Ricks got his 2nd dose and slept during Language study, lunch, and dinner (he even scored lol) did service for a non member (pulled out old fence posts so a new one could be put) changed another tire (some lady got a flat and we stopped to help. We meaning Elder C. Ricks the other one)⚙ stopped by our friends Elida and Horacio to share a message but ended up helping them build their new dining room table set⚒ 3 times we got to give service in one week! finally got to met Hermano Araya (he's a free mason! Got lots of cool history and sword stuff) ⚔ tried to use social media but no latinos in our area use it so we are 🤡 free tacos again! This lady loves us 'Muchachos' jajaja🌮🌯 had an awesome stake conference with Elder M. Holland had the face to face with Elder Bednar Cuidanse amigos, Elder Jacobs Pictures: drew a unicorn with our fresh markers someone gave us a bag of shrimp.. 🍤 catching frogs 🐸 Elder Ricks getting his haircut on this guy's porch free tacos my collection of sticky notes so far. What are some of your favorite quotes I should add? "}, {"id": "l14", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SEP 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Letter 14 · Dade City", "title": "Leading the Area!! 😳🤯", "date": "2021-09-20T10:54:00", "group": "2021-09", "html": "<div class=\"body\"><p>Hola amigos mios!<\/p>\n<p>Como fue su semana? How was your week?<\/p>\n<p>Here in the Dirty Dade we&#x27;ve been getting rain like none other jaja. We keep saying we need a car wash but then it rains and its fine again. Then we go on the dirt road that leads home jaja.<\/p>\n<p>Last Monday we had a district activity playing spike ball and throwing a football. But someone, me, got it stuck in the center of the palm tree... Then Elder Kimball throw our other football to get it out and it was also stuck... We said goodbye to Elder Kimball this week because he is know able to go to his original assignment in Brazil. The good thing is that I&#x27;ll see him after the mission at BYU. Because he left Elder Ricks, my companion, is now the new district leader. Which is how I lead the area this week.<\/p>\n<p>District leaders do exchanges with the missionaries in their district; so because I&#x27;m the unofficial assistant to the district leader, I&#x27;m part of that too. I stayed in Dade City while Elder Ricks went to Tampa with the Zone leaders and I got Elder Petersen from Tampa Spanish. Our day was looking pretty good until we got to Dade city and all our lessons got canceled so I had to think of something to do on the fly.<\/p>\n<p>I ended up getting in contact with Jaime&#x27;s family and we had an awesome lesson and invited them to start thinking about baptism!<\/p>\n<p>The rest of the week was pretty amazing. We have been doing tons of street contacting and we tried getting straight to the point this week. We&#x27;d say hola and ask how they are but afterwards straight into saying what we do and if they would like to hear a message. That way we could talk to more people and not waste time getting to know people only for us to sadly find out they don&#x27;t want to talk to us for our actual purpose. We ended up finding 6 new friends Saturday because of it. That&#x27;s about it for this week but this week is looking pretty good as well. Today is Elder Ricks&#x27; bday and Thursday is Zone conference and also my bday.<\/p>\n<p>Cuidense por allí,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>district council and saying bye to Elder Kimball<\/li>\n<li>silly one<\/li>\n<li>huuge truck<\/li>\n<li>Dinner with a member (we ate well)<\/li>\n<li>Chick-fil-A bday lunch today<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_065.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_066.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_067.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_068.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_069.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_070.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_071.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_072.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Leading the Area!! 😳🤯 Hola amigos mios! Como fue su semana? How was your week? Here in the Dirty Dade we've been getting rain like none other jaja. We keep saying we need a car wash but then it rains and its fine again. Then we go on the dirt road that leads home jaja. Last Monday we had a district activity playing spike ball and throwing a football. But someone, me, got it stuck in the center of the palm tree... Then Elder Kimball throw our other football to get it out and it was also stuck... We said goodbye to Elder Kimball this week because he is know able to go to his original assignment in Brazil. The good thing is that I'll see him after the mission at BYU. Because he left Elder Ricks, my companion, is now the new district leader. Which is how I lead the area this week. District leaders do exchanges with the missionaries in their district; so because I'm the unofficial assistant to the district leader, I'm part of that too. I stayed in Dade City while Elder Ricks went to Tampa with the Zone leaders and I got Elder Petersen from Tampa Spanish. Our day was looking pretty good until we got to Dade city and all our lessons got canceled so I had to think of something to do on the fly. I ended up getting in contact with Jaime's family and we had an awesome lesson and invited them to start thinking about baptism! The rest of the week was pretty amazing. We have been doing tons of street contacting and we tried getting straight to the point this week. We'd say hola and ask how they are but afterwards straight into saying what we do and if they would like to hear a message. That way we could talk to more people and not waste time getting to know people only for us to sadly find out they don't want to talk to us for our actual purpose. We ended up finding 6 new friends Saturday because of it. That's about it for this week but this week is looking pretty good as well. Today is Elder Ricks' bday and Thursday is Zone conference and also my bday. Cuidense por allí, Elder Jacobs Pictures: district council and saying bye to Elder Kimball silly one huuge truck Dinner with a member (we ate well) Chick-fil-A bday lunch today More from this week Brazil"}, {"id": "l15", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SEP 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 15 · Dade City", "title": "I did a social media 😬... And it worked!🤯🥵🥳", "date": "2021-09-27T13:53:00", "group": "2021-09", "html": "<div class=\"body\"><p>Hola mis amigos!<\/p>\n<p>Another week as flown by and I&#x27;m loving life as a missionary. Also thank you to everyone who responds to my emails, sends mail, and wished me happy birthday this week. While I can only respond on email or letters, I do appreciate it all and see all of it.<\/p>\n<p>This week was a grind! It rained twice the week which meant lessons and finding pretty difficult but we did also see some miracles.<\/p>\n<p>This week we also had Zone conference. I really enjoyed it and it was even more fun in my opinion because it was also my birthday. So it felt like I was learning and also partying with my mission family. Part of Zone conference was a bunch of social media trainings. I felt so bad during part of the training because we discussed good, better, and best. We have a lot of tools to teach and find but there are layers of best uses not to mention making sure we use them so we can fulfill our missionary purpose to invite ALL to come unto Christ. At that moment I realized how much we hadn&#x27;t been using some tools like social media. But then, one of my posts about prayers and messages of hope for free, starting freaking out! I was suddenly getting tons of notifications for likes, comments, DMs. I had to silence my phone! While not everything was nice or good intentions, we did see some good results and set up a lesson! The other miracle this week was probably when I was on exchange with Elder Leonard in Dade city English. The english elders, particularly Elder Ballif when he was still here, have been teaching this awesome part member family. I&#x27;ve already mention them before because we went over one time for Shabbat dinner. But their daughter Eliana is who they have been teaching for a while. She has been taught pretty much everything for baptism but has concerns about it. But when we went over Saturday morning for 🍙Donuts🍩 and a lesson, we were able to put her on date! It was super special and we both instantly thought of the same day!<\/p>\n<p>One thing I&#x27;ve learned this week is about planning. Planning is really helpful and especially when every hole is filled so that time is used wisely but we shouldn&#x27;t plan just to fill holes. The best results happen when we plan for our friends. We had a pretty big hole on Friday but we remembered some of our friends had been going through some tough things. We decided to bake cookies then drop them off. They said it completely changed their mood and helped them see that we are their for them to teach but also most importantly to be friends.<\/p>\n<p>Well, thats it from me this week. I&#x27;m still trying to find more ways to find on social media particularly for people who speak spanish, so drop some ideas or stories of success you&#x27;ve seen.<\/p>\n<p>I&#x27;ve tried friending members and their friends, best food questions, and now free prayers/messages of hope (the last being successful).<\/p>\n<p class=\"sign\">Hasta luego y cuidese!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>B-day at Miños<\/li>\n<li>Zone Conference<\/li>\n<li>Elder Ricks&#x27; pocket lizard🦎<\/li>\n<\/ul>\n<p>Roadkill:<\/p>\n<ul class=\"bul\">\n<li>fish?!?!?!🐟<\/li>\n<li>frog🐸<\/li>\n<li>snake🐍<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-09-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-09-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_073.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "I did a social media 😬... And it worked!🤯🥵🥳 Hola mis amigos! Another week as flown by and I'm loving life as a missionary. Also thank you to everyone who responds to my emails, sends mail, and wished me happy birthday this week. While I can only respond on email or letters, I do appreciate it all and see all of it. This week was a grind! It rained twice the week which meant lessons and finding pretty difficult but we did also see some miracles. This week we also had Zone conference. I really enjoyed it and it was even more fun in my opinion because it was also my birthday. So it felt like I was learning and also partying with my mission family. Part of Zone conference was a bunch of social media trainings. I felt so bad during part of the training because we discussed good, better, and best. We have a lot of tools to teach and find but there are layers of best uses not to mention making sure we use them so we can fulfill our missionary purpose to invite ALL to come unto Christ. At that moment I realized how much we hadn't been using some tools like social media. But then, one of my posts about prayers and messages of hope for free, starting freaking out! I was suddenly getting tons of notifications for likes, comments, DMs. I had to silence my phone! While not everything was nice or good intentions, we did see some good results and set up a lesson! The other miracle this week was probably when I was on exchange with Elder Leonard in Dade city English. The english elders, particularly Elder Ballif when he was still here, have been teaching this awesome part member family. I've already mention them before because we went over one time for Shabbat dinner. But their daughter Eliana is who they have been teaching for a while. She has been taught pretty much everything for baptism but has concerns about it. But when we went over Saturday morning for 🍙Donuts🍩 and a lesson, we were able to put her on date! It was super special and we both instantly thought of the same day! One thing I've learned this week is about planning. Planning is really helpful and especially when every hole is filled so that time is used wisely but we shouldn't plan just to fill holes. The best results happen when we plan for our friends. We had a pretty big hole on Friday but we remembered some of our friends had been going through some tough things. We decided to bake cookies then drop them off. They said it completely changed their mood and helped them see that we are their for them to teach but also most importantly to be friends. Well, thats it from me this week. I'm still trying to find more ways to find on social media particularly for people who speak spanish, so drop some ideas or stories of success you've seen. I've tried friending members and their friends, best food questions, and now free prayers/messages of hope (the last being successful). Hasta luego y cuidese! Elder Jacobs Pictures: B-day at Miños Zone Conference Elder Ricks' pocket lizard🦎 Roadkill: fish?!?!?!🐟 frog🐸 snake🐍 More from this week "}, {"id": "l16", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">OCT 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🐊 Gators<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Gators"], "extra": "", "kind": "Letter 16 · Dade City", "title": "Date shortage I think not!", "date": "2021-10-04T09:26:00", "group": "2021-10", "html": "<div class=\"body\"><p>Buenos Días amigos míos!<\/p>\n<p>I hope that everyone had the opportunity to watch general conference this weekend. There were some great messages. My favorites were by Elder Holland and Gilbert. Let me know some cool things you learned or your favorites. I had another exchange this week; Elder Mehr joined me in Dade city. We experienced a lot of rejection from old people in mobile homes along with some campaign to sign the Covenants? Pretty funny in our opinion. But we also met some cool people later that night.<\/p>\n<p>This week we also put 2 of our friends on date! We found out our mission is in a baptism date shortage so we got right on trying to set them. Juan an awesome member referral that is sooo ready to be baptized and Gustavo a friend who was previously taught (former is the nickname for that). He reads the book of Mormon and prays a lot. He lost his brother, who was a member, and so when we taught the plan of salvation it was super special and we asked if he wanted to see his brother again. Super special lessons with both of them.<\/p>\n<p>Not a ton of funny stuff happened this week, though we did almost run over a live armadillo. Such weird animals. I rolled my foot Tuesday and so the rest of this week my foot has been in pain. Pain most the time except when during prime proselytizing hour (6-9pm) walking around the Dirty Dade. Definitely a miracle. And now it&#x27;s almost fully healed. I really wish I had more stories (not to say the spiritual or miracles are bad) like my companion this week so I guess I&#x27;ll share what happened to him while he was in Wesley Chapel for the exchange. He and Elder Jenson were street contacting when they tried talking to this one guy. He didn&#x27;t respond so they left but realized they should try one last time. This time when the approached the guy got kinda mad and said, &quot;don&#x27;t you ever approach a man in his car you don&#x27;t know! Because you don&#x27;t know if he has a gun, keep walking!&quot;<\/p>\n<p>They did and were fine but he definitely had a gun or else why would he say that. Jajaja 🔫<\/p>\n<p>Anyways, transfer is almost over so we&#x27;ll be finding out the news this next weekend.<\/p>\n<p>Hasta la próxima semana,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Coney Island Gator dogs 🐊<\/li>\n<li>Sunset<\/li>\n<li>dog 🐕<\/li>\n<li>Elder Mehr &amp; I on bikey bikes<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-10-04_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-10-04_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-04_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-10-04_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-04_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_074.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_075.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_076.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Date shortage I think not! Buenos Días amigos míos! I hope that everyone had the opportunity to watch general conference this weekend. There were some great messages. My favorites were by Elder Holland and Gilbert. Let me know some cool things you learned or your favorites. I had another exchange this week; Elder Mehr joined me in Dade city. We experienced a lot of rejection from old people in mobile homes along with some campaign to sign the Covenants? Pretty funny in our opinion. But we also met some cool people later that night. This week we also put 2 of our friends on date! We found out our mission is in a baptism date shortage so we got right on trying to set them. Juan an awesome member referral that is sooo ready to be baptized and Gustavo a friend who was previously taught (former is the nickname for that). He reads the book of Mormon and prays a lot. He lost his brother, who was a member, and so when we taught the plan of salvation it was super special and we asked if he wanted to see his brother again. Super special lessons with both of them. Not a ton of funny stuff happened this week, though we did almost run over a live armadillo. Such weird animals. I rolled my foot Tuesday and so the rest of this week my foot has been in pain. Pain most the time except when during prime proselytizing hour (6-9pm) walking around the Dirty Dade. Definitely a miracle. And now it's almost fully healed. I really wish I had more stories (not to say the spiritual or miracles are bad) like my companion this week so I guess I'll share what happened to him while he was in Wesley Chapel for the exchange. He and Elder Jenson were street contacting when they tried talking to this one guy. He didn't respond so they left but realized they should try one last time. This time when the approached the guy got kinda mad and said, \"don't you ever approach a man in his car you don't know! Because you don't know if he has a gun, keep walking!\" They did and were fine but he definitely had a gun or else why would he say that. Jajaja 🔫 Anyways, transfer is almost over so we'll be finding out the news this next weekend. Hasta la próxima semana, Elder Jacobs Pictures: Coney Island Gator dogs 🐊 Sunset dog 🐕 Elder Mehr & I on bikey bikes More from this week "}, {"id": "l17", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">OCT 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"DO\">🇩🇴 Dominican Republic<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["DO"], "moments": ["Baptism"], "extra": "Dominican Republic", "kind": "Letter 17 · Dade City", "title": "🐊 What?! I'm all grown up now 🥸👨‍🎓🏴‍☠️", "date": "2021-10-11T09:38:00", "group": "2021-10", "html": "<div class=\"body\"><p>Buenos Días amigos míos!<\/p>\n<p>This week has been awesome and sadly as I found out my last one in the Dirty Dade city. I found out yesterday around dinner time. I will be leaving to Lakeland to go with Elder Olayan and Izu. Elder Olayan will be dying (going home) and Elder Izu is finishing his training with me! I just finished my training so I hope this goes well. It also sadly means that I may not be able to go to Juan&#x27;s baptism next Sunday. I&#x27;m going to ask president but if not it&#x27;ll be by zoom.<\/p>\n<p>The other transfer news we recieved is: Elder Ricks is going to the Dominican Republic the 28th but before then getting Elder Makechnie and a fresh trainee. Elder Ricks (not my companion but same apartment) is going to Sarasota with Elder Miller. And Elder Leonard is staying and receiving Elder Hansen. There are a lot of changes in the district and mission all around so pretty crazy.<\/p>\n<p>This week we had 2 exchanges! One with the other Elder Ricks in Dade city spanish with me and the other in Wesley Chapel with Elder Jenson. Both were super fun and I learned a lot about them and how to improve. Then on Friday Elder Thompson and Eaton exchanged with the english elders. So we kinda got to hangout with Elder Thompson who his hilarious. Lots of laugh
