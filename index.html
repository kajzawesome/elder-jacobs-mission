out the gospel. We are excited to see them progress more. Our friend Juan is doing way better this week. He has been really struggling with medical problems and needed to see a doctor but soonest opening was in May and he Struggle to get it since his English isn't perfect. So when we went over to teach we also tried calling for him and asking about any cancelations and there was! For a week from today as I send this email. He was so grateful and definitely a miracle for all of us. He also in the lesson ended up teaching us the restoration vecause he remembered it and realized how important it is and is getting excited for general conference. We also had a 🔥 lesson with Endrina, Zaher, and Carlos (Solmars husband, she wasn't there sadly). We had 2 members with us and basically taught eternal families, had the members blast them with testimony then dipped leaving them to want more. Endrina ended up coming to church too with her 2yr old son Lucas; he is a handful but so cute! Church was awesome this week because of a lot of things: Juan Carlos went to the English ward again because he can't get a ride to largo but knows church is important, Rafael got baptized (friend of hermanas but also our home he loves us!), our friends Washington came to the baptism, church, and we had a lesson after church (he asked us during the baptism if he could be baptized his birthday the 22nd of April, we are soo hyped!), and other friends came to church, good day. Washington is who I really want to talk about today. He met with missionaries 40 years ago was going to get baptized but then got busy and moved. He already has so much faith and want to be baptized because he can't miss the opportunity again. Don't miss your opportunities because God really is trying to help and bless us but we often get distracted but lesser things or temptations so follow Washington's example and the advice of this scripture. 1 Nephi 10:19 Transfer news: I'm staying but Elder Schauers is very sadly leaving for Rio Vista in Fort Myers. Mucho amor, Elder Jacobs Pictures: Amigo Washington at church Funny sticker we saw Beeeg horsey Mega pizza juice time More from this week Honduras"}, {"id": "l42", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">APR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": ["PR"], "moments": ["Temple"], "extra": "Puerto Rico", "kind": "Letter 42 · Largo", "title": "Ok im just 🧍‍♂️🔫🧍‍♂️going through companions", "date": "2022-04-04T12:34:00", "group": "2022-04", "html": "<div class=\"body\"><p>Como etan Utede? (Like puerto ricans say como están ustedes because they drop s a lot)<\/p>\n<p>Everything has been awesome especially since they announced a temple in my mission 🙌 😎 🙏  ❤ 👌<\/p>\n<p>Transfers were Tuesday and I got Elder Argyle and it&#x27;s been awesome. We&#x27;ve been teaching a bunch of our friends this week but especially grinding to get more people to come to our English class and it&#x27;s paid off! Our friends are doing great otherwise they have been feeling the spirit and progressing in the gospel really well especially those who came to conference and watched with us! Watching in spanish is really hard though because after a few hours, I was really just wanting to chill and listen in English. Oh well good practice.<\/p>\n<p>A common theme was missionary work. I love being a missionary and helping others is so cool. I really would say serve a mission if you are unsure or thinking about not for now because I would never change this time I&#x27;ve had. And for those older or unable find ways to serve others and simply share what you know.<\/p>\n<p>As for the title of this email, I&#x27;m getting a new elder that is coming from Chile and my companion is going emergency transfered out. I took out another one. I must be good at this or something to go 4 weeks with Elder Gundersen, 3 with Elder Schauers and 1 with Elder Argyle.<\/p>\n<p>Anyways los amo chamacos y espero que tengan una buena semana<\/p>\n<p>Mucho amor y abrazos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures<\/p>\n<ul class=\"bul\">\n<li>us goons<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-04-04_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-04_0_1.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_225.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Ok im just 🧍‍♂️🔫🧍‍♂️going through companions Como etan Utede? (Like puerto ricans say como están ustedes because they drop s a lot) Everything has been awesome especially since they announced a temple in my mission 🙌 😎 🙏 ❤ 👌 Transfers were Tuesday and I got Elder Argyle and it's been awesome. We've been teaching a bunch of our friends this week but especially grinding to get more people to come to our English class and it's paid off! Our friends are doing great otherwise they have been feeling the spirit and progressing in the gospel really well especially those who came to conference and watched with us! Watching in spanish is really hard though because after a few hours, I was really just wanting to chill and listen in English. Oh well good practice. A common theme was missionary work. I love being a missionary and helping others is so cool. I really would say serve a mission if you are unsure or thinking about not for now because I would never change this time I've had. And for those older or unable find ways to serve others and simply share what you know. As for the title of this email, I'm getting a new elder that is coming from Chile and my companion is going emergency transfered out. I took out another one. I must be good at this or something to go 4 weeks with Elder Gundersen, 3 with Elder Schauers and 1 with Elder Argyle. Anyways los amo chamacos y espero que tengan una buena semana Mucho amor y abrazos! Elder Jacobs Pictures us goons More from this week Puerto Rico"}, {"id": "l43", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">APR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 43 · Largo", "title": "👨‍💻👩‍💻YSA for a day 🤡", "date": "2022-04-11T08:57:00", "group": "2022-04", "html": "<div class=\"body\"><p>...Yeah that was strange, not a fan give me my hispanic friends back...<\/p>\n<p>Ola! Boa noite!<\/p>\n<p>Yeah I was in YSA for a little more than a day and that was... interesting. Not bad just very different. But I got my new companion!<\/p>\n<p>Elder Carson from Payson, Utah. He&#x27;s from a big &#x27;ol farm (the big one with minks - for grandma and grandpa Jacobs. Yes I know you were going to ask). He was in Chile for his 12 weeks of training that every missionary goes through but now he&#x27;s here because of some medical reasons. He came in Wednesday morning after flying all night. It&#x27;s been super fun, training him and getting him used to the new mission.<\/p>\n<p>With that not much has changed since last week as far as friends because of lack of time in our area. We did find Carlos and Leonardo one night and they are super sick. They were outside chilling when we came up asking about sharing a message, then talked about the book of Mormon, shared a scripture, talked about enduring to the end and setting expectations of what we do. They then both talked about wanting to be baptized?!? We&#x27;re super hyped for them this week.<\/p>\n<p>We also had the opportunity to go to specialized this week. Mini Zone conference/training meeting for brand new missionaries and their trainers. Always fun and helpful. Different on the other side of it since last time I was able to go I was the trainee. (I&#x27;ll send the pic once I get it or it&#x27;s on our mission Facebook page)<\/p>\n<p>Sunday was stake conference and that was fun. We had Washington and Juan Carlos come and enjoy themselves. They are also pretty excited for their baptisms coming up, 22nd &amp; 22rd respectively.<\/p>\n<p>God loves you, be good, let me know how it&#x27;s going once in a while so I know you aren&#x27;t dead<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>the district (last weeks version)<\/li>\n<li>YSA elders and I in the airport<\/li>\n<li>🦩<\/li>\n<li>Elder Carson&#x27;s first day!<\/li>\n<li>Empenada night + tacos<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-04-11_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-11_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_6.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-11_0_7.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_226.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_227.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_228.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_229.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_230.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_231.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_232.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_233.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_234.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_235.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_236.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "👨‍💻👩‍💻YSA for a day 🤡 ...Yeah that was strange, not a fan give me my hispanic friends back... Ola! Boa noite! Yeah I was in YSA for a little more than a day and that was... interesting. Not bad just very different. But I got my new companion! Elder Carson from Payson, Utah. He's from a big 'ol farm (the big one with minks - for grandma and grandpa Jacobs. Yes I know you were going to ask). He was in Chile for his 12 weeks of training that every missionary goes through but now he's here because of some medical reasons. He came in Wednesday morning after flying all night. It's been super fun, training him and getting him used to the new mission. With that not much has changed since last week as far as friends because of lack of time in our area. We did find Carlos and Leonardo one night and they are super sick. They were outside chilling when we came up asking about sharing a message, then talked about the book of Mormon, shared a scripture, talked about enduring to the end and setting expectations of what we do. They then both talked about wanting to be baptized?!? We're super hyped for them this week. We also had the opportunity to go to specialized this week. Mini Zone conference/training meeting for brand new missionaries and their trainers. Always fun and helpful. Different on the other side of it since last time I was able to go I was the trainee. (I'll send the pic once I get it or it's on our mission Facebook page) Sunday was stake conference and that was fun. We had Washington and Juan Carlos come and enjoy themselves. They are also pretty excited for their baptisms coming up, 22nd & 22rd respectively. God loves you, be good, let me know how it's going once in a while so I know you aren't dead Los amo Elder Jacobs Pictures: the district (last weeks version) YSA elders and I in the airport 🦩 Elder Carson's first day! Empenada night + tacos More from this week "}, {"id": "l44", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">APR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 44 · Largo", "title": "Chao! Off to another area...", "date": "2022-04-18T15:19:00", "group": "2022-04", "html": "<div class=\"body\"><p>Yeah.... another emergency transfer.<\/p>\n<p>Que tal compadres!<\/p>\n<p>This week went super well. Had lots of lessons with members helping, our friends Washington and Juan Carlos are getting baptized this coming week, and the branch is thriving!<\/p>\n<p>Our Easter sacrament meeting was super awesome. We had multiple musical numbers, lots of hymns and walk through the ministry and atonement of Christ. Afterwards we ate a ton of food and sweets.<\/p>\n<p>1st time doing service this week (in a spanish branch)<\/p>\n<p>Zone conference Thursday was awesome. We spent a ton of time working on our teaching skills and I&#x27;m really noticing a difference of the spirit with us and our lessons.<\/p>\n<p>And yes, after finally a full 6 weeks (1 transfer kinda) I&#x27;m moving again. I wish I could stay and it was kinda sudden but yet another emergency transfer. I&#x27;ll be going to Brandon spanish. I do luckily get to come back Friday and Sunday for the baptisms along with helping finish their teaching before baptism but very sad. I&#x27;ve really learned how to work my hardest and love the people despite challenges and so I&#x27;m very sad to leave probably the saddest. I&#x27;m ready for the future, well expect packed. I still hate packing<\/p>\n<p class=\"sign\">Los amo panas!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>owl statue<\/li>\n<li>McDonald&#x27;s<\/li>\n<li>Steven (our rubber Dino that we have in the car) but as anime<\/li>\n<li>hermano owen and his scriptures<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-04-18_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-18_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-18_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-18_0_3.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_237.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_238.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Chao! Off to another area... Yeah.... another emergency transfer. Que tal compadres! This week went super well. Had lots of lessons with members helping, our friends Washington and Juan Carlos are getting baptized this coming week, and the branch is thriving! Our Easter sacrament meeting was super awesome. We had multiple musical numbers, lots of hymns and walk through the ministry and atonement of Christ. Afterwards we ate a ton of food and sweets. 1st time doing service this week (in a spanish branch) Zone conference Thursday was awesome. We spent a ton of time working on our teaching skills and I'm really noticing a difference of the spirit with us and our lessons. And yes, after finally a full 6 weeks (1 transfer kinda) I'm moving again. I wish I could stay and it was kinda sudden but yet another emergency transfer. I'll be going to Brandon spanish. I do luckily get to come back Friday and Sunday for the baptisms along with helping finish their teaching before baptism but very sad. I've really learned how to work my hardest and love the people despite challenges and so I'm very sad to leave probably the saddest. I'm ready for the future, well expect packed. I still hate packing Los amo panas! Elder Jacobs Pictures: owl statue McDonald's Steven (our rubber Dino that we have in the car) but as anime hermano owen and his scriptures More from this week "}, {"id": "l45", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">APR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["PR"], "moments": ["Baptism"], "extra": "Puerto Rico", "kind": "Letter 45 · Brandon", "title": "🐡 Bautismo 🛹 nuevo comp 🐐 y más 🔥", "date": "2022-04-25T07:15:00", "group": "2022-04", "html": "<div class=\"body\"><p>Como tan utede?<\/p>\n<p>Super bien acá<\/p>\n<p>I&#x27;m now in Brandon as I have been transfered again (another emergency transfer). I&#x27;m Elder Jacobs the homeless Don&#x27;t worry I&#x27;m doing fine overall it&#x27;s just kinda frustrating moving/changing companions so often but I love being a missionary and wouldn&#x27;t change that so I&#x27;ll take the bad parts otherwise couldn&#x27;t have the good ones. 2 Nephi 2:26-27<\/p>\n<p>I would love to tell you more about our friends but I&#x27;m still learning who they are so probably in the future. Work here is pretty cool but difficult because we actually cover 3 areas which makes us the stake. There previously other missionaries to help with the other parts but (don&#x27;t mean to sound like a broken record) we lack enough spanish missionaries; soon to gain some in 2 weeks.<\/p>\n<p>I was able to go to Washington&#x27;s baptism and birthday party 🎉 🥳 feliz cumpleaños! 72! It was a party. See pics below. Fire department showed up because too much smoke from Jorge&#x27;s Al pastor; super rico<\/p>\n<p>Juan Carlos&#x27; will be next week. Had to move it but he&#x27;s excited. That&#x27;ll be another trip to largo. My new companion is Elder Huntsman from South Jordan. Super awesome, I have lots to learn from him and we get along super well. We also live with 3 other elders so its always a party at the apartment. Elder Jenkins, Clayton, and Shields. Elder shields came with us one day since his companions (Zone leaders) went on exchange with APs. Yeah idk what else maybe ill remember next week or the pictures fill in some gaps<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>tiny turtle<\/li>\n<li>transfer day<\/li>\n<li>Elder shields with us<\/li>\n<li>mofongo<\/li>\n<li>plantains &amp; pincho (kabob basically)<\/li>\n<li>bautismo<\/li>\n<li>after baptism shenanigans<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-04-25_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-04-25_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-04-25_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-04-25_0_7.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_239.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_240.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_241.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_242.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_243.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_244.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_245.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_246.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_247.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_248.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_249.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_250.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_251.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_252.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_253.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_254.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐡 Bautismo 🛹 nuevo comp 🐐 y más 🔥 Como tan utede? Super bien acá I'm now in Brandon as I have been transfered again (another emergency transfer). I'm Elder Jacobs the homeless Don't worry I'm doing fine overall it's just kinda frustrating moving/changing companions so often but I love being a missionary and wouldn't change that so I'll take the bad parts otherwise couldn't have the good ones. 2 Nephi 2:26-27 I would love to tell you more about our friends but I'm still learning who they are so probably in the future. Work here is pretty cool but difficult because we actually cover 3 areas which makes us the stake. There previously other missionaries to help with the other parts but (don't mean to sound like a broken record) we lack enough spanish missionaries; soon to gain some in 2 weeks. I was able to go to Washington's baptism and birthday party 🎉 🥳 feliz cumpleaños! 72! It was a party. See pics below. Fire department showed up because too much smoke from Jorge's Al pastor; super rico Juan Carlos' will be next week. Had to move it but he's excited. That'll be another trip to largo. My new companion is Elder Huntsman from South Jordan. Super awesome, I have lots to learn from him and we get along super well. We also live with 3 other elders so its always a party at the apartment. Elder Jenkins, Clayton, and Shields. Elder shields came with us one day since his companions (Zone leaders) went on exchange with APs. Yeah idk what else maybe ill remember next week or the pictures fill in some gaps Los amo Elder Jacobs Pictures: tiny turtle transfer day Elder shields with us mofongo plantains & pincho (kabob basically) bautismo after baptism shenanigans More from this week Puerto Rico"}, {"id": "l46", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAY 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 46 · Brandon", "title": "🌊 Bautismo double trouble 🔥", "date": "2022-05-02T12:09:00", "group": "2022-05", "html": "<div class=\"body\"><p>Bom Día!<\/p>\n<p>Pretty tiring week but all good!<\/p>\n<p>Started off the week with district council and interviews. Our district is pretty sweet! It&#x27;s us 5 elders, 4 sisters, and a senior missionary couple. Talk about power house! Also interviews always good. Because of the lack of Spanish missionaries and how many will be leaving its likely I&#x27;ll be training again soon and be covering whole zones for a while which isn&#x27;t super awesome but doable.<\/p>\n<p>Spent a decent amount of time making sure everything was good for the baptisms and also checking in on some members. But of course teaching a ton this week mostly in da city (plant city).<\/p>\n<p>I &quot;went&quot; on exchange with Elder Shields to Lithia &amp; Valrico (we live with him and his companions). It was pretty good,, definitely a more difficult area because people are &quot;comfortable&quot; and feel like they already found Christ or don&#x27;t need a belief in God. I definitely enjoyed myself but am constantly grateful for teaching in Spanish to such humble people that are so full of love.<\/p>\n<p>I was invited to read this talk by Elder Huntsman (companion/district leader) and I enjoyed it and want to share it it you to see your thoughts. The opening story is pretty good too:<\/p>\n<p>&quot;Following Up&quot;<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2014/04/following-up?lang=eng<\/p>\n<p class=\"sign\">Los amo y esperamos que tengan buena semana,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures<\/p>\n<ul class=\"bul\">\n<li>Beatriz<\/li>\n<li>Juan Carlos + wife (&amp; hermana Bleakly &amp; Hermano Rivera)<\/li>\n<li>pickleball<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-05-02_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-02_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-02_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-05-02_0_3.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_255.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_256.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_257.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_258.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_259.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_260.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_261.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_262.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_263.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_264.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🌊 Bautismo double trouble 🔥 Bom Día! Pretty tiring week but all good! Started off the week with district council and interviews. Our district is pretty sweet! It's us 5 elders, 4 sisters, and a senior missionary couple. Talk about power house! Also interviews always good. Because of the lack of Spanish missionaries and how many will be leaving its likely I'll be training again soon and be covering whole zones for a while which isn't super awesome but doable. Spent a decent amount of time making sure everything was good for the baptisms and also checking in on some members. But of course teaching a ton this week mostly in da city (plant city). I \"went\" on exchange with Elder Shields to Lithia & Valrico (we live with him and his companions). It was pretty good,, definitely a more difficult area because people are \"comfortable\" and feel like they already found Christ or don't need a belief in God. I definitely enjoyed myself but am constantly grateful for teaching in Spanish to such humble people that are so full of love. I was invited to read this talk by Elder Huntsman (companion/district leader) and I enjoyed it and want to share it it you to see your thoughts. The opening story is pretty good too: \"Following Up\" https://www.churchofjesuschrist.org/study/general-conference/2014/04/following-up?lang=eng Los amo y esperamos que tengan buena semana, Elder Jacobs Pictures Beatriz Juan Carlos + wife (& hermana Bleakly & Hermano Rivera) pickleball More from this week "}, {"id": "l47", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAY 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 47 · Brandon", "title": "Feliz Día de las madres", "date": "2022-05-09T06:04:00", "group": "2022-05", "html": "<div class=\"body\"><p>Buenos Días! Feliz Día de las madres! (Un poco tarde ahora)<\/p>\n<p>Had a pretty good week here in Brandon and Plant city.<\/p>\n<p>Overall did lots of stop bys and Taught lessons, the works. We hace some pretty cool friends that are close to having a baptism date scheduled.<\/p>\n<p>Please pray for Zulene &amp; her family Los Reyes. Her 5 month old is undergoing a few surgeries.<\/p>\n<p>To be completely honest I cant remember much of this week. It all seemed pretty normal and the usual. In honor of mother&#x27;s day: one of my favorite scriptures<\/p>\n<p>46 For as I had ever called them my sons (for they were all of them very young) even so they said unto me: Father, behold our God is with us, and he will not suffer that we should fall; then let us go forth; we would not slay our brethren if they would let us alone; therefore let us go, lest they should overpower the army of Antipus.<\/p>\n<p>47 Now they never had fought, yet they did not fear death; and they did think more upon the liberty of their fathers than they did upon their lives; yea, they had been taught by their mothers, that if they did not doubt, God would deliver them. 48 And they rehearsed unto me the words of their mothers, saying: We do not doubt our mothers knew it. Alma 56:46-48<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>district<\/li>\n<li>me translating<\/li>\n<li>leafbug<\/li>\n<li>best quesadilla ever<\/li>\n<li>Florida rains are back aka summer heat + humidity<\/li>\n<li>nuf said goku san<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-05-09_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_265.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_266.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Feliz Día de las madres Buenos Días! Feliz Día de las madres! (Un poco tarde ahora) Had a pretty good week here in Brandon and Plant city. Overall did lots of stop bys and Taught lessons, the works. We hace some pretty cool friends that are close to having a baptism date scheduled. Please pray for Zulene & her family Los Reyes. Her 5 month old is undergoing a few surgeries. To be completely honest I cant remember much of this week. It all seemed pretty normal and the usual. In honor of mother's day: one of my favorite scriptures 46 For as I had ever called them my sons (for they were all of them very young) even so they said unto me: Father, behold our God is with us, and he will not suffer that we should fall; then let us go forth; we would not slay our brethren if they would let us alone; therefore let us go, lest they should overpower the army of Antipus. 47 Now they never had fought, yet they did not fear death; and they did think more upon the liberty of their fathers than they did upon their lives; yea, they had been taught by their mothers, that if they did not doubt, God would deliver them. 48 And they rehearsed unto me the words of their mothers, saying: We do not doubt our mothers knew it. Alma 56:46-48 Los amo! Elder Jacobs Pictures: district me translating leafbug best quesadilla ever Florida rains are back aka summer heat + humidity nuf said goku san More from this week "}, {"id": "l48", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAY 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HN\">🇭🇳 Honduras<\/span><\/div>", "cultures": ["HN"], "moments": [], "extra": "Honduras", "kind": "Letter 48 · Brandon", "title": "🚂🚃🚃🚃 grind train 🌊", "date": "2022-05-16T05:28:00", "group": "2022-05", "html": "<div class=\"body\"><p>Buenos Días mis chiquis! (Honduras slang for homie)<\/p>\n<p>Todo super bien!<\/p>\n<p>I didn&#x27;t explian last email but we had transfers. Elder Huntsman and I stayed the same but swapped areas kinda. Previously we cover the entire stake and now we only cover half while the Hermanas cover the other half. Becuase of that, we have more time to find and get on the grind train to build this half of the area up (especially Plant City). Also because of this change we now live in 2 apartments. Our current/prevpis one in Lithia (center of the zone) and in Plant city for days it doesn&#x27;t make sense to drive the almost hour drive back rather stay the night. As far as our week went overall it was fairly normal/expected. Lots of finding time in the beginning of the week but towards the end almost straight lessons. Sunday was good but long. 1 hour in Plant city church, 2 in Brandon + 2 hour meetings, and 1 hour for the young adult devotional. Lots of meeting/sitting down.<\/p>\n<p>I have been learning about the power of prayer and having good communication so here are some questions to make you all think about your prayers/communication:<\/p>\n<ul class=\"bul\">\n<li>Are you easily distracted?<\/li>\n<li>Do you tend to make it all about you?<\/li>\n<li>While someone else is talking, do you think about what you’re going to say instead of listening to understand them?<\/li>\n<li>Are you focused on the failures/diffculties rather than blessings?<\/li>\n<\/ul>\n<p>Testifico que dios te ama y es bueno!<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>old district bowling (last monday)<\/li>\n<li>tiniest pineapple<\/li>\n<li>Hebrew Israelite pamphlet<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-05-16_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-05-16_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-16_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-05-16_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-05-16_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_267.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_268.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_269.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_270.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🚂🚃🚃🚃 grind train 🌊 Buenos Días mis chiquis! (Honduras slang for homie) Todo super bien! I didn't explian last email but we had transfers. Elder Huntsman and I stayed the same but swapped areas kinda. Previously we cover the entire stake and now we only cover half while the Hermanas cover the other half. Becuase of that, we have more time to find and get on the grind train to build this half of the area up (especially Plant City). Also because of this change we now live in 2 apartments. Our current/prevpis one in Lithia (center of the zone) and in Plant city for days it doesn't make sense to drive the almost hour drive back rather stay the night. As far as our week went overall it was fairly normal/expected. Lots of finding time in the beginning of the week but towards the end almost straight lessons. Sunday was good but long. 1 hour in Plant city church, 2 in Brandon + 2 hour meetings, and 1 hour for the young adult devotional. Lots of meeting/sitting down. I have been learning about the power of prayer and having good communication so here are some questions to make you all think about your prayers/communication: Are you easily distracted? Do you tend to make it all about you? While someone else is talking, do you think about what you’re going to say instead of listening to understand them? Are you focused on the failures/diffculties rather than blessings? Testifico que dios te ama y es bueno! Los amo Elder Jacobs Pictures: old district bowling (last monday) tiniest pineapple Hebrew Israelite pamphlet More from this week Honduras"}, {"id": "l49", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAY 2022<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Letter 49 · Brandon", "title": "🐺🤯->☠ This is Red 2 they're on me!", "date": "2022-05-23T05:12:00", "group": "2022-05", "html": "<div class=\"body\"><p>Como están mis amigos?<\/p>\n<p>Todo bien acá en la Florida<\/p>\n<p>This week has been a more difficult one for sure. Our schedule was a little wack with the days we are normally in Plant city vs Brandon but we still hit that grind.<\/p>\n<p>One of the hardest things was the amount of lessons we were able to set up and then how 0 zip nada none of them actually happened. It meant for a lot of time finding or following our backups, something I&#x27;ve found to be really key. Which leads into my thought today:<\/p>\n<p>Mark 8:<\/p>\n<p>27 And Jesus went out, and his disciples, into the towns of Cæsarea Philippi: and by the way he asked his disciples, saying unto them, Whom do men say that I am?<\/p>\n<p>28 And they answered, John the Baptist: but some say, Elias; and others, One of the prophets. 29 And he saith unto them, But whom say ye that I am? And Peter answereth and saith unto him, Thou art the Christ. Christ wasn&#x27;t just a backup for our failures, sins, faults, and imperfections but rather the entire plan. From the beginning, He was chosen to free us from our spiritual and physical death. Trust in him and His grace!<\/p>\n<p>Now to explain the title of the email.<\/p>\n<p>Reference to Starwars because why not and I got bit by a dog this week.<\/p>\n<p>Elder Huntsman and I were in our favorite Pupuseria and trailer park trying to visit some friends and find some new ones. He was noting down something on area book while a lady pulled up to her house and parked. Her previously wild yappy dog stopped and went to meet her. We saw each other, waved but she headed inside before I could start talking about her so I decided I would try knocking the door.<\/p>\n<p>As I was approaching her trailer/yard I remembered the dog and decided to see if I could see it. I immediately saw it, it saw me and flipped! Next thing I knew I was backing up trying to dodge this bullet of a canine. It&#x27;s first lunge missed and only got my pants but then it lunged again and jumped getting my knee. It was about to go for Elder Huntsman when the lady came out and yelled at it.<\/p>\n<p>She seemed super embarrassed and not surprised it happened again...<\/p>\n<p>No holes in my pants tho. And the dog idk what tipe some poodle mix<\/p>\n<p>Send me some cute nice dog pics to make up for that jaja or send me a story of when you got bit. Next week is our reception round because of how rough this week was with all plans falling through<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>new district<\/li>\n<li>Franklin the absolute Chad of a recent convert<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-05-23_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-23_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-05-23_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_271.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_272.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_273.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_274.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_275.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_276.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_277.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_278.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_279.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_280.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐺🤯->☠ This is Red 2 they're on me! Como están mis amigos? Todo bien acá en la Florida This week has been a more difficult one for sure. Our schedule was a little wack with the days we are normally in Plant city vs Brandon but we still hit that grind. One of the hardest things was the amount of lessons we were able to set up and then how 0 zip nada none of them actually happened. It meant for a lot of time finding or following our backups, something I've found to be really key. Which leads into my thought today: Mark 8: 27 And Jesus went out, and his disciples, into the towns of Cæsarea Philippi: and by the way he asked his disciples, saying unto them, Whom do men say that I am? 28 And they answered, John the Baptist: but some say, Elias; and others, One of the prophets. 29 And he saith unto them, But whom say ye that I am? And Peter answereth and saith unto him, Thou art the Christ. Christ wasn't just a backup for our failures, sins, faults, and imperfections but rather the entire plan. From the beginning, He was chosen to free us from our spiritual and physical death. Trust in him and His grace! Now to explain the title of the email. Reference to Starwars because why not and I got bit by a dog this week. Elder Huntsman and I were in our favorite Pupuseria and trailer park trying to visit some friends and find some new ones. He was noting down something on area book while a lady pulled up to her house and parked. Her previously wild yappy dog stopped and went to meet her. We saw each other, waved but she headed inside before I could start talking about her so I decided I would try knocking the door. As I was approaching her trailer/yard I remembered the dog and decided to see if I could see it. I immediately saw it, it saw me and flipped! Next thing I knew I was backing up trying to dodge this bullet of a canine. It's first lunge missed and only got my pants but then it lunged again and jumped getting my knee. It was about to go for Elder Huntsman when the lady came out and yelled at it. She seemed super embarrassed and not surprised it happened again... No holes in my pants tho. And the dog idk what tipe some poodle mix Send me some cute nice dog pics to make up for that jaja or send me a story of when you got bit. Next week is our reception round because of how rough this week was with all plans falling through Los amo! Elder Jacobs Pictures: new district Franklin the absolute Chad of a recent convert More from this week "}, {"id": "l50", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAY 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": [], "moments": ["Temple"], "extra": "", "kind": "Letter 50 · Brandon", "title": "🤯 Things of my soul & the grind 🤠", "date": "2022-05-30T06:03:00", "group": "2022-05", "html": "<div class=\"body\"><p>Ola, cómo estáis?<\/p>\n<p>Everything is going great here. We have seen more success and had some great opportunities to learn and then apply the new knowledge to see miracles.<\/p>\n<p>This week we didn&#x27;t have district council because we had Zone conference. The focus this time was &quot;things of my soul&quot;/final testimony. With this being the last one for the Hollingsworth before we get the Gardiners, it was really special. The trainings were very focused on goals, key truths, and our personal development. Basically if I was to die what would I teach/testify before. While I won&#x27;t share my conversion story here (ask me if you would like, I will), I do have something to share; one of the many of my soul.<\/p>\n<p>Temples<\/p>\n<p>Temples have always been something special for me. They are completely different than the buildings we meet in and I have had the opportunity to visit many, either the actual ordinances or open houses. I never realized before but one of my happiest memories or parts of my life was junior year because I was going every Thursday after school with friends (Now Elder Grossen &amp; soon to be Elder Baker). It&#x27;s been so awesome this year as well because I was able to visit the Orlando temple in March and we as a mission are focused on getting recent converts and members who haven&#x27;t gone to go to the temple. It&#x27;s a hard goal because we can&#x27;t be there with them but their experiences are priceless. Mosiah 2:6<\/p>\n<p>And they pitched their tents round about the temple, every man having his tent with the door thereof towards the temple, that thereby they might remain in their tents and hear the words which king Benjamin should speak unto them I hope you all can find time this week to go to the temple, at the very least to the grounds if you are struggling with time or are trying to renew your Recommend. I love you all.<\/p>\n<p>Now to continue with what happened this week.<\/p>\n<p>I went on a exchange this week to Riverview where I spent 24 hours with Elder CJ Ricks again and Elder Mason. We had a pretty good time together. We were going to go biking but the bikes got stuck on the bike rack... so we burned a ton of miles.<\/p>\n<p>We had some pretty fire lessons this week. Here are some of our friends names if you could pray for then 🙏 Jaime - answer to moronis promise<\/p>\n<p>Melina - health recovery and comfort<\/p>\n<p>Zulene - help with her family and little girl that has some serious health problems<\/p>\n<p>Mercedes - find ways to make ends meet<\/p>\n<p>Felix - find balance of church and work<\/p>\n<p>Overall pray for them to recognize the truth, find time to go to church, and learn English.<\/p>\n<p>It&#x27;s been a week of finding and trying to find the truly elect and ready to receive. So much of our time this week was walking around, calling and driving because of some of the distance.<\/p>\n<p class=\"sign\">Los amo changos<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures<\/p>\n<ul class=\"bul\">\n<li>saw Elder Ballif at Zone conference<\/li>\n<li>drinking some mate (thanks mom!)<\/li>\n<li>zucchini pasta 🤤 (would eat again actually health grind has been good)<\/li>\n<li>Saturday nights 🌙 🔥<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-05-30_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-30_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-30_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-30_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_281.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_282.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_283.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_284.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_285.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_286.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_287.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_288.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_289.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_290.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_291.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_292.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_293.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_294.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_295.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_296.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_297.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🤯 Things of my soul & the grind 🤠 Ola, cómo estáis? Everything is going great here. We have seen more success and had some great opportunities to learn and then apply the new knowledge to see miracles. This week we didn't have district council because we had Zone conference. The focus this time was \"things of my soul\"/final testimony. With this being the last one for the Hollingsworth before we get the Gardiners, it was really special. The trainings were very focused on goals, key truths, and our personal development. Basically if I was to die what would I teach/testify before. While I won't share my conversion story here (ask me if you would like, I will), I do have something to share; one of the many of my soul. Temples Temples have always been something special for me. They are completely different than the buildings we meet in and I have had the opportunity to visit many, either the actual ordinances or open houses. I never realized before but one of my happiest memories or parts of my life was junior year because I was going every Thursday after school with friends (Now Elder Grossen & soon to be Elder Baker). It's been so awesome this year as well because I was able to visit the Orlando temple in March and we as a mission are focused on getting recent converts and members who haven't gone to go to the temple. It's a hard goal because we can't be there with them but their experiences are priceless. Mosiah 2:6 And they pitched their tents round about the temple, every man having his tent with the door thereof towards the temple, that thereby they might remain in their tents and hear the words which king Benjamin should speak unto them I hope you all can find time this week to go to the temple, at the very least to the grounds if you are struggling with time or are trying to renew your Recommend. I love you all. Now to continue with what happened this week. I went on a exchange this week to Riverview where I spent 24 hours with Elder CJ Ricks again and Elder Mason. We had a pretty good time together. We were going to go biking but the bikes got stuck on the bike rack... so we burned a ton of miles. We had some pretty fire lessons this week. Here are some of our friends names if you could pray for then 🙏 Jaime - answer to moronis promise Melina - health recovery and comfort Zulene - help with her family and little girl that has some serious health problems Mercedes - find ways to make ends meet Felix - find balance of church and work Overall pray for them to recognize the truth, find time to go to church, and learn English. It's been a week of finding and trying to find the truly elect and ready to receive. So much of our time this week was walking around, calling and driving because of some of the distance. Los amo changos Elder Jacobs Pictures saw Elder Ballif at Zone conference drinking some mate (thanks mom!) zucchini pasta 🤤 (would eat again actually health grind has been good) Saturday nights 🌙 🔥 More from this week "}, {"id": "l51", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><\/div>", "cultures": ["WS"], "moments": [], "extra": "Samoa", "kind": "Letter 51 · Brandon", "title": "Summer is here!", "date": "2022-06-06T15:14:00", "group": "2022-06", "html": "<div class=\"body\"><p>Hola Amigos! Hace Calor could fry an egg on the cement its sooo caliente!<\/p>\n<p>Sesame street song...<\/p>\n<p>Anyways summer is here in full force; random weather changes, lots of rain and humidity, and of course lightning. Lightning capital of the world for a reason.<\/p>\n<p>As far as this week goes we tried to make the most of it and win the challenge of most lessons with members helping us teach. It was between the 2 districts in the zone and we smoked them = pizza party on pday! That was pretty hard having members so consistently but it helped our friends understand more and feel more fellowshipped.<\/p>\n<p>I went on another exchange this week to Riverview and not much happened because of a bunch of cancels or rescheduled lessons. It was fun being with those elders, ricks and ricks. Yeah there are 2 in that companionship + elder mason.<\/p>\n<p>Our friends are doing well, some are very interested in reading, others need some encouragement, and others got dropped but maybe with some other missionaries when they are more prepared. I&#x27;ve been learning a lot about that and prayer this week as I have wrestled with some questions and tried to receive more revelation to guide this companionship and area. I have found that when possible making some prayers out loud even alone really helps along with just listening and waiting for God to talk in this &quot;conversation&quot; . It&#x27;s been good.<\/p>\n<p>Enjoy the pics from Zone Conference, President and Sister Hollingsworth&#x27;s last<\/p>\n<p>My phone decided to stop being a phone this week so next week I&#x27;ll have more pics and be able to talk/type more. #computergang4today<\/p>\n<p>los amamos! I will hit 1 year Thursday! (still need to learn more and help others though :D)<\/p>\n<p>oh and Elder Huntsman and I will be getting a new trainee from Samoa as well this week. Mid transfer woo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-06-06_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-06_0_1.jpeg\" alt=\"\"><\/figure><\/div>", "text": "Summer is here! Hola Amigos! Hace Calor could fry an egg on the cement its sooo caliente! Sesame street song... Anyways summer is here in full force; random weather changes, lots of rain and humidity, and of course lightning. Lightning capital of the world for a reason. As far as this week goes we tried to make the most of it and win the challenge of most lessons with members helping us teach. It was between the 2 districts in the zone and we smoked them = pizza party on pday! That was pretty hard having members so consistently but it helped our friends understand more and feel more fellowshipped. I went on another exchange this week to Riverview and not much happened because of a bunch of cancels or rescheduled lessons. It was fun being with those elders, ricks and ricks. Yeah there are 2 in that companionship + elder mason. Our friends are doing well, some are very interested in reading, others need some encouragement, and others got dropped but maybe with some other missionaries when they are more prepared. I've been learning a lot about that and prayer this week as I have wrestled with some questions and tried to receive more revelation to guide this companionship and area. I have found that when possible making some prayers out loud even alone really helps along with just listening and waiting for God to talk in this \"conversation\" . It's been good. Enjoy the pics from Zone Conference, President and Sister Hollingsworth's last My phone decided to stop being a phone this week so next week I'll have more pics and be able to talk/type more. #computergang4today los amamos! I will hit 1 year Thursday! (still need to learn more and help others though :D) oh and Elder Huntsman and I will be getting a new trainee from Samoa as well this week. Mid transfer woo Elder Jacobs Samoa"}, {"id": "l52", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": ["WS"], "moments": ["Temple"], "extra": "Samoa", "kind": "Letter 52 · Brandon", "title": "Triple trouble", "date": "2022-06-13T09:26:00", "group": "2022-06", "html": "<div class=\"body\"><p>Que onda chavos? Tenemos el hijole!<\/p>\n<p>Trío power has begun. And also shenanigans<\/p>\n<p>Beginning of the week was pretty standard just kinda waiting for trainee day. Monday: we were given al pastor tacos from the hernandez family. Trying to get them to the temple! (We actually found the lost records! Milagro!) Tuesday started with district council and focusing on raising our vision. Trials help us and we need to set high goals to see big miracles. I also got a temporary phone so I can take more pictures but sometimes I still forget I have a phone again. Wednesday: had interviews with President and Sister Hollingsworth. Definitely hard to say bye for now since that was the last and new President comes in the 30th but I got to figure more stuff out talking with them. And like the both said, &quot;you&#x27;re stuck with us forever&quot; so it&#x27;s ok. Then the evening in thonotassa, another city in the plant city area. Now for the fun<\/p>\n<p>Thursday morning is when we drove to Tampa and picked up Elder Fuimaono Lutu aka Elder Lutu. He is from America Samoa 🇼🇸 and full of energy. He is so happy to be here its awesome. He just sometimes falls asleep because he is still adjusting to the time zone difference and the full missionary schedule. Spanish will be his 3rd language after 1. English 2. Samoan (common &amp; language of the God&#x27;s because there are 2 levels of speaking).<\/p>\n<p>The rest of our week was lots of tracting trying to find more friends. We had quite a bit of success but no success as far as people being home when we tried to pass by the second time. We also spent more time inside doing Facebook, phone calls, and training el hijole because we tried to shake it up but also it was almost always raining this weekend. My little thought this week is about prayer and Moroni&#x27;s promise. I have thought before in the past that it&#x27;s a one time thing but if we are truly developing our testimonies, being confronted by others and their ideas, or whatever else you need to continue asking for revelation of truth. So just want you to pray and ask God again to confirm the truth of the book of mormón.<\/p>\n<p class=\"sign\">Los amo no Hagan drogas<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>sleepy hijole Elder Lutu X2<\/li>\n<li>Jamaica (hibiscus, they actually make a drink from these it&#x27;s super good and healthy)<\/li>\n<li>video call lesson with Franklin (recent convert) and his friend Edynay<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-06-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-13_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-13_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-13_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_298.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_299.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Triple trouble Que onda chavos? Tenemos el hijole! Trío power has begun. And also shenanigans Beginning of the week was pretty standard just kinda waiting for trainee day. Monday: we were given al pastor tacos from the hernandez family. Trying to get them to the temple! (We actually found the lost records! Milagro!) Tuesday started with district council and focusing on raising our vision. Trials help us and we need to set high goals to see big miracles. I also got a temporary phone so I can take more pictures but sometimes I still forget I have a phone again. Wednesday: had interviews with President and Sister Hollingsworth. Definitely hard to say bye for now since that was the last and new President comes in the 30th but I got to figure more stuff out talking with them. And like the both said, \"you're stuck with us forever\" so it's ok. Then the evening in thonotassa, another city in the plant city area. Now for the fun Thursday morning is when we drove to Tampa and picked up Elder Fuimaono Lutu aka Elder Lutu. He is from America Samoa 🇼🇸 and full of energy. He is so happy to be here its awesome. He just sometimes falls asleep because he is still adjusting to the time zone difference and the full missionary schedule. Spanish will be his 3rd language after 1. English 2. Samoan (common & language of the God's because there are 2 levels of speaking). The rest of our week was lots of tracting trying to find more friends. We had quite a bit of success but no success as far as people being home when we tried to pass by the second time. We also spent more time inside doing Facebook, phone calls, and training el hijole because we tried to shake it up but also it was almost always raining this weekend. My little thought this week is about prayer and Moroni's promise. I have thought before in the past that it's a one time thing but if we are truly developing our testimonies, being confronted by others and their ideas, or whatever else you need to continue asking for revelation of truth. So just want you to pray and ask God again to confirm the truth of the book of mormón. Los amo no Hagan drogas Elder Jacobs Pictures: sleepy hijole Elder Lutu X2 Jamaica (hibiscus, they actually make a drink from these it's super good and healthy) video call lesson with Franklin (recent convert) and his friend Edynay More from this week Samoa"}, {"id": "l53", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><\/div>", "cultures": ["WS"], "moments": [], "extra": "Samoa", "kind": "Letter 53 · Brandon", "title": "🍳🍱 Feliz día de los Padres 🥩", "date": "2022-06-20T05:49:00", "group": "2022-06", "html": "<div class=\"body\"><p>Talofa usos! (What&#x27;s up my bruddas in Samoan)<\/p>\n<p>This week was super hot 100s for most of it until the weekend we lots of rain came pouring in! Happy Father&#x27;s day to all the dads (even those I crashed at their place to hangout with da bois)<\/p>\n<p>We had our last district council this week but I thought I&#x27;d be here another transfer but I will in fact be leaving to Tampa, training and now a district leader so we&#x27;ll see how that goes. The meeting was really awesome reviewing keeping ourselves accountable to the lord, choosing obedience out of love and then we ended with a testimony meeting. We also had Elder Noah Ricks join us for an exchange. It was interesting because it is going home tomorrow but while on the exchange he was constantly trying to give a some pointers. A dying man&#x27;s last words of wisdom. Wednesday our GPS said hey you have to take a dirt road despite a perfectly road was usable to get to our friend Emilio&#x27;s. But we did find a tractor and field of sunflowers.<\/p>\n<p>Nothing much the following day but we were blessed with lots of awesome lessons.<\/p>\n<p>Friday was wack, Jaja. We went and got our eyebrows done by Yoana, a recent convert that is kinda falling away. So spending that time with here was good but man does threading hurt in my opinion. We then also had more bomb lessons with friends. Liset is feeling better but she and Rafael both decided to push the date back because they are not quite ready but really want to soon!<\/p>\n<p>The rest of the week was fairly uneventful because of the amounts of calls/texts trying to check up on friends and get them to church. Pretty normal stuff.<\/p>\n<p>I wanted to share something Elder Lutu shared with me about spiritual help/gifts. Because we need God&#x27;s help, we normally pray to get it (sometimes it is just given but normally we pray) but for things more complex like the gift of tongues we have to study. Study the language and also the scriptures because if we don&#x27;t do the two our spiritual wellbeing declines and we also cheat the spirit. We need a balance with everything. So try to find out if you need to put more effort towards said gift you want or more studying to ensure the spirit is there to help you receive.<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>lambo @ church<\/li>\n<li>Fred&#x27;s Country style buffet with brother Mosher<\/li>\n<li>captain🇺🇸<\/li>\n<li>Recent convert threaded our eyebrows (yes I look high... it hurt ok..)<\/li>\n<li>🚜🌻<\/li>\n<li>Bob Ross<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-06-20_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-20_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-20_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_8.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_300.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_301.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_302.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_303.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_304.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_305.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_306.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_307.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_308.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_309.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_310.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_311.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_312.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_313.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_314.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_315.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_316.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_317.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🍳🍱 Feliz día de los Padres 🥩 Talofa usos! (What's up my bruddas in Samoan) This week was super hot 100s for most of it until the weekend we lots of rain came pouring in! Happy Father's day to all the dads (even those I crashed at their place to hangout with da bois) We had our last district council this week but I thought I'd be here another transfer but I will in fact be leaving to Tampa, training and now a district leader so we'll see how that goes. The meeting was really awesome reviewing keeping ourselves accountable to the lord, choosing obedience out of love and then we ended with a testimony meeting. We also had Elder Noah Ricks join us for an exchange. It was interesting because it is going home tomorrow but while on the exchange he was constantly trying to give a some pointers. A dying man's last words of wisdom. Wednesday our GPS said hey you have to take a dirt road despite a perfectly road was usable to get to our friend Emilio's. But we did find a tractor and field of sunflowers. Nothing much the following day but we were blessed with lots of awesome lessons. Friday was wack, Jaja. We went and got our eyebrows done by Yoana, a recent convert that is kinda falling away. So spending that time with here was good but man does threading hurt in my opinion. We then also had more bomb lessons with friends. Liset is feeling better but she and Rafael both decided to push the date back because they are not quite ready but really want to soon! The rest of the week was fairly uneventful because of the amounts of calls/texts trying to check up on friends and get them to church. Pretty normal stuff. I wanted to share something Elder Lutu shared with me about spiritual help/gifts. Because we need God's help, we normally pray to get it (sometimes it is just given but normally we pray) but for things more complex like the gift of tongues we have to study. Study the language and also the scriptures because if we don't do the two our spiritual wellbeing declines and we also cheat the spirit. We need a balance with everything. So try to find out if you need to put more effort towards said gift you want or more studying to ensure the spirit is there to help you receive. Los amo, Elder Jacobs Pictures: lambo @ church Fred's Country style buffet with brother Mosher captain🇺🇸 Recent convert threaded our eyebrows (yes I look high... it hurt ok..) 🚜🌻 Bob Ross More from this week Samoa"}, {"id": "l54", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Letter 54 · Tampa", "title": "👾Chapter 8 (8th area): flood gates🏄‍♂️", "date": "2022-06-27T06:56:00", "group": "2022-06", "html": "<div class=\"body\"><p>Bom día meus queridos amigos,<\/p>\n<p>Como vôces están?<\/p>\n<p>I made it to the big city. Good &#x27;ol Tampa Bay and it has been something else. My last biggest (by population) area was Largo aka st. Pete and this area is even more and especially condensed. A big surprise me and my companion, Elder Dean, didn&#x27;t expect was the possibility of covering more than our stake. Due to the amount of Spanish missionaries, areas and missionaries still in training the neighboring area/zone above us was closed for Spanish. We now cover Odessa as well for the time being. Rip our miles and time driving.<\/p>\n<p>Monday I said some of my last goodbyes to the sweet Hernández Avalrez Family along with some mad packing that evening. It was nice being able to be with the other elders during pday and one of my favorite families I met in Brandon. Tuesday was transfers like normal and we took some pictures before saying goodbye to my old companions and some missionaries going home (rip my dad elder Nelson). The rest of the day was hectic trying to settle in and also teach and find in the evening.<\/p>\n<p>We do have English class here, I&#x27;m pretty sure almost every area does. And so I was able to teach that Wednesday night. There is also soccer night but because of whatever happened in the Supreme Court there was possible riots and we were notified to stay inside. That kinda sucked... a lot... we had some good plans but had to replan. Sunday was really awesome. We had some friends come to church, get really fellowshipped, and we found some awesome members to take to Lessons. We also were asked, along with the other elders to go and give our testimonies since a speaker wasn&#x27;t able to be there. I really appreciated that because it meant I could introduce myself a bit more. I talked about the prodigal son and God&#x27;s love mostly because it really is true. We may go off in search of more blessings, peace, joy but in the end only God and his love will be the best. I love that parable and that simple truth: God&#x27;s love is unconditional but he also wants us to become better.<\/p>\n<p>Currently the &quot;flood gates&quot; are the other elders and the sheer amount of referrals. The go finding and talk to everyone then send us every Spanish person causing us to make tons of calls and stop bys. It&#x27;s crazy and most of them actually want to talk, that&#x27;s how we found Maria.<\/p>\n<p>Here are our current friends if you could pray for then:<\/p>\n<ul class=\"bul\">\n<li>Ada &amp; Julian<\/li>\n<li>Alan<\/li>\n<li>Carlos<\/li>\n<li>Blanca<\/li>\n<li>Margarita<\/li>\n<li>Luis Enrique<\/li>\n<li>Maria (she was a referral and has already seen the restoration movie!)<\/li>\n<li>Greisy, Omar, &amp; Veronica<\/li>\n<li>Letty<\/li>\n<li>Guadalina<\/li>\n<li>Dary<\/li>\n<\/ul>\n<p class=\"sign\">Los amo y espero por su mensaje y como fue su Semana! Pasta luego!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Elder Dean &amp; I selfies<\/li>\n<li>Saying bye to Elder Nelson<\/li>\n<li>Hernández Avalrez Family<\/li>\n<li>Alexis<\/li>\n<li>raccoon<\/li>\n<li>Freezer shoes (we were told we might have bed bugs so we started taking precautions, we&#x27;ll see if we do because we haven&#x27;t seen or felt anything rip the other elders that do right now)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-06-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_7.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_318.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_319.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_320.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_321.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_322.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_323.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_324.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_325.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_326.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_327.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_328.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "👾Chapter 8 (8th area): flood gates🏄‍♂️ Bom día meus queridos amigos, Como vôces están? I made it to the big city. Good 'ol Tampa Bay and it has been something else. My last biggest (by population) area was Largo aka st. Pete and this area is even more and especially condensed. A big surprise me and my companion, Elder Dean, didn't expect was the possibility of covering more than our stake. Due to the amount of Spanish missionaries, areas and missionaries still in training the neighboring area/zone above us was closed for Spanish. We now cover Odessa as well for the time being. Rip our miles and time driving. Monday I said some of my last goodbyes to the sweet Hernández Avalrez Family along with some mad packing that evening. It was nice being able to be with the other elders during pday and one of my favorite families I met in Brandon. Tuesday was transfers like normal and we took some pictures before saying goodbye to my old companions and some missionaries going home (rip my dad elder Nelson). The rest of the day was hectic trying to settle in and also teach and find in the evening. We do have English class here, I'm pretty sure almost every area does. And so I was able to teach that Wednesday night. There is also soccer night but because of whatever happened in the Supreme Court there was possible riots and we were notified to stay inside. That kinda sucked... a lot... we had some good plans but had to replan. Sunday was really awesome. We had some friends come to church, get really fellowshipped, and we found some awesome members to take to Lessons. We also were asked, along with the other elders to go and give our testimonies since a speaker wasn't able to be there. I really appreciated that because it meant I could introduce myself a bit more. I talked about the prodigal son and God's love mostly because it really is true. We may go off in search of more blessings, peace, joy but in the end only God and his love will be the best. I love that parable and that simple truth: God's love is unconditional but he also wants us to become better. Currently the \"flood gates\" are the other elders and the sheer amount of referrals. The go finding and talk to everyone then send us every Spanish person causing us to make tons of calls and stop bys. It's crazy and most of them actually want to talk, that's how we found Maria. Here are our current friends if you could pray for then: Ada & Julian Alan Carlos Blanca Margarita Luis Enrique Maria (she was a referral and has already seen the restoration movie!) Greisy, Omar, & Veronica Letty Guadalina Dary Los amo y espero por su mensaje y como fue su Semana! Pasta luego! Elder Jacobs Pictures: Elder Dean & I selfies Saying bye to Elder Nelson Hernández Avalrez Family Alexis raccoon Freezer shoes (we were told we might have bed bugs so we started taking precautions, we'll see if we do because we haven't seen or felt anything rip the other elders that do right now) More from this week "}, {"id": "l55",
