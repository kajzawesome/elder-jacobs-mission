><img src=\"images/2022-01-10_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-10_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_151.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_152.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_153.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_154.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_155.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_156.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_157.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_158.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_159.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐊 Ok this is not epic 🤒🤕 Buenos Días amigos míos! Don't worry I'm not sick or my companion. But lots of our friends hence the title. Otherwise this week went really well! Spent a decent amount of time in haines city despite it being far. We are starting to get a decent number of friends there. Some ladys gave us some tacos (carne asada) and salsa (my lips Hurt for 30min but it tastes good). We found an electric organ (sadly didn't work) and snuck it into the other Elders' apartment (remember to lock your doors kiddos). Had some awesome lessons with friends this week: Antonio, Francisco & jocelyn, Maria, Juan & Ydasty, Perez Ortiz family, Araceli, and Hipolito. Some people have asked for a quick list of our friends so they can pray for them so there it is. ⬆️Good luck pronouncing some of the names 😉 Araceli is a bomb cook. She made us some homemade sopes (I sent a picture in a past email of some, basically friend dough then tostada stuff on top). She cooks all day Fridays. Might have to go by again and see if she'll give us more, she claims to have the best enchiladas. 🤩🧐 Arnulfo came to church again! And we have a lesson this Wednesday. Hoping we can finally get him baptized since he has already done everything just life was hectic. Please pray for our members too because we only had 1 hour of church and about 25 people come because of covid, flu, ect. I ended up fumbling my way through the piano with my very limited skills but at least we had it. One challenge Elder Izu and I have is only spanish from 10am to 9pm. It's pretty hard sometimes but pretty cool to do it because it makes conversations more natural/easy and sometimes even starts conversations. \"Yes I know I'm a gringo but speaking spanish. Yes Elder Izu looks Mexican but speaks less than you originally thought \" examples we have to say or explain frequently. I've been studying virtue this week as I prepare for a giving a training in our district council tuesday. So I've read a bunch of talks (mostly to young women) and scriptures. Basically if you want to be more virtuous and christlike you need to strive to have better things in your life and seek the things of God. Another thing is always thinking in good things that way your mind is occupied making temptation harder to enter. Go find a way to have more of God's hand in your life and be virtuous friends! Espero que vayan bien y tengan una buena semana amigos! Hasta la proxima, Elder Jacobs Pictures: our homemade shrimp tacos 🌮 😋 🍤 🦐 sick gator mural More from this week Mexico"}, {"id": "l31", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">JAN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><\/div>", "cultures": ["PR"], "moments": [], "extra": "Puerto Rico", "kind": "Letter 31 · Winter Haven", "title": "Car-by", "date": "2022-01-17T10:57:00", "group": "2022-01", "html": "<p class=\"tnote\">I forgot to give this one a title when I sent it, so I added one later.<\/p><div class=\"body\"><p>Hola Qué tal bröthers?<\/p>\n<p>Vidal,  recent convert, loves to say that since he is learning English.<\/p>\n<p>Had a good week, still had some hard/bad moments but without them the rest of the week doesn&#x27;t seem as good. Opposition in all things as Nephi talks about it 2 nefi 2.<\/p>\n<p>Anyways, the week was really good because of finding some new areas to find which means new friends! They seem really hyped and readily accepted the book of Mormon. Sadly we don&#x27;t have any since Salt Lake hasnt sent out any more spanish in a few months so rip.<\/p>\n<p>Carlos, our ward mission leader ce with us to a bunch of lessons which was awesome! Having members in lessons helps our friends have people they already know at church and in our case someone who knows the language perfectly so the can make some awesome examples to help the friend connect the dots.<\/p>\n<p>Thursday our car got fixed finally, minor dent on back left from missionaries before us but we had to wait for insurance. So while waiting we hopped in the car with Winterhaven and were a quad for a day. We had surprisingly a lot of success and companionship unity.<\/p>\n<p>Saw a ROUS: rodent of unusual size, aka huge possum (sadly no pic)<\/p>\n<p>Went to taco bell, saw an awesome kirby themed car, drove off and we missed the picture. But then we went to a random neighborhood and the first house it was right there! And the owner, Orlando, is from Puerto Rico and loved our message! Going back again this week.<\/p>\n<p>Hope you are all doing well and killing it!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>kirby car<\/li>\n<li>I tried cooking salmon 😋🔥🔥 (I honestly don&#x27;t know what I do but I&#x27;m becoming a master chef, welcome to flavor town)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-17_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-17_0_1.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_160.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_161.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_162.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_163.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_164.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_165.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_166.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_167.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_168.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_169.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Car-by Hola Qué tal bröthers? Vidal, recent convert, loves to say that since he is learning English. Had a good week, still had some hard/bad moments but without them the rest of the week doesn't seem as good. Opposition in all things as Nephi talks about it 2 nefi 2. Anyways, the week was really good because of finding some new areas to find which means new friends! They seem really hyped and readily accepted the book of Mormon. Sadly we don't have any since Salt Lake hasnt sent out any more spanish in a few months so rip. Carlos, our ward mission leader ce with us to a bunch of lessons which was awesome! Having members in lessons helps our friends have people they already know at church and in our case someone who knows the language perfectly so the can make some awesome examples to help the friend connect the dots. Thursday our car got fixed finally, minor dent on back left from missionaries before us but we had to wait for insurance. So while waiting we hopped in the car with Winterhaven and were a quad for a day. We had surprisingly a lot of success and companionship unity. Saw a ROUS: rodent of unusual size, aka huge possum (sadly no pic) Went to taco bell, saw an awesome kirby themed car, drove off and we missed the picture. But then we went to a random neighborhood and the first house it was right there! And the owner, Orlando, is from Puerto Rico and loved our message! Going back again this week. Hope you are all doing well and killing it! Elder Jacobs Pictures: kirby car I tried cooking salmon 😋🔥🔥 (I honestly don't know what I do but I'm becoming a master chef, welcome to flavor town) More from this week Puerto Rico"}, {"id": "l32", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">JAN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><\/div>", "cultures": ["VE"], "moments": [], "extra": "Venezuela", "kind": "Letter 32 · Winter Haven", "title": "📈 Sprain-ing news 👟🏴‍☠️", "date": "2022-01-24T11:20:00", "group": "2022-01", "html": "<div class=\"body\"><p>Ok so after my last email everyone started playing basketball 🏀 and everything was going well until Elder Izu jumped up for a rebound and landed bad rolling/sprainging his ankle. We then spent a few hours in an urgent care. Luckily nothing is broken, he&#x27;s on crutches for now hopefully he can start walking a bit this week because crutches hurt (those who have used them before know).<\/p>\n<p>Anyways our friends are doing good. Most of them got pretty sick this week because of the weather shirt. We went from 70s or 80s to 50s with lots of wind. We were also freezing a bit at times but not sick so that&#x27;s good. English class was good. We taught wouldn&#x27;t&#x27;ve and contractions x2 like whom&#x27;std&#x27;nt&#x27;ve jajaa but they loved it. We had Zone conference this week. Go read your scriptures and pray. God loves you! Most the stuff I learned really applies towards missionaries and myself personally so go seek some personal revelation.<\/p>\n<p>We also got some music from our friend José because he is apparently a musician! Let me know if you want some awesome talent and Venezuelan music.<\/p>\n<p>The rest of the week was pretty good.<\/p>\n<p class=\"sign\">Los amo y buena suerte esta semana sois bestias!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>crutches time<\/li>\n<li>enlgish class<\/li>\n<li>Zone conference<\/li>\n<li>spilled naranjas from a big truck<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-24_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-24_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-24_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-24_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-24_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-24_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-24_0_6.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_170.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_171.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_172.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "📈 Sprain-ing news 👟🏴‍☠️ Ok so after my last email everyone started playing basketball 🏀 and everything was going well until Elder Izu jumped up for a rebound and landed bad rolling/sprainging his ankle. We then spent a few hours in an urgent care. Luckily nothing is broken, he's on crutches for now hopefully he can start walking a bit this week because crutches hurt (those who have used them before know). Anyways our friends are doing good. Most of them got pretty sick this week because of the weather shirt. We went from 70s or 80s to 50s with lots of wind. We were also freezing a bit at times but not sick so that's good. English class was good. We taught wouldn't've and contractions x2 like whom'std'nt've jajaa but they loved it. We had Zone conference this week. Go read your scriptures and pray. God loves you! Most the stuff I learned really applies towards missionaries and myself personally so go seek some personal revelation. We also got some music from our friend José because he is apparently a musician! Let me know if you want some awesome talent and Venezuelan music. The rest of the week was pretty good. Los amo y buena suerte esta semana sois bestias! Elder Jacobs Pictures: crutches time enlgish class Zone conference spilled naranjas from a big truck More from this week Venezuela"}, {"id": "l33", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">JAN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 33 · Winter Haven", "title": "🥳🌊 Baptism train coming soon! 😇🤕", "date": "2022-01-31T07:37:00", "group": "2022-01", "html": "<div class=\"body\"><p>¿Qué tal queridos amigos?<\/p>\n<p>This week was a great one! Despite starting the week off with a minor concusion, that was not fun just a constant headache, we had a lot of success.<\/p>\n<p>Unlike the weeks before, we had a ton of lessons with our friends leaving us very little time to go out and continue to find new people to teach. But in the end we still found 8 new people this week.<\/p>\n<p>The reason the title of this email is baptism train is 1. Johnny Cash Bible train 🚅😎🛤 and 2. Many of our friends have expressed the desire to be baptized soon. Erby, Jhon, José, and Antonio (Feb. 26) have expressed this desire and we will set a date this week with them hopefully if we haven&#x27;t already 🌊🌊🌊.<\/p>\n<p>Other things that happened this week:<\/p>\n<ul class=\"bul\">\n<li>freaking cold this week...<\/li>\n<li>Elder Izu has been able to walk on his foot a bit!<\/li>\n<li>saw some awesome 🐕 🐶 dogs<\/li>\n<li>I played the piano in sacrament again<\/li>\n<li>also in primary 🤩<\/li>\n<li>taught Vidal the phrase &quot;what&#x27;s pop&#x27;in?&quot;<\/li>\n<\/ul>\n<p>I finished 4 nefi this week and started Mormon. I love the part about no -ites but one people, children of christ. Elder Holland&#x27;s talk from last conference talks about it really well, go read.<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2021/10/12holland?lang=eng<\/p>\n<p>We have interviews this week with President and Sister Hollingsworth wich means only 2 weeks until transfers. Time Flys. Also I have an exchange this week with the Assistants to the President (APs) so I&#x27;ll let you know how that goes. manténganse calientes<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>cool dog, husky + canine hence the coat color (I forgot her name srry)<\/li>\n<li>Dillon vidals puppy (he has his ponchito on)<\/li>\n<li>Elder Izu tenía hambre<\/li>\n<li>I drew Shrek<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-31_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-31_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-31_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-31_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-31_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_173.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_174.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_175.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_176.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🥳🌊 Baptism train coming soon! 😇🤕 ¿Qué tal queridos amigos? This week was a great one! Despite starting the week off with a minor concusion, that was not fun just a constant headache, we had a lot of success. Unlike the weeks before, we had a ton of lessons with our friends leaving us very little time to go out and continue to find new people to teach. But in the end we still found 8 new people this week. The reason the title of this email is baptism train is 1. Johnny Cash Bible train 🚅😎🛤 and 2. Many of our friends have expressed the desire to be baptized soon. Erby, Jhon, José, and Antonio (Feb. 26) have expressed this desire and we will set a date this week with them hopefully if we haven't already 🌊🌊🌊. Other things that happened this week: freaking cold this week... Elder Izu has been able to walk on his foot a bit! saw some awesome 🐕 🐶 dogs I played the piano in sacrament again also in primary 🤩 taught Vidal the phrase \"what's pop'in?\" I finished 4 nefi this week and started Mormon. I love the part about no -ites but one people, children of christ. Elder Holland's talk from last conference talks about it really well, go read. https://www.churchofjesuschrist.org/study/general-conference/2021/10/12holland?lang=eng We have interviews this week with President and Sister Hollingsworth wich means only 2 weeks until transfers. Time Flys. Also I have an exchange this week with the Assistants to the President (APs) so I'll let you know how that goes. manténganse calientes Los amo! Elder Jacobs Pictures: cool dog, husky + canine hence the coat color (I forgot her name srry) Dillon vidals puppy (he has his ponchito on) Elder Izu tenía hambre I drew Shrek More from this week "}, {"id": "l34", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">FEB 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🎄 Holidays<\/span><\/div>", "cultures": ["PR"], "moments": ["Baptism", "Holidays"], "extra": "Puerto Rico", "kind": "Letter 34 · Winter Haven", "title": "🅱️ovid quarantine & ETs!", "date": "2022-02-07T05:48:00", "group": "2022-02", "html": "<div class=\"body\"><p>Yep you read that right. Sorry Grandma Fox but I got be&#x27;er (no longer a newt)<\/p>\n<p>Hola amigos!<\/p>\n<p>This week was well... a throwaway week for sure not much happened. Last Monday and actually the last weekend Elder Izu and I felt off but didn&#x27;t think much of it. Monday night I felt like I was dying but we had work to do! Then Tuesday morning I felt so bad I wanted to roll over and die so that my headache and everything would leave. Sister Meese, our mission nurse, told us to get tested but I felt so bad I couldn&#x27;t move. Luckily, the Winterhaven elders bought tests for us and clear as day we had the 🅱️ovid.<\/p>\n<p>If you are interested in my symptoms I would be freezing but sweating profusely and vice versa. My headache was constant and unrelenting, only lessened by pain killers. And my body ached a little bit but mostly would after I sneezed and it hurt so bad.<\/p>\n<p>Todo bien ahora! I&#x27;m not sick now and we are out of quarantine (5 days inside and 5-10 with masks always when around others). Not much missionary stuff happened because we were so sick but we had other missionaries and members drop stuff off to us like snacks, nerf guns and medicine.<\/p>\n<p>We had Arnulfo come to church and also our friends José y Ydasty. They all liked it and José &amp; ydasty&#x27;s kid loved primary (hermana Leticia bribed him with a cookie jaja). The hermanas had a baptism and they came to that too! But (there&#x27;s always a butt), last night we got a call from the AP&#x27;s. Transfers are next week so this call was early but it&#x27;s because we are getting ET&#x27;d, emergency transfered. Elder Izu is going to Tampa Spanish and I&#x27;m going to Peace river in the Fort Myers Zone (an English area/branch that has spanish missionaries for when a Latino is found). The cypress gardens East will be vacant for a week then at transfers filled? That last part is a mystery because we are short spanish missionaries. A good portion of the mission was reassigned while waiting for visas and borders to open and now everything is good.<\/p>\n<p>I love the ward and sad to leave but I&#x27;ll be back eventually and I&#x27;m excited to try something new. Go listen to some of Funkys songs because they are epic spanish music and all gospel related. I really like Soy tu Dios &amp; Todavía (the first about the miracles in the old testament and the God of Israel and the other about the prodigal son). If you don&#x27;t know spanish you can probably still appreciate the music but warning the lyrics won&#x27;t translate directly since Funky is puerto Rican and they use a lot of slang.<\/p>\n<p>Disfrasao&#x27; is also a good one. If you don&#x27;t want to search Google or are a missionary let me know and I can send you the songs.<\/p>\n<p class=\"sign\">Los amo muchísimo queridos amigos! Espero que no estén enfermos cómo yo estuve<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>quarantine (when we finally felt good enough to get dressed normally)<\/li>\n<li>Old Pictures I forgot from Christmas white elephant and the other day<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-02-07_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-07_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-07_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_177.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🅱️ovid quarantine & ETs! Yep you read that right. Sorry Grandma Fox but I got be'er (no longer a newt) Hola amigos! This week was well... a throwaway week for sure not much happened. Last Monday and actually the last weekend Elder Izu and I felt off but didn't think much of it. Monday night I felt like I was dying but we had work to do! Then Tuesday morning I felt so bad I wanted to roll over and die so that my headache and everything would leave. Sister Meese, our mission nurse, told us to get tested but I felt so bad I couldn't move. Luckily, the Winterhaven elders bought tests for us and clear as day we had the 🅱️ovid. If you are interested in my symptoms I would be freezing but sweating profusely and vice versa. My headache was constant and unrelenting, only lessened by pain killers. And my body ached a little bit but mostly would after I sneezed and it hurt so bad. Todo bien ahora! I'm not sick now and we are out of quarantine (5 days inside and 5-10 with masks always when around others). Not much missionary stuff happened because we were so sick but we had other missionaries and members drop stuff off to us like snacks, nerf guns and medicine. We had Arnulfo come to church and also our friends José y Ydasty. They all liked it and José & ydasty's kid loved primary (hermana Leticia bribed him with a cookie jaja). The hermanas had a baptism and they came to that too! But (there's always a butt), last night we got a call from the AP's. Transfers are next week so this call was early but it's because we are getting ET'd, emergency transfered. Elder Izu is going to Tampa Spanish and I'm going to Peace river in the Fort Myers Zone (an English area/branch that has spanish missionaries for when a Latino is found). The cypress gardens East will be vacant for a week then at transfers filled? That last part is a mystery because we are short spanish missionaries. A good portion of the mission was reassigned while waiting for visas and borders to open and now everything is good. I love the ward and sad to leave but I'll be back eventually and I'm excited to try something new. Go listen to some of Funkys songs because they are epic spanish music and all gospel related. I really like Soy tu Dios & Todavía (the first about the miracles in the old testament and the God of Israel and the other about the prodigal son). If you don't know spanish you can probably still appreciate the music but warning the lyrics won't translate directly since Funky is puerto Rican and they use a lot of slang. Disfrasao' is also a good one. If you don't want to search Google or are a missionary let me know and I can send you the songs. Los amo muchísimo queridos amigos! Espero que no estén enfermos cómo yo estuve Elder Jacobs Pictures: quarantine (when we finally felt good enough to get dressed normally) Old Pictures I forgot from Christmas white elephant and the other day More from this week Puerto Rico"}, {"id": "l35", "area": 4, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">PEACE RIVER, FL<\/span><span class=\"pm-d\">FEB 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 35 · Peace River", "title": "🗿🪐 Middle of nowhere & bautismo! 🌊", "date": "2022-02-14T10:01:00", "group": "2022-02", "html": "<div class=\"body\"><p>Hola a todos from the Middle of nowhere. I mean I&#x27;m somewhere just nobody probably has ever heard of it. We live in Wauchula and cover the surrounding towns: Arcadia, Myakka City, bowling Green, and a few other small ones. Our area is super rural. Only small towns, trainers, tiny houses, fields, and the likes. For example, we have a super tiny Walmart, family dollars and dollars general as our stores along with Wendy, Burger king, McDonald&#x27;s, and taco bell. Sadly no Chick-fil-A. The closest missionaries to us are an hour away sonwe are pretty isolated.<\/p>\n<p>The week was pretty good we taught a good amount of lessons, mostly Spanish luckily, and the members here really want to help with lessons which has been awesome. They also like to feed us, we may or may not have had 2 member meals on accident because we showed up and they prepared food.<\/p>\n<p>Elder Gundersen and I instantly clicked and have nonstop been laughing which made us think we will get transfered jaja. Normal transfers are tuesday and we are luckily both staying but the other elders (we in an all elder district) are getting whitewashed.<\/p>\n<p>Honestly nothing super crazy happened this week but we did meet some awesome guys, Misael &amp; Josue. They wanted to learn English but when we discussed our purpose and set expectations they were open to the gospel and said they had been searching for a church. Then they came the following day driving a little over an hour to get there! Peep the pic<\/p>\n<p>While I was transfered, I was still close enough to be able to go and baptize our friend Arnulfo! He was so happy and ready to start a new period of life. It was a super special experience and he shared his testimony which was super awesome!<\/p>\n<p class=\"sign\">Los amo muchísimo y Sean excelentes!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Josue, Elder Gundersen, Misael and me<\/li>\n<li>Arnulfo&#x27;s baptism!<\/li>\n<li>1 of 6 boxes of fresh strawberries 🍓 our friend Clemente gave us<\/li>\n<li>Elder Gundersens sunglasses and skills on the piano<\/li>\n<li>woo hoo pday<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-02-14_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-02-14_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-14_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-14_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-14_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_178.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_179.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_180.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_181.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🗿🪐 Middle of nowhere & bautismo! 🌊 Hola a todos from the Middle of nowhere. I mean I'm somewhere just nobody probably has ever heard of it. We live in Wauchula and cover the surrounding towns: Arcadia, Myakka City, bowling Green, and a few other small ones. Our area is super rural. Only small towns, trainers, tiny houses, fields, and the likes. For example, we have a super tiny Walmart, family dollars and dollars general as our stores along with Wendy, Burger king, McDonald's, and taco bell. Sadly no Chick-fil-A. The closest missionaries to us are an hour away sonwe are pretty isolated. The week was pretty good we taught a good amount of lessons, mostly Spanish luckily, and the members here really want to help with lessons which has been awesome. They also like to feed us, we may or may not have had 2 member meals on accident because we showed up and they prepared food. Elder Gundersen and I instantly clicked and have nonstop been laughing which made us think we will get transfered jaja. Normal transfers are tuesday and we are luckily both staying but the other elders (we in an all elder district) are getting whitewashed. Honestly nothing super crazy happened this week but we did meet some awesome guys, Misael & Josue. They wanted to learn English but when we discussed our purpose and set expectations they were open to the gospel and said they had been searching for a church. Then they came the following day driving a little over an hour to get there! Peep the pic While I was transfered, I was still close enough to be able to go and baptize our friend Arnulfo! He was so happy and ready to start a new period of life. It was a super special experience and he shared his testimony which was super awesome! Los amo muchísimo y Sean excelentes! Elder Jacobs Pictures: Josue, Elder Gundersen, Misael and me Arnulfo's baptism! 1 of 6 boxes of fresh strawberries 🍓 our friend Clemente gave us Elder Gundersens sunglasses and skills on the piano woo hoo pday More from this week "}, {"id": "l36", "area": 4, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">PEACE RIVER, FL<\/span><span class=\"pm-d\">FEB 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Letter 36 · Peace River", "title": "Sour but sweet", "date": "2022-02-21T11:17:00", "group": "2022-02", "html": "<div class=\"body\"><p>Hemlo mis amigos<\/p>\n<p>This week was pretty good but as my title hints hard.<\/p>\n<p>Our week started off with dropping (stopping teaching) some friends. It was really hard because ththe love we have for them and we thought they were ready for baptism; but was we had lessons, it became apparent that now was not there time yet.<\/p>\n<p>Then we were on the finding grind: biking, walking, member friends, basically anything we could do. That brought some really awesome miracles where we were being tools in the lord&#x27;s hands.<\/p>\n<p>Everyday this week we found 1 person that was in desperate need of us. Whether it be a blessing, scripture, or sometimes just a friendly ear.<\/p>\n<p>Something funny that happened this week was when we were waiting for Daniel to come outside so we could talk. We were on his porch but then all of a sudden I was 1 foot lower. My foot was resting on a bad board and I instantly sunk through. Elder Gundersen and I just looked at each other for a sec completely caught by surprise until I said, &quot;well help me up already!&quot; Jaja<\/p>\n<p>I gave a talk on Sunday (last minute surprise) and not being given a topic I felt I should talk on the atonement. Which was more or less the theme of the sacrament meeting #revelation. I would share it but I only have some quick notes/scriptures jotted down because I had 15min to prepare.<\/p>\n<p>Isaiah 53:3-6, 2 Nephi 9:5-8, 1 Corinthians 15:22<\/p>\n<p class=\"sign\">Los amo y Sean excelentes!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>shamrock shake is good, hadn&#x27;t tried before<\/li>\n<li>reeses (not worth it fyi)<\/li>\n<li>si<\/li>\n<li>random video from this week<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-02-21_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-21_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-21_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_182.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_183.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_184.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_185.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Sour but sweet Hemlo mis amigos This week was pretty good but as my title hints hard. Our week started off with dropping (stopping teaching) some friends. It was really hard because ththe love we have for them and we thought they were ready for baptism; but was we had lessons, it became apparent that now was not there time yet. Then we were on the finding grind: biking, walking, member friends, basically anything we could do. That brought some really awesome miracles where we were being tools in the lord's hands. Everyday this week we found 1 person that was in desperate need of us. Whether it be a blessing, scripture, or sometimes just a friendly ear. Something funny that happened this week was when we were waiting for Daniel to come outside so we could talk. We were on his porch but then all of a sudden I was 1 foot lower. My foot was resting on a bad board and I instantly sunk through. Elder Gundersen and I just looked at each other for a sec completely caught by surprise until I said, \"well help me up already!\" Jaja I gave a talk on Sunday (last minute surprise) and not being given a topic I felt I should talk on the atonement. Which was more or less the theme of the sacrament meeting #revelation. I would share it but I only have some quick notes/scriptures jotted down because I had 15min to prepare. Isaiah 53:3-6, 2 Nephi 9:5-8, 1 Corinthians 15:22 Los amo y Sean excelentes! Elder Jacobs Pictures: shamrock shake is good, hadn't tried before reeses (not worth it fyi) si random video from this week More from this week "}, {"id": "l37", "area": 4, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">PEACE RIVER, FL<\/span><span class=\"pm-d\">FEB 2022<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Letter 37 · Peace River", "title": "🐶🐺 Dogs, late night 🌚, road trips 🚙, and smoke 🔥", "date": "2022-02-28T08:59:00", "group": "2022-02", "html": "<div class=\"body\"><p>Buenoooooos dìaaaas mis queridos amigos!<\/p>\n<p>Qué lo que?<\/p>\n<p>We&#x27;ve had an awesome week with tons of lessons and our friends are doing well. We are kinda struggling because we have pretty much only spanish speaking friends in an English branch. The few spanish members here are really busy bit hopefully we find a way to overcome that along with find more English people to teach.<\/p>\n<p>We got called this week to do messaging for the Facebook page but then called again saying we aren&#x27;t doing 1 day a week for 3 hours aka prime time messaging but rather we are night time crew. 9-10:30pm every night we are on all the pages. It&#x27;s been good, a little slow at times, others toooo busy, and the new sleep schedule waking up and going to bed an hour later is wack.<\/p>\n<p>I got chased twice by dogs this week. Once on my bike at night, that was a close one. I bareky saw its face 6in away from my foot then it realized and started barking and going faster. I&#x27;ve never biked so fast. The other was super friendly, old, but huge so when it realized we were leaving it wanted to play. It would bite my hand, try jumping on me, and pull me by my arm in its mouth down the road as we were walking. More fun but gross and my hand hurt.<\/p>\n<p>Somethimg I&#x27;ve began to notice is that everywhere we go is a road trip. District Council is in Fort Myers so an hour to port charolette then carpooling another 45 min. Then we also had exchanges this week with Rio Vista spanish who live in Fort Myers. Plus 30 min to Arcadia and we go there often.<\/p>\n<p>One time while in Arcadia this week, there was a huge fire nearby so we were getting tons of ash falling on us and breathing it. Absolutely horrible. Elder Gundersen got some ash in his eye then we had to go to urgent care. All good now but rip.<\/p>\n<p>Por favor oren por nuestros amigos (please pray for our friends):<\/p>\n<p>Santos, Sharon, Nan, Edwin, Misael &amp; Josue, Sis. Cepoudy (recent convert), Clemente, Erasto &amp; Isaac, Maria &amp; José, and Lazara.<\/p>\n<p>Translating in church is still hard (speakers rarely slow down or say what scriptures/quotes they are using) any tips from my spanish speaking friends greatly appreciated. For now I just keep trying, expanding my vocabulary and grammar. Our tiwi (dumb car box that monitors our driving go ask a missionary our look up inthinc box to know more) broke this week. Hurah but then it got fixed.<\/p>\n<p>Went on exchange this week to Fort Myers and was with Elder Nelson my very first companion! It was super fun<\/p>\n<p class=\"sign\">Hasta luego, dèjenme saber qué pasao&#x27; en sus vidas! Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>#1 in diamond league on duolingo 😎<\/li>\n<li>having our district leader talk to these dumb hamster toys that repeat everything you say over the phone<\/li>\n<li>smoke<\/li>\n<li>meme #preisthoodpower<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-02-28_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-28_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-28_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-28_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_186.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_187.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🐶🐺 Dogs, late night 🌚, road trips 🚙, and smoke 🔥 Buenoooooos dìaaaas mis queridos amigos! Qué lo que? We've had an awesome week with tons of lessons and our friends r now I just keep trying, expanding my vocabulary and grammar. Our tiwi (dumb car box that monitors our driving go ask a missionary our look up inthinc box to know more) broke this week. Hurah but then it got fixed. Went on exchange this week to Fort Myers and was with Elder Nelson my very first companion! It was super fun Hasta luego, dèjenme saber qué pasao' en sus vidas! Los amo! Elder Jacobs Pictures: #1 in diamond league on duolingo 😎 having our district leader talk to these dumb hamster toys that repeat everything you say over the phone smoke meme #preisthoodpower More from this week "}, {"id": "l38", "area": 4, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">PEACE RIVER, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": ["MX"], "moments": ["Baptism", "Temple"], "extra": "Mexico", "kind": "Letter 38 · Peace River", "title": "🛤Temple trip! ⛪& Una Fiesta 🥳", "date": "2022-03-07T11:14:00", "group": "2022-03", "html": "<div class=\"body\"><p>Qué tal amigos?<\/p>\n<p>Todo bien acá in Peace River. We&#x27;ve had a pretty busy week not going to lie.<\/p>\n<p>The best thing this week was going to the temple. We went on Wednesday but almost missed it. We slept through our alarm at 5am and woke up at 6 (when we needed to leave) to the other Elders we were going to carpool with banging on the door and ringing the doorbell. The adrenaline rush was real and we somehow made it on time before everyone left in the vans.<\/p>\n<p>This week was good, nothing to exciting this week as far as new friends. We did find quite a bit but most of them through facebook and for other areas in the mission #referralgrind<\/p>\n<p>Our friend Santos is doing super bien! He has really been learning a lot and we just had an awesome lesson yesterday on the first part of the plan of salvation: focusing on his divine potential and the atonement. It all clicked last night and he truly understands his savior.<\/p>\n<p>We were able to talk with Nan again this week! She has been in Plant City a lot taking care of her mother but also talking with the missionaries there. She decided she wants to be baptized! I&#x27;m sad I&#x27;ll not be able to see it though... Oh yeah, I&#x27;m getting ET&#x27;d again (2nd time). I&#x27;m going to the St. Petersburg Zone in Largo spanish B area. White washing with Elder Schauers (he learned enough spanish on the mission to go from English to Spanish jajaja epic). I&#x27;m excited but sad to be leaving so soon. I&#x27;ve heard the branch is super awesome and the Zone is pretty cool but sad to leave Fort Myers.<\/p>\n<p>I finished the Book of Mormon this week in spanish. I love Moroni&#x27;s last words 10:32-34. It was super awesome to see at the beginning of reading it I really struggled to understand but now 9 months later I prefer to read (basically do anything) in spanish.<\/p>\n<p class=\"sign\">Los amo y espero que tengan una buena semana llena de milagros!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Temple<\/li>\n<li>turkeys<\/li>\n<li>meme I made<\/li>\n<li>RIP lasagna<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>Also for the part about a fiesta. We went to a Mexican bday party of our friends nieta (granddaughter) and there was a dunk tank and lots of other fun. Kinda strange because we&#x27;re missionaries and also there was drinking so we dipped early...<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-03-07_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-07_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-07_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-07_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-07_0_4.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-07_1_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-07_1_1.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_188.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_189.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_190.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_191.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_192.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_193.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_194.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_195.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_196.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_197.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🛤Temple trip! ⛪& Una Fiesta 🥳 Qué tal amigos? Todo bien acá in Peace River. We've had a pretty busy week not going to lie. The best thing this week was going to the temple. We went on Wednesday but almost missed it. We slept through our alarm at 5am and woke up at 6 (when we needed to leave) to the other Elders we were going to carpool with banging on the door and ringing the doorbell. The adrenaline rush was real and we somehow made it on time before everyone left in the vans. This week was good, nothing to exciting this week as far as new friends. We did find quite a bit but most of them through facebook and for other areas in the mission #referralgrind Our friend Santos is doing super bien! He has really been learning a lot and we just had an awesome lesson yesterday on the first part of the plan of salvation: focusing on his divine potential and the atonement. It all clicked last night and he truly understands his savior. We were able to talk with Nan again this week! She has been in Plant City a lot taking care of her mother but also talking with the missionaries there. She decided she wants to be baptized! I'm sad I'll not be able to see it though... Oh yeah, I'm getting ET'd again (2nd time). I'm going to the St. Petersburg Zone in Largo spanish B area. White washing with Elder Schauers (he learned enough spanish on the mission to go from English to Spanish jajaja epic). I'm excited but sad to be leaving so soon. I've heard the branch is super awesome and the Zone is pretty cool but sad to leave Fort Myers. I finished the Book of Mormon this week in spanish. I love Moroni's last words 10:32-34. It was super awesome to see at the beginning of reading it I really struggled to understand but now 9 months later I prefer to read (basically do anything) in spanish. Los amo y espero que tengan una buena semana llena de milagros! Elder Jacobs Pictures: Temple turkeys meme I made RIP lasagna Also for the part about a fiesta. We went to a Mexican bday party of our friends nieta (granddaughter) and there was a dunk tank and lots of other fun. Kinda strange because we're missionaries and also there was drinking so we dipped early... More from this week Mexico"}, {"id": "l39", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"AR\">🇦🇷 Argentina<\/span><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": ["VE", "AR"], "moments": ["Temple"], "extra": "Venezuela Argentina", "kind": "Letter 39 · Largo", "title": "🏟🌋 Larrrrgoooooo 🤩", "date": "2022-03-14T07:18:00", "group": "2022-03", "html": "<div class=\"body\"><p>Ola! Bon día!<\/p>\n<p>Todo bem? Well an emergency transfer and whitewashing has been something this week. Elder Schauers my companion is awesome but even though he is senior companion, I&#x27;m senior companion. He has only been serving in a spanish area for 5 weeks now so I&#x27;m leading in all of the spanish. Elder Schauers is from Bozeman, Montana we get along really well. This week went really well, not a ton of finding new friends to teach or a crazy amount of teaching because we have been really focusing on getting in contact with friends and the branch then creating relationships. I guess our short stop by the branch president went well because I was asked to give a talk Sunday. Also went really well.<\/p>\n<p>We have quite a few friends all pretty awesome, mostly from Venezuela, but pretty busy. #bigcitylife Here are some of their names:<\/p>\n<p>Endrina, Solmar, Zaher, Emilio, Juan, Juan Carlos, and Blanca. There are more we just haven&#x27;t had contact yet in person.<\/p>\n<p>Juan Carlos is actually new so when we met Saturday afternoon we taught the restoration. He soaked it all in, asked great questions, and told us he kinda knows our church already and from the lesson believe the same things we taught. We are excited for next week. Endrina, Solmar, and Zaher really liked the love from the branch and peace the felt at church! Juan is fairly new to religion stuff but is doing well too.<\/p>\n<p>A common theme I&#x27;ve seen here is that the Branch is really involved and there are a lot of people who just randomly come to church then we start teaching so it&#x27;s awesome. Especially our 3rd companion, the Elder Owen! He&#x27;s from Argentina, member of 30+ years, and loves to help us out. He comes over on the days he&#x27;s not in the temple and drives us around! 65 and still kicking around with the missionaries. He feels it&#x27;s his calling to do so. The branch also has realized it&#x27;s hard for people to feel loved or make big changes in their lives to live the gospel if they don&#x27;t have proper support! So there is a program to teach English, find jobs, help with immigration, food, ect.<\/p>\n<p>I&#x27;m loving this area, branch, companion, todo! The big city is very strange after leaving an area with population 5,000 maybe? 1 million here in St. Petersburg and nearby areas.<\/p>\n<p>Here is a talk I loved this week:<\/p>\n<p>&quot;Sallowed up in the will of the father&quot; Neal A Maxwell Oct. 1995<\/p>\n<p class=\"sign\">Los amo muchísimo queridos amigos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>our car PZZ A55 (interpret how you want jaja)<\/li>\n<li>the ride to new area<\/li>\n<li>dessert tacos<\/li>\n<li>Elder Owen<\/li>\n<li>some memes<\/li>\n<li>Fort Myers Zone at temple last week<\/li>\n<li>Zone challenge vid<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-03-14_0_0.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-14_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-14_0_6.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-03-14_0_7.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_198.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_199.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_200.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_201.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_202.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_203.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_204.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_205.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_206.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_207.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_208.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🏟🌋 Larrrrgoooooo 🤩 Ola! Bon día! Todo bem? Well an emergency transfer and whitewashing has been something this week. Elder Schauers my companion is awesome but even though he is senior companion, I'm senior companion. He has only been serving in a spanish area for 5 weeks now so I'm leading in all of the spanish. Elder Schauers is from Bozeman, Montana we get along really well. This week went really well, not a ton of finding new friends to teach or a crazy amount of teaching because we have been really focusing on getting in contact with friends and the branch then creating relationships. I guess our short stop by the branch president went well because I was asked to give a talk Sunday. Also went really well. We have quite a few friends all pretty awesome, mostly from Venezuela, but pretty busy. #bigcitylife Here are some of their names: Endrina, Solmar, Zaher, Emilio, Juan, Juan Carlos, and Blanca. There are more we just haven't had contact yet in person. Juan Carlos is actually new so when we met Saturday afternoon we taught the restoration. He soaked it all in, asked great questions, and told us he kinda knows our church already and from the lesson believe the same things we taught. We are excited for next week. Endrina, Solmar, and Zaher really liked the love from the branch and peace the felt at church! Juan is fairly new to religion stuff but is doing well too. A common theme I've seen here is that the Branch is really involved and there are a lot of people who just randomly come to church then we start teaching so it's awesome. Especially our 3rd companion, the Elder Owen! He's from Argentina, member of 30+ years, and loves to help us out. He comes over on the days he's not in the temple and drives us around! 65 and still kicking around with the missionaries. He feels it's his calling to do so. The branch also has realized it's hard for people to feel loved or make big changes in their lives to live the gospel if they don't have proper support! So there is a program to teach English, find jobs, help with immigration, food, ect. I'm loving this area, branch, companion, todo! The big city is very strange after leaving an area with population 5,000 maybe? 1 million here in St. Petersburg and nearby areas. Here is a talk I loved this week: \"Sallowed up in the will of the father\" Neal A Maxwell Oct. 1995 Los amo muchísimo queridos amigos! Elder Jacobs Pictures: our car PZZ A55 (interpret how you want jaja) the ride to new area dessert tacos Elder Owen some memes Fort Myers Zone at temple last week Zone challenge vid More from this week Venezuela Argentina"}, {"id": "story", "kind": "In my own words · the gift of tongues", "title": "Called to Portuguese", "date": null, "group": "2022-03", "html": "<div class=\"body\"><p>It started during my first time in Largo. My companion, Elder Schauers, and I had gotten a referral online to go visit a lady. Her name and everything looked normal. But when we got to the house and knocked on the door, she answered, and her Spanish seemed off.<\/p><p>I was confused, but Elder Schauers quickly realized it was Portuguese. He used the little bit of Portuguese he knew to talk to her, and asked if she would meet with the sister missionaries, because one of them knew a little more Portuguese than us and could possibly teach her.<\/p><p>I don&#x27;t know why, but after leaving her house I felt like I had failed, and I was kind of frustrated. I talked with Elder Schauers a bunch, and it just didn&#x27;t make sense. Why were we sent there when we couldn&#x27;t teach her? She really wanted to learn more.<\/p><p>We followed up with the sister missionaries, and they let us know that they had taught her a little lesson, but it was just difficult and they couldn&#x27;t continue. I still felt like I should keep learning more about this and think about it, as it really just resonated with my soul.<\/p><p>So later that evening, I was praying. I knelt down, thinking about all of this, and I got the impression that maybe it was time for the mission to adapt, and that I could be one of the first, and needed to learn Portuguese. And particularly, that I had been gifted with the gift of tongues, and that it was time for me to use it in a higher manner.<\/p><p>I didn&#x27;t do much the rest of the week, because I didn&#x27;t have any materials to study with. But I was able to talk with Elder Schauers and get some more info about things he had seen or heard, and the differences in the culture and the language. That was a good first start: just being curious about it and continuing to think about it, as it never really left my mind.<\/p><p>Later, we had to go back to the mission office to get some more materials, and while there, I asked if they had any materials for Portuguese. They said, &quot;Well, let me see,&quot; and went looking around. &quot;Oh, look, this just got dropped off yesterday.&quot; It was a Portuguese Preach My Gospel, and I believe there was also a Portuguese grammar book, and a Portuguese Book of Mormon. With those three materials, I knew it must be time. It surely was God&#x27;s will for me to learn Portuguese.<\/p><p>Then I had to leave Largo for a little while. There were more transfers and big changes in the mission, and I went over to Brandon with another companion, Elder Huntsman. There, I would often use my language study time to study just Portuguese instead of Spanish. It was difficult, and I felt like I wasn&#x27;t getting better. I knew a few things, and Elder Huntsman and the other missionaries I talked to there knew little bits and pieces of Portuguese, but it was hard to know if I was actually learning the language without interacting with native speakers. But I couldn&#x27;t give up. I felt like I needed to continue, so I kept studying as much as I could.<\/p><p>After Brandon, I was assigned to train a missionary in Tampa. By this point I was getting decent. I could have a very basic conversation, and when in doubt I would just use a Spanish word, because they seemed similar enough that it could work.<\/p><p>While I was in Tampa training, we ended up having a baptism right as our mission presidents changed from the Hollingsworths to the Gardiners. The Gardiners arrived and came to our baptism. Sadly, not a lot of members showed up, but after the baptism they were talking with us, and President Gardiner noticed my missionary tag was in Portuguese, because I had requested one a few weeks before.<\/p><p>I explained that I had been learning Portuguese, and that I felt it was something important for me to learn and do. He was a little confused, because he assumed I had been waiting for a visa to go serve and teach in Brazil. As we kept talking, he seemed to feel the Spirit just kind of strike him. His face suddenly changed, and he said, &quot;We&#x27;ll have to talk more later.&quot;<\/p><p>So I continued the rest of my time in Tampa with Elder Dean doing Spanish, but I was slowly finding more and more Brazilians and native Portuguese speakers, and I was able to connect with them. I even met a couple in the English ward who were from Brazil, and they gave me some good pointers and really supported me in learning the language.<\/p><p>I ended up teaching a family of two for a little while. Because of that, and talking back and forth with President Gardiner, we were able to get the ball rolling and see where this could actually go and grow for the future of the mission.<\/p><p>The following transfer, I was assigned two missionaries to train at the same time. That was fun, and we did even more Portuguese at that point. After that, I was assigned another missionary to train. This time I was with Elder Rogers. His training had just finished, but it had been very rocky: a lot of incomplete trainings, and overall quality of life. The mission is hard, but you&#x27;re supposed to have fun. So in a way, I was training both him and Elder Towne, who had just arrived. Elder Towne was originally assigned to Campinas, Brazil, and was waiting for his visa.<\/p><p>A fun fact: the Brazil Campinas Mission is the same mission my wife, Tayna, was called to serve. That mutual connection, of companions and of the mission, is kind of what got us talking later on, once I was back home.<\/p><p>Elder Towne was a great blessing to me, because he had come from the MTC speaking Portuguese. As much as I could help him learn Spanish and learn to be a good missionary, he could help teach me Portuguese, and how to connect with people in a different way, because the culture is a little different from the rest of Latin America. With his help, we really took off teaching lessons in Portuguese, and President Gardiner saw our efforts and was really excited.<\/p><p>We tried to get a Portuguese group or branch started in Tampa, because there were quite a few members in the Tampa stake as well as the Odessa stake, but it never really came to fruition. Later I was sent back to Largo, and then finally to Fort Myers for the last part of my mission.<\/p><p>Fort Myers is where it really happened. It took off. We got a group started. I helped a couple, João and Irene, get married. They were super special to me. They got baptized, and we were preparing to help their kids get there too, and to help them go to the temple for their endowment. Unfortunately, I wasn&#x27;t able to go to the temple with them, because there were some complications getting them there, and I had to go home.<\/p><p>In my last transfers in Fort Myers, my companion was Elder Kroeger. He was also assigned to Campinas, Brazil, so being with him, helping him with his Portuguese and doing missionary work together was a big help in continuing to increase my abilities. It was also cool to see that he and Elder Towne were able to meet in the Campinas mission, and that they met Tayna there too.<\/p><p>But in the end, it was amazing to see the difference that following the Spirit made: how it blessed my life on the mission, and let me connect with more people, help more people hear the gospel, and help the mission grow. The mission now has a Portuguese branch in Tampa and a Portuguese group in Fort Myers that continues to grow, and missionaries are being called from Brazil and all over to speak Portuguese and teach the gospel in that language.<\/p><p>Throughout my mission I saw the gift of tongues at work. Many times I had the opportunity to be the translator for Sunday school classes and other church meetings, translating from English to Spanish, or from Spanish to Portuguese. Each time, it increased my ability, and it showed me how God was blessing my efforts and multiplying them.<\/p><p>In the last few months of my mission, as I reflected on my goals and what I wanted to do when I got home, I felt the prompting to keep learning Portuguese.<\/p><p>So I went to BYU, where I would later graduate with a major in Information Systems and a minor in Portuguese. As I kept learning Portuguese, I followed the promptings of the Spirit. One of the promptings I had on my mission was that part of learning Portuguese was to meet my wife.<\/p><p>Tayna and I first connected on Mutual. We talked a little, but didn&#x27;t follow through very much. About a year later we reconnected, and I started dating her on February 7, 2025. That August, after completing my internship at the University of São Paulo, I went to visit her and proposed. And we would later be married.<\/p><\/div><div class=\"quotes\"><div class=\"more-h\">From my letters<\/div><ul><li><span class=\"qd\">26 June 2021<\/span>It was definitely hard at first and still can be but I can testifcé that the gift of tongues really is there for those the Lord needs to.<\/li><li><span class=\"qd\">21 March 2022<\/span>No I don&#x27;t know Portuguese but I know some random phrases.<\/li><li><span class=\"qd\">11 July 2022<\/span>I also shared a short message with him and he understood my Portuguese perfectly.<\/li><li><span class=\"qd\">8 August 2022<\/span>I&#x27;ve been praying for families and ways to practice more Portuguese and I keep receiving that help.<\/li><li><span class=\"qd\">16 January 2023<\/span>Sunday was a huge W (W= dub = win) because we had our first Sunday school class in portugese 🇧🇷 progress for sure and our friends felt so grateful for that accommodation and being able to learn a lot more.<\/li><li><span class=\"qd\">10 April 2023<\/span>I had the opportunity to confirm João in Sacrament (I was super nervous doing it in Portuguese but God definitely has been preparing me and increasing my abilities).<\/li><li><span class=\"qd\">22 May 2023<\/span>I still have a few more days, I&#x27;m excited to go to the temple with our recent converts for baptisms (in português) but if I want you to remember I have loved my mission, serving others, learning, and working hard.<\/li><\/ul><\/div>", "text": "Called to Portuguese It started during my first time in Largo. My companion, Elder Schauers, and I had gotten a referral online to go visit a lady. Her name and everything looked normal. But when we got to the house and knocked on the door, she answered, and her Spanish seemed off. I was confused, but Elder Schauers quickly realized it was Portuguese. He used the little bit of Portuguese he knew to talk ple with them, because there were some complications getting them there, and I had to go home. In my last transfers in Fort Myers, my companion was Elder Kroeger. He was also assigned to Campinas, Brazil, so being with him, helping him with his Portuguese and doing missionary work together was a big help in continuing to increase my abilities. It was also cool to see that he and Elder Towne were able to meet in the Campinas mission, and that they met Tayna there too. But in the end, it was amazing to see the difference that following the Spirit made: how it blessed my life on the mission, and let me connect with more people, help more people hear the gospel, and help the mission grow. The mission now has a Portuguese branch in Tampa and a Portuguese group in Fort Myers that continues to grow, and missionaries are being called from Brazil and all over to speak Portuguese and teach the gospel in that language. Throughout my mission I saw the gift of tongues at work. Many times I had the opportunity to be the translator for Sunday school classes and other church meetings, translating from English to Spanish, or from Spanish to Portuguese. Each time, it increased my ability, and it showed me how God was blessing my efforts and multiplying them. In the last few months of my mission, as I reflected on my goals and what I wanted to do when I got home, I felt the prompting to keep learning Portuguese. So I went to BYU, where I would later graduate with a major in Information Systems and a minor in Portuguese. As I kept learning Portuguese, I followed the promptings of the Spirit. One of the promptings I had on my mission was that part of learning Portuguese was to meet my wife. Tayna and I first connected on Mutual. We talked a little, but didn't follow through very much. About a year later we reconnected, and I started dating her on February 7, 2025. That August, after completing my internship at the University of São Paulo, I went to visit her and proposed. And we would later be married. From my letters 26 June 2021 It was definitely hard at first and still can be but I can testifcé that the gift of tongues really is there for those the Lord needs to. 21 March 2022 No I don't know Portuguese but I know some random phrases. 11 July 2022 I also shared a short message with him and he understood my Portuguese perfectly. 8 August 2022 I've been praying for families and ways to practice more Portuguese and I keep receiving that help. 16 January 2023 Sunday was a huge W (W= dub = win) because we had our first Sunday school class in portugese 🇧🇷 progress for sure and our friends felt so grateful for that accommodation and being able to learn a lot more. 10 April 2023 I had the opportunity to confirm João in Sacrament (I was super nervous doing it in Portuguese but God definitely has been preparing me and increasing my abilities). 22 May 2023 I still have a few more days, I'm excited to go to the temple with our recent converts for baptisms (in português) but if I want you to remember I have loved my mission, serving others, learning, and working hard. "}, {"id": "l40", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["MX", "BR"], "moments": [], "extra": "Mexico Brazil", "kind": "Letter 40 · Largo", "title": "🛹 finding grind but still pretty awesome 🐑", "date": "2022-03-21T10:53:00", "group": "2022-03", "html": "<div class=\"body\"><p>Bom día! No I don&#x27;t know Portuguese but I know some random phrases. Maybe in the future.<\/p>\n<p>This week has been pretty good overall but definitely a hard one. We started off the week pretty alright but then had to stop teaching most of our friends...<\/p>\n<p>The friends we did keep are doing super well, still a battle so they can make the changes needed to follow the gospel but trying.<\/p>\n<p>We&#x27;ve been learning a lot about how and when to find and be the most effective.<\/p>\n<p>We had fun this week making some videos to put on the free English class Facebook page the mission runs along with all the other shenanigans.<\/p>\n<p>Shenanigans like I&#x27;ve started to learn how to techdeck and also real skateboard but it&#x27;s a process. Our friend Juan Carlos went to English church because it was closer and doesn&#x27;t speak much English talk about faith and works. We&#x27;ll see him next week at our branch since we finally found a ride.<\/p>\n<p>Other fun stuff that happened: street contacted into a carne asada (Mexican bbq) super good, elders Quorum game night (turns out Domino&#x27;s is a really popular game for latinos. They were savage in it too), Elder Schauers is learning a ton of Spanish for only 6 weeks as a Spanish missionary (my 30 yr old son who is now learning how to speak as we like to joke since he was previously serving as English), and we got some really delicious fruit from a member (small orange balls, don&#x27;t remember what he called them).<\/p>\n<p>Buena suerte amigos, los amo y oro cada día por ustedes,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Walmart lunch<\/li>\n<li>Arepa time<\/li>\n<li>behind the scenes of our English class vids<\/li>\n<li>lluvia<\/li>\n<li>tech dech trick jejee<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-03-21_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-21_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-21_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-21_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-21_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_209.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_210.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_211.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_212.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_213.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_214.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_215.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🛹 finding grind but still pretty awesome 🐑 Bom día! No I don't know Portuguese but I know some random phrases. Maybe in the future. This week has been pretty good overall but definitely a hard one. We started off the week pretty alright but then had to stop teaching most of our friends... The friends we did keep are doing super well, still a battle so they can make the changes needed to follow the gospel but trying. We've been learning a lot about how and when to find and be the most effective. We had fun this week making some videos to put on the free English class Facebook page the mission runs along with all the other shenanigans. Shenanigans like I've started to learn how to techdeck and also real skateboard but it's a process. Our friend Juan Carlos went to English church because it was closer and doesn't speak much English talk about faith and works. We'll see him next week at our branch since we finally found a ride. Other fun stuff that happened: street contacted into a carne asada (Mexican bbq) super good, elders Quorum game night (turns out Domino's is a really popular game for latinos. They were savage in it too), Elder Schauers is learning a ton of Spanish for only 6 weeks as a Spanish missionary (my 30 yr old son who is now learning how to speak as we like to joke since he was previously serving as English), and we got some really delicious fruit from a member (small orange balls, don't remember what he called them). Buena suerte amigos, los amo y oro cada día por ustedes, Elder Jacobs Pictures: Walmart lunch Arepa time behind the scenes of our English class vids lluvia tech dech trick jejee More from this week Mexico Brazil"}, {"id": "l41", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HN\">🇭🇳 Honduras<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["HN"], "moments": ["Baptism"], "extra": "Honduras", "kind": "Letter 41 · Largo", "title": "🎪Bienvenidos a payaso-ville🤡", "date": "2022-03-28T07:15:00", "group": "2022-03", "html": "<div class=\"body\"><p>Population: us<\/p>\n<p>Buenas buenas buenas! Queridos amigos ¿que lo que?<\/p>\n<p>Context: payaso means clown and me and my companion have deemed ourselves clowns because of the absolute foolery we do<\/p>\n<p>Our week was so awesome and really should our efforts coming through cuz a lot happened!<\/p>\n<p>Family home evening with branch president and sung old McDonald; that song is wayyy longer than I remember. But all good we had a fun activity and lesson hopefully the kids understood us and weren&#x27;t too distracted. We found a family this week and then later this week put them on date for baptism! They are Catrachos (from Honduras 🇭🇳) and super open to hearing about the gospel. We are excited to see them progress more.<\/p>\n<p>Our friend Juan is doing way better this week. He has been really struggling with medical problems and needed to see a doctor but soonest opening was in May and he Struggle to get it since his English isn&#x27;t perfect. So when we went over to teach we also tried calling for him and asking about any cancelations and there was! For a week from today as I send this email. He was so grateful and definitely a miracle for all of us. He also in the lesson ended up teaching us the restoration vecause he remembered it and realized how important it is and is getting excited for general conference. We also had a 🔥 lesson with Endrina, Zaher, and Carlos (Solmars husband, she wasn&#x27;t there sadly). We had 2 members with us and basically taught eternal families, had the members blast them with testimony then dipped leaving them to want more. Endrina ended up coming to church too with her 2yr old son Lucas; he is a handful but so cute! Church was awesome this week because of a lot of things: Juan Carlos went to the English ward again because he can&#x27;t get a ride to largo but knows church is important, Rafael got baptized (friend of hermanas but also our home he loves us!), our friends Washington came to the baptism, church, and we had a lesson after church (he asked us during the baptism if he could be baptized his birthday the 22nd of April, we are soo hyped!), and other friends came to church, good day. Washington is who I really want to talk about today. He met with missionaries 40 years ago was going to get baptized but then got busy and moved. He already has so much faith and want to be baptized because he can&#x27;t miss the opportunity again. Don&#x27;t miss your opportunities because God really is trying to help and bless us but we often get distracted but lesser things or temptations so follow Washington&#x27;s example and the advice of this scripture.<\/p>\n<p>1 Nephi 10:19<\/p>\n<p>Transfer news: I&#x27;m staying but Elder Schauers is very sadly leaving for Rio Vista in Fort Myers. Mucho amor,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Amigo Washington at church<\/li>\n<li>Funny sticker we saw<\/li>\n<li>Beeeg horsey<\/li>\n<li>Mega pizza<\/li>\n<li>juice time<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-03-28_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-28_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-28_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-28_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-28_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_216.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_217.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_218.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_219.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_220.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_221.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_222.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_223.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_224.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🎪Bienvenidos a payaso-ville🤡 Population: us Buenas buenas buenas! Queridos amigos ¿que lo que? Context: payaso means clown and me and my companion have deemed ourselves clowns because of the absolute foolery we do Our week was so awesome and really should our efforts coming through cuz a lot happened! Family home evening with branch president and sung old McDonald; that song is wayyy longer than I remember. But all good we had a fun activity and lesson hopefully the kids understood us and weren't too distracted. We found a family this week and then later this week put them on date for baptism! They are Catrachos (from Honduras 🇭🇳) and super open to hearing ab
