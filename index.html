 the spirit of who to visit) biking around town with no hands is the new thing church at 11 now 🙏 made an epic pork roast (cuban rice, black beans, and peppers) 😋 I've been able to have some pretty cool and more complex conversations in Portuguese! We talked about English grammar and why Portuguese speakers can better pronounce English than Spanish Liek I already said the canceled lessons made the week slower plus the holidays but all is well. Remember God loves you! Los amo, Elder Jacobs Pictures: exchange with Elder Cook(ie) Cuba Brazil"}, {"id": "l81", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">JAN 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Letter 81 · Fort Myers", "title": "🇧🇷 Brazilian time and exchanges 🔄", "date": "2023-01-09T12:33:00", "group": "2023-01", "html": "<div class=\"body\"><p>Oi! Beleza?<\/p>\n<p>Everything beautiful?<\/p>\n<p>Our week was beautiful, we enjoyed some great weather and still some afternoon heat but that&#x27;s expected here. Our week started off super good with a super spirit lead Monday evening leading to some awesome lessons and a new Brazilian family to teach.<\/p>\n<p>Then the crazy double exchange happened.<\/p>\n<p>Yup, I was out of my area for 48 hours (ish) but Elder O&#x27;Neill did great! He taught a bunch of lessons in spanish and even some portugese solo!<\/p>\n<p>While I was chilling teaching in enlgish with Elder Anderson and then Spanish with Elder Nielson the next. They were good exchanges but super weird once back in the area and with Elder O&#x27;Neill.<\/p>\n<p>The rest of the week went pretty swell, we had some lessons set up and some fall through which has sadly become a new normal.<\/p>\n<p>We found another 2 more Brazilian families<\/p>\n<p>It definitely is still a struggle at time to speak portugese whether it be certain teaching situations and some small talk but it defense is improving and it&#x27;s shown as people have been more open to us and the spirit testifying very strongly. We also had interviews with President which was awesome. We&#x27;ll see what happens at transfers he has some ideas for changes 👀<\/p>\n<p>Anyways here&#x27;s the thought for this week:<\/p>\n<p>&quot;...how do you not know the answer to this question?” He simply shrugged his shoulders, smiled, and confidently said, “Jesus.”<\/p>\n<p>The Answer Is Jesus<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2022/10/52olsen?lang=eng<\/p>\n<p>I know that Christ is the answer even when we felt helpless and hopeless. He is always with us and always loves us no matter the circumstances, sins, or what we may think.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Elder Jacobo<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Elder Nielson (exchange fun)<\/li>\n<li>translating go brrr<\/li>\n<li>caroling from a while ago<\/li>\n<li>awesome view!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-01-09_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-09_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-09_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-09_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-09_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "🇧🇷 Brazilian time and exchanges 🔄 Oi! Beleza? Everything beautiful? Our week was beautiful, we enjoyed some great weather and still some afternoon heat but that's expected here. Our week started off super good with a super spirit lead Monday evening leading to some awesome lessons and a new Brazilian family to teach. Then the crazy double exchange happened. Yup, I was out of my area for 48 hours (ish) but Elder O'Neill did great! He taught a bunch of lessons in spanish and even some portugese solo! While I was chilling teaching in enlgish with Elder Anderson and then Spanish with Elder Nielson the next. They were good exchanges but super weird once back in the area and with Elder O'Neill. The rest of the week went pretty swell, we had some lessons set up and some fall through which has sadly become a new normal. We found another 2 more Brazilian families It definitely is still a struggle at time to speak portugese whether it be certain teaching situations and some small talk but it defense is improving and it's shown as people have been more open to us and the spirit testifying very strongly. We also had interviews with President which was awesome. We'll see what happens at transfers he has some ideas for changes 👀 Anyways here's the thought for this week: \"...how do you not know the answer to this question?” He simply shrugged his shoulders, smiled, and confidently said, “Jesus.” The Answer Is Jesus https://www.churchofjesuschrist.org/study/general-conference/2022/10/52olsen?lang=eng I know that Christ is the answer even when we felt helpless and hopeless. He is always with us and always loves us no matter the circumstances, sins, or what we may think. Los amo! Elder Jacobo Pictures: Elder Nielson (exchange fun) translating go brrr caroling from a while ago awesome view! Brazil"}, {"id": "l82", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">JAN 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><\/div>", "cultures": ["PE"], "moments": [], "extra": "Peru", "kind": "Letter 82 · Fort Myers", "title": "New growth 🌱 but the end of another transfer🤳", "date": "2023-01-16T17:46:00", "group": "2023-01", "html": "<div class=\"body\"><p>Oi! Deus lhe abençoe!<\/p>\n<p>Hey! God bless!<\/p>\n<p>It&#x27;s been another week just lovin missionary life especially here in Rio Vista. We had more exchanges this week but split apart so not as stressful. And we&#x27;ve been pretty busy like normal. Hopefully next week should calm down more and we will better manage everything.<\/p>\n<p>Our week started off with a lesson with Doina, a person we found at the begging of the transfer but we&#x27;re unable to contact. We stopped by and she has been reading and telling others that she has a church (aka ours) and she likes it despite us only having one visit a while ago. Super hype!<\/p>\n<p>Then a lesson with a recent convert and his wife which is exciting since she seems very excited and anxious to read more in the Book of Mormon (app) Available to you on your phone!<\/p>\n<p>We had english class on Wednesday after a 1 week break and a lot of people showed up then we had our 1st one in Fort Myers! Also another success and should continue to grow!<\/p>\n<p>Saturday we were truly blessed 🙌 😇 🙏 and had lunch and dinner with members. Lunch was super awesome meal with our friends Miguel, Lourdes, Wilson, and Zarela along with their kids and the Rodriguez family from the ward. We had pollada &amp; huacaina both very typical and tasty dishes from Peru 🇵🇪 see pics of the sauce &quot;huacaina&quot; and dessert &quot;combinado&quot;<\/p>\n<p>We we&#x27;re too hungry and started eating before we even thought to take a picture for the main course haha. The amount of fun memories about pero, culture, and jokes was super fun and made me feel right at home.<\/p>\n<p>Dinner was also good but no real story behind that.<\/p>\n<p>Sunday was a huge W (W= dub = win) because we had our first Sunday school class in portugese 🇧🇷 progress for sure and our friends felt so grateful for that accommodation and being able to learn a lot more.<\/p>\n<p>No spiritual thought cuz our of time so go read alma 5 it&#x27;s super epic!<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<ul class=\"bul\">\n<li>cow<\/li>\n<li>Pão de Quiejo (cheese bread)<\/li>\n<li>knives<\/li>\n<li>lunch I made 😋<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-16_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-16_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-16_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-16_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "New growth 🌱 but the end of another transfer🤳 Oi! Deus lhe abençoe! Hey! God bless! It's been another week just lovin missionary life especially here in Rio Vista. We had more exchanges this week but split apart so not as stressful. And we've been pretty busy like normal. Hopefully next week should calm down more and we will better manage everything. Our week started off with a lesson with Doina, a person we found at the begging of the transfer but we're unable to contact. We stopped by and she has been reading and telling others that she has a church (aka ours) and she likes it despite us only having one visit a while ago. Super hype! Then a lesson with a recent convert and his wife which is exciting since she seems very excited and anxious to read more in the Book of Mormon (app) Available to you on your phone! We had english class on Wednesday after a 1 week break and a lot of people showed up then we had our 1st one in Fort Myers! Also another success and should continue to grow! Saturday we were truly blessed 🙌 😇 🙏 and had lunch and dinner with members. Lunch was super awesome meal with our friends Miguel, Lourdes, Wilson, and Zarela along with their kids and the Rodriguez family from the ward. We had pollada & huacaina both very typical and tasty dishes from Peru 🇵🇪 see pics of the sauce \"huacaina\" and dessert \"combinado\" We we're too hungry and started eating before we even thought to take a picture for the main course haha. The amount of fun memories about pero, culture, and jokes was super fun and made me feel right at home. Dinner was also good but no real story behind that. Sunday was a huge W (W= dub = win) because we had our first Sunday school class in portugese 🇧🇷 progress for sure and our friends felt so grateful for that accommodation and being able to learn a lot more. No spiritual thought cuz our of time so go read alma 5 it's super epic! Los amo! Elder Jacobs cow Pão de Quiejo (cheese bread) knives lunch I made 😋 Peru"}, {"id": "l83", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">JAN 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><\/div>", "cultures": ["PE", "BR", "HT"], "moments": [], "extra": "Peru Brazil Haiti", "kind": "Letter 83 · Fort Myers", "title": "Tire 💥, new 👼, & cleaning 🧼🪣", "date": "2023-01-23T11:00:00", "group": "2023-01", "html": "<div class=\"body\"><p>Ôpa! Como foi a sua semana?<\/p>\n<p>Ours was pretty good but definitely wild, busy and different than previous transfer weeks.<\/p>\n<p>The first half of the week was with Elder O&#x27;Neill and was pretty fun.<\/p>\n<p>We found out he is leaving to Peace River and I would be with Elder Towne again but ttraining as well. While with Elder O&#x27;Neill we had some pretty good member meals (more epic Peruvian food), my tire completely blew out while 30mins away from home, and ate some of the most bomb tacos ever.<\/p>\n<p>Thursday was transfers which is always hectic but additionally we were picking up Elder Wahlberg. He&#x27;s from Bear lake, Utah and super firey for a greenie it&#x27;s awesome.<\/p>\n<p>His first lesson was not in spanish... yeah... I know kinda of mine and his assigned language but his first lesson was Portuguese but it went great.<\/p>\n<p>We&#x27;ve also been cleaning as my title says. We swapped apartments with the Creole Elders to have more space for everyone. But there was 2 huge problem. 1. Moving all of our stuff 2. The sheer amount of crap/junk/mess/dirt/grime whatever you want to call it. That apartment was not clean and hasn&#x27;t been for a long time.<\/p>\n<p>It finally is now after morning, noon, night of cleaning, organizing and 9 bags of trash.<\/p>\n<p>Anyways enjoy the fun pictures.<\/p>\n<p>Overcome the World and Find Rest<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2022/10/47nelson?lang=eng<\/p>\n<p>This talk is super awesome. We learn about the importance of small things and covenants to overcome the trial and difficulties of the world.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>papa loca<\/li>\n<li>Panamán food<\/li>\n<li>bikes with flats again and the rescue mission<\/li>\n<li>stopped by Genesis &amp; Yolennis while in Tampa for transfers<\/li>\n<li>biking day with Elder O&#x27;Neill<\/li>\n<li>Peruvian food (the one with an egg)<\/li>\n<li>bike shop sheep<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-23_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-23_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-23_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-23_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-23_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-23_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-23_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "Tire 💥, new 👼, & cleaning 🧼🪣 Ôpa! Como foi a sua semana? Ours was pretty good but definitely wild, busy and different than previous transfer weeks. The first half of the week was with Elder O'Neill and was pretty fun. We found out he is leaving to Peace River and I would be with Elder Towne again but ttraining as well. While with Elder O'Neill we had some pretty good member meals (more epic Peruvian food), my tire completely blew out while 30mins away from home, and ate some of the most bomb tacos ever. Thursday was transfers which is always hectic but additionally we were picking up Elder Wahlberg. He's from Bear lake, Utah and super firey for a greenie it's awesome. His first lesson was not in spanish... yeah... I know kinda of mine and his assigned language but his first lesson was Portuguese but it went great. We've also been cleaning as my title says. We swapped apartments with the Creole Elders to have more space for everyone. But there was 2 huge problem. 1. Moving all of our stuff 2. The sheer amount of crap/junk/mess/dirt/grime whatever you want to call it. That apartment was not clean and hasn't been for a long time. It finally is now after morning, noon, night of cleaning, organizing and 9 bags of trash. Anyways enjoy the fun pictures. Overcome the World and Find Rest https://www.churchofjesuschrist.org/study/general-conference/2022/10/47nelson?lang=eng This talk is super awesome. We learn about the importance of small things and covenants to overcome the trial and difficulties of the world. Los amo! Elder Jacobs Pictures: papa loca Panamán food bikes with flats again and the rescue mission stopped by Genesis & Yolennis while in Tampa for transfers biking day with Elder O'Neill Peruvian food (the one with an egg) bike shop sheep Peru Brazil Haiti"}, {"id": "l84", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">JAN 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Letter 84 · Fort Myers", "title": "Finding week 👊✊️👊", "date": "2023-01-30T14:53:00", "group": "2023-01", "html": "<div class=\"body\"><p>Buenas tardes!<\/p>\n<p>Yeah I&#x27;m writing this kinda late but oh well.<\/p>\n<p>This week was something else for sure. It started off fairly slow and normal with an exchange. It was super fun with Elder Gonzalez once again but this time in our area.<\/p>\n<p>A common theme this week was lessons canceling and then finding new people to teach so pretty awesome. Especially since we found 13 friends this week (mostly families!) And our district found 51!<\/p>\n<p>We gained a free lunch from the Zone Leaders too!<\/p>\n<p>We also had Specialized training, the training meeting for Trainers and their trainees, and that took all day... we woke up at 4:30 and then left at 6.but got home at 9pm. Lots of driving/sitting which is very hard to do but especially since I struggle to sit still and focus.<\/p>\n<p>Shortened version of the weekend:<\/p>\n<ul class=\"bul\">\n<li>found a ton of people (like I already said but Brazilians &amp; Spanish)<\/li>\n<li>found a former refferal who we were unable to contact since we had no address but then knocked on her door!<\/li>\n<li>got complemented on my Portuguese and ability to explain the scriptures!<\/li>\n<li>lots of lessons canceled<\/li>\n<\/ul>\n<p>Lots of on contact lessons = super powerful spirit<\/p>\n<ul class=\"bul\">\n<li>Did a baptismal interview (Paul is an absolute Chad and got baptized Sunday)<\/li>\n<li>Lots of talk about a Brazilian group 👀 still praying cuz now it&#x27;s just an idea<\/li>\n<\/ul>\n<p>I finished Alma this week in my read of O Livro de Mormon. Be righteous, don&#x27;t die in war, remember what your mama told ya!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p>Elder Jacó<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>pizza time<\/li>\n<li>suit of armor on someone&#x27;s porch?<\/li>\n<li>big chess<\/li>\n<li>bison jerky (way too soft and bad texture flavor good tho)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-30_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-30_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-30_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-30_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Finding week 👊✊️👊 Buenas tardes! Yeah I'm writing this kinda late but oh well. This week was something else for sure. It started off fairly slow and normal with an exchange. It was super fun with Elder Gonzalez once again but this time in our area. A common theme this week was lessons canceling and then finding new people to teach so pretty awesome. Especially since we found 13 friends this week (mostly families!) And our district found 51! We gained a free lunch from the Zone Leaders too! We also had Specialized training, the training meeting for Trainers and their trainees, and that took all day... we woke up at 4:30 and then left at 6.but got home at 9pm. Lots of driving/sitting which is very hard to do but especially since I struggle to sit still and focus. Shortened version of the weekend: found a ton of people (like I already said but Brazilians & Spanish) found a former refferal who we were unable to contact since we had no address but then knocked on her door! got complemented on my Portuguese and ability to explain the scriptures! lots of lessons canceled Lots of on contact lessons = super powerful spirit Did a baptismal interview (Paul is an absolute Chad and got baptized Sunday) Lots of talk about a Brazilian group 👀 still praying cuz now it's just an idea I finished Alma this week in my read of O Livro de Mormon. Be righteous, don't die in war, remember what your mama told ya! Los amo, Elder Jacó Pictures: pizza time suit of armor on someone's porch? big chess bison jerky (way too soft and bad texture flavor good tho) Brazil"}, {"id": "l85", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEB 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Letter 85 · Fort Myers", "title": "My knees want to explode! 😐💥", "date": "2023-02-06T10:40:00", "group": "2023-02", "html": "<div class=\"body\"><p>Buenos días amigos 🌅👋<\/p>\n<p>We had a pretty great week all things considered. We had some problems for sure but it turned out all right. My knees are tired from all the biking and high winds we experienced. If you stopped pedaling you would pretty much stop (honestly we should&#x27;ve walked we were going so slow). But God is good and we are given many blessings, miracles and power.<\/p>\n<p>I loved this scripture this week: Mormon 9:24<\/p>\n<p>And these signs shall follow them that believe—in my name shall they cast out devils; they shall speak with new tongues; they shall take up serpents; and if they drink any deadly thing it shall not hurt them; they shall lay hands on the sick and they shall recover;<\/p>\n<p>Surely we have seen many miracles like these in our lives, I know have on my mission.<\/p>\n<p>Other things that happened:<\/p>\n<ul class=\"bul\">\n<li>We had zone conference and it was super awesome<\/li>\n<li>super awesome lesson with a referral we&#x27;re excited to teach the rest of the family next time<\/li>\n<li>epic exchange with Elder Rupp<\/li>\n<li>taco truck round 2 😋<\/li>\n<\/ul>\n<p>We sadly had lots of lesson cancelings which was sad and apparently our friends don&#x27;t understand it makes sad cuz it keeps happening but then we just go find new friends and teach them so we stay pretty busy.<\/p>\n<p>We also went to the Brazilian bakery which was super delicious. Their treats brigadeiro are aosy straight sugar 🥴 and dense as can be definitely worth it.<\/p>\n<p>Espero que tenham uma boa semana com muitos milagrinhos!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>brigadeiros<\/li>\n<li>DQ time<\/li>\n<li>taqueria (tacos!)<\/li>\n<li>brazilian friends &amp; BBQ Churrasco (said like shoe-hoss-coo)<\/li>\n<li>brazmarket<\/li>\n<li>scripture shareable that I love!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-02-06_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-06_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_7.jpg\" alt=\"\"><\/figure><\/div>", "text": "My knees want to explode! 😐💥 Buenos días amigos 🌅👋 We had a pretty great week all things considered. We had some problems for sure but it turned out all right. My knees are tired from all the biking and high winds we experienced. If you stopped pedaling you would pretty much stop (honestly we should've walked we were going so slow). But God is good and we are given many blessings, miracles and power. I loved this scripture this week: Mormon 9:24 And these signs shall follow them that believe—in my name shall they cast out devils; they shall speak with new tongues; they shall take up serpents; and if they drink any deadly thing it shall not hurt them; they shall lay hands on the sick and they shall recover; Surely we have seen many miracles like these in our lives, I know have on my mission. Other things that happened: We had zone conference and it was super awesome super awesome lesson with a referral we're excited to teach the rest of the family next time epic exchange with Elder Rupp taco truck round 2 😋 We sadly had lots of lesson cancelings which was sad and apparently our friends don't understand it makes sad cuz it keeps happening but then we just go find new friends and teach them so we stay pretty busy. We also went to the Brazilian bakery which was super delicious. Their treats brigadeiro are aosy straight sugar 🥴 and dense as can be definitely worth it. Espero que tenham uma boa semana com muitos milagrinhos! Los amo, Elder Jacobs Pictures: brigadeiros DQ time taqueria (tacos!) brazilian friends & BBQ Churrasco (said like shoe-hoss-coo) brazmarket scripture shareable that I love! Brazil"}, {"id": "l86", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEB 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Letter 86 · Fort Myers", "title": "Me llamo poco poco 🥸", "date": "2023-02-13T07:05:00", "group": "2023-02", "html": "<div class=\"body\"><p>Olá pessoal! Tudo bem?<\/p>\n<p>Tivemos uma semana muito boa<\/p>\n<p>We enjoyed some fun stuff this week along with biking as usual but extremely windy. Not epic. 0/10 don&#x27;t recommend. Wind can really make a day suck because all of a sudden you are out of energy.<\/p>\n<p>Monday night we had a bunch of our plans get wrecked because no correct addresses and not interested people. But we did get told to not go to clubs, God loves us and later found a new family to teach. So woo hoo! Tuesday we cashed in our free district lunch from the zone leaders by going to the padaria (Brazilian bakery) and each of us ordering the X-tudo. Be far one of the best burgers I&#x27;ve ever had! (Mini fries, bacon, egg, ham, pastrami, and fresh mozzarella along with normal burger stuff)<\/p>\n<p>Our friend Juan is doing really good, we definitely will be setting a baptism date this week. Our lessons have been so spiritual and this last one he prayed with us, since he hadn&#x27;t, about the book of Mormon. He knows &quot;it&#x27;s real&quot; as he said. 🥳<\/p>\n<p>We had dinner with the Newvilles this week hence the title of the email. He knows almost no Spanish so he says his name is little by little or poco poco because he learns one word a year haha.<\/p>\n<p>Sunday was super awesome. Found another family, the blandons, dinner with the Coles, and set our friends Ilene &amp; João on date.<\/p>\n<p>We went over taught about Joseph Smith again along with some commandments. We left because of time without setting the date but we felt like we should call them when we get home and try then. We called they both answered his phone then they were super down! Stay tuned!<\/p>\n<p>Pray for those friends along with these ones:<\/p>\n<ul class=\"bul\">\n<li>Damaris &amp; Elivam (They are reading and super awesome we are excited to set a date soon)<\/li>\n<li>Marklane<\/li>\n<li>Eduardo Tuil<\/li>\n<li>John &amp; Nice<\/li>\n<li>Edmar &amp; Liz<\/li>\n<li>José Luis<\/li>\n<\/ul>\n<p>I finished the book of Mormon in Portuguese this week and one of the biggest things I learned was howamy times Christ is talked about and He or God try to bless, guide, help, and talk to us.<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p>Elder Jacobo<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>X-Tudo<\/li>\n<li>dinner with the Coles<\/li>\n<li>Harambo &amp; Elder Stevens<\/li>\n<li>cool picture spot<\/li>\n<li>valentine&#x27;s day memes<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2023-02-13_0_0.png\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-13_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_8.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_9.jpg\" alt=\"\"><\/figure><\/div>", "text": "Me llamo poco poco 🥸 Olá pessoal! Tudo bem? Tivemos uma semana muito boa We enjoyed some fun stuff this week along with biking as usual but extremely windy. Not epic. 0/10 don't recommend. Wind can really make a day suck because all of a sudden you are out of energy. Monday night we had a bunch of our plans get wrecked because no correct addresses and not interested people. But we did get told to not go to clubs, God loves us and later found a new family to teach. So woo hoo! Tuesday we cashed in our free district lunch from the zone leaders by going to the padaria (Brazilian bakery) and each of us ordering the X-tudo. Be far one of the best burgers I've ever had! (Mini fries, bacon, egg, ham, pastrami, and fresh mozzarella along with normal burger stuff) Our friend Juan is doing really good, we definitely will be setting a baptism date this week. Our lessons have been so spiritual and this last one he prayed with us, since he hadn't, about the book of Mormon. He knows \"it's real\" as he said. 🥳 We had dinner with the Newvilles this week hence the title of the email. He knows almost no Spanish so he says his name is little by little or poco poco because he learns one word a year haha. Sunday was super awesome. Found another family, the blandons, dinner with the Coles, and set our friends Ilene & João on date. We went over taught about Joseph Smith again along with some commandments. We left because of time without setting the date but we felt like we should call them when we get home and try then. We called they both answered his phone then they were super down! Stay tuned! Pray for those friends along with these ones: Damaris & Elivam (They are reading and super awesome we are excited to set a date soon) Marklane Eduardo Tuil John & Nice Edmar & Liz José Luis I finished the book of Mormon in Portuguese this week and one of the biggest things I learned was howamy times Christ is talked about and He or God try to bless, guide, help, and talk to us. Los amo, Elder Jacobo Pictures: X-Tudo dinner with the Coles Harambo & Elder Stevens cool picture spot valentine's day memes Brazil"}, {"id": "l87", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEB 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colombia<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><\/div>", "cultures": ["VE", "CO", "BR"], "moments": [], "extra": "Venezuela Colombia Brazil", "kind": "Letter 87 · Fort Myers", "title": "❤️ Feliz día de San Valentín 😋🥩", "date": "2023-02-20T13:10:00", "group": "2023-02", "html": "<div class=\"body\"><p>Olá gente! Beleza?<\/p>\n<p>We had a pretty great week all things considered. Yeah we still had trouble with lessons canceling and members being too busy to come help teach with us. I also had a lot of pain in my knee but it seems to be fading now. We did a lot of stop bys this week, visiting members and people who may have interest.<\/p>\n<p>We also had picanha this week. It&#x27;s a mega delicious cut of steak that Brazilians 🇧🇷 make only it was our Venezuelan 🇻🇪 &amp; Colombian 🇨🇴 members that made it. The first time this week was over cooked but still good. Then second was phenomenal. Go get yourself some if possible or go to Rodigios (a type of Brazilian restaurant Elder Towne told about) João &amp; Ilene are doing great, she was sick this week and lost her voice pray for them. They fed us some bomb cake &amp; mini cordon blue balls (some savory pastry) super awesome<\/p>\n<p>Damaris &amp; Elivam are also doing great, still looking for an answer from the spirit about the book of Mormon. We had a mission wide meeting for Spanish. I was conducting in Spanish despite almost everything else being in English... Still pretty good tho 🇺🇲<\/p>\n<p>I almost died this week. I got fed a really tasty candy but it was made from cashews... Luckily benadryl is goated 🐐 I&#x27;ve started watching more book of Mormon videos and really love them. Please go watch and start the book of Mormon again!<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Manatee park (sadly didn&#x27;t see anything)<\/li>\n<li>big tree (Edison &amp; Ford Winter estates)<\/li>\n<li>cashew Treat<\/li>\n<li>Dinner with the Agueros<\/li>\n<li>Zone conference<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-02-20_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-20_0_6.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_407.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_408.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "❤️ Feliz día de San Valentín 😋🥩 Olá gente! Beleza? We had a pretty great week all things considered. Yeah we still had trouble with lessons canceling and members being too busy to come help teach with us. I also had a lot of pain in my knee but it seems to be fading now. We did a lot of stop bys this week, visiting members and people who may have interest. We also had picanha this week. It's a mega delicious cut of steak that Brazilians 🇧🇷 make only it was our Venezuelan 🇻🇪 & Colombian 🇨🇴 members that made it. The first time this week was over cooked but still good. Then second was phenomenal. Go get yourself some if possible or go to Rodigios (a type of Brazilian restaurant Elder Towne told about) João & Ilene are doing great, she was sick this week and lost her voice pray for them. They fed us some bomb cake & mini cordon blue balls (some savory pastry) super awesome Damaris & Elivam are also doing great, still looking for an answer from the spirit about the book of Mormon. We had a mission wide meeting for Spanish. I was conducting in Spanish despite almost everything else being in English... Still pretty good tho 🇺🇲 I almost died this week. I got fed a really tasty candy but it was made from cashews... Luckily benadryl is goated 🐐 I've started watching more book of Mormon videos and really love them. Please go watch and start the book of Mormon again! Los amo! Elder Jacobs Pictures: Manatee park (sadly didn't see anything) big tree (Edison & Ford Winter estates) cashew Treat Dinner with the Agueros Zone conference More from this week Venezuela Colombia Brazil"}, {"id": "l88", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEB 2023<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Letter 88 · Fort Myers", "title": "👾Ditching my area 🦅", "date": "2023-02-27T11:52:00", "group": "2023-02", "html": "<div class=\"body\"><p>Opa! blz? Eu tô de bola<\/p>\n<p>Hey! Everything beautiful? I&#x27;m just chilling<\/p>\n<p>This week was great! (No I didn&#x27;t actually ditch my area but I did miss a hefty amount of time in it). Wednesday was MLC (Mission leadership council) I left at 5am then got back at 6pm. The following day we drove to Tampa and also got back at 6pm. We traded in our old car and Elder Towne for a brand new Nissan Rouge.<\/p>\n<p>*Not really, we dropped him off to be close to the airport. He flew out this morning 🥲<\/p>\n<p>The rest of the week was pretty great; We were challenged to Facebook Boot Camp. Aka use facebook every day and learn new ways to use it and find lots of new friends. It actually was pretty successful and fun. We finished the 7 day challenge and earned a sticker! To be handed out later this week.<\/p>\n<p>We did some service this week! A very rare occurrence for me since most Hispanics don&#x27;t like being served. Something I learned this week was how much I love our friends and being with them. D&amp;C 84:77 says... And again I say unto you, my friends, for from henceforth I shall call you friends, it is expedient that I give unto you this commandment, that ye become even as my friends in days when I was with them, traveling to preach the gospel in my power;<\/p>\n<p>You are my friends and I care for each of you. Christ invites us to be His friends and deepen our discipleship. I love the friends I am teaching now and felt sad the days I had less time to be with them. Trust in your Savior and in me as your friends!<\/p>\n<p class=\"sign\">Los amo mucho!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Couscous &amp; cinnamon sugar<\/li>\n<li>Elder argyle &amp; I at MLC<\/li>\n<li>oh yup!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-02-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-27_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "👾Ditching my area 🦅 Opa! blz? Eu tô de bola Hey! Everything beautiful? I'm just chilling This week was great! (No I didn't actually ditch my area but I did miss a hefty amount of time in it). Wednesday was MLC (Mission leadership council) I left at 5am then got back at 6pm. The following day we drove to Tampa and also got back at 6pm. We traded in our old car and Elder Towne for a brand new Nissan Rouge. *Not really, we dropped him off to be close to the airport. He flew out this morning 🥲 The rest of the week was pretty great; We were challenged to Facebook Boot Camp. Aka use facebook every day and learn new ways to use it and find lots of new friends. It actually was pretty successful and fun. We finished the 7 day challenge and earned a sticker! To be handed out later this week. We did some service this week! A very rare occurrence for me since most Hispanics don't like being served. Something I learned this week was how much I love our friends and being with them. D&C 84:77 says... And again I say unto you, my friends, for from henceforth I shall call you friends, it is expedient that I give unto you this commandment, that ye become even as my friends in days when I was with them, traveling to preach the gospel in my power; You are my friends and I care for each of you. Christ invites us to be His friends and deepen our discipleship. I love the friends I am teaching now and felt sad the days I had less time to be with them. Trust in your Savior and in me as your friends! Los amo mucho! Elder Jacobs Pictures: Couscous & cinnamon sugar Elder argyle & I at MLC oh yup! "}, {"id": "l89", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Letter 89 · Fort Myers", "title": "Another one", "date": "2023-03-06T06:29:00", "group": "2023-03", "html": "<div class=\"body\"><p>Ôpa 👋 como vocês vão?<\/p>\n<p>This week was pretty good. We had transfers I said goodbye to Elder Wahlberg. He&#x27;s now in Tampa one of my favorite past areas, he&#x27;ll do great and be welcomed by everyone even my recent converts there.<\/p>\n<p>I picked up Elder Kroeger! He&#x27;s from Clinton, Utah and grew up speaking Spanish and english. So we jumped right into the action. He&#x27;s learning Portuguese because he&#x27;s also going to Campinas Brazil. Hopefully he doesn&#x27;t leave too soon. (Btw he&#x27;s Trainee #10 hahaa)<\/p>\n<p>The week started off somewhat slow but then picked up. We were able to visit Juan this week and talked a lot about God&#x27;s plan and commandments. We set a baptismal date for March 21st! He still needs to come to church 2x but his family still feels the loss they just experienced. Please pray for him and his family (the Gómez) We found a few new friends this week they&#x27;re doing well but please pray these friends:<\/p>\n<ul class=\"bul\">\n<li>João &amp; Ilene<\/li>\n<li>Damaris &amp; Elivam (they&#x27;re sick again)<\/li>\n<li>Jose Miguel &amp; Kelly<\/li>\n<li>Edmar<\/li>\n<\/ul>\n<p>We had an awesome lesson with the Aguirre family, we&#x27;re helping to prepare Jesus for baptism. He&#x27;s a good kid and were excited to keep helping.<\/p>\n<p>No big stories this week or pictures (I forgot to get more) but hope yours was good.<\/p>\n<p>I&#x27;ve been learning a lot this week in my studies about Christlike attributes and goals/plans. Someone who plans well keeps their goals in mind, constantly reevaluate to find what works best and is prayerful. Good goals are inspired, achievable, and high enough to push us. Christ (&amp; how he acted) shows us the importance of doing those things and always showing love.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Ceviche (we made)<\/li>\n<li>arepas<\/li>\n<li>someone was not happy with our car<\/li>\n<li>meeting Elder Kroeger<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-03-06_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-06_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-06_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Another one Ôpa 👋 como vocês vão? This week was pretty good. We had transfers I said goodbye to Elder Wahlberg. He's now in Tampa one of my favorite past areas, he'll do great and be welcomed by everyone even my recent converts there. I picked up Elder Kroeger! He's from Clinton, Utah and grew up speaking Spanish and english. So we jumped right into the action. He's learning Portuguese because he's also going to Campinas Brazil. Hopefully he doesn't leave too soon. (Btw he's Trainee #10 hahaa) The week started off somewhat slow but then picked up. We were able to visit Juan this week and talked a lot about God's plan and commandments. We set a baptismal date for March 21st! He still needs to come to church 2x but his family still feels the loss they just experienced. Please pray for him and his family (the Gómez) We found a few new friends this week they're doing well but please pray these friends: João & Ilene Damaris & Elivam (they're sick again) Jose Miguel & Kelly Edmar We had an awesome lesson with the Aguirre family, we're helping to prepare Jesus for baptism. He's a good kid and were excited to keep helping. No big stories this week or pictures (I forgot to get more) but hope yours was good. I've been learning a lot this week in my studies about Christlike attributes and goals/plans. Someone who plans well keeps their goals in mind, constantly reevaluate to find what works best and is prayerful. Good goals are inspired, achievable, and high enough to push us. Christ (& how he acted) shows us the importance of doing those things and always showing love. Los amo! Elder Jacobs Pictures: Ceviche (we made) arepas someone was not happy with our car meeting Elder Kroeger Brazil"}, {"id": "l90", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"SV\">🇸🇻 El Salvador<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">🌀 Hurricane<\/span><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": ["SV"], "moments": ["Baptism", "Hurricane", "Temple"], "extra": "El Salvador", "kind": "Letter 90 · Fort Myers", "title": "Another Mountain 🏔️ to climb", "date": "2023-03-13T09:16:00", "group": "2023-03", "html": "<div class=\"body\"><p>Ôpa Hola hey bonswa yabbadabbadoo<\/p>\n<p>How are you?<\/p>\n<p>Things are going pretty Good! This week a bunch happened so it&#x27;ll beore or less day by day. Bora lá! This week was the start of another finding challenge leaving the losing district to buzz cut their district leader. More on that later. We found a couple from El Salvador but by the end of the week the realized they were too busy and we are no longer teaching them currently.<\/p>\n<p>Tuesday was almost completely open schedule so we went hard on finding and trying to teach our friends. We found a new friend, Tiago, who read the bible then prayed to learn more and we subsequently knocked his door! He was so excited to see us and we had a great talk about repentance and God&#x27;s love &amp; grace. We also taught Damaris &amp; her family then Edmar &amp; his both fire lessons.<\/p>\n<p>Loreina is 2 and Damaris&#x27; daughter. She super cute and kinda crazy but this last lesson was something else. She saw Elder Kroeger and immediately had a crush on him! She just talked and talked to him and even hugged him. The funniest part is that just got breast milk on him! (Latin america culture is baby = hungry -&gt; breastfeed now and Loreina is breastfeeding got hungry at the end and well... you can imagine).<\/p>\n<p>Wednesday we had some awesome lessons. We met with Juan and taught about church and the steps to become baptized and continue in the path to God. We got some more info on marriage license to prepare João and Ilene and met a sweet lady named Tally. We also went to Hermana Leedman&#x27;s and helped her save some stuff from her house because during the hurricane a giant tree smash it right down the middle and they have to rebuild the whole thing. So we moved some things and took down her garage for her. Pretty fun I loved helping her and doing grown up legos basically kkkkkkk Thursday we had specailized training in Tampa. The meeting and training for new trainees and their trainers. we were gone from 6am to 9pm just like last time.<\/p>\n<p>Friday was a little slower with lessons canceling but we found some more friends, taught the Aguirre family to prepare Jesus for baptism (that went super great), and we got to help in english class and set chairs up for Stake Conference. The majority of our weekend after that was biking to appointments and knocking doors. We had some lessons cancel but quite a few lessons on doorsteps and even got let inside. One of our new friends was a referral and so we called him and had a phone lesson. He then proceeded to sing &quot;Fiesta para Jesus&quot; (btw he also called this morning to talk and sang &quot;Jesus el camino&quot; another banger of a pentecostal song) and he wants to go preaching with us kkkkkkkk. The &quot;mountain to climb&quot; from my email title is because of Church attendance. We had stake conference Saturday and Sunday night but only 1 friend and 1 recent convert came. Possibly due to daylight savings, church at 9 instead of 11, or they just decided not to. But thats our next goal to get more people at church and to feel the spirit and make friends there. Pray for that!<\/p>\n<p>My thought for this week comes from Stake conference:<\/p>\n<p>There was a lot of talk about missionary work and being &quot;the saviors of men&quot; along with following even the smallest prompting. What really touched me this week was about our spirituality or in my case &quot;spiritual high&quot;. Many people know the missionaries have such a strong spirit and its due to their focus on others like Christ did and their good habits. While I will be coming to the end my mission I should really strive to continue many of the same things at home. The importance of CPR-T (church, prayer, reading scriptures and temple attendance) are so important to maintaine our connection with God and his guidance. There are many things in life: good, better and the best. The best are the things that have eternal value or are of most importance. I&#x27;d invite y&#x27;all to go pray and seek guidance on a thing or 2 to add/improve on to maintain and grow your spirituality.<\/p>\n<p class=\"sign\">los amo mucho!<\/p>\n<p>Elder Jacobo<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>stake conference invites... We made a ton!<\/li>\n<li>service<\/li>\n<li>when I picked up Elder Kroeger<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-03-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-13_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">More from this week<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_409.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_410.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_411.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_412.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_413.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Another Mountain 🏔️ to climb Ôpa Hola hey bonswa yabbadabbadoo How are you? Things are going pretty Good! This week a bunch happened so it'll beore or less day by day. Bora lá! This week was the start of another finding challenge leaving the losing district to buzz cut their district leader. More on that later. We found a couple from El Salvador but by the end of the week the realized they were too busy and we are no longer teaching them currently. Tuesday was almost completely open schedule so we went hard on finding and trying to teach our friends. We found a new friend, Tiago, who read the bible then prayed to learn more and we subsequently knocked his door! He was so excited to see us and we had a great talk about repentance and God's love & grace. We also taught Damaris & her family then Edmar & his both fire lessons. Loreina is 2 and Damaris' daughter. She super cute and kinda crazy but this last lesson was something else. She saw Elder Kroeger and immediately had a crush on him! She just talked and talked to him and even hugged him. The funniest part is that just got breast milk on him! (Latin america culture is baby = hungry -> breastfeed now and Loreina is breastfeeding got hungry at the end and well... you can imagine). Wednesday we had some awesome lessons. We met with Juan and taught about church and the steps to become baptized and continue in the path to God. We got some more info on marriage license to prepare João and Ilene and met a sweet lady named Tally. We also went to Hermana Leedman's and helped her save some stuff from her house because during the hurricane a giant tree smash it right down the middle and they have to rebuild the whole thing. So we moved some things and took down her garage for her. Pretty fun I loved helping her and doing grown up legos basically kkkkkkk Thursday we had specailized training in Tampa. The meeting and training for new trainees and their trainers. we were gone from 6am to 9pm just like last time. Friday was a little slower with lessons canceling but we found some more friends, taught the Aguirre family to prepare Jesus for baptism (that went super great), and we got to help in english class and set chairs up for Stake Conference. The majority of our weekend after that was biking to appointments and knocking doors. We had some lessons cancel but quite a few lessons on doorsteps and even got let inside. One of our new friends was a referral and so we called him and had a phone lesson. He then proceeded to sing \"Fiesta para Jesus\" (btw he also called this morning to talk and sang \"Jesus el camino\" another banger of a pentecostal song) and he wants to go preaching with us kkkkkkkk. The \"mountain to climb\" from my email title is because of Church attendance. We had stake conference Saturday and Sunday night but only 1 friend and 1 recent convert came. Possibly due to daylight savings, church at 9 instead of 11, or they just decided not to. But thats our next goal to get more people at church and to feel the spirit and make friends there. Pray for that! My thought for this week comes from Stake conference: There was a lot of talk about missionary work and being \"the saviors of men\" along with following even the smallest prompting. What really touched me this week was about our spirituality or in my case \"spiritual high\". Many people know the missionaries have such a strong spirit and its due to their focus on others like Christ did and their good habits. While I will be coming to the end my mission I should really strive to continue many of the same things at home. The importance of CPR-T (church, prayer, reading scriptures and temple attendance) are so important to maintaine our connection with God and his guidance. There are many things in life: good, better and the best. The best are the things that have eternal value or are of most importance. I'd invite y'all to go pray and seek guidance on a thing or 2 to add/improve on to maintain and grow your spirituality. los amo mucho! Elder Jacobo Pictures: stake conference invites... We made a ton! service when I picked up Elder Kroeger More from this week El Salvador"}, {"id": "l91", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"DO\">🇩🇴 Dominican Republic<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><\/div>", "cultures": ["MX", "DO", "BR"], "moments": ["Baptism"], "extra": "Mexico Dominican Republic Brazil", "kind": "Letter 91 · Fort Myers", "title": "A murder mystery?! 🔪🩸☠️", "date": "2023-03-20T10:32:00", "group": "2023-03", "html": "<div class=\"body\"><p>Olá pessoal!<\/p>\n<p>We had a pretty good week, packed with lessons. Vamos lá!<\/p>\n<p>We started off the week with a bunch of finding and visiting friends. João &amp; Irene finished their marriage course and we set their marriage appointment for Friday morning. We are super excited and so are the ward members especially those who have been routing for them and to create a Portuguese group. President Gardner is also very excited. They&#x27;ll be baptized the 25th (Saturday) at 6pm, let me know if you want a link!<\/p>\n<p>We have a few new friends but they have not been keeping commitments like reading the Book of Mormon or coming to church. Please pray for them to feel to spirit and understand it&#x27;s importance.<\/p>\n<p>Our friend Daniel keeps singing for us or sending us songs. I&#x27;m learning a lot about Mexican religious songs. A big highlight this week was finding another part member family. We got a referral from the other Elders since they were tracting. Debora is from Spain but her husband is from the Dominican republic and has been a member his whole life. Not very active but he&#x27;s know that other churches just aren&#x27;t the same. We taught them both and are going back this week. I&#x27;m super excited for the future and they want their daughter taught as well.<\/p>\n<p>Life&#x27;s been good, so just pray for friends like I already said. And gift of tongues for us.<\/p>\n<p>As for the title, we woke up Sunday morning to our car and everything outside police taped off. There was a dead body and random truck outside right in front of our window. We live in the 2nd story and were able to watch the investigation. We didn&#x27;t see the body (it was covered) and we got to church on time but it was interesting.<\/p>\n<p>I&#x27;m adding a voice recording of the Spiritual thought this week.<\/p>\n<p>Moroni 10:32<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>it rained and was freezing!<\/li>\n<li>cleaning the baptismal font since the Hermanas forgot to before their baptism<\/li>\n<li>pictures of the investigation<\/li>\n<li>funny faces video call<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-03-20_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-20_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "A murder mystery?! 🔪🩸☠️ Olá pessoal! We had a pretty good week, packed with lessons. Vamos lá! We started off the week with a bunch of finding and visiting friends. João & Irene finished their marriage course and we set their marriage appointment for Friday morning. We are super excited and so are the ward members especially those who have been routing for them and to create a Portuguese group. President Gardner is also very excited. They'll be baptized the 25th (Saturday) at 6pm, let me know if you want a link! We have a few new friends but they have not been keeping commitments like reading the Book of Mormon or coming to church. Please pray for them to feel to spirit and understand it's importance. Our friend Daniel keeps singing for us or sending us songs. I'm learning a lot about Mexican religious songs. A big highlight this week was finding another part member family. We got a referral from the other Elders since they were tracting. Debora is from Spain but her husband is from the Dominican republic and has been a member his whole life. Not very active but he's know that other churches just aren't the same. We taught them both and are going back this week. I'm super excited for the future and they want their daughter taught as well. Life's been good, so just pray for friends like I already said. And gift of tongues for us. As for the title, we woke up Sunday morning to our car and everything outside police taped off. There was a dead body and random truck outside right in front of our window. We live in the 2nd story and were able to watch the investigation. We didn't see the body (it was covered) and we got to church on time but it was interesting. I'm adding a voice recording of the Spiritual thought this week. Moroni 10:32 Los amo! Elder Jacobs Pictures: it rained and was freezing! cleaning the baptismal font since the Hermanas forgot to before their baptism pictures of the investigation funny faces video call Mexico Dominican Republic Brazil"}, {"id": "l92", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": ["BR", "HT"], "moments": ["Baptism", "Temple"], "extra": "Brazil Haiti", "kind": "Letter 92 · Fort Myers", "title": "Tha bap, the braz, and the sickly 🤠🤧", "date": "2023-03-27T06:55:00", "group": "2023-03", "html": "<div class=\"body\"><p>AaiWawA wA Wa WAaaaa...<\/p>\n<p>(The good, the bad, and the ugly starts playing)<\/p>\n<p>Oi Cara! Tudo bem e aí?<\/p>\n<p>This week was something else for sure, but good.<\/p>\n<p>Not much from Monday night but Tuesday we had a three way exchange with the zone leaders which meant that Elder Gonzalez and I were put together just random regular missionaries ready to teach and clown around. I practiced creole with him that way in the afternoon I could go crazy. I was able to do a prayer or 2 and testify. The hardest part was sitting still with almost nothing to do. I some how understood a ton of what people said but sat there like deer in the headlights with no idea how to respond. But it was still fun, I enjoy being with we Elder Gonzalez. Wednesday and Thursday went pretty good just running around to some lessons and finding with our extra time. Elder Bedingfield came with me Thursday for another exchange.<\/p>\n<p>Friday started super great. João &amp; Irene got married! See pics below 👇<\/p>\n<p>Then we went about our day about the same but my body started hurting and I had a major headache. It got worst later on in the day so we talked to Sister Meese the Health secretary and stopped by Walgreens before going home. I got some virus that is messing with throat, ears, etc everything that&#x27;s connected.<\/p>\n<p>Saturday I pushed through despite very sick and not feeling great to give my talk and get the baptism to happen. But Sunday afternoon it was bad and we went to an urgent care where they gave me some stronger medicine and more instructions. They also made sure it was not COVID.<\/p>\n<p>Today I am feeling better but they said around 5 days I should be back to normal just in time for the Temple trip Thursday. No spiritual thought this week, I&#x27;m sick. But I do invite you to go and write done questions for general conference then while listening you will get answers.<\/p>\n<p>Elder Kroeger&#x27;s visa arrived and he is leaving in 2 weeks. There is an ET (emergency transfer) today because we are receiving 2 new areas from the Orlando mission but no missionaries. We will be in a trio with Elder Wiberg and now covering Lehigh acres as well.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>João &amp; Irene wedding pics @ court house<\/li>\n<li>bap pics (1st Brazilian baptism here!)<\/li>\n<li>sick me<\/li>\n<li>changing a flat<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-03-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-27_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "Tha bap, the braz, and the sickly 🤠🤧 AaiWawA wA Wa WAaaaa... (The good, the bad, and the ugly starts playing) Oi Cara! Tudo bem e aí? This week was something else for sure, but good. Not much from Monday night but Tuesday we had a three way exchange with the zone leaders which meant that Elder Gonzalez and I were put together just random regular missionaries ready to teach and clown around. I practiced creole with him that way in the afternoon I could go crazy. I was able to do a prayer or 2 and testify. The hardest part was sitting still with almost nothing to do. I some how understood a ton of what people said but sat there like deer in the headlights with no idea how to respond. But it was still fun, I enjoy being with we Elder Gonzalez. Wednesday and Thursday went pretty good just running around to some lessons and finding with our extra time. Elder Bedingfield came with me Thursday for another exchange. Friday started super great. João & Irene got married! See pics below 👇 Then we went about our day about the same but my body started hurting and I had a major headache. It got worst later on in the day so we talked to Sister Meese the Health secretary and stopped by Walgreens before going home. I got some virus that is messing with throat, ears, etc everything that's connected. Saturday I pushed through despite very sick and not feeling great to give my talk and get the baptism to happen. But Sunday afternoon it was bad and we went to an urgent care where they gave me some stronger medicine and more instructions. They also made sure it was not COVID. Today I am feeling better but they said around 5 days I should be back to normal just in time for the Temple trip Thursday. No spiritual thought this week, I'm sick. But I do invite you to go and write done questions for general conference then while listening you will get answers. Elder Kroeger's visa arrived and he is leaving in 2 weeks. There is an ET (emergency transfer) today because we are receiving 2 new areas from the Orlando mission but no missionaries. We will be in a trio with Elder Wiberg and now covering Lehigh acres as well. Los amo! Elder Jacobs Pictures: João & Irene wedding pics @ court house bap pics (1st Brazilian baptism here!) sick me changing a flat Brazil Haiti"}, {"id": "l93", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">APR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": [], "moments": ["Temple"], "extra": "", "kind": "Letter 93 · Fort Myers", "title": "One of the slowest weeks", "date": "2023-04-03T06:51:00", "group": "2023-04", "html": "<div class=\"body\"><p>Oi galera!<\/p>\n<p>How was conference? I loved it.<\/p>\n<p>Sadly I don&#x27;t have anything to really report from this week.<\/p>\n<p>We became a trio on Monday and have been just absolutely clowning and having lots of fun.<\/p>\n<p>We went to the temple Thursday and because it&#x27;s so far we drove to Tampa Wednesday and spent the evening there. I was able to visit the Franco&#x27;s my Recent convert family. We talked about patriarchal blessings and they fed us some amazing empenadas.<\/p>\n<p>Then obviously Saturday and Sunday was General conference.<\/p>\n<p>I was spiritually fed this week for sure but the lack of being able to knock doors, teach and see our friends was definitely hard.<\/p>\n<p>I loved conference and one of the big themes of We believe in Christ and just need to rely on Him. Easter is the celebration of his Atonement: the suffering, death, and resurrection of our Savior that heals and enables us to become better. Grace is what bridges the gap between our faults and efforts to the requirements of God and his kingdom. Please remember the He is there, He can heal you, and He can make things right.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Elder Jacobo<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>temple<\/li>\n<li>conference with the district<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-04-03_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-03_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-03_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-03_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "One of the slowest weeks Oi galera! How was conference? I loved it. Sadly I don't have anything to really report from this week. We became a trio on Monday and have been just absolutely clowning and having lots of fun. We went to the temple Thursday and because it's so far we drove to Tampa Wednesday and spent the evening there. I was able to visit the Franco's my Recent convert family. We talked about patriarchal blessings and they fed us some amazing empenadas. Then obviously Saturday and Sunday was General conference. I was spiritually fed this week for sure but the lack of being able to knock doors, teach and see our friends was definitely hard. I loved conference and one of the big themes of We believe in Christ and just need to rely on Him. Easter is the celebration of his Atonement: the suffering, death, and resurrection of our Savior that heals and enables us to become better. Grace is what bridges the gap between our faults and efforts to the requirements of God and his kingdom. Please remember the He is there, He can heal you, and He can make things right. Los amo! Elder Jacobo Pictures: temple conference with the district "}, {"id": "l94", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">APR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": ["BR"], "moments": ["Temple"], "extra": "Brazil", "kind": "Letter 94 · Fort Myers", "title": "🥚 Páscoa 🐰", "date": "2023-04-10T06:46:00", "group": "2023-04", "html": "<div class=\"body\"><p>Que onda pandilla?<\/p>\n<p>This week was good, still not very fast or super exciting but we had some good lessons and other stuff happen. Not too much happened the first few days. We had some lessons scheduled about half canceled but the others happended. Then we spent time passing by other friends and people to see if they are interested in meeting and when would be best.<\/p>\n<p>Wednesday we had a bunch of lessons because we spent a lot of time tracting. Hopefully these new friends read and progress. Pray for us to find some more families to teach. We had multiple tell us to stop coming by. We spent a day in Lehigh since we are double covering currently.<\/p>\n<p>I taught an entire lesson in Portuguese by myself since the guy just wanted to prove his point about he being his own prophet (#ModernDayRevelationisSick&amp;Super important)<\/p>\n<p>Saturday We met halfway in Sarasota with the APs to drop off Elder Kroeger. #FlyHighSweetChildofMine Brasil is getting the one of the best 🇧🇷<\/p>\n<p>Easter Sunday was pretty awesome. I had the opportunity to confirm João in Sacrament (I was super nervous doing it in Portuguese but God definitely has been preparing me and increasing my abilities). And the focus on Christ was awesome, I later was able to help some friends understand that and his Atonement.<\/p>\n<p>Understanding His grace and Atonement is probably one of the biggest things that I&#x27;ve learned and will bless me forever. His grace is the strength and power to overcome our weaknesses and His Atonement is the infinite sacrifice that gives us grace, that frees us from Death, and can free us from sin if we repent. Repentance is a true change of heart, changing our desires for God&#x27;s and is a ongoing process just like the restoration of the gospel of Jesus Christ. Please take some time to ponder your testimony ok these things, read the Gospel topic about it, or even share your testimony with someone else.<\/p>\n<p class=\"sign\">Los amo muchísimo! Feliz páscoa!<\/p>\n<p>Elder Jacó<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>Dinner with the Coles<\/li>\n<li>Saying bye to Elder Kroeger<\/li>\n<li>Gecko in da pocket<\/li>\n<li>Some cool shots in Lehigh<\/li>\n<li>Our Zone &amp; St. Pete at the Temple<\/li>\n<li>Mini Golf<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-04-10_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_8.jpg\" alt=\"\"><\/figure><\/div>", "text": "🥚 Páscoa 🐰 Que onda pandilla? This week was good, still not very fast or super exciting but we had some good lessons and other stuff happen. Not too much happened the first few days. We had some lessons scheduled about half canceled but the others happended. Then we spent time passing by other friends and people to see if they are interested in meeting and when would be best. Wednesday we had a bunch of lessons because we spent a lot of time tracting. Hopefully these new friends read and progress. Pray for us to find some more families to teach. We had multiple tell us to stop coming by. We spent a day in Lehigh since we are double covering currently. I taught an entire lesson in Portuguese by myself since the guy just wanted to prove his point about he being his own prophet (#ModernDayRevelationisSick&Super important) Saturday We met halfway in Sarasota with the APs to drop off Elder Kroeger. #FlyHighSweetChildofMine Brasil is getting the one of the best 🇧🇷 Easter Sunday was pretty awesome. I had the opportunity to confirm João in Sacrament (I was super nervous doing it in Portuguese but God definitely has been preparing me and increasing my abilities). And the focus on Christ was awesome, I later was able to help some friends understand that and his Atonement. Understanding His grace and Atonement is probably one of the biggest things that I've learned and will bless me forever. His grace is the strength and power to overcome our weaknesses and His Atonement is the infinite sacrifice that gives us grace, that frees us from Death, and can free us from sin if we repent. Repentance is a true change of heart, changing our desires for God's and is a ongoing process just like the restoration of the gospel of Jesus Christ. Please take some time to ponder your testimony ok these things, read the Gospel topic about it, or even share your testimony with someone else. Los amo muchísimo! Feliz páscoa! Elder Jacó Pictures: Dinner with the Coles Saying bye to Elder Kroeger Gecko in da pocket Some cool shots in Lehigh Our Zone & St. Pete at the Temple Mini Golf Brazil"}, {"id": "l95", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">APR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 Mexico<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brazil<\/span><span class=\"stamp m\">🌊 Baptism<\/span><span class=\"stamp m\">⛪ Temple<\/span><\/div>", "cultures": ["MX", "BR"], "moments": ["Baptism", "Temple"], "extra": "Mexico Brazil", "kind": "Letter 95 · Fort Myers", "title": "No soy María pero tengo Jesus adentro", "date": "2023-04-17T08:10:00", "group": "2023-04", "html": "<div class=\"body\"><p>Hola hola, tamo&#x27; bien y espero que e&#x27; lo mismo pa&#x27; ustede<\/p>\n<p>We&#x27;ve been listening to a bunch of Christian regaeton hence the funny title and Spanish.<\/p>\n<p>It says: I&#x27;m not Mary but I have Christ inside<\/p>\n<p>Well this week basically has two parts before Thursday and after Thursday because we had transfers. I stayed and received Elder Franson another one of past trainees and it&#x27;s super awesome being back. This time around though I&#x27;m teaching him Portuguese so he can take over the area at the end of these 6 weeks.<\/p>\n<p>We&#x27;ve had a few lessons this week but quite a bit of the week has been finding. Nothing too crazy recently but we do have some friends that are looking pretty good otherwise the rest we&#x27;re probably going to stop teaching for now. We went to the Mexican flea market during lunchtime Saturday it was super lit. I got some little country souvenirs, probably will go back for a few others. Elder Franson got a wicked deal on a Columbian soccer jersey, $5! Check the pictures below<\/p>\n<p>We gave talks Sunday on missionary work and it was funny because we and the bishopric didn&#x27;t think we could talk that long so they had the Hermanas come and bear their testimonies but we talked a lot and it was good so in the end the High councilor was cut a lot of his time... Oh well<\/p>\n<p>One last thing before my spiritual thought this week; I need all of you to please pray for Irene (the one that was just baptized). She&#x27;s so awesome and is already trying to get her recommend to go to the temple but she got some hard news. She has some pretty severe damage to her retina and the diagnosis said she could could blind fairly soon. She&#x27;s looking to go to a specialist to get some more council and what to do but it&#x27;s really hard for her. We gave her a blessing yesterday and she has really good friends in the ward but your prayers for her would mean the world to me. This week&#x27;s thought is Romans 5:8 now interpret it as you will (one guy this week did that very liberally) but I really love this scripture. I know that God lives and loves us despite our mistakes. Trust in him!<\/p>\n<p>Romans 5:8<\/p>\n<p>But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.<\/p>\n<p class=\"sign\">Los amo muchísimo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Pictures:<\/p>\n<ul class=\"bul\">\n<li>us in our jerseys<\/li>\n<li>one sticker I got<\/li>\n<li>some random stuff we saw at the flea market<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-04-17_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-17_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-17_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-17_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-17_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "No soy María pero tengo Jesus adentro Hola hola, tamo' bien y espero que e' lo mismo pa' ustede We've been listening to a bunch of Christian regaeton hence the funny title and Spanish. It says: I'm not Mary but I have Christ inside Well this week basically has two parts before Thursday and after Thursday because we had transfers. I stayed and received Elder Franson another one of past trainees and it's super awesome being back. This time around though I'm teaching him Portuguese so he can take over the area at the end of these 6 weeks. We've had a few lessons this week but quite a bit of the week has been finding. Nothing too crazy recently but we do have some friends that are looking pretty good otherwise the rest we're probably going to stop teaching for now. We went to the Mexican flea market during lunchtime Saturday it was super lit. I got some little country souvenirs, probably will go back for a few others. Elder Franson got a wicked deal on a Columbian soccer jersey, $5! Check the pictures below We gave talks Sunday on missionary work and it was funny because we and the bishopric didn't think we could talk that long so they had the Hermanas come and bear their testimonies but we talked a lot and it was good so in the end the High councilor was cut a lot of his time... Oh well One last thing before my spiritual thought this week; I need all of you to please pray for Irene (the one that was just baptized)
