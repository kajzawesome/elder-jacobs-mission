namos sobre famílias eternas, deixamos os membros despejarem testemunho neles e aí vazamos, deixando eles querendo mais. A Endrina acabou vindo à igreja também, com o filho de 2 anos, o Lucas; ele dá trabalho, mas é muito fofo! A igreja foi incrível essa semana por um monte de motivos: o Juan Carlos foi de novo à ala em inglês porque não consegue carona até Largo, mas sabe que a igreja é importante; o Rafael foi batizado (amigo das hermanas, mas também nosso, ele ama a gente!); nosso amigo Washington veio ao batismo, à igreja, e tivemos uma lição depois da igreja (ele nos perguntou durante o batismo se podia ser batizado no aniversário dele, dia 22 de abril, estamos muuuito empolgados!); e outros amigos vieram à igreja. Dia bom. É do Washington que eu quero muito falar hoje. Ele se encontrou com os missionários 40 anos atrás e ia ser batizado, mas aí ficou ocupado e se mudou. Ele já tem muita fé e quer ser batizado porque não pode perder a oportunidade de novo. Não percam suas oportunidades, porque Deus realmente está tentando nos ajudar e abençoar, mas muitas vezes nos distraímos com coisas menores ou tentações; então sigam o exemplo do Washington e o conselho desta escritura. 1 Néfi 10:19 Notícias de transferência: eu vou ficar, mas o Élder Schauers, muito infelizmente, vai para Rio Vista, em Fort Myers. Mucho amor, Elder Jacobs Fotos: Amigo Washington na igreja Adesivo engraçado que vimos Cavalão gigaaante Mega pizza hora do suco Mais desta semana"}, {"id": "l42", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">ABR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["PR"], "moments": ["Temple"], "extra": "Puerto Rico", "kind": "Carta 42 · Largo", "title": "Ok, eu só tô 🧍‍♂️🔫🧍‍♂️passando pelos companheiros", "date": "2022-04-04T12:34:00", "group": "2022-04", "html": "<div class=\"body\"><p>Como etan Utede? (Do jeito que os porto-riquenhos falam como están ustedes, porque eles comem muito o s)<\/p>\n<p>Tudo tem sido incrível, principalmente desde que anunciaram um templo na minha missão 🙌 😎 🙏  ❤ 👌<\/p>\n<p>As transferências foram na terça, e eu recebi o Élder Argyle, e tem sido incrível. Temos ensinado um monte de amigos essa semana, mas principalmente ralado para trazer mais gente para a nossa aula de inglês, e deu resultado! Fora isso, nossos amigos estão indo muito bem; eles têm sentido o Espírito e progredido muito bem no Evangelho, principalmente os que vieram assistir à conferência com a gente! Mas assistir em espanhol é bem difícil, porque depois de algumas horas eu só queria relaxar e ouvir em inglês. Enfim, bom treino.<\/p>\n<p>Um tema comum foi o trabalho missionário. Eu amo ser missionário, e ajudar os outros é muito legal. Eu realmente diria: sirvam missão se estiverem em dúvida ou pensando em não ir por enquanto, porque eu nunca trocaria esse tempo que tive. E para quem é mais velho ou não pode, encontrem jeitos de servir aos outros e simplesmente compartilhem o que vocês sabem.<\/p>\n<p>Quanto ao título deste e-mail, vou receber um élder novo que está vindo do Chile, e meu companheiro vai ser transferido de emergência. Derrubei mais um. Devo ser bom nisso ou algo assim, pra ficar 4 semanas com o Élder Gundersen, 3 com o Élder Schauers e 1 com o Élder Argyle.<\/p>\n<p>Enfim, los amo chamacos y espero que tengan una buena semana<\/p>\n<p>Mucho amor y abrazos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos<\/p>\n<ul class=\"bul\">\n<li>nós, os palhaços<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-04-04_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-04_0_1.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_225.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Ok, eu só tô 🧍‍♂️🔫🧍‍♂️passando pelos companheiros Como etan Utede? (Do jeito que os porto-riquenhos falam como están ustedes, porque eles comem muito o s) Tudo tem sido incrível, principalmente desde que anunciaram um templo na minha missão 🙌 😎 🙏 ❤ 👌 As transferências foram na terça, e eu recebi o Élder Argyle, e tem sido incrível. Temos ensinado um monte de amigos essa semana, mas principalmente ralado para trazer mais gente para a nossa aula de inglês, e deu resultado! Fora isso, nossos amigos estão indo muito bem; eles têm sentido o Espírito e progredido muito bem no Evangelho, principalmente os que vieram assistir à conferência com a gente! Mas assistir em espanhol é bem difícil, porque depois de algumas horas eu só queria relaxar e ouvir em inglês. Enfim, bom treino. Um tema comum foi o trabalho missionário. Eu amo ser missionário, e ajudar os outros é muito legal. Eu realmente diria: sirvam missão se estiverem em dúvida ou pensando em não ir por enquanto, porque eu nunca trocaria esse tempo que tive. E para quem é mais velho ou não pode, encontrem jeitos de servir aos outros e simplesmente compartilhem o que vocês sabem. Quanto ao título deste e-mail, vou receber um élder novo que está vindo do Chile, e meu companheiro vai ser transferido de emergência. Derrubei mais um. Devo ser bom nisso ou algo assim, pra ficar 4 semanas com o Élder Gundersen, 3 com o Élder Schauers e 1 com o Élder Argyle. Enfim, los amo chamacos y espero que tengan una buena semana Mucho amor y abrazos! Elder Jacobs Fotos nós, os palhaços Mais desta semana"}, {"id": "l43", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">ABR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 43 · Largo", "title": "👨‍💻👩‍💻JAS por um dia 🤡", "date": "2022-04-11T08:57:00", "group": "2022-04", "html": "<div class=\"body\"><p>...É, isso foi estranho, não curti, me devolvam meus amigos hispânicos...<\/p>\n<p>Ola! Boa noite!<\/p>\n<p>É, fiquei com os JAS por um pouco mais de um dia e foi... interessante. Não foi ruim, só muito diferente. Mas recebi meu companheiro novo!<\/p>\n<p>Élder Carson, de Payson, Utah. Ele é de uma fazendona daquelas (a grande, com os visons – isso é para o vovô e a vovó Jacobs. Sim, eu sei que vocês iam perguntar). Ele estava no Chile para as 12 semanas de treinamento pelas quais todo missionário passa, mas agora está aqui por alguns motivos de saúde. Ele chegou na quarta de manhã, depois de voar a noite inteira. Tem sido super divertido treiná-lo e ajudá-lo a se acostumar com a missão nova.<\/p>\n<p>Com isso, não mudou muita coisa desde a semana passada em relação aos amigos, por falta de tempo na nossa área. Mas uma noite encontramos o Carlos e o Leonardo, e eles são muito massa. Estavam do lado de fora de boa quando chegamos perguntando se podíamos compartilhar uma mensagem; aí falamos do Livro de Mórmon, compartilhamos uma escritura, falamos sobre perseverar até o fim e explicamos as expectativas do que a gente faz. Aí os dois falaram que queriam ser batizados?!? Estamos super empolgados por eles essa semana.<\/p>\n<p>Essa semana também tivemos a oportunidade de ir ao treinamento especializado. Uma mini conferência de zona/reunião de treinamento para missionários bem novinhos e os treinadores deles. Sempre divertido e útil. É diferente estar do outro lado, porque na última vez que pude ir eu era o treinado. (Mando a foto quando receber, ou ela está na página do Facebook da nossa missão)<\/p>\n<p>Domingo foi a conferência de estaca, e foi divertido. O Washington e o Juan Carlos vieram e curtiram. Eles também estão bem animados para os batismos que estão chegando, dia 22 &amp; 23, respectivamente.<\/p>\n<p>Deus ama vocês, sejam bons, me contem como estão as coisas de vez em quando pra eu saber que vocês não morreram<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>o distrito (versão da semana passada)<\/li>\n<li>Os élderes dos JAS e eu no aeroporto<\/li>\n<li>🦩<\/li>\n<li>Primeiro dia do Élder Carson!<\/li>\n<li>Noite de empanada + tacos<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-04-11_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-11_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-11_0_6.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-11_0_7.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_226.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_227.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_228.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_229.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_230.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_231.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_232.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_233.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_234.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_235.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_236.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "👨‍💻👩‍💻JAS por um dia 🤡 ...É, isso foi estranho, não curti, me devolvam meus amigos hispânicos... Ola! Boa noite! É, fiquei com os JAS por um pouco mais de um dia e foi... interessante. Não foi ruim, só muito diferente. Mas recebi meu companheiro novo! Élder Carson, de Payson, Utah. Ele é de uma fazendona daquelas (a grande, com os visons – isso é para o vovô e a vovó Jacobs. Sim, eu sei que vocês iam perguntar). Ele estava no Chile para as 12 semanas de treinamento pelas quais todo missionário passa, mas agora está aqui por alguns motivos de saúde. Ele chegou na quarta de manhã, depois de voar a noite inteira. Tem sido super divertido treiná-lo e ajudá-lo a se acostumar com a missão nova. Com isso, não mudou muita coisa desde a semana passada em relação aos amigos, por falta de tempo na nossa área. Mas uma noite encontramos o Carlos e o Leonardo, e eles são muito massa. Estavam do lado de fora de boa quando chegamos perguntando se podíamos compartilhar uma mensagem; aí falamos do Livro de Mórmon, compartilhamos uma escritura, falamos sobre perseverar até o fim e explicamos as expectativas do que a gente faz. Aí os dois falaram que queriam ser batizados?!? Estamos super empolgados por eles essa semana. Essa semana também tivemos a oportunidade de ir ao treinamento especializado. Uma mini conferência de zona/reunião de treinamento para missionários bem novinhos e os treinadores deles. Sempre divertido e útil. É diferente estar do outro lado, porque na última vez que pude ir eu era o treinado. (Mando a foto quando receber, ou ela está na página do Facebook da nossa missão) Domingo foi a conferência de estaca, e foi divertido. O Washington e o Juan Carlos vieram e curtiram. Eles também estão bem animados para os batismos que estão chegando, dia 22 & 23, respectivamente. Deus ama vocês, sejam bons, me contem como estão as coisas de vez em quando pra eu saber que vocês não morreram Los amo Elder Jacobs Fotos: o distrito (versão da semana passada) Os élderes dos JAS e eu no aeroporto 🦩 Primeiro dia do Élder Carson! Noite de empanada + tacos Mais desta semana"}, {"id": "l44", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">ABR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 44 · Largo", "title": "Chao! Rumo a outra área...", "date": "2022-04-18T15:19:00", "group": "2022-04", "html": "<div class=\"body\"><p>É.... mais uma transferência de emergência.<\/p>\n<p>Que tal compadres!<\/p>\n<p>Essa semana foi super bem. Tivemos muitas lições com membros ajudando, nossos amigos Washington e Juan Carlos vão ser batizados nesta próxima semana, e o ramo está prosperando!<\/p>\n<p>Nossa reunião sacramental de Páscoa foi super incrível. Tivemos vários números musicais, muitos hinos e uma retrospectiva do ministério e da Expiação de Cristo. Depois comemos um monte de comida e doces.<\/p>\n<p>1ª vez fazendo serviço essa semana (num ramo em espanhol)<\/p>\n<p>A conferência de zona na quinta foi incrível. Passamos muito tempo trabalhando nas nossas habilidades de ensino, e estou notando de verdade uma diferença no Espírito conosco e nas nossas lições.<\/p>\n<p>E sim, depois de finalmente 6 semanas completas (mais ou menos 1 transferência), estou de mudança de novo. Queria poder ficar, e foi meio de repente, mas é mais uma transferência de emergência. Vou para Brandon Espanhol. Por sorte vou poder voltar na sexta e no domingo para os batismos, e também para ajudar a terminar de ensiná-los antes do batismo, mas estou muito triste. Aprendi de verdade a trabalhar o máximo que consigo e a amar as pessoas apesar dos desafios, então estou muito triste de sair, provavelmente a mais triste de todas. Estou pronto para o futuro, bom, menos para fazer as malas. Ainda odeio fazer as malas<\/p>\n<p class=\"sign\">Los amo panas!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>estátua de coruja<\/li>\n<li>McDonald's<\/li>\n<li>Steven (nosso dinossauro de borracha que fica no carro), mas em versão anime<\/li>\n<li>hermano owen e as escrituras dele<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-04-18_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-18_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-18_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-04-18_0_3.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_237.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_238.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Chao! Rumo a outra área... É.... mais uma transferência de emergência. Que tal compadres! Essa semana foi super bem. Tivemos muitas lições com membros ajudando, nossos amigos Washington e Juan Carlos vão ser batizados nesta próxima semana, e o ramo está prosperando! Nossa reunião sacramental de Páscoa foi super incrível. Tivemos vários números musicais, muitos hinos e uma retrospectiva do ministério e da Expiação de Cristo. Depois comemos um monte de comida e doces. 1ª vez fazendo serviço essa semana (num ramo em espanhol) A conferência de zona na quinta foi incrível. Passamos muito tempo trabalhando nas nossas habilidades de ensino, e estou notando de verdade uma diferença no Espírito conosco e nas nossas lições. E sim, depois de finalmente 6 semanas completas (mais ou menos 1 transferência), estou de mudança de novo. Queria poder ficar, e foi meio de repente, mas é mais uma transferência de emergência. Vou para Brandon Espanhol. Por sorte vou poder voltar na sexta e no domingo para os batismos, e também para ajudar a terminar de ensiná-los antes do batismo, mas estou muito triste. Aprendi de verdade a trabalhar o máximo que consigo e a amar as pessoas apesar dos desafios, então estou muito triste de sair, provavelmente a mais triste de todas. Estou pronto para o futuro, bom, menos para fazer as malas. Ainda odeio fazer as malas Los amo panas! Elder Jacobs Fotos: estátua de coruja McDonald's Steven (nosso dinossauro de borracha que fica no carro), mas em versão anime hermano owen e as escrituras dele Mais desta semana"}, {"id": "l45", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">ABR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["PR"], "moments": ["Baptism"], "extra": "Puerto Rico", "kind": "Carta 45 · Brandon", "title": "🐡 Bautismo 🛹 nuevo comp 🐐 y más 🔥", "date": "2022-04-25T07:15:00", "group": "2022-04", "html": "<div class=\"body\"><p>Como tan utede?<\/p>\n<p>Super bien acá<\/p>\n<p>Agora estou em Brandon, porque fui transferido de novo (mais uma transferência de emergência). Sou o Élder Jacobs, o sem-teto. Não se preocupem, no geral estou bem, só é meio frustrante me mudar/trocar de companheiro com tanta frequência, mas eu amo ser missionário e não mudaria isso, então aceito as partes ruins, senão não poderia ter as boas. 2 Néfi 2:26-27<\/p>\n<p>Eu adoraria contar mais sobre nossos amigos, mas ainda estou conhecendo quem são, então provavelmente mais pra frente. O trabalho aqui é bem legal, mas difícil, porque na verdade cobrimos 3 áreas, o que dá a estaca inteira. Antes havia outros missionários para ajudar com as outras partes, mas (não quero parecer disco arranhado) faltam missionários de espanhol; logo vamos ganhar alguns, em 2 semanas.<\/p>\n<p>Consegui ir ao batismo e à festa de aniversário do Washington 🎉 🥳 feliz cumpleaños! 72! Foi uma festa e tanto. Vejam as fotos abaixo. Os bombeiros apareceram por causa de fumaça demais do Al pastor do Jorge; super rico<\/p>\n<p>O do Juan Carlos vai ser semana que vem. Tivemos que remarcar, mas ele está animado. Vai ser mais uma viagem para Largo. Meu companheiro novo é o Élder Huntsman, de South Jordan. Super incrível, tenho muito a aprender com ele e a gente se dá super bem. Também moramos com outros 3 élderes, então é sempre festa no apartamento. Élder Jenkins, Clayton e Shields. O Élder Shields veio com a gente um dia, porque os companheiros dele (líderes de zona) foram em divisão com os APs. É, sei lá o que mais, talvez eu lembre semana que vem, ou as fotos preenchem algumas lacunas<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>tartaruguinha<\/li>\n<li>dia de transferência<\/li>\n<li>Élder Shields com a gente<\/li>\n<li>mofongo<\/li>\n<li>banana-da-terra &amp; pincho (basicamente um espetinho)<\/li>\n<li>bautismo<\/li>\n<li>palhaçadas pós-batismo<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-04-25_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-04-25_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-04-25_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-04-25_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-04-25_0_7.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_239.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_240.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_241.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_242.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_243.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_244.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_245.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_246.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_247.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_248.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_249.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_250.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_251.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_252.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_253.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_254.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐡 Bautismo 🛹 nuevo comp 🐐 y más 🔥 Como tan utede? Super bien acá Agora estou em Brandon, porque fui transferido de novo (mais uma transferência de emergência). Sou o Élder Jacobs, o sem-teto. Não se preocupem, no geral estou bem, só é meio frustrante me mudar/trocar de companheiro com tanta frequência, mas eu amo ser missionário e não mudaria isso, então aceito as partes ruins, senão não poderia ter as boas. 2 Néfi 2:26-27 Eu adoraria contar mais sobre nossos amigos, mas ainda estou conhecendo quem são, então provavelmente mais pra frente. O trabalho aqui é bem legal, mas difícil, porque na verdade cobrimos 3 áreas, o que dá a estaca inteira. Antes havia outros missionários para ajudar com as outras partes, mas (não quero parecer disco arranhado) faltam missionários de espanhol; logo vamos ganhar alguns, em 2 semanas. Consegui ir ao batismo e à festa de aniversário do Washington 🎉 🥳 feliz cumpleaños! 72! Foi uma festa e tanto. Vejam as fotos abaixo. Os bombeiros apareceram por causa de fumaça demais do Al pastor do Jorge; super rico O do Juan Carlos vai ser semana que vem. Tivemos que remarcar, mas ele está animado. Vai ser mais uma viagem para Largo. Meu companheiro novo é o Élder Huntsman, de South Jordan. Super incrível, tenho muito a aprender com ele e a gente se dá super bem. Também moramos com outros 3 élderes, então é sempre festa no apartamento. Élder Jenkins, Clayton e Shields. O Élder Shields veio com a gente um dia, porque os companheiros dele (líderes de zona) foram em divisão com os APs. É, sei lá o que mais, talvez eu lembre semana que vem, ou as fotos preenchem algumas lacunas Los amo Elder Jacobs Fotos: tartaruguinha dia de transferência Élder Shields com a gente mofongo banana-da-terra & pincho (basicamente um espetinho) bautismo palhaçadas pós-batismo Mais desta semana"}, {"id": "l46", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAI 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 46 · Brandon", "title": "🌊 Bautismo em dose dupla 🔥", "date": "2022-05-02T12:09:00", "group": "2022-05", "html": "<div class=\"body\"><p>Bom Día!<\/p>\n<p>Semana bem cansativa, mas tudo certo!<\/p>\n<p>Começamos a semana com o conselho de distrito e entrevistas. Nosso distrito é bem massa! Somos nós 5 élderes, 4 sisters e um casal de missionários seniores. Isso que é potência! E entrevistas são sempre boas. Por causa da falta de missionários de espanhol e de quantos vão embora, é provável que eu vá treinar de novo em breve e cobrir zonas inteiras por um tempo, o que não é lá muito incrível, mas dá pra fazer.<\/p>\n<p>Passamos um bom tempo garantindo que estivesse tudo certo para os batismos e também visitando alguns membros. Mas é claro que ensinamos um monte essa semana, principalmente na cidade (Plant City).<\/p>\n<p>Eu \"fui\" em divisão com o Élder Shields para Lithia &amp; Valrico (moramos com ele e os companheiros dele). Foi bem bom, com certeza uma área mais difícil, porque as pessoas estão \"confortáveis\" e acham que já encontraram Cristo ou que não precisam acreditar em Deus. Com certeza curti, mas sou sempre grato por ensinar em espanhol para pessoas tão humildes e tão cheias de amor.<\/p>\n<p>O Élder Huntsman (companheiro/líder de distrito) me convidou para ler este discurso, e eu gostei e quero compartilhar com vocês para ver o que vocês acham. A história do começo é bem boa também:<\/p>\n<p>\"Acompanhamento\"<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2014/04/following-up?lang=eng<\/p>\n<p class=\"sign\">Los amo y esperamos que tengan buena semana,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos<\/p>\n<ul class=\"bul\">\n<li>Beatriz<\/li>\n<li>Juan Carlos + esposa (&amp; hermana Bleakly &amp; Hermano Rivera)<\/li>\n<li>pickleball<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-05-02_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-02_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-02_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-05-02_0_3.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_255.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_256.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_257.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_258.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_259.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_260.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_261.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_262.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_263.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_264.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🌊 Bautismo em dose dupla 🔥 Bom Día! Semana bem cansativa, mas tudo certo! Começamos a semana com o conselho de distrito e entrevistas. Nosso distrito é bem massa! Somos nós 5 élderes, 4 sisters e um casal de missionários seniores. Isso que é potência! E entrevistas são sempre boas. Por causa da falta de missionários de espanhol e de quantos vão embora, é provável que eu vá treinar de novo em breve e cobrir zonas inteiras por um tempo, o que não é lá muito incrível, mas dá pra fazer. Passamos um bom tempo garantindo que estivesse tudo certo para os batismos e também visitando alguns membros. Mas é claro que ensinamos um monte essa semana, principalmente na cidade (Plant City). Eu \"fui\" em divisão com o Élder Shields para Lithia & Valrico (moramos com ele e os companheiros dele). Foi bem bom, com certeza uma área mais difícil, porque as pessoas estão \"confortáveis\" e acham que já encontraram Cristo ou que não precisam acreditar em Deus. Com certeza curti, mas sou sempre grato por ensinar em espanhol para pessoas tão humildes e tão cheias de amor. O Élder Huntsman (companheiro/líder de distrito) me convidou para ler este discurso, e eu gostei e quero compartilhar com vocês para ver o que vocês acham. A história do começo é bem boa também: \"Acompanhamento\" https://www.churchofjesuschrist.org/study/general-conference/2014/04/following-up?lang=eng Los amo y esperamos que tengan buena semana, Elder Jacobs Fotos Beatriz Juan Carlos + esposa (& hermana Bleakly & Hermano Rivera) pickleball Mais desta semana"}, {"id": "l47", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAI 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 47 · Brandon", "title": "Feliz Día de las madres", "date": "2022-05-09T06:04:00", "group": "2022-05", "html": "<div class=\"body\"><p>Buenos Días! Feliz Día de las madres! (Un poco tarde ahora)<\/p>\n<p>Tivemos uma semana bem boa aqui em Brandon e Plant City.<\/p>\n<p>No geral fizemos muitas visitas rápidas e demos lições, o pacote completo. Temos uns amigos bem legais que estão perto de marcar uma data de batismo.<\/p>\n<p>Por favor, orem pela Zulene &amp; a família dela, Los Reyes. O bebê de 5 meses dela está passando por algumas cirurgias.<\/p>\n<p>Para ser bem sincero, não lembro de muita coisa dessa semana. Pareceu tudo bem normal, o de sempre. Em homenagem ao Dia das Mães: uma das minhas escrituras favoritas<\/p>\n<p>46 Pois, como eu sempre os havia chamado de meus filhos (porque eram todos muito jovens), também eles me disseram: Pai, eis que nosso Deus está conosco e não permitirá que caiamos; avancemos, pois; não mataríamos nossos irmãos se nos deixassem em paz; vamos, portanto, para que não vençam o exército de Antipus.<\/p>\n<p>47 Ora, eles nunca haviam lutado; contudo, não temiam a morte; e pensavam mais na liberdade de seus pais do que em suas próprias vidas; sim, haviam sido ensinados por suas mães que, se não duvidassem, Deus os livraria. 48 E repetiram-me as palavras de suas mães, dizendo: Não duvidamos que nossas mães o sabiam. Alma 56:46-48<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>distrito<\/li>\n<li>eu traduzindo<\/li>\n<li>bicho-folha<\/li>\n<li>a melhor quesadilla da vida<\/li>\n<li>As chuvas da Flórida voltaram, ou seja, calor de verão + umidade<\/li>\n<li>não precisa dizer mais nada, goku san<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-05-09_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-09_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_265.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_266.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Feliz Día de las madres Buenos Días! Feliz Día de las madres! (Un poco tarde ahora) Tivemos uma semana bem boa aqui em Brandon e Plant City. No geral fizemos muitas visitas rápidas e demos lições, o pacote completo. Temos uns amigos bem legais que estão perto de marcar uma data de batismo. Por favor, orem pela Zulene & a família dela, Los Reyes. O bebê de 5 meses dela está passando por algumas cirurgias. Para ser bem sincero, não lembro de muita coisa dessa semana. Pareceu tudo bem normal, o de sempre. Em homenagem ao Dia das Mães: uma das minhas escrituras favoritas 46 Pois, como eu sempre os havia chamado de meus filhos (porque eram todos muito jovens), também eles me disseram: Pai, eis que nosso Deus está conosco e não permitirá que caiamos; avancemos, pois; não mataríamos nossos irmãos se nos deixassem em paz; vamos, portanto, para que não vençam o exército de Antipus. 47 Ora, eles nunca haviam lutado; contudo, não temiam a morte; e pensavam mais na liberdade de seus pais do que em suas próprias vidas; sim, haviam sido ensinados por suas mães que, se não duvidassem, Deus os livraria. 48 E repetiram-me as palavras de suas mães, dizendo: Não duvidamos que nossas mães o sabiam. Alma 56:46-48 Los amo! Elder Jacobs Fotos: distrito eu traduzindo bicho-folha a melhor quesadilla da vida As chuvas da Flórida voltaram, ou seja, calor de verão + umidade não precisa dizer mais nada, goku san Mais desta semana"}, {"id": "l48", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAI 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HN\">🇭🇳 Honduras<\/span><\/div>", "cultures": ["HN"], "moments": [], "extra": "Honduras", "kind": "Carta 48 · Brandon", "title": "🚂🚃🚃🚃 trem do corre 🌊", "date": "2022-05-16T05:28:00", "group": "2022-05", "html": "<div class=\"body\"><p>Buenos Días mis chiquis! (gíria de Honduras para parceiro)<\/p>\n<p>Todo super bien!<\/p>\n<p>Não expliquei no último e-mail, mas tivemos transferências. O Élder Huntsman e eu continuamos juntos, mas meio que trocamos de área. Antes cobríamos a estaca inteira, e agora só cobrimos metade, enquanto as hermanas cobrem a outra metade. Por causa disso, temos mais tempo para encontrar pessoas e embarcar no trem do corre para fortalecer essa metade da área (principalmente Plant City). Também por causa dessa mudança, agora moramos em 2 apartamentos. O nosso atual/antigo em Lithia (centro da zona) e um em Plant City para os dias em que não faz sentido dirigir quase uma hora de volta, e é melhor passar a noite. Quanto à nossa semana, no geral foi bem normal/o esperado. Muito tempo procurando pessoas no começo da semana, mas, para o fim, quase só lições direto. O domingo foi bom, mas longo. 1 hora na igreja em Plant City, 2 em Brandon + 2 horas de reuniões e 1 hora no devocional dos jovens adultos. Muita reunião/muito tempo sentado.<\/p>\n<p>Tenho aprendido sobre o poder da oração e de ter uma boa comunicação, então aqui vão algumas perguntas para fazer todos vocês pensarem nas suas orações/comunicação:<\/p>\n<ul class=\"bul\">\n<li>Você se distrai com facilidade?<\/li>\n<li>Você costuma fazer tudo girar em torno de você?<\/li>\n<li>Enquanto outra pessoa está falando, você pensa no que vai dizer em vez de ouvir para entendê-la?<\/li>\n<li>Você foca nos fracassos/dificuldades em vez das bênçãos?<\/li>\n<\/ul>\n<p>Testifico que dios te ama y es bueno!<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>boliche com o distrito antigo (segunda passada)<\/li>\n<li>o menor abacaxi do mundo<\/li>\n<li>Folheto dos Israelitas Hebreus<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-05-16_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-05-16_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-16_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-05-16_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-05-16_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_267.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_268.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_269.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_270.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🚂🚃🚃🚃 trem do corre 🌊 Buenos Días mis chiquis! (gíria de Honduras para parceiro) Todo super bien! Não expliquei no último e-mail, mas tivemos transferências. O Élder Huntsman e eu continuamos juntos, mas meio que trocamos de área. Antes cobríamos a estaca inteira, e agora só cobrimos metade, enquanto as hermanas cobrem a outra metade. Por causa disso, temos mais tempo para encontrar pessoas e embarcar no trem do corre para fortalecer essa metade da área (principalmente Plant City). Também por causa dessa mudança, agora moramos em 2 apartamentos. O nosso atual/antigo em Lithia (centro da zona) e um em Plant City para os dias em que não faz sentido dirigir quase uma hora de volta, e é melhor passar a noite. Quanto à nossa semana, no geral foi bem normal/o esperado. Muito tempo procurando pessoas no começo da semana, mas, para o fim, quase só lições direto. O domingo foi bom, mas longo. 1 hora na igreja em Plant City, 2 em Brandon + 2 horas de reuniões e 1 hora no devocional dos jovens adultos. Muita reunião/muito tempo sentado. Tenho aprendido sobre o poder da oração e de ter uma boa comunicação, então aqui vão algumas perguntas para fazer todos vocês pensarem nas suas orações/comunicação: Você se distrai com facilidade? Você costuma fazer tudo girar em torno de você? Enquanto outra pessoa está falando, você pensa no que vai dizer em vez de ouvir para entendê-la? Você foca nos fracassos/dificuldades em vez das bênçãos? Testifico que dios te ama y es bueno! Los amo Elder Jacobs Fotos: boliche com o distrito antigo (segunda passada) o menor abacaxi do mundo Folheto dos Israelitas Hebreus Mais desta semana"}, {"id": "l49", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAI 2022<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 49 · Brandon", "title": "🐺🤯->☠ Aqui é o Vermelho 2, eles estão na minha cola!", "date": "2022-05-23T05:12:00", "group": "2022-05", "html": "<div class=\"body\"><p>Como están mis amigos?<\/p>\n<p>Todo bien acá en la Florida<\/p>\n<p>Essa semana com certeza foi mais difícil. Nossa agenda ficou meio bagunçada com os dias em que normalmente estamos em Plant City e os dias em Brandon, mas mesmo assim mandamos ver no corre.<\/p>\n<p>Uma das coisas mais difíceis foi a quantidade de lições que conseguimos marcar e aí, zero, nada, nenhuma delas aconteceu de fato. Isso significou muito tempo procurando pessoas ou indo atrás dos nossos planos B, algo que descobri ser muito importante. O que me leva ao meu pensamento de hoje:<\/p>\n<p>Marcos 8:<\/p>\n<p>27 E saiu Jesus e os seus discípulos para as aldeias de Cesareia de Filipe; e no caminho perguntou aos seus discípulos, dizendo: Quem dizem os homens que eu sou?<\/p>\n<p>28 E eles responderam: João Batista; e outros, Elias; mas outros, um dos profetas. 29 E ele lhes disse: Mas vós, quem dizeis que eu sou? E, respondendo Pedro, lhe disse: Tu és o Cristo. Cristo não foi só um plano B para os nossos fracassos, pecados, defeitos e imperfeições, mas sim o plano inteiro. Desde o princípio, Ele foi escolhido para nos libertar da nossa morte espiritual e física. Confiem Nele e na Sua graça!<\/p>\n<p>Agora, para explicar o título do e-mail.<\/p>\n<p>Referência a Star Wars porque por que não, e eu fui mordido por um cachorro essa semana.<\/p>\n<p>O Élder Huntsman e eu estávamos na nossa Pupuseria favorita e no parque de trailers, tentando visitar alguns amigos e encontrar novos. Ele estava anotando alguma coisa no Area Book quando uma senhora chegou em casa e estacionou. O cachorro dela, que antes estava latindo feito doido, parou e foi recebê-la. Nos vimos, acenamos, mas ela entrou antes que eu pudesse começar a falar com ela, então decidi tentar bater na porta.<\/p>\n<p>Enquanto eu me aproximava do trailer/quintal dela, lembrei do cachorro e decidi ver se conseguia enxergá-lo. Vi na hora, ele me viu e surtou! Quando percebi, eu estava andando de ré tentando desviar dessa bala em forma de cachorro. O primeiro bote errou e só pegou minha calça, mas aí ele deu outro bote e pulou, pegando meu joelho. Ele estava prestes a ir para cima do Élder Huntsman quando a senhora saiu e gritou com ele.<\/p>\n<p>Ela pareceu super envergonhada e nem um pouco surpresa de isso ter acontecido de novo...<\/p>\n<p>Mas nenhum furo na minha calça. E o cachorro, sei lá de que raça, algum poodle misturado<\/p>\n<p>Me mandem umas fotos de cachorros fofos e bonzinhos pra compensar jaja, ou me contem uma história de quando vocês foram mordidos. Semana que vem é nossa rodada de recuperação, por causa de como essa semana foi pesada, com todos os planos dando errado<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>distrito novo<\/li>\n<li>Franklin, o recém-converso mais Chad que existe<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-05-23_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-23_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-05-23_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_271.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_272.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_273.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_274.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_275.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_276.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_277.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_278.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_279.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_280.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐺🤯->☠ Aqui é o Vermelho 2, eles estão na minha cola! Como están mis amigos? Todo bien acá en la Florida Essa semana com certeza foi mais difícil. Nossa agenda ficou meio bagunçada com os dias em que normalmente estamos em Plant City e os dias em Brandon, mas mesmo assim mandamos ver no corre. Uma das coisas mais difíceis foi a quantidade de lições que conseguimos marcar e aí, zero, nada, nenhuma delas aconteceu de fato. Isso significou muito tempo procurando pessoas ou indo atrás dos nossos planos B, algo que descobri ser muito importante. O que me leva ao meu pensamento de hoje: Marcos 8: 27 E saiu Jesus e os seus discípulos para as aldeias de Cesareia de Filipe; e no caminho perguntou aos seus discípulos, dizendo: Quem dizem os homens que eu sou? 28 E eles responderam: João Batista; e outros, Elias; mas outros, um dos profetas. 29 E ele lhes disse: Mas vós, quem dizeis que eu sou? E, respondendo Pedro, lhe disse: Tu és o Cristo. Cristo não foi só um plano B para os nossos fracassos, pecados, defeitos e imperfeições, mas sim o plano inteiro. Desde o princípio, Ele foi escolhido para nos libertar da nossa morte espiritual e física. Confiem Nele e na Sua graça! Agora, para explicar o título do e-mail. Referência a Star Wars porque por que não, e eu fui mordido por um cachorro essa semana. O Élder Huntsman e eu estávamos na nossa Pupuseria favorita e no parque de trailers, tentando visitar alguns amigos e encontrar novos. Ele estava anotando alguma coisa no Area Book quando uma senhora chegou em casa e estacionou. O cachorro dela, que antes estava latindo feito doido, parou e foi recebê-la. Nos vimos, acenamos, mas ela entrou antes que eu pudesse começar a falar com ela, então decidi tentar bater na porta. Enquanto eu me aproximava do trailer/quintal dela, lembrei do cachorro e decidi ver se conseguia enxergá-lo. Vi na hora, ele me viu e surtou! Quando percebi, eu estava andando de ré tentando desviar dessa bala em forma de cachorro. O primeiro bote errou e só pegou minha calça, mas aí ele deu outro bote e pulou, pegando meu joelho. Ele estava prestes a ir para cima do Élder Huntsman quando a senhora saiu e gritou com ele. Ela pareceu super envergonhada e nem um pouco surpresa de isso ter acontecido de novo... Mas nenhum furo na minha calça. E o cachorro, sei lá de que raça, algum poodle misturado Me mandem umas fotos de cachorros fofos e bonzinhos pra compensar jaja, ou me contem uma história de quando vocês foram mordidos. Semana que vem é nossa rodada de recuperação, por causa de como essa semana foi pesada, com todos os planos dando errado Los amo! Elder Jacobs Fotos: distrito novo Franklin, o recém-converso mais Chad que existe Mais desta semana"}, {"id": "l50", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">MAI 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": [], "moments": ["Temple"], "extra": "", "kind": "Carta 50 · Brandon", "title": "🤯 As coisas da minha alma & o corre 🤠", "date": "2022-05-30T06:03:00", "group": "2022-05", "html": "<div class=\"body\"><p>Ola, cómo estáis?<\/p>\n<p>Está tudo indo muito bem aqui. Temos visto mais sucesso e tido ótimas oportunidades de aprender e depois aplicar o conhecimento novo para ver milagres.<\/p>\n<p>Essa semana não tivemos conselho de distrito porque tivemos conferência de zona. O foco dessa vez foi \"as coisas da minha alma\"/testemunho final. Como era a última com os Hollingsworth antes de recebermos os Gardiner, foi muito especial. Os treinamentos foram bem focados em metas, verdades essenciais e no nosso desenvolvimento pessoal. Basicamente: se eu fosse morrer, o que eu ensinaria/testificaria antes. Não vou contar minha história de conversão aqui (se quiserem, me perguntem que eu conto), mas tenho algo para compartilhar; uma das muitas coisas da minha alma.<\/p>\n<p>Templos<\/p>\n<p>Os templos sempre foram algo especial para mim. Eles são completamente diferentes dos prédios onde nos reunimos, e tive a oportunidade de visitar muitos, seja para as ordenanças de verdade ou em casas abertas. Eu nunca tinha percebido, mas uma das minhas lembranças mais felizes, ou fases mais felizes da minha vida, foi o penúltimo ano do ensino médio, porque eu ia toda quinta depois da aula com amigos (hoje Élder Grossen &amp; o futuro Élder Baker). Tem sido incrível este ano também, porque consegui visitar o Templo de Orlando em março, e nós, como missão, estamos focados em levar recém-conversos e membros que ainda não foram ao templo. É uma meta difícil, porque não podemos estar lá com eles, mas as experiências deles não têm preço. Mosias 2:6<\/p>\n<p>E armaram suas tendas ao redor do templo, cada homem tendo sua tenda com a porta voltada para o templo, a fim de que pudessem permanecer em suas tendas e ouvir as palavras que o rei Benjamim lhes diria. Espero que todos vocês consigam um tempo essa semana para ir ao templo, nem que seja só aos jardins, se estiverem sem tempo ou tentando renovar a recomendação. Amo todos vocês.<\/p>\n<p>Agora, continuando com o que aconteceu essa semana.<\/p>\n<p>Fui em divisão essa semana para Riverview, onde passei 24 horas de novo com o Élder CJ Ricks e com o Élder Mason. Nos divertimos bastante juntos. Íamos andar de bicicleta, mas as bicicletas ficaram presas no rack... então queimamos um monte de milhas do carro.<\/p>\n<p>Tivemos umas lições muito top essa semana. Aqui estão os nomes de alguns dos nossos amigos, se puderem orar por eles 🙏 Jaime - resposta à promessa de Morôni<\/p>\n<p>Melina - recuperação da saúde e consolo<\/p>\n<p>Zulene - ajuda com a família e com a filhinha, que tem uns problemas de saúde sérios<\/p>\n<p>Mercedes - encontrar jeitos de pagar as contas<\/p>\n<p>Felix - encontrar equilíbrio entre a igreja e o trabalho<\/p>\n<p>No geral, orem para que eles reconheçam a verdade, encontrem tempo para ir à igreja e aprendam inglês.<\/p>\n<p>Foi uma semana de encontrar e tentar encontrar os verdadeiros eleitos, prontos para receber. Passamos boa parte do tempo andando, ligando e dirigindo por causa da distância.<\/p>\n<p class=\"sign\">Los amo changos<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos<\/p>\n<ul class=\"bul\">\n<li>vi o Élder Ballif na conferência de zona<\/li>\n<li>tomando um mate (valeu, mãe!)<\/li>\n<li>macarrão de abobrinha 🤤 (comeria de novo, sério, o grind da vida saudável tá indo bem)<\/li>\n<li>Sábado à noite 🌙 🔥<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-05-30_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-30_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-30_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-05-30_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_281.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_282.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_283.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_284.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_285.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_286.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_287.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_288.jpg\" alt=\"\"><\/figure><figu crível este ano também, porque consegui visitar o Templo de Orlando em março, e nós, como missão, estamos focados em levar recém-conversos e membros que ainda não foram ao templo. É uma meta difícil, porque não podemos estar lá com eles, mas as experiências deles não têm preço. Mosias 2:6 E armaram suas tendas ao redor do templo, cada homem tendo sua tenda com a porta voltada para o templo, a fim de que pudessem permanecer em suas tendas e ouvir as palavras que o rei Benjamim lhes diria. Espero que todos vocês consigam um tempo essa semana para ir ao templo, nem que seja só aos jardins, se estiverem sem tempo ou tentando renovar a recomendação. Amo todos vocês. Agora, continuando com o que aconteceu essa semana. Fui em divisão essa semana para Riverview, onde passei 24 horas de novo com o Élder CJ Ricks e com o Élder Mason. Nos divertimos bastante juntos. Íamos andar de bicicleta, mas as bicicletas ficaram presas no rack... então queimamos um monte de milhas do carro. Tivemos umas lições muito top essa semana. Aqui estão os nomes de alguns dos nossos amigos, se puderem orar por eles 🙏 Jaime - resposta à promessa de Morôni Melina - recuperação da saúde e consolo Zulene - ajuda com a família e com a filhinha, que tem uns problemas de saúde sérios Mercedes - encontrar jeitos de pagar as contas Felix - encontrar equilíbrio entre a igreja e o trabalho No geral, orem para que eles reconheçam a verdade, encontrem tempo para ir à igreja e aprendam inglês. Foi uma semana de encontrar e tentar encontrar os verdadeiros eleitos, prontos para receber. Passamos boa parte do tempo andando, ligando e dirigindo por causa da distância. Los amo changos Elder Jacobs Fotos vi o Élder Ballif na conferência de zona tomando um mate (valeu, mãe!) macarrão de abobrinha 🤤 (comeria de novo, sério, o grind da vida saudável tá indo bem) Sábado à noite 🌙 🔥 Mais desta semana"}, {"id": "l51", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><\/div>", "cultures": ["WS"], "moments": [], "extra": "Samoa", "kind": "Carta 51 · Brandon", "title": "O verão chegou!", "date": "2022-06-06T15:14:00", "group": "2022-06", "html": "<div class=\"body\"><p>Hola Amigos! Hace Calor, dava pra fritar um ovo no cimento de tão caliente!<\/p>\n<p>Música da Vila Sésamo...<\/p>\n<p>Enfim, o verão chegou com tudo: mudanças de tempo do nada, muita chuva e umidade e, claro, raios. Não é à toa que é a capital mundial dos raios.<\/p>\n<p>Quanto a esta semana, tentamos aproveitar ao máximo e ganhar o desafio de mais lições com membros ajudando a ensinar. Era entre os 2 distritos da zona e a gente amassou = festa da pizza no P-day! Foi bem difícil ter membros com tanta constância, mas ajudou nossos amigos a entender mais e a se sentirem mais acolhidos.<\/p>\n<p>Fiz outra divisão esta semana em Riverview e não aconteceu muita coisa por causa de um monte de lições canceladas ou remarcadas. Foi divertido ficar com aqueles élderes, Ricks e Ricks. Isso mesmo, tem 2 naquela dupla + o Élder Mason.<\/p>\n<p>Nossos amigos estão bem: alguns estão bem interessados em ler, outros precisam de um incentivo, e outros foram deixados de lado, mas talvez com outros missionários quando estiverem mais preparados. Aprendi muito sobre isso e sobre oração esta semana, enquanto lutava com algumas perguntas e tentava receber mais revelação para guiar esta dupla e esta área. Descobri que, quando dá, fazer algumas orações em voz alta, mesmo sozinho, ajuda muito, junto com simplesmente ouvir e esperar Deus falar nessa \"conversa\". Tem sido bom.<\/p>\n<p>Curtam as fotos da conferência de zona, a última do Presidente e da Sister Hollingsworth<\/p>\n<p>Meu celular decidiu parar de ser celular esta semana, então semana que vem vou ter mais fotos e vou poder falar/digitar mais. #timedocomputadorhoje<\/p>\n<p>los amamos! Vou completar 1 ano na quinta! (mas ainda preciso aprender mais e ajudar os outros :D)<\/p>\n<p>ah, e o Élder Huntsman e eu vamos receber um novo élder em treinamento de Samoa também esta semana. No meio da transferência, uhu<\/p>\n<p class=\"sign\">Elder Jacobs<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-06-06_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-06_0_1.jpeg\" alt=\"\"><\/figure><\/div>", "text": "O verão chegou! Hola Amigos! Hace Calor, dava pra fritar um ovo no cimento de tão caliente! Música da Vila Sésamo... Enfim, o verão chegou com tudo: mudanças de tempo do nada, muita chuva e umidade e, claro, raios. Não é à toa que é a capital mundial dos raios. Quanto a esta semana, tentamos aproveitar ao máximo e ganhar o desafio de mais lições com membros ajudando a ensinar. Era entre os 2 distritos da zona e a gente amassou = festa da pizza no P-day! Foi bem difícil ter membros com tanta constância, mas ajudou nossos amigos a entender mais e a se sentirem mais acolhidos. Fiz outra divisão esta semana em Riverview e não aconteceu muita coisa por causa de um monte de lições canceladas ou remarcadas. Foi divertido ficar com aqueles élderes, Ricks e Ricks. Isso mesmo, tem 2 naquela dupla + o Élder Mason. Nossos amigos estão bem: alguns estão bem interessados em ler, outros precisam de um incentivo, e outros foram deixados de lado, mas talvez com outros missionários quando estiverem mais preparados. Aprendi muito sobre isso e sobre oração esta semana, enquanto lutava com algumas perguntas e tentava receber mais revelação para guiar esta dupla e esta área. Descobri que, quando dá, fazer algumas orações em voz alta, mesmo sozinho, ajuda muito, junto com simplesmente ouvir e esperar Deus falar nessa \"conversa\". Tem sido bom. Curtam as fotos da conferência de zona, a última do Presidente e da Sister Hollingsworth Meu celular decidiu parar de ser celular esta semana, então semana que vem vou ter mais fotos e vou poder falar/digitar mais. #timedocomputadorhoje los amamos! Vou completar 1 ano na quinta! (mas ainda preciso aprender mais e ajudar os outros :D) ah, e o Élder Huntsman e eu vamos receber um novo élder em treinamento de Samoa também esta semana. No meio da transferência, uhu Elder Jacobs"}, {"id": "l52", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["WS"], "moments": ["Temple"], "extra": "Samoa", "kind": "Carta 52 · Brandon", "title": "Confusão em trio", "date": "2022-06-13T09:26:00", "group": "2022-06", "html": "<div class=\"body\"><p>Que onda chavos? Tenemos el hijole!<\/p>\n<p>O poder do trio começou. E as palhaçadas também<\/p>\n<p>O começo da semana foi bem normal, meio que esperando o dia do treinamento. Segunda: ganhamos tacos al pastor da família Hernandez. Estamos tentando levá-los ao templo! (A gente até achou os registros perdidos! Milagro!) Terça começou com o conselho de distrito, focando em ampliar nossa visão. As provações nos ajudam e precisamos estabelecer metas altas para ver grandes milagres. Também ganhei um celular temporário, então posso tirar mais fotos, mas às vezes ainda esqueço que tenho celular de novo. Quarta: tivemos entrevistas com o Presidente e a Sister Hollingsworth. Com certeza foi difícil dizer tchau por enquanto, já que foi a última e o novo presidente chega dia 30, mas consegui resolver mais coisas conversando com eles. E como os dois disseram: \"vocês estão presos a nós para sempre\", então tudo bem. Depois, à noite, em Thonotassa, outra cidade da área de Plant City. Agora vem a parte divertida<\/p>\n<p>Quinta de manhã dirigimos até Tampa e buscamos o Élder Fuimaono Lutu, também conhecido como Élder Lutu. Ele é da Samoa Americana 🇼🇸 e cheio de energia. Ele está muito feliz de estar aqui, é demais. Só que às vezes ele cai no sono porque ainda está se acostumando com o fuso horário e com a rotina completa de missionário. O espanhol vai ser a 3ª língua dele, depois de 1. inglês 2. samoano (o comum &amp; a língua dos deuses, porque existem 2 níveis de fala).<\/p>\n<p>O resto da semana foi muito bater portas tentando encontrar mais amigos. Tivemos bastante sucesso, mas nenhum sucesso em achar as pessoas em casa quando tentamos passar pela segunda vez. Também passamos mais tempo dentro de casa fazendo Facebook, ligações e treinando el hijole, porque tentamos variar, mas também choveu quase o fim de semana inteiro. Meu pensamento desta semana é sobre a oração e a promessa de Morôni. Antes eu achava que era uma coisa de uma vez só, mas se estamos realmente desenvolvendo nosso testemunho, sendo confrontados pelos outros e pelas ideias deles, ou seja lá o que for, precisamos continuar pedindo revelação da verdade. Então só quero que vocês orem e peçam a Deus de novo que confirme a veracidade do Livro de Mórmon.<\/p>\n<p class=\"sign\">Los amo no Hagan drogas<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>hijole sonolento Élder Lutu X2<\/li>\n<li>Jamaica (hibisco, eles fazem uma bebida com isso de verdade, é muito boa e saudável)<\/li>\n<li>lição por videochamada com o Franklin (recém-converso) e a amiga dele, Edynay<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-06-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-13_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-13_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-06-13_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_298.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_299.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Confusão em trio Que onda chavos? Tenemos el hijole! O poder do trio começou. E as palhaçadas também O começo da semana foi bem normal, meio que esperando o dia do treinamento. Segunda: ganhamos tacos al pastor da família Hernandez. Estamos tentando levá-los ao templo! (A gente até achou os registros perdidos! Milagro!) Terça começou com o conselho de distrito, focando em ampliar nossa visão. As provações nos ajudam e precisamos estabelecer metas altas para ver grandes milagres. Também ganhei um celular temporário, então posso tirar mais fotos, mas às vezes ainda esqueço que tenho celular de novo. Quarta: tivemos entrevistas com o Presidente e a Sister Hollingsworth. Com certeza foi difícil dizer tchau por enquanto, já que foi a última e o novo presidente chega dia 30, mas consegui resolver mais coisas conversando com eles. E como os dois disseram: \"vocês estão presos a nós para sempre\", então tudo bem. Depois, à noite, em Thonotassa, outra cidade da área de Plant City. Agora vem a parte divertida Quinta de manhã dirigimos até Tampa e buscamos o Élder Fuimaono Lutu, também conhecido como Élder Lutu. Ele é da Samoa Americana 🇼🇸 e cheio de energia. Ele está muito feliz de estar aqui, é demais. Só que às vezes ele cai no sono porque ainda está se acostumando com o fuso horário e com a rotina completa de missionário. O espanhol vai ser a 3ª língua dele, depois de 1. inglês 2. samoano (o comum & a língua dos deuses, porque existem 2 níveis de fala). O resto da semana foi muito bater portas tentando encontrar mais amigos. Tivemos bastante sucesso, mas nenhum sucesso em achar as pessoas em casa quando tentamos passar pela segunda vez. Também passamos mais tempo dentro de casa fazendo Facebook, ligações e treinando el hijole, porque tentamos variar, mas também choveu quase o fim de semana inteiro. Meu pensamento desta semana é sobre a oração e a promessa de Morôni. Antes eu achava que era uma coisa de uma vez só, mas se estamos realmente desenvolvendo nosso testemunho, sendo confrontados pelos outros e pelas ideias deles, ou seja lá o que for, precisamos continuar pedindo revelação da verdade. Então só quero que vocês orem e peçam a Deus de novo que confirme a veracidade do Livro de Mórmon. Los amo no Hagan drogas Elder Jacobs Fotos: hijole sonolento Élder Lutu X2 Jamaica (hibisco, eles fazem uma bebida com isso de verdade, é muito boa e saudável) lição por videochamada com o Franklin (recém-converso) e a amiga dele, Edynay Mais desta semana"}, {"id": "l53", "area": 6, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">BRANDON, FL<\/span><span class=\"pm-d\">JUN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><\/div>", "cultures": ["WS"], "moments": [], "extra": "Samoa", "kind": "Carta 53 · Brandon", "title": "🍳🍱 Feliz día de los Padres 🥩", "date": "2022-06-20T05:49:00", "group": "2022-06", "html": "<div class=\"body\"><p>Talofa usos! (E aí, meus manos, em samoano)<\/p>\n<p>Esta semana foi superquente, quase toda acima dos 100 °F, até o fim de semana, quando veio muita chuva! Feliz Dia dos Pais pra todos os pais (até aqueles em cuja casa eu fui de penetra pra ficar com os parças)<\/p>\n<p>Tivemos nosso último conselho de distrito esta semana. Eu achei que ia ficar aqui mais uma transferência, mas na verdade vou para Tampa, treinando e agora como líder de distrito, então vamos ver como vai ser. A reunião foi muito boa, revisando como nos manter responsáveis perante o Senhor, escolhendo a obediência por amor, e terminamos com uma reunião de testemunhos. O Élder Noah Ricks também veio fazer uma divisão com a gente. Foi interessante porque ele vai pra casa amanhã, mas durante a divisão ele ficou o tempo todo tentando dar umas dicas. As últimas palavras de sabedoria de um homem à beira da morte. Na quarta, nosso GPS disse: ei, vocês têm que pegar uma estrada de terra, mesmo tendo uma estrada perfeitamente boa pra chegar na casa do nosso amigo Emilio. Mas pelo menos achamos um trator e um campo de girassóis.<\/p>\n<p>Nada de mais no dia seguinte, mas fomos abençoados com várias lições incríveis.<\/p>\n<p>A sexta foi doideira, Jaja. Fomos fazer a sobrancelha com a Yoana, uma recém-conversa que está meio se afastando. Então passar esse tempo com ela foi bom, mas, cara, como dói fazer com linha, na minha opinião. Depois tivemos mais lições top com os amigos. A Liset está se sentindo melhor, mas ela e o Rafael decidiram adiar a data porque ainda não estão bem prontos, mas querem muito que seja logo!<\/p>\n<p>O resto da semana foi bem tranquilo por causa da quantidade de ligações/mensagens tentando saber como os amigos estavam e levá-los à igreja. Coisa bem normal.<\/p>\n<p>Queria compartilhar uma coisa que o Élder Lutu me ensinou sobre ajuda/dons espirituais. Como precisamos da ajuda de Deus, normalmente oramos para recebê-la (às vezes ela simplesmente vem, mas normalmente oramos), mas para coisas mais complexas, como o dom de línguas, temos que estudar. Estudar a língua e também as escrituras, porque se não fizermos as duas coisas, nosso bem-estar espiritual cai e também passamos a perna no Espírito. Precisamos de equilíbrio em tudo. Então tentem descobrir se vocês precisam se esforçar mais no dom que querem ou estudar mais para garantir que o Espírito esteja lá para ajudar vocês a receber.<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>lambo na igreja<\/li>\n<li>Fred's Country style buffet com o Irmão Mosher<\/li>\n<li>capitão🇺🇸<\/li>\n<li>Uma recém-conversa fez nossa sobrancelha com linha (sim, eu pareço chapado... doeu, tá bom..)<\/li>\n<li>🚜🌻<\/li>\n<li>Bob Ross<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-06-20_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-20_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-20_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-20_0_8.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_300.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_301.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_302.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_303.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_304.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_305.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_306.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_307.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_308.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_309.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_310.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_311.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"ima
