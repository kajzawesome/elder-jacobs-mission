ionários de espanhol para quando encontram algum latino). Cypress Gardens East vai ficar vazia por uma semana e depois vai ser preenchida nas transferências? Essa última parte é um mistério, porque estamos com falta de missionários de espanhol. Uma boa parte da missão foi designada para cá enquanto esperava visto e as fronteiras abrirem, e agora está tudo certo. Eu amo a ala e estou triste de sair, mas vou voltar algum dia e estou animado para experimentar algo novo. Vão escutar algumas músicas do Funky, porque são músicas épicas em espanhol e todas sobre o Evangelho. Eu gosto muito de Soy tu Dios & Todavía (a primeira sobre os milagres do Velho Testamento e o Deus de Israel, e a outra sobre o filho pródigo). Se vocês não sabem espanhol, provavelmente ainda vão curtir a música, mas aviso que a letra não vai traduzir direitinho, porque o Funky é porto-riquenho e eles usam muita gíria. Disfrasao' também é muito boa. Se vocês não quiserem procurar no Google ou se forem missionários, me avisem que eu mando as músicas. Los amo muchísimo queridos amigos! Espero que no estén enfermos cómo yo estuve Elder Jacobs Fotos: quarentena (quando finalmente nos sentimos bem o bastante para nos vestir normalmente) Fotos antigas que esqueci, do amigo secreto de Natal e do outro dia Mais desta semana"}, {"id": "l35", "area": 4, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">PEACE RIVER, FL<\/span><span class=\"pm-d\">FEV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 35 · Peace River", "title": "🗿🪐 No meio do nada & bautismo! 🌊", "date": "2022-02-14T10:01:00", "group": "2022-02", "html": "<div class=\"body\"><p>Hola a todos direto do meio do nada. Quer dizer, eu estou em algum lugar, só que provavelmente ninguém nunca ouviu falar. Moramos em Wauchula e cobrimos as cidades ao redor: Arcadia, Myakka City, Bowling Green e mais algumas pequenas. Nossa área é super rural. Só cidadezinhas, trailers, casinhas, plantações e coisas do tipo. Por exemplo, temos um Walmart minúsculo, Family Dollars e Dollar Generals como lojas, além de Wendy's, Burger King, McDonald's e Taco Bell. Infelizmente nada de Chick-fil-A. Os missionários mais perto da gente ficam a uma hora daqui, então estamos bem isolados.<\/p>\n<p>A semana foi bem boa, demos uma boa quantidade de lições, a maioria em espanhol, ainda bem, e os membros daqui querem muito ajudar nas lições, o que tem sido incrível. Eles também gostam de dar comida pra gente; talvez a gente tenha, ou não, comido 2 refeições com membros sem querer, porque a gente apareceu e eles já tinham preparado comida.<\/p>\n<p>O Élder Gundersen e eu nos demos bem na hora e não paramos de rir, o que nos fez pensar que íamos ser transferidos jaja. As transferências normais são na terça e, ainda bem, nós dois vamos ficar, mas os outros élderes (estamos num distrito só de élderes) vão ser substituídos de vez (whitewash).<\/p>\n<p>Sinceramente nada muito doido aconteceu essa semana, mas conhecemos uns caras incríveis, o Misael &amp; o Josue. Eles queriam aprender inglês, mas quando falamos do nosso propósito e explicamos as expectativas, eles se abriram para o Evangelho e disseram que estavam procurando uma igreja. Aí no dia seguinte eles vieram, dirigindo um pouco mais de uma hora pra chegar lá! Olha a foto<\/p>\n<p>Mesmo tendo sido transferido, eu ainda estava perto o bastante para ir batizar nosso amigo Arnulfo! Ele estava tão feliz e pronto para começar uma nova fase da vida. Foi uma experiência super especial e ele prestou o testemunho dele, o que foi incrível demais!<\/p>\n<p class=\"sign\">Los amo muchísimo y Sean excelentes!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Josue, Élder Gundersen, Misael e eu<\/li>\n<li>Batismo do Arnulfo!<\/li>\n<li>1 de 6 caixas de morangos fresquinhos 🍓 que nosso amigo Clemente nos deu<\/li>\n<li>Os óculos de sol do Élder Gundersen e as habilidades dele no piano<\/li>\n<li>uhuul, P-day<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-02-14_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-02-14_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-14_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-14_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-14_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_178.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_179.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_180.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_181.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🗿🪐 No meio do nada & bautismo! 🌊 Hola a todos direto do meio do nada. Quer dizer, eu estou em algum lugar, só que provavelmente ninguém nunca ouviu falar. Moramos em Wauchula e cobrimos as cidades ao redor: Arcadia, Myakka City, Bowling Green e mais algumas pequenas. Nossa área é super rural. Só cidadezinhas, trailers, casinhas, plantações e coisas do tipo. Por exemplo, temos um Walmart minúsculo, Family Dollars e Dollar Generals como lojas, além de Wendy's, Burger King, McDonald's e Taco Bell. Infelizmente nada de Chick-fil-A. Os missionários mais perto da gente ficam a uma hora daqui, então estamos bem isolados. A semana foi bem boa, demos uma boa quantidade de lições, a maioria em espanhol, ainda bem, e os membros daqui querem muito ajudar nas lições, o que tem sido incrível. Eles também gostam de dar comida pra gente; talvez a gente tenha, ou não, comido 2 refeições com membros sem querer, porque a gente apareceu e eles já tinham preparado comida. O Élder Gundersen e eu nos demos bem na hora e não paramos de rir, o que nos fez pensar que íamos ser transferidos jaja. As transferências normais são na terça e, ainda bem, nós dois vamos ficar, mas os outros élderes (estamos num distrito só de élderes) vão ser substituídos de vez (whitewash). Sinceramente nada muito doido aconteceu essa semana, mas conhecemos uns caras incríveis, o Misael & o Josue. Eles queriam aprender inglês, mas quando falamos do nosso propósito e explicamos as expectativas, eles se abriram para o Evangelho e disseram que estavam procurando uma igreja. Aí no dia seguinte eles vieram, dirigindo um pouco mais de uma hora pra chegar lá! Olha a foto Mesmo tendo sido transferido, eu ainda estava perto o bastante para ir batizar nosso amigo Arnulfo! Ele estava tão feliz e pronto para começar uma nova fase da vida. Foi uma experiência super especial e ele prestou o testemunho dele, o que foi incrível demais! Los amo muchísimo y Sean excelentes! Elder Jacobs Fotos: Josue, Élder Gundersen, Misael e eu Batismo do Arnulfo! 1 de 6 caixas de morangos fresquinhos 🍓 que nosso amigo Clemente nos deu Os óculos de sol do Élder Gundersen e as habilidades dele no piano uhuul, P-day Mais desta semana"}, {"id": "l36", "area": 4, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">PEACE RIVER, FL<\/span><span class=\"pm-d\">FEV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 36 · Peace River", "title": "Azedo mas doce", "date": "2022-02-21T11:17:00", "group": "2022-02", "html": "<div class=\"body\"><p>Hemlo mis amigos<\/p>\n<p>Essa semana foi bem boa, mas, como o título sugere, difícil.<\/p>\n<p>Nossa semana começou com a gente deixando de ensinar alguns amigos. Foi bem difícil por causa do amor que temos por eles, e achávamos que estavam prontos para o batismo; mas, conforme fomos dando as lições, ficou claro que ainda não era a hora deles.<\/p>\n<p>Aí entramos no corre de encontrar pessoas: bicicleta, caminhada, amigos dos membros, basicamente tudo o que dava pra fazer. Isso trouxe uns milagres muito incríveis, em que fomos instrumentos nas mãos do Senhor.<\/p>\n<p>Todo dia essa semana encontramos 1 pessoa que precisava desesperadamente de nós. Fosse uma bênção, uma escritura ou às vezes só alguém para ouvir.<\/p>\n<p>Uma coisa engraçada que aconteceu essa semana foi quando estávamos esperando o Daniel sair pra gente conversar. Estávamos na varanda dele e, de repente, eu fiquei 30 centímetros mais baixo. Meu pé estava numa tábua podre e afundou na hora. O Élder Gundersen e eu só ficamos nos olhando por um segundo, completamente pegos de surpresa, até eu falar: \"bom, me ajuda a levantar logo!\" Jaja<\/p>\n<p>Eu dei um discurso no domingo (surpresa de última hora) e, como não me deram um tema, senti que devia falar sobre a Expiação. Que era mais ou menos o tema da reunião sacramental #revelação. Eu compartilharia, mas só tenho umas anotações rápidas/escrituras rabiscadas, porque tive 15 minutos para me preparar.<\/p>\n<p>Isaías 53:3-6, 2 Néfi 9:5-8, 1 Coríntios 15:22<\/p>\n<p class=\"sign\">Los amo y Sean excelentes!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>o shamrock shake é bom, nunca tinha provado<\/li>\n<li>reeses (não vale a pena, só pra avisar)<\/li>\n<li>si<\/li>\n<li>vídeo aleatório dessa semana<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-02-21_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-21_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-21_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_182.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_183.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_184.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_185.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Azedo mas doce Hemlo mis amigos Essa semana foi bem boa, mas, como o título sugere, difícil. Nossa semana começou com a gente deixando de ensinar alguns amigos. Foi bem difícil por causa do amor que temos por eles, e achávamos que estavam prontos para o batismo; mas, conforme fomos dando as lições, ficou claro que ainda não era a hora deles. Aí entramos no corre de encontrar pessoas: bicicleta, caminhada, amigos dos membros, basicamente tudo o que dava pra fazer. Isso trouxe uns milagres muito incríveis, em que fomos instrumentos nas mãos do Senhor. Todo dia essa semana encontramos 1 pessoa que precisava desesperadamente de nós. Fosse uma bênção, uma escritura ou às vezes só alguém para ouvir. Uma coisa engraçada que aconteceu essa semana foi quando estávamos esperando o Daniel sair pra gente conversar. Estávamos na varanda dele e, de repente, eu fiquei 30 centímetros mais baixo. Meu pé estava numa tábua podre e afundou na hora. O Élder Gundersen e eu só ficamos nos olhando por um segundo, completamente pegos de surpresa, até eu falar: \"bom, me ajuda a levantar logo!\" Jaja Eu dei um discurso no domingo (surpresa de última hora) e, como não me deram um tema, senti que devia falar sobre a Expiação. Que era mais ou menos o tema da reunião sacramental #revelação. Eu compartilharia, mas só tenho umas anotações rápidas/escrituras rabiscadas, porque tive 15 minutos para me preparar. Isaías 53:3-6, 2 Néfi 9:5-8, 1 Coríntios 15:22 Los amo y Sean excelentes! Elder Jacobs Fotos: o shamrock shake é bom, nunca tinha provado reeses (não vale a pena, só pra avisar) si vídeo aleatório dessa semana Mais desta semana"}, {"id": "l37", "area": 4, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">PEACE RIVER, FL<\/span><span class=\"pm-d\">FEV 2022<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 37 · Peace River", "title": "🐶🐺 Cachorros, noites até tarde 🌚, viagens de carro 🚙 e fumaça 🔥", "date": "2022-02-28T08:59:00", "group": "2022-02", "html": "<div class=\"body\"><p>Buenoooooos dìaaaas mis queridos amigos!<\/p>\n<p>Qué lo que?<\/p>\n<p>Tivemos uma semana incrível, com um monte de lições, e nossos amigos estão indo bem. Estamos meio que com dificuldade porque praticamente só temos amigos que falam espanhol num ramo em inglês. Os poucos membros que falam espanhol aqui são muito ocupados, mas espero que a gente encontre um jeito de superar isso e também encontre mais pessoas que falam inglês para ensinar.<\/p>\n<p>Essa semana fomos chamados para responder mensagens da página do Facebook, mas depois ligaram de novo dizendo que não vamos fazer 1 dia por semana por 3 horas, ou seja, as mensagens do horário nobre, e sim que somos a equipe da noite. Das 21h às 22h30 todas as noites ficamos em todas as páginas. Tem sido bom, às vezes meio parado, outras vezes movimentado deeemais, e o novo horário de sono, acordando e indo dormir uma hora mais tarde, é muito esquisito.<\/p>\n<p>Fui perseguido por cachorro duas vezes essa semana. Uma vez de bicicleta à noite, essa foi por pouco. Mal vi a cara dele a 15 centímetros do meu pé, aí ele percebeu e começou a latir e a correr mais. Nunca pedalei tão rápido na vida. O outro era super simpático, velho, mas enorme, então quando percebeu que a gente estava indo embora quis brincar. Ele mordia minha mão, tentava pular em mim e me puxava pelo braço com a boca rua abaixo enquanto a gente caminhava. Mais divertido, mas nojento, e minha mão ficou doendo.<\/p>\n<p>Uma coisa que comecei a perceber é que todo lugar que a gente vai é uma viagem de carro. O conselho de distrito é em Fort Myers, então é uma hora até Port Charlotte e depois mais 45 minutos de carona. Aí essa semana também tivemos divisões com Rio Vista Espanhol, que moram em Fort Myers. Fora os 30 minutos até Arcadia, e vamos lá com frequência.<\/p>\n<p>Uma vez em Arcadia essa semana, teve um incêndio enorme ali perto, então estava caindo um monte de cinza na gente e estávamos respirando aquilo. Horrível demais. O Élder Gundersen ficou com cinza no olho e tivemos que ir ao pronto atendimento. Tudo bem agora, mas rip.<\/p>\n<p>Por favor oren por nuestros amigos (por favor, orem pelos nossos amigos):<\/p>\n<p>Santos, Sharon, Nan, Edwin, Misael &amp; Josue, Sis. Cepoudy (recém-conversa), Clemente, Erasto &amp; Isaac, Maria &amp; José e Lazara.<\/p>\n<p>Traduzir na igreja ainda é difícil (os oradores quase nunca falam mais devagar nem dizem quais escrituras/citações estão usando); qualquer dica dos meus amigos que falam espanhol será muito bem-vinda. Por enquanto eu só continuo tentando, aumentando meu vocabulário e a gramática. Nosso tiwi (a caixinha boba do carro que monitora como a gente dirige; perguntem a um missionário ou pesquisem inthinc box pra saber mais) quebrou essa semana. Uhuul, mas aí consertaram.<\/p>\n<p>Fui em divisão essa semana para Fort Myers e fiquei com o Élder Nelson, meu primeiríssimo companheiro! Foi super divertido<\/p>\n<p class=\"sign\">Hasta luego, dèjenme saber qué pasao' en sus vidas! Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>#1 na liga diamante no duolingo 😎<\/li>\n<li>fazendo nosso líder de distrito falar com esses hamsters de brinquedo bobos que repetem tudo o que você diz, pelo telefone<\/li>\n<li>fumaça<\/li>\n<li>meme #poderdosacerdócio<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-02-28_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-28_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-28_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-28_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_186.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_187.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🐶🐺 Cachorros, noites até tarde 🌚, viagens de carro 🚙 e fumaça 🔥 Buenoooooos dìaaaas mis queridos amigos! Qué lo que? Tivemos uma semana incrível, com um monte de lições, e nossos amigos estão indo bem. Estamos meio que com dificuldade porque praticamente só temos amigos que falam espanhol num ramo em inglês. Os poucos membros que falam espanhol aqui são muito ocupados, mas espero que a gente encontre um jeito de superar isso e também encontre mais pessoas que falam inglês para ensinar. Essa semana fomos chamados para responder mensagens da página do Facebook, mas depois ligaram de novo dizendo que não vamos fazer 1 dia por semana por 3 horas, ou seja, as mensagens do horário nobre, e sim que somos a equipe da noite. Das 21h às 22h30 todas as noites ficamos em todas as páginas. Tem sido bom, às vezes meio parado, outras vezes movimentado deeemais, e o novo horário de sono, acordando e indo dormir uma hora mais tarde, é muito esquisito. Fui perseguido por cachorro duas vezes essa semana. Uma vez de bicicleta à noite, essa foi por pouco. Mal vi a cara dele a 15 centímetros do meu pé, aí ele percebeu e começou a latir e a correr mais. Nunca pedalei tão rápido na vida. O outro era super simpático, velho, mas enorme, então quando percebeu que a gente estava indo embora quis brincar. Ele mordia minha mão, tentava pular em mim e me puxava pelo braço com a boca rua abaixo enquanto a gente caminhava. Mais divertido, mas nojento, e minha mão ficou doendo. Uma coisa que comecei a perceber é que todo lugar que a gente vai é uma viagem de carro. O conselho de distrito é em Fort Myers, então é uma hora até Port Charlotte e depois mais 45 minutos de carona. Aí essa semana também tivemos divisões com Rio Vista Espanhol, que moram em Fort Myers. Fora os 30 minutos até Arcadia, e vamos lá com frequência. Uma vez em Arcadia essa semana, teve um incêndio enorme ali perto, então estava caindo um monte de cinza na gente e estávamos respirando aquilo. Horrível demais. O Élder Gundersen ficou com cinza no olho e tivemos que ir ao pronto atendimento. Tudo bem agora, mas rip. Por favor oren por nuestros amigos (por favor, orem pelos nossos amigos): Santos, Sharon, Nan, Edwin, Misael & Josue, Sis. Cepoudy (recém-conversa), Clemente, Erasto & Isaac, Maria & José e Lazara. Traduzir na igreja ainda é difícil (os oradores quase nunca falam mais devagar nem dizem quais escrituras/citações estão usando); qualquer dica dos meus amigos que falam espanhol será muito bem-vinda. Por enquanto eu só continuo tentando, aumentando meu vocabulário e a gramática. Nosso tiwi (a caixinha boba do carro que monitora como a gente dirige; perguntem a um missionário ou pesquisem inthinc box pra saber mais) quebrou essa semana. Uhuul, mas aí consertaram. Fui em divisão essa semana para Fort Myers e fiquei com o Élder Nelson, meu primeiríssimo companheiro! Foi super divertido Hasta luego, dèjenme saber qué pasao' en sus vidas! Los amo! Elder Jacobs Fotos: #1 na liga diamante no duolingo 😎 fazendo nosso líder de distrito falar com esses hamsters de brinquedo bobos que repetem tudo o que você diz, pelo telefone fumaça meme #poderdosacerdócio Mais desta semana"}, {"id": "l38", "area": 4, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">PEACE RIVER, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 México<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["MX"], "moments": ["Baptism", "Temple"], "extra": "Mexico", "kind": "Carta 38 · Peace River", "title": "🛤Viagem ao templo! ⛪& Una Fiesta 🥳", "date": "2022-03-07T11:14:00", "group": "2022-03", "html": "<div class=\"body\"><p>Qué tal amigos?<\/p>\n<p>Todo bien acá em Peace River. Não vou mentir, tivemos uma semana bem corrida.<\/p>\n<p>A melhor coisa dessa semana foi ir ao templo. Fomos na quarta, mas quase perdemos. Dormimos e não ouvimos o despertador das 5h, e acordamos às 6 (quando precisávamos sair) com os outros élderes com quem íamos de carona esmurrando a porta e tocando a campainha. A descarga de adrenalina foi real, e de algum jeito chegamos a tempo antes de todo mundo sair nas vans.<\/p>\n<p>Essa semana foi boa, nada muito empolgante em termos de amigos novos. Encontramos bastante gente, mas a maioria pelo Facebook e para outras áreas da missão #corredereferências<\/p>\n<p>Nosso amigo Santos está indo super bien! Ele tem aprendido muito, e ontem mesmo tivemos uma lição incrível sobre a primeira parte do plano de salvação, focando no potencial divino dele e na Expiação. Tudo se encaixou ontem à noite e ele realmente entende o seu Salvador.<\/p>\n<p>Conseguimos falar com a Nan de novo essa semana! Ela tem ficado muito em Plant City cuidando da mãe, mas também conversando com os missionários de lá. Ela decidiu que quer ser batizada! Mas estou triste porque não vou poder ver... Ah, é, vou ser transferido de emergência de novo (2ª vez). Vou para a Zona de St. Petersburg, na área Largo Espanhol B. Abrindo a área do zero (whitewash) com o Élder Schauers (ele aprendeu espanhol suficiente na missão para passar do inglês para o espanhol jajaja épico). Estou animado, mas triste de sair tão cedo. Ouvi dizer que o ramo é super incrível e a zona é bem legal, mas é triste sair de Fort Myers.<\/p>\n<p>Terminei o Livro de Mórmon em espanhol essa semana. Eu amo as últimas palavras de Morôni, 10:32-34. Foi muito incrível ver que, no começo da leitura, eu tinha muita dificuldade para entender, mas agora, 9 meses depois, prefiro ler (basicamente fazer qualquer coisa) em espanhol.<\/p>\n<p class=\"sign\">Los amo y espero que tengan una buena semana llena de milagros!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Templo<\/li>\n<li>perus<\/li>\n<li>meme que eu fiz<\/li>\n<li>RIP lasanha<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>E sobre a parte da fiesta: fomos a uma festa de aniversário mexicana da nieta (neta) de uns amigos nossos, e tinha um tanque de mergulho e várias outras coisas divertidas. Meio estranho, porque somos missionários e também tinha bebida, então vazamos cedo...<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2022-03-07_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-07_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-07_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-07_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-07_0_4.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-07_1_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-07_1_1.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_188.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_189.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_190.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_191.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_192.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_193.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_194.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_195.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_196.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_197.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🛤Viagem ao templo! ⛪& Una Fiesta 🥳 Qué tal amigos? Todo bien acá em Peace River. Não vou mentir, tivemos uma semana bem corrida. A melhor coisa dessa semana foi ir ao templo. Fomos na quarta, mas quase perdemos. Dormimos e não ouvimos o despertador das 5h, e acordamos às 6 (quando precisávamos sair) com os outros élderes com quem íamos de carona esmurrando a porta e tocando a campainha. A descarga de adrenalina foi real, e de algum jeito chegamos a tempo antes de todo mundo sair nas vans. Essa semana foi boa, nada muito empolgante em termos de amigos novos. Encontramos bastante gente, mas a maioria pelo Facebook e para outras áreas da missão #corredereferências Nosso amigo Santos está indo super bien! Ele tem aprendido muito, e ontem mesmo tivemos uma lição incrível sobre a primeira parte do plano de salvação, focando no potencial divino dele e na Expiação. Tudo se encaixou ontem à noite e ele realmente entende o seu Salvador. Conseguimos falar com a Nan de novo essa semana! Ela tem ficado muito em Plant City cuidando da mãe, mas também conversando com os missionários de lá. Ela decidiu que quer ser batizada! Mas estou triste porque não vou poder ver... Ah, é, vou ser transferido de emergência de novo (2ª vez). Vou para a Zona de St. Petersburg, na área Largo Espanhol B. Abrindo a área do zero (whitewash) com o Élder Schauers (ele aprendeu espanhol suficiente na missão para passar do inglês para o espanhol jajaja épico). Estou animado, mas triste de sair tão cedo. Ouvi dizer que o ramo é super incrível e a zona é bem legal, mas é triste sair de Fort Myers. Terminei o Livro de Mórmon em espanhol essa semana. Eu amo as últimas palavras de Morôni, 10:32-34. Foi muito incrível ver que, no começo da leitura, eu tinha muita dificuldade para entender, mas agora, 9 meses depois, prefiro ler (basicamente fazer qualquer coisa) em espanhol. Los amo y espero que tengan una buena semana llena de milagros! Elder Jacobs Fotos: Templo perus meme que eu fiz RIP lasanha E sobre a parte da fiesta: fomos a uma festa de aniversário mexicana da nieta (neta) de uns amigos nossos, e tinha um tanque de mergulho e várias outras coisas divertidas. Meio estranho, porque somos missionários e também tinha bebida, então vazamos cedo... Mais desta semana"}, {"id": "l39", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"AR\">🇦🇷 Argentina<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["VE", "AR"], "moments": ["Temple"], "extra": "Venezuela Argentina", "kind": "Carta 39 · Largo", "title": "🏟🌋 Larrrrgoooooo 🤩", "date": "2022-03-14T07:18:00", "group": "2022-03", "html": "<div class=\"body\"><p>Ola! Bon día!<\/p>\n<p>Todo bem? Bom, uma transferência de emergência e abrir uma área do zero tem sido uma experiência e tanto essa semana. O Élder Schauers, meu companheiro, é incrível, mas mesmo ele sendo o companheiro sênior, o sênior sou eu. Ele só está servindo numa área de espanhol há 5 semanas, então eu estou liderando em tudo que é em espanhol. O Élder Schauers é de Bozeman, Montana, e a gente se dá muito bem. Essa semana foi muito boa; não encontramos tantos amigos novos para ensinar nem demos uma quantidade absurda de lições, porque estamos focando muito em entrar em contato com os amigos e o ramo e criar relacionamentos. Acho que nossa paradinha rápida na casa do presidente do ramo foi boa, porque me pediram para dar um discurso no domingo. Também foi muito bom.<\/p>\n<p>Temos vários amigos, todos bem incríveis, a maioria da Venezuela, mas bem ocupados. #vidadecidadegrande Aqui estão alguns nomes:<\/p>\n<p>Endrina, Solmar, Zaher, Emilio, Juan, Juan Carlos e Blanca. Tem mais, só que ainda não tivemos contato pessoalmente.<\/p>\n<p>O Juan Carlos é novo, na verdade, então quando nos encontramos no sábado à tarde ensinamos a Restauração. Ele absorveu tudo, fez ótimas perguntas e nos disse que meio que já conhece a nossa igreja e que, pela lição, acredita nas mesmas coisas que ensinamos. Estamos animados para a semana que vem. A Endrina, a Solmar e o Zaher gostaram muito do amor do ramo e da paz que sentiram na igreja! O Juan é meio novo nessa coisa de religião, mas também está indo bem.<\/p>\n<p>Uma coisa comum que tenho visto aqui é que o ramo é muito envolvido, e tem muita gente que simplesmente aparece na igreja do nada e aí começamos a ensinar, então é incrível. Principalmente nosso 3º companheiro, o Élder Owen! Ele é da Argentina, membro há mais de 30 anos, e adora nos ajudar. Ele vem nos dias em que não está no templo e leva a gente de carro pra todo lado! 65 anos e ainda firme e forte com os missionários. Ele sente que esse é o chamado dele. O ramo também percebeu que é difícil as pessoas se sentirem amadas ou fazerem grandes mudanças na vida para viver o Evangelho se não tiverem o apoio certo! Então tem um programa para ensinar inglês, arranjar emprego, ajudar com imigração, comida etc.<\/p>\n<p>Estou amando essa área, o ramo, o companheiro, todo! A cidade grande é muito estranha depois de sair de uma área com uma população de, sei lá, 5.000? Aqui são 1 milhão em St. Petersburg e nas áreas vizinhas.<\/p>\n<p>Aqui está um discurso que eu amei essa semana:<\/p>\n<p>\"Absorvida na vontade do Pai\" Neal A. Maxwell, out. 1995<\/p>\n<p class=\"sign\">Los amo muchísimo queridos amigos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>nosso carro PZZ A55 (interpretem como quiserem jaja)<\/li>\n<li>a viagem até a área nova<\/li>\n<li>tacos de sobremesa<\/li>\n<li>Élder Owen<\/li>\n<li>alguns memes<\/li>\n<li>Zona de Fort Myers no templo semana passada<\/li>\n<li>Vídeo do desafio da zona<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-03-14_0_0.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-03-14_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-14_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-14_0_6.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-03-14_0_7.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_198.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_199.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_200.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_201.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_202.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_203.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_204.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_205.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_206.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_207.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_208.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🏟🌋 Larrrrgoooooo 🤩 Ola! Bon día! Todo bem? Bom, uma transferência de emergência e abrir uma área do zero tem sido uma experiência e tanto essa semana. O Élder Schauers, meu companheiro, é incrível, mas mesmo ele sendo o companheiro sênior, o sênior sou eu. Ele só está servindo numa área de espanhol há 5 semanas, então eu estou liderando em tudo que é em espanhol. O Élder Schauers é de Bozeman, Montana, e a gente se dá muito bem. Essa semana foi muito boa; não encontramos tantos amigos novos para ensinar nem demos uma quantidade absurda de lições, porque estamos focando muito em entrar em contato com os amigos e o ramo e criar relacionamentos. Acho que nossa paradinha rápida na casa do presidente do ramo foi boa, porque me pediram para dar um discurso no domingo. Também foi muito bom. Temos vários amigos, todos bem incríveis, a maioria da Venezuela, mas bem ocupados. #vidadecidadegrande Aqui estão alguns nomes: Endrina, Solmar, Zaher, Emilio, Juan, Juan Carlos e Blanca. Tem mais, só que ainda não tivemos contato pessoalmente. O Juan Carlos é novo, na verdade, então quando nos encontramos no sábado à tarde ensinamos a Restauração. Ele absorveu tudo, fez ótimas perguntas e nos disse que meio que já conhece a nossa igreja e que, pela lição, acredita nas mesmas coisas que ensinamos. Estamos animados para a semana que vem. A Endrina, a Solmar e o Zaher gostaram muito do amor do ramo e da paz que sentiram na igreja! O Juan é meio novo nessa coisa de religião, mas também está indo bem. Uma coisa comum que tenho visto aqui é que o ramo é muito envolvido, e tem muita gente que simplesmente aparece na igreja do nada e aí começamos a ensinar, então é incrível. Principalmente nosso 3º companheiro, o Élder Owen! Ele é da Argentina, membro há mais de 30 anos, e adora nos ajudar. Ele vem nos dias em que não está no templo e leva a gente de carro pra todo lado! 65 anos e ainda firme e forte com os missionários. Ele sente que esse é o chamado dele. O ramo também percebeu que é difícil as pessoas se sentirem amadas ou fazerem grandes mudanças na vida para viver o Evangelho se não tiverem o apoio certo! Então tem um programa para ensinar inglês, arranjar emprego, ajudar com imigração, comida etc. Estou amando essa área, o ramo, o companheiro, todo! A cidade grande é muito estranha depois de sair de uma área com uma população de, sei lá, 5.000? Aqui são 1 milhão em St. Petersburg e nas áreas vizinhas. Aqui está um discurso que eu amei essa semana: \"Absorvida na vontade do Pai\" Neal A. Maxwell, out. 1995 Los amo muchísimo queridos amigos! Elder Jacobs Fotos: nosso carro PZZ A55 (interpretem como quiserem jaja) a viagem até a área nova tacos de sobremesa Élder Owen alguns memes Zona de Fort Myers no templo semana passada Vídeo do desafio da zona Mais desta semana"}, {"id": "story", "kind": "Com minhas próprias palavras · o dom de línguas", "title": "Chamado para o português", "date": null, "group": "2022-03", "html": "<div class=\"body\"><p>Começou na minha primeira vez em Largo. Meu companheiro, o Élder Schauers, e eu tínhamos recebido uma referência on-line para visitar uma senhora. O nome dela e tudo mais pareciam normais. Mas quando chegamos na casa e batemos na porta, ela atendeu e o espanhol dela parecia meio estranho.<\/p><p>Eu fiquei confuso, mas o Élder Schauers percebeu rapidinho que era português. Ele usou o pouquinho de português que sabia para falar com ela e perguntou se ela aceitaria se encontrar com as sisters missionárias, porque uma delas sabia um pouco mais de português do que a gente e talvez pudesse ensiná-la.<\/p><p>Não sei por quê, mas depois de sair da casa dela senti que tinha falhado e fiquei meio frustrado. Conversei bastante com o Élder Schauers e simplesmente não fazia sentido. Por que fomos mandados lá se não podíamos ensiná-la? Ela queria muito aprender mais.<\/p><p>Acompanhamos com as sisters missionárias, e elas nos contaram que tinham dado uma pequena lição para ela, mas que foi difícil e não conseguiram continuar. Eu ainda sentia que devia continuar aprendendo mais sobre isso e pensando no assunto, porque aquilo realmente tocou a minha alma.<\/p><p>Então, mais tarde naquela noite, eu estava orando. Me ajoelhei pensando em tudo isso e tive a impressão de que talvez fosse hora de a missão se adaptar, e que eu podia ser um dos primeiros e precisava aprender português. E, mais especificamente, que eu tinha recebido o dom de línguas e que era hora de usá-lo de uma maneira mais elevada.<\/p><p>Não fiz muita coisa no resto da semana, porque não tinha nenhum material para estudar. Mas consegui conversar com o Élder Schauers e saber mais sobre coisas que ele tinha visto ou ouvido, e sobre as diferenças na cultura e na língua. Foi um bom primeiro passo: só ter curiosidade e continuar pensando nisso, já que nunca saiu da minha cabeça.<\/p><p>Mais tarde, tivemos que voltar ao escritório da missão para pegar mais materiais e, enquanto estava lá, perguntei se tinham algum material em português. Disseram: \"Bom, deixa eu ver\", e foram procurar. \"Ah, olha, isso aqui foi deixado ontem mesmo.\" Era um Pregar Meu Evangelho em português, e acho que tinha também um livro de gramática portuguesa e um Livro de Mórmon em português. Com esses três materiais, eu soube que devia ser a hora. Com certeza era a vontade de Deus que eu aprendesse português.<\/p><p>Aí tive que sair de Largo por um tempo. Houve mais transferências e grandes mudanças na missão, e eu fui para Brandon com outro companheiro, o Élder Huntsman. Lá, eu muitas vezes usava meu tempo de estudo de idioma para estudar só português em vez de espanhol. Foi difícil, e eu sentia que não estava melhorando. Eu sabia algumas coisas, e o Élder Huntsman e os outros missionários com quem eu conversava lá sabiam uns pedacinhos de português, mas era difícil saber se eu estava realmente aprendendo a língua sem interagir com falantes nativos. Mas eu não podia desistir. Sentia que precisava continuar, então continuei estudando o máximo que podia.<\/p><p>Depois de Brandon, fui designado para treinar um missionário em Tampa. A essa altura eu já estava razoável. Conseguia ter uma conversa bem básica e, na dúvida, usava uma palavra em espanhol, porque pareciam parecidas o bastante para funcionar.<\/p><p>Enquanto eu estava treinando em Tampa, acabamos tendo um batismo bem quando nossos presidentes de missão mudaram, dos Hollingsworth para os Gardiner. Os Gardiner chegaram e foram ao nosso batismo. Infelizmente não apareceram muitos membros, mas depois do batismo eles estavam conversando com a gente e o Presidente Gardiner reparou que minha plaquinha de missionário estava em português, porque eu tinha pedido uma algumas semanas antes.<\/p><p>Expliquei que estava aprendendo português e que sentia que era algo importante para eu aprender e fazer. Ele ficou um pouco confuso, porque achou que eu estava esperando um visto para ir servir e ensinar no Brasil. Conforme continuamos conversando, ele pareceu sentir o Espírito meio que o atingir. A expressão dele mudou de repente e ele disse: \"Vamos ter que conversar mais depois.\"<\/p><p>Então continuei o resto do meu tempo em Tampa com o Élder Dean, trabalhando em espanhol, mas aos poucos fui encontrando cada vez mais brasileiros e falantes nativos de português, e consegui me conectar com eles. Conheci até um casal na ala de inglês que era do Brasil, e eles me deram umas boas dicas e me apoiaram muito no aprendizado da língua.<\/p><p>Acabei ensinando uma família de duas pessoas por um tempo. Por causa disso, e das conversas de ida e volta com o Presidente Gardiner, conseguimos colocar as coisas em movimento e ver aonde isso poderia realmente chegar e crescer para o futuro da missão.<\/p><p>Na transferência seguinte, fui designado para treinar dois missionários ao mesmo tempo. Foi divertido, e a essa altura fizemos ainda mais coisas em português. Depois disso, fui designado para treinar outro missionário. Dessa vez eu estava com o Élder Rogers. O treinamento dele tinha acabado de terminar, mas tinha sido bem complicado: muitos treinamentos incompletos, e a qualidade de vida em geral também. A missão é difícil, mas é para você se divertir. Então, de certa forma, eu estava treinando tanto ele quanto o Élder Towne, que tinha acabado de chegar. O Élder Towne tinha sido originalmente designado para Campinas, no Brasil, e estava esperando o visto.<\/p><p>Uma curiosidade: a Missão Brasil Campinas é a mesma missão em que minha esposa, Tayna, foi chamada para servir. Essa conexão em comum, dos companheiros e da missão, foi meio que o que fez a gente começar a conversar mais tarde, quando eu já estava de volta em casa.<\/p><p>O Élder Towne foi uma grande bênção para mim, porque ele tinha vindo do CTM falando português. Assim como eu podia ajudá-lo a aprender espanhol e a ser um bom missionário, ele podia me ajudar a aprender português e a me conectar com as pessoas de um jeito diferente, porque a cultura é um pouco diferente do resto da América Latina. Com a ajuda dele, começamos de verdade a dar lições em português, e o Presidente Gardiner viu nossos esforços e ficou muito animado.<\/p><p>Tentamos começar um grupo ou ramo em português em Tampa, porque havia bastante membros na Estaca Tampa e também na Estaca Odessa, mas isso nunca chegou a se concretizar. Mais tarde fui mandado de volta para Largo e, por fim, para Fort Myers, na última parte da minha missão.<\/p><p>Foi em Fort Myers que realmente aconteceu. Decolou. Conseguimos começar um grupo. Ajudei um casal, o João e a Irene, a se casar. Eles foram super especiais para mim. Eles foram batizados, e estávamos nos preparando para ajudar os filhos deles a chegarem lá também, e para ajudá-los a ir ao templo receber a investidura. Infelizmente não consegui ir ao templo com eles, porque houve algumas complicações para levá-los até lá, e eu tive que voltar para casa.<\/p><p>Nas minhas últimas transferências em Fort Myers, meu companheiro foi o Élder Kroeger. Ele também tinha sido designado para Campinas, no Brasil, então estar com ele, ajudando com o português dele e fazendo o trabalho missionário juntos, ajudou muito a continuar aumentando minhas habilidades. Também foi legal ver que ele e o Élder Towne conseguiram se encontrar na Missão Campinas, e que lá eles conheceram a Tayna também.<\/p><p>Mas, no fim, foi incrível ver a diferença que seguir o Espírito fez: como isso abençoou minha vida na missão, e me permitiu me conectar com mais pessoas, ajudar mais pessoas a ouvir o Evangelho e ajudar a missão a crescer. Hoje a missão tem um ramo em português em Tampa e um grupo em português em Fort Myers que continua crescendo, e missionários estão sendo chamados do Brasil e de todo canto para falar português e ensinar o Evangelho nessa língua.<\/p><p>Durante toda a minha missão eu vi o dom de línguas em ação. Muitas vezes tive a oportunidade de ser o tradutor nas aulas da Escola Dominical e em outras reuniões da Igreja, traduzindo do inglês para o espanhol ou do espanhol para o português. Cada vez, isso aumentava minha capacidade e me mostrava como Deus estava abençoando meus esforços e multiplicando-os.<\/p><p>Nos últimos meses da minha missão, enquanto eu refletia sobre minhas metas e o que queria fazer quando voltasse para casa, senti a inspiração de continuar aprendendo português.<\/p><p>Então fui para a BYU, onde mais tarde me formaria em Sistemas de Informação, com minor em Português. Enquanto continuava aprendendo português, segui as inspirações do Espírito. Uma das inspirações que tive na missão foi que parte do motivo de aprender português era conhecer minha esposa.<\/p><p>A Tayna e eu nos conhecemos pelo Mutual. Conversamos um pouco, mas não levamos muito adiante. Mais ou menos um ano depois nos reconectamos, e comecei a namorar com ela em 7 de fevereiro de 2025. Em agosto daquele ano, depois de terminar meu estágio na Universidade de São Paulo, fui visitá-la e a pedi em casamento. E mais tarde nos casamos.<\/p><\/div><div class=\"quotes\"><div class=\"more-h\">Das minhas cartas<\/div><ul><li><span class=\"qd\">26 de junho de 2021<\/span>Com certeza foi difícil no começo, e ainda pode ser, mas posso testificar que o dom de línguas realmente está aí para aqueles de quem o Senhor precisa.<\/li><li><span class=\"qd\">21 de março de 2022<\/span>Não, eu não sei português, mas sei umas frases aleatórias.<\/li><li><span class=\"qd\">11 de julho de 2022<\/span>Também compartilhei uma mensagem curta com ele, e ele entendeu meu português perfeitamente.<\/li><li><span class=\"qd\">8 de agosto de 2022<\/span>Tenho orado por famílias e por jeitos de praticar mais o português, e continuo recebendo essa ajuda.<\/li><li><span class=\"qd\">16 de janeiro de 2023<\/span>Domingo foi um W enorme (W = dub = vitória), porque tivemos nossa primeira aula da Escola Dominical em português 🇧🇷 progresso com certeza, e nossos amigos ficaram muito gratos por essa adaptação e por poderem aprender muito mais.<\/li><li><span class=\"qd\">10 de abril de 2023<\/span>Tive a oportunidade de confirmar o João na reunião sacramental (eu estava super nervoso de fazer isso em português, mas Deus com certeza tem me preparado e aumentado minhas habilidades).<\/li><li><span class=\"qd\">22 de maio de 2023<\/span>Ainda tenho mais alguns dias, estou animado para ir ao templo com nossos recém-conversos fazer batismos (em português), mas, se eu quiser que vocês se lembrem de algo, é que eu amei a minha missão, servir aos outros, aprender e trabalhar duro.<\/li><\/ul><\/div>", "text": "Chamado para o português Começou na minha primeira vez em Largo. Meu companheiro, o Élder Schauers, e eu tínhamos recebido uma referência on-line para visitar uma senhora. O nome dela e tudo mais pareciam normais. Mas quando chegamos na casa e batemos na porta, ela atendeu e o espanhol dela parecia meio estranho. Eu fiquei confuso, mas o Élder Schauers percebeu rapidinho que era português. Ele usou o pouquinho de português que sabia para falar com ela e perguntou se ela aceitaria se encontrar com as sisters missionárias, porque uma delas sabia um pouco mais de português do que a gente e talvez pudesse ensiná-la. Não sei por quê, mas depois de sair da casa dela senti que tinha falhado e fiquei meio frustrado. Conversei bastante com o Élder Schauers e simplesmente não fazia sentido. Por que fomos mandados lá se não podíamos ensiná-la? Ela queria muito aprender mais. Acompanhamos com as sisters missionárias, e elas nos contaram que tinham dado uma pequena lição para ela, mas que foi difícil e não conseguiram continuar. Eu ainda sentia que devia continuar aprendendo mais sobre isso e pensando no assunto, porque aquilo realmente tocou a minha alma. Então, mais tarde naquela noite, eu estava orando. Me ajoelhei pensando em tudo isso e tive a impressão de que talvez fosse hora de a missão se adaptar, e que eu podia ser um dos primeiros e precisava aprender português. E, mais especificamente, que eu tinha recebido o dom de línguas e que era hora de usá-lo de uma maneira mais elevada. Não fiz muita coisa no resto da semana, porque não tinha nenhum material para estudar. Mas consegui conversar com o Élder Schauers e saber mais sobre coisas que ele tinha visto ou ouvido, e sobre as diferenças na cultura e na língua. Foi um bom primeiro passo: só ter curiosidade e continuar pensando nisso, já que nunca saiu da minha cabeça. Mais tarde, tivemos que voltar ao escritório da missão para pegar mais materiais e, enquanto estava lá, perguntei se tinham algum material em português. Disseram: \"Bom, deixa eu ver\", e foram procurar. \"Ah, olha, isso aqui foi deixado ontem mesmo.\" Era um Pregar Meu Evangelho em português, e acho que tinha também um livro de gramática portuguesa e um Livro de Mórmon em português. Com esses três materiais, eu soube que devia ser a hora. Com certeza era a vontade de Deus que eu aprendesse português. Aí tive que sair de Largo por um tempo. Houve mais transferências e grandes mudanças na missão, e eu fui para Brandon com outro companheiro, o Élder Huntsman. Lá, eu muitas vezes usava meu tempo de estudo de idioma para estudar só português em vez de espanhol. Foi difícil, e eu sentia que não estava melhorando. Eu sabia algumas coisas, e o Élder Huntsman e os outros missionários com quem eu conversava lá sabiam uns pedacinhos de português, mas era difícil saber se eu estava realmente aprendendo a língua sem interagir com falantes nativos. Mas eu não podia desistir. Sentia que precisava continuar, então continuei estudando o máximo que podia. Depois de Brandon, fui designado para treinar um missionário em Tampa. A essa altura eu já estava razoável. Conseguia ter uma conversa bem básica e, na dúvida, usava uma palavra em espanhol, porque pareciam parecidas o bastante para funcionar. Enquanto eu estava treinando em Tampa, acabamos tendo um batismo bem quando nossos presidentes de missão mudaram, dos Hollingsworth para os Gardiner. Os Gardiner chegaram e foram ao nosso batismo. Infelizmente não apareceram muitos membros, mas depois do batismo eles estavam conversando com a gente e o Presidente Gardiner reparou que minha plaquinha de missionário estava em português, porque eu tinha pedido uma algumas semanas antes. Expliquei que estava aprendendo português e que sentia que era algo importante para eu aprender e fazer. Ele ficou um pouco confuso, porque achou que eu estava esperando um visto para ir servir e ensinar no Brasil. Conforme continuamos conversando, ele pareceu sentir o Espírito meio que o atingir. A expressão dele mudou de repente e ele disse: \"Vamos ter que conversar mais depois.\" Então continuei o resto do meu tempo em Tampa com o Élder Dean, trabalhando em espanhol, mas aos poucos fui encontrando cada vez mais brasileiros e falantes nativos de português, e consegui me conectar com eles. Conheci até um casal na ala de inglês que era do Brasil, e eles me deram umas boas dicas e me apoiaram muito no aprendizado da língua. Acabei ensinando uma família de duas pessoas por um tempo. Por causa disso, e das conversas de ida e volta com o Presidente Gardiner, conseguimos colocar as coisas em movimento e ver aonde isso poderia realmente chegar e crescer para o futuro da missão. Na transferência seguinte, fui designado para treinar dois missionários ao mesmo tempo. Foi divertido, e a essa altura fizemos ainda mais coisas em português. Depois disso, fui designado para treinar outro missionário. Dessa vez eu estava com o Élder Rogers. O treinamento dele tinha acabado de terminar, mas tinha sido bem complicado: muitos treinamentos incompletos, e a qualidade de vida em geral também. A missão é difícil, mas é para você se divertir. Então, de certa forma, eu estava treinando tanto ele quanto o Élder Towne, que tinha acabado de chegar. O Élder Towne tinha sido originalmente designado para Campinas, no Brasil, e estava esperando o visto. Uma curiosidade: a Missão Brasil Campinas é a mesma missão em que minha esposa, Tayna, foi chamada para servir. Essa conexão em comum, dos companheiros e da missão, foi meio que o que fez a gente começar a conversar mais tarde, quando eu já estava de volta em casa. O Élder Towne foi uma grande bênção para mim, porque ele tinha vindo do CTM falando português. Assim como eu podia ajudá-lo a aprender espanhol e a ser um bom missionário, ele podia me ajudar a aprender português e a me conectar com as pessoas de um jeito diferente, porque a cultura é um pouco diferente do resto da América Latina. Com a ajuda dele, começamos de verdade a dar lições em português, e o Presidente Gardiner viu nossos esforços e ficou muito animado. Tentamos começar um grupo ou ramo em português em Tampa, porque havia bastante membros na Estaca Tampa e também na Estaca Odessa, mas isso nunca chegou a se concretizar. Mais tarde fui mandado de volta para Largo e, por fim, para Fort Myers, na última parte da minha missão. Foi em Fort Myers que realmente aconteceu. Decolou. Conseguimos começar um grupo. Ajudei um casal, o João e a Irene, a se casar. Eles foram super especiais para mim. Eles foram batizados, e estávamos nos preparando para ajudar os filhos deles a chegarem lá também, e para ajudá-los a ir ao templo receber a investidura. Infelizmente não consegui ir ao templo com eles, porque houve algumas complicações para levá-los até lá, e eu tive que voltar para casa. Nas minhas últimas transferências em Fort Myers, meu companheiro foi o Élder Kroeger. Ele também tinha sido designado para Campinas, no Brasil, então estar com ele, ajudando com o português dele e fazendo o trabalho missionário juntos, ajudou muito a continuar aumentando minhas habilidades. Também foi legal ver que ele e o Élder Towne conseguiram se encontrar na Missão Campinas, e que lá eles conheceram a Tayna também. Mas, no fim, foi incrível ver a diferença que seguir o Espírito fez: como isso abençoou minha vida na missão, e me permitiu me conectar com mais pessoas, ajudar mais pessoas a ouvir o Evangelho e ajudar a missão a crescer. Hoje a missão tem um ramo em português em Tampa e um grupo em português em Fort Myers que continua crescendo, e missionários estão sendo chamados do Brasil e de todo canto para falar português e ensinar o Evangelho nessa língua. Durante toda a minha missão eu vi o dom de línguas em ação. Muitas vezes tive a oportunidade de ser o tradutor nas aulas da Escola Dominical e em outras reuniões da Igreja, traduzindo do inglês para o espanhol ou do espanhol para o português. Cada vez, isso aumentava minha capacidade e me mostrava como Deus estava abençoando meus esforços e multiplicando-os. Nos últimos meses da minha missão, enquanto eu refletia sobre minhas metas e o que queria fazer quando voltasse para casa, senti a inspiração de continuar aprendendo português. Então fui para a BYU, onde mais tarde me formaria em Sistemas de Informação, com minor em Português. Enquanto continuava aprendendo português, segui as inspirações do Espírito. Uma das inspirações que tive na missão foi que parte do motivo de aprender português era conhecer minha esposa. A Tayna e eu nos conhecemos pelo Mutual. Conversamos um pouco, mas não levamos muito adiante. Mais ou menos um ano depois nos reconectamos, e comecei a namorar com ela em 7 de fevereiro de 2025. Em agosto daquele ano, depois de terminar meu estágio na Universidade de São Paulo, fui visitá-la e a pedi em casamento. E mais tarde nos casamos. Das minhas cartas 26 de junho de 2021 Com certeza foi difícil no começo, e ainda pode ser, mas posso testificar que o dom de línguas realmente está aí para aqueles de quem o Senhor precisa. 21 de março de 2022 Não, eu não sei português, mas sei umas frases aleatórias. 11 de julho de 2022 Também compartilhei uma mensagem curta com ele, e ele entendeu meu português perfeitamente. 8 de agosto de 2022 Tenho orado por famílias e por jeitos de praticar mais o português, e continuo recebendo essa ajuda. 16 de janeiro de 2023 Domingo foi um W enorme (W = dub = vitória), porque tivemos nossa primeira aula da Escola Dominical em português 🇧🇷 progresso com certeza, e nossos amigos ficaram muito gratos por essa adaptação e por poderem aprender muito mais. 10 de abril de 2023 Tive a oportunidade de confirmar o João na reunião sacramental (eu estava super nervoso de fazer isso em português, mas Deus com certeza tem me preparado e aumentado minhas habilidades). 22 de maio de 2023 Ainda tenho mais alguns dias, estou animado para ir ao templo com nossos recém-conversos fazer batismos (em português), mas, se eu quiser que vocês se lembrem de algo, é que eu amei a minha missão, servir aos outros, aprender e trabalhar duro."}, {"id": "l40", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 México<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><\/div>", "cultures": ["MX", "BR"], "moments": [], "extra": "Mexico Brazil", "kind": "Carta 40 · Largo", "title": "🛹 corre de encontrar pessoas, mas ainda bem incrível 🐑", "date": "2022-03-21T10:53:00", "group": "2022-03", "html": "<div class=\"body\"><p>Bom día! Não, eu não sei português, mas sei umas frases aleatórias. Quem sabe no futuro.<\/p>\n<p>Essa semana foi bem boa no geral, mas com certeza difícil. Começamos a semana bem, mas aí tivemos que parar de ensinar a maioria dos nossos amigos...<\/p>\n<p>Os amigos que mantivemos estão indo super bem; ainda é uma batalha para eles fazerem as mudanças necessárias para seguir o Evangelho, mas estão tentando.<\/p>\n<p>Temos aprendido muito sobre como e quando encontrar pessoas e ser o mais eficazes possível.<\/p>\n<p>Nos divertimos essa semana fazendo uns vídeos para a página do Facebook da aula de inglês gratuita que a missão organiza, além de todas as outras palhaçadas.<\/p>\n<p>Palhaçadas tipo: comecei a aprender a andar de tech deck e também de skate de verdade, mas é um processo. Nosso amigo Juan Carlos foi à igreja em inglês porque era mais perto, e ele não fala muito inglês. Isso que é fé e obras. Vamos vê-lo semana que vem no nosso ramo, já que finalmente arrumamos uma carona.<\/p>\n<p>Outras coisas divertidas que aconteceram: fizemos um contato na rua e fomos parar numa carne asada (churrasco mexicano) muito boa; noite de jogos do quórum de élderes (no fim das contas, dominó é um jogo muito popular entre os latinos, e eles eram selvagens jogando); o Élder Schauers está aprendendo muito espanhol para quem só tem 6 semanas como missionário de espanhol (meu filho de 30 anos que agora está aprendendo a falar, como a gente gosta de brincar, já que antes ele servia em inglês); e ganhamos de um membro umas frutas muito gostosas (umas bolinhas laranjas, não lembro como ele chamou).<\/p>\n<p>Buena suerte amigos, los amo y oro cada día por ustedes,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Almoço no Walmart<\/li>\n<li>Hora da arepa<\/li>\n<li>bastidores dos nossos vídeos da aula de inglês<\/li>\n<li>lluvia<\/li>\n<li>manobra de tech deck jejee<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-03-21_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-21_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-21_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-21_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-21_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_209.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_210.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_211.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_212.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_213.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_214.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_215.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🛹 corre de encontrar pessoas, mas ainda bem incrível 🐑 Bom día! Não, eu não sei português, mas sei umas frases aleatórias. Quem sabe no futuro. Essa semana foi bem boa no geral, mas com certeza difícil. Começamos a semana bem, mas aí tivemos que parar de ensinar a maioria dos nossos amigos... Os amigos que mantivemos estão indo super bem; ainda é uma batalha para eles fazerem as mudanças necessárias para seguir o Evangelho, mas estão tentando. Temos aprendido muito sobre como e quando encontrar pessoas e ser o mais eficazes possível. Nos divertimos essa semana fazendo uns vídeos para a página do Facebook da aula de inglês gratuita que a missão organiza, além de todas as outras palhaçadas. Palhaçadas tipo: comecei a aprender a andar de tech deck e também de skate de verdade, mas é um processo. Nosso amigo Juan Carlos foi à igreja em inglês porque era mais perto, e ele não fala muito inglês. Isso que é fé e obras. Vamos vê-lo semana que vem no nosso ramo, já que finalmente arrumamos uma carona. Outras coisas divertidas que aconteceram: fizemos um contato na rua e fomos parar numa carne asada (churrasco mexicano) muito boa; noite de jogos do quórum de élderes (no fim das contas, dominó é um jogo muito popular entre os latinos, e eles eram selvagens jogando); o Élder Schauers está aprendendo muito espanhol para quem só tem 6 semanas como missionário de espanhol (meu filho de 30 anos que agora está aprendendo a falar, como a gente gosta de brincar, já que antes ele servia em inglês); e ganhamos de um membro umas frutas muito gostosas (umas bolinhas laranjas, não lembro como ele chamou). Buena suerte amigos, los amo y oro cada día por ustedes, Elder Jacobs Fotos: Almoço no Walmart Hora da arepa bastidores dos nossos vídeos da aula de inglês lluvia manobra de tech deck jejee Mais desta semana"}, {"id": "l41", "area": 5, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">MAR 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HN\">🇭🇳 Honduras<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["HN"], "moments": ["Baptism"], "extra": "Honduras", "kind": "Carta 41 · Largo", "title": "🎪Bienvenidos a payaso-ville🤡", "date": "2022-03-28T07:15:00", "group": "2022-03", "html": "<div class=\"body\"><p>População: nós<\/p>\n<p>Buenas buenas buenas! Queridos amigos ¿que lo que?<\/p>\n<p>Contexto: payaso quer dizer palhaço, e eu e meu companheiro nos declaramos palhaços por causa das bobeiras absurdas que a gente faz<\/p>\n<p>Nossa semana foi incrível demais e realmente mostrou nossos esforços dando resultado, porque aconteceu muita coisa!<\/p>\n<p>Noite familiar com o presidente do ramo, e cantamos \"Seu Lobato\"; essa música é muuuito mais longa do que eu lembrava. Mas tudo certo, tivemos uma atividade e uma lição divertidas, e espero que as crianças tenham nos entendido e não ficado muito distraídas. Encontramos uma família essa semana e, mais para o fim da semana, marcamos uma data de batismo para eles! Eles são Catrachos (de Honduras 🇭🇳) e super abertos a ouvir sobre o Evangelho. Estamos animados para vê-los progredir mais.<\/p>\n<p>Nosso amigo Juan está muito melhor essa semana. Ele estava sofrendo muito com problemas de saúde e precisava ir ao médico, mas a vaga mais próxima era só em maio, e ele tinha dificuldade para conseguir porque o inglês dele não é perfeito. Então, quando fomos ensinar, também tentamos ligar por ele e perguntar se tinha algum cancelamento, e tinha! Para daqui a uma semana, contando de hoje, enquanto mando este e-mail. Ele ficou muito grato, e com certeza foi um milagre para todos nós. Na lição, ele também acabou ensinando a Restauração pra gente, porque lembrava dela e percebeu o quanto é importante, e está ficando animado para a Conferência Geral. Também tivemos uma lição 🔥 com a Endrina, o Zaher e o Carlos (marido da Solmar; ela não estava, infelizmente). Levamos 2 membros com a gente e basicamente ensinamos sobre famílias eternas, deixamos os membros despejarem testemunho neles e aí vazamos, deixando eles querendo mais. A Endrina acabou vindo à igreja também, com o filho de 2 anos, o Lucas; ele dá trabalho, mas é muito fofo! A igreja foi incrível essa semana por um monte de motivos: o Juan Carlos foi de novo à ala em inglês porque não consegue carona até Largo, mas sabe que a igreja é importante; o Rafael foi batizado (amigo das hermanas, mas também nosso, ele ama a gente!); nosso amigo Washington veio ao batismo, à igreja, e tivemos uma lição depois da igreja (ele nos perguntou durante o batismo se podia ser batizado no aniversário dele, dia 22 de abril, estamos muuuito empolgados!); e outros amigos vieram à igreja. Dia bom. É do Washington que eu quero muito falar hoje. Ele se encontrou com os missionários 40 anos atrás e ia ser batizado, mas aí ficou ocupado e se mudou. Ele já tem muita fé e quer ser batizado porque não pode perder a oportunidade de novo. Não percam suas oportunidades, porque Deus realmente está tentando nos ajudar e abençoar, mas muitas vezes nos distraímos com coisas menores ou tentações; então sigam o exemplo do Washington e o conselho desta escritura.<\/p>\n<p>1 Néfi 10:19<\/p>\n<p>Notícias de transferência: eu vou ficar, mas o Élder Schauers, muito infelizmente, vai para Rio Vista, em Fort Myers. Mucho amor,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Amigo Washington na igreja<\/li>\n<li>Adesivo engraçado que vimos<\/li>\n<li>Cavalão gigaaante<\/li>\n<li>Mega pizza<\/li>\n<li>hora do suco<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2022-03-28_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-28_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-28_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-03-28_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-03-28_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_216.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_217.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_218.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_219.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_220.jpg\" alt=\"\"><\/fig
