inamento, a área/zona vizinha acima de nós foi fechada para o espanhol. Agora cobrimos Odessa também, por enquanto. RIP nossas milhas e nosso tempo dirigindo.<\/p>\n<p>Na segunda, dei alguns dos meus últimos tchaus para a querida família Hernández Avalrez, junto com muita arrumação de mala naquela noite. Foi bom poder estar com os outros élderes no P-day e com uma das minhas famílias favoritas que conheci em Brandon. Terça foi dia de transferências, como sempre, e tiramos algumas fotos antes de dizer tchau aos meus antigos companheiros e a alguns missionários que estavam indo pra casa (RIP meu pai, Élder Nelson). O resto do dia foi corrido, tentando me instalar e também ensinar e encontrar pessoas à noite.<\/p>\n<p>Aqui também tem aula de inglês, tenho quase certeza de que praticamente toda área tem. Então pude dar a aula na quarta à noite. Também tem a noite de futebol, mas por causa do que aconteceu na Suprema Corte havia possibilidade de protestos e fomos avisados para ficar em casa. Isso foi meio chato... bem chato... a gente tinha uns planos bons, mas teve que replanejar. O domingo foi muito bom. Alguns amigos foram à igreja, foram muito bem acolhidos, e encontramos uns membros incríveis para levar às lições. Também pediram que nós, junto com os outros élderes, prestássemos nosso testemunho, já que um dos oradores não pôde ir. Gostei muito disso, porque significou que eu pude me apresentar um pouco mais. Falei sobre o filho pródigo e o amor de Deus, principalmente porque é verdade mesmo. Podemos sair em busca de mais bênçãos, paz e alegria, mas no fim só Deus e o amor Dele serão o melhor. Amo essa parábola e essa verdade simples: o amor de Deus é incondicional, mas Ele também quer que nos tornemos melhores.<\/p>\n<p>No momento, as \"comportas abertas\" são os outros élderes e a quantidade enorme de referências. Eles saem para encontrar pessoas, falam com todo mundo e mandam pra gente toda pessoa que fala espanhol, o que nos faz fazer um monte de ligações e visitas. É loucura, e a maioria realmente quer conversar, foi assim que encontramos a Maria.<\/p>\n<p>Estes são nossos amigos atuais, se vocês puderem orar por eles:<\/p>\n<ul class=\"bul\">\n<li>Ada &amp; Julian<\/li>\n<li>Alan<\/li>\n<li>Carlos<\/li>\n<li>Blanca<\/li>\n<li>Margarita<\/li>\n<li>Luis Enrique<\/li>\n<li>Maria (ela foi uma referência e já assistiu ao filme da Restauração!)<\/li>\n<li>Greisy, Omar, &amp; Veronica<\/li>\n<li>Letty<\/li>\n<li>Guadalina<\/li>\n<li>Dary<\/li>\n<\/ul>\n<p class=\"sign\">Los amo y espero por su mensaje y como fue su Semana! Pasta luego!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Selfies do Élder Dean &amp; eu<\/li>\n<li>Dando tchau pro Élder Nelson<\/li>\n<li>Família Hernández Avalrez<\/li>\n<li>Alexis<\/li>\n<li>guaxinim<\/li>\n<li>Sapatos no freezer (disseram que a gente podia estar com percevejos, então começamos a tomar precauções. Vamos ver se temos, porque até agora não vimos nem sentimos nada. RIP os outros élderes que estão com eles agora)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-06-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-06-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-06-27_0_7.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_318.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_319.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_320.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_321.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_322.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_323.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_324.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_325.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_326.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_327.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_328.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "👾Capítulo 8 (8ª área): comportas abertas🏄‍♂️ Bom día meus queridos amigos, Como vôces están? Cheguei na cidade grande. A boa e velha Tampa Bay, e tem sido outra coisa. Minha última área maior (em população) foi Largo, também conhecida como St. Pete, e esta área é ainda maior e bem mais concentrada. Uma grande surpresa que eu e meu companheiro, o Élder Dean, não esperávamos foi a possibilidade de cobrir mais do que a nossa estaca. Por causa da quantidade de missionários de espanhol, das áreas e dos missionários ainda em treinamento, a área/zona vizinha acima de nós foi fechada para o espanhol. Agora cobrimos Odessa também, por enquanto. RIP nossas milhas e nosso tempo dirigindo. Na segunda, dei alguns dos meus últimos tchaus para a querida família Hernández Avalrez, junto com muita arrumação de mala naquela noite. Foi bom poder estar com os outros élderes no P-day e com uma das minhas famílias favoritas que conheci em Brandon. Terça foi dia de transferências, como sempre, e tiramos algumas fotos antes de dizer tchau aos meus antigos companheiros e a alguns missionários que estavam indo pra casa (RIP meu pai, Élder Nelson). O resto do dia foi corrido, tentando me instalar e também ensinar e encontrar pessoas à noite. Aqui também tem aula de inglês, tenho quase certeza de que praticamente toda área tem. Então pude dar a aula na quarta à noite. Também tem a noite de futebol, mas por causa do que aconteceu na Suprema Corte havia possibilidade de protestos e fomos avisados para ficar em casa. Isso foi meio chato... bem chato... a gente tinha uns planos bons, mas teve que replanejar. O domingo foi muito bom. Alguns amigos foram à igreja, foram muito bem acolhidos, e encontramos uns membros incríveis para levar às lições. Também pediram que nós, junto com os outros élderes, prestássemos nosso testemunho, já que um dos oradores não pôde ir. Gostei muito disso, porque significou que eu pude me apresentar um pouco mais. Falei sobre o filho pródigo e o amor de Deus, principalmente porque é verdade mesmo. Podemos sair em busca de mais bênçãos, paz e alegria, mas no fim só Deus e o amor Dele serão o melhor. Amo essa parábola e essa verdade simples: o amor de Deus é incondicional, mas Ele também quer que nos tornemos melhores. No momento, as \"comportas abertas\" são os outros élderes e a quantidade enorme de referências. Eles saem para encontrar pessoas, falam com todo mundo e mandam pra gente toda pessoa que fala espanhol, o que nos faz fazer um monte de ligações e visitas. É loucura, e a maioria realmente quer conversar, foi assim que encontramos a Maria. Estes são nossos amigos atuais, se vocês puderem orar por eles: Ada & Julian Alan Carlos Blanca Margarita Luis Enrique Maria (ela foi uma referência e já assistiu ao filme da Restauração!) Greisy, Omar, & Veronica Letty Guadalina Dary Los amo y espero por su mensaje y como fue su Semana! Pasta luego! Elder Jacobs Fotos: Selfies do Élder Dean & eu Dando tchau pro Élder Nelson Família Hernández Avalrez Alexis guaxinim Sapatos no freezer (disseram que a gente podia estar com percevejos, então começamos a tomar precauções. Vamos ver se temos, porque até agora não vimos nem sentimos nada. RIP os outros élderes que estão com eles agora) Mais desta semana"}, {"id": "l55", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 55 · Tampa", "title": "✨️🇺🇲Feliz Día de Independencia🎆🎇", "date": "2022-07-04T11:46:00", "group": "2022-07", "html": "<div class=\"body\"><p>Feliz 4 de Julho, amigos!<\/p>\n<p>Espero que vocês curtam o dia de hoje com uns fogos de artifício legais, churrasco, família, amigos etc.<\/p>\n<p>Me contem as novidades por e-mail, Messenger (só pra avisar, eu não posso responder) ou me mandem umas fotos. Infelizmente não podemos usar nenhum tipo de fogos de artifício, mas estamos planejando ir a algum lugar comer churrasco com o distrito hoje. Bom, esta semana foi meio difícil, a quantidade enorme de trabalho (ou seja, referências) chegando foi um pouco estressante, mas sobrevivemos, demos um jeito de fazer tudo funcionar e podemos descansar um pouco hoje pra garantir que vamos conseguir de novo nesta semana. Nossos amigos estão indo muito bem, a Letty quer ser batizada!<\/p>\n<p>Ensinamos ela na segunda à noite. Ela mora com um membro e a família dele, então fomos lá na segunda, comemos umas baliadas incríveis e depois ensinamos. Falamos sobre a árvore da vida e também sobre o Evangelho (fé, arrependimento, batismo, Espírito Santo e perseverar até o fim). Estamos animados por ela, só precisamos achar um horário mais fixo pra nos encontrarmos, mas ela está lendo muito o Livro de Mórmon.<\/p>\n<p>Na terça fiz minha primeira divisão como líder de distrito. O Élder Huffaker, de South Tampa, veio comigo para falar espanhol. Foi bem divertido, que bom que vou poder fazer mais nas próximas semanas. Ele está trabalhando no espanhol dele para tentar ajudar mais! A aula de inglês desta semana foi muito boa, veio mais gente. Uma delas foi meu novo amigo, Diogo (Gee-o-goo), que, caso vocês não tenham percebido, não é como se pronunciaria o nome dele em espanhol: ele fala português. Por sorte eu tinha começado a aprender português um tempo atrás, então consegui ensinar inglês pra ele. Ele é muito gente boa e estou animado pra continuar aprendendo mais português com ele e ensinando inglês pra ele.<\/p>\n<p>Bebi um coco fresco inteiro 🥥 e ensinamos a senhora que nos deu os cocos. Também consegui me encontrar com a Maria! Ela queria muito se encontrar com a gente, mas precisávamos de um homem para ir junto e poder entrar na casa dela. Foi uma lição de fogo sobre o plano de salvação e mal posso esperar pra ver o que acontece nesta quarta.<\/p>\n<p>Infelizmente não teve futebol na sexta à noite. Acho que é a minha sorte. Em 6 semanas em Largo nunca aconteceu, e em 18 em Cypress Gardens aconteceu 1 ou 2 vezes. Tomara que logo!<\/p>\n<p>Nada muito mais pra contar de sábado ou domingo, só que temos ligado ou passado na casa das referências e vimos uns milagres incríveis de pessoas procurando desesperadamente uma igreja ou algum tipo de luz, e então a gente chega e ajuda.<\/p>\n<p>Aprendi muito sobre como o Senhor nos prepara e prepara um caminho para fazermos a obra Dele. Consegui começar a usar mais o meu português e melhorá-lo, fiquei sobrecarregado com a quantidade de trabalho e então comecei a confiar no Espírito, me preocupei com o ensino e encontrei um jeito de ensinar de forma simples e poderosa etc. Minha missão gravou muitas escrituras em mim, e eu também testifico com Néfi:<\/p>\n<p>Eu irei e cumprirei as ordens do Senhor, porque sei que o Senhor nunca dá ordens aos filhos dos homens sem antes preparar um caminho pelo qual suas ordens possam ser cumpridas Néfi 3:7<\/p>\n<p class=\"sign\">Los amo muito meus amigos, bom día!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos<\/p>\n<ul class=\"bul\">\n<li>Diogo na igreja com a gente!<\/li>\n<li>APs &amp; Irmão Benicio<\/li>\n<li>meme<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-07-04_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-04_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-04_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_329.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_330.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_331.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_332.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "✨️🇺🇲Feliz Día de Independencia🎆🎇 Feliz 4 de Julho, amigos! Espero que vocês curtam o dia de hoje com uns fogos de artifício legais, churrasco, família, amigos etc. Me contem as novidades por e-mail, Messenger (só pra avisar, eu não posso responder) ou me mandem umas fotos. Infelizmente não podemos usar nenhum tipo de fogos de artifício, mas estamos planejando ir a algum lugar comer churrasco com o distrito hoje. Bom, esta semana foi meio difícil, a quantidade enorme de trabalho (ou seja, referências) chegando foi um pouco estressante, mas sobrevivemos, demos um jeito de fazer tudo funcionar e podemos descansar um pouco hoje pra garantir que vamos conseguir de novo nesta semana. Nossos amigos estão indo muito bem, a Letty quer ser batizada! Ensinamos ela na segunda à noite. Ela mora com um membro e a família dele, então fomos lá na segunda, comemos umas baliadas incríveis e depois ensinamos. Falamos sobre a árvore da vida e também sobre o Evangelho (fé, arrependimento, batismo, Espírito Santo e perseverar até o f m Néfi: Eu irei e cumprirei as ordens do Senhor, porque sei que o Senhor nunca dá ordens aos filhos dos homens sem antes preparar um caminho pelo qual suas ordens possam ser cumpridas Néfi 3:7 Los amo muito meus amigos, bom día! Elder Jacobs Fotos Diogo na igreja com a gente! APs & Irmão Benicio meme Mais desta semana"}, {"id": "l56", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Carta 56 · Tampa", "title": "🧉A Vida dum missioneiro é boa 🐲", "date": "2022-07-11T07:40:00", "group": "2022-07", "html": "<div class=\"body\"><p>Ola e bom día meus queridos amigos! Estou aquí na cidade de Tampa desfrutando todo, todo bem!<\/p>\n<p>Esta semana foi incrível principalmente por 2 coisas. 1. Levei uma bronca bem forte do Espírito e de algumas outras influências, e 2. As mudanças que fiz depois trouxeram alguns milagres. Isso é realmente algo difícil de aceitar, e, nossa, como foi na segunda, mas depois de algumas horas e no dia seguinte eu realmente senti aquela tristeza segundo Deus e me senti muito aliviado por me arrepender e fazer as mudanças. Sei que a correção é difícil de aceitar, mas no fim é necessária.<\/p>\n<p>8 Mas sempre que se arrependiam e procuravam perdão com real intenção, eram perdoados.<\/p>\n<p>Morôni 6:8<\/p>\n<p>Enfim, vamos às coisas que aconteceram, além do português no começo do e-mail, porque estou aprendendo e tem ido bem esta semana.<\/p>\n<p>Fiz uma divisão com os líderes de zona 😳 brincadeira, foi de boa. Eu ensinei tudo, já que eles não falam espanhol, mas eles entendem uma coisa ou outra de liderança, então foi útil pra saber como ajudar melhor meu distrito. Tivemos conferência de zona e focamos em algumas ferramentas e coisas-chave para nos ajudar a ser mestres no ensino. Ensinar como os anjos. (1 Néfi 11)<\/p>\n<p>O Diogo respondeu um monte das minhas perguntas sobre português e eu ensinei inglês pra ele. Também compartilhei uma mensagem curta com ele e ele entendeu meu português perfeitamente. Aos pocos!<\/p>\n<p>Muito ensino esta semana e foi incrível. Começamos a ensinar uma família pequena, e eles foram à igreja no domingo, amaram demais e ainda têm um monte de amigos membros. Estou animado pra ver eles seguirem em frente. Tivemos 7 amigos na igreja, foi uma loucura tentar falar com todos e acomodar todo mundo. Sei que o Livro de Mórmon é a palavra de Deus e que ele testifica com muito poder da verdade em todas as línguas. Deus é um Pai eterno e amoroso que quer nos ajudar, e é por isso que fomos abençoados com o sacrifício do Seu Filho. Esse sacrifício não é um curativo que serve pra tudo; é um dom infinitamente poderoso, feito sob medida e disponível para todos, que só precisamos alcançar e usar. Como élder, amigo, irmão etc., presto meu testemunho inegável dessas coisas e nunca vou negá-lo, em nome de Jesus Cristo, amém.<\/p>\n<p>Os amo a todos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>parceiro do lixo<\/li>\n<li>frango enrolado no bacon (churrasco brasileiro)<\/li>\n<li>Charlie (valeu pela foto, família!)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-07-11_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-11_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-11_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_333.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🧉A Vida dum missioneiro é boa 🐲 Ola e bom día meus queridos amigos! Estou aquí na cidade de Tampa desfrutando todo, todo bem! Esta semana foi incrível principalmente por 2 coisas. 1. Levei uma bronca bem forte do Espírito e de algumas outras influências, e 2. As mudanças que fiz depois trouxeram alguns milagres. Isso é realmente algo difícil de aceitar, e, nossa, como foi na segunda, mas depois de algumas horas e no dia seguinte eu realmente senti aquela tristeza segundo Deus e me senti muito aliviado por me arrepender e fazer as mudanças. Sei que a correção é difícil de aceitar, mas no fim é necessária. 8 Mas sempre que se arrependiam e procuravam perdão com real intenção, eram perdoados. Morôni 6:8 Enfim, vamos às coisas que aconteceram, além do português no começo do e-mail, porque estou aprendendo e tem ido bem esta semana. Fiz uma divisão com os líderes de zona 😳 brincadeira, foi de boa. Eu ensinei tudo, já que eles não falam espanhol, mas eles entendem uma coisa ou outra de liderança, então foi útil pra saber como ajudar melhor meu distrito. Tivemos conferência de zona e focamos em algumas ferramentas e coisas-chave para nos ajudar a ser mestres no ensino. Ensinar como os anjos. (1 Néfi 11) O Diogo respondeu um monte das minhas perguntas sobre português e eu ensinei inglês pra ele. Também compartilhei uma mensagem curta com ele e ele entendeu meu português perfeitamente. Aos pocos! Muito ensino esta semana e foi incrível. Começamos a ensinar uma família pequena, e eles foram à igreja no domingo, amaram demais e ainda têm um monte de amigos membros. Estou animado pra ver eles seguirem em frente. Tivemos 7 amigos na igreja, foi uma loucura tentar falar com todos e acomodar todo mundo. Sei que o Livro de Mórmon é a palavra de Deus e que ele testifica com muito poder da verdade em todas as línguas. Deus é um Pai eterno e amoroso que quer nos ajudar, e é por isso que fomos abençoados com o sacrifício do Seu Filho. Esse sacrifício não é um curativo que serve pra tudo; é um dom infinitamente poderoso, feito sob medida e disponível para todos, que só precisamos alcançar e usar. Como élder, amigo, irmão etc., presto meu testemunho inegável dessas coisas e nunca vou negá-lo, em nome de Jesus Cristo, amém. Os amo a todos! Elder Jacobs Fotos: parceiro do lixo frango enrolado no bacon (churrasco brasileiro) Charlie (valeu pela foto, família!) Mais desta semana"}, {"id": "l57", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><\/div>", "cultures": ["BR", "HT"], "moments": [], "extra": "Brazil Haiti", "kind": "Carta 57 · Tampa", "title": "😵Contra el viento 🌬y marea 🌊", "date": "2022-07-18T08:21:00", "group": "2022-07", "html": "<div class=\"body\"><p>Hola amigos,<\/p>\n<p>\"Contra tudo e contra todos\" é o que isso significa, e acho que explica bem esta semana.<\/p>\n<p>Tivemos alguns desafios com amigos, falta de tempo e nossa saúde esta semana, mas no fim ainda foi muito produtiva.<\/p>\n<p>Pra começar a semana, achamos que tínhamos encontrado outra família! Temos orado e procurado com fervor, e por causa disso temos encontrado casais e famílias que podem apoiar uns aos outros, mas infelizmente alguns decidiram não se encontrar com a gente por enquanto. Talvez no futuro.<\/p>\n<p>Na terça, depois do conselho de distrito, o Élder Astorga e eu fizemos uma divisão na minha área. Foi demais servir com ele de novo. Eu o conheci quando estava em Lakeland. Visitamos uma referência que acabou sendo um haitiano. Os primeiros minutos foram estranhos e foi uma luta tentar se comunicar, porque ele sabe francês e crioulo e muito pouco espanhol. Mas aí perguntei se ele falava português e ele falava! Consegui praticar meu português e ajudá-lo a entrar em contato com os élderes de crioulo. Muito massa!<\/p>\n<p>Mas a terça não terminou tão bem. Depois do jantar, logo comecei a sentir uma dor extrema no meio da barriga, que foi piorando ao longo da noite. Às 7h45 eu não aguentava mais, então voltamos pra casa pra fazer Facebook e ligações enquanto eu tentava descansar. A dor não passou, então liguei pra nossa coordenadora de saúde dos missionários, a Sister Meese. Tomei uns antiácidos e parecia que estava tudo bem.<\/p>\n<p>A quarta foi um dia bom, umas lições legais com os amigos, e a aula de inglês é sempre demais. O Diogo quer muito que eu visite ele no 🇧🇷 Brasil, então essa é mais uma viagem pós-missão. Vou visitar, ficar com a família dele e comer um churrasco, um tipo de BBQ brasileiro.<\/p>\n<p>O Franklin, também conhecido como Chiky (parça), de Brandon, nos pediu para ajudar a comemorar o aniversário do irmão dele em Tampa, então conversamos com eles e comemoramos. Devemos conseguir começar a ensiná-los também.<\/p>\n<p>Tres leches congelado é uma sensação e uma experiência interessante. Mas não recomendo totalmente<\/p>\n<p>A sexta foi quando as coisas pararam de ir bem de novo. Eu estava tomando antiácido e me sentindo melhor até a hora do almoço na sexta. Acabamos visitando nosso recém-converso Milton, e depois mandaram a gente ir pro pronto-socorro, onde passamos as 7 horas seguintes. No fim, não era apendicite nem nada, só o estômago bem irritado, então estou com uns remédios e tenho que tomar muito cuidado com o que como.<\/p>\n<p>O resto do fim de semana ainda foi fazendo proselitismo, milagres, lições legais, mas eu não estava 100%. Não se preocupem, estou melhorando!<\/p>\n<p>2 Néfi 22:2 ou Isaías 12:2<\/p>\n<p>Eis que Deus é minha salvação; confiarei e não temerei, porque o Senhor Jeová é minha força e meu cântico; ele também se tornou minha salvação.<\/p>\n<p>Amo a paz, a esperança e o conhecimento que vêm por meio do meu Salvador. Sei que Ele vive! Ele é a minha força e pode ser a de vocês, desde que vocês peçam e creiam em Seu nome!<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>🌧 🌦 🌂 🌈<\/li>\n<li>Patos dinossauro<\/li>\n<li>Pronto-socorro<\/li>\n<li>Élder Dean &amp; cachorrinho!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-07-18_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-07-18_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-18_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-18_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_334.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_335.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_336.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_337.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_338.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "😵Contra el viento 🌬y marea 🌊 Hola amigos, \"Contra tudo e contra todos\" é o que isso significa, e acho que explica bem esta semana. Tivemos alguns desafios com amigos, falta de tempo e nossa saúde esta semana, mas no fim ainda foi muito produtiva. Pra começar a semana, achamos que tínhamos encontrado outra família! Temos orado e procurado com fervor, e por causa disso temos encontrado casais e famílias que podem apoiar uns aos outros, mas infelizmente alguns decidiram não se encontrar com a gente por enquanto. Talvez no futuro. Na terça, depois do conselho de distrito, o Élder Astorga e eu fizemos uma divisão na minha área. Foi demais servir com ele de novo. Eu o conheci quando estava em Lakeland. Visitamos uma referência que acabou sendo um haitiano. Os primeiros minutos foram estranhos e foi uma luta tentar se comunicar, porque ele sabe francês e crioulo e muito pouco espanhol. Mas aí perguntei se ele falava português e ele falava! Consegui praticar meu português e ajudá-lo a entrar em contato com os élderes de crioulo. Muito massa! Mas a terça não terminou tão bem. Depois do jantar, logo comecei a sentir uma dor extrema no meio da barriga, que foi piorando ao longo da noite. Às 7h45 eu não aguentava mais, então voltamos pra casa pra fazer Facebook e ligações enquanto eu tentava descansar. A dor não passou, então liguei pra nossa coordenadora de saúde dos missionários, a Sister Meese. Tomei uns antiácidos e parecia que estava tudo bem. A quarta foi um dia bom, umas lições legais com os amigos, e a aula de inglês é sempre demais. O Diogo quer muito que eu visite ele no 🇧🇷 Brasil, então essa é mais uma viagem pós-missão. Vou visitar, ficar com a família dele e comer um churrasco, um tipo de BBQ brasileiro. O Franklin, também conhecido como Chiky (parça), de Brandon, nos pediu para ajudar a comemorar o aniversário do irmão dele em Tampa, então conversamos com eles e comemoramos. Devemos conseguir começar a ensiná-los também. Tres leches congelado é uma sensação e uma experiência interessante. Mas não recomendo totalmente A sexta foi quando as coisas pararam de ir bem de novo. Eu estava tomando antiácido e me sentindo melhor até a hora do almoço na sexta. Acabamos visitando nosso recém-converso Milton, e depois mandaram a gente ir pro pronto-socorro, onde passamos as 7 horas seguintes. No fim, não era apendicite nem nada, só o estômago bem irritado, então estou com uns remédios e tenho que tomar muito cuidado com o que como. O resto do fim de semana ainda foi fazendo proselitismo, milagres, lições legais, mas eu não estava 100%. Não se preocupem, estou melhorando! 2 Néfi 22:2 ou Isaías 12:2 Eis que Deus é minha salvação; confiarei e não temerei, porque o Senhor Jeová é minha força e meu cântico; ele também se tornou minha salvação. Amo a paz, a esperança e o conhecimento que vêm por meio do meu Salvador. Sei que Ele vive! Ele é a minha força e pode ser a de vocês, desde que vocês peçam e creiam em Seu nome! Los amo Élder Jacobo Fotos: 🌧 🌦 🌂 🌈 Patos dinossauro Pronto-socorro Élder Dean & cachorrinho! Mais desta semana"}, {"id": "l58", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">JUL 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CU\">🇨🇺 Cuba<\/span><\/div>", "cultures": ["CU"], "moments": [], "extra": "Cuba", "kind": "Carta 58 · Tampa", "title": "A vida boa", "date": "2022-07-25T15:39:00", "group": "2022-07", "html": "<div class=\"body\"><p>Buenas tardes!<\/p>\n<p>Está tudo indo muito bem! Estou me sentindo melhor de novo, comer Chick-fil-A hoje foi demais. E a semana foi bem razoável.<\/p>\n<p>Ser líder de distrito deu muito trabalho esta semana. 3 divisões, e mais 3 nesta semana. E as ligações e reuniões de sempre. No geral, a semana foi boa, mas com certeza estranha, porque estávamos indo muito bem antes (principalmente como distrito), aí veio esta semana e, em comparação, foi ruim.<\/p>\n<p>Tivemos muitas lições e encontramos alguns amigos novos, mas outros amigos desistiram da gente e não tinha muitos membros disponíveis para nos ajudar nas lições.<\/p>\n<p>Estou com muito pouco tempo para escrever hoje, então me desculpem! Muito bater portas e ligações esta semana, nada muito especial. As transferências são daqui a uma semana, então provavelmente não vou ter muito tempo na próxima.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>furões<\/li>\n<li>pássaro<\/li>\n<li>uns bagres espinhosos<\/li>\n<li>meu novo crachá em português!<\/li>\n<li>patos<\/li>\n<li>pizza cubana<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-07-25_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-07-25_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_339.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_340.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_341.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_342.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_343.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "A vida boa Buenas tardes! Está tudo indo muito bem! Estou me sentindo melhor de novo, comer Chick-fil-A hoje foi demais. E a semana foi bem razoável. Ser líder de distrito deu muito trabalho esta semana. 3 divisões, e mais 3 nesta semana. E as ligações e reuniões de sempre. No geral, a semana foi boa, mas com certeza estranha, porque estávamos indo muito bem antes (principalmente como distrito), aí veio esta semana e, em comparação, foi ruim. Tivemos muitas lições e encontramos alguns amigos novos, mas outros amigos desistiram da gente e não tinha muitos membros disponíveis para nos ajudar nas lições. Estou com muito pouco tempo para escrever hoje, então me desculpem! Muito bater portas e ligações esta semana, nada muito especial. As transferências são daqui a uma semana, então provavelmente não vou ter muito tempo na próxima. Los amo! Elder Jacobs Fotos: furões pássaro uns bagres espinhosos meu novo crachá em português! patos pizza cubana Mais desta semana"}, {"id": "l59", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AGO 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colômbia<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["CO", "BR"], "moments": ["Baptism"], "extra": "Colombia Brazil", "kind": "Carta 59 · Tampa", "title": "🦤🇨🇴 Locura de un Bautismo! 🌊", "date": "2022-08-01T07:54:00", "group": "2022-08", "html": "<div class=\"body\"><p>Ola amigos! Sim! Um Bautismo!<\/p>\n<p>O Élder Dean e eu trabalhamos muito esta semana e nesta transferência e pudemos presenciar o batismo do nosso amigo Julian. Oramos juntos na quinta à noite e ele recebeu uma resposta sobre o batismo... para este domingo! Corremos feito barata tonta tentando fazer tudo, mais 3 divisões esta semana, então foi outra coisa.<\/p>\n<p>Esta semana fui até New Port Richey, na zona de Odessa. Foi interessante, mas não aconteceu muita coisa por causa da quantidade de chuva. Mas agora posso dizer que servi em Odessa (mais ou menos).<\/p>\n<p>Também tivemos nosso último conselho de distrito. O Élder Dean toca violino e tocou a música pra gente. Foi muito bom, uma reunião meio doida no geral, mas o Espírito estava muito forte, principalmente nos testemunhos e na música. Recebemos uma referência incrível do Hermano Betancourt. Ele é da 🇨🇴 Colômbia e vai nos ensinar a tocar os tambores dele um dia, mas parece que ele sai batendo portas! Ele foi missionário da ala, e naquela época os missionários não podiam bater portas, então ele bate portas e passa as referências jaja! A lição foi massa! Outra esta semana com o mesmo amigo, Leonardo. Meu português está melhorando. Estou ganhando mais confiança para falar e, com isso, minha fluência está razoável; ainda estou trabalhando em algumas conjugações e vocabulário, mas aos pocos (pouco a pouco), como o Diogo me ensinou.<\/p>\n<p>Compramos uma picanha, um corte brasileiro de carne, e comemos como reis. Muitas divisões esta semana, mas está tudo bem. Esta semana li Jacó 5. Tinha um monte de coisas legais que percebi, mas quero focar nesta frase: \"Entristece-me perder esta árvore\"<\/p>\n<p>Essa árvore é um filho de Deus, você, um filho amado que Ele fará qualquer coisa para ajudar. No momento eu sou servo da vinha, assim como meus colegas missionários, aqui para ajudar o Senhor e mostrar a vocês o mesmo amor e cuidado.<\/p>\n<p>Deus ama vocês, conhece vocês e quer ajudar vocês, mas às vezes nós mesmos dificultamos receber essa ajuda. Testifico disso em nome de Jesus Cristo, amém.<\/p>\n<p class=\"sign\">Los amo! Até mais tarde!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Batismo do Julian<\/li>\n<li>Élder Mott em divisão debaixo do temporal<\/li>\n<li>o cochilo do Mott<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-08-01_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-01_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-01_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-01_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-01_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_344.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_345.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_346.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🦤🇨🇴 Locura de un Bautismo! 🌊 Ola amigos! Sim! Um Bautismo! O Élder Dean e eu trabalhamos muito esta semana e nesta transferência e pudemos presenciar o batismo do nosso amigo Julian. Oramos juntos na quinta à noite e ele recebeu uma resposta sobre o batismo... para este domingo! Corremos feito barata tonta tentando fazer tudo, mais 3 divisões esta semana, então foi outra coisa. Esta semana fui até New Port Richey, na zona de Odessa. Foi interessante, mas não aconteceu muita coisa por causa da quantidade de chuva. Mas agora posso dizer que servi em Odessa (mais ou menos). Também tivemos nosso último conselho de distrito. O Élder Dean toca violino e tocou a música pra gente. Foi muito bom, uma reunião meio doida no geral, mas o Espírito estava muito forte, principalmente nos testemunhos e na música. Recebemos uma referência incrível do Hermano Betancourt. Ele é da 🇨🇴 Colômbia e vai nos ensinar a tocar os tambores dele um dia, mas parece que ele sai batendo portas! Ele foi missionário da ala, e naquela época os missionários não podiam bater portas, então ele bate portas e passa as referências jaja! A lição foi massa! Outra esta semana com o mesmo amigo, Leonardo. Meu português está melhorando. Estou ganhando mais confiança para falar e, com isso, minha fluência está razoável; ainda estou trabalhando em algumas conjugações e vocabulário, mas aos pocos (pouco a pouco), como o Diogo me ensinou. Compramos uma picanha, um corte brasileiro de carne, e comemos como reis. Muitas divisões esta semana, mas está tudo bem. Esta semana li Jacó 5. Tinha um monte de coisas legais que percebi, mas quero focar nesta frase: \"Entristece-me perder esta árvore\" Essa árvore é um filho de Deus, você, um filho amado que Ele fará qualquer coisa para ajudar. No momento eu sou servo da vinha, assim como meus colegas missionários, aqui para ajudar o Senhor e mostrar a vocês o mesmo amor e cuidado. Deus ama vocês, conhece vocês e quer ajudar vocês, mas às vezes nós mesmos dificultamos receber essa ajuda. Testifico disso em nome de Jesus Cristo, amém. Los amo! Até mais tarde! Elder Jacobs Fotos: Batismo do Julian Élder Mott em divisão debaixo do temporal o cochilo do Mott Mais desta semana"}, {"id": "l60", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AGO 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 60 · Tampa", "title": "Tenho gêmeos! 👨‍👦👨‍👦 otro Bautismo 🌊", "date": "2022-08-08T11:22:00", "group": "2022-08", "html": "<div class=\"body\"><p>Ola!<\/p>\n<p>Mais uma semana concluída, e bem movimentada!<\/p>\n<p>Segunda foi nosso último P-day como o distrito antigo e terminamos com sushi à vontade no Koizis.<\/p>\n<p>Terça foi dia de transferências e eu dei tchau pro Élder Dean, que agora está em Dade City. Mas eu fiquei sem companheiro! Fiquei com o Élder Morris e o Élder Cullimore enquanto nós 3 esperávamos até quinta, quando nossos novos élderes em treinamento chegariam à Flórida. Foi um trio incrível, muito divertido, mas também interessante, porque ficamos na minha área e só eu falava espanhol. Batemos muitas portas, mas depois de terça &amp; quarta tínhamos lições marcadas pro resto da semana! Quinta foi quando finalmente conheci o Élder Franson &amp; o Élder O'Neill. 2 filhos, companheiros no CTM: sou pai de gêmeos! Começamos o primeiro dia deles com um monte de lições e preparando o Oner para o batismo dele no sábado. Esse ritmo de lições seguiu pelo resto da semana, mal dando tempo pra estudar espanhol/português.<\/p>\n<p>Estamos ensinando uma família brasileira de São Paulo, então tem sido incrível pro meu português e pra ver como agora consigo interagir com mais pessoas e abençoá-las.<\/p>\n<p>O Presidente Gardiner e a família dele chegaram à Flórida esta semana! Conhecemos eles pelo Zoom, mas depois eles, ele, a esposa e a filha de 12 anos, Hannah, vieram ao nosso batismo no sábado.<\/p>\n<p>Esta semana quero testificar mais sobre Deus responder às orações. Conhecemos o Rigo e a família dele esta semana (&amp; o pato de estimação, Pito) porque recebemos uma referência, mas parece que ele tinha assistido ao filme da Restauração e orado para saber mais, e nós aparecemos e conseguimos responder todas as perguntas dele! Tenho orado por famílias e por jeitos de praticar mais português e continuo recebendo essa ajuda.<\/p>\n<p>Mateus 7:7<\/p>\n<p>Testifico que Deus ouve sim a sua súplica e quer ajudar; confiem Nele!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Jesus ama você<\/li>\n<li>Batismo do Oner<\/li>\n<li>Donuts do batismo<\/li>\n<li>tchau, Élder Dean<\/li>\n<li>Élderes em treinamento!<\/li>\n<li>1º dia e já achou um peixe<\/li>\n<li>camaleão<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-08-08_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-08_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-08_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-08_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-08_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-08_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_347.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_348.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Tenho gêmeos! 👨‍👦👨‍👦 otro Bautismo 🌊 Ola! Mais uma semana concluída, e bem movimentada! Segunda foi nosso último P-day como o distrito antigo e terminamos com sushi à vontade no Koizis. Terça foi dia de transferências e eu dei tchau pro Élder Dean, que agora está em Dade City. Mas eu fiquei sem companheiro! Fiquei com o Élder Morris e o Élder Cullimore enquanto nós 3 esperávamos até quinta, quando nossos novos élderes em treinamento chegariam à Flórida. Foi um trio incrível, muito divertido, mas também interessante, porque ficamos na minha área e só eu falava espanhol. Batemos muitas portas, mas depois de terça & quarta tínhamos lições marcadas pro resto da semana! Quinta foi quando finalmente conheci o Élder Franson & o Élder O'Neill. 2 filhos, companheiros no CTM: sou pai de gêmeos! Começamos o primeiro dia deles com um monte de lições e preparando o Oner para o batismo dele no sábado. Esse ritmo de lições seguiu pelo resto da semana, mal dando tempo pra estudar espanhol/português. Estamos ensinando uma família brasileira de São Paulo, então tem sido incrível pro meu português e pra ver como agora consigo interagir com mais pessoas e abençoá-las. O Presidente Gardiner e a família dele chegaram à Flórida esta semana! Conhecemos eles pelo Zoom, mas depois eles, ele, a esposa e a filha de 12 anos, Hannah, vieram ao nosso batismo no sábado. Esta semana quero testificar mais sobre Deus responder às orações. Conhecemos o Rigo e a família dele esta semana (& o pato de estimação, Pito) porque recebemos uma referência, mas parece que ele tinha assistido ao filme da Restauração e orado para saber mais, e nós aparecemos e conseguimos responder todas as perguntas dele! Tenho orado por famílias e por jeitos de praticar mais português e continuo recebendo essa ajuda. Mateus 7:7 Testifico que Deus ouve sim a sua súplica e quer ajudar; confiem Nele! Los amo, Elder Jacobs Fotos: Jesus ama você Batismo do Oner Donuts do batismo tchau, Élder Dean Élderes em treinamento! 1º dia e já achou um peixe camaleão Mais desta semana"}, {"id": "l61", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AGO 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 61 · Tampa", "title": "😁La panda sonrisa 🐼(a galera do sorriso)🐊", "date": "2022-08-15T12:49:00", "group": "2022-08", "html": "<div class=\"body\"><p>Sonríe porque Jesús te ama!<\/p>\n<p>Buenos días amigos, espero que la semana fue buena!<\/p>\n<p>Nossa semana foi boa, corrida, difícil às vezes, mas gratificante. Temos estado muito ocupados ensinando amigos, com atividades, recém-conversos etc.. o pacote completo.<\/p>\n<p>A segunda passada foi um jeito incrível de começar a semana. Outra lição com o Rigo, desta vez sobre o plano de salvação, e marcamos o batismo dele para o dia 28! Também tiramos uma foto com o Pìto &amp; ele.<\/p>\n<p>Terça foi o primeiro conselho de distrito da transferência, e 14 missionários em 1 distrito é muito poder. E também uma festa constante 🥳. Estabelecemos umas metas bem incríveis e aprendemos juntos. Foi isso que inspirou meu pensamento de hoje. Também fizemos uma divisão esta semana com os élderes de Carrollwood. Foi divertido estar com o Élder Robinson e também uma boa forma de aprender. O Élder Franson &amp; o Élder O’Neill estão animados para fazer mais, eles curtiram.<\/p>\n<p>Gostei da oportunidade de ir ao treinamento especializado com o Élder Franson &amp; o Élder O'Neill. Nos divertimos muito vendo os outros treinadores e seus élderes em treinamento, aprendendo, sentindo o Espírito e até fazendo contatos na rua no campus da USF. Também pudemos fazer um pouco de serviço esta semana, mexendo terra para uma horta e limpando o prédio da nossa capela. Esta semana teve uma atividade de tentar adivinhar quem era o líder de distrito, então aqui vai toda a propaganda do Elder Jacobs jaja. Meu pensamento/mensagem de hoje é baseado num discurso/treinamento chamado O 4º Missionário. Tem um gráfico que fala sobre o quadrante dos milagres. Missionários com muito amor e altas expectativas se saem bem, mas, para trazer milagres, também é preciso ter uma ótima atitude e muito esforço. Cristo foi um exemplo perfeito de amor, expectativas, atitude e esforço, e é por isso que tantos milagres foram realizados e continuam sendo em Seu nome.<\/p>\n<p>Os amo que tenha uma boa semana!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>foto da lousa mágica &amp; outros desenhos<\/li>\n<li>Rigo, Pìto e nós<\/li>\n<li>La panda Sonrisa<\/li>\n<li>caixa de golfinho<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-08-15_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-15_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-15_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-15_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-15_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-15_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-15_0_6.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_349.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "😁La panda sonrisa 🐼(a galera do sorriso)🐊 Sonríe porque Jesús te ama! Buenos días amigos, espero que la semana fue buena! Nossa semana foi boa, corrida, difícil às vezes, mas gratificante. Temos estado muito ocupados ensinando amigos, com atividades, recém-conversos etc.. o pacote completo. A segunda passada foi um jeito incrível de começar a semana. Outra lição com o Rigo, desta vez sobre o plano de salvação, e marcamos o batismo dele para o dia 28! Também tiramos uma foto com o Pìto & ele. Terça foi o primeiro conselho de distrito da transferência, e 14 missionários em 1 distrito é muito poder. E também uma festa constante 🥳. Estabelecemos umas metas bem incríveis e aprendemos juntos. Foi isso que inspirou meu pensamento de hoje. Também fizemos uma divisão esta semana com os élderes de Carrollwood. Foi divertido estar com o Élder Robinson e também uma boa forma de aprender. O Élder Franson & o Élder O’Neill estão animados para fazer mais, eles curtiram. Gostei da oportunidade de ir ao treinamento especializado com o Élder Franson & o Élder O'Neill. Nos divertimos muito vendo os outros treinadores e seus élderes em treinamento, aprendendo, sentindo o Espírito e até fazendo contatos na rua no campus da USF. Também pudemos fazer um pouco de serviço esta semana, mexendo terra para uma horta e limpando o prédio da nossa capela. Esta semana teve uma atividade de tentar adivinhar quem era o líder de distrito, então aqui vai toda a propaganda do Elder Jacobs jaja. Meu pensamento/mensagem de hoje é baseado num discurso/treinamento chamado O 4º Missionário. Tem um gráfico que fala sobre o quadrante dos milagres. Missionários com muito amor e altas expectativas se saem bem, mas, para trazer milagres, também é preciso ter uma ótima atitude e muito esforço. Cristo foi um exemplo perfeito de amor, expectativas, atitude e esforço, e é por isso que tantos milagres foram realizados e continuam sendo em Seu nome. Os amo que tenha uma boa semana! Elder Jacobs Fotos: foto da lousa mágica & outros desenhos Rigo, Pìto e nós La panda Sonrisa caixa de golfinho Mais desta semana"}, {"id": "l62", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AGO 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><\/div>", "cultures": ["VE", "HT"], "moments": [], "extra": "Venezuela Haiti", "kind": "Carta 62 · Tampa", "title": "🤯Uma semana maluca 🐊& muitos venezuelanos 🇻🇪", "date": "2022-08-22T14:46:00", "group": "2022-08", "html": "<div class=\"body\"><p>Hola Ola Amigos!<\/p>\n<p>Esta semana foi outra incrível, mas, como diz meu título, meio diferente/maluca/frustrante. Digo frustrante por causa da quantidade de lições marcadas que não aconteceram ou em que não tivemos um membro para nos ajudar a ensinar e fazer amizade com nossos amigos.<\/p>\n<p>Por favor, tentem sair e ajudar os missionários com os amigos: caronas ou lições.<\/p>\n<p>O resto da semana foi bom. Infelizmente, o Élder Morris ficou bem doente, então, por favor, orem por uma recuperação rápida para ele. Temos tentado fazer tudo o que podemos para ajudá-lo, mas parece que a recuperação vai ser lenta por enquanto. Hoje piorou de novo, então vamos ver como vai evoluir.<\/p>\n<p>Tivemos uma reunião com o Presidente, a Sister Gardiner e a Hannah Gardiner, filha deles. Pudemos conhecer mais sobre eles, os planos deles e como a missão vai seguir em frente. Estou bem animado, eles têm muita vontade de estar aqui e trabalhar. Também ensinamos o Hugo &amp; a família dele na quarta, o que foi incrível. Ele foi à igreja de novo, mas a família não conseguiu folga do trabalho. Ele levou um amigo, e o nosso amigo Guillermo também, então começamos nosso pequeno Corrillo (grupo de amigos) de venezuelanos.<\/p>\n<p>Fiz uma divisão com os élderes dos JAS, foi bem divertido, muito diferente do espanhol, mas divertido. Também pude passar um tempo com os élderes de crioulo, já que eles moram juntos. O Élder O’Neill e o Élder Franson cuidaram da área sozinhos! Sem ajuda minha no espanhol! Mas eles curtiram e foram superbem.<\/p>\n<p>Preenchemos nosso tempo livre esta semana batendo portas e visitando membros, tentando fortalecer a ala, conhecer os membros e conseguir ajuda nas lições ou referências. Isso levou a um momento muito especial: administrar o sacramento para uma família com o Irmão Benicio. Foi uma reunião sacramental tão simples, doce e cheia de testemunho, nunca vou esquecer aquele momento. Gosto desta escritura e deste ensinamento de Cristo, que meio que ensina essa mesma ideia de experiências espirituais simples, a sós. Mateus 6<\/p>\n<p>6 Mas tu, quando orares, entra no teu aposento e, fechando a tua porta, ora a teu Pai que está em secreto; e teu Pai, que vê em secreto, te recompensará publicamente.<\/p>\n<p>7 E, orando, não useis de vãs repetições, como os gentios, que pensam que por muito falarem serão ouvidos.<\/p>\n<p>8 Não vos assemelheis, pois, a eles, porque vosso Pai sabe o que vos é necessário antes de vós lho pedirdes<\/p>\n<p class=\"sign\">Los amo hasta luego!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Pokémon do McDonald's<\/li>\n<li>Hugo &amp; família<\/li>\n<li>Novo tech deck/mesa montada<\/li>\n<li>Sou um anjo 😇<\/li>\n<li>treinamento especializado<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-08-22_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-22_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-22_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-22_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-22_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-22_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_350.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_351.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_352.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🤯Uma semana maluca 🐊& muitos venezuelanos 🇻🇪 Hola Ola Amigos! Esta semana foi outra incrível, mas, como diz meu título, meio diferente/maluca/frustrante. Digo frustrante por causa da quantidade de lições marcadas que não aconteceram ou em que não tivemos um membro para nos ajudar a ensinar e fazer amizade com nossos amigos. Por favor, tentem sair e ajudar os missionários com os amigos: caronas ou lições. O resto da semana foi bom. Infelizmente, o Élder Morris ficou bem doente, então, por favor, orem por uma recuperação rápida para ele. Temos tentado fazer tudo o que podemos para ajudá-lo, mas parece que a recuperação vai ser lenta por enquanto. Hoje piorou de novo, então vamos ver como vai evoluir. Tivemos uma reunião com o Presidente, a Sister Gardiner e a Hannah Gardiner, filha deles. Pudemos conhecer mais sobre eles, os planos deles e como a missão vai seguir em frente. Estou bem animado, eles têm muita vontade de estar aqui e trabalhar. Também ensinamos o Hugo & a família dele na quarta, o que foi incrível. Ele foi à igreja de novo, mas a família não conseguiu folga do trabalho. Ele levou um amigo, e o nosso amigo Guillermo também, então começamos nosso pequeno Corrillo (grupo de amigos) de venezuelanos. Fiz uma divisão com os élderes dos JAS, foi bem divertido, muito diferente do espanhol, mas divertido. Também pude passar um tempo com os élderes de crioulo, já que eles moram juntos. O Élder O’Neill e o Élder Franson cuidaram da área sozinhos! Sem ajuda minha no espanhol! Mas eles curtiram e foram superbem. Preenchemos nosso tempo livre esta semana batendo portas e visitando membros, tentando fortalecer a ala, conhecer os membros e conseguir ajuda nas lições ou referências. Isso levou a um momento muito especial: administrar o sacramento para uma família com o Irmão Benicio. Foi uma reunião sacramental tão simples, doce e cheia de testemunho, nunca vou esquecer aquele momento. Gosto desta escritura e deste ensinamento de Cristo, que meio que ensina essa mesma ideia de experiências espirituais simples, a sós. Mateus 6 6 Mas tu, quando orares, entra no teu aposento e, fechando a tua porta, ora a teu Pai que está em secreto; e teu Pai, que vê em secreto, te recompensará publicamente. 7 E, orando, não useis de vãs repetições, como os gentios, que pensam que por muito falarem serão ouvidos. 8 Não vos assemelheis, pois, a eles, porque vosso Pai sabe o que vos é necessário antes de vós lho pedirdes Los amo hasta luego! Elder Jacobs Fotos: Pokémon do McDonald's Hugo & família Novo tech deck/mesa montada Sou um anjo 😇 treinamento especializado Mais desta semana"}, {"id": "l63", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">AGO 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colômbia<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["CO", "BR"], "moments": ["Baptism"], "extra": "Colombia Brazil", "kind": "Carta 63 · Tampa", "title": "🤡☠️Locura🤯🥳", "date": "2022-08-29T05:59:00", "group": "2022-08", "html": "<div class=\"body\"><p>Bom día! Como vôces vão? Como foi a semana?<\/p>\n<p>Esta semana foi bem boa, bem estressante, então estou grato pelo P-day e por um tempinho pra relaxar. Tivemos bastante trabalho missionário, mas, mais do que isso, foi tentar garantir a segurança e o transporte de outros missionários por causa de um acidente de carro &amp; outra ida ao hospital do Élder Morris; por favor, continuem orando por ele e pela recuperação dele. Na terça, depois do conselho de distrito, tivemos um banquete gigante de frango frito 🍗 🐔  sem fotos, mas eram 2 assadeiras grandes cheias. Depois fizemos uma divisão com South Tampa, que foi razoavelmente bem.<\/p>\n<p>Esta semana foi muito molhada, me encharquei algumas vezes.<\/p>\n<p>Na quarta tivemos aula de inglês e depois uma lição incrível com a família Vieira e o Irmão Aluxe. Eles são muito queridos e sinceros, e estou animado pra vê-los de branco um dia (ainda sem data marcada). Vamos levar Pokémon pra dar pro filho deles, o João, ele tem 6 anos, ama Pokémon e fala muito!<\/p>\n<p>Quinta e sexta foram dias doidos por causa da volta ao hospital que mencionei, e depois outros élderes do meu distrito sofreram um acidente feio na rodovia. Todo mundo bem, carro com perda total, corpos doloridos. Então tentamos fazer nossas lições, mas acabou sendo muita correria tentando ajudar todo mundo.<\/p>\n<p>Temos um novo amigo chamado Christian; ele tem 25 anos e é da Colômbia. É muito legal conversar com ele, às vezes até demais, mas é assim que a gente sabe que ele é apaixonado pelo Evangelho.<\/p>\n<p>Montamos, participamos e limpamos tudo de um casamento do Alexander &amp; da Luísa Garabito. Foi divertido, e no dia seguinte, depois da igreja, eles foram batizados, junto com a filha deles, Julianna.<\/p>\n<p>Esta escritura ficou comigo a semana toda desde que a ouvi na terça.<\/p>\n<p>Deus confia muito em nós e quer nos dar revelação. Precisamos continuar fiéis e pedindo por ela.<\/p>\n<p class=\"sign\">Los amo! El libro es poderosa y la iglesia asombroso!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Rio de Janeiro (Google Maps)<\/li>\n<li>Irmão Aluxe &amp; nossa nova família brasileira, os Vieira (o menininho deles ama Pokémon jaja)<\/li>\n<li>caixa de golfinho (não Otterbox jaja)<\/li>\n<li>Diogo &amp; nós<\/li>\n<li>palhaçadas<\/li>\n<li>Casamento dos Garabito!<\/li>\n<li>Post sobre o folclore brasileiro que eu fiz, me mandem algumas das histórias dos personagens, por favor!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-08-29_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-08-29_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-08-29_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-08-29_0_7.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-08-29_0_8.png\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_353.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_354.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_355.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_356.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_357.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_358.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_359.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_360.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_361.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🤡☠️Locura🤯🥳 Bom día! Como vôces vão? Como foi a semana? Esta semana foi bem boa, bem estressante, então estou grato pelo P-day e por um tempinho pra relaxar. Tivemos bastante trabalho missionário, mas, mais do que isso, foi tentar garantir a segurança e o transporte de outros missionários por causa de um acidente de carro & outra ida ao hospital do Élder Morris; por favor, continuem orando por ele e pela recuperação dele. Na terça, depois do conselho de distrito, tivemos um banquete gigante de frango frito 🍗 🐔 sem fotos, mas eram 2 assadeiras grandes cheias. Depois fizemos uma divisão com South Tampa, que foi razoavelmente bem. Esta semana foi muito molhada, me encharquei algumas vezes. Na quarta tivemos aula de inglês e depois uma lição incrível com a família Vieira e o Irmão Aluxe. Eles são muito queridos e sinceros, e estou animado pra vê-los de branco um dia (ainda sem data marcada). Vamos levar Pokémon pra dar pro filho deles, o João, ele tem 6 anos, ama Pokémon e fala muito! Quinta e sexta foram dias doidos por causa da volta ao hospital que mencionei, e depois outros élderes do meu distrito sofreram um acidente feio na rodovia. Todo mundo bem, carro com perda total, corpos doloridos. Então tentamos fazer nossas lições, mas acabou sendo muita correria tentando ajudar todo mundo. Temos um novo amigo chamado Christian; ele tem 25 anos e é da Colômbia. É muito legal conversar com ele, às vezes até demais, mas é assim que a gente sabe que ele é apaixonado pelo Evangelho. Montamos, participamos e limpamos tudo de um casamento do Alexander & da Luísa Garabito. Foi divertido, e no dia seguinte, depois da igreja, eles foram batizados, junto com a filha deles, Julianna. Esta escritura ficou comigo a semana toda desde que a ouvi na terça. Deus confia muito em nós e quer nos dar revelação. Precisamos continuar fiéis e pedindo por ela. Los amo! El libro es poderosa y la iglesia asombroso! Elder Jacobs Fotos: Rio de Janeiro (Google Maps) Irmão Aluxe & nossa nova família brasileira, os Vieira (o menininho deles ama Pokémon jaja) caixa de golfinho (não Otterbox jaja) Diogo & nós palhaçadas Casamento dos Garabito! Post sobre o folclore brasileiro que eu fiz, me mandem algumas das histórias dos personagens, por favor! Mais desta semana"}, {"id": "l64", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SET 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><\/div>", "cultures": ["VE"], "moments": [], "extra": "Venezuela", "kind": "Carta 64 · Tampa", "title": "lasanha & um labirinto", "date": "2022-09-05T14:08:00", "group": "2022-09", "html": "<div class=\"body\"><p>Como estan amigos! Siempre una Fiesta y estamos muchas payasadas acá! 🤡🥳<\/p>\n<p>Espero que vocês tenham tido uma semana irada, a nossa foi bem boa.<\/p>\n<p>Voltamos a ter contato com nossa amiga Maria. Ela ainda não é muito boa em responder, mas tem um desejo enorme de aprender, então estou animado por podermos começar a ensiná-la de novo. Também começamos a ensinar a namorada do Enrique, que logo vai ser esposa dele. No geral, muitos amigos novos e legais esta semana. Nenhuma lição em português, nossos amigos não puderam se encontrar, mas continuo praticando muito (é difícil com recursos mais limitados).<\/p>\n<p>Nossa amiga Emmelina agora tem data marcada! Ela está aprendendo há um tempo e agora vive esperando nossas mensagens. Estou superanimado por ela. Por favor, orem pela saúde dela.<\/p>\n<p>Experimentei lasanha venezuelana, o Hugo &amp; a família dele fizeram. Muito boa, diferente, mas eu gostei, e tivemos uma lição de fogo. Vamos ver quando conseguimos marcar uma data com eles.<\/p>\n<p>Tem gosto de presunto, queijo, molho vermelho, carne moída, massa, e basicamente só um pouquinho diferente. Na aula de inglês, fizemos um labirinto com cadeiras e pedimos para os alunos praticarem dar direções. Depois fiz o mesmo com meus élderes em treinamento para praticarem a compreensão auditiva (esqueci de tirar foto).<\/p>\n<p>Nada muito mais pra contar, a gente está no grind tentando limpar nosso livro de área e terminar outras coisas. Tomara que a gente consiga terminar tudo isso e voltar ao bom e velho bater portas (fizemos um pouco esta semana)..<\/p>\n<p>Pensamento da semana: Mosias 8<\/p>\n<p>16 E Amon disse que um vidente é um revelador e também um profeta; e nenhum homem pode ter dom maior, a não ser que possua o poder de Deus, o que homem algum pode ter; contudo, um homem pode receber grande poder de Deus. 17 Mas um vidente pode saber coisas passadas e também coisas futuras; e por meio deles todas as coisas serão reveladas, ou melhor, coisas secretas serão manifestadas e coisas ocultas virão à luz; e coisas que não são conhecidas serão por eles dadas a conhecer; e também por eles serão dadas a conhecer coisas que de outra forma não poderiam ser conhecidas. 18 Assim Deus proporcionou um meio para que o homem, pela fé, possa realizar grandes milagres; portanto, ele se torna um grande benefício para seus semelhantes.<\/p>\n<p>Somos todos muito abençoados por poder receber revelação e, de certa forma, nos tornar videntes. E às vezes a resposta é não, mas não um não para sempre, e sim um agora não. Confiem em Deus!<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs 🦆<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>caixas de correio da Flórida<\/li>\n<li>hora da Primária jaja<\/li>\n<li>fizemos um reel no Facebook (desta vez em inglês)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-09-05_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-09-05_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-05_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_362.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_363.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "lasanha & um labirinto Como estan amigos! Siempre una Fiesta y estamos muchas payasadas acá! 🤡🥳 Espero que vocês tenham tido uma semana irada, a nossa foi bem boa. Voltamos a ter contato com nossa amiga Maria. Ela ainda não é muito boa em responder, mas tem um desejo enorme de aprender, então estou animado por podermos começar a ensiná-la de novo. Também começamos a ensinar a namorada do Enrique, que logo vai ser esposa dele. No geral, muitos amigos novos e legais esta semana. Nenhuma lição em português, nossos amigos não puderam se encontrar, mas cont
