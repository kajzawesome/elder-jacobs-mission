semana, quando eu vou estar na minha nova área e com novos companheiros, Elder Jacobs Fotos: tie-dye do distrito Élder Jenson & eu com nossos brinquedos do McLanche Feliz, o Heihei (Moana), fazendo contato na rua nuvem maluca igreja (Élder Ricks & eu) Nós e os Miños (Joaquin, Jared, Hermana Lucy Miño, & Hermano Juan Miño) Aviso: a parte dos bichos atropelados, claro gato... Mais desta semana"}, {"id": "l18", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">OUT 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><\/div>", "cultures": ["PR"], "moments": [], "extra": "Puerto Rico", "kind": "Carta 18 · Lakeland", "title": "✌Bienvenidos direto de Lakeland 💦🐊", "date": "2021-10-18T15:41:00", "group": "2021-10", "html": "<div class=\"body\"><p>Hola amigos!<\/p>\n<p>Essa semana foi bem incrível por causa dos meus novos companheiros e da nova área. Lakeland é muito legal e bem diferente da Dirty Dade, mas no bom sentido. Meus companheiros, o Élder Olayan e o Élder Izu, são demais. O Élder Olayan vai embora no fim dessa transferência, então ele considera nós dois como os treinados dele, vibe de missionário veterano. O Élder Izu é um companheiro/treinado/filho de missão bem incrível. Ele é meio porto-riquenho, mas não sabia espanhol antes, então todo mundo acha que ele sabe mais que nós gringos, mas aí ele começa a falar e as pessoas ficam confusas porque ele ainda está aprendendo e a aparência engana (igual a nós gringos; ainda me perguntam às vezes se eu sei espanhol e aí eu surpreendo quando falo). Mas ele está indo muito bem! Sabe muita coisa, talvez mais do que eu sabia no começo da minha segunda transferência. A área é bem legal por causa de todos os lagos e das pessoas que conhecemos. Muitos latinos, mas espalhados pela cidade. Dade City é minúscula em comparação. Estou tendo dificuldade para lembrar nomes e caminhos, já que agora eu sou o motorista, mas estou chegando lá. Temos um bom número de amigos, mas é difícil levar eles para a igreja porque a capela é longe. Antes eram 2 ramos, mas eles se juntaram para virar uma ala, e aí a capela mudou. Estamos tentando organizar melhor as caronas.<\/p>\n<p>A única história dessa semana é de um cara fazendo \"varandologia\" (teologia na varanda dele). Ele chamou a gente e começamos a conversar porque ele tinha umas perguntas sobre a nossa igreja, mas logo percebemos que ele meio que queria atacar a gente ou, como ele diz, \"abrir nossos olhos\". Ele estava tentando explicar todo tipo de coisa sobre raças e a Bíblia e interpretava os versículos de um jeito totalmente diferente do nosso, então ficou irritado com a gente. No fim, percebemos que ele só estava tentando fazer a gente acreditar que Jesus era negro e que todas as imagens estavam erradas.<\/p>\n<p>Semana que vem vou garantir que vou ter mais tempo para escrever mais. Porque tenho certeza que tenho mais histórias, só estou esquecendo.<\/p>\n<p class=\"sign\">Hasta luego,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>acidente que vimos<\/li>\n<li>foto nas transferências antes de ir embora<\/li>\n<li>minicoco<\/li>\n<li>experimentei Pho, era bem bom (mas acho que ainda gosto mais de Ramen)<\/li>\n<\/ul>\n<p>Semana que vem vou lembrar de tirar uma foto com meus novos companheiros<\/p><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-10-18_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-10-18_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-10-18_0_2.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_082.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_083.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "✌Bienvenidos direto de Lakeland 💦🐊 Hola amigos! Essa semana foi bem incrível por causa dos meus novos companheiros e da nova área. Lakeland é muito legal e bem diferente da Dirty Dade, mas no bom sentido. Meus companheiros, o Élder Olayan e o Élder Izu, são demais. O Élder Olayan vai embora no fim dessa transferência, então ele considera nós dois como os treinados dele, vibe de missionário veterano. O Élder Izu é um companheiro/treinado/filho de missão bem incrível. Ele é meio porto-riquenho, mas não sabia espanhol antes, então todo mundo acha que ele sabe mais que nós gringos, mas aí ele começa a falar e as pessoas ficam confusas porque ele ainda está aprendendo e a aparência engana (igual a nós gringos; ainda me perguntam às vezes se eu sei espanhol e aí eu surpreendo quando falo). Mas ele está indo muito bem! Sabe muita coisa, talvez mais do que eu sabia no começo da minha segunda transferência. A área é bem legal por causa de todos os lagos e das pessoas que conhecemos. Muitos latinos, mas espalhados pela cidade. Dade City é minúscula em comparação. Estou tendo dificuldade para lembrar nomes e caminhos, já que agora eu sou o motorista, mas estou chegando lá. Temos um bom número de amigos, mas é difícil levar eles para a igreja porque a capela é longe. Antes eram 2 ramos, mas eles se juntaram para virar uma ala, e aí a capela mudou. Estamos tentando organizar melhor as caronas. A única história dessa semana é de um cara fazendo \"varandologia\" (teologia na varanda dele). Ele chamou a gente e começamos a conversar porque ele tinha umas perguntas sobre a nossa igreja, mas logo percebemos que ele meio que queria atacar a gente ou, como ele diz, \"abrir nossos olhos\". Ele estava tentando explicar todo tipo de coisa sobre raças e a Bíblia e interpretava os versículos de um jeito totalmente diferente do nosso, então ficou irritado com a gente. No fim, percebemos que ele só estava tentando fazer a gente acreditar que Jesus era negro e que todas as imagens estavam erradas. Semana que vem vou garantir que vou ter mais tempo para escrever mais. Porque tenho certeza que tenho mais histórias, só estou esquecendo. Hasta luego, Elder Jacobs Fotos: acidente que vimos foto nas transferências antes de ir embora minicoco experimentei Pho, era bem bom (mas acho que ainda gosto mais de Ramen) Semana que vem vou lembrar de tirar uma foto com meus novos companheiros Mais desta semana"}, {"id": "l19", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">OUT 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 19 · Lakeland", "title": "🍙🍩🐊Comida de graça! 🌮🌯🍔🌭", "date": "2021-10-25T13:06:00", "group": "2021-10", "html": "<div class=\"body\"><p>Bienvenidos de nuevo amigos míos,<\/p>\n<p>Mais uma semana terminada na terra dos lagos, Lakeland. Estou amando meu tempo aqui e aprendendo o tempo todo. Essa semana aprendi mais sobre treinamento, já que o Élder Seamons (Neamons jaja, nosso líder de distrito) veio fazer divisão. Foi muito divertido. Na real, foi tipo passar o dia com um amigo, mas também fazendo o trabalho missionário e vendo muito sucesso. Essa semana foi bem normal, com os estudos de sempre e depois busca/lições. As melhores coisas da semana foram todas as refeições de graça e os amigos que foram à igreja. 2 amigos foram à igreja mesmo sendo a 35 min de distância. Ganhamos comida 3 vezes essa semana do nada. A gente aparecia numa casa só para fazer uma visita, ver como estavam e talvez ensinar, mas a nossa sorte essa semana era: a gente chega, é convidado para entrar, como esta?, compartilha uma mensagem, e aí eles servem um prato da comida que tinham acabado de fazer! Muito bom e épico; principalmente porque algumas dessas vezes a gente não tinha levado comida e estava longe do apartamento.<\/p>\n<p>A minha favorita foi ontem, domingo, porque entramos e era noite de ensaio da banda! Tivemos direito a show, compartilhamos uma mensagem e depois comemos. Muito épico, espero que o vídeo fique bom.<\/p>\n<p>Festa, pessoal! Vou voltar a jogar um certo jogo de cartas sem nome sobre monstrinhos de bolso...hihi Hasta lasagna, mas não vai se sujar,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Pôr do sol<\/li>\n<li>passagem para o céu (do Vidal, um recém-converso jaja) 🥳<\/li>\n<li>uma das muitas fotos estranhas da divisão com o Élder Nuff Neamons 🦍<\/li>\n<li>passamos pra visitar, ganhamos comida e ouvimos uma banda tocar! 😎🪅 (o Élder Olayan está com a língua de fora curtindo o som)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-10-25_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-25_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-10-25_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_084.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_085.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🍙🍩🐊Comida de graça! 🌮🌯🍔🌭 Bienvenidos de nuevo amigos míos, Mais uma semana terminada na terra dos lagos, Lakeland. Estou amando meu tempo aqui e aprendendo o tempo todo. Essa semana aprendi mais sobre treinamento, já que o Élder Seamons (Neamons jaja, nosso líder de distrito) veio fazer divisão. Foi muito divertido. Na real, foi tipo passar o dia com um amigo, mas também fazendo o trabalho missionário e vendo muito sucesso. Essa semana foi bem normal, com os estudos de sempre e depois busca/lições. As melhores coisas da semana foram todas as refeições de graça e os amigos que foram à igreja. 2 amigos foram à igreja mesmo sendo a 35 min de distância. Ganhamos comida 3 vezes essa semana do nada. A gente aparecia numa casa só para fazer uma visita, ver como estavam e talvez ensinar, mas a nossa sorte essa semana era: a gente chega, é convidado para entrar, como esta?, compartilha uma mensagem, e aí eles servem um prato da comida que tinham acabado de fazer! Muito bom e épico; principalmente porque algumas dessas vezes a gente não tinha levado comida e estava longe do apartamento. A minha favorita foi ontem, domingo, porque entramos e era noite de ensaio da banda! Tivemos direito a show, compartilhamos uma mensagem e depois comemos. Muito épico, espero que o vídeo fique bom. Festa, pessoal! Vou voltar a jogar um certo jogo de cartas sem nome sobre monstrinhos de bolso...hihi Hasta lasagna, mas não vai se sujar, Elder Jacobs Fotos: Pôr do sol passagem para o céu (do Vidal, um recém-converso jaja) 🥳 uma das muitas fotos estranhas da divisão com o Élder Nuff Neamons 🦍 passamos pra visitar, ganhamos comida e ouvimos uma banda tocar! 😎🪅 (o Élder Olayan está com a língua de fora curtindo o som) Mais desta semana"}, {"id": "l20", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 20 · Lakeland", "title": "👻 Feliz noche de brujas 🛸 & Conferência de zona 🪅", "date": "2021-11-01T05:44:00", "group": "2021-11", "html": "<div class=\"body\"><p>Hola mis amigos, cómo les va?<\/p>\n<p>Feliz Halloween atrasado! 👻<\/p>\n<p>E feliz novembro também!<\/p>\n<p>Essa semana foi puro 🔥 porque marcamos 3 datas de batismo! Nossa amiga Danicha &amp; o marido dela, Javier, que nunca tínhamos ensinado antes, e nosso amigo Teodoro. Essa semana começamos a perceber que alguns dos nossos amigos não estavam muito firmes nos compromissos, então chegamos na fase do \"ou batiza ou larga\". Tivemos várias lições essa semana que foram canceladas em cima da hora, ou eles não estavam em casa como tinham dito, e foi isso que causou essa fase. Acabou dando certo pra gente, porque agora sabemos que esses amigos realmente se importam, só que a vida anda corrida, mas o batismo é o desejo deles. Mesmo que essa falta de lições marcadas tenha sido chata, significou que fizemos muito \"anda e fala\". Ensinamos umas lições bem legais na hora com algumas pessoas e talvez até dê pra voltar e conversar mais. Não é igual Dade City, onde sempre tem gente na rua, mas talvez nas próximas semanas, já que o tempo está esfriando de um jeito gostoso. A outra coisa incrível dessa semana foi a conferência de zona. Aprendemos muita coisa que realmente respondeu algumas das minhas perguntas como treinador. Sinto que estou indo bem, mas tem outras vezes que eu sei que simplesmente não entendo como ensinar/ajudar o Élder Izu a entender e progredir um pouquinho mais, mas é por isso que a conferência de zona e o Élder Olayan me ajudam tanto.<\/p>\n<p>O grande foco da conferência de zona foi o Pregar Meu Evangelho (PME) e o Livro de Mórmon. Precisamos garantir que estamos aplicando o PME todos os dias para nos tornarmos missionários melhores, mas também o Livro de Mórmon, para termos um testemunho forte e o Espírito conosco quando ensinamos. O Livro de Mórmon tem sido um tema bem constante mais ou menos no último mês, em outros conselhos de distrito e na última conferência de zona. Pessoalmente, eu nunca tinha entendido o poder dele até pouco tempo atrás. As escrituras que compartilhamos dele e a diferença que sinto nos dias em que leio realmente têm fortalecido meu testemunho. Sei agora mais do que nunca que esse livro é como a Bíblia, ou até melhor, e pode mudar vidas. Li uma das minhas histórias favoritas essa semana, sobre os ânti-néfi-leítas. Eles amavam tanto o Senhor, aprenderam pelo Espírito e se arrependeram, a ponto de não quererem mais lutar, para mostrar o quanto estavam dedicados a seguir a Cristo e guardar os mandamentos. É difícil ser tão justo e também amoroso com todo mundo (principalmente com os que atacam a Igreja por aí), mas por meio de Cristo podemos ser um só povo, para que não haja mais \"-itas\" (4 Néfi 1:17).<\/p>\n<p>A última coisa que quero compartilhar essa semana é sobre a autoridade que os missionários têm. Percebi muito essa semana, em várias situações, que as pessoas confiam em nós e reconhecem quem somos. Às vezes elas até contam coisas bem pessoais, e tem sido muito especial ser reconhecido como esses representantes. Também funciona ao contrário. Quando reconhecemos quem elas são, como amigas e filhas de Deus, fica muito mais fácil ensinar e também entender, mesmo sendo outra língua (às vezes com sotaques bem difíceis).<\/p>\n<p>Les amo muchísimos mis amigos (desculpa se vocês estavam esperando um pouco mais de coisas engraçadas/histórias, mas eu quis compartilhar mais das coisas espirituais e do crescimento que tive e que vi) hasta la próxima,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>🤮🎃<\/li>\n<li>estátua nova, porque os élderes de Gibsonia vivem pegando objetos aleatórios da beira da estrada e trazendo escondido<\/li>\n<li>bicicleta ergométrica ^^^^<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-11-01_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-01_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-01_0_2.jpg\" alt=\"\"><\/figure><\/div>", "text": "👻 Feliz noche de brujas 🛸 & Conferência de zona 🪅 Hola mis amigos, cómo les va? Feliz Halloween atrasado! 👻 E feliz novembro também! Essa semana foi puro 🔥 porque marcamos 3 datas de batismo! Nossa amiga Danicha & o marido dela, Javier, que nunca tínhamos ensinado antes, e nosso amigo Teodoro. Essa semana começamos a perceber que alguns dos nossos amigos não estavam muito firmes nos compromissos, então chegamos na fase do \"ou batiza ou larga\". Tivemos várias lições essa semana que foram canceladas em cima da hora, ou eles não estavam em casa como tinham dito, e foi isso que causou essa fase. Acabou dando certo pra gente, porque agora sabemos que esses amigos realmente se importam, só que a vida anda corrida, mas o batismo é o desejo deles. Mesmo que essa falta de lições marcadas tenha sido chata, significou que fizemos muito \"anda e fala\". Ensinamos umas lições bem legais na hora com algumas pessoas e talvez até dê pra voltar e conversar mais. Não é igual Dade City, onde sempre tem gente na rua, mas talvez nas próximas semanas, já que o tempo está esfriando de um jeito gostoso. A outra coisa incrível dessa semana foi a conferência de zona. Aprendemos muita coisa que realmente respondeu algumas das minhas perguntas como treinador. Sinto que estou indo bem, mas tem outras vezes que eu sei que simplesmente não entendo como ensinar/ajudar o Élder Izu a entender e progredir um pouquinho mais, mas é por isso que a conferência de zona e o Élder Olayan me ajudam tanto. O grande foco da conferência de zona foi o Pregar Meu Evangelho (PME) e o Livro de Mórmon. Precisamos garantir que estamos aplicando o PME todos os dias para nos tornarmos missionários melhores, mas também o Livro de Mórmon, para termos um testemunho forte e o Espírito conosco quando ensinamos. O Livro de Mórmon tem sido um tema bem constante mais ou menos no último mês, em outros conselhos de distrito e na última conferência de zona. Pessoalmente, eu nunca tinha entendido o poder dele até pouco tempo atrás. As escrituras que compartilhamos dele e a diferença que sinto nos dias em que leio realmente têm fortalecido meu testemunho. Sei agora mais do que nunca que esse livro é como a Bíblia, ou até melhor, e pode mudar vidas. Li uma das minhas histórias favoritas essa semana, sobre os ânti-néfi-leítas. Eles amavam tanto o Senhor, aprenderam pelo Espírito e se arrependeram, a ponto de não quererem mais lutar, para mostrar o quanto estavam dedicados a seguir a Cristo e guardar os mandamentos. É difícil ser tão justo e também amoroso com todo mundo (principalmente com os que atacam a Igreja por aí), mas por meio de Cristo podemos ser um só povo, para que não haja mais \"-itas\" (4 Néfi 1:17). A última coisa que quero compartilhar essa semana é sobre a autoridade que os missionários têm. Percebi muito essa semana, em várias situações, que as pessoas confiam em nós e reconhecem quem somos. Às vezes elas até contam coisas bem pessoais, e tem sido muito especial ser reconhecido como esses representantes. Também funciona ao contrário. Quando reconhecemos quem elas são, como amigas e filhas de Deus, fica muito mais fácil ensinar e também entender, mesmo sendo outra língua (às vezes com sotaques bem difíceis). Les amo muchísimos mis amigos (desculpa se vocês estavam esperando um pouco mais de coisas engraçadas/histórias, mas eu quis compartilhar mais das coisas espirituais e do crescimento que tive e que vi) hasta la próxima, Elder Jacobs Fotos: 🤮🎃 estátua nova, porque os élderes de Gibsonia vivem pegando objetos aleatórios da beira da estrada e trazendo escondido bicicleta ergométrica ^^^^"}, {"id": "l21", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><\/div>", "cultures": ["HT"], "moments": [], "extra": "Haiti", "kind": "Carta 21 · Lakeland", "title": "🍌😎 Agora eu sou um Élder de crioulo haitiano 🇭🇹", "date": "2021-11-08T05:23:00", "group": "2021-11", "html": "<div class=\"body\"><p>Bienvenidos amigos de nuevo ao meu canal! Jajaja brincadeira<\/p>\n<p>Essa semana foi cheia de lições incríveis e o futuro também parece bom. Nosso líder de distrito, o Élder Seamons, desafiou a gente a ensinar 40 lições na semana que vem; então estou animado e nervoso para ver como vai ser. Também está ficando 🥶 frio! Flórida e frio não pareciam combinar, mas a gente tem usado jaqueta/blusa de frio bastante. E dizem que vai piorar.<\/p>\n<p>O título dessa semana é porque eu fiz divisão de novo! Dessa vez os líderes de zona, o Élder Campbell &amp; o Elder Jacobs (agora o Sênior, já que está na missão há mais tempo), vieram para Lakeland com o Élder Izu. O Élder Olayan foi para Lake Wales com o Élder Lauritzen e eu fui para Winterhaven Crioulo com o Élder Zamor. As divisões foram muito boas, todo mundo aprendeu coisas ótimas e se divertiu. O crioulo tem umas partes parecidas com o espanhol, mas fora isso nada, então foi meio difícil em algumas lições. Por sorte o Élder Zamor é fera e conseguia traduzir muito bem pra mim, e a maioria das pessoas entendia um pouco de inglês. Tivemos até aula de inglês. Um cara da aula morou no Chile por 4 anos, então ele sabe espanhol e foi assim que a gente se comunicou. Ele também ficou muito impressionado com o meu espanhol 😎.<\/p>\n<p>Também tivemos entrevistas com o Presidente e a Sister Hollingsworth, já que a transferência está quase acabando. Eles fizeram questão de me dizer para sempre falar espanhol quando eu puder e para fazer mais simulações (roleplays), porque isso vai ajudar a mim e aos meus companheiros. Essa semana tivemos uma lição de repasse muito legal. As sisters de Highland encontraram um cara pelo anúncio de Bíblia grátis delas, e ele sabia um pouco de inglês e queria aprender mais, e também sobre a Bíblia. A barreira da língua acabou sendo um pouco demais, então as perguntas/respostas não estavam sendo totalmente entendidas, e é por isso que agora nós estamos ensinando eles. A lição dessa semana, depois de as sisters nos apresentarem, foi uma loucura. No começo eles ficaram confusos sobre por que a gente estava lá, porque tinham dito a eles que viriam missionários de espanhol jaja, aí quando perceberam que a gente sabe falar, as comportas se abriram...<\/p>\n<p>Ficamos lá 2 horas tentando responder o monte Everest de perguntas deles. Eles são muito legais e vamos voltar lá para responder mais 😅<\/p>\n<p>Uma das melhores coisas dessa semana, embora a semana toda tenha sido bem boa, foi a notícia sobre o fim do horário de verão. Como das 18h às 21h, o \"horário nobre\", vai estar escuro, agora a gente pode estar na rua nesse horário! Podemos fazer visitas sem marcar depois que escurece de novo e bater portas de forma estratégica. Com certeza estou animado com isso, porque vamos poder fazer bem menos ligações à noite quando as coisas furam e, em vez disso, partir pro \"anda e fala\" e talvez um pouquinho de \"bate porta\".<\/p>\n<p>Essa semana, como distrito, temos definido metas nas nossas duplas e depois mandado uma mensagem à noite dizendo como foi. Metas são muito importantes, porque sem algo em mente pelo qual trabalhar é difícil, quase impossível, continuar firme. Se você quer fortalecer seu testemunho, precisa descobrir como vai fazer isso. Escrituras e oração? OK, mas com que frequência e quanto? Ou até que dia eu quero terminar o livro de ____? Isso também vale para outras coisas da vida, como exercício, música, escola, esportes, videogame. Mas percebi essa semana o quanto trabalhamos melhor com metas e os milagres que vemos.<\/p>\n<p>Eu falei que o Élder Seamons nos desafiou a fazer 40 lições na semana que vem, mas é porque ele e os companheiros dele definiram essa meta e foram trabalhando nela com metas diárias menores. Eles conseguiram e tinham um monte de milagres incríveis para nos contar.<\/p>\n<p>Não esqueçam de curtir, comentar e se inscrever! (OK, agora eu paro de verdade)<\/p>\n<p>Cuidense!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.S. Eu leio todos os e-mails que recebo, só não consigo responder até segunda. E às vezes eu esqueço de responder ou não dá tempo, então me desculpem muito! Espero que vocês continuem me mandando e-mails, porque eu amo ter notícias de vocês!<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Conferência de zona de Lakeland (da esquerda para a direita: Élder Seamons, Astorga, Dana, Izu, eu, Olayan, Campbell, Zamor, Lauritzen e Jacobs)<\/li>\n<li>chuva<\/li>\n<li>nossos cortes de cabelo novos enquanto estávamos na chuva fria<\/li>\n<li>mais chuva<\/li>\n<li>lição por telefone<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-11-08_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-08_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-08_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-08_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-11-08_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-11-08_0_5.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_086.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_087.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_088.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_089.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_090.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_091.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_092.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_093.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🍌😎 Agora eu sou um Élder de crioulo haitiano 🇭🇹 Bienvenidos amigos de nuevo ao meu canal! Jajaja brincadeira Essa semana foi cheia de lições incríveis e o futuro também parece bom. Nosso líder de distrito, o Élder Seamons, desafiou a gente a ensinar 40 lições na semana que vem; então estou animado e nervoso para ver como vai ser. Também es quanto estávamos na chuva fria mais chuva lição por telefone Mais desta semana"}, {"id": "l22", "area": 2, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LAKELAND, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 22 · Lakeland", "title": "A semana das 40 lições! 🤤🔥🛸", "date": "2021-11-15T07:41:00", "group": "2021-11", "html": "<div class=\"body\"><p>Buenos Días amigos!<\/p>\n<p>A última semana dessa transferência foi incrível! Puxada às vezes, mas com certeza cheia de milagres. Uma coisa que eu e meus companheiros começamos a fazer para valorizar os milagres de cada dia é, quando já estamos na cama, dizer o que achamos que foi o milagre do dia. Também é interessante porque normalmente escolhemos coisas diferentes.<\/p>\n<p>Milagres dessa semana:<\/p>\n<ul class=\"bul\">\n<li>42 lições ensinadas!<\/li>\n<li>21 novos amigos! (nossa meta era 7!)<\/li>\n<li>refeições com membros 🌮🌯🫔🥙<\/li>\n<li>2ª chance de falar com alguém (eu falei com o pai desse cara e ele não tem muito interesse, mas ontem falei com o próprio cara, que tem MUITO interesse! Da última vez que vi ele, meio que deixei de falar com ele, mas estou feliz por ter recebido uma 2ª chance)<\/li>\n<li>Nosso distrito teve 112 lições e encontrou 40 amigos!<\/li>\n<li>e muito mais!<\/li>\n<\/ul>\n<p>Citando o Élder Maxwell (eu acho, não consegui achar o discurso de novo nem a citação exata),<\/p>\n<p>\"Devemos contar nossas bênçãos, mas também fazer com que elas contem\"<\/p>\n<p>Outras coisas que aconteceram essa semana. Demos aula de inglês para um membro e os amigos dele. Eles não sabem muito, só umas piadas, então foi bem engraçado, jajaja. Tive 2 divisões! Na primeira eu fiquei com o Élder Olayan enquanto o Élder Izu e o Élder Dana trocaram. Foi uma boa divisão e realmente nos motivou para a semana de 40+ lições, já que o Élder Dana e os outros de Gibsonia tinham conseguido na semana anterior. Na 2ª eu fui para Gibsonia 🐟 com o Élder Astorga e o Élder Dana. Nosso dia foi bem, infelizmente tivemos lições canceladas e foi difícil conseguir mais, mas no geral ainda foi uma boa divisão.<\/p>\n<p>Não aconteceu muita coisa além disso porque estávamos quase o tempo todo na rua fazendo o Anda, Fala &amp; às vezes o Bate Porta. Mas foi divertido.<\/p>\n<p class=\"sign\">Los amo amigos míos y hasta luego!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Notícias da transferência: o Élder Olayan vai voltar pra casa (os 2 anos acabaram), e eu e o Élder Izu vamos para Cypress Gardens East! O Élder Izu estava lá na transferência antes dessa aqui no lado oeste, então agora a gente volta jaja.<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Nossos móveis novos! (Não perguntem onde nem como conseguimos, mas confiem no processo. É bem confortável também! Isso é só metade de um banco de igreja)<\/li>\n<li>O batismo do Juan Zamora! (finalmente consegui a foto do batismo do Juan que eu perdi porque fui transferido na semana anterior. Élder Ricks com o Élder Makechine e o treinado deles)<\/li>\n<li>Empanadas com os Companheiros<\/li>\n<li>Carro-ônibus grandão (não foi o maior que vi essa semana, mas eu estava dirigindo, entããão nada de foto do gigante)<\/li>\n<li>Huarache (mais ou menos uma tostada grande, eu comi com Al pastor 🤤)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-11-15_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-15_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-15_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-15_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-15_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-15_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_094.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_095.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_096.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_097.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_098.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_099.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_100.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_101.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_102.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_103.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_104.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "A semana das 40 lições! 🤤🔥🛸 Buenos Días amigos! A última semana dessa transferência foi incrível! Puxada às vezes, mas com certeza cheia de milagres. Uma coisa que eu e meus companheiros começamos a fazer para valorizar os milagres de cada dia é, quando já estamos na cama, dizer o que achamos que foi o milagre do dia. Também é interessante porque normalmente escolhemos coisas diferentes. Milagres dessa semana: 42 lições ensinadas! 21 novos amigos! (nossa meta era 7!) refeições com membros 🌮🌯🫔🥙 2ª chance de falar com alguém (eu falei com o pai desse cara e ele não tem muito interesse, mas ontem falei com o próprio cara, que tem MUITO interesse! Da última vez que vi ele, meio que deixei de falar com ele, mas estou feliz por ter recebido uma 2ª chance) Nosso distrito teve 112 lições e encontrou 40 amigos! e muito mais! Citando o Élder Maxwell (eu acho, não consegui achar o discurso de novo nem a citação exata), \"Devemos contar nossas bênçãos, mas também fazer com que elas contem\" Outras coisas que aconteceram essa semana. Demos aula de inglês para um membro e os amigos dele. Eles não sabem muito, só umas piadas, então foi bem engraçado, jajaja. Tive 2 divisões! Na primeira eu fiquei com o Élder Olayan enquanto o Élder Izu e o Élder Dana trocaram. Foi uma boa divisão e realmente nos motivou para a semana de 40+ lições, já que o Élder Dana e os outros de Gibsonia tinham conseguido na semana anterior. Na 2ª eu fui para Gibsonia 🐟 com o Élder Astorga e o Élder Dana. Nosso dia foi bem, infelizmente tivemos lições canceladas e foi difícil conseguir mais, mas no geral ainda foi uma boa divisão. Não aconteceu muita coisa além disso porque estávamos quase o tempo todo na rua fazendo o Anda, Fala & às vezes o Bate Porta. Mas foi divertido. Los amo amigos míos y hasta luego! Elder Jacobs Notícias da transferência: o Élder Olayan vai voltar pra casa (os 2 anos acabaram), e eu e o Élder Izu vamos para Cypress Gardens East! O Élder Izu estava lá na transferência antes dessa aqui no lado oeste, então agora a gente volta jaja. Fotos: Nossos móveis novos! (Não perguntem onde nem como conseguimos, mas confiem no processo. É bem confortável também! Isso é só metade de um banco de igreja) O batismo do Juan Zamora! (finalmente consegui a foto do batismo do Juan que eu perdi porque fui transferido na semana anterior. Élder Ricks com o Élder Makechine e o treinado deles) Empanadas com os Companheiros Carro-ônibus grandão (não foi o maior que vi essa semana, mas eu estava dirigindo, entããão nada de foto do gigante) Huarache (mais ou menos uma tostada grande, eu comi com Al pastor 🤤) Mais desta semana"}, {"id": "l23", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><\/div>", "cultures": ["HT"], "moments": [], "extra": "Haiti", "kind": "Carta 23 · Winter Haven", "title": "🦍🐟 Missão: sobreviver...🏴‍☠️", "date": "2021-11-22T06:00:00", "group": "2021-11", "html": "<div class=\"body\"><p>Buenos Días mis amigos!<\/p>\n<p>Não vou mentir, essa semana foi meio difícil. Chegar numa área onde os dois são novos (o famoso whitewash) é difícil. Sair de uma área onde eu conheço as ruas quase perfeitamente, com muita gente nova para ensinar e onde conheço bem os membros, e ir para uma área nova onde nenhum de nós conhece muita coisa, ainda conhecemos os membros, só que não desse lado, e sem quase nenhum amigo para ensinar. A gente tentou aproveitar o máximo entrando em contato com pessoas que o Élder Izu lembrava de 2 transferências atrás e fazendo as outras coisas de missionário (principalmente busca essa semana).<\/p>\n<p>No geral, depois de irmos com tudo e ralarmos muito na busca, a gente se divertiu bastante e começou a ver o que fazer com essa área nova. A melhor parte dessa transferência é que agora estamos na parte leste, ou seja, o lado de Winterhaven, mas ainda na mesma ala e na mesma zona, e até continuamos no mesmo distrito!<\/p>\n<p>O dia da transferência foi divertido, mas também triste. Consegui ver de novo muitos dos outros missionários que eu conheço, como o Élder CJ Ricks, o Élder Nelson, o Élder Jenson etc. Mas tivemos que nos despedir do Élder Olayan. Tomamos milk-shake do Wawa (já que não tem em Utah) e nos despedimos nas transferências. Eu e o Élder Izu fizemos questão de usar as gravatas que ele trocou com a gente.<\/p>\n<p>Outras coisas dessa semana: fomos na noche de fútbol (noite de futebol com alguns membros da ala, e todo mundo tenta levar amigos para a gente também encontrar pessoas novas para ensinar). Foi muito divertido, começou a chover.<\/p>\n<p>Encontramos 5 haitianos sem querer enquanto procurávamos latinos. Um baita milagre, já que quase não tem, mas ontem achamos os haitianos no palheiro.<\/p>\n<p>Espero que esteja tudo bem e vejo vocês semana que vem com muito mais coisa pra contar!<\/p>\n<p class=\"sign\">Los amo<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Arte de rua em Winterhaven<\/li>\n<li>peixe grande<\/li>\n<li>Fonte de coração<\/li>\n<li>despedida do Élder Olayan<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-11-22_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-22_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-11-22_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-22_0_3.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_105.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_106.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_107.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_108.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_109.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_110.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_111.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_112.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🦍🐟 Missão: sobreviver...🏴‍☠️ Buenos Días mis amigos! Não vou mentir, essa semana foi meio difícil. Chegar numa área onde os dois são novos (o famoso whitewash) é difícil. Sair de uma área onde eu conheço as ruas quase perfeitamente, com muita gente nova para ensinar e onde conheço bem os membros, e ir para uma área nova onde nenhum de nós conhece muita coisa, ainda conhecemos os membros, só que não desse lado, e sem quase nenhum amigo para ensinar. A gente tentou aproveitar o máximo entrando em contato com pessoas que o Élder Izu lembrava de 2 transferências atrás e fazendo as outras coisas de missionário (principalmente busca essa semana). No geral, depois de irmos com tudo e ralarmos muito na busca, a gente se divertiu bastante e começou a ver o que fazer com essa área nova. A melhor parte dessa transferência é que agora estamos na parte leste, ou seja, o lado de Winterhaven, mas ainda na mesma ala e na mesma zona, e até continuamos no mesmo distrito! O dia da transferência foi divertido, mas também triste. Consegui ver de novo muitos dos outros missionários que eu conheço, como o Élder CJ Ricks, o Élder Nelson, o Élder Jenson etc. Mas tivemos que nos despedir do Élder Olayan. Tomamos milk-shake do Wawa (já que não tem em Utah) e nos despedimos nas transferências. Eu e o Élder Izu fizemos questão de usar as gravatas que ele trocou com a gente. Outras coisas dessa semana: fomos na noche de fútbol (noite de futebol com alguns membros da ala, e todo mundo tenta levar amigos para a gente também encontrar pessoas novas para ensinar). Foi muito divertido, começou a chover. Encontramos 5 haitianos sem querer enquanto procurávamos latinos. Um baita milagre, já que quase não tem, mas ontem achamos os haitianos no palheiro. Espero que esteja tudo bem e vejo vocês semana que vem com muito mais coisa pra contar! Los amo Elder Jacobs Fotos: Arte de rua em Winterhaven peixe grande Fonte de coração despedida do Élder Olayan Mais desta semana"}, {"id": "l24", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">NOV 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Holidays"], "extra": "", "kind": "Carta 24 · Winter Haven", "title": "🍁🍂 Feliz día de acción de gracias! 🦃🦤", "date": "2021-11-29T09:49:00", "group": "2021-11", "html": "<div class=\"body\"><p>Buenas! Mis amigos!<\/p>\n<p>Essa semana foi bem boa, principalmente porque teve Ação de Graças! Espero que todos vocês tenham tido um Dia de Ação de Graças e comido muito, como eu comi. Tivemos um almoço de Ação de Graças com o nosso distrito, que foi incrível (cada um ganhou seu próprio Martinelli jaja), e mais tarde um membro nos convidou para jantar. Eles fizeram vários perus e acompanhamentos; foi incrível (e ainda sobrou muita coisa que eles nos deram).<\/p>\n<p>Passamos muito tempo na busca, ou seja, no \"anda e fala\" e às vezes no \"bate porta\". Então não foi uma semana muito movimentada, mas conseguimos marcar uma data de batismo com o nosso amigo Arnulfo! Ele está muito animado e ama o sentimento que tem na igreja, então nós também estamos empolgadíssimos.<\/p>\n<p>Uma coisa que eu queria compartilhar do meu estudo dessa semana é o poder que temos quando falamos. Eu estava lendo um discurso chamado \"A Língua dos Anjos\". Foi um discurso incrível do Élder Holland e com certeza apontou muitas coisas que eu já vi como missionário. O jeito como dizemos as coisas importa, porque a reação da pessoa vai depender do entendimento e da história dela. Também importa como família, amigos e estranhos. Tem muita coisa no discurso, então não dá pra explicar tudo, então vão ler.<\/p>\n<p>Hasta la proxima,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Ação de Graças<\/li>\n<li>cachorra (Hachi), ela seguiu a gente por um tempão<\/li>\n<li>experimentei Malta (era de boa)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-11-29_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-29_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-11-29_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-29_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-11-29_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_113.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_114.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_115.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🍁🍂 Feliz día de acción de gracias! 🦃🦤 Buenas! Mis amigos! Essa semana foi bem boa, principalmente porque teve Ação de Graças! Espero que todos vocês tenham tido um Dia de Ação de Graças e comido muito, como eu comi. Tivemos um almoço de Ação de Graças com o nosso distrito, que foi incrível (cada um ganhou seu próprio Martinelli jaja), e mais tarde um membro nos convidou para jantar. Eles fizeram vários perus e acompanhamentos; foi incrível (e ainda sobrou muita coisa que eles nos deram). Passamos muito tempo na busca, ou seja, no \"anda e fala\" e às vezes no \"bate porta\". Então não foi uma semana muito movimentada, mas conseguimos marcar uma data de batismo com o nosso amigo Arnulfo! Ele está muito animado e ama o sentimento que tem na igreja, então nós também estamos empolgadíssimos. Uma coisa que eu queria compartilhar do meu estudo dessa semana é o poder que temos quando falamos. Eu estava lendo um discurso chamado \"A Língua dos Anjos\". Foi um discurso incrível do Élder Holland e com certeza apontou muitas coisas que eu já vi como missionário. O jeito como dizemos as coisas importa, porque a reação da pessoa vai depender do entendimento e da história dela. Também importa como família, amigos e estranhos. Tem muita coisa no discurso, então não dá pra explicar tudo, então vão ler. Hasta la proxima, Elder Jacobs Fotos: Ação de Graças cachorra (Hachi), ela seguiu a gente por um tempão experimentei Malta (era de boa) Mais desta semana"}, {"id": "l25", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DEZ 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": [], "moments": ["Holidays"], "extra": "", "kind": "Carta 25 · Winter Haven", "title": "Feliz dezembro!", "date": "2021-12-06T12:38:00", "group": "2021-12", "html": "<div class=\"body\"><p>Buenas amigos!<\/p>\n<p>Feliz dezembro! Essa semana foi boa e muito produtiva. A próxima também está parecendo ótima!<\/p>\n<p>Sei lá se tem alguma coisa muito especial pra contar essa semana, mas acho que posso contar algumas coisas que considerei milagres: finalmente conseguimos falar com alguns dos nossos amigos e tivemos umas lições 🔥.<\/p>\n<p>Encontramos umas pessoas superescolhidas! Elas aceitaram muito bem a Restauração.<\/p>\n<p>Depois de uma noite inteira de horário nobre (mandando mensagens no Facebook) e quase nada acontecendo (#SemAnúnciosNovos), tivemos uma lição e o cara pareceu gostar muito da mensagem e quer ir à igreja!<\/p>\n<p>Coisas divertidas:<\/p>\n<p>Visitamos o nugget de frango queimado em Eloise (procurem no Google, é real jaja)<\/p>\n<p>O Élder Dana veio fazer divisão com a gente e tirou uma foto com o Papai Noel negro.<\/p>\n<p>Também fizemos 3 cachorros gostarem tanto da gente que eles tentaram nos seguir enquanto andávamos por aí.<\/p>\n<p>#bonsgarotos<\/p>\n<p>Nesse sábado vamos, como missão, conhecer e ouvir o Élder Soares junto com alguns outros.<\/p>\n<p>Cuidense mis queridos amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>meio que um unicórnio jaha<\/li>\n<li>nossa árvore de Natal 🎄<\/li>\n<li>placa engraçada<\/li>\n<li>experimentei uma raspadinha da Pelican<\/li>\n<li>hidrante quebrado (ganhamos uma lavagem de carro de graça)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-12-06_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-12-06_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-06_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-06_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_116.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_117.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_118.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_119.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Feliz dezembro! Buenas amigos! Feliz dezembro! Essa semana foi boa e muito produtiva. A próxima também está parecendo ótima! Sei lá se tem alguma coisa muito especial pra contar essa semana, mas acho que posso contar algumas coisas que considerei milagres: finalmente conseguimos falar com alguns dos nossos amigos e tivemos umas lições 🔥. Encontramos umas pessoas superescolhidas! Elas aceitaram muito bem a Restauração. Depois de uma noite inteira de horário nobre (mandando mensagens no Facebook) e quase nada acontecendo (#SemAnúnciosNovos), tivemos uma lição e o cara pareceu gostar muito da mensagem e quer ir à igreja! Coisas divertidas: Visitamos o nugget de frango queimado em Eloise (procurem no Google, é real jaja) O Élder Dana veio fazer divisão com a gente e tirou uma foto com o Papai Noel negro. Também fizemos 3 cachorros gostarem tanto da gente que eles tentaram nos seguir enquanto andávamos por aí. #bonsgarotos Nesse sábado vamos, como missão, conhecer e ouvir o Élder Soares junto com alguns outros. Cuidense mis queridos amigos, Elder Jacobs Fotos: meio que um unicórnio jaha nossa árvore de Natal 🎄 placa engraçada experimentei uma raspadinha da Pelican hidrante quebrado (ganhamos uma lavagem de carro de graça) Mais desta semana"}, {"id": "l26", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DEZ 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["PR", "BR"], "moments": ["Baptism"], "extra": "Puerto Rico Brazil", "kind": "Carta 26 · Winter Haven", "title": "📈💰 Apóstolo do Senhor 🦤🎰", "date": "2021-12-13T07:01:00", "group": "2021-12", "html": "<div class=\"body\"><p>Buenas! Amigos míos,<\/p>\n<p>Qué pasao? (\"E aí?\", só que em gíria porto-riquenha). Essa semana foi muito boa e tem muito trabalho pra fazer na próxima também! Estou animado.<\/p>\n<p>Na segunda tivemos a entrevista batismal do Arnulfo! Correu tudo muito bem (foi no meio de um 🌶 chiles porque estávamos esperando a comida. Ele quis mostrar a gratidão dele por nós). Ele ainda não tem data de batismo porque o trabalho dele está uma loucura e ele precisa conseguir folga total aos domingos para não ter problemas no futuro. Com sorte vai acontecer logo. Ele sabe como é importante.<\/p>\n<p>Encontramos um cara muito incrível chamado Miguel. Marcamos a data de batismo dele para o dia 19! Ele fala praticamente só inglês, então agora os outros élderes estão ensinando ele, mas vemos ele na igreja e, com sorte, no batismo dele essa semana! Fomos parados na rua 2x enquanto estávamos de bicicleta. Um cara era bem legal e queria a nossa opinião sobre a interpretação de alguns versículos da Bíblia, e os outros eram 2 moças vendendo energia solar. Elas queriam falar com a gente porque somos \"os batedores de porta originais\", e quando descobriram que somos bilíngues fomos chamados de \"o padrão de ouro\". Uma interação bem engraçada, porque elas também pediram dicas de como bater portas jaja (elas deram água pra gente, o que foi legal. Foi uma semana bem quente). As mensagens do horário nobre (das 18h às 21h, respondendo mensagens e comentários nos anúncios do Facebook tentando marcar lições e mandar referências) foram muito bem essa semana! Encontramos 5 novos amigos e conseguimos mandar eles para outras áreas dentro e fora da missão e, por sorte, para a nossa própria área. A gente terminava uma lição e aí outra pessoa dizia que queria conversar e mandava o número também! Foi incrível, um monte de lições uma atrás da outra.<\/p>\n<p>A última coisa muito incrível dessa semana foi o Élder Soares. Ele, junto com 3 dos Setenta (Élder Holland, Élder Patrick e Élder Johnson), veio para a Flórida. Eles falaram com os jovens adultos na quinta à noite, com quem fala espanhol na sexta, e no sábado de manhã com a nossa missão! À noite, com os líderes. Foi muito divertido poder ver todos os outros missionários, tirar uma foto todos juntos e depois ouvir as palavras de um apóstolo. Ele é um cara bem engraçado também! O inglês é a 5ª língua dele, depois do português, espanhol, francês e italiano, então ele falou umas frases engraçadas e não teve problema em rir de si mesmo. Todas as palavras deles para nós tiveram muito a ver com o nosso propósito divino e o nosso chamado como missionários, mesmo sem eles terem combinado entre si. Essa semana comecei Helamã. Os nefitas e os lamanitas têm paz e guerra e paz de novo, mas só quando Cristo está no centro. Também há muito mais bênçãos quando Cristo e os mandamentos são a prioridade deles. Como missionário, a maior parte disso é bem fácil de fazer, mas às vezes nos distraímos com outras coisas de menos valor. Bom, melhor e excelente, como dizem alguns sábios. Às vezes o jeito de melhorar é deixar coisas menores para trás, porque já temos as melhores coisas, mas esquecemos de colocá-las na nossa agenda porque as coisas menores estão ocupando espaço. Pasta luego mis queridos amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Boba Fett &amp; Baby Yoda<\/li>\n<li>slopes (basicamente uma tostada, mas com uma tigela de massa frita pra segurar tudo melhor)<\/li>\n<li>filhotes que seguiram a gente por aí (se eu ganhasse uma moedinha toda vez que um cachorro me seguisse, eu teria várias moedinhas [adivinhem o desenho])<\/li>\n<li>presépio que o Miguel fez<\/li>\n<li>Chippy e o Élder Izu durante a nossa lição<\/li>\n<li>minion<\/li>\n<li>sapo &amp; 🦎☠<\/li>\n<li>agora a nossa árvore tem enfeites<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-12-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-13_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-13_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_0_5.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-13_1_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-12-13_1_1.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_1_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-13_2_0.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_120.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_121.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_122.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_123.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_124.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "📈💰 Apóstolo do Senhor 🦤🎰 Buenas! Amigos míos, Qué pasao? (\"E aí?\", só que em gíria porto-riquenha). Essa semana foi muito boa e tem muito trabalho pra fazer na próxima também! Estou animado. Na segunda tivemos a entrevista batismal do Arnulfo! Correu tudo muito bem (foi no meio de um 🌶 chiles porque estávamos esperando a comida. Ele quis mostrar a gratidão dele por nós). Ele ainda não tem data de batismo porque o trabalho dele está uma loucura e ele precisa conseguir folga total aos domingos para não ter problemas no futuro. Com sorte vai acontecer logo. Ele sabe como é importante. Encontramos um cara muito incrível chamado Miguel. Marcamos a data de batismo dele para o dia 19! Ele fala praticamente só inglês, então agora os outros élderes estão ensinando ele, mas vemos ele na igreja e, com sorte, no batismo dele essa semana! Fomos parados na rua 2x enquanto estávamos de bicicleta. Um cara era bem legal e queria a nossa opinião sobre a interpretação de alguns versículos da Bíblia, e os outros eram 2 moças vendendo energia solar. Elas queriam falar com a gente porque somos \"os batedores de porta originais\", e quando descobriram que somos bilíngues fomos chamados de \"o padrão de ouro\". Uma interação bem engraçada, porque elas também pediram dicas de como bater portas jaja (elas deram água pra gente, o que foi legal. Foi uma semana bem quente). As mensagens do horário nobre (das 18h às 21h, respondendo mensagens e comentários nos anúncios do Facebook tentando marcar lições e mandar referências) foram muito bem essa semana! Encontramos 5 novos amigos e conseguimos mandar eles para outras áreas dentro e fora da missão e, por sorte, para a nossa própria área. A gente terminava uma lição e aí outra pessoa dizia que queria conversar e mandava o número também! Foi incrível, um monte de lições uma atrás da outra. A última coisa muito incrível dessa semana foi o Élder Soares. Ele, junto com 3 dos Setenta (Élder Holland, Élder Patrick e Élder Johnson), veio para a Flórida. Eles falaram com os jovens adultos na quinta à noite, com quem fala espanhol na sexta, e no sábado de manhã com a nossa missão! À noite, com os líderes. Foi muito divertido poder ver todos os outros missionários, tirar uma foto todos juntos e depois ouvir as palavras de um apóstolo. Ele é um cara bem engraçado também! O inglês é a 5ª língua dele, depois do português, espanhol, francês e italiano, então ele falou umas frases engraçadas e não teve problema em rir de si mesmo. Todas as palavras deles para nós tiveram muito a ver com o nosso propósito divino e o nosso chamado como missionários, mesmo sem eles terem combinado entre si. Essa semana comecei Helamã. Os nefitas e os lamanitas têm paz e guerra e paz de novo, mas só quando Cristo está no centro. Também há muito mais bênçãos quando Cristo e os mandamentos são a prioridade deles. Como missionário, a maior parte disso é bem fácil de fazer, mas às vezes nos distraímos com outras coisas de menos valor. Bom, melhor e excelente, como dizem alguns sábios. Às vezes o jeito de melhorar é deixar coisas menores para trás, porque já temos as melhores coisas, mas esquecemos de colocá-las na nossa agenda porque as coisas menores estão ocupando espaço. Pasta luego mis queridos amigos, Elder Jacobs Fotos: Boba Fett & Baby Yoda slopes (basicamente uma tostada, mas com uma tigela de massa frita pra segurar tudo melhor) filhotes que seguiram a gente por aí (se eu ganhasse uma moedinha toda vez que um cachorro me seguisse, eu teria várias moedinhas [adivinhem o desenho]) presépio que o Miguel fez Chippy e o Élder Izu durante a nossa lição minion sapo & 🦎☠ agora a nossa árvore tem enfeites Mais desta semana"}, {"id": "l27", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DEZ 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": ["PR"], "moments": ["Baptism", "Holidays"], "extra": "Puerto Rico", "kind": "Carta 27 · Winter Haven", "title": "🎊🎁 Feliz Navidad 🎄", "date": "2021-12-20T11:59:00", "group": "2021-12", "html": "<div class=\"body\"><p>Feliz Natal mis queridos amigos!<\/p>\n<p>O Natal é uma das minhas épocas favoritas do ano e como missionário também tem sido muito bom. Continuo ensinando, mas também ajudando a levar o espírito do Natal.<\/p>\n<p>Tivemos a festa de Natal da ala, que foi muito divertida. Alguns amigos foram e tinha muita comida boa, música e clima de Natal 🎄. 2 membros nos deram presentes 🎁. Uma gravata nova e um colar porto-riquenho, olhem as fotos. Tivemos conferência de zona na quarta. Foi muito incrível ver de novo alguns dos outros missionários (o Élder Nelson &amp; o novo treinado dele, ou seja, o meu 3º irmão).<\/p>\n<p>Divisão essa semana de segunda à noite até quarta de manhã. O Élder Seamons &amp; o Élder Dana vieram ficar comigo em Cypress Gardens. Foi muito divertido. Tentamos conversar com um pássaro maluco que um cara tinha. Demos aula de inglês para um monte de gente! Foi uma loucura, mas incrível.<\/p>\n<p>No domingo o Miguel foi batizado! Eu e o Élder Izu encontramos ele semana passada, mas como ele fala praticamente só inglês, tivemos que passar ele para os outros élderes. Por sorte o batismo dele foi antes da nossa reunião, então também conseguimos ir e fazer discursos. Ele estava muito animado.<\/p>\n<p>A ala também teve o primeiro coral de Natal, então isso foi legal.<\/p>\n<p>Essa semana foi boa, mesmo eu meio que não lembrando dela.<\/p>\n<p>Acabei de chegar em 3 Néfi na minha leitura. Eu amo todas as profecias sobre Cristo. Com certeza incentivo vocês a lerem algumas escrituras sobre o que Cristo fez por nós ou por que o nascimento Dele é tão importante.<\/p>\n<p>Feliz Natal, pessoal (\"coma chumbo, seu animal imundo\", eu amo Esqueceram de Mim),<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.S. por favor orem para que nossos amigos melhorem logo (principalmente o Vidal, que está com umas pedras nos rins bem feias)<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Batismo do Miguel<\/li>\n<li>gravatas<\/li>\n<li>colar<\/li>\n<li>pássaro<\/li>\n<li>orelha de elefante (nem é a maior que eu já vi)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-12-20_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-20_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-20_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_125.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_126.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_127.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_128.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_129.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_130.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_131.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_132.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_133.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_134.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_135.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_136.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_137.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_138.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_139.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_140.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🎊🎁 Feliz Navidad 🎄 Feliz Natal mis queridos amigos! O Natal é uma das minhas épocas favoritas do ano e como missionário também tem sido muito bom. Continuo ensinando, mas também ajudando a levar o espírito do Natal. Tivemos a festa de Natal da ala, que foi muito divertida. Alguns amigos foram e tinha muita comida boa, música e clima de Natal 🎄. 2 membros nos deram presentes 🎁. Uma gravata nova e um colar porto-riquenho, olhem as fotos. Tivemos conferência de zona na quarta. Foi muito incrível ver de novo alguns dos outros missionários (o Élder Nelson & o novo treinado dele, ou seja, o meu 3º irmão). Divisão essa semana de segunda à noite até quarta de manhã. O Élder Seamons & o Élder Dana vieram ficar comigo em Cypress Gardens. Foi muito divertido. Tentamos conversar com um pássaro maluco que um cara tinha. Demos aula de inglês para um monte de gente! Foi uma loucura, mas incrível. No domingo o Miguel foi batizado! Eu e o Élder Izu encontramos ele semana passada, mas como ele fala praticamente só inglês, tivemos que passar ele para os outros élderes. Por sorte o batismo dele foi antes da nossa reunião, então também conseguimos ir e fazer discursos. Ele estava muito animado. A ala também teve o primeiro coral de Natal, então isso foi legal. Essa semana foi boa, mesmo eu meio que não lembrando dela. Acabei de chegar em 3 Néfi na minha leitura. Eu amo todas as profecias sobre Cristo. Com certeza incentivo vocês a lerem algumas escrituras sobre o que Cristo fez por nós ou por que o nascimento Dele é tão importante. Feliz Natal, pessoal (\"coma chumbo, seu animal imundo\", eu amo Esqueceram de Mim), Elder Jacobs P.S. por favor orem para que nossos amigos melhorem logo (principalmente o Vidal, que está com umas pedras nos rins bem feias) Fotos: Batismo do Miguel gravatas colar pássaro orelha de elefante (nem é a maior que eu já vi) Mais desta semana"}, {"id": "l28", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">DEZ 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": [], "moments": ["Holidays"], "extra": "", "kind": "Carta 28 · Winter Haven", "title": "🎊🎆🐉Feliz año nuevo! 🎉✨", "date": "2021-12-27T06:46:00", "group": "2021-12", "html": "<div class=\"body\"><p>Espero que todo mundo tenha tido uma véspera e um dia de Natal incríveis!<\/p>\n<p>(sim, falei da véspera de Natal porque foi quando a maioria dos nossos amigos comemorou. Comemoram à noite até bem tarde e dormem o dia 25 inteiro).<\/p>\n<p>Ser missionário na época do Natal é ótimo, mas na véspera e no dia de Natal nem tanto. No fim encontramos algo para fazer (fazer cookies e levar para as pessoas). Também é uma tradição da família, então eu gostei muito de compartilhar isso com o Élder Izu e alguns outros missionários também.<\/p>\n<p>Alguns membros também nos deram comida nessas duas noites e, claro, abrimos presentes 🎁. 👔👔👔 Nos juntamos para um brunch do distrito e comemos um monte de comida no Natal.<\/p>\n<p>Essa semana conversamos com um ex-pesquisador que tem um testemunho muito forte do Evangelho e do Livro de Mórmon, o único problema é que ele está bem ocupado agora, então com sorte depois do Ano-Novo podemos voltar a ensinar ele. Também encontramos 2 membros que perderam o contato com a igreja quando se mudaram, então conseguimos ajudar com isso! (Mais portadores do sacerdócio!) Tivemos entrevistas com o Presidente e a esposa dele. O Presidente acabou se atrasando, mas a Sister Hollingsworth já tinha terminado, então todos nós simplesmente voltamos e tivemos uma entrevista em grupo com ela jaja. Eu amo poder me reunir com eles, receber ajuda e sentir o amor deles. Aliás, mãe, eles me amam e não querem que você se preocupe jaja.<\/p>\n<p>Enfim, los amamos mucho amigos. Espero que o Ano-Novo de vocês seja incrível também. Me contem se vocês têm alguma resolução engraçada esse ano,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Eu e o Élder Izu fazendo cookies<\/li>\n<li>Recorte de papelão do Luke Skywalker do amigo da onça<\/li>\n<li>resultados do amigo da onça<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-12-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-12-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-12-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-12-27_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_141.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_142.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_143.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_144.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_145.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_146.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_147.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_148.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🎊🎆🐉Feliz año nuevo! 🎉✨ Espero que todo mundo tenha tido uma véspera e um dia de Natal incríveis! (sim, falei da véspera de Natal porque foi quando a maioria dos nossos amigos comemorou. Comemoram à noite até bem tarde e dormem o dia 25 inteiro). Ser missionário na época do Natal é ótimo, mas na véspera e no dia de Natal nem tanto. No fim encontramos algo para fazer (fazer cookies e levar para as pessoas). Também é uma tradição da família, então eu gostei muito de compartilhar isso com o Élder Izu e alguns outros missionários também. Alguns membros também nos deram comida nessas duas noites e, claro, abrimos presentes 🎁. 👔👔👔 Nos juntamos para um brunch do distrito e comemos um monte de comida no Natal. Essa semana conversamos com um ex-pesquisador que tem um testemunho muito forte do Evangelho e do Livro de Mórmon, o único problema é que ele está bem ocupado agora, então com sorte depois do Ano-Novo podemos voltar a ensinar ele. Também encontramos 2 membros que perderam o contato com a igreja quando se mudaram, então conseguimos ajudar com isso! (Mais portadores do sacerdócio!) Tivemos entrevistas com o Presidente e a esposa dele. O Presidente acabou se atrasando, mas a Sister Hollingsworth já tinha terminado, então todos nós simplesmente voltamos e tivemos uma entrevista em grupo com ela jaja. Eu amo poder me reunir com eles, receber ajuda e sentir o amor deles. Aliás, mãe, eles me amam e não querem que você se preocupe jaja. Enfim, los amamos mucho amigos. Espero que o Ano-Novo de vocês seja incrível também. Me contem se vocês têm alguma resolução engraçada esse ano, Elder Jacobs Fotos: Eu e o Élder Izu fazendo cookies Recorte de papelão do Luke Skywalker do amigo da onça resultados do amigo da onça Mais desta semana"}, {"id": "l29", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">JAN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": ["HT"], "moments": ["Baptism", "Holidays"], "extra": "Haiti", "kind": "Carta 29 · Winter Haven", "title": "🐊Feliz año nuevo! 🦕🎉🎊🎆🎇✨", "date": "2022-01-03T09:28:00", "group": "2022-01", "html": "<div class=\"body\"><p>Uhuuul, 2022, bebê! Brincadeira, é meio estranho, principalmente porque alguém me disse que vou ser missionário esse próximo ano inteiro.<\/p>\n<p>Buenas amigos míos!<\/p>\n<p>Como le va? Ou, se por algum motivo vocês souberem crioulo haitiano: koman w ye?<\/p>\n<p>Vou aprender mais frases em crioulo haitiano, porque se eu ganhasse uma moedinha toda vez que encontrei um haitiano e meu espanhol só foi até certo ponto e eu precisei de um pouco de crioulo haitiano, eu teria 4 moedinhas. Não é muito, mas é estranho que tenha acontecido 4 vezes. Essa semana foi bem, um pouco mais devagar que a semana do Natal, por incrível que pareça, mas boa mesmo assim. Marcamos uma data de batismo com o nosso amigo Quincy! Também estamos ensinando a esposa dele, mas ela não estava lá dessa última vez, então na próxima lição vamos ver se eles querem no mesmo dia. 😄<\/p>\n<p>Entramos escondido num condomínio fechado para tentar visitar um ex-pesquisador, mas eles não estavam. Quando tentamos sair, ficamos presos.... tem um código no portão para entrar e sair.... por sorte, depois de 5 min apertando teclas tentando adivinhar, uma senhorinha simpática chegou e usou o controle dela.<\/p>\n<p>Lake Wales é um lugar estranho<\/p>\n<p>Tivemos umas lições incríveis com os nossos amigos Francisco &amp; Jocelyn e também com o Antonio essa semana. Eles estão muito perto de estar prontos para o batismo. Durante a lição com o Antonio, ele até disse que ia querer, assim que soubesse um pouco mais. O Ano-Novo foi um dia normal, mais ou menos. Não aconteceu muita coisa e das 18h às 21h tivemos que ficar no apartamento. Não vimos nenhum fogo de artifício por causa das árvores.<\/p>\n<p>As transferências são amanhã e eu vou continuar com o Élder Izu!<\/p>\n<p>Mucho amor!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>nova amiga, a Queen (a porca do Antonio)<\/li>\n<li>um cara das mensagens do Facebook<\/li>\n<li>última foto do distrito<\/li>\n<li>Néfi congelado<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-01-03_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-03_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-03_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-01-03_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-01-03_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_149.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_150.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🐊Feliz año nuevo! 🦕🎉🎊🎆🎇✨ Uhuuul, 2022, bebê! Brincadeira, é meio estranho, principalmente porque alguém me disse que vou ser missionário esse próximo ano inteiro. Buenas amigos míos! Como le va? Ou, se por algum motivo vocês souberem crioulo haitiano: koman w ye? Vou aprender mais frases em crioulo haitiano, porque se eu ganhasse uma moedinha toda vez que encontrei um haitiano e meu espanhol só foi até certo ponto e eu precisei de um pouco de crioulo haitiano, eu teria 4 moedinhas. Não é muito, mas é estranho que tenha acontecido 4 vezes. Essa semana foi bem, um pouco mais devagar que a semana do Natal, por incrível que pareça, mas boa mesmo assim. Marcamos uma data de batismo com o nosso amigo Quincy! Também estamos ensinando a esposa dele, mas ela não estava lá dessa última vez, então na próxima lição vamos ver se eles querem no mesmo dia. 😄 Entramos escondido num condomínio fechado para tentar visitar um ex-pesquisador, mas eles não estavam. Quando tentamos sair, ficamos presos.... tem um código no portão para entrar e sair.... por sorte, depois de 5 min apertando teclas tentando adivinhar, uma senhorinha simpática chegou e usou o controle dela. Lake Wales é um lugar estranho Tivemos umas lições incríveis com os nossos amigos Francisco & Jocelyn e também com o Antonio essa semana. Eles estão muito perto de estar prontos para o batismo. Durante a lição com o Antonio, ele até disse que ia querer, assim que soubesse um pouco mais. O Ano-Novo foi um dia normal, mais ou menos. Não aconteceu muita coisa e das 18h às 21h tivemos que ficar no apartamento. Não vimos nenhum fogo de artifício por causa das árvores. As transferências são amanhã e eu vou continuar com o Élder Izu! Mucho amor! Elder Jacobs Fotos: nova amiga, a Queen (a porca do Antonio) um cara das mensagens do Facebook última foto do distrito Néfi congelado Mais desta semana"}, {"id": "l30", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">JAN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 México<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🐊 Jacarés<\/span><\/div>", "cultures": ["MX"], "moments": ["Baptism", "Gators"], "extra": "Mexico", "kind": "Carta 30 · Winter Haven", "title": "🐊 Ok, isso não é épico 🤒🤕", "date": "2022-01-10T07:10:00", "group": "2022-01", "html": "<div class=\"body\"><p>Buenos Días amigos míos! Não se preocupem, não sou eu que estou doente, nem meu companheiro. Mas muitos dos nossos amigos estão, daí o título. Fora isso, essa semana foi muito boa!<\/p>\n<p>Passamos um bom tempo em Haines City, mesmo sendo longe. Estamos começando a ter um bom número de amigos lá. Umas moças nos deram uns tacos (carne asada) e salsa (meus lábios arderam por 30 min, mas é gostoso). Achamos um órgão elétrico (infelizmente não funcionava) e colocamos escondido no apartamento dos outros élderes (lembrem de trancar as portas, crianças).<\/p>\n<p>Tivemos umas lições incríveis com amigos essa semana: Antonio, Francisco &amp; Jocelyn, Maria, Juan &amp; Ydasty, a família Perez Ortiz, Araceli e Hipolito. Algumas pessoas pediram uma listinha dos nossos amigos para poderem orar por eles, então aí está. ⬆️Boa sorte pronunciando alguns dos nomes 😉<\/p>\n<p>A Araceli é uma cozinheira de mão cheia. Ela fez uns sopes caseiros pra gente (mandei uma foto de alguns num e-mail antigo, basicamente massa frita com coisas de tostada por cima). Ela cozinha o dia todo às sextas. Talvez a gente tenha que passar lá de novo e ver se ela nos dá mais, ela diz que tem as melhores enchiladas. 🤩🧐<\/p>\n<p>O Arnulfo foi à igreja de novo! E temos uma lição nessa quarta. Esperamos finalmente conseguir batizá-lo, já que ele já fez tudo, só que a vida estava agitada.<\/p>\n<p>Por favor orem pelos nossos membros também, porque tivemos só 1 hora de igreja e vieram umas 25 pessoas por causa de covid, gripe etc. No fim eu fui me virando no piano com as minhas habilidades bem limitadas, mas pelo menos teve música. Um desafio que eu e o Élder Izu temos é falar só espanhol das 10h às 21h. Às vezes é bem difícil, mas é bem legal fazer isso, porque deixa as conversas mais naturais/fáceis e às vezes até puxa conversa. \"Sim, eu sei que sou gringo, mas falo espanhol. Sim, o Élder Izu parece mexicano, mas fala menos do que você pensou\" são exemplos que temos que dizer ou explicar com frequência.<\/p>\n<p>Estudei sobre a virtude essa semana enquanto me preparo para dar um treinamento no nosso conselho de distrito na terça. Então li um monte de discursos (a maioria para as moças) e escrituras. Basicamente, se você quer ser mais virtuoso e semelhante a Cristo, precisa se esforçar para ter coisas melhores na sua vida e buscar as coisas de Deus. Outra coisa é sempre pensar em coisas boas, assim sua mente fica ocupada e fica mais difícil a tentação entrar. Vão encontrar um jeito de ter mais da mão de Deus na sua vida e sejam virtuosos, amigos!<\/p>\n<p>Espero que vayan bien y tengan una buena semana amigos! Hasta la proxima,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>nossos tacos de camarão caseiros 🌮 😋 🍤 🦐<\/li>\n<li>mural de jacaré irado<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-10_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-10_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-10_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_151.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_152.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_153.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_154.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_155.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_156.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_157.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_158.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_159.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐊 Ok, isso não é épico 🤒🤕 Buenos Días amigos míos! Não se preocupem, não sou eu que estou doente, nem meu companheiro. Mas muitos dos nossos amigos estão, daí o título. Fora isso, essa semana foi muito boa! Passamos um bom tempo em Haines City, mesmo sendo longe. Estamos começando a ter um bom número de amigos lá. Umas moças nos deram uns tacos (carne asada) e salsa (meus lábios arderam por 30 min, mas é gostoso). Achamos um órgão elétrico (infelizmente não funcionava) e
