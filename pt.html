 na sua vida e sejam virtuosos, amigos! Espero que vayan bien y tengan una buena semana amigos! Hasta la proxima, Elder Jacobs Fotos: nossos tacos de camarão caseiros 🌮 😋 🍤 🦐 mural de jacaré irado Mais desta semana"}, {"id": "l31", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">JAN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><\/div>", "cultures": ["PR"], "moments": [], "extra": "Puerto Rico", "kind": "Carta 31 · Winter Haven", "title": "Car-by", "date": "2022-01-17T10:57:00", "group": "2022-01", "html": "<p class=\"tnote\">Esqueci de dar um título a esse quando mandei, então coloquei um depois.<\/p><div class=\"body\"><p>Hola Qué tal bröthers?<\/p>\n<p>O Vidal, recém-converso, adora dizer isso, já que está aprendendo inglês.<\/p>\n<p>Tive uma boa semana, ainda teve uns momentos difíceis/ruins, mas sem eles o resto da semana não parece tão bom. Oposição em todas as coisas, como Néfi fala em 2 Néfi 2.<\/p>\n<p>Enfim, a semana foi muito boa porque encontramos umas áreas novas para fazer busca, o que significa novos amigos! Eles parecem bem empolgados e aceitaram o Livro de Mórmon na hora. Infelizmente não temos nenhum, já que Salt Lake não manda mais em espanhol há alguns meses, então rip.<\/p>\n<p>O Carlos, nosso líder da missão da ala, foi com a gente a um monte de lições, o que foi incrível! Ter membros nas lições ajuda nossos amigos a terem pessoas que já conhecem na igreja e, no nosso caso, alguém que sabe a língua perfeitamente, para dar uns exemplos incríveis que ajudam o amigo a ligar os pontos.<\/p>\n<p>Na quinta nosso carro finalmente foi consertado, um amassadinho na traseira esquerda dos missionários antes de nós, mas tivemos que esperar o seguro. Então, enquanto esperávamos, pegamos carona com os de Winterhaven e fomos um quarteto por um dia. Tivemos, por incrível que pareça, muito sucesso e união na dupla.<\/p>\n<p>Vimos um R.O.U.S.: roedor de tamanho incomum, ou seja, um gambá enorme (infelizmente sem foto)<\/p>\n<p>Fomos no Taco Bell, vimos um carro incrível com tema do Kirby, saímos e perdemos a foto. Mas aí fomos para um bairro qualquer e lá estava ele, na primeira casa! E o dono, o Orlando, é de Porto Rico e amou a nossa mensagem! Vamos voltar lá essa semana.<\/p>\n<p>Espero que vocês estejam todos bem e arrasando!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>carro do Kirby<\/li>\n<li>Tentei cozinhar salmão 😋🔥🔥 (sinceramente não sei o que eu faço, mas estou virando um master chef, bem-vindos à cidade do sabor)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-17_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-17_0_1.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_160.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_161.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_162.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_163.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_164.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_165.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_166.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_167.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_168.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_169.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Car-by Esqueci de dar um título a esse quando mandei, então coloquei um depois. Hola Qué tal bröthers? O Vidal, recém-converso, adora dizer isso, já que está aprendendo inglês. Tive uma boa semana, ainda teve uns momentos difíceis/ruins, mas sem eles o resto da semana não parece tão bom. Oposição em todas as coisas, como Néfi fala em 2 Néfi 2. Enfim, a semana foi muito boa porque encontramos umas áreas novas para fazer busca, o que significa novos amigos! Eles parecem bem empolgados e aceitaram o Livro de Mórmon na hora. Infelizmente não temos nenhum, já que Salt Lake não manda mais em espanhol há alguns meses, então rip. O Carlos, nosso líder da missão da ala, foi com a gente a um monte de lições, o que foi incrível! Ter membros nas lições ajuda nossos amigos a terem pessoas que já conhecem na igreja e, no nosso caso, alguém que sabe a língua perfeitamente, para dar uns exemplos incríveis que ajudam o amigo a ligar os pontos. Na quinta nosso carro finalmente foi consertado, um amassadinho na traseira esquerda dos missionários antes de nós, mas tivemos que esperar o seguro. Então, enquanto esperávamos, pegamos carona com os de Winterhaven e fomos um quarteto por um dia. Tivemos, por incrível que pareça, muito sucesso e união na dupla. Vimos um R.O.U.S.: roedor de tamanho incomum, ou seja, um gambá enorme (infelizmente sem foto) Fomos no Taco Bell, vimos um carro incrível com tema do Kirby, saímos e perdemos a foto. Mas aí fomos para um bairro qualquer e lá estava ele, na primeira casa! E o dono, o Orlando, é de Porto Rico e amou a nossa mensagem! Vamos voltar lá essa semana. Espero que vocês estejam todos bem e arrasando! Elder Jacobs Fotos: carro do Kirby Tentei cozinhar salmão 😋🔥🔥 (sinceramente não sei o que eu faço, mas estou virando um master chef, bem-vindos à cidade do sabor) Mais desta semana"}, {"id": "l32", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">JAN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><\/div>", "cultures": ["VE"], "moments": [], "extra": "Venezuela", "kind": "Carta 32 · Winter Haven", "title": "📈 Notícias de última torção 👟🏴‍☠️", "date": "2022-01-24T11:20:00", "group": "2022-01", "html": "<div class=\"body\"><p>Ok, então depois do meu último e-mail todo mundo começou a jogar basquete 🏀 e estava tudo indo bem até o Élder Izu pular para pegar um rebote e cair errado, torcendo o tornozelo. Aí passamos algumas horas num pronto atendimento. Por sorte nada quebrou, ele está de muletas por enquanto, espero que ele consiga começar a andar um pouco essa semana, porque muleta dói (quem já usou sabe).<\/p>\n<p>Enfim, nossos amigos estão bem. A maioria ficou bem doente essa semana por causa da mudança no tempo. Passamos de uns 70 ou 80 e poucos graus para 50 e poucos, com muito vento. A gente também estava congelando um pouco às vezes, mas não ficamos doentes, então isso é bom. A aula de inglês foi boa. Ensinamos \"wouldn't've\" e contrações duplas tipo \"whom'std'nt've\" jajaa, mas eles amaram. Tivemos conferência de zona essa semana. Vão ler suas escrituras e orar. Deus ama vocês! A maior parte do que aprendi se aplica mesmo a missionários e a mim pessoalmente, então vão buscar revelação pessoal.<\/p>\n<p>Também ganhamos umas músicas do nosso amigo José, porque pelo jeito ele é músico! Me avisem se vocês quiserem um talento incrível e música venezuelana.<\/p>\n<p>O resto da semana foi bem bom.<\/p>\n<p class=\"sign\">Los amo y buena suerte esta semana sois bestias!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>hora das muletas<\/li>\n<li>aula de inglês<\/li>\n<li>Conferência de zona<\/li>\n<li>naranjas derramadas de um caminhão grande<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-24_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-24_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\  amo y buena suerte esta semana sois bestias! Elder Jacobs Fotos: hora das muletas aula de inglês Conferência de zona naranjas derramadas de um caminhão grande Mais desta semana"}, {"id": "l33", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">JAN 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 33 · Winter Haven", "title": "🥳🌊 Trem do batismo chegando em breve! 😇🤕", "date": "2022-01-31T07:37:00", "group": "2022-01", "html": "<div class=\"body\"><p>¿Qué tal queridos amigos?<\/p>\n<p>Essa semana foi ótima! Apesar de começar a semana com uma concussão leve, que não foi nada divertida, só uma dor de cabeça constante, tivemos muito sucesso.<\/p>\n<p>Diferente das semanas anteriores, tivemos um monte de lições com nossos amigos, o que nos deixou muito pouco tempo para sair e continuar encontrando pessoas novas para ensinar. Mas no fim ainda encontramos 8 pessoas novas essa semana.<\/p>\n<p>O motivo do título desse e-mail ser trem do batismo é: 1. o trem da Bíblia do Johnny Cash 🚅😎🛤 e 2. muitos dos nossos amigos expressaram o desejo de ser batizados logo. Erby, Jhon, José e Antonio (26 de fev.) expressaram esse desejo e vamos marcar uma data com eles essa semana, se ainda não marcamos 🌊🌊🌊.<\/p>\n<p>Outras coisas que aconteceram essa semana:<\/p>\n<ul class=\"bul\">\n<li>um frio danado essa semana...<\/li>\n<li>O Élder Izu conseguiu andar um pouco com o pé!<\/li>\n<li>vimos uns 🐕 🐶 cachorros incríveis<\/li>\n<li>Toquei piano na reunião sacramental de novo<\/li>\n<li>e na Primária também 🤩<\/li>\n<li>ensinei ao Vidal a frase \"what's pop'in?\"<\/li>\n<\/ul>\n<p>Terminei 4 Néfi essa semana e comecei Mórmon. Eu amo a parte sobre não haver -itas, mas um só povo, filhos de Cristo. O discurso do Élder Holland da última conferência fala muito bem sobre isso, vão ler.<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2021/10/12holland?lang=eng<\/p>\n<p>Temos entrevistas essa semana com o Presidente e a Sister Hollingsworth, o que significa que faltam só 2 semanas para as transferências. O tempo voa. Também tenho uma divisão essa semana com os Assistentes do Presidente (APs), então conto pra vocês como foi. manténganse calientes<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>cachorra legal, husky + canina, daí a cor do pelo (esqueci o nome dela, foi mal)<\/li>\n<li>Dillon, o filhote do Vidal (ele está com o ponchito dele)<\/li>\n<li>Elder Izu tenía hambre<\/li>\n<li>Eu desenhei o Shrek<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-01-31_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-31_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-31_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-01-31_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-01-31_0_4.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_173.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_174.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_175.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_176.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🥳🌊 Trem do batismo chegando em breve! 😇🤕 ¿Qué tal queridos amigos? Essa semana foi ótima! Apesar de começar a semana com uma concussão leve, que não foi nada divertida, só uma dor de cabeça constante, tivemos muito sucesso. Diferente das semanas anteriores, tivemos um monte de lições com nossos amigos, o que nos deixou muito pouco tempo para sair e continuar encontrando pessoas novas para ensinar. Mas no fim ainda encontramos 8 pessoas novas essa semana. O motivo do título desse e-mail ser trem do batismo é: 1. o trem da Bíblia do Johnny Cash 🚅😎🛤 e 2. muitos dos nossos amigos expressaram o desejo de ser batizados logo. Erby, Jhon, José e Antonio (26 de fev.) expressaram esse desejo e vamos marcar uma data com eles essa semana, se ainda não marcamos 🌊🌊🌊. Outras coisas que aconteceram essa semana: um frio danado essa semana... O Élder Izu conseguiu andar um pouco com o pé! vimos uns 🐕 🐶 cachorros incríveis Toquei piano na reunião sacramental de novo e na Primária também 🤩 ensinei ao Vidal a frase \"what's pop'in?\" Terminei 4 Néfi essa semana e comecei Mórmon. Eu amo a parte sobre não haver -itas, mas um só povo, filhos de Cristo. O discurso do Élder Holland da última conferência fala muito bem sobre isso, vão ler. https://www.churchofjesuschrist.org/study/general-conference/2021/10/12holland?lang=eng Temos entrevistas essa semana com o Presidente e a Sister Hollingsworth, o que significa que faltam só 2 semanas para as transferências. O tempo voa. Também tenho uma divisão essa semana com os Assistentes do Presidente (APs), então conto pra vocês como foi. manténganse calientes Los amo! Elder Jacobs Fotos: cachorra legal, husky + canina, daí a cor do pelo (esqueci o nome dela, foi mal) Dillon, o filhote do Vidal (ele está com o ponchito dele) Elder Izu tenía hambre Eu desenhei o Shrek Mais desta semana"}, {"id": "l34", "area": 3, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">WINTER HAVEN, FL<\/span><span class=\"pm-d\">FEV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PR\">🇵🇷 Puerto Rico<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": ["PR"], "moments": ["Baptism", "Holidays"], "extra": "Puerto Rico", "kind": "Carta 34 · Winter Haven", "title": "Quarentena de 🅱️ovid & ETs!", "date": "2022-02-07T05:48:00", "group": "2022-02", "html": "<div class=\"body\"><p>Isso mesmo, vocês leram certo. Foi mal, vovó Fox, mas eu \"miorei\" (não sou mais uma salamandra)<\/p>\n<p>Hola amigos!<\/p>\n<p>Essa semana foi, bom... uma semana perdida com certeza, não aconteceu muita coisa. Na segunda passada, e na verdade no fim de semana passado, o Élder Izu e eu estávamos meio estranhos, mas não demos muita bola. Segunda à noite eu sentia que estava morrendo, mas tínhamos trabalho a fazer! Aí na terça de manhã eu estava tão mal que queria me virar na cama e morrer só pra dor de cabeça e tudo mais ir embora. A Sister Meese, a enfermeira da missão, falou pra gente fazer o teste, mas eu estava tão mal que não conseguia nem me mexer. Ainda bem que os élderes de Winterhaven compraram testes pra gente e, claríssimo, estávamos com a 🅱️ovid.<\/p>\n<p>Se vocês tiverem interesse nos meus sintomas: eu ficava congelando mas suando horrores, e vice-versa. A dor de cabeça era constante e implacável, e só melhorava um pouco com analgésico. E o corpo doía um pouquinho, mas doía mesmo era depois que eu espirrava, e doía demais.<\/p>\n<p>Todo bien ahora! Não estou mais doente e já saímos da quarentena (5 dias dentro de casa e mais 5-10 sempre de máscara perto dos outros). Não rolou muita coisa missionária porque estávamos muito doentes, mas outros missionários e membros vieram deixar coisas pra gente, tipo lanchinhos, armas de nerf e remédio.<\/p>\n<p>O Arnulfo veio à igreja e também nossos amigos José y Ydasty. Todos gostaram, e o filho do José &amp; ydasty amou a Primária (a hermana Leticia subornou ele com um biscoito jaja). As sisters tiveram um batismo e eles foram nesse também! Porém (sempre tem um porém), ontem à noite recebemos uma ligação dos APs. As transferências são na semana que vem, então essa ligação veio cedo, mas é porque estamos sendo ET, transferidos de emergência. O Élder Izu vai para Tampa Espanhol e eu vou para Peace River, na Zona de Fort Myers (uma área/ramo em inglês que tem missionários de espanhol para quando encontram algum latino). Cypress Gardens East vai ficar vazia por uma semana e depois vai ser preenchida nas transferências? Essa última parte é um mistério, porque estamos com falta de missionários de espanhol. Uma boa parte da missão foi designada para cá enquanto esperava visto e as fronteiras abrirem, e agora está tudo certo.<\/p>\n<p>Eu amo a ala e estou triste de sair, mas vou voltar algum dia e estou animado para experimentar algo novo. Vão escutar algumas músicas do Funky, porque são músicas épicas em espanhol e todas sobre o Evangelho. Eu gosto muito de Soy tu Dios &amp; Todavía (a primeira sobre os milagres do Velho Testamento e o Deus de Israel, e a outra sobre o filho pródigo). Se vocês não sabem espanhol, provavelmente ainda vão curtir a música, mas aviso que a letra não vai traduzir direitinho, porque o Funky é porto-riquenho e eles usam muita gíria.<\/p>\n<p>Disfrasao' também é muito boa. Se vocês não quiserem procurar no Google ou se forem missionários, me avisem que eu mando as músicas.<\/p>\n<p class=\"sign\">Los amo muchísimo queridos amigos! Espero que no estén enfermos cómo yo estuve<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>quarentena (quando finalmente nos sentimos bem o bastante para nos vestir normalmente)<\/li>\n<li>Fotos antigas que esqueci, do amigo secreto de Natal e do outro dia<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-02-07_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-02-07_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-02-07_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=
