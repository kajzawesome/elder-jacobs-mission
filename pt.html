posa dele e de outros líderes missionários. Muito incrível, recebi revelações ótimas sobre como continuar melhorando a mim mesmo e a obra missionária. Também pude ver alguns dos missionários, o que é sempre divertido. Hoje (P-day) jogamos vôlei com o distrito e comemos sushi. Então foi um final bem incrível pra uma semana ok. Então, um brinde à próxima. Por enquanto é isso, amigos. Até a próxima vez eu vou ter provado um gator-dog (cachorro-quente de carne de jacaré), então eu conto pra vocês qual é o gosto. Con mucho amor como siempre, Elder Jacobs Fotos: desculpem não serem muitas. Vou ter que melhorar e simplesmente tirar fotos, pra eu ter um monte de coisas incríveis pra lembrar da minha missão e compartilhar com vocês Abacaxi e lagartixa 🦎 Gafanhoto enorme (3 polegadas), eles também estão em todo lugar Una Baca (vaca em espanhol, mas escrito errado. Vaca em espanhol é Vaca, mas a maioria das pessoas não escreve muito bem e v&b têm o mesmo som em espanhol) Mais desta semana"}, {"id": "l8", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AGO 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🐊 Jacarés<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Gators"], "extra": "", "kind": "Carta 8 · Dade City", "title": "Los perros", "date": "2021-08-09T15:19:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola todos,<\/p>\n<p>Esta semana foi bem boa. O ramo está aos poucos preenchendo os chamados e crescendo, então tem sido incrível de ver. Nosso amigo Jaime foi confirmado no domingo, 3 semanas depois do batismo dele kkk (estávamos bem preocupados com isso, porque, se não fosse feito logo, ele precisaria ser batizado de novo. Mas isso leva meses, como descobrimos. E não, esse batismo não foi meu, foi feito antes de eu chegar na Flórida). Também conseguimos encontrar uma boa quantidade de amigos novos pra ensinar esta semana, então isso foi ótimo.<\/p>\n<p>Agora, eu sei que o que vocês querem saber é como foi o gator-dog, mas... infelizmente eu não provei. Fomos na terça depois do conselho de distrito, mas o lugar ainda estava fechado por causa das férias de verão. Espero provar nesta próxima semana ou na seguinte. Mas provamos uma coisa estranha: o Panda Buffet. Pensem num prédio meio largado tipo um Waffle House ou algo assim, porque é exatamente isso. Por dentro até que era decente e o preço era superbarato. Logo descobrimos por quê. Esse buffet chinês à vontade era outro nível. Tudo parecia bem normal e algumas coisas eram boas, mas no geral não, e muitos de nós ficamos com dor de barriga naquela noite. As sisters do nosso distrito talvez odeiem a gente agora haha, mas foi uma experiência.<\/p>\n<p>Participei de uma divisão esta semana. Fui com o Élder Peters por um dia pra ver como funciona outra área e, no geral, aprender. É basicamente pra isso que elas existem. Foi bem bom (pela primeira vez andei de bicicleta pela área, diferente do nosso normal de ir de carro até algum lugar e depois andar a pé) e me dei muito bem com ele, mas com certeza prefiro o Élder Nelson. Na quarta pudemos comemorar o aniversário do Irmão Graham com ele e a esposa. Foi muito divertido e a comida estava boa. Confiram a foto boba.<\/p>\n<p>O resto da semana foi bem normal, menos os cachorros; daí o título do e-mail. Tinha muito cachorro na rua esta semana. A maioria tentou correr atrás da gente ou coisa assim, mas a gente só andou com calma e com cuidado, mas alguns chegaram perto demais, na minha opinião. Então eu só levantei a mão e eles simplesmente pararam na hora. Bem incrível e, sinceramente, inexplicável (considerando que eram dobermans, pitbulls, chihuahuas e outros cachorros bravos).<\/p>\n<p>A única outra coisa pra contar esta semana são os tacos autênticos que ganhamos de graça. Estávamos planejando jantar no food truck de tacos onde todo mundo vai, mas o Élder Nelson é amigo da moça que cuida dele. Então, quando chegamos e pedimos nossos 5 tacos cada um (prontos pra pagar), ela mandou a gente sentar e esperar porque ela gosta de nós, muchachos haha. Pedi de bife, de frango e al pastor. Rapaz, esse al pastor é bom demais.<\/p>\n<p>Enfim, uma semana bem boa, cheia de pequenos milagres. A fé com obras traz milagres.<\/p>\n<p class=\"sign\">Hasta luego amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.S. Temos conferência de zona na quinta, então estou bem animado. E acabei de completar 2 meses como missionário.<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>andando de bicicleta pela floresta<\/li>\n<li>cachorro bravo numa árvore<\/li>\n<li>planta orelha-de-elefante (enoooorme)<\/li>\n<li>tacos de graça<\/li>\n<li>pão de banana que eu fiz<\/li>\n<li>os Graham na festa de aniversário<\/li>\n<li>lavando o carro no P-day (o Élder Ballif e eu íamos cortar o cabelo, por isso não estamos de roupa de missionário)<\/li>\n<li>fazendo salada de frutas com framboesa<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-08-09_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-09_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-09_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-09_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-09_0_4.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-08-09_0_5.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-08-09_0_6.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-08-09_0_7.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_032.jpg\" alt=\"\"><\/figure><figure class=\"full land\">< no geral não, e muitos de nós ficamos com dor de barriga naquela noite. As sisters do nosso distrito talvez odeiem a gente agora haha, mas foi uma experiência. Participei de uma divisão esta semana. Fui com o Élder Peters por um dia pra ver como funciona outra área e, no geral, aprender. É basicamente pra isso que elas existem. Foi bem bom (pela primeira vez andei de bicicleta pela área, diferente do nosso normal de ir de carro até algum lugar e depois andar a pé) e me dei muito bem com ele, mas com certeza prefiro o Élder Nelson. Na quarta pudemos comemorar o aniversário do Irmão Graham com ele e a esposa. Foi muito divertido e a comida estava boa. Confiram a foto boba. O resto da semana foi bem normal, menos os cachorros; daí o título do e-mail. Tinha muito cachorro na rua esta semana. A maioria tentou correr atrás da gente ou coisa assim, mas a gente só andou com calma e com cuidado, mas alguns chegaram perto demais, na minha opinião. Então eu só levantei a mão e eles simplesmente pararam na hora. Bem incrível e, sinceramente, inexplicável (considerando que eram dobermans, pitbulls, chihuahuas e outros cachorros bravos). A única outra coisa pra contar esta semana são os tacos autênticos que ganhamos de graça. Estávamos planejando jantar no food truck de tacos onde todo mundo vai, mas o Élder Nelson é amigo da moça que cuida dele. Então, quando chegamos e pedimos nossos 5 tacos cada um (prontos pra pagar), ela mandou a gente sentar e esperar porque ela gosta de nós, muchachos haha. Pedi de bife, de frango e al pastor. Rapaz, esse al pastor é bom demais. Enfim, uma semana bem boa, cheia de pequenos milagres. A fé com obras traz milagres. Hasta luego amigos, Elder Jacobs P.S. Temos conferência de zona na quinta, então estou bem animado. E acabei de completar 2 meses como missionário. Fotos: andando de bicicleta pela floresta cachorro bravo numa árvore planta orelha-de-elefante (enoooorme) tacos de graça pão de banana que eu fiz os Graham na festa de aniversário lavando o carro no P-day (o Élder Ballif e eu íamos cortar o cabelo, por isso não estamos de roupa de missionário) fazendo salada de frutas com framboesa Mais desta semana"}, {"id": "l9", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AGO 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🌀 Furacão<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Hurricane"], "extra": "", "kind": "Carta 9 · Dade City", "title": "Shabbat Shalom", "date": "2021-08-16T06:01:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola amigos,<\/p>\n<p>Dade City está ótima como sempre e esta semana foi bem boa. A semana foi bem tranquila e normal, então este e-mail vai ter muita coisa aleatória jajaja.<\/p>\n<p>A conferência de zona foi na quinta e foi demais. Ouvimos treinamentos do nosso presidente da missão, da esposa dele, dos assistentes (APs) e de alguns outros missionários que foram convidados. Foi tudo incrível, eu tenho muuuitas anotações (o que não é normal pra mim, a não ser que eu esteja muito envolvido) e o Espírito fez questão de que eu saísse com uma lista do que melhorar. O Élder Nelson e eu pegamos todos os convites pra estudar e melhorar e colocamos em prática. É especialmente importante nestes próximos meses fazer essas coisas e ser obediente, por causa da enorme chegada de missionários novos. No fim deste mês devemos receber 25 élderes de inglês, 2 élderes de espanhol, 2 sisters de inglês e 1 sister de espanhol. 30 missionários! Até o fim de outubro, 50% da missão vai estar treinando ou sendo treinada. Então temos que dar um bom exemplo e seguir todas as regras, até as novas que o presidente passou. Tenho notado muitas coisas boas que vêm da obediência às regras e ao Espírito, então tentar ser perfeitamente obediente deve trazer ainda mais, por mais difícil que pareça.<\/p>\n<p>Não deixe o Espírito no banco de reservas!<\/p>\n<p>Muito amor -&gt; muitas expectativas<\/p>\n<p>Essas provavelmente foram minhas frases favoritas da conferência de zona. Quando o Espírito inspirar, siga. Ninguém gosta de se sentir inútil ou de ficar esquentando o banco. E com muito amor vêm muitas expectativas da família, dos amigos e do nosso Pai Celestial. Então precisamos fazer tudo o que pudermos pra demonstrar esse mesmo amor de volta.<\/p>\n<p>Na sexta à noite tivemos a oportunidade de comer com uma membro e a família dela. O nome dela é Alison. Ela foi batizada no ano passado, e o marido dela alguns meses depois. Eles têm 2 filhos e são todos muito simpáticos. Antes ela era uma judia devota e, de algum jeito, encontrou os missionários, e eles nunca mencionaram Cristo quando a ensinaram (se tivessem mencionado, ela teria parado de receber as lições, porque os judeus não acreditam que Cristo era o Messias). O testemunho dela é muito legal por causa disso, e ela ainda faz muitas coisas judaicas por causa da herança e das tradições da família. Pudemos celebrar o Shabbat com ela e a família. O Shabbat é o dia santo em que Cristo descansou depois de criar o mundo. Começa às 17h de sexta e vai até as 17h de sábado. Se você fosse um judeu superrigoroso, como ela era, não podia fazer nada considerado trabalho. Acender uma luz, limpar, nem mesmo apertar um botão. A saudação é Shabbat shalom, que significa bom sábado. Falamos um pouco de hebraico e conversamos sobre a história (tudo muito legal). Parece que toda a história da Igreja aconteceu em feriados judaicos, e algumas das coisas que Alma, Amuleque e outros profetas fazem no Livro de Mórmon são judaicas.<\/p>\n<p>Tem chovido bastante aqui com o furacão Fred, mas estamos bem pro interior (o máximo que dá na Flórida), então estamos bem. O resto da semana foi tranquilo, e nosso ramo quer nos ajudar nos esforços missionários, então tomara que ele cresça. Aqui vai uma lista de outras coisas que aconteceram.<\/p>\n<ul class=\"bul\">\n<li>(foi semana passada, mas esqueci de contar) aprendi a montar o cubo mágico<\/li>\n<li>o Élder Nelson consegue soltar pum quando quer kkk<\/li>\n<li>Comida esquisita das sisters (são naturebas e querem dar coisas pra gente, mas é meio 🤮 no me gusta kale)<\/li>\n<li>nosso amigo Domingo está com data marcada (para o batismo) no dia 29<\/li>\n<li>O Domingo pedalou mais de uma hora até a igreja porque a carona que arranjamos pra ele furou (ele é uma lenda, com certeza)<\/li>\n<li>O Big Dog (um amigo com necessidades especiais) disse que o Élder Nelson pode ser o padrinho dele (não que ele vá se casar de verdade)<\/li>\n<li>Quesadilla de waffle. Enjoamos das nossas quesadillas de formato normal, então fizemos na máquina de waffle pra ter formatos novos<\/li>\n<\/ul>\n<p class=\"sign\">Hasta luego,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>os óculos vermelhos bobos do Élder Nelson<\/li>\n<li>o começo da coleção de fotos de animais mortos (toupeira, pássaro, cobra e javali)<\/li>\n<li>assim como as lagartixas, os sapos estão em todo lugar (principalmente esmagados na estrada, mando uma foto semana que vem jaja)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-08-16_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-16_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_043.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_044.jpg\" a ia devota e, de algum jeito, encontrou os missionários, e eles nunca mencionaram Cristo quando a ensinaram (se tivessem mencionado, ela teria parado de receber as lições, porque os judeus não acreditam que Cristo era o Messias). O testemunho dela é muito legal por causa disso, e ela ainda faz muitas coisas judaicas por causa da herança e das tradições da família. Pudemos celebrar o Shabbat com ela e a família. O Shabbat é o dia santo em que Cristo descansou depois de criar o mundo. Começa às 17h de sexta e vai até as 17h de sábado. Se você fosse um judeu superrigoroso, como ela era, não podia fazer nada considerado trabalho. Acender uma luz, limpar, nem mesmo apertar um botão. A saudação é Shabbat shalom, que significa bom sábado. Falamos um pouco de hebraico e conversamos sobre a história (tudo muito legal). Parece que toda a história da Igreja aconteceu em feriados judaicos, e algumas das coisas que Alma, Amuleque e outros profetas fazem no Livro de Mórmon são judaicas. Tem chovido bastante aqui com o furacão Fred, mas estamos bem pro interior (o máximo que dá na Flórida), então estamos bem. O resto da semana foi tranquilo, e nosso ramo quer nos ajudar nos esforços missionários, então tomara que ele cresça. Aqui vai uma lista de outras coisas que aconteceram. (foi semana passada, mas esqueci de contar) aprendi a montar o cubo mágico o Élder Nelson consegue soltar pum quando quer kkk Comida esquisita das sisters (são naturebas e querem dar coisas pra gente, mas é meio 🤮 no me gusta kale) nosso amigo Domingo está com data marcada (para o batismo) no dia 29 O Domingo pedalou mais de uma hora até a igreja porque a carona que arranjamos pra ele furou (ele é uma lenda, com certeza) O Big Dog (um amigo com necessidades especiais) disse que o Élder Nelson pode ser o padrinho dele (não que ele vá se casar de verdade) Quesadilla de waffle. Enjoamos das nossas quesadillas de formato normal, então fizemos na máquina de waffle pra ter formatos novos Hasta luego, Elder Jacobs Fotos: os óculos vermelhos bobos do Élder Nelson o começo da coleção de fotos de animais mortos (toupeira, pássaro, cobra e javali) assim como as lagartixas, os sapos estão em todo lugar (principalmente esmagados na estrada, mando uma foto semana que vem jaja) Mais desta semana"}, {"id": "l10", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AGO 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colômbia<\/span><span class=\"stamp c\" data-c=\"MX\">🇲🇽 México<\/span><span class=\"stamp c\" data-c=\"GT\">🇬🇹 Guatemala<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["CO", "MX", "GT"], "moments": ["Baptism"], "extra": "Colombia Mexico Guatemala", "kind": "Carta 10 · Dade City", "title": "Covid - quase", "date": "2021-08-23T06:51:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola Amigos!<\/p>\n<p>Esta semana foi bem interessante e vai ser um pouco mais longa que o normal, mas lá vai.<\/p>\n<p>No último P-day tivemos uma atividade de distrito, jogando jogos de tabuleiro e comendo, o que foi bem divertido. Mas, no dia seguinte, durante o conselho de distrito, uma das sisters descobriu que talvez tivesse sido exposta à Covid e, se o teste desse positivo, todos nós precisaríamos ficar de quarentena. Por sorte deu negativo, mas... o Élder Ricks, um dos missionários de inglês que moram com a gente, estava se sentindo meio doente, então tivemos que ficar de quarentena até ele fazer o teste no dia seguinte. Por sorte ele também deu negativo, e na terça à noite a gente não sai mesmo por causa do horário nobre, as mensagens no Facebook. Mesmo assim a gente não gostou nada da sensação de ficar confinado.<\/p>\n<p>Quarta foi bem normal, com a reunião de coordenação missionária à noite. Ganhamos uns tamales guatemaltecos da família Chapín, que começamos a ensinar; mas talvez eles não estejam interessados, porque quando estávamos saindo tentaram devolver o Livro de Mórmon que demos pra eles. Vamos ver da próxima vez que passarmos lá, mas com certeza não vamos pegar nosso livro de volta jajaja.<\/p>\n<p>(Os tamales não estavam muito bons. Os chapínes, ou guatemaltecos, colocam de tudo nos tamales, então tinha frango, mas ainda com osso e outras coisas. Também achamos cabelo)<\/p>\n<p>Na quinta acordamos cedo pra conhecer nosso amigo Domingo pessoalmente! Ele é muito legal e tranquilo. Descobrimos que ele já parou com café e chá desde que contamos pra ele os mandamentos. A gente até levou um pouco de chocolate em pó pra tentar ajudar, mas ele parou de uma vez, qué genial! Ele é de Chiapas, no México. Ele sabe um dialeto de lá e espanhol (também um pouco de inglês, mas não muito), mas trabalha num restaurante chinês jajaja. O chefe e os colegas de trabalho dele são chineses e mal falam inglês, e ele só consegue mesmo entender. Mas eles se dão bem, ele não odeia o trabalho e não trabalha aos domingos, então isso é bom. O batismo dele é neste próximo domingo, então estou bem animado.<\/p>\n<p>Na sexta fizemos um serviço num brechó... Foi uma coisa que as hermanas organizaram pra todos nós, mas acontece que o brechó é de outra igreja e, basicamente, sem querer, nos inscrevemos pra ser voluntários fixos. Foi ok, e não estamos planejando voltar, porque foi meio perda de tempo e não devemos fazer esse tipo de coisa.<\/p>\n<p>Sábado foi a bagunça da semana; aconteceu muita coisa. De manhã fizemos um serviço para os Thorton, e depois eles nos serviram um banquete. A Irmã Thorton tem um monte de habilidades e hobbies aleatórios, é superdivertido conversar com ela e ela cozinha muito bem. Comemos smoothies, suco, Alfredo de frango &amp; camarão, hambúrgueres, cachorros-quentes, bife, Chick-fil-A e wafers colombianos com dulce de leche (doce de leite). E era tudo caseiro!! E eu comi tudo! Todo mundo ficou com uma dor de barriga enorme, mas meio que valeu a pena.<\/p>\n<p>No resto do dia nos arrumamos e nos preparamos pra Dade City, como na maioria das tardes. Os sábados são uma loucura, porque normalmente passamos na casa de todos os nossos amigos pra lembrar da igreja, mas também tivemos outras lições. Estávamos correndo pra todo lado. A grande lição daquela noite foi com uma moça chamada Ashleigh. Ela tem 23 anos e está procurando mais amigos. Ela saiu do exército por causa de uma lesão, então agora está estudando. Ela na verdade já tinha ouvido falar da Igreja, então foi ela que viu a gente andando por aí e gritou pra gente conversar, no começo da semana. Demos uma lição sobre a Restauração com ela e os élderes de inglês, que foi muito bem. Ela até perguntou como orar, a gente explicou, e ela já foi direto fazer! E ela foi à igreja no dia seguinte!<\/p>\n<p>Domingo foi bem bom, menos quando descobrimos que tínhamos discursos pra fazer dali a uma hora! Corremos pra escrever e nos preparar pra igreja. Nós dois terminamos e foi bem bom. O Presidente Cuevas, do ramo, disse que eu pareço o Élder Richard G. Scott falando espanhol (ele traduzia os próprios discursos para o espanhol).<\/p>\n<p>Meu discurso foi sobre ensinar como Cristo ensinava. Então minha lista do que fazer é: ensinar com o Espírito, ensinar de forma simples e ensinar com amor. Também senti que amar, compartilhar e convidar poderiam entrar todos em amor, porque compartilhar e convidar são atos de amor se feitos do jeito certo. Usei o Pregar Meu Evangelho e o Vem, e Segue-Me. Recomendo dar uma olhada nos dois, pelas ideias boas e pelas escrituras ótimas.<\/p>\n<p>A Ashleigh foi à igreja, alguns membros viraram melhores amigos dela na hora, e ela até ficou depois da igreja pro batismo na ala de inglês. Acho que a ala de inglês vai ter outro daqui a algumas semanas, de tanto que ela quer aprender.<\/p>\n<p>Aqui vai uma listinha, se vocês não tiverem muito tempo pra ler tudo isso:<\/p>\n<ul class=\"bul\">\n<li>2 sustos de Covid<\/li>\n<li>tamales guatemaltecos (muito estranhos)<\/li>\n<li>conheci o Domingo pessoalmente!<\/li>\n<li>serviço, mais ou menos<\/li>\n<li>mais serviço e um banquete<\/li>\n<li>lição incrível pra passar a Ashleigh para os élderes de inglês (sim, foi assim que os pais dela escreveram o nome)<\/li>\n<li>os élderes de inglês tiveram um batismo<\/li>\n<li>a Ashleigh foi à igreja<\/li>\n<li>fiz meu primeiro discurso em espanhol<\/li>\n<\/ul>\n<p>Era pra termos divisões com nosso líder de distrito e nossos líderes de zona esta semana, mas com a loucura das transferências de emergência não deu. As transferências de emergência são por causa de missionários voltando pra casa um pouco mais cedo pra conseguirem começar a faculdade.<\/p>\n<p>E já estou na Flórida há 1 mês e eu não mudaria nada.<\/p>\n<p class=\"sign\">Hasta luego Amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos!!<\/p>\n<ul class=\"bul\">\n<li>Sapo verde<\/li>\n<li>aranha de aparência doida<\/li>\n<li>os tamales<\/li>\n<li>pombo que alguém capturou<\/li>\n<li>Treinamento especializado (no meio, atrás)<\/li>\n<li>Conferência de zona (no meio, atrás)<\/li>\n<li>Pôr do sol<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>Tenho mais bichos mortos esta semana, mas tem gente que não gosta. Fica o aviso ⚠️<\/p>\n<ul class=\"bul\">\n<li>gafanhoto grande<\/li>\n<li>galinha<\/li>\n<li>sapo<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-08-23_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-23_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-23_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-23_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-0 a, mas tem gente que não gosta. Fica o aviso ⚠️ gafanhoto grande galinha sapo"}, {"id": "l11", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">AGO 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🐊 Jacarés<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Gators"], "extra": "", "kind": "Carta 11 · Dade City", "title": "🐊🌭 Gatordog! 🤤", "date": "2021-08-30T06:21:00", "group": "2021-08", "html": "<div class=\"body\"><p>Hola Amigos!<\/p>\n<p>Esta semana foi um pouco mais devagar por causa do aumento dos casos de Covid. Mais amigos nossos pegaram, então não pudemos conversar pessoalmente. Tomara que nesta próxima semana a gente consiga fazer umas chamadas de vídeo. Por favor, orem por eles, porque estão ficando bem doentes: a Isabel e o Jaime e as famílias deles.<\/p>\n<p>Fiz outra divisão esta semana, em Wesley Chapel, mas desta vez com o Élder Kimball, nosso líder de distrito. Foi muito divertido. Pude andar de bicicleta de novo. Só naquela noite pedalamos 16 milhas! Minhas pernas estavam bem cansadas no final, mas corremos pra casa porque parecia que ia chover. Entramos, guardamos as bicicletas e começou a cair o mundo; que sorte! E no dia seguinte andei 5 milhas a pé procurando pessoas.<\/p>\n<p>Comemos umas comidas estranhas esta semana. Comi um gatordog e cyclone tators. Bem bons. As tators eram só batatinhas Lay's torcidas e refritas, e o gator-dog era só um cachorro-quente grande com uma carne de mais qualidade (eu só pedi um normal, com tudo, pra ter a experiência). Também provei mais uns tacos de outro food truck. Com certeza não tão bons quanto os do roxinho onde a gente sempre vai, mas pude provar tripa de porco (só molenga, não tão bom quanto al pastor). E os Thorton nos deram mais comida. Nada muito esquisito, mas foi mais uma refeição de tipo 5 pratos, porque ela faz questão de que a gente saia entupido. Praticamente precisamos de uma cadeira de rodas depois de comer, mas é tão bom jaja.<\/p>\n<p>Tivemos entrevistas esta semana, que foram ótimas! Eu amo o Presidente e a Sister Hollingsworth. Eles são incríveis demais. Descobrimos que, por causa da Covid, bater portas de qualquer forma está proibido, e precisamos usar máscara pra abordar pessoas na rua. Isso é bem difícil pra nossa pequena área latina, principalmente porque eles não ligam muito, mas, pra manter a imagem da Igreja e fazer a nossa parte pra não espalhar a Covid, precisamos mudar. Tomara que a aula de inglês que estamos começando nos ajude a encontrar pessoas sem os nossos outros jeitos de sempre.<\/p>\n<p>A última grande coisa desta semana foi o batismo do Domingo! Ele acabou se mudando para Tampa na quarta, mas o Presidente disse que, como era domingo, podíamos ir e fazer o batismo, só que em Tampa. Eu o mergulhei e parece que ele estava empolgado, porque eu disse amém e ele simplesmente tombou pra trás. Ele estava pronto jaja. Depois o Élder Nelson o confirmou e o resto do serviço foi ótimo.<\/p>\n<p>Esta semana recebemos notícias das transferências. O Élder Nelson vai para Ocala terminar o treinamento do Élder Esplin (o outro élder de espanhol que chegou junto comigo), porque o treinador dele vai voltar pra casa. Eu vou ficar, liderando a área, e vou receber o Élder Ricks. O Élder Nelson me contou algumas coisas que ouviu e parece incrível, mas estou triste de perder o Élder Nelson. (Esse não é o Élder Ricks que mora com a gente, é outro. Isso vai ser confuso) Os élderes de inglês também vão ser transferidos. O Élder Ricks vai ficar e treinar, mas o Élder Ballif vai abrir Sarasota do zero e treinar. Todos vão se sair muito bem, mas é meio triste que eles vão embora.<\/p>\n<p>Nos Vemos pronto mis amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.S. Um cara gay ficou dando em cima do Élder Nelson durante as 2 horas inteiras de igreja. Foi muito esquisito e desconfortável, com tudo o que ele falava e encostando nele, já que sentou bem do nosso lado. Mas demos um Livro de Mórmon e nosso número pra ele, como sempre. Vamos ver se acontece mais alguma coisa jaja.<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>pedalando com o Élder Kimball<\/li>\n<li>último conselho de distrito + líderes de zona (sem o Élder Peters, porque ele teve transferência de emergência, mas temos o Élder Mehr)<\/li>\n<li>gator dog<\/li>\n<li>tacos<\/li>\n<li>élder novo 🐕 jaja<\/li>\n<li>Skippy, nossa amiga lagartixa (morta)<\/li>\n<li>Batismo do Domingo!<\/li>\n<li>o porco mais gordo do mundo (chamado Princess)<\/li>\n<li>típica entrada de garagem esquisita de Dade City, Flórida<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-08-30_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-08-30_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-08-30_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-08-30_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-08-30_0_8.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_045.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_046.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_047.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_048.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_049.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_050.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🐊🌭 Gatordog! 🤤 Hola Amigos! Esta semana foi um pouco mais devagar por causa do aumento dos casos de Covid. Mais amigos nossos pegaram, então não pudemos conversar pessoalmente. Tomara que nesta próxima semana a gente consiga fazer umas chamadas de vídeo. Por favor, orem por eles, porque estão ficando bem doentes: a Isabel e o Jaime e as famílias deles. Fiz outra divisão esta semana, em Wesley Chapel, mas desta vez com o Élder Kimball, nosso líder de distrito. Foi muito divertido. Pude andar de bicicleta de novo. Só naquela noite pedalamos 16 milhas! Minhas pernas estavam bem cansadas no final, mas corremos pra casa porque parecia que ia chover. Entramos, guardamos as bicicletas e começou a cair o mundo; que sorte! E no dia seguinte andei 5 milhas a pé procurando pessoas. Comemos umas comidas estranhas esta semana. Comi um gatordog e cyclone tators. Bem bons. As tators eram só batatinhas Lay's torcidas e refritas, e o gator-dog era só um cachorro-quente grande com uma carne de mais qualidade (eu só pedi um normal, com tudo, pra ter a experiência). Também provei mais uns tacos de outro food truck. Com certeza não tão bons quanto os do roxinho onde a gente sempre vai, mas pude provar tripa de porco (só molenga, não tão bom quanto al pastor). E os Thorton nos deram mais comida. Nada muito esquisito, mas foi mais uma refeição de tipo 5 pratos, porque ela faz questão de que a gente saia entupido. Praticamente precisamos de uma cadeira de rodas depois de comer, mas é tão bom jaja. Tivemos entrevistas esta semana, que foram ótimas! Eu amo o Presidente e a Sister Hollingsworth. Eles são incríveis demais. Descobrimos que, por causa da Covid, bater portas de qualquer forma está proibido, e precisamos usar máscara pra abordar pessoas na rua. Isso é bem difícil pra nossa pequena área latina, principalmente porque eles não ligam muito, mas, pra manter a imagem da Igreja e fazer a nossa parte pra não espalhar a Covid, precisamos mudar. Tomara que a aula de inglês que estamos começando nos ajude a encontrar pessoas sem os nossos outros jeitos de sempre. A última grande coisa desta semana foi o batismo do Domingo! Ele acabou se mudando para Tampa na quarta, mas o Presidente disse que, como era domingo, podíamos ir e fazer o batismo, só que em Tampa. Eu o mergulhei e parece que ele estava empolgado, porque eu disse amém e ele simplesmente tombou pra trás. Ele estava pronto jaja. Depois o Élder Nelson o confirmou e o resto do serviço foi ótimo. Esta semana recebemos notícias das transferências. O Élder Nelson vai para Ocala terminar o treinamento do Élder Esplin (o outro élder de espanhol que chegou junto comigo), porque o treinador dele vai voltar pra casa. Eu vou ficar, liderando a área, e vou receber o Élder Ricks. O Élder Nelson me contou algumas coisas que ouviu e parece incrível, mas estou triste de perder o Élder Nelson. (Esse não é o Élder Ricks que mora com a gente, é outro. Isso vai ser confuso) Os élderes de inglês também vão ser transferidos. O Élder Ricks vai ficar e treinar, mas o Élder Ballif vai abrir Sarasota do zero e treinar. Todos vão se sair muito bem, mas é meio triste que eles vão embora. Nos Vemos pronto mis amigos, Elder Jacobs P.S. Um cara gay ficou dando em cima do Élder Nelson durante as 2 horas inteiras de igreja. Foi muito esquisito e desconfortável, com tudo o que ele falava e encostando nele, já que sentou bem do nosso lado. Mas demos um Livro de Mórmon e nosso número pra ele, como sempre. Vamos ver se acontece mais alguma coisa jaja. Fotos: pedalando com o Élder Kimball último conselho de distrito + líderes de zona (sem o Élder Peters, porque ele teve transferência de emergência, mas temos o Élder Mehr) gator dog tacos élder novo 🐕 jaja Skippy, nossa amiga lagartixa (morta) Batismo do Domingo! o porco mais gordo do mundo (chamado Princess) típica entrada de garagem esquisita de Dade City, Flórida Mais desta semana"}, {"id": "l12", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SET 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 12 · Dade City", "title": "🚙 Nuevos compañeros 🎉", "date": "2021-09-06T12:37:00", "group": "2021-09", "html": "<div class=\"body\"><p>Hola mis amigos!<\/p>\n<p>Vou ser sincero: depois de saber que o Élder Nelson ia embora, eu não estava tão feliz nem animado com esta semana, mas o Élder Ricks, meu companheiro que fala espanhol, não o outro que mora com a gente (sim, é confuso, e a gente ainda não sabe bem como diferenciar), também é bem legal. Ele é de Mesa, Arizona, e trabalha duro, assim como eu e o Élder Nelson. Mesmo que com certeza tenha sido uma adaptação no começo, tenho certeza de que vamos continuar trabalhando duro e nos dando bem. Esta semana temos abordado muita gente na rua, porque é um dos únicos jeitos de trabalhar bem a nossa área. É bem divertido e difícil, mas estou ficando bom em puxar conversa com qualquer pessoa. O dom de línguas e o chamado de missionário com certeza ajudam também. Eu realmente percebi como meu espanhol está bom, porque agora somos companheiros bem mais iguais, diferente de antes, quando eu era muito novo e o Élder Nelson estava na área havia muito tempo. Mas, ao mesmo tempo, o Élder Ricks tem me ajudado a perceber alguns jeitos de melhorar. Tipo pequenos erros de gramática, ou lembrar de conjugar os verbos quando isso e aquilo. Às vezes pode parecer chato, mas estou melhorando muito neste momento. O outro Élder Ricks também recebeu o missionário dele pra treinar esta semana! O nome dele é Élder Leonard. Ele é da região de St. George, Utah, e é bem legal. Ele foi jogado direto no fogo por causa de uns amigos transgêneros que o Élder Ricks e o Élder Ballif fizeram antes de ele chegar.<\/p>\n<p>Esta semana também fizemos mais contatos e lições com membros. Percebemos que, mesmo eu estando nesta área há 7 semanas, eu não conhecia muito bem os membros, então estamos trabalhando nisso e conhecendo eles compartilhando mensagens e comendo comida ótima. 🤤<\/p>\n<ul class=\"bul\">\n<li>troquei um pneu esta semana (foi um aprendizado e foi difícil, porque o carro da senhora era muito velho e ela riu da gente quase o tempo todo)<\/li>\n<li>tivemos nossa primeira aula de inglês (2 pessoas apareceram, mas mais devem vir amanhã)<\/li>\n<li>comemos Chick-fil-A (qual é o seu pedido de sempre lá? O meu é o sanduíche de frango apimentado dx)<\/li>\n<li>chamada de Zoom com a missão inteira (caótica e divertida)<\/li>\n<li>alguém pagou nossas bebidas no Circle K 😎<\/li>\n<li>um cara doido com um acordeão deixou o Élder Ricks tentar tocar (muito engraçado e estranho)<\/li>\n<li>vi uma coruja de perto enquanto andava por aí<\/li>\n<\/ul>\n<p>Cuidanse mis amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Nós depois de trocar o pneu<\/li>\n<li>O Élder Ricks tentando tocar acordeão<\/li>\n<li>Coruja 🦉<\/li>\n<li>eu e o Hermano Miño na atividade do ramo<\/li>\n<\/ul>\n<p>⚠️ aviso ⚠️<\/p>\n<p>Tem um pouco de sangue esta semana, mas é tão legal e estranho que eu não podia deixar de compartilhar.<\/p>\n<ul class=\"bul\">\n<li>cigarra morta<\/li>\n<li>tatu morto (com sangue)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2021-09-06_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-09-06_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-06_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-06_0_4.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-09-06_0_5.jpeg\"  tatu morto (com sangue) Mais desta semana"}, {"id": "l13", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SET 2021<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 13 · Dade City", "title": "Semana de serviço!", "date": "2021-09-13T10:56:00", "group": "2021-09", "html": "<div class=\"body\"><p>Buenos Días todos!<\/p>\n<p>Esta semana foi demais! Um monte de histórias e milagres, claro. Com certeza tenho aprendido que, quando confiamos no Senhor e damos o nosso melhor, vemos milagres. Esta semana estivemos no corre da busca. Nossa aula de inglês tem ido mais ou menos para encontrar pessoas, mas a maior parte da nossa sorte é andando pelas ruas. Nem eu nem o Élder Ricks nunca fomos tão extrovertidos ou simpáticos, mas damos o nosso melhor e funciona. A gente só tenta ser amigo de todo mundo, o que também levou a serviços de improviso e a conversas sobre a Igreja. Provavelmente é minha parte favorita do dia, além de ensinar lições aos nossos amigos. Na verdade, encontramos nosso amigo Alex só andando por Dade City. Ele é muito simpático e gosta de aprender sobre religião, porque sente que a mente dele se abre. Na nossa primeira lição com ele esta semana, ensinamos a Restauração e também respondemos às perguntas dele sobre todo o resto. Foi muito incrível, principalmente porque eu não sabia que sabia todas as respostas pras perguntas dele, mas, graças a alguns dos meus estudos aleatórios e tentando ajudá-lo, eu consegui. O Élder Ricks também não estava se sentindo muito bem naquele dia, porque tomou a 2ª dose da vacina da Covid.<\/p>\n<ul class=\"bul\">\n<li>O Élder Ricks tomou a 2ª dose e dormiu durante o estudo de idioma, o almoço e o jantar (ele até se deu bem kkk)<\/li>\n<li>fizemos serviço para um não membro (arrancamos postes velhos de cerca pra colocarem uma nova)<\/li>\n<li>troquei outro pneu (uma senhora teve um pneu furado e paramos pra ajudar. Quando digo nós, quero dizer o Élder C. Ricks, o outro)⚙<\/li>\n<li>passamos na casa dos nossos amigos Elida e Horacio pra compartilhar uma mensagem, mas acabamos ajudando a montar o conjunto de mesa de jantar novo deles⚒<\/li>\n<\/ul>\n<p>3 vezes pudemos prestar serviço numa semana só!<\/p>\n<ul class=\"bul\">\n<li>finalmente conheci o Hermano Araya (ele é maçom! Tem um monte de história legal e coisas de espada) ⚔<\/li>\n<li>tentamos usar as redes sociais, mas nenhum latino da nossa área usa, então a gente tá 🤡<\/li>\n<li>tacos de graça de novo! Essa moça ama a gente, os 'Muchachos' jajaja🌮🌯<\/li>\n<li>tivemos uma conferência de estaca incrível com o Élder M. Holland<\/li>\n<li>tivemos o Face a Face com o Élder Bednar<\/li>\n<\/ul>\n<p>Cuidanse amigos,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>desenhamos um unicórnio com nossas canetinhas novas<\/li>\n<li>alguém nos deu um saco de camarão.. 🍤<\/li>\n<li>pegando sapos 🐸<\/li>\n<li>Élder Ricks cortando o cabelo na varanda desse cara<\/li>\n<li>tacos de graça<\/li>\n<li>minha coleção de post-its até agora. Quais são algumas das suas frases favoritas que eu deveria adicionar?<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2021-09-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2021-09-13_0_2.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-13_0_3.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-13_0_4.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-13_0_5.jpg\" alt=\"\"><\/figure><\/div>", "text": "Semana de serviço! Buenos Días todos! Esta semana foi demais! Um monte de histórias e milagres, claro. Com certeza tenho aprendido que, quando confiamos no Senhor e damos o nosso melhor, vemos milagres. Esta semana estivemos no corre da busca. Nossa aula de inglês tem ido mais ou menos para encontrar pessoas, mas a maior parte da nossa sorte é andando pelas ruas. Nem eu nem o Élder Ricks nunca fomos tão extrovertidos ou simpáticos, mas damos o nosso melhor e funciona. A gente só tenta ser amigo de todo mundo, o que também levou a serviços de improviso e a conversas sobre a Igreja. Provavelmente é minha parte favorita do dia, além de ensinar lições aos nossos amigos. Na verdade, encontramos nosso amigo Alex só andando por Dade City. Ele é muito simpático e gosta de aprender sobre religião, porque sente que a mente dele se abre. Na nossa primeira lição com ele esta semana, ensinamos a Restauração e também respondemos às perguntas dele sobre todo o resto. Foi muito incrível, principalmente porque eu não sabia que sabia todas as respostas pras perguntas dele, mas, graças a alguns dos meus estudos aleatórios e tentando ajudá-lo, eu consegui. O Élder Ricks também não estava se sentindo muito bem naquele dia, porque tomou a 2ª dose da vacina da Covid. O Élder Ricks tomou a 2ª dose e dormiu durante o estudo de idioma, o almoço e o jantar (ele até se deu bem kkk) fizemos serviço para um não membro (arrancamos postes velhos de cerca pra colocarem uma nova) troquei outro pneu (uma senhora teve um pneu furado e paramos pra ajudar. Quando digo nós, quero dizer o Élder C. Ricks, o outro)⚙ passamos na casa dos nossos amigos Elida e Horacio pra compartilhar uma mensagem, mas acabamos ajudando a montar o conjunto de mesa de jantar novo deles⚒ 3 vezes pudemos prestar serviço numa semana só! finalmente conheci o Hermano Araya (ele é maçom! Tem um monte de história legal e coisas de espada) ⚔ tentamos usar as redes sociais, mas nenhum latino da nossa área usa, então a gente tá 🤡 tacos de graça de novo! Essa moça ama a gente, os 'Muchachos' jajaja🌮🌯 tivemos uma conferência de estaca incrível com o Élder M. Holland tivemos o Face a Face com o Élder Bednar Cuidanse amigos, Elder Jacobs Fotos: desenhamos um unicórnio com nossas canetinhas novas alguém nos deu um saco de camarão.. 🍤 pegando sapos 🐸 Élder Ricks cortando o cabelo na varanda desse cara tacos de graça minha coleção de post-its até agora. Quais são algumas das suas frases favoritas que eu deveria adicionar?"}, {"id": "l14", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SET 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 14 · Dade City", "title": "Liderando a Área!! 😳🤯", "date": "2021-09-20T10:54:00", "group": "2021-09", "html": "<div class=\"body\"><p>Hola amigos mios!<\/p>\n<p>Como fue su semana? Como foi a semana de vocês?<\/p>\n<p>Aqui na Dirty Dade tem chovido como nunca jaja. A gente vive dizendo que precisa lavar o carro, mas aí chove e ele fica limpo de novo. Aí a gente pega a estrada de terra que leva pra casa jaja.<\/p>\n<p>Segunda passada tivemos uma atividade de distrito jogando spikeball e jogando futebol americano. Mas alguém, no caso eu, prendeu a bola bem no meio do coqueiro... Aí o Élder Kimball jogou nossa outra bola pra tirar ela de lá e ela também ficou presa... Nos despedimos do Élder Kimball essa semana porque agora ele pode ir para a designação original dele no Brasil. O lado bom é que vou ver ele depois da missão na BYU. Como ele foi embora, o Élder Ricks, meu companheiro, agora é o novo líder de distrito. E foi por isso que eu liderei a área essa semana.<\/p>\n<p>Os líderes de distrito fazem divisões com os missionários do distrito deles; então, como eu sou o assistente não oficial do líder de distrito, eu também participo. Eu fiquei em Dade City enquanto o Élder Ricks foi para Tampa com os líderes de zona, e eu fiquei com o Élder Petersen do Tampa Espanhol. Nosso dia estava indo bem até chegarmos em Dade City e todas as nossas lições serem canceladas, então tive que pensar em alguma coisa na hora.<\/p>\n<p>No fim consegui entrar em contato com a família do Jaime e tivemos uma lição incrível e convidamos eles a começarem a pensar no batismo!<\/p>\n<p>O resto da semana foi incrível. Temos feito muito contato na rua e essa semana tentamos ir direto ao ponto. A gente dizia hola e perguntava como a pessoa estava, mas logo depois já falava o que a gente faz e se ela gostaria de ouvir uma mensagem. Assim dava pra falar com mais gente e não perder tempo conhecendo pessoas só pra descobrir, infelizmente, que elas não querem conversar com a gente sobre o nosso propósito de verdade. Por causa disso encontramos 6 novos amigos no sábado. É isso por essa semana, mas essa próxima também está parecendo muito boa. Hoje é aniversário do Élder Ricks e quinta é a conferência de zona e também o meu aniversário.<\/p>\n<p>Cuidense por allí,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>conselho de distrito e despedida do Élder Kimball<\/li>\n<li>uma boba<\/li>\n<li>caminhonete enoorme<\/li>\n<li>Jantar com um membro (comemos bem)<\/li>\n<li>Almoço de aniversário no Chick-fil-A hoje<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_3.jpeg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2021-09-20_0_4.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_065.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_066.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_067.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_068.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_069.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_070.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_071.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_072.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Liderando a Área!! 😳🤯 Hola amigos mios! Como fue su semana? Como foi a semana de vocês? Aqui na Dirty Dade tem chovido como nunca jaja. A gente vive dizendo que precisa lavar o carro, mas aí chove e ele fica limpo de novo. Aí a gente pega a estrada de terra que leva pra casa jaja. Segunda passada tivemos uma atividade de distrito jogando spikeball e jogando futebol americano. Mas alguém, no caso eu, prendeu a bola bem no meio do coqueiro... Aí o Élder Kimball jogou nossa outra bola pra tirar ela de lá e ela também ficou presa... Nos despedimos do Élder Kimball essa semana porque agora ele pode ir para a designação original dele no Brasil. O lado bom é que vou ver ele depois da missão na BYU. Como ele foi embora, o Élder Ricks, meu companheiro, agora é o novo líder de distrito. E foi por isso que eu liderei a área essa semana. Os líderes de distrito fazem divisões com os missionários do distrito deles; então, como eu sou o assistente não oficial do líder de distrito, eu também participo. Eu fiquei em Dade City enquanto o Élder Ricks foi para Tampa com os líderes de zona, e eu fiquei com o Élder Petersen do Tampa Espanhol. Nosso dia estava indo bem até chegarmos em Dade City e todas as nossas lições serem canceladas, então tive que pensar em alguma coisa na hora. No fim consegui entrar em contato com a família do Jaime e tivemos uma lição incrível e convidamos eles a começarem a pensar no batismo! O resto da semana foi incrível. Temos feito muito contato na rua e essa semana tentamos ir direto ao ponto. A gente dizia hola e perguntava como a pessoa estava, mas logo depois já falava o que a gente faz e se ela gostaria de ouvir uma mensagem. Assim dava pra falar com mais gente e não perder tempo conhecendo pessoas só pra descobrir, infelizmente, que elas não querem conversar com a gente sobre o nosso propósito de verdade. Por causa disso encontramos 6 novos amigos no sábado. É isso por essa semana, mas essa próxima também está parecendo muito boa. Hoje é aniversário do Élder Ricks e quinta é a conferência de zona e também o meu aniversário. Cuidense por allí, Elder Jacobs Fotos: conselho de distrito e despedida do Élder Kimball uma boba caminhonete enoorme Jantar com um membro (comemos bem) Almoço de aniversário no Chick-fil-A hoje Mais desta semana"}, {"id": "l15", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">SET 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 15 · Dade City", "title": "Eu fiz uma rede social 😬... E funcionou!🤯🥵🥳", "date": "2021-09-27T13:53:00", "group": "2021-09", "html": "<div class=\"body\"><p>Hola mis amigos!<\/p>\n<p>Mais uma semana voou e eu estou amando a vida de missionário. Também obrigado a todo mundo que responde meus e-mails, manda cartas e me desejou feliz aniversário essa semana. Mesmo que eu só possa responder por e-mail ou carta, eu agradeço muito e vejo tudo.<\/p>\n<p>Essa semana foi puxada! Choveu duas vezes durante a semana, o que deixou as lições e a busca bem difíceis, mas também vimos alguns milagres.<\/p>\n<p>Essa semana também tivemos conferência de zona. Eu gostei muito e, na minha opinião, foi ainda mais divertido porque também era meu aniversário. Então parecia que eu estava aprendendo e também festejando com a minha família da missão. Parte da conferência de zona foi um monte de treinamentos sobre redes sociais. Eu me senti muito mal durante uma parte do treinamento porque falamos sobre bom, melhor e excelente. Temos muitas ferramentas para ensinar e encontrar, mas existem camadas de melhores usos, sem falar em garantir que a gente use essas ferramentas para cumprir nosso propósito missionário de convidar TODOS a virem a Cristo. Naquele momento percebi o quanto a gente não estava usando algumas ferramentas, como as redes sociais. Mas aí um dos meus posts sobre orações e mensagens de esperança de graça começou a bombar! De repente eu estava recebendo um monte de notificações de curtidas, comentários, DMs. Tive que silenciar meu celular! Nem tudo foi legal ou com boas intenções, mas vimos alguns bons resultados e marcamos uma lição! O outro milagre da semana foi provavelmente quando eu estava em divisão com o Élder Leonard no Dade City Inglês. Os élderes de inglês, principalmente o Élder Ballif quando ainda estava aqui, têm ensinado uma família incrível em que só parte é membro. Eu já falei deles antes porque fomos lá uma vez para o jantar de Shabat. Mas é a filha deles, a Eliana, que eles estão ensinando há um tempo. Ela já aprendeu praticamente tudo para o batismo, mas tem algumas preocupações. Mas quando fomos lá no sábado de manhã para 🍙Donuts🍩 e uma lição, conseguimos marcar uma data de batismo com ela! Foi muito especial e nós dois pensamos na mesma data na hora!<\/p>\n<p>Uma coisa que aprendi essa semana foi sobre planejamento. Planejar ajuda muito, principalmente quando cada buraco é preenchido para que o tempo seja bem usado, mas não devemos planejar só para preencher buracos. Os melhores resultados acontecem quando planejamos pensando nos nossos amigos. Tínhamos um buraco bem grande na sexta, mas lembramos que alguns dos nossos amigos estavam passando por coisas difíceis. Decidimos fazer cookies e levar para eles. Eles disseram que isso mudou completamente o humor deles e ajudou a ver que estamos ali para ensinar, mas também, e o mais importante, para ser amigos.<\/p>\n<p>Bom, é isso de mim por essa semana. Ainda estou tentando achar mais jeitos de encontrar pessoas nas redes sociais, principalmente pessoas que falam espanhol, então mandem ideias ou histórias de sucesso que vocês já viram.<\/p>\n<p>Já tentei adicionar membros e os amigos deles, perguntas sobre a melhor comida, e agora orações/mensagens de esperança de graça (essa última deu certo).<\/p>\n<p class=\"sign\">Hasta luego y cuidese!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Aniversário no Miños<\/li>\n<li>Conferência de Zona<\/li>\n<li>O lagarto de bolso do Élder Ricks🦎<\/li>\n<\/ul>\n<p>Bichos atropelados:<\/p>\n<ul class=\"bul\">\n<li>peixe?!?!?!🐟<\/li>\n<li>sapo🐸<\/li>\n<li>cobra🐍<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2021-09-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-09-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2021-09-27_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_073.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "Eu fiz uma rede social 😬... E funcionou!🤯🥵🥳 Hola mis amigos! Mais uma semana voou e eu estou amando a vida de missionário. Também obrigado a todo mundo que responde meus e-mails, manda cartas e me desejou feliz aniversário essa semana. Mesmo que eu só possa responder por e-mail ou carta, eu agradeço muito e vejo tudo. Essa semana foi puxada! Choveu duas vezes durante a semana, o que deixou as lições e a busca bem difíceis, mas também vimos alguns milagres. Essa semana também tivemos conferência de zona. Eu gostei muito e, na minha opinião, foi ainda mais divertido porque também era meu aniversário. Então parecia que eu estava aprendendo e também festejando com a minha família da missão. Parte da conferência de zona foi um monte de treinamentos sobre redes sociais. Eu me senti muito mal durante uma parte do treinamento porque falamos sobre bom, melhor e excelente. Temos muitas ferramentas para ensinar e encontrar, mas existem camadas de melhores usos, sem falar em garantir que a gente use essas ferramentas para cumprir nosso propósito missionário de convidar TODOS a virem a Cristo. Naquele momento percebi o quanto a gente não estava usando algumas ferramentas, como as redes sociais. Mas aí um dos meus posts sobre orações e mensagens de esperança de graça começou a bombar! De repente eu estava recebendo um monte de notificações de curtidas, comentários, DMs. Tive que silenciar meu celular! Nem tudo foi legal ou com boas intenções, mas vimos alguns bons resultados e marcamos uma lição! O outro milagre da semana foi provavelmente quando eu estava em divisão com o Élder Leonard no Dade City Inglês. Os élderes de inglês, principalmente o Élder Ballif quando ainda estava aqui, têm ensinado uma família incrível em que só parte é membro. Eu já falei deles antes porque fomos lá uma vez para o jantar de Shabat. Mas é a filha deles, a Eliana, que eles estão ensinando há um tempo. Ela já aprendeu praticamente tudo para o batismo, mas tem algumas preocupações. Mas quando fomos lá no sábado de manhã para 🍙Donuts🍩 e uma lição, conseguimos marcar uma data de batismo com ela! Foi muito especial e nós dois pensamos na mesma data na hora! Uma coisa que aprendi essa semana foi sobre planejamento. Planejar ajuda muito, principalmente quando cada buraco é preenchido para que o tempo seja bem usado, mas não devemos planejar só para preencher buracos. Os melhores resultados acontecem quando planejamos pensando nos nossos amigos. Tínhamos um buraco bem grande na sexta, mas lembramos que alguns dos nossos amigos estavam passando por coisas difíceis. Decidimos fazer cookies e levar para eles. Eles disseram que isso mudou completamente o humor deles e ajudou a ver que estamos ali para ensinar, mas também, e o mais importante, para ser amigos. Bom, é isso de mim por essa semana. Ainda estou tentando achar mais jeitos de encontrar pessoas nas redes sociais, principalmente pessoas que falam espanhol, então mandem ideias ou histórias de sucesso que vocês já viram. Já tentei adicionar membros e os amigos deles, perguntas sobre a melhor comida, e agora orações/mensagens de esperança de graça (essa última deu certo). Hasta luego y cuidese! Elder Jacobs Fotos: Aniversário no Miños Conferência de Zona O lagarto de bolso do Élder Ricks🦎 Bichos atropelados: peixe?!?!?!🐟 sapo🐸 cobra🐍 Mais desta semana"}, {"id": "l16", "area": 1, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">DADE CITY, FL<\/span><span class=\"pm-d\">OUT 2021<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🐊 Jacarés<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Gators"], "extra": "", "kind": "Carta 16 · Dade City", "title": "Falta de datas de batismo? Que nada!", "date": "2021-10-04T09:26:00", "group": "2021-10", "html": "<div class=\"body\"><p>Buenos Días amigos míos!<\/p>\n<p>Espero que todo mundo tenha tido a oportunidade de assistir à Conferência Geral nesse fim de semana. Teve umas mensagens ótimas. Minhas favoritas foram as do Élder Holland e do Élder Gilbert. Me contem coisas legais que vocês aprenderam ou quais foram as favoritas de vocês. Tive outra divisão essa semana; o Élder Mehr veio comigo em Dade City. Levamos muita rejeição de pessoas idosas em casas móveis, junto com uma campanha para assinar os Convênios? Bem engraçado na nossa opinião. Mas também conhecemos umas pessoas legais mais tarde naquela noite.<\/p>\n<p>Essa semana também marcamos data de batismo com 2 dos nossos amigos! Descobrimos que nossa missão está com falta de datas de batismo, então já fomos correndo tentar marcar. O Juan, uma referência incrível de um membro, que está muuuito pronto para ser batizado, e o Gustavo, um amigo que já tinha sido ensinado antes (o apelido pra isso é \"former\"). Ele lê o Livro de Mórmon e ora bastante. Ele perdeu o irmão, que era membro, então quando ensinamos o plano de salvação foi muito especial e perguntamos se ele queria ver o irmão de novo. Lições muito especiais com os dois.<\/p>\n<p>Não aconteceu muita coisa engraçada essa semana, mas quase atropelamos um tatu vivo. Que bichos estranhos. Torci o pé na terça e por isso o resto da semana meu pé ficou doendo. Doeu quase o tempo todo, menos durante o horário nobre de proselitismo (18h-21h) andando pela Dirty Dade. Com certeza um milagre. E agora está quase totalmente curado. Eu queria muito ter mais histórias (não que as espirituais ou os milagres sejam ruins) como o meu companheiro essa semana, então acho que vou contar o que aconteceu com ele enquanto estava em Wesley Chapel na divisão. Ele e o Élder Jenson estavam fazendo contato na rua quando tentaram falar com um cara. Ele não respondeu, então eles foram embora, mas acharam que deviam tentar uma última vez. Dessa vez, quando eles chegaram perto, o cara ficou meio bravo e disse: \"nunca chegue perto de um homem que você não conhece no carro dele! Porque você não sabe se ele tem uma arma, continue andando!\"<\/p>\n<p>Eles continuaram e ficaram bem, mas com certeza ele tinha uma arma, senão por que ia dizer isso. Jajaja 🔫<\/p>\n<p>Enfim, a transferência está quase acabando, então vamos saber as novidades nesse próximo fim de semana.<\/p>\n<p>Hasta la próxima semana,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\"> nde 🥸👨‍🎓🏴‍☠️", "date": "2021-10-11T09:38:00", "group": "2021-10", "html": "<div class=\"body\"><p>Buenos Días amigos míos!<\/p>\n<p>Essa semana foi incrível e, infelizmente, como eu descobri, a minha última na Dirty Dade City. Fiquei sabendo ontem perto da hora do jantar. Vou para Lakeland ficar com o Élder Olayan e o Élder Izu. O Élder Olayan vai \"morrer\" (voltar pra casa) e o Élder Izu vai terminar o treinamento dele comigo! Eu acabei de terminar o meu treinamento, então espero que dê tudo certo. Infelizmente, isso também significa que talvez eu não consiga ir ao batismo do Juan no próximo domingo. Vou pedir ao presidente, mas se não der vai ser pelo Zoom.<\/p>\n<p>As outras notícias de transferência que recebemos são: o Élder Ricks vai para a República Dominicana no dia 28, mas antes disso vai ficar com o Élder Makechnie e um novato em treinamento. O Élder Ricks (não o meu companheiro, mas do mesmo apartamento) vai para Sarasota com o Élder Miller. E o Élder Leonard vai ficar e receber o Élder Hansen. Tem muita mudança no distrito e na missão toda, então está uma loucura.<\/p>\n<p>Essa semana tivemos 2 divisões! Uma com o outro Élder Ricks, comigo no Dade City Espanhol, e a outra em Wesley Chapel com o Élder Jenson. As duas foram muito divertidas e aprendi bastante sobre eles e sobre como melhorar. Aí na sexta o Élder Thompson e o Élder Eaton fizeram divisão com os élderes de inglês. Então meio que deu pra passar um tempo com o Élder Thompson, que é hilário. Muita risada por causa das piadas e histórias engraçadas dele.<\/p>\n<p>Essa semana ganhamos um 3º celular. O sinal tem sido péssimo com a T-Mobile e a AT&amp;T, já que moramos e trabalhamos no meio do nada. Então nos deram um 3º celular que é da Verizon (se não funcionar, a gente consegue wi-fi). Por sorte ele tem funcionado maravilhosamente, mas foi meio chato essa semana. Tentamos ativar ele na terça de manhã, mas não tivemos resposta até quarta. Justo no dia em que decidimos deixar ele em casa porque não tínhamos recebido nada quando saímos do apartamento. E com a nossa sorte, ele ativou enquanto estávamos em Dade City (25 min de carro até em casa), então ficamos sem celular. Agora está tudo resolvido e temos que lembrar do 3º celular, o que é meio chato/engraçado, já que é o mesmo modelo e a mesma capinha do Élder Ricks.<\/p>\n<p>Nesse último sábado tivemos uma noite cultural latino-americana da estaca. Foi incrível, com muita comida, decoração, música e danças de vários países diferentes. Vieram muitos membros, amigos e outros missionários, então foi um sucesso enorme. O pessoal ficava enchendo nossos pratos de comida toda vez que estavam vazios e a gente passava pela mesa deles haha. Essa transferência foi ótima e vimos muitos milagres, principalmente quando simplesmente andamos pelas ruas indo aonde sentimos que devíamos ir. Essa semana entramos numa área nova que nunca tinha sido trabalhada e encontramos uns novos amigos que parecem bem interessados. Eu sei que o Salvador caminha conosco todos os dias e estou animado para essa próxima transferência. (Espero que meu espanhol seja bom o suficiente para treinar...).<\/p>\n<p>Bom, lá vou eu para o P-day, fazer as malas e me despedir do pessoal daqui.<\/p>\n<p>Hasta la proxima semana, quando eu vou estar na minha nova área e com novos companheiros,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>tie-dye do distrito<\/li>\n<li>Élder Jenson &amp; eu com nossos brinquedos do McLanche Feliz, o Heihei (Moana), fazendo contato na rua<\/li>\n<li>nuvem maluca<\/li>\n<li>igreja (Élder Ricks &amp; eu)<\/li>\n<li>Nós e os Miños (Joaquin, Jared, Hermana Lucy Miño, &amp; Hermano Juan Miño)<\/li>\n<\/ul>\n<p>Aviso: a parte dos bichos atropelados, claro<\/p>\n<ul class=\"bul\">\n<li>gato...<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb land\"><img src=\"images/2021-10-11_0_0.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2021-10-11_0_1.jpg\" alt=\"\"><
