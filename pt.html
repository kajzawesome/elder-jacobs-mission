os a semana com muita busca e visitando amigos. João &amp; Irene terminaram o curso de casamento e marcamos o casamento deles para sexta de manhã. Estamos superanimados, e os membros da ala também, principalmente os que estão torcendo por eles e para criar um grupo em português. O Presidente Gardner também está muito animado. Eles vão ser batizados no dia 25 (sábado) às 6 da tarde, me avisem se quiserem um link!<\/p>\n<p>Temos alguns amigos novos, mas eles não estão cumprindo os compromissos, como ler o Livro de Mórmon ou vir à igreja. Por favor, orem para que eles sintam o Espírito e entendam a importância disso.<\/p>\n<p>Nosso amigo Daniel vive cantando para nós ou mandando músicas. Estou aprendendo muito sobre músicas religiosas mexicanas. Um grande destaque desta semana foi encontrar outra família parcialmente membro. Recebemos uma referência dos outros élderes, que estavam batendo portas. A Debora é da Espanha, mas o marido dela é da República Dominicana e é membro a vida toda. Não é muito ativo, mas ele sabe que as outras igrejas simplesmente não são a mesma coisa. Ensinamos os dois e vamos voltar esta semana. Estou superanimado com o futuro, e eles querem que a filha também receba as lições.<\/p>\n<p>A vida está boa, então só orem pelos amigos, como eu já disse. E pelo dom de línguas para nós.<\/p>\n<p>Sobre o título: acordamos domingo de manhã com o nosso carro e tudo lá fora isolado com fita da polícia. Tinha um corpo e uma caminhonete aleatória bem na frente da nossa janela. Moramos no 2º andar e deu para assistir à investigação. Não vimos o corpo (estava coberto) e chegamos na igreja na hora, mas foi interessante.<\/p>\n<p>Estou mandando uma gravação de voz do pensamento espiritual desta semana.<\/p>\n<p>Morôni 10:32<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>choveu e estava um gelo!<\/li>\n<li>limpando a pia batismal porque as Hermanas esqueceram de limpar antes do batismo delas<\/li>\n<li>fotos da investigação<\/li>\n<li>chamada de vídeo com caretas<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-03-20_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-20_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Um mistério de assassinato?! 🔪🩸☠️ Olá pessoal! Tivemos uma semana muito boa, cheia de lições. Vamos lá! Começamos a semana com muita busca e visitando amigos. João & Irene terminaram o curso de casamento e marcamos o casamento deles para sexta de manhã. Estamos superanimados, e os membros da ala também, principalmente os que estão torcendo por eles e para criar um grupo em português. O Presidente Gardner também está muito animado. Eles vão ser batizados no dia 25 (sábado) às 6 da tarde, me avisem se quiserem um link! Temos alguns amigos novos, mas eles não estão cumprindo os compromissos, como ler o Livro de Mórmon ou vir à igreja. Por favor, orem para que eles sintam o Espírito e entendam a importância disso. Nosso amigo Daniel vive cantando para nós ou mandando músicas. Estou aprendendo muito sobre músicas religiosas mexicanas. Um grande destaque desta semana foi encontrar outra família parcialmente membro. Recebemos uma referência dos outros élderes, que estavam batendo portas. A Debora é da Espanha, mas o marido dela é da República Dominicana e é membro a vida toda. Não é muito ativo, mas ele sabe que as outras igrejas simplesmente não são a mesma coisa. Ensinamos os dois e vamos voltar esta semana. Estou superanimado com o futuro, e eles querem que a filha também receba as lições. A vida está boa, então só orem pelos amigos, como eu já disse. E pelo dom de línguas para nós. Sobre o título: acordamos domingo de manhã com o nosso carro e tudo lá fora isolado com fita da polícia. Tinha um corpo e uma caminhonete aleatória bem na frente da nossa janela. Moramos no 2º andar e deu para assistir à investigação. Não vimos o corpo (estava coberto) e chegamos na igreja na hora, mas foi interessante. Estou mandando uma gravação de voz do pensamento espiritual desta semana. Morôni 10:32 Los amo! Elder Jacobs Fotos: choveu e estava um gelo! limpando a pia batismal porque as Hermanas esqueceram de limpar antes do batismo delas fotos da investigação chamada de vídeo com caretas"}, {"id": "l92", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["BR", "HT"], "moments": ["Baptism", "Temple"], "extra": "Brazil Haiti", "kind": "Carta 92 · Fort Myers", "title": "O batismo, os brasucas e o doentinho 🤠🤧", "date": "2023-03-27T06:55:00", "group": "2023-03", "html": "<div class=\"body\"><p>AaiWawA wA Wa WAaaaa...<\/p>\n<p>(Começa a tocar o tema de “O Bom, o Mau e o Feio”)<\/p>\n<p>Oi Cara! Tudo bem e aí?<\/p>\n<p>Esta semana foi diferente, com certeza, mas foi boa.<\/p>\n<p>Na segunda à noite não teve muita coisa, mas na terça tivemos uma divisão tripla com os líderes de zona, o que significou que o Élder Gonzalez e eu ficamos juntos, só dois missionários comuns prontos para ensinar e fazer palhaçada. Pratiquei crioulo com ele para que à tarde eu pudesse mandar ver. Consegui fazer uma ou duas orações e prestar testemunho. A parte mais difícil foi ficar sentado quase sem nada para fazer. De algum jeito eu entendi muito do que as pessoas diziam, mas fiquei lá paralisado, feito barata tonta, sem ideia de como responder. Mas ainda assim foi divertido, eu gosto de estar com o Élder Gonzalez. Quarta e quinta foram bem boas, só correndo para algumas lições e fazendo busca no tempo que sobrava. O Élder Bedingfield veio comigo na quinta para outra divisão.<\/p>\n<p>A sexta começou superbem. João &amp; Irene se casaram! Vejam as fotos abaixo 👇<\/p>\n<p>Depois seguimos o dia mais ou menos igual, mas meu corpo começou a doer e eu fiquei com uma dor de cabeça forte. Piorou mais tarde, então falamos com a Sister Meese, a secretária de saúde, e passamos na Walgreens antes de ir para casa. Peguei um vírus que está mexendo com a garganta, os ouvidos, etc., tudo que é ligado.<\/p>\n<p>No sábado eu segui firme, mesmo muito doente e me sentindo mal, para dar meu discurso e fazer o batismo acontecer. Mas no domingo à tarde a coisa ficou feia e fomos a um pronto atendimento, onde me deram um remédio mais forte e mais instruções. Também confirmaram que não era COVID.<\/p>\n<p>Hoje estou me sentindo melhor, mas disseram que em uns 5 dias eu devo voltar ao normal, bem a tempo da viagem ao templo na quinta. Sem pensamento espiritual esta semana, estou doente. Mas convido vocês a anotar perguntas para a Conferência Geral; aí, enquanto estiverem ouvindo, vocês vão receber respostas.<\/p>\n<p>O visto do Élder Kroeger chegou e ele vai embora em 2 semanas. Hoje tem uma TE (transferência de emergência) porque estamos recebendo 2 áreas novas da Missão Orlando, mas nenhum missionário. Vamos ficar num trio com o Élder Wiberg e agora cobrindo Lehigh Acres também.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Fotos do casamento de João &amp; Irene @ fórum<\/li>\n<li>fotos do batismo (1º batismo brasileiro aqui!)<\/li>\n<li>eu doente<\/li>\n<li>trocando um pneu furado<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-03-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-27_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-27_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-27_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "O batismo, os brasucas e o doentinho 🤠🤧 AaiWawA wA Wa WAaaaa... (Começa a tocar o tema de “O Bom, o Mau e o Feio”) Oi Cara! Tudo bem e aí? Esta semana foi diferente, com certeza, mas foi boa. Na segunda à noite não teve muita coisa, mas na terça tivemos uma divisão tripla com os líderes de zona, o que significou que o Élder Gonzalez e eu ficamos juntos, só dois missionários comuns prontos para ensinar e fazer palhaçada. Pratiquei crioulo com ele para que à tarde eu pudesse mandar ver. Consegui fazer uma ou duas orações e prestar testemunho. A parte mais difícil foi ficar sentado quase sem nada para fazer. De algum jeito eu entendi muito do que as pessoas diziam, mas fiquei lá paralisado, feito barata tonta, sem ideia de como responder. Mas ainda assim foi divertido, eu gosto de estar com o Élder Gonzalez. Quarta e quinta foram bem boas, só correndo para algumas lições e fazendo busca no tempo que sobrava. O Élder Bedingfield veio comigo na quinta para outra divisão. A sexta começou superbem. João & Irene se casaram! Vejam as fotos abaixo 👇 Depois seguimos o dia mais ou menos igual, mas meu corpo começou a doer e eu fiquei com uma dor de cabeça forte. Piorou mais tarde, então falamos com a Sister Meese, a secretária de saúde, e passamos na Walgreens antes de ir para casa. Peguei um vírus que está mexendo com a garganta, os ouvidos, etc., tudo que é ligado. No sábado eu segui firme, mesmo muito doente e me sentindo mal, para dar meu discurso e fazer o batismo acontecer. Mas no domingo à tarde a coisa ficou feia e fomos a um pronto atendimento, onde me deram um remédio mais forte e mais instruções. Também confirmaram que não era COVID. Hoje estou me sentindo melhor, mas disseram que em uns 5 dias eu devo voltar ao normal, bem a tempo da viagem ao templo na quinta. Sem pensamento espiritual esta semana, estou doente. Mas convido vocês a anotar perguntas para a Conferência Geral; aí, enquanto estiverem ouvindo, vocês vão receber respostas. O visto do Élder Kroeger chegou e ele vai embora em 2 semanas. Hoje tem uma TE (transferência de emergência) porque estamos recebendo 2 áreas novas da Missão Orlando, mas nenhum missionário. Vamos ficar num trio com o Élder Wiberg e agora cobrindo Lehigh Acres também. Los amo! Elder Jacobs Fotos: Fotos do casamento de João & Irene @ fórum fotos do batismo (1º batismo brasileiro aqui!) eu doente trocando um pneu furado"}, {"id": "l93", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ABR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": [], "moments": ["Temple"], "extra": "", "kind": "Carta 93 · Fort Myers", "title": "Uma das semanas mais lentas", "date": "2023-04-03T06:51:00", "group": "2023-04", "html": "<div class=\"body\"><p>Oi galera!<\/p>\n<p>Como foi a conferência? Eu amei.<\/p>\n<p>Infelizmente não tenho muita coisa para contar desta semana.<\/p>\n<p>Viramos um trio na segunda e estamos só fazendo palhaçada e nos divertindo muito.<\/p>\n<p>Fomos ao templo na quinta e, como é muito longe, dirigimos até Tampa na quarta e passamos a noite lá. Consegui visitar os Franco, minha família de recém-conversos. Conversamos sobre bênçãos patriarcais e eles nos serviram umas empanadas incríveis.<\/p>\n<p>Aí, claro, sábado e domingo foi a Conferência Geral.<\/p>\n<p>Fui alimentado espiritualmente esta semana com certeza, mas não poder bater portas, ensinar e ver nossos amigos foi bem difícil.<\/p>\n<p>Eu amei a conferência, e um dos grandes temas foi que cremos em Cristo e só precisamos confiar Nele. A Páscoa é a celebração da Sua Expiação: o sofrimento, a morte e a ressurreição do nosso Salvador, que nos cura e nos capacita a nos tornar melhores. A graça é o que preenche a distância entre nossas falhas e esforços e os requisitos de Deus e do Seu reino. Por favor, lembrem que Ele está lá, Ele pode curar vocês e Ele pode consertar as coisas.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>templo<\/li>\n<li>conferência com o distrito<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-04-03_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-03_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-03_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-03_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Uma das semanas mais lentas Oi galera! Como foi a conferência? Eu amei. Infelizmente não tenho muita coisa para contar desta semana. Viramos um trio na segunda e estamos só fazendo palhaçada e nos divertindo muito. Fomos ao templo na quinta e, como é muito longe, dirigimos até Tampa na quarta e passamos a noite lá. Consegui visitar os Franco, minha família de recém-conversos. Conversamos sobre bênçãos patriarcais e eles nos serviram umas empanadas incríveis. Aí, claro, sábado e domingo foi a Conferência Geral. Fui alimentado espiritualmente esta semana com certeza, mas não poder bater portas, ensinar e ver nossos amigos foi bem difícil. Eu amei a conferência, e um dos grandes temas foi que cremos em Cristo e só precisamos confiar Nele. A Páscoa é a celebração da Sua Expiação: o sofrimento, a morte e a ressurreição do nosso Salvador, que nos cura e nos capacita a nos tornar melhores. A graça é o que preenche a distância entre nossas falhas e esforços e os requisitos de Deus e do Seu reino. Por favor, lembrem que Ele está lá, Ele pode curar vocês e Ele pode consertar as coisas. Los amo! Élder Jacobo Fotos: templo conferência com o distrito"}, {"id": "l94", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ABR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["BR"], "moments": ["Temple"], "extra": "Brazil", "kind": "Carta 94 · Fort Myers", "title": "🥚 Páscoa 🐰", "date": "2023-04-10T06:46:00", "group": "2023-04", "html": "<div class=\"body\"><p>Que onda pandilla?<\/p>\n<p>Esta semana foi boa, ainda não muito rápida nem superempolgante, mas tivemos boas lições e outras coisas aconteceram. Não aconteceu muita coisa nos primeiros dias. Tínhamos algumas lições marcadas, metade foi cancelada, mas as outras aconteceram. Depois passamos um tempo visitando outros amigos e pessoas para ver se tinham interesse em se encontrar e qual seria o melhor horário.<\/p>\n<p>Na quarta tivemos um monte de lições porque passamos muito tempo batendo portas. Tomara que esses novos amigos leiam e progridam. Orem para que a gente encontre mais famílias para ensinar. Várias pessoas nos disseram para parar de passar lá. Passamos um dia em Lehigh, já que no momento estamos cobrindo duas áreas.<\/p>\n<p>Dei uma lição inteira em português sozinho, já que o cara só queria provar o ponto dele de que ele é o próprio profeta (#RevelaçãoModernaÉIrada&amp;SuperImportante)<\/p>\n<p>No sábado nos encontramos no meio do caminho, em Sarasota, com os APs para deixar o Élder Kroeger. #FlyHighSweetChildofMine O Brasil está ganhando um dos melhores 🇧🇷<\/p>\n<p>O Domingo de Páscoa foi incrível. Tive a oportunidade de confirmar o João na reunião sacramental (fiquei supernervoso fazendo em português, mas Deus com certeza tem me preparado e aumentado minhas habilidades). E o foco em Cristo foi incrível; depois consegui ajudar alguns amigos a entender isso e a Sua Expiação.<\/p>\n<p>Entender a Sua graça e a Sua Expiação é provavelmente uma das maiores coisas que eu aprendi, e isso vai me abençoar para sempre. A Sua graça é a força e o poder para superar nossas fraquezas, e a Sua Expiação é o sacrifício infinito que nos dá a graça, que nos liberta da morte e pode nos libertar do pecado se nos arrependermos. O arrependimento é uma verdadeira mudança de coração, trocar os nossos desejos pelos de Deus, e é um processo contínuo, assim como a Restauração do Evangelho de Jesus Cristo. Por favor, tirem um tempo para ponderar o testemunho de vocês sobre essas coisas, leiam o Tópico do Evangelho sobre isso ou até compartilhem seu testemunho com outra pessoa.<\/p>\n<p class=\"sign\">Los amo muchísimo! Feliz páscoa!<\/p>\n<p>Élder Jacó<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Jantar com os Coles<\/li>\n<li>Dando tchau para o Élder Kroeger<\/li>\n<li>Lagartixa no bolso<\/li>\n<li>Umas fotos legais em Lehigh<\/li>\n<li>Nossa zona &amp; St. Pete no templo<\/li>\n<li>Minigolfe<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-04-10_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-10_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-10_0_8.jpg\" alt=\"\"><\/figure><\/div>", "text": "🥚 Páscoa 🐰 Que onda pandilla? Esta semana foi boa, ainda não muito rápida nem superempolgante, mas tivemos boas lições e outras coisas aconteceram. Não aconteceu muita coisa nos primeiros dias. Tínhamos algumas lições marcadas, metade foi cancelada, mas as outras aconteceram. Depois passamos um tempo visitando outros amigos e pessoas para ver se tinham interesse em se encontrar e qual seria o melhor horário. Na quarta tivemos um monte de lições porque passamos muito tempo batendo portas. Tomara que esses novos amigos leiam e progridam. Orem para que a gente encontre mais famílias para ensinar. Várias pessoas nos disseram para parar de passar lá. Passamos um dia em Lehigh, já que no momento estamos cobrindo duas áreas. Dei uma lição inteira em português sozinho, já que o cara só queria provar o ponto dele de que ele é o próprio profeta (#RevelaçãoModernaÉIrada&SuperImportante) No sábado nos encontramos no meio do caminho, em Sarasota, com os APs para deixar o Élder Kroeger. #FlyHighSweetChildofMine O Brasil está ganhando um dos melhores 🇧🇷 O Domingo de Páscoa foi incrível. Tive a oportunidade de confirmar o João na reunião sacramental (fiquei supernervoso fazendo em português, mas Deus com certeza tem me preparado e aumentado minhas habilidades). E o foco em Cristo foi incrível; depois consegui ajudar alguns amigos a entender isso e a Sua Expiação. Entender a Sua graça e a Sua Expiação é provavelmente uma das maiores coisas que eu aprendi, e isso vai me abençoar para sempre. A Sua graça é a força e o poder para superar nossas fraquezas, e a Sua Expiação é o sacrifício infinito que nos dá a graça, que nos liberta da morte e pode nos libertar do pecado se nos arrependermos. O arrependimento é uma verdadeira mudança de coração, trocar os nossos desejos pelos de Deus, e é um processo contínuo, assim como a Restauração do Evangelho de Jesus Cristo. Por favor, tirem um tempo para ponderar o testemunho de vocês sobre essas coisas, leiam o Tópico do Evangelho sobre isso ou até compartilhem seu testemunho com outra pessoa. Los amo muchísimo! Feliz páscoa! Élder Jacó Fotos: Jantar com os Coles Dando tchau para o Élder Kroeger Lagartixa no bolso Umas fotos legais em Lehigh Nossa zona & St. Pete no templo Minigolfe"}, {"id": "l95", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ABR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 México<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["MX", "BR"], "moments": ["Baptism", "Temple"], "extra": "Mexico Brazil", "kind": "Carta 95 · Fort Myers", "title": "No soy María pero tengo Jesus adentro", "date": "2023-04-17T08:10:00", "group": "2023-04", "html": "<div class=\"body\"><p>Hola hola, tamo' bien y espero que e' lo mismo pa' ustede<\/p>\n<p>A gente tem ouvido muito reggaeton cristão, daí o título engraçado e o espanhol.<\/p>\n<p>Quer dizer: Não sou Maria, mas tenho Cristo dentro de mim<\/p>\n<p>Bom, esta semana basicamente teve duas partes, antes de quinta e depois de quinta, porque tivemos transferências. Eu fiquei e recebi o Élder Franson, outro dos meus antigos treinados, e é demais estar com ele de novo. Mas desta vez estou ensinando português para ele, para que ele possa assumir a área no fim dessas 6 semanas.<\/p>\n<p>Tivemos algumas lições esta semana, mas boa parte da semana foi de busca. Nada muito doido ultimamente, mas temos alguns amigos que estão indo bem; quanto ao resto, provavelmente vamos parar de ensinar por enquanto. Fomos à feira mexicana na hora do almoço no sábado e foi muito top. Comprei umas lembrancinhas de países, provavelmente vou voltar para pegar mais algumas. O Élder Franson conseguiu uma pechincha absurda numa camisa de futebol da Colômbia, $5! Vejam as fotos abaixo<\/p>\n<p>Demos discursos no domingo sobre o trabalho missionário, e foi engraçado porque nós e o bispado achamos que não íamos conseguir falar tanto tempo, então chamaram as Hermanas para prestar testemunho, mas a gente falou bastante e foi bom, então no fim o sumo conselheiro perdeu boa parte do tempo dele... Fazer o quê<\/p>\n<p>Uma última coisa antes do meu pensamento espiritual desta semana: preciso que todos vocês, por favor, orem pela Irene (a que acabou de ser batizada). Ela é incrível e já está tentando conseguir a recomendação para ir ao templo, mas recebeu uma notícia difícil. Ela tem um dano bem sério na retina, e o diagnóstico disse que ela pode ficar cega em pouco tempo. Ela está procurando um especialista para receber mais orientação e saber o que fazer, mas está sendo muito difícil para ela. Demos uma bênção para ela ontem e ela tem amigos muito bons na ala, mas as orações de vocês por ela significariam o mundo para mim. O pensamento desta semana é Romanos 5:8; interpretem como quiserem (um cara esta semana fez isso de um jeito bem livre), mas eu amo muito essa escritura. Eu sei que Deus vive e nos ama apesar dos nossos erros. Confiem Nele!<\/p>\n<p>Romanos 5:8<\/p>\n<p>Mas Deus prova o seu amor para conosco, em que Cristo morreu por nós, sendo nós ainda pecadores.<\/p>\n<p class=\"sign\">Los amo muchísimo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>nós com nossas camisas<\/li>\n<li>um adesivo que eu comprei<\/li>\n<li>umas coisas aleatórias que vimos na feira<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-04-17_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-17_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-17_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-17_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-17_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "No soy María pero tengo Jesus adentro Hola hola, tamo' bien y espero que e' lo mismo pa' ustede A gente tem ouvido muito reggaeton cristão, daí o título engraçado e o espanhol. Quer dizer: Não sou Maria, mas tenho Cristo dentro de mim Bom, esta semana basicamente teve duas partes, antes de quinta e depois de quinta, porque tivemos transferências. Eu fiquei e recebi o Élder Franson, outro dos meus antigos treinados, e é demais estar com ele de novo. Mas desta vez estou ensinando português para ele, para que ele possa assumir a área no fim dessas 6 semanas. Tivemos algumas lições esta semana, mas boa parte da semana foi de busca. Nada muito doido ultimamente, mas temos alguns amigos que estão indo bem; quanto ao resto, provavelmente vamos parar de ensinar por enquanto. Fomos à feira mexicana na hora do almoço no sábado e foi muito top. Comprei umas lembrancinhas de países, provavelmente vou voltar para pegar mais algumas. O Élder Franson conseguiu uma pechincha absurda numa camisa de futebol da Colômbia, $5! Vejam as fotos abaixo Demos discursos no domingo sobre o trabalho missionário, e foi engraçado porque nós e o bispado achamos que não íamos conseguir falar tanto tempo, então chamaram as Hermanas para prestar testemunho, mas a gente falou bastante e foi bom, então no fim o sumo conselheiro perdeu boa parte do tempo dele... Fazer o quê Uma última coisa antes do meu pensamento espiritual desta semana: preciso que todos vocês, por favor, orem pela Irene (a que acabou de ser batizada). Ela é incrível e já está tentando conseguir a recomendação para ir ao templo, mas recebeu uma notícia difícil. Ela tem um dano bem sério na retina, e o diagnóstico disse que ela pode ficar cega em pouco tempo. Ela está procurando um especialista para receber mais orientação e saber o que fazer, mas está sendo muito difícil para ela. Demos uma bênção para ela ontem e ela tem amigos muito bons na ala, mas as orações de vocês por ela significariam o mundo para mim. O pensamento desta semana é Romanos 5:8; interpretem como quiserem (um cara esta semana fez isso de um jeito bem livre), mas eu amo muito essa escritura. Eu sei que Deus vive e nos ama apesar dos nossos erros. Confiem Nele! Romanos 5:8 Mas Deus prova o seu amor para conosco, em que Cristo morreu por nós, sendo nós ainda pecadores. Los amo muchísimo! Elder Jacobs Fotos: nós com nossas camisas um adesivo que eu comprei umas coisas aleatórias que vimos na feira"}, {"id": "l96", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">ABR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CU\">🇨🇺 Cuba<\/span><span class=\"stamp c\" data-c=\"NI\">🇳🇮 Nicarágua<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["CU", "NI", "BR", "HT"], "moments": ["Baptism"], "extra": "Cuba Nicaragua Brazil Haiti", "kind": "Carta 96 · Fort Myers", "title": "🐂 boi 😎", "date": "2023-04-24T05:44:00", "group": "2023-04", "html": "<div class=\"body\"><p>Oi galera, bom dia!<\/p>\n<p>Espero que vocês tenham tido uma semana maravilhosa e estejam bem.<\/p>\n<p>Estamos ótimos aqui e tivemos uma semana bem produtiva. A grande derrota foi que nenhum amigo veio à igreja depois de convidarmos muita gente. Todo o resto foi bom.<\/p>\n<p>Na segunda começamos com um pouco de busca e encontramos mais 2 famílias brasileiras. Além de alguns hispânicos e alguns haitianos para passar como referência.<\/p>\n<p>A terça também foi mais busca, já que nossas lições cancelaram, mas pelo lado bom ensinamos o Evandro. Ele também é do Brasil e veio à aula de inglês, mas está muito interessado em crescer na vida espiritual e se achegar mais a Deus. Ficou animado por ter o próprio Livro de Mórmon e por vir à igreja, mas viajou, então tomara que seja esta semana. Também passamos de novo no BrazMarket e eu comprei um Chifre de Boi 🐂. É usado para uma bebida tradicional do Brasil: Tererê<\/p>\n<p>Tivemos uma lição com a Marliet; ela está procurando uma igreja e tal, mas outra igreja começou a visitá-la. Esperamos que ela queira se encontrar de novo e que possamos passar pessoalmente para dar um Livro de Mórmon. Ela é de Cuba e tem uma fé como ninguém.<\/p>\n<p>Também visitamos o Jose esta semana. Ele é um membro que está voltando e está indo muito bem. Ele até participou da ordenação do João ao Sacerdócio Aarônico. Na visita, tivemos a chance de conversar com os colegas de casa dele e perceber o quanto ainda não sabemos. Eles são de 3 estados diferentes do Brasil, e cada um fala as coisas de um jeito e tem suas próprias palavras. Foi um desafio divertido. Na sexta fui para Lehigh em divisão com os líderes de zona. Foi divertido com o Élder Sellers, mas com o dia inteiro cheio de lições marcadas e nenhuma acontecendo, foi difícil, para dizer o mínimo.<\/p>\n<p>Conhecemos um cara novo e o filho dele, eles são da Nicarágua. Tivemos uma primeira lição legal e depois percebemos por que ele fazia tantas perguntas. Além de um desejo sincero de aprender, ele quer ser batizado. Vamos conversar mais sobre isso na próxima visita. E aí gente, basicamente é isso.<\/p>\n<p>Eu adoraria saber de vocês e da vida de vocês. Mesmo eu voltando para casa relativamente logo (27 de maio), eu adoraria conversar agora. O pensamento de hoje vem da Conferência Geral:<\/p>\n<p>O Presidente Russell M. Nelson declarou: “O Bom Pastor cuida com amor de todas as ovelhas de Seu rebanho, e nós somos Seus verdadeiros subpastores. Nosso privilégio é levar o amor Dele e acrescentar nosso próprio amor aos amigos e vizinhos﻿—alimentando, cuidando e nutrindo-os﻿—como o Salvador gostaria que fizéssemos.”<\/p>\n<ul class=\"bul\">\n<li>Élder Uceda, &quot;O Senhor Jesus Cristo nos ensina a ministrar&quot;<\/li>\n<\/ul>\n<p>Se amamos nossos amigos, estamos dispostos a fazer quase qualquer coisa por eles. Deixamos nossos assuntos pessoais para ir e ser &quot;salvadores&quot; para eles e suas aflições. Não se esqueçam dos nossos amigos e das necessidades deles, nem do exemplo de Cristo para nós. Ministrar pode acontecer pessoalmente ou digitalmente, com frequência ou raramente, em visitas curtas ou longas. Mas, seja qual for o jeito que fizermos isso, seguindo o Espírito, é muito importante.<\/p>\n<p class=\"sign\">Los amo muchísimo!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Nós com o Mozart (ele gosta de tocar piano!)<\/li>\n<li>Chifre de Boi 🐂 copo de chifre<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-04-24_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-04-24_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-24_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-04-24_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "🐂 boi 😎 Oi galera, bom dia! Espero que vocês tenham tido uma semana maravilhosa e estejam bem. Estamos ótimos aqui e tivemos uma semana bem produtiva. A grande derrota foi que nenhum amigo veio à igreja depois de convidarmos muita gente. Todo o resto foi bom. Na segunda começamos com um pouco de busca e encontramos mais 2 famílias brasileiras. Além de alguns hispânicos e alguns haitianos para passar como referência. A terça também foi mais busca, já que nossas lições cancelaram, mas pelo lado bom ensinamos o Evandro. Ele também é do Brasil e veio à aula de inglês, mas está muito interessado em crescer na vida espiritual e se achegar mais a Deus. Ficou animado por ter o próprio Livro de Mórmon e por vir à igreja, mas viajou, então tomara que seja esta semana. Também passamos de novo no BrazMarket e eu comprei um Chifre de Boi 🐂. É usado para uma bebida tradicional do Brasil: Tererê Tivemos uma lição com a Marliet; ela está procurando uma igreja e tal, mas outra igreja começou a visitá-la. Esperamos que ela queira se encontrar de novo e que possamos passar pessoalmente para dar u muchísimo! Élder Jacobo Fotos: Nós com o Mozart (ele gosta de tocar piano!) Chifre de Boi 🐂 copo de chifre"}, {"id": "l97", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAI 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["HT"], "moments": ["Baptism"], "extra": "Haiti", "kind": "Carta 97 · Fort Myers", "title": "Foco nas MPL 🐂", "date": "2023-05-01T11:03:00", "group": "2023-05", "html": "<div class=\"body\"><p>Alo galera!<\/p>\n<p>Foi uma semana maravilhosa!<\/p>\n<p>Fizemos um desafio de MPL (lição com participação de membros) e, por sorte, não perdemos, então não tivemos que comer a comida ruim que era o “prêmio” dos perdedores.<\/p>\n<p>(Hambúrgueres de atum + outros temperos horríveis e outras coisas)<\/p>\n<p>Tivemos muitas lições incríveis com nossos amigos esta semana, em parte porque membros foram conosco e o Espírito estava muito forte. Em uma lição, estávamos com dificuldade de ajudar um amigo a entender a importância do batismo e do dom do Espírito Santo, mas aí me veio uma lembrança e uma ideia.<\/p>\n<p>Eu me lembro de como meu batismo foi especial, dos dons especiais que recebi e de algumas coisas que foram ensinadas. Uma delas era sobre um cobertor/toalha e o Espírito.<\/p>\n<p>Então consegui ter uma conversa parecida com nosso amigo Jesus (10 anos) e depois fazer a experiência de envolvê-lo com o Espírito, ou seja, o cobertor. Foi incrível.<\/p>\n<p>Não deixe o Espírito no banco de reservas!<\/p>\n<p>Também tivemos ótimas visitas a membros, o que nos permitiu nos conectar melhor com eles, a ponto de quererem nos receber ainda mais jaja. Não temos tempo suficiente para isso e para todas as nossas outras responsabilidades missionárias, mas é uma ótima mudança. Fizemos uma divisão com os élderes de crioulo. Eu fiquei com o Élder Randolph tentando falar crioulo. Consegui fazer algumas coisas, mas é muito difícil ouvir e entender o suficiente, e é por isso que ele me impressionou muito, porque ele só tem 7 meses de missão. Foi um ótimo tempo juntos.<\/p>\n<p>Infelizmente não marcamos nenhuma data de batismo esta semana, mas devemos marcar na próxima. Sabemos que isso está no futuro deles, e logo, mas sentimos a inspiração de esperar. Então vocês também vão ter que esperar até a semana que vem!<\/p>\n<p>Essa foi mais ou menos a nossa semana. Temos feito mais lições por telefone para falar com mais pessoas, então tomara que a gente consiga aumentar nosso grupo de ensino, ou seja, o número de amigos/pessoas que ensinamos.<\/p>\n<p>Estou ouvindo a conferência de novo, e esta semana amei ouvir o Élder Meurs falar sobre como Cristo nos cura. Nunca estamos longe demais da Expiação e do Seu amor. Vão ler!<\/p>\n<p>Descobrimos na sexta à noite que o Élder Anderson vem nesta sexta e vamos ter uma reunião com a missão inteira com ele! Estou superanimado!<\/p>\n<p class=\"sign\">Los amo! Vejo-te mais tarde!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>hambúrgueres amaldiçoados<\/li>\n<li>cachorrinho<\/li>\n<li>limusine<\/li>\n<li>meu milk-shake estava supergrosso, parecia sorvete 🍨<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-05-01_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-01_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-01_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-01_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-01_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "Foco nas MPL 🐂 Alo galera! Foi uma semana maravilhosa! Fizemos um desafio de MPL (lição com participação de membros) e, por sorte, não perdemos, então não tivemos que comer a comida ruim que era o “prêmio” dos perdedores. (Hambúrgueres de atum + outros temperos horríveis e outras coisas) Tivemos muitas lições incríveis com nossos amigos esta semana, em parte porque membros foram conosco e o Espírito estava muito forte. Em uma lição, estávamos com dificuldade de ajudar um amigo a entender a importância do batismo e do dom do Espírito Santo, mas aí me veio uma lembrança e uma ideia. Eu me lembro de como meu batismo foi especial, dos dons especiais que recebi e de algumas coisas que foram ensinadas. Uma delas era sobre um cobertor/toalha e o Espírito. Então consegui ter uma conversa parecida com nosso amigo Jesus (10 anos) e depois fazer a experiência de envolvê-lo com o Espírito, ou seja, o cobertor. Foi incrível. Não deixe o Espírito no banco de reservas! Também tivemos ótimas visitas a membros, o que nos permitiu nos conectar melhor com eles, a ponto de quererem nos receber ainda mais jaja. Não temos tempo suficiente para isso e para todas as nossas outras responsabilidades missionárias, mas é uma ótima mudança. Fizemos uma divisão com os élderes de crioulo. Eu fiquei com o Élder Randolph tentando falar crioulo. Consegui fazer algumas coisas, mas é muito difícil ouvir e entender o suficiente, e é por isso que ele me impressionou muito, porque ele só tem 7 meses de missão. Foi um ótimo tempo juntos. Infelizmente não marcamos nenhuma data de batismo esta semana, mas devemos marcar na próxima. Sabemos que isso está no futuro deles, e logo, mas sentimos a inspiração de esperar. Então vocês também vão ter que esperar até a semana que vem! Essa foi mais ou menos a nossa semana. Temos feito mais lições por telefone para falar com mais pessoas, então tomara que a gente consiga aumentar nosso grupo de ensino, ou seja, o número de amigos/pessoas que ensinamos. Estou ouvindo a conferência de novo, e esta semana amei ouvir o Élder Meurs falar sobre como Cristo nos cura. Nunca estamos longe demais da Expiação e do Seu amor. Vão ler! Descobrimos na sexta à noite que o Élder Anderson vem nesta sexta e vamos ter uma reunião com a missão inteira com ele! Estou superanimado! Los amo! Vejo-te mais tarde! Élder Jacobo Fotos: hambúrgueres amaldiçoados cachorrinho limusine meu milk-shake estava supergrosso, parecia sorvete 🍨"}, {"id": "l98", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAI 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 México<\/span><span class=\"stamp c\" data-c=\"NI\">🇳🇮 Nicarágua<\/span><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><\/div>", "cultures": ["MX", "NI", "PE"], "moments": [], "extra": "Mexico Nicaragua Peru", "kind": "Carta 98 · Fort Myers", "title": "Ouvindo um Apóstolo do Senhor", "date": "2023-05-08T06:41:00", "group": "2023-05", "html": "<div class=\"body\"><p>Oi galerinha!<\/p>\n<p>Oye familia!<\/p>\n<p>Espero que vocês tenham tido uma boa semana, com muita coisa realizada ou só a semana de trabalho de sempre.<\/p>\n<p>Nossa semana foi bem boa, com certeza mais lenta por causa de grandes blocos de tempo dentro de casa ou fazendo outras coisas. Temos um monte de amigos em potencial, também conhecidos como pontinhos amarelos, também conhecidos como pessoas que talvez a gente ensine se elas realmente quiserem e tiverem tempo. Por isso, muito tempo dentro de casa ligando e mandando mensagem para essas pessoas.<\/p>\n<p>Também tive algumas consultas médicas e, na sexta, fomos a Tampa ouvir o Élder Anderson falar para a nossa missão. Foi incrível, mas significou que não fizemos nada na nossa área, por causa das 3 horas de estrada para ir e mais 3 para voltar. Fizemos um tour pela capela que foi top demais com nosso novo amigo Paulo. Ele é do Peru e está bem triste porque tem 2 filhos e acabou de ser o aniversário de 3 anos da filha dele. Orem por ele.<\/p>\n<p>Tivemos outra lição incrível com Debora &amp; Darwin. Eles estão progredindo muito na leitura, e o Darwin tem lembrado dos mandamentos e colocado em prática na hora. O Irmão Mata também participou, foi top demais. Várias lições por telefone; tomara que a gente consiga se encontrar pessoalmente.<\/p>\n<p>O Shaify é da Nicarágua e quer vir à igreja. Só estamos tentando resolver isso, já que ele mora em Lehigh (nossa igreja é em Fort Myers).<\/p>\n<p>Também ensinamos Elias &amp; Nascer de novo no sábado. Eles estão indo bem, mas estamos tentando fazer com que foquem na doutrina básica, porque às vezes as perguntas são muito profundas e fogem do tema da lição.<\/p>\n<p>Nosso recém-converso Alejandro fez jantar para nós uma noite, e foi muito bom comer e conversar com ele. Nos divertimos falando de videogames, música e histórias engraçadas.<\/p>\n<p>Uma última coisa antes de falar mais do Élder Anderson e do meu pensamento espiritual.<\/p>\n<p>Bênçãos<\/p>\n<p>Nestas últimas 2 semanas, tivemos a oportunidade de dar muitas bênçãos de saúde. Uma ontem, uma na quinta, uma 2 semanas atrás, numa segunda. E com mais possibilidades esta semana.<\/p>\n<p>Sou muito grato pela oportunidade de servir dessa forma, de ver pessoas mudarem e sentirem o Espírito, mas também de ter esse poder disponível. Não se esqueçam de que ele está.<\/p>\n<p>Nesta quinta fomos visitar uns não membros cuja família (membros no México) nos ligou e pediu para irmos. Foi muito especial vê-los com um brilho maior de esperança e depois sentir o Espírito testificar desse poder. Também me senti inspirado a dar uma bênção de consolo para a esposa. Que experiência linda.<\/p>\n<p>O Élder Anderson falou sobre algumas coisas, assim como a esposa dele e alguns presidentes de estaca que estavam lá; mas a maior lição que eu tirei, e que vocês também podem aplicar, é o poder das escrituras.<\/p>\n<p>Eles falaram muito sobre o poder que há nas escrituras, e não só em lê-las, mas em conhecê-las. Ter versículos escritos no coração, alguns só por saber onde estão e a ideia geral, e outros de memória. Assim, na tempestade da vida, não precisamos sair correndo atrás de uma escritura; já a conhecemos, ela faz parte de quem somos, e já estamos edificados sobre a nossa rocha, Jesus Cristo.<\/p>\n<p>Escolham uma escritura favorita e comecem a memorizar onde ela está e, se conseguirem, as palavras.<\/p>\n<p class=\"sign\">Los amo mucho! Que tenham uma super boa semana!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>empanadas<\/li>\n<li>viagem para Tampa/parada no caminho<\/li>\n<li>placa malfeita<\/li>\n<li>finalmente consegui ver os Nelson, da minha ala de casa, enquanto estava em Tampa<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-05-08_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-08_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-08_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "Ouvindo um Apóstolo do Senhor Oi galerinha! Oye familia! Espero que vocês tenham tido uma boa semana, com muita coisa realizada ou só a semana de trabalho de sempre. Nossa semana foi bem boa, com certeza mais lenta por causa de grandes blocos de tempo dentro de casa ou fazendo outras coisas. Temos um monte de amigos em potencial, também conhecidos como pontinhos amarelos, também conhecidos como pessoas que talvez a gente ensine se elas realmente quiserem e tiverem tempo. Por isso, muito tempo dentro de casa ligando e mandando mensagem para essas pessoas. Também tive algumas consultas médicas e, na sexta, fomos a Tampa ouvir o Élder Anderson falar para a nossa missão. Foi incrível, mas significou que não fizemos nada na nossa área, por causa das 3 horas de estrada para ir e mais 3 para voltar. Fizemos um tour pela capela que foi top demais com nosso novo amigo Paulo. Ele é do Peru e está bem triste porque tem 2 filhos e acabou de ser o aniversário de 3 anos da filha dele. Orem por ele. Tivemos outra lição incrível com Debora & Darwin. Eles estão progredindo muito na leitura, e o Darwin tem lembrado dos mandamentos e colocado em prática na hora. O Irmão Mata também participou, foi top demais. Várias lições por telefone; tomara que a gente consiga se encontrar pessoalmente. O Shaify é da Nicarágua e quer vir à igreja. Só estamos tentando resolver isso, já que ele mora em Lehigh (nossa igreja é em Fort Myers). Também ensinamos Elias & Nascer de novo no sábado. Eles estão indo bem, mas estamos tentando fazer com que foquem na doutrina básica, porque às vezes as perguntas são muito profundas e fogem do tema da lição. Nosso recém-converso Alejandro fez jantar para nós uma noite, e foi muito bom comer e conversar com ele. Nos divertimos falando de videogames, música e histórias engraçadas. Uma última coisa antes de falar mais do Élder Anderson e do meu pensamento espiritual. Bênçãos Nestas últimas 2 semanas, tivemos a oportunidade de dar muitas bênçãos de saúde. Uma ontem, uma na quinta, uma 2 semanas atrás, numa segunda. E com mais possibilidades esta semana. Sou muito grato pela oportunidade de servir dessa forma, de ver pessoas mudarem e sentirem o Espírito, mas também de ter esse poder disponível. Não se esqueçam de que ele está. Nesta quinta fomos visitar uns não membros cuja família (membros no México) nos ligou e pediu para irmos. Foi muito especial vê-los com um brilho maior de esperança e depois sentir o Espírito testificar desse poder. Também me senti inspirado a dar uma bênção de consolo para a esposa. Que experiência linda. O Élder Anderson falou sobre algumas coisas, assim como a esposa dele e alguns presidentes de estaca que estavam lá; mas a maior lição que eu tirei, e que vocês também podem aplicar, é o poder das escrituras. Eles falaram muito sobre o poder que há nas escrituras, e não só em lê-las, mas em conhecê-las. Ter versículos escritos no coração, alguns só por saber onde estão e a ideia geral, e outros de memória. Assim, na tempestade da vida, não precisamos sair correndo atrás de uma escritura; já a conhecemos, ela faz parte de quem somos, e já estamos edificados sobre a nossa rocha, Jesus Cristo. Escolham uma escritura favorita e comecem a memorizar onde ela está e, se conseguirem, as palavras. Los amo mucho! Que tenham uma super boa semana! Elder Jacobs Fotos: empanadas viagem para Tampa/parada no caminho placa malfeita finalmente consegui ver os Nelson, da minha ala de casa, enquanto estava em Tampa"}, {"id": "l99", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAI 2023<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 99 · Fort Myers", "title": "Um solo de gaita 👨‍🎤?! 🎶", "date": "2023-05-15T05:32:00", "group": "2023-05", "html": "<div class=\"body\"><p>Que onda chimichangas?<\/p>\n<p>Como foi a semana? Espero que todos vocês tenham curtido algo bom e, para todas as mães, um maravilhoso Dia das Mães. A ala comprou rosas, então o Élder Franson e eu pudemos entregá-las no domingo de manhã e ver todo mundo sorrir 😁 foi maravilhoso.<\/p>\n<p>Conseguimos ensinar o Paulo de novo, e ele é muito gente boa. Ainda está muito ocupado e preso no trabalho, que não deixa ele vir à igreja, mas está muito aberto a aprender e ficou animado por ganhar o próprio Livro de Mórmon.<\/p>\n<p>Fizemos cookies 🍪 para a nossa lista de alvos. Fizemos uma lista de pessoas (membros e amigos) para visitar, dar cookies e garantir que saibam que as amamos. E também para ver como estão. Foi divertido, mas ainda temos mais algumas famílias para visitar, então tem rodada 2 esta semana.<\/p>\n<p>Conhecemos um cachorrão chamado Stitch. Muito divertido.<\/p>\n<p>Cortamos a grama com uma membro para uma membro menos ativa, e depois ela veio à festa do Dia das Mães e à igreja! Muitas lições por telefone marcadas, mas poucas atendidas.<\/p>\n<p>Tivemos uma noite de futebol ⚽ na quinta e, mesmo não vindo tanta gente quanto esperávamos, curtimos muito e vimos rostos novos.<\/p>\n<p>Na sexta teve conferência de zona junto com a minha última entrevista. Foi uma ótima experiência. Também fizemos um coro só de homens com “Exército de Helamã”. A entrevista foi legal; gostei de poder conversar mais com o Presidente Gardiner e repassar muitas das coisas que aprendi ao longo da missão, por área e por companheiro.<\/p>\n<p>No sábado à noite tivemos uma festa do Dia das Mães. Nessa festa, o bispo também me pediu para tocar gaita na reunião sacramental, porque outro membro contou para ele que eu sabia. Foi estressante, mas deu certo; toquei “Damos Graças a Ti, Ó Deus, por um Profeta”. Eu estava tão preocupado em tocar na frente da ala que, quando chegamos em casa no sábado, comecei a praticar e senti que não estava dando certo. Fiz uma pausa, li um capítulo no meu Livro de Mórmon e tentei de novo. Consegui tocar perfeitamente, o que aumentou minha confiança e me deixou dormir bem. Eu sei que, se confiarmos em Deus e O colocarmos em primeiro lugar, Ele sempre vai nos ajudar. E agora, ó meu filho Helamã, eis que estás em tua juventude e, portanto, suplico-te que ouças minhas palavras e aprendas de mim; pois sei que todo aquele que depositar sua confiança em Deus será amparado em suas provações e em suas dificuldades e em suas aflições, e será elevado no último dia.<\/p>\n<p>Alma 36:3<\/p>\n<p>https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/36?id=p3&amp;lang=eng#p3<\/p>\n<p class=\"sign\">Los amo! Vocês só vão receber mais 1 carta semanal,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>P.S. amigos missionários: aqui está, kaj.jacobs@gmail.com, me adicionem nas suas cartas semanais e vamos manter contato!<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>stitch<\/li>\n<li>O Élder Jenson e eu com o Heihei (pegamos ele juntos na minha segunda transferência)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-05-15_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-15_0_1.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_414.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_415.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_416.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_417.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_418.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_419.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_420.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_421.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Um solo de gaita 👨‍🎤?! 🎶 Que onda chimichangas? Como foi a semana? Espero que todos vocês tenham curtido algo bom e, para todas as mães, um maravilhoso Dia das Mães. A ala comprou rosas, então o Élder Franson e eu pudemos entregá-las no domingo de manhã e ver todo mundo sorrir 😁 foi maravilhoso. Conseguimos ensinar o Paulo de novo, e ele é muito gente boa. Ainda está muito ocupado e preso no trabalho, que não deixa ele vir à igreja, mas está muito aberto a aprender e ficou animado por ganhar o próprio Livro de Mórmon. Fizemos cookies 🍪 para a nossa lista de alvos. Fizemos uma lista de pessoas (membros e amigos) para visitar, dar cookies e garantir que saibam que as amamos. E também para ver como estão. Foi divertido, mas ainda temos mais algumas famílias para visitar, então tem rodada 2 esta semana. Conhecemos um cachorrão chamado Stitch. Muito divertido. Cortamos a grama com uma membro para uma membro menos ativa, e depois ela veio à festa do Dia das Mães e à igreja! Muitas lições por telefone marcadas, mas poucas atendidas. Tivemos uma noite de futebol ⚽ na quinta e, mesmo não vindo tanta gente quanto esperávamos, curtimos muito e vimos rostos novos. Na sexta teve conferência de zona junto com a minha última entrevista. Foi uma ótima experiência. Também fizemos um coro só de homens com “Exército de Helamã”. A entrevista foi legal; gostei de poder conversar mais com o Presidente Gardiner e repassar muitas das coisas que aprendi ao longo da missão, por área e por companheiro. No sábado à noite tivemos uma festa do Dia das Mães. Nessa festa, o bispo também me pediu para tocar gaita na reunião sacramental, porque outro membro contou para ele que eu sabia. Foi estressante, mas deu certo; toquei “Damos Graças a Ti, Ó Deus, por um Profeta”. Eu estava tão preocupado em tocar na frente da ala que, quando chegamos em casa no sábado, comecei a praticar e senti que não estava dando certo. Fiz uma pausa, li um capítulo no meu Livro de Mórmon e tentei de novo. Consegui tocar perfeitamente, o que aumentou minha confiança e me deixou dormir bem. Eu sei que, se confiarmos em Deus e O colocarmos em primeiro lugar, Ele sempre vai nos ajudar. E agora, ó meu filho Helamã, eis que estás em tua juventude e, portanto, suplico-te que ouças minhas palavras e aprendas de mim; pois sei que todo aquele que depositar sua confiança em Deus será amparado em suas provações e em suas dificuldades e em suas aflições, e será elevado no último dia. Alma 36:3 https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/36?id=p3&lang=eng#p3 Los amo! Vocês só vão receber mais 1 carta semanal, Elder Jacobs P.S. amigos missionários: aqui está, kaj.jacobs@gmail.com, me adicionem nas suas cartas semanais e vamos manter contato! Fotos: stitch O Élder Jenson e eu com o Heihei (pegamos ele juntos na minha segunda transferência) Mais desta semana"}, {"id": "l100", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAI 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["PE", "BR", "HT"], "moments": ["Baptism", "Temple"], "extra": "Peru Brazil Haiti", "kind": "Carta 100 · Fort Myers", "title": "El fin *não é clickbait* 🪤", "date": "2023-05-22T05:54:00", "group": "2023-05", "html": "<div class=\"body\"><p>Oí bom dia galera!<\/p>\n<p>Lhes amo muito, não se esqueçam disso!<\/p>\n<p>Não é clickbait, este é o último e-mail porque vou para casa no sábado. Foram 2 anos incríveis e sou muito grato por tudo que aprendi e pelas pessoas que conheci. Aqui está meu e-mail de novo para quem estiver servindo; eu adoraria receber suas cartas semanais ou mensagens aleatórias no Messenger.<\/p>\n<p>kaj.jacobs@gmail.com<\/p>\n<p>Vamos ao que aconteceu esta semana!<\/p>\n<p>Começamos assando e cozinhando com o José. Aprendi a fazer os famosos cookies da empresa dele no Brasil: Cookbel<\/p>\n<p>A Sister Gardiner pediu para participar do nosso conselho de distrito e foi incrível. Curtimos praticar o ensino com membros junto com ela, ouvir as ideias dela e sentir o amor dela por nós e pelas nossas áreas.<\/p>\n<p>Saímos para comer no The Patio, um restaurante peruano superbacana. Comemos lá uma das comidas mais absurdas de boas da vida. E sobrou um monte também!<\/p>\n<p>Na quarta fiquei com o Élder Bartschi numa divisão. Curtimos a tarde superquente fazendo busca praticamente o dia todo. Encontramos vários haitianos para a área dele e alguns latinos também. Ficamos muito cansados; o sol basicamente suga suas forças quando está tão quente.<\/p>\n<p>Tivemos uma lição incrível com o Paulo, e depois ele foi com a gente e com a nossa ala para a noite de futebol ⚽ e amou. Estou melhorando, mas ainda sou &quot;manquito&quot;, ou seja, sem braço, ou seja, o amigo do time que é engraçado mas superruim. Tivemos outra série de lições incríveis na sexta à noite com os Aguirre, Juan e Moises. Estamos animados para ver o progresso deles esta semana e marcar uma data de batismo com o Jesus, filho dos Aguirre.<\/p>\n<p>Todas as nossas lições cancelaram no sábado, depois tivemos problema com o carro, mas no fim foi um bom dia. Encontramos uma senhora escolhida que está animada para se encontrar de novo, a Yani. Também fomos à feira na hora do almoço como distrito. Olhem o poncho que comprei! O domingo foi cheio de despedidas; até pude prestar meu testemunho, já que era o meu último. Estou aqui há 6 meses e parece uma eternidade, e eu amei tudo. Então curti isso, e ao longo da semana estivemos entregando cookies para as pessoas, ajudando-as a sentir nosso amor e gratidão, mas também para nos despedir.<\/p>\n<p>Ainda tenho mais alguns dias; estou animado para ir ao templo com nossos recém-conversos para fazer batismos (em português), mas quero que vocês se lembrem de que eu amei a minha missão, servir aos outros, aprender e trabalhar duro. Eu sei que Deus vive e que Seu Filho, Jesus Cristo, tem o braço estendido para nos salvar quando nossa fé vacila, como aconteceu com Pedro. O Evangelho é uma mensagem de alegria e abençoa nossas famílias tanto quanto abençoa cada pessoa. Que a alegria de vocês seja plena em Cristo, como a minha é. 1 E aconteceu que, enquanto Alma viajava da terra de Gideão para o sul, em direção à terra de Mânti, eis que, para seu espanto, encontrou os filhos de Mosias viajando em direção à terra de Zaraenla. 2 Ora, esses filhos de Mosias estavam com Alma na ocasião em que o anjo lhe apareceu pela primeira vez; portanto, Alma alegrou-se muitíssimo por ver seus irmãos; e o que aumentou ainda mais sua alegria foi que eles ainda eram seus irmãos no Senhor; sim, e haviam-se fortalecido no conhecimento da verdade; pois eram homens de bom entendimento e haviam examinado diligentemente as escrituras para conhecerem a palavra de Deus.<\/p>\n<p>3 Mas isso não é tudo; eles se haviam entregado a muita oração e jejum; portanto, tinham o espírito de profecia e o espírito de revelação; e quando ensinavam, ensinavam com poder e autoridade de Deus.<\/p>\n<p>Alma 17:1-3<\/p>\n<p>Lhes amo muito, beijos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>El Pátio<\/li>\n<li>poncho<\/li>\n<li>cozinhando com o Jose<\/li>\n<li>aventuras das ligações<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>E no dia 11 de junho, às 9h, horário do Arizona, é o meu discurso de volta para casa<\/p><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-05-22_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-22_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-05-22_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-05-22_0_8.jpg\" alt=\"\"><\/figure><\/div>", "text": "El fin *não é clickbait* 🪤 Oí bom dia galera! Lhes amo muito, não se esqueçam disso! Não é clickbait, este é o último e-mail porque vou para casa no sábado. Foram 2 anos incríveis e sou muito grato por tudo que aprendi e pelas pessoas que conheci. Aqui está meu e-mail de novo para quem estiver servindo; eu adoraria receber suas cartas semanais ou mensagens aleatórias no Messenger. kaj.jacobs@gmail.com Vamos ao que aconteceu esta semana! Começamos assando e cozinhando com o José. Aprendi a fazer os famosos cookies da empresa dele no Brasil: Cookbel A Sister Gardiner pediu para participar do nosso conselho de distrito e foi incrível. Curtimos praticar o ensino com membros junto com ela, ouvir as ideias dela e sentir o amor dela por nós e pelas nossas áreas. Saímos para comer no The Patio, um restaurante peruano superbacana. Comemos lá uma das comidas mais absurdas de boas da vida. E sobrou um monte também! Na quarta fiquei com o Élder Bartschi numa divisão. Curtimos a tarde superquente fazendo busca praticamente o dia todo. Encontramos vários haitianos para a área dele e alguns latinos também. Ficamos muito cansados; o sol basicamente suga suas forças quando está tão quente. Tivemos uma lição incrível com o Paulo, e depois ele foi com a gente e com a nossa ala para a noite de futebol ⚽ e amou. Estou melhorando, mas ainda sou \"manquito\", ou seja, sem braço, ou seja, o amigo do time que é engraçado mas superruim. Tivemos outra série de lições incríveis na sexta à noite com os Aguirre, Juan e Moises. Estamos animados para ver o progresso deles esta semana e marcar uma data de batismo com o Jesus, filho dos Aguirre. Todas as nossas lições cancelaram no sábado, depois tivemos problema com o carro, mas no fim foi um bom dia. Encontramos uma senhora escolhida que está animada para se encontrar de novo, a Yani. Também fomos à feira na hora do almoço como distrito. Olhem o poncho que comprei! O domingo foi cheio de despedidas; até pude prestar meu testemunho, já que era o meu último. Estou aqui há 6 meses e parece uma eternidade, e eu amei tudo. Então curti isso, e ao longo da semana estivemos entregando cookies para as pessoas, ajudando-as a sentir nosso amor e gratidão, mas também para nos despedir. Ainda tenho mais alguns dias; estou animado para ir ao templo com nossos recém-conversos para fazer batismos (em português), mas quero que vocês se lembrem de que eu amei a minha missão, servir aos outros, aprender e trabalhar duro. Eu sei que Deus vive e que Seu Filho, Jesus Cristo, tem o braço estendido para nos salvar quando nossa fé vacila, como aconteceu com Pedro. O Evangelho é uma mensagem de alegria e abençoa nossas famílias tanto quanto abençoa cada pessoa. Que a alegria de vocês seja plena em Cristo, como a minha é. 1 E aconteceu que, enquanto Alma viajava da terra de Gideão para o sul, em direção à terra de Mânti, eis que, para seu espanto, encontrou os filhos de Mosias viajando em direção à terra de Zaraenla. 2 Ora, esses filhos de Mosias estavam com Alma na ocasião em que o anjo lhe apareceu pela primeira vez; portanto, Alma alegrou-se muitíssimo por ver seus irmãos; e o que aumentou ainda mais sua alegria foi que eles ainda eram seus irmãos no Senhor; sim, e haviam-se fortalecido no conhecimento da verdade; pois eram homens de bom entendimento e haviam examinado diligentemente as escrituras para conhecerem a palavra de Deus. 3 Mas isso não é tudo; eles se haviam entregado a muita oração e jejum; portanto, tinham o espírito de profecia e o espírito de revelação; e quando ensinavam, ensinavam com poder e autoridade de Deus. Alma 17:1-3 Lhes amo muito, beijos! Elder Jacobs Fotos: El Pátio poncho cozinhando com o Jose aventuras das ligações E no dia 11 de junho, às 9h, horário do Arizona, é o meu discurso de volta para casa"}, {"id": "home", "kind": "De volta para casa", "title": "De volta em casa · Junho de 2023", "date": null, "group": "end", "html": "<div class=\"cover-r\"><img class=\"portrait\" src=\"images/cover.jpg\" alt=\"Elder Jacobs, June 2023\"><\/div>", "text": "De volta em casa · Junho de 2023 "}, {"id": "talk", "kind": "Discurso de retorno", "title": "Fortalecendo nosso relacionamento com Cristo", "date": "2023-06-11T09:00:00", "html": "<div class=\"talk\"><h3>Introdução<\/h3>\n<ul><li>Bom dia / me apresentar de novo (já faz basicamente 3 anos)<\/li><li>Onde<\/li><li>Propósito missionário<\/li><li>Uma piada engraçada: “por fa vor” vs “por favor”<\/li><\/ul>\n<h3>Algumas coisas que aprendi<\/h3>\n<ul><li>Outras culturas<\/li><li>Água sanitária com roupa colorida: nem pensar<\/li><li>Umidade<\/li><li>Alegria verdadeira e duradoura<\/li><li>Quem sou eu (devocional do Presidente Nelson)<ul><li>Um filho de Deus<\/li><li>Um discípulo de Cristo<\/li><li>Um filho do convênio<\/li><\/ul><\/li><\/ul>\n<h3>O que significa relacionamento?<\/h3>\n<ul><li>Algo emocional, como namoro ou casamento<\/li><li>Comportamental<\/li><li>Uma conexão entre coisas parecidas<\/li><\/ul>\n<p>Queremos nos comportar bem com os outros, mas o que nos ajuda a fazer isso é estar conectados com Cristo. Ficar tão parecidos com Ele, tão semelhantes a Cristo, que nosso comportamento muda e os outros sentem a Ele por meio de nós.<\/p>\n<p>Vou explicar algumas coisas sobre como fortalecer nosso relacionamento com Cristo. Eu vivi essas coisas e cresci com elas.<\/p>\n<h3>Coisas que fiz para fortalecer meu relacionamento com Cristo e ajudar outros a fazer o mesmo<\/h3>\n<ol><li>Igreja, oração, leitura das escrituras (CPR)<ul><li>Igreja: o sacramento<ul><li>Benefícios como o Espírito, aprendizado, amigos (nossos amigos)<\/li><li>Cristo é o foco, por isso o sacramento<\/li><li>Mosias 14:4–5: “Certamente ele tomou sobre si as nossas dores e levou as nossas tristezas; contudo nós o reputamos aflito, ferido de Deus e oprimido. Mas ele foi ferido por causa de nossas transgressões, foi moído por causa de nossas iniquidades; o castigo que nos traz a paz estava sobre ele; e pelas suas pisaduras fomos sarados.”<\/li><\/ul><\/li><li>Oração: doce hora de oração<ul><li>Níveis de oração / o básico<\/li><li>“Oração secreta”: “Onde Encontrar a Paz?”, 3ª estrofe: “Ele responde em segredo, alcança meu anseio”<\/li><li>Minha experiência + amigos<\/li><\/ul><\/li><li>Estudar, não ler nem passar o olho<\/li><\/ul><\/li><li>Os primeiros princípios e ordenanças do Evangelho<ul><li>Fé: não é confiança nem fazer parte de uma religião, mas sim um desejo e uma ação por causa de uma percepção espiritual, e não de provas<\/li><li>Arrependimento: uma mudança completa e um voltar-se para Deus<ul><li>A Expiação é para todos: os que estão fora do Evangelho, os que estão aprendendo o Evangelho e, principalmente, nós mesmos<\/li><\/ul><\/li><li>Batismo: o primeiro convênio, a purificação ou lavagem<ul><li>Como ouro<\/li><\/ul><\/li><li>Dom do Espírito Santo: purificação e companheiro<ul><li>Uma das maiores promessas que podemos ter<\/li><li>Níveis de entendimento: saber tudo, ou saber pouco mas ter o desejo (Jesus)<\/li><\/ul><\/li><li>Perseverar até o fim: permanecer ou perseverar<ul><li>“A palavra permanecer denota continuar fixo ou estável e perseverar sem ceder. O Élder Jeffrey R. Holland explicou que ‘permanecer’, como ação, significa ‘[ficar] — mas [ficar] para sempre’. Esse é o chamado da mensagem do evangelho a … todos … no mundo.” (Élder Bednar, abril de 2023)<\/li><li>Os Franco &amp; os Batista: com medo, mas desejando as bênçãos eternas como família<\/li><\/ul><\/li><\/ul><\/li><li>Buscar experiências espirituais<ul><li>Tempo especial com Deus<ul><li>Oração<\/li><li>Situações em particular e em grupo<\/li><\/ul><\/li><li>Confirmações espirituais constantes<ul><li>Buscar o que edifica e ilumina, em vez de ficar remoendo dúvidas com outras pessoas que duvidam<\/li><li>Ajoelhando com o Julian<\/li><\/ul><\/li><li>Serviço<ul><li>Cristo sempre serviu<\/li><li>A limpeza depois do furacão, as bênçãos e o armazém do bispo<\/li><\/ul><\/li><\/ul><\/li><\/ol>\n<blockquote class=\"hymn\">Quando Cristo vier, com brados de aclamação,<br>E me levar ao lar, que alegria no coração!<br>Então me prostrarei em humilde adoração<br>E proclamarei: meu Deus, quão grande és Tu!<\/blockquote>\n<h3>Testemunho<\/h3>\n<ul><li>Cristo<\/li><li>Escrituras<\/li><li>Oração<\/li><li>Dom de línguas<\/li><li>Amigos e família<\/li><li>Música<\/li><li>Abraços espirituais e puxões em direção à luz<ul><li>Todos nós podemos ter isso<\/li><\/ul><\/li><li>A luz espiritual e as nossas formas de revelação<ul><li>Orei pedindo visões/sonhos<\/li><li>Eu tenho meus dons espirituais, meu relacionamento com Deus, e Ele confia em mim tanto quanto em qualquer outra pessoa<\/li><li>AMOR<\/li><\/ul><\/li><\/ul><\/div>", "group": "end", "text": "Fortalecendo nosso relacionamento com Cristo Introdução Bom dia / me apresentar de novo (já faz basicamente 3 anos) Onde Propósito missionário Uma piada engraçada: “por fa vor” vs “por favor” Algumas coisas que aprendi Outras culturas Água sanitária com roupa colorida: nem pensar Umidade Alegria verdadeira e duradoura Quem sou eu (devocional do Presidente Nelson) Um filho de Deus Um discípulo de Cristo Um filho do convênio O que significa relacionamento? Algo emocional, como namoro ou casamento Comportamental Uma conexão entre coisas parecidas Queremos nos comportar bem com os outros, mas o que nos ajuda a fazer isso é estar conectados com Cristo. Ficar tão parecidos com Ele, tão semelhantes a Cristo, que nosso comportamento muda e os outros sentem a Ele por meio de nós. Vou explicar algumas coisas sobre como fortalecer nosso relacionamento com Cristo. Eu vivi essas coisas e cresci com elas. Coisas que fiz para fortalecer meu relacionamento com Cristo e ajudar outros a fazer o mesmo Igreja, oração, leitura das escrituras (CPR) Igreja: o sacramento Benefícios como o Espírito, aprendizado, amigos (nossos amigos) Cristo é o foco, por isso o sacramento Mosias 14:4–5: “Certamente ele tomou sobre si as nossas dores e levou as nossas tristezas; contudo nós o reputamos aflito, ferido de Deus e oprimido. Mas ele foi ferido por causa de nossas transgressões, foi moído por causa de nossas iniquidades; o castigo que nos traz a paz estava sobre ele; e pelas suas pisaduras fomos sarados.” Oração: doce hora de oração Níveis de oração / o básico “Oração secreta”: “Onde Encontrar a Paz?”, 3ª estrofe: “Ele responde em segredo, alcança meu anseio” Minha experiência + amigos Estudar, não ler nem passar o olho Os primeiros princípios e ordenanças do Evangelho Fé: não é confiança nem fazer parte de uma religião, mas sim um desejo e uma ação por causa de uma percepção espiritual, e não de provas Arrependimento: uma mudança completa e um voltar-se para Deus A Expiação é para todos: os que estão fora do Evangelho, os que estão aprendendo o Evangelho e, principalmente, nós mesmos Batismo: o primeiro convênio, a purificação ou lavagem Como ouro Dom do Espírito Santo: purificação e companheiro Uma das maiores promessas que podemos ter Níveis de entendimento: saber tudo, ou saber pouco mas ter o desejo (Jesus) Perseverar até o fim: permanecer ou perseverar “A palavra permanecer denota continuar fixo ou estável e perseverar sem ceder. O Élder Jeffrey R. Holland explicou que ‘permanecer’, como ação, significa ‘[ficar] — mas [ficar] para sempre’. Esse é o chamado da mensagem do evangelho a … todos … no mundo.” (Élder Bednar, abril de 2023) Os Franco & os Batista: com medo, mas desejando as bênçãos eternas como família Buscar experiências espirituais Tempo especial com Deus Oração Situações em particular e em grupo Confirmações espirituais constantes Buscar o que edifica e ilumina, em vez de ficar remoendo dúvidas com outras pessoas que duvidam Ajoelhando com o Julian Serviço Cristo sempre serviu A limpeza depois do furacão, as bênçãos e o armazém do bispo Quando Cristo vier, com brados de aclamação, E me levar ao lar, que alegria no coração! Então me prostrarei em humilde adoração E proclamarei: meu Deus, quão grande és Tu! Testemunho Cristo Escrituras Oração Dom de línguas Amigos e família Música Abraços espirituais e puxões em direção à luz Todos nós podemos ter isso A luz espiritual e as nossas formas de revelação Orei pedindo visões/sonhos Eu tenho meus dons espirituais, meu relacionamento com Deus, e Ele confia em mim tanto quanto em qualquer outra pessoa AMOR"}, {"id": "culture", "kind": "Notas", "title": "Coisas de cultura", "date": "2023-01-09T06:00:00", "html": "<div class=\"culture\"><div class=\"recipe\"><h3>Agua de horchata<\/h3><ul><li>1/2 xícara de harina de arroz<\/li><li>2 xícaras de leite comum<\/li><li>1 leite condensado<\/li><li>1 colher de chá de baunilha<\/li><li>1 colher de chá de canela<\/li><li>1/4 xícara de açúcar<\/li><\/ul><p>Acrescente água a gosto<\/p><p>Misture tudo e acrescente gelo<\/p><\/div><div class=\"countries\"><div class=\"country\"><h3>🇲🇽 México<\/h3><p><b>Capital:<\/b> Distrito Federal (&quot;DF&quot;)<\/p><p><b>Espresiones famosa:<\/b> Ándale! Apoco! No me digas! Órale! Híjoles!<\/p><p class=\"lbl\">Estados<\/p><ul><li>Hidalgo<\/li><\/ul><p><b>A. Dialecto:<\/b> Otomi<\/p><ul><li>&quot;quehatsi&quot; como esta?<\/li><li>&quot;isqudaí&quot; buenas tardes!<\/li><li>Puebla (Poblanos)<\/li><\/ul><p><b>A. Comida Tipica:<\/b> Mole<\/p><ul><li>Oaxaca<\/li><\/ul><p><b>A. Comida famosa:<\/b> &quot;Tlayudas&quot; (tortillas que son grandes como un sope)<\/p><ul><li>Veracruz<\/li><\/ul><p>A. Los &quot;Jarochos&quot; o &quot;Costeños (personas viven cerca dela costa)&quot;<\/p><ul><li>Michóacan (los Tarascos)<\/li><\/ul><p><b>Ciudad:<\/b> Parangaricutirimicuaro<\/p><p><b>Dialecto:<\/b> Tarasco<\/p><\/div><div class=\"country\"><h3>🇨🇴 Colômbia<\/h3><p><b>Capital:<\/b> Bogotá (los Rolos)<\/p><ul><li>&quot;eterna primavera&quot;<\/li><\/ul><p><b>Expresiones:<\/b> chevere! (Legal/incrível) Bacano! (Bom/incrível) parcero (amigo) que mi ave (mucho gusto, ou talvez nem seja uma expressão de verdade, não tenho certeza)<\/p><p>Medellin- &quot;Paisa&quot;<\/p><p>Caliroso - Estiloso<\/p><p class=\"lbl\">Comida Tipica<\/p><ul><li>arrepas<\/li><li>chocolate con quezo<\/li><li>pan de bono (hay que probarlo!)<\/li><\/ul><\/div><div class=\"country\"><h3>🇻🇪 Venezuela<\/h3><p><b>Capital:<\/b> Caracas<\/p><p><b>Expresiones:<\/b> chévere!<\/p><ul><li>Juego: pelota de goma (Personas de Maracaibo)<\/li><\/ul><p class=\"lbl\">Comidas Tipicas<\/p><ul><li>Arrepas (no se compare con Colombia)<\/li><li>&quot;Caraotas&quot; -feijão<\/li><li>&quot;wasacaca&quot; -basicamente um molho ranch<\/li><li>hallacas -tamales venezuelanos da época de Natal<\/li><\/ul><p class=\"lbl\">Musica<\/p><ul><li>&quot;otra noche de ilusión&quot;<\/li><li>La gainta: una tipa de cancion de la navidad<\/li><\/ul><\/div><div class=\"country\"><h3>🇭🇳 Honduras<\/h3><p><b>Capital:<\/b> Tegucigalpa<\/p><ul><li>los Catrachos<\/li><\/ul><p><b>Expresiones:<\/b> más hizo! Medo gallo (cara descolado)<\/p><\/div><div class=\"country\"><h3> El Salvador<\/h3><p><b>Capital:<\/b> San Salvador<\/p><p><b>Comida Tipica:<\/b> Pupusas<\/p><\/div><div class=\"country\"><h3>🇨🇱 Chile<\/h3><p><b>Expressiones:<\/b> bacán (legal!) ; buena po!<\/p><p><b>Capital:<\/b> Santiago<\/p><p class=\"lbl\">Cominda Tipica<\/p><ul><li>completos- sanchicha<\/li><li>Pastel de Choclo (torta de milho com carne)<\/li><li>Empanadas<\/li><li>Calzones Rotos- una fritura<\/li><\/ul><\/div><div class=\"country\"><h3>🇳🇮 Nicarágua<\/h3><p><b>Capital:<\/b> Managua<\/p><p>&quot;Los Nicas&quot;<\/p><p class=\"lbl\">Comida Tipica<\/p><ul><li>Tostadas<\/li><li>Tamales<\/li><li>tortillas de Maíz<\/li><li>gallo pinto<\/li><\/ul><p><b>Expressões:<\/b> maje (amigo) al puro cien (💯 por cento)<\/p><\/div><div class=\"country\"><h3>🇪🇨 Equador<\/h3><p><b>Capital:<\/b> Quito<\/p><p class=\"lbl\">Comidas famosas/ típica<\/p><ul><li>La guatita (la panza de vaca)<\/li><li>Cuy (porquinho-da-índia) con las papas cocinadas<\/li><li>siempre tienen papas<\/li><li>muchísimas sopas<\/li><\/ul><p class=\"lbl\">Dialetos<\/p><ul><li>Kichwa<\/li><\/ul><p>Me voy a camello &quot;Vou trabalhar&quot;<\/p><p>Chuchaqui &quot;Ressaca - substantivo&quot;<\/p><p>Chumalo &quot;Pessoa bêbada&quot;<\/p><p>Ese man<\/p><\/div><div class=\"country\"><h3>🇬🇹 Guatemala<\/h3><ul><li>&quot;Chapin&quot; un Guatemalteco<\/li><li>habla dialectos como &quot;Mam&quot;<\/li><\/ul><p><b>Comida Tipica:<\/b> Chuscutas con Taccines (tortilla com feijão)<\/p><\/div><div class=\"country\"><h3>🇵🇪 Peru<\/h3><p><b>Capital:<\/b> Lima~Machu Pichu<\/p><p><b>Dialecto:<\/b> Quechua (Alileichu?~Como estas?)<\/p><p class=\"lbl\">Ciudades<\/p><p>Arrequipa (las montañas)<\/p><p>Iquitos( la sierra)<\/p><p class=\"lbl\">Comida Tipica<\/p><p>Ají de Gallina( HAY QUE PROBAR!!!)<\/p><p>Cerviché(cuidado; é peixe cru, mas é gostoso!)<\/p><p>Patatas (tienen 200+ variedades de Patatas; mas de Idaho!!)<\/p><p>Inca Cola- su soda famosa (hay que probar!)<\/p><\/div><div class=\"country\"><h3>🇦🇷 Argentina<\/h3><p><b>Capital:<\/b> Buenos Aires<\/p><p><b>Juego Famoso:<\/b> Fútbol<\/p><p class=\"lbl\">Comida Famosa<\/p><ul><li>bistec<\/li><li>empanadas<\/li><li>mate- su bebida famosa<\/li><li>milanesa<\/li><li>facherito (estiloso, ótimo, incrível)<\/li><\/ul><p><b>Frases:<\/b> che (oye! Che! Ei, melhor amigo - bem informal)<\/p><\/div><div class=\"country\"><h3>🇨🇷 Costa Rica<\/h3><p>Los &quot;Ticos&quot;<\/p><p><b>Expresiones:<\/b> &quot;Pura vida&quot; (bom)<\/p><p class=\"lbl\">Cominda tipica<\/p><p>Gallo pinto<\/p><\/div><div class=\"country\"><h3>🇨🇺 Cuba<\/h3><p><b>Capital:<\/b> Havana<\/p><p><b>Comida tipica:<\/b> ropa vieja, tostones, bacalao(bacalhau), cuban sándwich, arroz y frijoles negros<\/p><ul><li>Las Tunas una ciudad hermosa<\/li><\/ul><p><b>Expresiones:<\/b> como esta la cosa? Que bolá? Mi accede (amigo)<\/p><\/div><div class=\"country\"><h3>🇵🇷 Puerto Rico<\/h3><p><b>Capital:<\/b> San Juan<\/p><ul><li>Los Boricuas (les gusta tener este apodo)<\/li><\/ul><p class=\"lbl\">Ciudades<\/p><p class=\"lbl\">Comida tipica<\/p><ul><li>MOFONGO<\/li><li>arroz con abichuela (feijão)<\/li><li>arroz con grandules( grão-de-bico)<\/li><li>tostones; platano frito<\/li><li>Pinchos (churrasco)<\/li><\/ul><p><b>Expresiones:<\/b> ay bendito!<\/p><\/div><div class=\"country\"><h3>🇩🇴 Republica Dominicana<\/h3><p><b>Capital:<\/b> Santo Domingo<\/p><p><b>Expresiones:<\/b> ay! mi madre! Que lo que? De lo mío (parça) pana (amigo/a)<\/p><p class=\"lbl\">Comida tipica<\/p><ul><li>Mangu<\/li><li>Plantano Verde<\/li><\/ul><\/div><div class=\"country\"><h3>🇧🇷 Brasil<\/h3><p><b>Capital:<\/b> Brasilla<\/p><p><b>Idioma:<\/b> Portugués (bien parecido de Español)<\/p><p><b>Música:<\/b> cavaquinho (instrumento de 4 cordas)<\/p><p><b>Expresiones:<\/b> Tudo bém? Legal! (Legal) Uai! Trem (não sei bem como usar)<\/p><p>&quot;Sotaki&quot;- sotaques: eles têm 3 sotaques diferentes, dependendo de onde são.<\/p><p class=\"lbl\">Ciudades<\/p><ul><li>Belém- habla con &quot;sh&quot; (a Belém do Brasil)<\/li><li>Florinopolis- &quot;Floripa&quot;- cerca de la playa<\/li><li>São Pao- hay enfasis en sus &quot;r&quot;<\/li><li>Fortaleza- hay playas buenas<\/li><li>Rio de Janeiro- Estátua do Cristo<\/li><\/ul><p class=\"lbl\">Comida Tipica<\/p><ul><li>Arroz Blanco<\/li><li>Farrofa- pó de carne branca que melhora muito o sabor! (hay que probarlo)<\/li><li>Coxhiña- os bolinhos deles- se servirem isso para você, sinta-se honrado, porque es bien dificil para hacer<\/li><li>Fricase- frango com batatas (muito bom!<\/li><li>Feijão Preto (feijão-preto com carne bem macia)<\/li><li>Tipo Feijoada- linguiças<\/li><li>Peixe con coco- Peixe com leite de coco<\/li><li>Bolo- bolo (eles amam fazer bolos)<\/li><li>Pão de Quiejo- Pão de queijo, VOCÊ PRECISA EXPERIMENTAR ISSO!!!<\/li><\/ul><\/div><\/div><\/div>", "group": "end", "text": "Coisas de cultura Agua de horchata 1/2 xícara de harina de arroz 2 xícaras de leite comum 1 leite condensado 1 colher de chá de baunilha 1 colher de chá de canela 1/4 xícara de açúcar Acrescente água a gosto Misture tudo e acrescente gelo 🇲🇽 México Capital: Distrito Federal (\"DF\") Espresiones famosa: Ándale! Apoco! No me digas! Órale! Híjoles! Estados Hidalgo A. Dialecto: Otomi \"quehatsi\" como esta? \"isqudaí\" buenas tardes! Puebla (Poblanos) A. Comida Tipica: Mole Oaxaca A. Comida famosa: \"Tlayudas\" (tortillas que son grandes como un sope) Veracruz A. Los \"Jarochos\" o \"Costeños (personas v
