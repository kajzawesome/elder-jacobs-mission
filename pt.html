gunda foi orar com fé no Senhor Jesus Cristo. A terceira foi obedecer com exatidão. A obediência pode significar agir rapidamente. Pode significar se preparar. Ou pode significar esperar com paciência por mais inspiração. E a quarta é orar para conhecer as necessidades e o coração das outras pessoas e como ajudá-las pelo Senhor. Joseph orou pelos santos aflitos quando estava na prisão. Tive a oportunidade de observar os profetas de Deus enquanto oram, pedem inspiração, recebem orientação e agem de acordo com ela. https://www.churchofjesuschrist.org/study/general-conference/2018/04/his-spirit-to-be-with-you?lang=eng Los amo! Elder Jacobs Fotos: Divisão com o Élder Sierra pato Hermana Isela fazendo a mágica dos tacos mais uma vez Ação de Graças do distrito Franklin & Raul vieram de Brandon visitar a gente! hallaca (prato típico de Natal da Venezuela) doce muito bom (tem que provar!) batismo (os Franco & eu conseguimos ver o Nicolas)"}, {"id": "l77", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">DEZ 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": [], "moments": ["Holidays"], "extra": "", "kind": "Carta 77 · Largo", "title": "O fim de Largo...", "date": "2022-12-05T12:11:00", "group": "2022-12", "html": "<div class=\"body\"><p>Hola! Como están amigos y familiares?<\/p>\n<p>Pois é, isso mesmo, cheguei ao fim do meu tempo em Largo. As transferências chegaram e eu vou pra Fort Myers. Estou animado porque tem muito trabalho lá, principalmente em português. O Élder Lutu vai ficar.<\/p>\n<p>Essa semana foi boa, mas infelizmente não aconteceu muita coisa com os amigos. Tivemos que parar de ensinar muitos deles por causa da correria e, sinceramente, falta de interesse. A melhor coisa foram 5 amigos na igreja, já que uma membro levou todos os netos não batizados dela. Vamos ver se dá pra ensinar eles logo!!<\/p>\n<p>O devocional de Natal foi top demais! E também Luz de las naciones, assistam os dois o quanto antes! Música, mensagens e Espírito incríveis.<\/p>\n<p>Fizemos um monte de visitas a membros, ganhamos mais confiança e indicações. Também fizemos uma divisão top com o Élder Condie. Foi divertido estar com ele e aprender tanto.<\/p>\n<p>Desculpem o e-mail curto, não aconteceu muita coisa e estou ocupado fazendo as malas. Me contem como VOCÊS estão que eu tento responder<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>águia-de-cabeça-branca<\/li>\n<li>Jantar com o Élder Owen!<\/li>\n<li>um vaso indígena do Arizona<\/li>\n<li>🐙<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-12-05_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-05_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-05_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-05_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "O fim de Largo... Hola! Como están amigos y familiares? Pois é, isso mesmo, cheguei ao fim do meu tempo em Largo. As transferências chegaram e eu vou pra Fort Myers. Estou animado porque tem muito trabalho lá, principalmente em português. O Élder Lutu vai ficar. Essa semana foi boa, mas infelizmente não aconteceu muita coisa com os amigos. Tivemos que parar de ensinar muitos deles por causa da correria e, sinceramente, falta de interesse. A melhor coisa foram 5 amigos na igreja, já que uma membro levou todos os netos não batizados dela. Vamos ver se dá pra ensinar eles logo!! O devocional de Natal foi top demais! E também Luz de las naciones, assistam os dois o quanto antes! Música, mensagens e Espírito incríveis. Fizemos um monte de visitas a membros, ganhamos mais confiança e indicações. Também fizemos uma divisão top com o Élder Condie. Foi divertido estar com ele e aprender tanto. Desculpem o e-mail curto, não aconteceu muita coisa e estou ocupado fazendo as malas. Me contem como VOCÊS estão que eu tento responder Los amo! Élder Jacobo Fotos: águia-de-cabeça-branca Jantar com o Élder Owen! um vaso indígena do Arizona 🐙"}, {"id": "l78", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">DEZ 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": ["VE", "BR"], "moments": ["Holidays"], "extra": "Venezuela Brazil", "kind": "Carta 78 · Fort Myers", "title": "🇧🇷😎 Brazileros por todos lados! 🇧🇷", "date": "2022-12-12T15:03:00", "group": "2022-12", "html": "<div class=\"body\"><p>Boa tarde amigos, espero que estejam bem e tiveram uma boa semana. A minha foi muito bem!<\/p>\n<p>Estou amando minha área nova e todas as coisas divertidas que estamos fazendo. O Élder O'Neill e eu estamos indo muito bem também, muitas risadas e trabalho bom. Inclusive de bicicleta, o que é meio novidade, já que tive a sorte de não pedalar muito antes. Infelizmente alguém roubou minhas luzes e o banco da bicicleta, então espero que aproveitem e levem uma bronca do Espírito por roubar. Essa provavelmente foi a vez que conheci os membros mais rápido. Tivemos refeições com membros, lições, igreja e outras reuniões, e é muito incrível o quanto eles querem ajudar a gente.<\/p>\n<p>Temos uns amigos legais: Melissa, Pablo, Julio, doina, yamila, Omar e muitos outros que estou tentando conhecer. Nossa aula de inglês é muito daora e tem brasileiros lá! Eles me ensinaram umas palavras que usam muito, mas é gíria e eles não conseguiram explicar direito, então ainda estou tentando entender.<\/p>\n<p>Mas tem brasileiro em todo lugar! Tipo, literalmente em todo lugar perto de onde moramos, o que rendeu muitas interações legais e fortaleceu minha capacidade de falar. Até encontramos uma família nova (e outras possíveis também!): Sandro, Hector, Victor e a esposa dele, que ainda não conhecemos. E consegui praticar mais com a família Omar, que se mudou pra ala há um mês e com quem jantamos no domingo à noite.<\/p>\n<p>Esse fim de semana é nossa festa de Natal e quinta é a conferência de zona de Natal, então muitas coisas legais essa semana, mas isso também significa uma viagem de carro enorme. Isso é algo que aprendi sobre a zona de Fort Myers: viagens longas, milhas insuficientes, todo mundo anda de bicicleta.<\/p>\n<p>Mas estou amando meu tempo aqui e está indo muito bem.<\/p>\n<p>Aqui vai uma escritura legal que li essa semana nos meus estudos<\/p>\n<p class=\"sign\">Los amo muito,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>armazém do bispo<\/li>\n<li>🐝<\/li>\n<li>ganhei V8 do Messia (novo amigo brasileiro)<\/li>\n<li>Madi, a cachorra dos nossos vizinhos, veio visitar enquanto fazíamos nossos contatos da manhã<\/li>\n<li>Katy (moon pies venezuelanos, muuuito melhores)<\/li>\n<li>crianças da Primária atacadas com adesivos numa atividade 😳 😆<\/li>\n<li>jantar com a família Omar<\/li>\n<\/ul>\n<hr class=\"ps\">\n<p>Alma 26:<\/p>\n<p>11 Mas Amon disse-lhe: Não me glorio em minha própria força nem em minha própria sabedoria; mas eis que minha alegria é completa, sim, meu coração transborda de alegria e regozijar-me-ei em meu Deus.<\/p>\n<p>12 Sim, eu sei que nada sou; quanto à minha força, sou fraco; portanto, não me gloriarei de mim mesmo, mas gloriar-me-ei em meu Deus, porque com sua força posso fazer todas as coisas; sim, eis que muitos grandes milagres temos feito nesta terra, pelos quais louvaremos seu nome para sempre.<\/p><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-12-12_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-12_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-12_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-12_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-12_0_8.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_406.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "🇧🇷😎 Brazileros por todos lados! 🇧🇷 Boa tarde amigos, espero que estejam bem e tiveram uma boa semana. A minha foi muito bem! Estou amando minha área nova e todas as coisas divertidas que estamos fazendo. O Élder O'Neill e eu estamos indo muito bem também, muitas risadas e trabalho bom. Inclusive de bicicleta, o que é meio novidade, já que tive a sorte de não pedalar muito antes. Infelizmente alguém roubou minhas luzes e o banco da bicicleta, então espero que aproveitem e levem uma bronca do Espírito por roubar. Essa provavelmente foi a vez que conheci os membros mais rápido. Tivemos refeições com membros, lições, igreja e outras reuniões, e é muito incrível o quanto eles querem ajudar a gente. Temos uns amigos legais: Melissa, Pablo, Julio, doina, yamila, Omar e muitos outros que estou tentando conhecer. Nossa aula de inglês é muito daora e tem brasileiros lá! Eles me ensinaram umas palavras que usam muito, mas é gíria e eles não conseguiram explicar direito, então ainda estou tentando entender. Mas tem brasileiro em todo lugar! Tipo, literalmente em todo lugar perto de onde moramos, o que rendeu muitas interações legais e fortaleceu minha capacidade de falar. Até encontramos uma família nova (e outras possíveis também!): Sandro, Hector, Victor e a esposa dele, que ainda não conhecemos. E consegui praticar mais com a família Omar, que se mudou pra ala há um mês e com quem jantamos no domingo à noite. Esse fim de semana é nossa festa de Natal e quinta é a conferência de zona de Natal, então muitas coisas legais essa semana, mas isso também significa uma viagem de carro enorme. Isso é algo que aprendi sobre a zona de Fort Myers: viagens longas, milhas insuficientes, todo mundo anda de bicicleta. Mas estou amando meu tempo aqui e está indo muito bem. Aqui vai uma escritura legal que li essa semana nos meus estudos Los amo muito, Elder Jacobs Fotos: armazém do bispo 🐝 ganhei V8 do Messia (novo amigo brasileiro) Madi, a cachorra dos nossos vizinhos, veio visitar enquanto fazíamos nossos contatos da manhã Katy (moon pies venezuelanos, muuuito melhores) crianças da Primária atacadas com adesivos numa atividade 😳 😆 jantar com a família Omar Alma 26: 11 Mas Amon disse-lhe: Não me glorio em minha própria força nem em minha própria sabedoria; mas eis que minha alegria é completa, sim, meu coração transborda de alegria e regozijar-me-ei em meu Deus. 12 Sim, eu sei que nada sou; quanto à minha força, sou fraco; portanto, não me gloriarei de mim mesmo, mas gloriar-me-ei em meu Deus, porque com sua força posso fazer todas as coisas; sim, eis que muitos grandes milagres temos feito nesta terra, pelos quais louvaremos seu nome para sempre. Mais desta semana"}, {"id": "l79", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">DEZ 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Holidays"], "extra": "", "kind": "Carta 79 · Fort Myers", "title": "🎄🎅Feliz Natal! & cantando músicas de Natal 🎶🎵", "date": "2022-12-26T08:52:00", "group": "2022-12", "html": "<div class=\"body\"><p>Feliz Natal!<\/p>\n<p>Espero que todos vocês tenham conseguido aproveitar doces, músicas e tempo com a família e os amigos. Eu consegui e foi ótimo. Com o Natal essa semana e as comemorações dos latinos começando no dia 24, o trabalho estava indo bem e depois parou quase completamente.<\/p>\n<p>Tivemos um monte de lições em português na terça, o que foi incrível, mas também me deixou muito humilde, porque em alguns momentos eu conseguia ensinar fácil, mas outros foram mais difíceis dependendo do Sotaqui (sotaque) deles e dos princípios ensinados. Também conseguimos conversar com algumas pessoas novas que recebemos como indicações e estamos animados pra ver o que vai acontecer com elas no futuro. 🤞batismo em breve, esperamos!<\/p>\n<p>Curtimos cantar músicas de Natal de porta em porta este ano. No ano passado ficamos em casa fazendo outras coisas, falando com a família ou com membros, mas este ano sentimos a alegria de cantar. Nos reunimos como missionários e distritos várias vezes pra cantar e foi incrível poder falar com tanta gente, cada um na sua língua, e também sentir o Espírito testificar das músicas e da mensagem delas. Vimos muitas pessoas se sentirem mais amadas e rodeadas de amigos quando visitamos elas.<\/p>\n<p>D&amp;C 25<\/p>\n<p>12 Porque minha alma se deleita no canto do coração; sim, o canto dos justos é uma oração para mim e será respondido com uma bênção sobre sua cabeça.<\/p>\n<p>13 Portanto, eleva teu coração e regozija-te e apega-te aos convênios que fizeste.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>gravatas de lhama!<\/li>\n<li>biscoitos<\/li>\n<li>cantando músicas de Natal com os outros élderes de espanhol<\/li>\n<li>chegou nos 40 °F esse fim de semana!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-12-26_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-26_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-26_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-12-26_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-12-26_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "🎄🎅Feliz Natal! & cantando músicas de Natal 🎶🎵 Feliz Natal! Espero que todos vocês tenham conseguido aproveitar doces, músicas e tempo com a família e os amigos. Eu consegui e foi ótimo. Com o Natal essa semana e as comemorações dos latinos começando no dia 24, o trabalho estava indo bem e depois parou quase completamente. Tivemos um monte de lições em português na terça, o que foi incrível, mas também me deixou muito humilde, porque em alguns momentos eu conseguia ensinar fácil, mas outros foram mais difíceis dependendo do Sotaqui (sotaque) deles e dos princípios ensinados. Também conseguimos conversar com algumas pessoas novas que recebemos como indicações e estamos animados pra ver o que vai acontecer com elas no futuro. 🤞batismo em breve, esperamos! Curtimos cantar músicas de Natal de porta em porta este ano. No ano passado ficamos em casa fazendo outras coisas, falando com a família ou com membros, mas este ano sentimos a alegria de cantar. Nos reunimos como missionários e distritos várias vezes pra cantar e foi incrível poder falar com tanta gente, cada um na sua língua, e também sentir o Espírito testificar das músicas e da mensagem delas. Vimos muitas pessoas se sentirem mais amadas e rodeadas de amigos quando visitamos elas. D&C 25 12 Porque minha alma se deleita no canto do coração; sim, o canto dos justos é uma oração para mim e será respondido com uma bênção sobre sua cabeça. 13 Portanto, eleva teu coração e regozija-te e apega-te aos convênios que fizeste. Los amo! Elder Jacobs Fotos: gravatas de lhama! biscoitos cantando músicas de Natal com os outros élderes de espanhol chegou nos 40 °F esse fim de semana!"}, {"id": "l80", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">JAN 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"CU\">🇨🇺 Cuba<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><\/div>", "cultures": ["CU", "BR"], "moments": [], "extra": "Cuba Brazil", "kind": "Carta 80 · Fort Myers", "title": "🎊🎉Feliz ano novo 🤯 2️⃣0️⃣2️⃣3️⃣", "date": "2023-01-02T09:50:00", "group": "2023-01", "html": "<div class=\"body\"><p>Feliz ano novo! Espero que vocês tenham curtido umas comidas e tal ou alguma coisa. A gente foi dormir normal e ouviu uns fogos.<\/p>\n<p>Essa semana me fez dar muito valor ao meu corpo e ao nosso carro. Com carro dividido, uma área enorme e muita gente pra visitar/ensinar, ficamos quase sem milhas na semana passada, só dirigindo na quarta. Então dizer que estou cansado é pouco, mas curti arrumar minha bicicleta e sair pedalando. Nem todo dia é tão bom por causa do clima ou da quantidade enorme de milhas pra pedalar, mas com certeza vale a pena. Também tivemos mais contato com as pessoas desse jeito e até alguns milagres.<\/p>\n<p>Encontramos uma membro andando com os filhos; no começo passamos direto, mas aí o Élder O'Neill disse que devíamos voltar, que era meio o que eu também estava pensando. Ela viu a gente, nos reconheceu e tinha orado pra que a gente voltasse. Foi legal poder ouvir ela e ver como podemos apoiá-la. Ela veio à igreja e foi acolhida pelos membros 😁 Essa semana me ensinou muito sobre o arbítrio e o plano de Deus. Marcamos muitas lições, enchendo nossa semana quase na hora, sem quase nenhum espaço livre já na terça à tarde, o que foi incrível. Mas, como vimos ao longo da semana, logo muitas delas foram canceladas ou remarcadas, deixando horários vazios em cima da hora e a gente indo buscar, passando na casa das pessoas e revisando nossa lista de possíveis pessoas pra ensinar. Foi muito frustrante, mas também sei o quanto isso nos ensinou, e as coisas que conseguimos fazer no lugar foram melhores.<\/p>\n<p>2 Néfi 27:23<\/p>\n<p>Pois eis que eu sou Deus; e sou um Deus de milagres; e mostrarei ao mundo que sou o mesmo ontem, hoje e para sempre; e não opero entre os filhos dos homens, a não ser de acordo com sua fé.<\/p>\n<p>Quanto ao resto da semana:<\/p>\n<ul class=\"bul\">\n<li>terminei 2 Néfi em português<\/li>\n<li>ano novo<\/li>\n<li>divisão com o Élder Cook (nos divertimos muito pedalando e seguindo o Espírito pra saber quem visitar)<\/li>\n<li>andar de bicicleta pela cidade sem as mãos é a nova moda<\/li>\n<li>igreja às 11 agora 🙏<\/li>\n<li>fiz um pernil de porco épico (arroz cubano, feijão preto e pimentões) 😋<\/li>\n<li>Consegui ter umas conversas bem legais e mais complexas em português! Falamos sobre gramática inglesa e por que quem fala português consegue pronunciar inglês melhor do que quem fala espanhol<\/li>\n<\/ul>\n<p>Como eu já disse, as lições canceladas deixaram a semana mais devagar, além dos feriados, mas está tudo bem. Lembrem que Deus ama vocês!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>divisão com o Élder Cook(ie)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-02_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-02_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "🎊🎉Feliz ano novo 🤯 2️⃣0️⃣2️⃣3️⃣ Feliz ano novo! Espero que vocês tenham curtido umas comidas e tal ou alguma coisa. A gente foi dormir normal e ouviu uns fogos. Essa semana me fez dar muito valor ao meu corpo e ao nosso carro. Com carro dividido, uma área enorme e muita gente pra visitar/ensinar, ficamos quase sem milhas na semana passada, só dirigindo na quarta. Então dizer que estou cansado é pouco, mas curti arrumar minha bicicleta e sair pedalando. Nem todo dia é tão bom por causa do clima ou da quantidade enorme de milhas pra pedalar, mas com certeza vale a pena. Também tivemos mais contato com as pessoas desse jeito e até alguns milagres. Encontramos uma membro andando com os filhos; no começo passamos direto, mas aí o Élder O'Neill disse que devíamos voltar, que era meio o que eu também estava pensando. Ela viu a gente, nos reconheceu e tinha orado pra que a gente voltasse. Foi legal poder ouvir ela e ver como podemos apoiá-la. Ela veio à igreja e foi acolhida pelos membros 😁 Essa semana me ensinou muito sobre o arbítrio e o plano de Deus. Marcamos muitas lições, enchendo nossa semana quase na hora, sem quase nenhum espaço livre já na terça à tarde, o que foi incrível. Mas, como vimos ao longo da semana, logo muitas delas foram canceladas ou remarcadas, deixando horários vazios em cima da hora e a gente indo buscar, passando na casa das pessoas e revisando nossa lista de possíveis pessoas pra ensinar. Foi muito frustrante, mas também sei o quanto isso nos ensinou, e as coisas que conseguimos fazer no lugar foram melhores. 2 Néfi 27:23 Pois eis que eu sou Deus; e sou um Deus de milagres; e mostrarei ao mundo que sou o mesmo ontem, hoje e para sempre; e não opero entre os filhos dos homens, a não ser de acordo com sua fé. Quanto ao resto da semana: terminei 2 Néfi em português ano novo divisão com o Élder Cook (nos divertimos muito pedalando e seguindo o Espírito pra saber quem visitar) andar de bicicleta pela cidade sem as mãos é a nova moda igreja às 11 agora 🙏 fiz um pernil de porco épico (arroz cubano, feijão preto e pimentões) 😋 Consegui ter umas conversas bem legais e mais complexas em português! Falamos sobre gramática inglesa e por que quem fala português consegue pronunciar inglês melhor do que quem fala espanhol Como eu já disse, as lições canceladas deixaram a semana mais devagar, além dos feriados, mas está tudo bem. Lembrem que Deus ama vocês! Los amo, Elder Jacobs Fotos: divisão com o Élder Cook(ie)"}, {"id": "l81", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">JAN 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Carta 81 · Fort Myers", "title": "🇧🇷 Hora brasileira e divisões 🔄", "date": "2023-01-09T12:33:00", "group": "2023-01", "html": "<div class=\"body\"><p>Oi! Beleza?<\/p>\n<p>Tudo lindo?<\/p>\n<p>Nossa semana foi linda, curtimos um clima ótimo e ainda um pouco de calor à tarde, mas isso é normal aqui. Nossa semana começou super bem, com uma segunda à noite muito guiada pelo Espírito, que levou a umas lições incríveis e a uma nova família brasileira pra ensinar.<\/p>\n<p>Aí aconteceu a divisão dupla maluca.<\/p>\n<p>Pois é, fiquei fora da minha área por 48 horas (mais ou menos), mas o Élder O'Neill mandou muito bem! Ele ensinou um monte de lições em espanhol e até algumas em português sozinho!<\/p>\n<p>Enquanto isso eu estava de boa ensinando em inglês com o Élder Anderson e depois em espanhol com o Élder Nielson no dia seguinte. Foram boas divisões, mas foi super estranho quando voltei pra área e pro Élder O'Neill.<\/p>\n<p>O resto da semana foi bem tranquilo; tínhamos algumas lições marcadas e algumas caíram, o que infelizmente virou o novo normal.<\/p>\n<p>Encontramos mais 2 famílias brasileiras<\/p>\n<p>Com certeza ainda é difícil às vezes falar português, seja em certas situações de ensino ou em conversa fiada, mas com certeza está melhorando, e dá pra ver, porque as pessoas estão mais abertas com a gente e o Espírito está testificando muito forte. Também tivemos entrevistas com o Presidente, que foram incríveis. Vamos ver o que acontece nas transferências, ele tem umas ideias de mudanças 👀<\/p>\n<p>Enfim, aqui vai o pensamento dessa semana:<\/p>\n<p>&quot;...como você não sabe a resposta para essa pergunta?” Ele simplesmente deu de ombros, sorriu e disse com confiança: “Jesus.”<\/p>\n<p>A Resposta É Jesus<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2022/10/52olsen?lang=eng<\/p>\n<p>Eu sei que Cristo é a resposta, mesmo quando nos sentimos impotentes e sem esperança. Ele está sempre com a gente e sempre nos ama, não importa as circunstâncias, os pecados ou o que a gente possa pensar.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Élder Nielson (diversão na divisão)<\/li>\n<li>traduzindo go brrr<\/li>\n<li>cantando músicas de Natal um tempo atrás<\/li>\n<li>vista incrível!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-01-09_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-09_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-09_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-09_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-09_0_4.jpg\" alt=\"\"><\/figure><\/div>", "text": "🇧🇷 Hora brasileira e divisões 🔄 Oi! Beleza? Tudo lindo? Nossa semana foi linda, curtimos um clima ótimo e ainda um pouco de calor à tarde, mas isso é normal aqui. Nossa semana começou super bem, com uma segunda à noite muito guiada pelo Espírito, que levou a umas lições incríveis e a uma nova família brasileira pra ensinar. Aí aconteceu a divisão dupla maluca. Pois é, fiquei fora da minha área por 48 horas (mais ou menos), mas o Élder O'Neill mandou muito bem! Ele ensinou um monte de lições em espanhol e até algumas em português sozinho! Enquanto isso eu estava de boa ensinando em inglês com o Élder Anderson e depois em espanhol com o Élder Nielson no dia seguinte. Foram boas divisões, mas foi super estranho quando voltei pra área e pro Élder O'Neill. O resto da semana foi bem tranquilo; tínhamos algumas lições marcadas e algumas caíram, o que infelizmente virou o novo normal. Encontramos mais 2 famílias brasileiras Com certeza ainda é difícil às vezes falar português, seja em certas situações de ensino ou em conversa fiada, mas com certeza está melhorando, e dá pra ver, porque as pessoas estão mais abertas com a gente e o Espírito está testificando muito forte. Também tivemos entrevistas com o Presidente, que foram incríveis. Vamos ver o que acontece nas transferências, ele tem umas ideias de mudanças 👀 Enfim, aqui vai o pensamento dessa semana: \"...como você não sabe a resposta para essa pergunta?” Ele simplesmente deu de ombros, sorriu e disse com confiança: “Jesus.” A Resposta É Jesus https://www.churchofjesuschrist.org/study/general-conference/2022/10/52olsen?lang=eng Eu sei que Cristo é a resposta, mesmo quando nos sentimos impotentes e sem esperança. Ele está sempre com a gente e sempre nos ama, não importa as circunstâncias, os pecados ou o que a gente possa pensar. Los amo! Élder Jacobo Fotos: Élder Nielson (diversão na divisão) traduzindo go brrr cantando músicas de Natal um tempo atrás vista incrível!"}, {"id": "l82", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">JAN 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><\/div>", "cultures": ["PE"], "moments": [], "extra": "Peru", "kind": "Carta 82 · Fort Myers", "title": "Crescimento novo 🌱 mas o fim de mais uma transferência🤳", "date": "2023-01-16T17:46:00", "group": "2023-01", "html": "<div class=\"body\"><p>Oi! Deus lhe abençoe!<\/p>\n<p>Ei! Deus abençoe!<\/p>\n<p>Foi mais uma semana só amando a vida missionária, principalmente aqui em Rio Vista. Tivemos mais divisões essa semana, mas separadas, então não foi tão estressante. E estivemos bem ocupados, como sempre. Espero que semana que vem fique mais tranquilo e a gente consiga administrar tudo melhor.<\/p>\n<p>Nossa semana começou com uma lição com a Doina, uma pessoa que encontramos no começo da transferência, mas com quem não conseguíamos entrar em contato. Passamos lá e ela tem lido e contado pros outros que tem uma igreja (no caso, a nossa) e que gosta dela, mesmo a gente só tendo feito uma visita um tempão atrás. Muito empolgante!<\/p>\n<p>Depois uma lição com um recém-converso e a esposa dele, o que é empolgante, já que ela parece muito animada e ansiosa pra ler mais do Livro de Mórmon (app). Disponível pra vocês no celular!<\/p>\n<p>Tivemos aula de inglês na quarta depois de uma semana de pausa e apareceu muita gente, e depois tivemos a nossa primeira em Fort Myers! Mais um sucesso, e deve continuar crescendo!<\/p>\n<p>No sábado fomos muito abençoados 🙌 😇 🙏 e almoçamos e jantamos com membros. O almoço foi uma refeição super incrível com nossos amigos Miguel, Lourdes, Wilson e Zarela e os filhos deles, junto com a família Rodriguez da ala. Comemos pollada &amp; huacaina, dois pratos muito típicos e gostosos do Peru 🇵🇪. Vejam as fotos do molho &quot;huacaina&quot; e da sobremesa &quot;combinado&quot;<\/p>\n<p>A gente estava com fome demais e começou a comer antes de sequer pensar em tirar uma foto do prato principal haha. A quantidade de lembranças divertidas sobre o Peru, a cultura e as piadas foi super divertida e me fez sentir em casa.<\/p>\n<p>O jantar também foi bom, mas sem nenhuma história de verdade.<\/p>\n<p>Domingo foi um W enorme (W = dub = vitória), porque tivemos nossa primeira aula da Escola Dominical em português 🇧🇷 progresso com certeza, e nossos amigos ficaram muito gratos por essa adaptação e por poderem aprender muito mais.<\/p>\n<p>Sem pensamento espiritual porque o tempo acabou, então vão ler Alma 5, é super épico!<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<ul class=\"bul\">\n<li>vaca<\/li>\n<li>Pão de Quiejo (pão de queijo)<\/li>\n<li>facas<\/li>\n<li>almoço que eu fiz 😋<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-16_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-16_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-16_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-16_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Crescimento novo 🌱 mas o fim de mais uma transferência🤳 Oi! Deus lhe abençoe! Ei! Deus abençoe! Foi mais uma semana só amando a vida missionária, principalmente aqui em Rio Vista. Tivemos mais divisões essa semana, mas separadas, então não foi tão estressante. E estivemos bem ocupados, como sempre. Espero que semana que vem fique mais tranquilo e a gente consiga administrar tudo melhor. Nossa semana começou com uma lição com a Doina, uma pessoa que encontramos no começo da transferência, mas com quem não conseguíamos entrar em contato. Passamos lá e ela tem lido e contado pros outros que tem uma igreja (no caso, a nossa) e que gosta dela, mesmo a gente só tendo feito uma visita um tempão atrás. Muito empolgante! Depois uma lição com um recém-converso e a esposa dele, o que é empolgante, já que ela parece muito animada e ansiosa pra ler mais do Livro de Mórmon (app). Disponível pra vocês no celular! Tivemos aula de inglês na quarta depois de uma semana de pausa e apareceu muita gente, e depois tivemos a nossa primeira em Fort Myers! Mais um sucesso, e deve continuar crescendo! No sábado fomos muito abençoados 🙌 😇 🙏 e almoçamos e jantamos com membros. O almoço foi uma refeição super incrível com nossos amigos Miguel, Lourdes, Wilson e Zarela e os filhos deles, junto com a família Rodriguez da ala. Comemos pollada & huacaina, dois pratos muito típicos e gostosos do Peru 🇵🇪. Vejam as fotos do molho \"huacaina\" e da sobremesa \"combinado\" A gente estava com fome demais e começou a comer antes de sequer pensar em tirar uma foto do prato principal haha. A quantidade de lembranças divertidas sobre o Peru, a cultura e as piadas foi super divertida e me fez sentir em casa. O jantar também foi bom, mas sem nenhuma história de verdade. Domingo foi um W enorme (W = dub = vitória), porque tivemos nossa primeira aula da Escola Dominical em português 🇧🇷 progresso com certeza, e nossos amigos ficaram muito gratos por essa adaptação e por poderem aprender muito mais. Sem pensamento espiritual porque o tempo acabou, então vão ler Alma 5, é super épico! Los amo! Elder Jacobs vaca Pão de Quiejo (pão de queijo) facas almoço que eu fiz 😋"}, {"id": "l83", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">JAN 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><\/div>", "cultures": ["PE", "BR", "HT"], "moments": [], "extra": "Peru Brazil Haiti", "kind": "Carta 83 · Fort Myers", "title": "Pneu 💥, novato 👼, & faxina 🧼🪣", "date": "2023-01-23T11:00:00", "group": "2023-01", "html": "<div class=\"body\"><p>Ôpa! Como foi a sua semana?<\/p>\n<p>A nossa foi bem boa, mas com certeza doida, corrida e diferente das semanas de transferência anteriores.<\/p>\n<p>A primeira metade da semana foi com o Élder O'Neill e foi bem divertida.<\/p>\n<p>Descobrimos que ele vai pra Peace River e que eu ia ficar com o Élder Towne de novo, mas também treinando. Enquanto estava com o Élder O'Neill, tivemos umas refeições com membros bem boas (mais comida peruana épica), meu pneu estourou completamente quando estávamos a 30 minutos de casa, e comemos uns dos tacos mais brabos de todos.<\/p>\n<p>Quinta foram as transferências, o que é sempre uma correria, mas além disso a gente ia buscar o Élder Wahlberg. Ele é de Bear Lake, Utah, e tem um fogo enorme pra um novato, é incrível.<\/p>\n<p>A primeira lição dele não foi em espanhol... é... eu sei, meio que é a língua designada minha e dele, mas a primeira lição dele foi em português, e foi ótima.<\/p>\n<p>Também estivemos fazendo faxina, como diz o título. Trocamos de apartamento com os Élderes de crioulo pra ter mais espaço pra todo mundo. Mas tinha 2 problemas enormes. 1. Mudar todas as nossas coisas 2. A quantidade absurda de porcaria/tralha/bagunça/sujeira/encardido, chame como quiser. Aquele apartamento não estava limpo e não estava fazia muito tempo.<\/p>\n<p>Agora finalmente está, depois de manhã, tarde e noite limpando, organizando e 9 sacos de lixo.<\/p>\n<p>Enfim, aproveitem as fotos divertidas.<\/p>\n<p>Vencer o Mundo e Encontrar Descanso<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2022/10/47nelson?lang=eng<\/p>\n<p>Esse discurso é super incrível. Aprendemos sobre a importância das pequenas coisas e dos convênios pra vencer as provações e dificuldades do mundo.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>papa loca<\/li>\n<li>Comida panamenha<\/li>\n<li>bicicletas com pneu furado de novo e a missão de resgate<\/li>\n<li>passei pra ver a Genesis &amp; a Yolennis enquanto estava em Tampa pras transferências<\/li>\n<li>dia de bicicleta com o Élder O'Neill<\/li>\n<li>Comida peruana (aquela com ovo)<\/li>\n<li>ovelha da loja de bicicleta<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-23_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-23_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-23_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-23_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-23_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-23_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-23_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "Pneu 💥, novato 👼, & faxina 🧼🪣 Ôpa! Como foi a sua semana? A nossa foi bem boa, mas com certeza doida, corrida e diferente das semanas de transferência anteriores. A primeira metade da semana foi com o Élder O'Neill e foi bem divertida. Descobrimos que ele vai pra Peace River e que eu ia ficar com o Élder Towne de novo, mas também treinando. Enquanto estava com o Élder O'Neill, tivemos umas refeições com membros bem boas (mais comida peruana épica), meu pneu estourou completamente quando estávamos a 30 minutos de casa, e comemos uns dos tacos mais brabos de todos. Quinta foram as transferências, o que é sempre uma correria, mas além disso a gente ia buscar o Élder Wahlberg. Ele é de Bear Lake, Utah, e tem um fogo enorme pra um novato, é incrível. A primeira lição dele não foi em espanhol... é... eu sei, meio que é a língua designada minha e dele, mas a primeira lição dele foi em português, e foi ótima. Também estivemos fazendo faxina, como diz o título. Trocamos de apartamento com os Élderes de crioulo pra ter mais espaço pra todo mundo. Mas tinha 2 problemas enormes. 1. Mudar todas as nossas coisas 2. A quantidade absurda de porcaria/tralha/bagunça/sujeira/encardido, chame como quiser. Aquele apartamento não estava limpo e não estava fazia muito tempo. Agora finalmente está, depois de manhã, tarde e noite limpando, organizando e 9 sacos de lixo. Enfim, aproveitem as fotos divertidas. Vencer o Mundo e Encontrar Descanso https://www.churchofjesuschrist.org/study/general-conference/2022/10/47nelson?lang=eng Esse discurso é super incrível. Aprendemos sobre a importância das pequenas coisas e dos convênios pra vencer as provações e dificuldades do mundo. Los amo! Elder Jacobs Fotos: papa loca Comida panamenha bicicletas com pneu furado de novo e a missão de resgate passei pra ver a Genesis & a Yolennis enquanto estava em Tampa pras transferências dia de bicicleta com o Élder O'Neill Comida peruana (aquela com ovo) ovelha da loja de bicicleta"}, {"id": "l84", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">JAN 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 84 · Fort Myers", "title": "Semana de busca 👊✊️👊", "date": "2023-01-30T14:53:00", "group": "2023-01", "html": "<div class=\"body\"><p>Buenas tardes!<\/p>\n<p>É, estou escrevendo isso meio tarde, mas fazer o quê.<\/p>\n<p>Essa semana foi outro nível, com certeza. Começou bem devagar e normal, com uma divisão. Foi super divertido com o Élder Gonzalez de novo, mas dessa vez na nossa área.<\/p>\n<p>Um tema comum essa semana foi lições sendo canceladas e depois encontrar pessoas novas pra ensinar, então bem incrível. Principalmente porque encontramos 13 amigos essa semana (a maioria famílias!) E nosso distrito encontrou 51!<\/p>\n<p>Também ganhamos um almoço de graça dos Líderes de Zona!<\/p>\n<p>Também tivemos o Treinamento Especializado, a reunião de treinamento para os treinadores e seus treinandos, e isso tomou o dia todo... acordamos às 4:30, saímos às 6 e só chegamos em casa às 21h. Muito tempo dirigindo/sentado, o que é muito difícil, ainda mais porque eu tenho dificuldade de ficar parado e me concentrar.<\/p>\n<p>Versão resumida do fim de semana:<\/p>\n<ul class=\"bul\">\n<li>encontramos um monte de gente (como eu já disse, mas brasileiros &amp; hispânicos)<\/li>\n<li>encontramos uma antiga indicação com quem não conseguíamos falar porque não tínhamos o endereço, mas aí batemos na porta dela!<\/li>\n<li>recebi elogios pelo meu português e pela minha capacidade de explicar as escrituras!<\/li>\n<li>muitas lições canceladas<\/li>\n<\/ul>\n<p>Muitas lições no primeiro contato = Espírito super forte<\/p>\n<ul class=\"bul\">\n<li>Fiz uma entrevista batismal (o Paul é brabo demais e foi batizado no domingo)<\/li>\n<li>Muita conversa sobre um grupo brasileiro 👀 ainda orando, porque por enquanto é só uma ideia<\/li>\n<\/ul>\n<p>Terminei Alma essa semana na minha leitura de O Livro de Mormon. Sejam justos, não morram na guerra, lembrem do que a mamãe de vocês ensinou!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p>Élder Jacó<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>hora da pizza<\/li>\n<li>armadura na varanda de alguém?<\/li>\n<li>xadrez gigante<\/li>\n<li>carne-seca de bisão (mole demais e textura ruim, mas o sabor é bom)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-01-30_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-01-30_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-30_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-01-30_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Semana de busca 👊✊️👊 Buenas tardes! É, estou escrevendo isso meio tarde, mas fazer o quê. Essa semana foi outro nível, com certeza. Começou bem devagar e normal, com uma divisão. Foi super divertido com o Élder Gonzalez de novo, mas dessa vez na nossa área. Um tema comum essa semana foi lições sendo canceladas e depois encontrar pessoas novas pra ensinar, então bem incrível. Principalmente porque encontramos 13 amigos essa semana (a maioria famílias!) E nosso distrito encontrou 51! Também ganhamos um almoço de graça dos Líderes de Zona! Também tivemos o Treinamento Especializado, a reunião de treinamento para os treinadores e seus treinandos, e isso tomou o dia todo... acordamos às 4:30, saímos às 6 e só chegamos em casa às 21h. Muito tempo dirigindo/sentado, o que é muito difícil, ainda mais porque eu tenho dificuldade de ficar parado e me concentrar. Versão resumida do fim de semana: encontramos um monte de gente (como eu já disse, mas brasileiros & hispânicos) encontramos uma antiga indicação com quem não conseguíamos falar porque não tínhamos o endereço, mas aí batemos na porta dela! recebi elogios pelo meu português e pela minha capacidade de explicar as escrituras! muitas lições canceladas Muitas lições no primeiro contato = Espírito super forte Fiz uma entrevista batismal (o Paul é brabo demais e foi batizado no domingo) Muita conversa sobre um grupo brasileiro 👀 ainda orando, porque por enquanto é só uma ideia Terminei Alma essa semana na minha leitura de O Livro de Mormon. Sejam justos, não morram na guerra, lembrem do que a mamãe de vocês ensinou! Los amo, Élder Jacó Fotos: hora da pizza armadura na varanda de alguém? xadrez gigante carne-seca de bisão (mole demais e textura ruim, mas o sabor é bom)"}, {"id": "l85", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEV 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Carta 85 · Fort Myers", "title": "Meus joelhos querem explodir! 😐💥", "date": "2023-02-06T10:40:00", "group": "2023-02", "html": "<div class=\"body\"><p>Buenos días amigos 🌅👋<\/p>\n<p>Tivemos uma semana bem ótima, considerando tudo. Com certeza tivemos alguns problemas, mas no fim deu tudo certo. Meus joelhos estão cansados de tanto pedalar com os ventos fortes que pegamos. Se você parasse de pedalar, praticamente parava (sinceramente, era melhor ter ido a pé, a gente estava indo tão devagar). Mas Deus é bom e recebemos muitas bênçãos, milagres e poder.<\/p>\n<p>Amei essa escritura essa semana: Mórmon 9:24<\/p>\n<p>E estes sinais seguirão os que crerem — em meu nome expulsarão demônios; falarão novas línguas; pegarão em serpentes; e se beberem alguma coisa mortífera, não lhes fará mal; imporão as mãos sobre os enfermos e eles sararão;<\/p>\n<p>Com certeza já vimos muitos milagres como esses na nossa vida; eu sei que vi na minha missão.<\/p>\n<p>Outras coisas que aconteceram:<\/p>\n<ul class=\"bul\">\n<li>Tivemos conferência de zona e foi super incrível<\/li>\n<li>lição super incrível com uma indicação; estamos animados pra ensinar o resto da família da próxima vez<\/li>\n<li>divisão épica com o Élder Rupp<\/li>\n<li>food truck de tacos, parte 2 😋<\/li>\n<\/ul>\n<p>Infelizmente tivemos muitas lições canceladas, o que foi triste, e pelo jeito nossos amigos não entendem que isso deixa a gente triste, porque continua acontecendo, mas aí a gente simplesmente vai encontrar novos amigos e ensinar eles, então continuamos bem ocupados.<\/p>\n<p>Também fomos à padaria brasileira, que foi super gostosa. Os docinhos deles, o brigadeiro, são basicamente açúcar puro 🥴 e densos demais, mas com certeza valem a pena.<\/p>\n<p>Espero que tenham uma boa semana com muitos milagrinhos!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>brigadeiros<\/li>\n<li>hora do DQ<\/li>\n<li>taqueria (tacos!)<\/li>\n<li>amigos brasileiros &amp; churrasco (pronunciado tipo shoe-hoss-coo)<\/li>\n<li>brazmarket<\/li>\n<li>imagem de escritura pra compartilhar que eu amo!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-02-06_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-06_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-06_0_7.jpg\" alt=\"\"><\/figure><\/div>", "text": "Meus joelhos querem explodir! 😐💥 Buenos días amigos 🌅👋 Tivemos uma semana bem ótima, considerando tudo. Com certeza tivemos alguns problemas, mas no fim deu tudo certo. Meus joelhos estão cansados de tanto pedalar com os ventos fortes que pegamos. Se você parasse de pedalar, praticamente parava (sinceramente, era melhor ter ido a pé, a gente estava indo tão devagar). Mas Deus é bom e recebemos muitas bênçãos, milagres e poder. Amei essa escritura essa semana: Mórmon 9:24 E estes sinais seguirão os que crerem — em meu nome expulsarão demônios; falarão novas línguas; pegarão em serpentes; e se beberem alguma coisa mortífera, não lhes fará mal; imporão as mãos sobre os enfermos e eles sararão; Com certeza já vimos muitos milagres como esses na nossa vida; eu sei que vi na minha missão. Outras coisas que aconteceram: Tivemos conferência de zona e foi super incrível lição super incrível com uma indicação; estamos animados pra ensinar o resto da família da próxima vez divisão épica com o Élder Rupp food truck de tacos, parte 2 😋 Infelizmente tivemos muitas lições canceladas, o que foi triste, e pelo jeito nossos amigos não entendem que isso deixa a gente triste, porque continua acontecendo, mas aí a gente simplesmente vai encontrar novos amigos e ensinar eles, então continuamos bem ocupados. Também fomos à padaria brasileira, que foi super gostosa. Os docinhos deles, o brigadeiro, são basicamente açúcar puro 🥴 e densos demais, mas com certeza valem a pena. Espero que tenham uma boa semana com muitos milagrinhos! Los amo, Elder Jacobs Fotos: brigadeiros hora do DQ taqueria (tacos!) amigos brasileiros & churrasco (pronunciado tipo shoe-hoss-coo) brazmarket imagem de escritura pra compartilhar que eu amo!"}, {"id": "l86", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEV 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 86 · Fort Myers", "title": "Me llamo poco poco 🥸", "date": "2023-02-13T07:05:00", "group": "2023-02", "html": "<div class=\"body\"><p>Olá pessoal! Tudo bem?<\/p>\n<p>Tivemos uma semana muito boa<\/p>\n<p>Curtimos umas coisas divertidas essa semana, além de pedalar como sempre, mas com um vento absurdo. Nada épico. Nota 0/10, não recomendo. O vento pode acabar com o seu dia, porque de repente você fica sem energia.<\/p>\n<p>Segunda à noite um monte dos nossos planos foi pro espaço porque os endereços estavam errados e as pessoas não estavam interessadas. Mas ouvimos que não era pra ir a baladas, que Deus nos ama, e mais tarde encontramos uma família nova pra ensinar. Então uhuu! Na terça usamos nosso almoço de distrito grátis dos líderes de zona indo à padaria (padaria brasileira) e cada um pedindo um X-tudo. De longe um dos melhores hambúrgueres que já comi! (Batata palha, bacon, ovo, presunto, pastrami e muçarela fresca, além das coisas normais de hambúrguer)<\/p>\n<p>Nosso amigo Juan está indo muito bem, com certeza vamos marcar uma data de batismo essa semana. Nossas lições têm sido muito espirituais, e nessa última ele orou com a gente sobre o Livro de Mórmon, já que ainda não tinha orado. Ele sabe que &quot;é verdade&quot;, como ele disse. 🥳<\/p>\n<p>Jantamos com os Newville essa semana, daí o título do e-mail. Ele não sabe quase nada de espanhol, então diz que o nome dele é pouco a pouco, ou poco poco, porque aprende uma palavra por ano haha.<\/p>\n<p>O domingo foi super incrível. Encontramos mais uma família, os Blandon, jantamos com os Cole e marcamos a data dos nossos amigos Ilene &amp; João.<\/p>\n<p>Fomos lá e ensinamos sobre Joseph Smith de novo, junto com alguns mandamentos. Saímos por causa do horário sem marcar a data, mas sentimos que devíamos ligar pra eles quando chegássemos em casa e tentar de novo. Ligamos, os dois atenderam no celular dele, e toparam na hora! Fiquem ligados!<\/p>\n<p>Orem por esses amigos, junto com estes aqui:<\/p>\n<ul class=\"bul\">\n<li>Damaris &amp; Elivam (eles estão lendo e são super incríveis, estamos animados pra marcar uma data logo)<\/li>\n<li>Marklane<\/li>\n<li>Eduardo Tuil<\/li>\n<li>John &amp; Nice<\/li>\n<li>Edmar &amp; Liz<\/li>\n<li>José Luis<\/li>\n<\/ul>\n<p>Terminei o Livro de Mórmon em português essa semana, e uma das maiores coisas que aprendi foi quantas vezes se fala de Cristo e quantas vezes Ele ou Deus tentam nos abençoar, guiar, ajudar e falar com a gente.<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>X-Tudo<\/li>\n<li>jantar com os Cole<\/li>\n<li>Harambo &amp; Élder Stevens<\/li>\n<li>lugar legal pra foto<\/li>\n<li>memes de Dia dos Namorados<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"thumb port\"><img src=\"images/2023-02-13_0_0.png\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-13_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_8.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-13_0_9.jpg\" alt=\"\"><\/figure><\/div>", "text": "Me llamo poco poco 🥸 Olá pessoal! Tudo bem? Tivemos uma semana muito boa Curtimos umas coisas divertidas essa semana, além de pedalar como sempre, mas com um vento absurdo. Nada épico. Nota 0/10, não recomendo. O vento pode acabar com o seu dia, porque de repente você fica sem energia. Segunda à noite um monte dos nossos planos foi pro espaço porque os endereços estavam errados e as pessoas não estavam interessadas. Mas ouvimos que não era pra ir a baladas, que Deus nos ama, e mais tarde encontramos uma família nova pra ensinar. Então uhuu! Na terça usamos nosso almoço de distrito grátis dos líderes de zona indo à padaria (padaria brasileira) e cada um pedindo um X-tudo. De longe um dos melhores hambúrgueres que já comi! (Batata palha, bacon, ovo, presunto, pastrami e muçarela fresca, além das coisas normais de hambúrguer) Nosso amigo Juan está indo muito bem, com certeza vamos marcar uma data de batismo essa semana. Nossas lições têm sido muito espirituais, e nessa última ele orou com a gente sobre o Livro de Mórmon, já que ainda não tinha orado. Ele sabe que \"é verdade\", como ele disse. 🥳 Jantamos com os Newville essa semana, daí o título do e-mail. Ele não sabe quase nada de espanhol, então diz que o nome dele é pouco a pouco, ou poco poco, porque aprende uma palavra por ano haha. O domingo foi super incrível. Encontramos mais uma família, os Blandon, jantamos com os Cole e marcamos a data dos nossos amigos Ilene & João. Fomos lá e ensinamos sobre Joseph Smith de novo, junto com alguns mandamentos. Saímos por causa do horário sem marcar a data, mas sentimos que devíamos ligar pra eles quando chegássemos em casa e tentar de novo. Ligamos, os dois atenderam no celular dele, e toparam na hora! Fiquem ligados! Orem por esses amigos, junto com estes aqui: Damaris & Elivam (eles estão lendo e são super incríveis, estamos animados pra marcar uma data logo) Marklane Eduardo Tuil John & Nice Edmar & Liz José Luis Terminei o Livro de Mórmon em português essa semana, e uma das maiores coisas que aprendi foi quantas vezes se fala de Cristo e quantas vezes Ele ou Deus tentam nos abençoar, guiar, ajudar e falar com a gente. Los amo, Élder Jacobo Fotos: X-Tudo jantar com os Cole Harambo & Élder Stevens lugar legal pra foto memes de Dia dos Namorados"}, {"id": "l87", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEV 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"CO\">🇨🇴 Colômbia<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><\/div>", "cultures": ["VE", "CO", "BR"], "moments": [], "extra": "Venezuela Colombia Brazil", "kind": "Carta 87 · Fort Myers", "title": "❤️ Feliz día de San Valentín 😋🥩", "date": "2023-02-20T13:10:00", "group": "2023-02", "html": "<div class=\"body\"><p>Olá gente! Beleza?<\/p>\n<p>Tivemos uma semana bem ótima, considerando tudo. É, ainda tivemos problemas com lições sendo canceladas e membros ocupados demais pra vir ajudar a ensinar com a gente. Também senti muita dor no joelho, mas parece que está passando agora. Fizemos muitas visitas rápidas essa semana, visitando membros e pessoas que talvez tenham interesse.<\/p>\n<p>Também comemos picanha essa semana. É um corte de carne mega delicioso que os brasileiros 🇧🇷 fazem, só que foram nossos membros venezuelanos 🇻🇪 &amp; colombianos 🇨🇴 que fizeram. A primeira vez essa semana passou do ponto, mas ainda estava boa. A segunda foi fenomenal. Vão comer uma se possível ou vão num rodízio (um tipo de restaurante brasileiro que o Élder Towne me contou). O João &amp; a Ilene estão indo muito bem; ela ficou doente essa semana e perdeu a voz, orem por eles. Eles nos serviram um bolo brabo &amp; bolinhas de cordon bleu (um tipo de salgado), super incrível<\/p>\n<p>A Damaris &amp; o Elivam também estão indo muito bem, ainda buscando uma resposta do Espírito sobre o Livro de Mórmon. Tivemos uma reunião da missão inteira para o espanhol. Eu estava dirigindo em espanhol, apesar de quase todo o resto ser em inglês... Mas foi bem bom mesmo assim 🇺🇲<\/p>\n<p>Eu quase morri essa semana. Me deram um doce muito gostoso, mas era feito de castanha de caju... Por sorte o Benadryl é brabo demais 🐐 Comecei a assistir mais vídeos do Livro de Mórmon e amo muito. Por favor, vão assistir e comecem o Livro de Mórmon de novo!<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Manatee Park (infelizmente não vimos nada)<\/li>\n<li>árvore gigante (Edison &amp; Ford Winter Estates)<\/li>\n<li>doce de castanha de caju<\/li>\n<li>Jantar com os Aguero<\/li>\n<li>Conferência de zona<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-02-20_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-02-20_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-20_0_6.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_407.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_408.jpg\" alt=\"\"><\/figure><\/div><\/div><\/div>", "text": "❤️ Feliz día de San Valentín 😋🥩 Olá gente! Beleza? Tivemos uma semana bem ótima, considerando tudo. É, ainda tivemos problemas com lições sendo canceladas e membros ocupados demais pra vir ajudar a ensinar com a gente. Também senti muita dor no joelho, mas parece que está passando agora. Fizemos muitas visitas rápidas essa semana, visitando membros e pessoas que talvez tenham interesse. Também comemos picanha essa semana. É um corte de carne mega delicioso que os brasileiros 🇧🇷 fazem, só que foram nossos membros venezuelanos 🇻🇪 & colombianos 🇨🇴 que fizeram. A primeira vez essa semana passou do ponto, mas ainda estava boa. A segunda foi fenomenal. Vão comer uma se possível ou vão num rodízio (um tipo de restaurante brasileiro que o Élder Towne me contou). O João & a Ilene estão indo muito bem; ela ficou doente essa semana e perdeu a voz, orem por eles. Eles nos serviram um bolo brabo & bolinhas de cordon bleu (um tipo de salgado), super incrível A Damaris & o Elivam também estão indo muito bem, ainda buscando uma resposta do Espírito sobre o Livro de Mórmon. Tivemos uma reunião da missão inteira para o espanhol. Eu estava dirigindo em espanhol, apesar de quase todo o resto ser em inglês... Mas foi bem bom mesmo assim 🇺🇲 Eu quase morri essa semana. Me deram um doce muito gostoso, mas era feito de castanha de caju... Por sorte o Benadryl é brabo demais 🐐 Comecei a assistir mais vídeos do Livro de Mórmon e amo muito. Por favor, vão assistir e comecem o Livro de Mórmon de novo! Los amo! Elder Jacobs Fotos: Manatee Park (infelizmente não vimos nada) árvore gigante (Edison & Ford Winter Estates) doce de castanha de caju Jantar com os Aguero Conferência de zona Mais desta semana"}, {"id": "l88", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">FEV 2023<\/span><\/div><\/div>", "stamps": "", "cultures": [], "moments": [], "extra": "", "kind": "Carta 88 · Fort Myers", "title": "👾Abandonando minha área 🦅", "date": "2023-02-27T11:52:00", "group": "2023-02", "html": "<div class=\"body\"><p>Opa! blz? Eu tô de bola<\/p>\n<p>Ei! Tudo beleza? Tô só de boa<\/p>\n<p>Essa semana foi ótima! (Não, eu não abandonei minha área de verdade, mas fiquei um tempão fora dela.) Quarta foi o MLC (Conselho de Liderança da Missão); saí às 5 da manhã e voltei às 6 da tarde. No dia seguinte dirigimos até Tampa e também voltamos às 6 da tarde. Trocamos nosso carro velho e o Élder Towne por um Nissan Rogue zerinho.<\/p>\n<p>*Não exatamente, deixamos ele lá pra ficar perto do aeroporto. Ele embarcou hoje de manhã 🥲<\/p>\n<p>O resto da semana foi bem ótimo; fomos desafiados a fazer o Facebook Boot Camp. Ou seja, usar o Facebook todo dia, aprender novas formas de usá-lo e encontrar muitos amigos novos. Na verdade deu bem certo e foi divertido. Terminamos o desafio de 7 dias e ganhamos um adesivo! Que vai ser entregue mais pra frente essa semana.<\/p>\n<p>Fizemos serviço essa semana! Algo muito raro pra mim, já que a maioria dos hispânicos não gosta de receber serviço. Uma coisa que aprendi essa semana foi o quanto eu amo nossos amigos e estar com eles. D&amp;C 84:77 diz... E novamente vos digo, meus amigos, pois de agora em diante vos chamarei amigos, é conveniente que eu vos dê este mandamento: que vos torneis como meus amigos nos dias em que estive com eles, viajando para pregar o evangelho com meu poder;<\/p>\n<p>Vocês são meus amigos e eu me importo com cada um de vocês. Cristo nos convida a ser Seus amigos e a aprofundar nosso discipulado. Eu amo os amigos que estou ensinando agora e fiquei triste nos dias em que tive menos tempo pra estar com eles. Confiem no seu Salvador e em mim como seus amigos!<\/p>\n<p class=\"sign\">Los amo mucho!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Cuscuz &amp; açúcar com canela<\/li>\n<li>Élder Argyle &amp; eu no MLC<\/li>\n<li>ah, é isso aí!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-02-27_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-02-27_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "👾Abandonando minha área 🦅 Opa! blz? Eu tô de bola Ei! Tudo beleza? Tô só de boa Essa semana foi ótima! (Não, eu não abandonei minha área de verdade, mas fiquei um tempão fora dela.) Quarta foi o MLC (Conselho de Liderança da Missão); saí às 5 da manhã e voltei às 6 da tarde. No dia seguinte dirigimos até Tampa e também voltamos às 6 da tarde. Trocamos nosso carro velho e o Élder Towne por um Nissan Rogue zerinho. *Não exatamente, deixamos ele lá pra ficar perto do aeroporto. Ele embarcou hoje de manhã 🥲 O resto da semana foi bem ótimo; fomos desafiados a fazer o Facebook Boot Camp. Ou seja, usar o Facebook todo dia, aprender novas formas de usá-lo e encontrar muitos amigos novos. Na verdade deu bem certo e foi divertido. Terminamos o desafio de 7 dias e ganhamos um adesivo! Que vai ser entregue mais pra frente essa semana. Fizemos serviço essa semana! Algo muito raro pra mim, já que a maioria dos hispânicos não gosta de receber serviço. Uma coisa que aprendi essa semana foi o quanto eu amo nossos amigos e estar com eles. D&C 84:77 diz... E novamente vos digo, meus amigos, pois de agora em diante vos chamarei amigos, é conveniente que eu vos dê este mandamento: que vos torneis como meus amigos nos dias em que estive com eles, viajando para pregar o evangelho com meu poder; Vocês são meus amigos e eu me importo com cada um de vocês. Cristo nos convida a ser Seus amigos e a aprofundar nosso discipulado. Eu amo os amigos que estou ensinando agora e fiquei triste nos dias em que tive menos tempo pra estar com eles. Confiem no seu Salvador e em mim como seus amigos! Los amo mucho! Elder Jacobs Fotos: Cuscuz & açúcar com canela Élder Argyle & eu no MLC ah, é isso aí!"}, {"id": "l89", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 89 · Fort Myers", "title": "Mais uma", "date": "2023-03-06T06:29:00", "group": "2023-03", "html": "<div class=\"body\"><p>Ôpa 👋 como vocês vão?<\/p>\n<p>Essa semana foi bem boa. Tivemos transferências e me despedi do Élder Wahlberg. Agora ele está em Tampa, uma das minhas áreas favoritas do passado; ele vai se sair muito bem e ser bem recebido por todo mundo, até pelos meus recém-conversos de lá.<\/p>\n<p>Fui buscar o Élder Kroeger! Ele é de Clinton, Utah, e cresceu falando espanhol e inglês. Então já entramos direto em ação. Ele está aprendendo português porque também vai pra Campinas, no Brasil. Espero que ele não vá embora cedo demais. (Aliás, ele é o treinando nº 10 hahaa)<\/p>\n<p>A semana começou meio devagar, mas depois acelerou. Conseguimos visitar o Juan essa semana e falamos muito sobre o plano de Deus e os mandamentos. Marcamos a data de batismo para 21 de março! Ele ainda precisa vir à igreja 2 vezes, mas a família dele ainda sente a perda que acabaram de sofrer. Por favor, orem por ele e pela família dele (os Gómez). Encontramos alguns amigos novos essa semana, eles estão indo bem, mas por favor orem por estes amigos:<\/p>\n<ul class=\"bul\">\n<li>João &amp; Ilene<\/li>\n<li>Damaris &amp; Elivam (estão doentes de novo)<\/li>\n<li>Jose Miguel &amp; Kelly<\/li>\n<li>Edmar<\/li>\n<\/ul>\n<p>Tivemos uma lição incrível com a família Aguirre; estamos ajudando a preparar o Jesus para o batismo. Ele é um bom menino e estamos animados pra continuar ajudando.<\/p>\n<p>Sem grandes histórias essa semana nem fotos (esqueci de tirar mais), mas espero que a de vocês tenha sido boa.<\/p>\n<p>Tenho aprendido muito essa semana nos meus estudos sobre os atributos cristãos e metas/planos. Quem planeja bem mantém as metas em mente, reavalia constantemente pra descobrir o que funciona melhor e ora sobre isso. Boas metas são inspiradas, alcançáveis e altas o bastante pra nos puxar pra cima. Cristo (&amp; o jeito como Ele agia) nos mostra a importância de fazer essas coisas e de sempre demonstrar amor.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Ceviche (que a gente fez)<\/li>\n<li>arepas<\/li>\n<li>alguém não ficou feliz com o nosso carro<\/li>\n<li>conhecendo o Élder Kroeger<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2023-03-06_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-06_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-06_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-06_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "Mais uma Ôpa 👋 como vocês vão? Essa semana foi bem boa. Tivemos transferências e me despedi do Élder Wahlberg. Agora ele está em Tampa, uma das minhas áreas favoritas do passado; ele vai se sair muito bem e ser bem recebido por todo mundo, até pelos meus recém-conversos de lá. Fui buscar o Élder Kroeger! Ele é de Clinton, Utah, e cresceu falando espanhol e inglês. Então já entramos direto em ação. Ele está aprendendo português porque também vai pra Campinas, no Brasil. Espero que ele não vá embora cedo demais. (Aliás, ele é o treinando nº 10 hahaa) A semana começou meio devagar, mas depois acelerou. Conseguimos visitar o Juan essa semana e falamos muito sobre o plano de Deus e os mandamentos. Marcamos a data de batismo para 21 de março! Ele ainda precisa vir à igreja 2 vezes, mas a família dele ainda sente a perda que acabaram de sofrer. Por favor, orem por ele e pela família dele (os Gómez). Encontramos alguns amigos novos essa semana, eles estão indo bem, mas por favor orem por estes amigos: João & Ilene Damaris & Elivam (estão doentes de novo) Jose Miguel & Kelly Edmar Tivemos uma lição incrível com a família Aguirre; estamos ajudando a preparar o Jesus para o batismo. Ele é um bom menino e estamos animados pra continuar ajudando. Sem grandes histórias essa semana nem fotos (esqueci de tirar mais), mas espero que a de vocês tenha sido boa. Tenho aprendido muito essa semana nos meus estudos sobre os atributos cristãos e metas/planos. Quem planeja bem mantém as metas em mente, reavalia constantemente pra descobrir o que funciona melhor e ora sobre isso. Boas metas são inspiradas, alcançáveis e altas o bastante pra nos puxar pra cima. Cristo (& o jeito como Ele agia) nos mostra a importância de fazer essas coisas e de sempre demonstrar amor. Los amo! Elder Jacobs Fotos: Ceviche (que a gente fez) arepas alguém não ficou feliz com o nosso carro conhecendo o Élder Kroeger"}, {"id": "l90", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"SV\">🇸🇻 El Salvador<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🌀 Furacão<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["SV"], "moments": ["Baptism", "Hurricane", "Temple"], "extra": "El Salvador", "kind": "Carta 90 · Fort Myers", "title": "Mais uma montanha 🏔️ pra escalar", "date": "2023-03-13T09:16:00", "group": "2023-03", "html": "<div class=\"body\"><p>Ôpa Hola hey bonswa yabbadabbadoo<\/p>\n<p>Como vocês estão?<\/p>\n<p>As coisas estão indo bem! Essa semana aconteceu um monte de coisa, então vai ser mais ou menos dia por dia. Bora lá! Essa semana começou mais um desafio de busca, e o distrito que perder tem que raspar a cabeça do líder de distrito. Mais sobre isso depois. Encontramos um casal de El Salvador, mas no fim da semana eles perceberam que estavam ocupados demais e no momento não estamos mais ensinando eles.<\/p>\n<p>Na terça a agenda estava quase toda livre, então mandamos ver na busca e tentando ensinar nossos amigos. Encontramos um amigo novo, o Tiago, que leu a Bíblia e depois orou pra aprender mais, e logo em seguida batemos na porta dele! Ele ficou muito animado de ver a gente e tivemos uma ótima conversa sobre arrependimento e o amor &amp; a graça de Deus. Também ensinamos a Damaris &amp; a família dela e depois o Edmar &amp; a dele, as duas lições top demais.<\/p>\n<p>A Loreina tem 2 anos e é filha da Damaris. Ela é super fofa e meio doidinha, mas essa última lição foi outro nível. Ela viu o Élder Kroeger e na hora ficou apaixonada por ele! Ela só falava e falava com ele e até abraçou ele. A parte mais engraçada é que ela acabou de sujar ele de leite materno! (Na cultura latino-americana, bebê = fome -&gt; mama na hora, e a Loreina ainda mama, ficou com fome no fim e bom... vocês podem imaginar).<\/p>\n<p>Na quarta tivemos umas lições incríveis. Nos encontramos com o Juan e ensinamos sobre a igreja e os passos pra ser batizado e continuar no caminho para Deus. Conseguimos mais informações sobre a licença de casamento pra preparar o João e a Ilene e conhecemos uma senhora muito querida chamada Tally. Também fomos à casa da Hermana Leedman e ajudamos ela a salvar umas coisas da casa, porque durante o furacão uma árvore gigante esmagou a casa bem no meio e eles vão ter que reconstruir tudo. Então mudamos umas coisas de lugar e desmontamos a garagem dela. Foi bem divertido, eu amei ajudar ela e basicamente brincar de lego de gente grande kkkkkkk Na quinta tivemos o treinamento especializado em Tampa. A reunião e o treinamento para os novos treinandos e seus treinadores. Ficamos fora das 6h às 21h, igualzinho da última vez.<\/p>\n<p>Sexta foi um pouco mais devagar, com lições sendo canceladas, mas encontramos mais alguns amigos, ensinamos a família Aguirre pra preparar o Jesus para o batismo (foi super bem) e conseguimos ajudar na aula de inglês e arrumar as cadeiras para a Conferência de Estaca. A maior parte do nosso fim de semana depois disso foi pedalando pros compromissos e batendo portas. Algumas lições foram canceladas, mas tivemos bastante lições na porta das casas e até deixaram a gente entrar. Um dos nossos amigos novos era uma indicação, então ligamos pra ele e tivemos uma lição por telefone. Aí ele começou a cantar &quot;Fiesta para Jesus&quot; (aliás, ele também ligou hoje de manhã pra conversar e cantou &quot;Jesus el camino&quot;, outro hino pentecostal que é um hitzão) e ele quer sair pregando com a gente kkkkkkkk. A &quot;montanha pra escalar&quot; do título do meu e-mail é por causa da frequência na igreja. Tivemos conferência de estaca no sábado e no domingo à noite, mas só 1 amigo e 1 recém-converso vieram. Talvez por causa do horário de verão, da igreja às 9 em vez das 11, ou eles simplesmente decidiram não vir. Mas essa é nossa próxima meta: levar mais pessoas à igreja pra sentirem o Espírito e fazerem amigos lá. Orem por isso!<\/p>\n<p>Meu pensamento dessa semana vem da Conferência de Estaca:<\/p>\n<p>Falaram muito sobre o trabalho missionário e sobre ser &quot;salvadores dos homens&quot;, além de seguir até a menor inspiração. O que realmente me tocou essa semana foi sobre a nossa espiritualidade, ou no meu caso o &quot;auge espiritual&quot;. Muita gente sabe que os missionários têm um Espírito muito forte, e isso é por causa do foco deles nos outros, como Cristo fazia, e dos bons hábitos deles. Como estou chegando ao fim da minha missão, devo realmente me esforçar pra continuar muitas dessas mesmas coisas em casa. O CPR-T (igreja, oração, leitura das escrituras e frequência ao templo) é muito importante pra manter nossa ligação com Deus e a orientação Dele. Existem muitas coisas na vida: boas, melhores e as melhores de todas. As melhores são as coisas que têm valor eterno ou que são de maior importância. Convido vocês a orar e buscar orientação sobre uma ou duas coisas pra acrescentar/melhorar, a fim de manter e fazer crescer a sua espiritualidade.<\/p>\n<p class=\"sign\">los amo mucho!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>convites para a conferência de estaca... Fizemos um monte!<\/li>\n<li>serviço<\/li>\n<li>quando busquei o Élder Kroeger<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2023-03-13_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2023-03-13_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2023-03-13_0_2.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_409.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_410.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_411.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full land\"><img src=\"images/extra_412.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_413.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "Mais uma montanha 🏔️ pra escalar Ôpa Hola hey bonswa yabbadabbadoo Como vocês estão? As coisas estão indo bem! Essa semana aconteceu um monte de coisa, então vai ser mais ou menos dia por dia. Bora lá! Essa semana começou mais um desafio de busca, e o distrito que perder tem que raspar a cabeça do líder de distrito. Mais sobre isso depois. Encontramos um casal de El Salvador, mas no fim da semana eles perceberam que estavam ocupados demais e no momento não estamos mais ensinando eles. Na terça a agenda estava quase toda livre, então mandamos ver na busca e tentando ensinar nossos amigos. Encontramos um amigo novo, o Tiago, que leu a Bíblia e depois orou pra aprender mais, e logo em seguida batemos na porta dele! Ele ficou muito animado de ver a gente e tivemos uma ótima conversa sobre arrependimento e o amor & a graça de Deus. Também ensinamos a Damaris & a família dela e depois o Edmar & a dele, as duas lições top demais. A Loreina tem 2 anos e é filha da Damaris. Ela é super fofa e meio doidinha, mas essa última lição foi outro nível. Ela viu o Élder Kroeger e na hora ficou apaixonada por ele! Ela só falava e falava com ele e até abraçou ele. A parte mais engraçada é que ela acabou de sujar ele de leite materno! (Na cultura latino-americana, bebê = fome -> mama na hora, e a Loreina ainda mama, ficou com fome no fim e bom... vocês podem imaginar). Na quarta tivemos umas lições incríveis. Nos encontramos com o Juan e ensinamos sobre a igreja e os passos pra ser batizado e continuar no caminho para Deus. Conseguimos mais informações sobre a licença de casamento pra preparar o João e a Ilene e conhecemos uma senhora muito querida chamada Tally. Também fomos à casa da Hermana Leedman e ajudamos ela a salvar umas coisas da casa, porque durante o furacão uma árvore gigante esmagou a casa bem no meio e eles vão ter que reconstruir tudo. Então mudamos umas coisas de lugar e desmontamos a garagem dela. Foi bem divertido, eu amei ajudar ela e basicamente brincar de lego de gente grande kkkkkkk Na quinta tivemos o treinamento especializado em Tampa. A reunião e o treinamento para os novos treinandos e seus treinadores. Ficamos fora das 6h às 21h, igualzinho da última vez. Sexta foi um pouco mais devagar, com lições sendo canceladas, mas encontramos mais alguns amigos, ensinamos a família Aguirre pra preparar o Jesus para o batismo (foi super bem) e conseguimos ajudar na aula de inglês e arrumar as cadeiras para a Conferência de Estaca. A maior parte do nosso fim de semana depois disso foi pedalando pros compromissos e batendo portas. Algumas lições foram canceladas, mas tivemos bastante lições na porta das casas e até deixaram a gente entrar. Um dos nossos amigos novos era uma indicação, então ligamos pra ele e tivemos uma lição por telefone. Aí ele começou a cantar \"Fiesta para Jesus\" (aliás, ele também ligou hoje de manhã pra conversar e cantou \"Jesus el camino\", outro hino pentecostal que é um hitzão) e ele quer sair pregando com a gente kkkkkkkk. A \"montanha pra escalar\" do título do meu e-mail é por causa da frequência na igreja. Tivemos conferência de estaca no sábado e no domingo à noite, mas só 1 amigo e 1 recém-converso vieram. Talvez por causa do horário de verão, da igreja às 9 em vez das 11, ou eles simplesmente decidiram não vir. Mas essa é nossa próxima meta: levar mais pessoas à igreja pra sentirem o Espírito e fazerem amigos lá. Orem por isso! Meu pensamento dessa semana vem da Conferência de Estaca: Falaram muito sobre o trabalho missionário e sobre ser \"salvadores dos homens\", além de seguir até a menor inspiração. O que realmente me tocou essa semana foi sobre a nossa espiritualidade, ou no meu caso o \"auge espiritual\". Muita gente sabe que os missionários têm um Espírito muito forte, e isso é por causa do foco deles nos outros, como Cristo fazia, e dos bons hábitos deles. Como estou chegando ao fim da minha missão, devo realmente me esforçar pra continuar muitas dessas mesmas coisas em casa. O CPR-T (igreja, oração, leitura das escrituras e frequência ao templo) é muito importante pra manter nossa ligação com Deus e a orientação Dele. Existem muitas coisas na vida: boas, melhores e as melhores de todas. As melhores são as coisas que têm valor eterno ou que são de maior importância. Convido vocês a orar e buscar orientação sobre uma ou duas coisas pra acrescentar/melhorar, a fim de manter e fazer crescer a sua espiritualidade. los amo mucho! Élder Jacobo Fotos: convites para a conferência de estaca... Fizemos um monte! serviço quando busquei o Élder Kroeger Mais desta semana"}, {"id": "l91", "area": 9, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">FORT MYERS, FL<\/span><span class=\"pm-d\">MAR 2023<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 México<\/span><span class=\"stamp c\" data-c=\"DO\">🇩🇴 República Dominicana<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["MX", "DO", "BR"], "moments": ["Baptism"], "extra": "Mexico Dominican Republic Brazil", "kind": "Carta 91 · Fort Myers", "title": "Um mistério de assassinato?! 🔪🩸☠️", "date": "2023-03-20T10:32:00", "group": "2023-03", "html": "<div class=\"body\"><p>Olá pessoal!<\/p>\n<p>Tivemos uma semana muito boa, cheia de lições. Vamos lá!<\/p>\n<p>Começam
