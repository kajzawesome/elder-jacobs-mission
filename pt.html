rida hora da Primária jaja fizemos um reel no Facebook (desta vez em inglês) Mais desta semana"}, {"id": "l65", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SET 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["BR", "HT"], "moments": ["Baptism"], "extra": "Brazil Haiti", "kind": "Carta 65 · Tampa", "title": "💪Quarteto Fantástico🤡🤡🤡🤡", "date": "2022-09-12T12:43:00", "group": "2022-09", "html": "<div class=\"body\"><p>Otra semana terminada y otro traslado! Y fue buenisimo!<\/p>\n<p>Pra explicar o título do e-mail: descobrimos na segunda à noite que íamos receber o Élder Gundersen! E viramos um quarteto na quinta, já que o companheiro anterior dele e outros missionários de crioulo haitiano iam receber élderes em treinamento/novos companheiros.<\/p>\n<p>Fizemos 2 divisões esta semana, uma com Carrollwood (Élder Griffin) e outra com South Tampa (Élder Day). Muito divertido, e deu pra ver de verdade o quanto esses élderes cresceram nesta transferência.<\/p>\n<p>Nossos amigos estão indo muito bem. O Samuel tem data de batismo marcada para o dia 25! A família do Diogo chega no sábado! E encontramos um monte de gente nova.<\/p>\n<p>Parte disso foi por causa do quarteto. Enquanto 2 de nós ensinavam as lições marcadas, os outros 2 ficavam com os celulares marcando mais visitas ou batendo portas por perto. Simplesmente brabo demais! 🐐<\/p>\n<p>Tivemos entrevistas com o Presidente, o que foi incrível: conhecê-lo melhor, saber o plano para o futuro da missão e também sentir o Espírito trabalhar por meio dele. Também temos notícias das transferências:<\/p>\n<p>Élder O'Neill para Rio Vista A<\/p>\n<p>Élder Franson para Dade City Sp (com o Élder Dean!)<\/p>\n<p>Élder Gundersen para Rio Vista B<\/p>\n<p>E eu vou ficar e receber o Élder Rogers (que acabou de terminar o treinamento) e um missionário novo! (Ele vai para o Brasil, então posso ajudar a ensinar e praticar português!)<\/p>\n<p>A conferência de estaca foi neste fim de semana, o que resultou em muito poder espiritual e comida extra pra gente jaja. O Élder Ojediran falou muito sobre o Espírito e o sacramento, e como, quando tomamos o sacramento, recebemos o Espírito mais plenamente e então somos impulsionados a nos manter limpos/nos arrepender e continuar o ciclo com o sacramento. Então, no próximo domingo, pensem mais em Cristo e no Espírito enquanto tomam o sacramento<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>meme do quarteto<\/li>\n<li>conferência de estaca com TODOS os missionários<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-09-12_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-12_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-12_1_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-09-12_1_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "💪Quarteto Fantástico🤡🤡🤡🤡 Otra semana terminada y otro traslado! Y fue buenisimo! Pra explicar o título do e-mail: descobrimos na segunda à noite que íamos receber o Élder Gundersen! E viramos um quarteto na quinta, já que o companheiro anterior dele e outros missionários de crioulo haitiano iam receber élderes em treinamento/novos companheiros. Fizemos 2 divisões esta semana, uma com Carrollwood (Élder Griffin) e outra com South Tampa (Élder Day). Muito divertido, e deu pra ver de verdade o quanto esses élderes cresceram nesta transferência. Nossos amigos estão indo muito bem. O Samuel tem data de batismo marcada para o dia 25! A família do Diogo chega no sábado! E encontramos um monte de gente nova. Parte disso foi por causa do quarteto. Enquanto 2 de nós ensinavam as lições marcadas, os outros 2 ficavam com os celulares marcando mais visitas ou batendo portas por perto. Simplesmente brabo demais! 🐐 Tivemos entrevistas com o Presidente, o que foi incrível: conhecê-lo melhor, saber o plano para o futuro da missão e também sentir o Espírito trabalhar por meio dele. Também temos notícias das transferências: Élder O'Neill para Rio Vista A Élder Franson para Dade City Sp (com o Élder Dean!) Élder Gundersen para Rio Vista B E eu vou ficar e receber o Élder Rogers (que acabou de terminar o treinamento) e um missionário novo! (Ele vai para o Brasil, então posso ajudar a ensinar e praticar português!) A conferência de estaca foi neste fim de semana, o que resultou em muito poder espiritual e comida extra pra gente jaja. O Élder Ojediran falou muito sobre o Espírito e o sacramento, e como, quando tomamos o sacramento, recebemos o Espírito mais plenamente e então somos impulsionados a nos manter limpos/nos arrepender e continuar o ciclo com o sacramento. Então, no próximo domingo, pensem mais em Cristo e no Espírito enquanto tomam o sacramento Los amo! Elder Jacobs Fotos: meme do quarteto conferência de estaca com TODOS os missionários"}, {"id": "l66", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SET 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism"], "extra": "Brazil", "kind": "Carta 66 · Tampa", "title": "👨‍👦Meu novo filho!🤡", "date": "2022-09-19T08:01:00", "group": "2022-09", "html": "<div class=\"body\"><p>Bom día meus queridos amigos!<\/p>\n<p>Tive uma semana muitíssima boa e legal na missão!<\/p>\n<p>Como eu disse no último e-mail, as transferências foram na terça e perdi meus companheiros, mas está tudo bem, tenho outros tão incríveis quanto. O Élder Rogers é muito engraçado e é de Round Valley, AZ, e o Élder Towne (nosso élder em treinamento novinho) é de Gilbert! Que sorte, trio do Arizona!<\/p>\n<p>O Élder Towne vai acabar indo, não sei quando, depende do visto, para Campinas, no Brasil! Tem sido um sonho falar português com ele e com os amigos, além da enxurrada de piadas na nossa dupla como um todo. Enquanto esperávamos para buscá-lo na quinta, ficamos com o Élder Argyle! Ele e eu fomos companheiros uns meses atrás, mas só por 6 dias, e agora finalmente passamos de uma semana jaja!<\/p>\n<p>O começo da semana, antes de buscarmos o Élder Towne, foi um monte de lições e tentativas de encontrar pessoas sem muito resultado, mas fazer o quê. Nossa aula de inglês está crescendo e tem uma vibe muito boa e divertida, então estou animado pro futuro dela. O Samuel vai ser batizado semana que vem, fiquem ligados 😉<\/p>\n<p>A Yolennis, namorada do Enrique, também vai ser batizada daqui a algumas semanas.<\/p>\n<p>Nossos outros amigos estão indo superbem. O Nicolas quer ser batizado, foi à igreja ontem e amou! A Emmelina ainda quer, mas a saúde dela não está das melhores. O Guillermo e a Genesis e os filhos deles (Jorge, Ester e Guillermo Jr.) estão bem, também foram à igreja, mas ainda estão procurando um apartamento/casa novo. Então orem por esses amigos.<\/p>\n<p>Uma coisa que o Presidente disse e que eu amei foi: \"Estamos aqui para inspirar\", porque, em vez de descer o martelo, Cristo sempre se manteve firme em Suas crenças, mas incentivava e inspirava os outros a mudar e melhorar. Somos Seus discípulos e, como tal, devemos tentar imitá-Lo e ser um exemplo dos fiéis.<\/p>\n<p>1 Timóteo 4:12<\/p>\n<p>Ninguém despreze a tua mocidade; mas sê o exemplo dos fiéis, na palavra, no trato, na caridade, no espírito, na fé, na pureza<\/p>\n<p>Bom, estou animado com esta transferência e com o futuro. Me contem qualquer coisa que esteja acontecendo na vida de vocês. Na sexta temos treinamento especializado e vou poder ver mais amigos missionários &amp; enlouquecer encontrando pessoas no campus da USF kkk.<\/p>\n<p class=\"sign\">Los Amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Élder Rogers &amp; Élder Argyle<\/li>\n<li>Élder Towne!<\/li>\n<li>Hora do Pokémon<\/li>\n<li>Quarteto<\/li>\n<li>Tchau tchau, Mijos!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-09-19_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-19_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_364.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_365.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_366.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_367.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_368.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "👨‍👦Meu novo filho!🤡 Bom día meus queridos amigos! Tive uma semana muitíssima boa e legal na missão! Como eu disse no último e-mail, as transferências foram na terça e perdi meus companheiros, mas está tudo bem, tenho outros tão incríveis quanto. O Élder Rogers é muito engraçado e é de Round Valley, AZ, e o Élder Towne (nosso élder em treinamento novinho) é de Gilbert! Que sorte, trio do Arizona! O Élder Towne vai acabar indo, não sei quando, depende do visto, para Campinas, no Brasil! Tem sido um sonho falar português com ele e com os amigos, além da enxurrada de piadas na nossa dupla como um todo. Enquanto esperávamos para buscá-lo na quinta, ficamos com o Élder Argyle! Ele e eu fomos companheiros uns meses atrás, mas só por 6 dias, e agora finalmente passamos de uma semana jaja! O começo da semana, antes de buscarmos o Élder Towne, foi um monte de lições e tentativas de encontrar pessoas sem muito resultado, mas fazer o quê. Nossa aula de inglês está crescendo e tem uma vibe muito boa e divertida, então estou animado pro futuro dela. O Samuel vai ser batizado semana que vem, fiquem ligados 😉 A Yolennis, namorada do Enrique, também vai ser batizada daqui a algumas semanas. Nossos outros amigos estão indo superbem. O Nicolas quer ser batizado, foi à igreja ontem e amou! A Emmelina ainda quer, mas a saúde dela não está das melhores. O Guillermo e a Genesis e os filhos deles (Jorge, Ester e Guillermo Jr.) estão bem, também foram à igreja, mas ainda estão procurando um apartamento/casa novo. Então orem por esses amigos. Uma coisa que o Presidente disse e que eu amei foi: \"Estamos aqui para inspirar\", porque, em vez de descer o martelo, Cristo sempre se manteve firme em Suas crenças, mas incentivava e inspirava os outros a mudar e melhorar. Somos Seus discípulos e, como tal, devemos tentar imitá-Lo e ser um exemplo dos fiéis. 1 Timóteo 4:12 Ninguém despreze a tua mocidade; mas sê o exemplo dos fiéis, na palavra, no trato, na caridade, no espírito, na fé, na pureza Bom, estou animado com esta transferência e com o futuro. Me contem qualquer coisa que esteja acontecendo na vida de vocês. Na sexta temos treinamento especializado e vou poder ver mais amigos missionários & enlouquecer encontrando pessoas no campus da USF kkk. Los Amo, Elder Jacobs Fotos: Élder Rogers & Élder Argyle Élder Towne! Hora do Pokémon Quarteto Tchau tchau, Mijos! Mais desta semana"}, {"id": "l67", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">SET 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🌀 Furacão<\/span><\/div>", "cultures": ["BR"], "moments": ["Baptism", "Hurricane"], "extra": "Brazil", "kind": "Carta 67 · Tampa", "title": "🌤La tranquilidad antes de la tormenta🌀🌊", "date": "2022-09-26T05:22:00", "group": "2022-09", "html": "<div class=\"body\"><p>Gracias a todos! Tive um bom aniversário na sexta, sim. A maior parte da sexta foi uma reunião para treinadores &amp; élderes em treinamento, mas depois jantamos no Chick-fil-A.<\/p>\n<p>Esta semana foi bem divertida e, mesmo que o título diga calmaria antes da tempestade, esta semana pareceu uma tormentita em algumas partes também.<\/p>\n<p>A segunda passada à noite foi top demais, pudemos ensinar nossa família brasileira de novo e eles tinham muitas perguntas sobre o plano de salvação (que coincidência, era isso que tínhamos planejado ensinar). Infelizmente nosso membro estava trabalhando e não pôde ir, então a lição foi longa, tentando explicar tudo direitinho no nosso português limitado (Élder Towne &amp; eu), mas eles gostaram. Também demos uns Pokémon pro João, que tem 6 anos!<\/p>\n<p>Na terça tivemos um conselho de distrito de fogo e uma divisão com os élderes de South Tampa. Fizemos visitas + batemos portas no caminho de casa e encontramos uma família de membros que tinha acabado de se mudar uma semana antes.<\/p>\n<p>Ensinei o Élder Towne &amp; o Élder Rogers a ter uma sessão de planejamento semanal incrível... ou seja, fazer arepas. Brabo demais. Sei lá por que isso não é mais popular.<\/p>\n<p>E a melhor parte foi que nosso amigo Samuel finalmente foi batizado ontem! Ele estava esperando havia meses e finalmente estava pronto. Foi um serviço batismal muito bonito e sei que vamos ver muitas coisas boas vindo dele.<\/p>\n<p>Na sexta recebemos a notícia do furacão pelo Presidente Gardiner. Então temos nos preparado com água, comida, gasolina etc. Mas vamos ver se estamos preparados de menos ou demais. Meus companheiros e eu vamos ser evacuados do nosso apartamento hoje para a casa da missão em Wesley Chapel. Vamos ver como vai ser o trabalho missionário esta semana.<\/p>\n<p>Mateus 6:6 Mas tu, quando orares, entra no teu aposento e, fechando a tua porta, ora a teu Pai que está em secreto; e teu Pai, que vê em secreto, te recompensará publicamente<\/p>\n<p>Tenho tentado fazer uma oração em secreto uma vez por dia e isso tem me ajudado muito no meu relacionamento com Deus. Sei que Ele vive, ouve e responde às minhas orações, e não só responde, mas fala comigo e com vocês quando agimos e pedimos com fé.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Batismo do Samuel<\/li>\n<li>Meme em espanhol<\/li>\n<li>Élder Rogers tentando se soltar das braçadeiras (ele mesmo se prendeu 🤡 no fim achamos uma tesoura)<\/li>\n<li>O Élder Rogers e eu de costas? (o Élder Nelson tirou a foto)<\/li>\n<li>meus crocs novos (sim, Ryan, eu gosto deles, não devia ter esperado tanto)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-09-26_0_0.jpg\" alt=\"\"><\/figure><figure class=\"thumb land\"><img src=\"images/2022-09-26_0_1.jpeg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-26_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-26_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-09-26_0_4.jpg\" alt=\"\"><\/figure><figure class=\"thumb port\"><img src=\"images/2022-09-26_0_5.jpeg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full port\"><img src=\"images/extra_369.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_370.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_371.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_372.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_373.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_374.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_375.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_376.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_377.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_378.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_379.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_380.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🌤La tranquilidad antes de la tormenta🌀🌊 Gracias a todos! Tive um bom aniversário na sexta, sim. A maior parte da sexta foi uma reunião para treinadores & élderes em treinamento, mas depois jantamos no Chick-fil-A. Esta semana foi bem divertida e, mesmo que o título diga calmaria antes da tempestade, esta semana pareceu uma tormentita em algumas partes também. A segunda passada à noite foi top demais, pudemos ensinar nossa família brasileira de novo e eles tinham muitas perguntas sobre o plano de salvação (que coincidência, era isso que tínhamos planejado ensinar). Infelizmente nosso membro estava trabalhando e não pôde ir, então a lição foi longa, tentando explicar tudo direitinho no nosso português limitado (Élder Towne & eu), mas eles gostaram. Também demos uns Pokémon pro João, que tem 6 anos! Na terça tivemos um conselho de distrito de fogo e uma divisão com os élderes de South Tampa. Fizemos visitas + batemos portas no caminho de casa e encontramos uma família de membros que tinha acabado de se mudar uma semana antes. Ensinei o Élder Towne & o Élder Rogers a ter uma sessão de planejamento semanal incrível... ou seja, fazer arepas. Brabo demais. Sei lá por que isso não é mais popular. E a melhor parte foi que nosso amigo Samuel finalmente foi batizado ontem! Ele estava esperando havia meses e finalmente estava pronto. Foi um serviço batismal muito bonito e sei que vamos ver muitas coisas boas vindo dele. Na sexta recebemos a notícia do furacão pelo Presidente Gardiner. Então temos nos preparado com água, comida, gasolina etc. Mas vamos ver se estamos preparados de menos ou demais. Meus companheiros e eu vamos ser evacuados do nosso apartamento hoje para a casa da missão em Wesley Chapel. Vamos ver como vai ser o trabalho missionário esta semana. Mateus 6:6 Mas tu, quando orares, entra no teu aposento e, fechando a tua porta, ora a teu Pai que está em secreto; e teu Pai, que vê em secreto, te recompensará publicamente Tenho tentado fazer uma oração em secreto uma vez por dia e isso tem me ajudado muito no meu relacionamento com Deus. Sei que Ele vive, ouve e responde às minhas orações, e não só responde, mas fala comigo e com vocês quando agimos e pedimos com fé. Los amo! Elder Jacobs Fotos: Batismo do Samuel Meme em espanhol Élder Rogers tentando se soltar das braçadeiras (ele mesmo se prendeu 🤡 no fim achamos uma tesoura) O Élder Rogers e eu de costas? (o Élder Nelson tirou a foto) meus crocs novos (sim, Ryan, eu gosto deles, não devia ter esperado tanto) Mais desta semana"}, {"id": "l68", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OUT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌀 Furacão<\/span><\/div>", "cultures": [], "moments": ["Hurricane"], "extra": "", "kind": "Carta 68 · Tampa", "title": "🌀🌩🌧 ČåÇåĐøŘęŞ de Tempestade🏃‍♂️💨", "date": "2022-10-03T12:55:00", "group": "2022-10", "html": "<div class=\"body\"><p>Boa tarde!<\/p>\n<p>Esta semana com certeza foi diferente e abriu meus olhos (não, a gente não saiu correndo atrás da tempestade)<\/p>\n<p>Por causa do furacão 🌀 que estava vindo, fomos evacuados na segunda de manhã da semana passada. Alguns missionários foram mandados para outros apartamentos mais para o interior/norte, para capelas e para a casa da missão. Tive a sorte de ficar na casa da missão com muitos outros missionários e com os Gardiner.<\/p>\n<p>Foi muito estranho ser missionário e ao mesmo tempo estar afastado das atividades normais. Na segunda, depois de irmos para a casa da missão em Wesley Chapel, o dia seguiu normal, mas com ensino online à noite. Na terça também pudemos sair, mas ainda com limites por estarmos evacuados. Servimos as pessoas em Zephyrhills (que, se vocês lembram, é onde comecei minha missão) e fomos a Betmar. Foi divertido e ótimo ajudar os outros a se prepararem para o furacão. Na quarta ficamos trancados em casa, e parte da quinta também, então aqui vai uma lista de coisas que fizemos pra manter um pouco da sanidade:<\/p>\n<ul class=\"bul\">\n<li>falar com os amigos<\/li>\n<li>posts no Facebook &amp; encontrar pessoas<\/li>\n<li>cantar<\/li>\n<li>estudar (espanhol, português e as escrituras)<\/li>\n<li>tech decks<\/li>\n<li>ensinar o Mr.Bingly a deitar e depois tentar rolar<\/li>\n<li>marcar Livros de Mórmon para distribuir<\/li>\n<li>começar a aprender a tocar gaita<\/li>\n<li>jogos de tabuleiro<\/li>\n<li>filme do Joseph Smith<\/li>\n<li>compartilhar escrituras favoritas (a minha é Alma 5:14)<\/li>\n<li>ficar completamente entediado<\/li>\n<\/ul>\n<p>Foi difícil porque nos sentimos totalmente inúteis presos daquele jeito, mas estamos todos seguros, e nossos amigos em Tampa também, já que ele mudou de rota. Mas causou muitos estragos em Lehigh Acres e Fort Myers. Orem pelos membros, amigos e missionários de lá! Estamos hospedando uma dupla de Peace River (zona de Fort Myers) por causa dos danos no apartamento deles.<\/p>\n<p>Voltamos na quinta à tarde e estamos tentando pegar embalo de novo. O tema da nossa zona, Pé no acelerador e sem freio, ficou em pausa #SaiPraLáSatanás<\/p>\n<p>Mas conseguimos voltar ao ritmo e ensinar e encontrar pessoas. A conferência foi top demais. 3 Néfi 5:13<\/p>\n<p>Eis que sou um discípulo de Jesus Cristo, o Filho de Deus. Fui chamado por ele para declarar sua palavra entre seu povo, para que tenha vida eterna.<\/p>\n<p>Essa escritura foi a que me veio à mente quando voltei ao ritmo. Sou um discípulo, chamado por Deus, e não vou desperdiçar nenhum tempo que resta da minha missão. Meus olhos se abriram para o quanto é horrível receber uma mordomia e não conseguir cumpri-la. Todos nós temos a chance de compartilhar nosso testemunho com os outros, como alguns oradores explicaram na conferência.<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>fotos da casa da missão<\/li>\n<li>Tartaruga que salvamos (ela quase me mordeu)<\/li>\n<li>treinamento especializado<\/li>\n<li>estragos perto do nosso apartamento<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-10-03_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-03_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-03_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-03_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-03_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-03_0_5.jpg\" alt=\"\"><\/figure><\/div><div class=\"more\"><div class=\"more-head\"><div class=\"more-h\">Mais desta semana<\/div><div class=\"photos small\"><figure class=\"full land\"><img src=\"images/extra_381.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_382.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_383.jpg\" alt=\"\"><\/figure><\/div><\/div><div class=\"photos small rest\"><figure class=\"full port\"><img src=\"images/extra_384.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_385.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_386.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_387.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_388.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_389.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_390.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_391.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_392.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_393.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_394.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_395.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_396.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_397.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/extra_398.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_399.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_400.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_401.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_402.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_403.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_404.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/extra_405.jpg\" alt=\"\"><\/figure><\/div><\/div>", "text": "🌀🌩🌧 ČåÇåĐøŘęŞ de Tempestade🏃‍♂️💨 Boa tarde! Esta semana com certeza foi diferente e abriu meus olhos (não, a gente não saiu correndo atrás da tempestade) Por causa do furacão 🌀 que estava vindo, fomos evacuados na segunda de manhã da semana passada. Alguns missionários foram mandados para outros apartamentos mais para o interior/norte, para capelas e para a casa da missão. Tive a sorte de ficar na casa da missão com muitos outros missionários e com os Gardiner. Foi muito estranho ser missionário e ao mesmo tempo estar afastado das atividades normais. Na segunda, depois de irmos para a casa da missão em Wesley Chapel, o dia seguiu normal, mas com ensino online à noite. Na terça também pudemos sair, mas ainda com limites por estarmos evacuados. Servimos as pessoas em Zephyrhills (que, se vocês lembram, é onde comecei minha missão) e fomos a Betmar. Foi divertido e ótimo ajudar os outros a se prepararem para o furacão. Na quarta ficamos trancados em casa, e parte da quinta também, então aqui vai uma lista de coisas que fizemos pra manter um pouco da sanidade: falar com os amigos posts no Facebook & encontrar pessoas cantar estudar (espanhol, português e as escrituras) tech decks ensinar o Mr.Bingly a deitar e depois tentar rolar marcar Livros de Mórmon para distribuir começar a aprender a tocar gaita jogos de tabuleiro filme do Joseph Smith compartilhar escrituras favoritas (a minha é Alma 5:14) ficar completamente entediado Foi difícil porque nos sentimos totalmente inúteis presos daquele jeito, mas estamos todos seguros, e nossos amigos em Tampa também, já que ele mudou de rota. Mas causou muitos estragos em Lehigh Acres e Fort Myers. Orem pelos membros, amigos e missionários de lá! Estamos hospedando uma dupla de Peace River (zona de Fort Myers) por causa dos danos no apartamento deles. Voltamos na quinta à tarde e estamos tentando pegar embalo de novo. O tema da nossa zona, Pé no acelerador e sem freio, ficou em pausa #SaiPraLáSatanás Mas conseguimos voltar ao ritmo e ensinar e encontrar pessoas. A conferência foi top demais. 3 Néfi 5:13 Eis que sou um discípulo de Jesus Cristo, o Filho de Deus. Fui chamado por ele para declarar sua palavra entre seu povo, para que tenha vida eterna. Essa escritura foi a que me veio à mente quando voltei ao ritmo. Sou um discípulo, chamado por Deus, e não vou desperdiçar nenhum tempo que resta da minha missão. Meus olhos se abriram para o quanto é horrível receber uma mordomia e não conseguir cumpri-la. Todos nós temos a chance de compartilhar nosso testemunho com os outros, como alguns oradores explicaram na conferência. Los amo! Elder Jacobs Fotos: fotos da casa da missão Tartaruga que salvamos (ela quase me mordeu) treinamento especializado estragos perto do nosso apartamento Mais desta semana"}, {"id": "l69", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OUT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><\/div>", "cultures": ["VE"], "moments": [], "extra": "Venezuela", "kind": "Carta 69 · Tampa", "title": "🌀Mãos 🤝 que Ajudam & mais!🤠", "date": "2022-10-10T12:36:00", "group": "2022-10", "html": "<div class=\"body\"><p>Buenas tardes a todos!<\/p>\n<p>Fue una semana llena de sorpresas y bendiciones!<\/p>\n<p>Esta semana foi muito incrível e cheia de ação por vários motivos e acontecimentos. Uma coisa que aprendi foi sobre não dar valor às coisas. Coisas como uma semana normal de missionário cheia de ensino, uma casa com energia e água encanada, comida caseira etc. Nossa semana foi boa e fizemos muita coisa, mas foi diferente das outras.<\/p>\n<p>Tivemos conferência de zona esta semana, a primeira do Presidente Gardiner, e foi incrível. Focamos em PME (Pregar Meu Evangelho) e no Livro de Mórmon, o que levou a um jogo de Jeopardy com os 2.<\/p>\n<p>Tivemos dificuldade em marcar lições e fazer elas realmente acontecerem, o que levou a bater portas e fazer visitas, mas mesmo assim não deu muita coisa. Com certeza vamos tentar fazer tudo andar esta semana.<\/p>\n<p>Furou um pneu esta semana enquanto estávamos com o Élder Moon 🌙 🌚 Foi divertido porque rendeu umas conversas legais fazendo contatos na rua, andando por aí enquanto esperávamos a Pep Boys terminar. Ensinamos 2 lições em inglês e foi difícil jaja; com certeza não estou acostumado (minha estrutura de frases em inglês tá 🆘️) e tem um motivo pra eu ter sido chamado pra ensinar em espanhol 😅 Tivemos de novo uma lição de leitura das escrituras de fogo com os Franco esta semana e ganhamos mais um prato da Venezuela 🇻🇪, mas esse era um aperitivo que ela inventou do nada! Tostadas, meio que esqueci de tirar foto de tão bom que estava. Também corremos de um lado pro outro nos preparando para o serviço de sábado!<\/p>\n<p>A gente não fazia ideia do que devia levar porque não sabíamos que tipo de trabalho íamos fazer. Nos juntamos à nossa ala às 4h30 da manhã e formamos nossa equipe do Mãos que Ajudam com 16 pessoas (no sábado, mas só 7 no domingo, já que a maioria não ficou) e fomos colocados no serviço das árvores. Nos divertimos muito detonando as árvores com os membros. Eles simplesmente não ligam pra nada e enlouquecem com motosserras e outros jeitos de derrubar e arrastar as árvores pra ajudar a limpar o quintal das pessoas. Fiquei bem queimado de sol e com o corpo bem cansado, então hoje foi bom pra descansar. Acampamos à noite (coisa que a maioria dos missionários não pode dizer) e voltamos por volta das 17h.<\/p>\n<p>Aproveitem esta escritura e a semana de vocês!<\/p>\n<p>D&amp;C 111<\/p>\n<p>6 Não vos preocupeis com Sião, porque eu a tratarei com misericórdia.<\/p>\n<p>7 Permanecei neste lugar e nas regiões circunvizinhas;<\/p>\n<p>8 E o lugar onde é minha vontade que permaneçais, principalmente, ser-vos-á indicado pela paz e pelo poder de meu Espírito, que fluirá para vós<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>coisas de árvore<\/li>\n<li>sapo<\/li>\n<li>Nemo<\/li>\n<li>pneu furado<\/li>\n<li>tirando lama<\/li>\n<li>acampando<\/li>\n<\/ul><\/div><div class=\"photos\"><f nha estrutura de frases em inglês tá 🆘️) e tem um motivo pra eu ter sido chamado pra ensinar em espanhol 😅 Tivemos de novo uma lição de leitura das escrituras de fogo com os Franco esta semana e ganhamos mais um prato da Venezuela 🇻🇪, mas esse era um aperitivo que ela inventou do nada! Tostadas, meio que esqueci de tirar foto de tão bom que estava. Também corremos de um lado pro outro nos preparando para o serviço de sábado! A gente não fazia ideia do que devia levar porque não sabíamos que tipo de trabalho íamos fazer. Nos juntamos à nossa ala às 4h30 da manhã e formamos nossa equipe do Mãos que Ajudam com 16 pessoas (no sábado, mas só 7 no domingo, já que a maioria não ficou) e fomos colocados no serviço das árvores. Nos divertimos muito detonando as árvores com os membros. Eles simplesmente não ligam pra nada e enlouquecem com motosserras e outros jeitos de derrubar e arrastar as árvores pra ajudar a limpar o quintal das pessoas. Fiquei bem queimado de sol e com o corpo bem cansado, então hoje foi bom pra descansar. Acampamos à noite (coisa que a maioria dos missionários não pode dizer) e voltamos por volta das 17h. Aproveitem esta escritura e a semana de vocês! D&C 111 6 Não vos preocupeis com Sião, porque eu a tratarei com misericórdia. 7 Permanecei neste lugar e nas regiões circunvizinhas; 8 E o lugar onde é minha vontade que permaneçais, principalmente, ser-vos-á indicado pela paz e pelo poder de meu Espírito, que fluirá para vós Los amo, Elder Jacobs Fotos: coisas de árvore sapo Nemo pneu furado tirando lama acampando"}, {"id": "l70", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OUT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"PE\">🇵🇪 Peru<\/span><span class=\"stamp c\" data-c=\"HT\">🇭🇹 Haiti<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">⛪ Templo<\/span><\/div>", "cultures": ["VE", "PE", "HT"], "moments": ["Baptism", "Temple"], "extra": "Venezuela Peru Haiti", "kind": "Carta 70 · Tampa", "title": "🇻🇪🎊🎉🎈Aniversários & novos amigos 🇭🇳🇵🇪", "date": "2022-10-17T11:51:00", "group": "2022-10", "html": "<div class=\"body\"><p>Que ondan payasos<\/p>\n<p>Todo bien aquí, milagros y bautismos muy pronto!<\/p>\n<p>Esta semana fizemos muito trabalho com referências, tentando ver quantas realmente estão disponíveis e interessadas nas mensagens, e isso nos levou a encontrar o Darwín &amp; o Luis.<\/p>\n<p>O Darwín é super incrível, muito gentil e engraçado. Ele é de Honduras 🇭🇳 e viu algo diferente nos Élderes de inglês, e aí a gente foi convidado pra casa dele. Ensinamos ele 2 vezes essa semana e estou animado pra ver o progresso dele. Orem pra ele encontrar um jeito de conseguir ir à igreja.<\/p>\n<p>O Luis é do Peru 🇵🇪, também bem jovem e muito educado. Já sabe um monte sobre a igreja de ver o templo, os missionários etc. lá no Peru. Ensinamos ele 2 vezes essa semana e estamos trabalhando com ele pra que perceba que a igreja é mais importante que mais trabalho.<\/p>\n<p>Reformamos o apartamento inteiro porque agora os élderes de crioulo moram com a gente. Foi meio frustrante no começo, principalmente antes de acontecer, mas agora parece tão certo e é divertido ter eles lá. Dica de missão: morar com mais élderes = comprar no atacado = no geral menos $ gasto = 🏆 ✌️<\/p>\n<p>Fiz umas divisões essa semana com Élderes do meu distrito e foi super divertido (divertido demais pra tirar fotos, foi mal, tô tentando tirar mais)<\/p>\n<p>Nosso distrito se esforçou muito essa semana pra ensinar bem mais e fazer 1 lição com membro presente (MPL) por dia, porque um MPL por dia mantém o DL (líder de distrito = eu) longe. Muitos milagres vieram disso.<\/p>\n<p>Fomos ensinar nossa família venezuelana, e acabou sendo uma festa de aniversário também. Cantamos, comemos muita comida e falamos sobre a família eterna por meio do batismo e do templo (eles disseram sim, logo contamos o dia pra vocês!). Nossos outros amigos estão indo bem, pensando no batismo, então por favor orem por eles e pelos testemunhos deles. E também por proteção, empregos e saúde (todas essas coisas boas)<\/p>\n<p>Tenho amado reestudar a conferência geral e convido vocês a fazerem o mesmo. Aqui vai um discurso favorito do momento: Este Dia, do Élder Rasband<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2022/10/17rasband?lang=eng<\/p>\n<p>Última semana da transferência, bora!<\/p>\n<p class=\"sign\">Los amo,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Festa de aniversário venezuelana<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-10-17_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-17_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "🇻🇪🎊🎉🎈Aniversários & novos amigos 🇭🇳🇵🇪 Que ondan payasos Todo bien aquí, milagros y bautismos muy pronto! Esta semana fizemos muito trabalho com referências, tentando ver quantas realmente estão disponíveis e interessadas nas mensagens, e isso nos levou a encontrar o Darwín & o Luis. O Darwín é super incrível, muito gentil e engraçado. Ele é de Honduras 🇭🇳 e viu algo diferente nos Élderes de inglês, e aí a gente foi convidado pra casa dele. Ensinamos ele 2 vezes essa semana e estou animado pra ver o progresso dele. Orem pra ele encontrar um jeito de conseguir ir à igreja. O Luis é do Peru 🇵🇪, também bem jovem e muito educado. Já sabe um monte sobre a igreja de ver o templo, os missionários etc. lá no Peru. Ensinamos ele 2 vezes essa semana e estamos trabalhando com ele pra que perceba que a igreja é mais importante que mais trabalho. Reformamos o apartamento inteiro porque agora os élderes de crioulo moram com a gente. Foi meio frustrante no começo, principalmente antes de acontecer, mas agora parece tão certo e é divertido ter eles lá. Dica de missão: morar com mais élderes = comprar no atacado = no geral menos $ gasto = 🏆 ✌️ Fiz umas divisões essa semana com Élderes do meu distrito e foi super divertido (divertido demais pra tirar fotos, foi mal, tô tentando tirar mais) Nosso distrito se esforçou muito essa semana pra ensinar bem mais e fazer 1 lição com membro presente (MPL) por dia, porque um MPL por dia mantém o DL (líder de distrito = eu) longe. Muitos milagres vieram disso. Fomos ensinar nossa família venezuelana, e acabou sendo uma festa de aniversário também. Cantamos, comemos muita comida e falamos sobre a família eterna por meio do batismo e do templo (eles disseram sim, logo contamos o dia pra vocês!). Nossos outros amigos estão indo bem, pensando no batismo, então por favor orem por eles e pelos testemunhos deles. E também por proteção, empregos e saúde (todas essas coisas boas) Tenho amado reestudar a conferência geral e convido vocês a fazerem o mesmo. Aqui vai um discurso favorito do momento: Este Dia, do Élder Rasband https://www.churchofjesuschrist.org/study/general-conference/2022/10/17rasband?lang=eng Última semana da transferência, bora! Los amo, Elder Jacobs Fotos: Festa de aniversário venezuelana"}, {"id": "l71", "area": 7, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">TAMPA, FL<\/span><span class=\"pm-d\">OUT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><\/div>", "cultures": ["BR"], "moments": [], "extra": "Brazil", "kind": "Carta 71 · Tampa", "title": "Entããão, é... agora eu sou um 🧍‍♂️criador de conteúdo do Facebook 💫", "date": "2022-10-24T08:11:00", "group": "2022-10", "html": "<div class=\"body\"><p>Buenos días amigos!<\/p>\n<p>Essa foi a última semana da transferência e foi incrível demais! Meus companheiros e eu crescemos muito juntos e nos divertimos muito! Muito grato pelo meu tempo com eles.<\/p>\n<p>O que acho que dá a entender que meu reinado de terror sobre Tampa acabou. Vou reabrir Largo Sp (para Élderes) com o Élder LuTu! Estou animado pra voltar pra um dos meus lugares favoritos e com um querido amigo/filho de missão. O Élder Towne é o único que fica, mas logo vai pro Brasil 🇧🇷. O Élder Rogers vai pra Dade City com o Élder Dean. Enfim, vamos falar do resto da semana<\/p>\n<p>Tivemos nosso último conselho de distrito, que foi divertido, e eu sinceramente achava no começo que ia ter pouca mudança, principalmente na minha dupla, mas tem bastante. Fizemos 2 divisões essa semana: uma com South Tampa e a outra com os Líderes de Zona. Todos Élderes fenomenais.<\/p>\n<p>Não vou ser líder de distrito na próxima transferência, mas não é por castigo nem nada; como missionários recebemos oportunidades de aprender e outra pessoa precisa disso mais agora. Eu amei, mas também estou feliz de ter mais tempo pra focar na minha área. Batemos muitas portas essa semana, principalmente preparando o futuro, já que a maioria das pessoas estava ocupada e não podia conversar na hora.<\/p>\n<p>Recebemos uma ligação de uns membros de New Jersey que estavam de visita e precisavam de bênçãos, então tivemos a oportunidade de fazer isso. Eles também têm umas indicações pra gente aqui!<\/p>\n<p>Sobre o título do e-mail: sim, você leu certo. De algum jeito eu tenho ido bem no Facebook com meus posts do Evangelho meio de vez em quando, a ponto de o Facebook agora estar divulgando minhas coisas como criador de conteúdo, e isso pode me ajudar a alcançar mais pessoas! Então estou animado e aberto a qualquer ideia de post pra continuar tentando coligar Israel. Uma última coisa dessa semana antes do pensamento espiritual:<\/p>\n<p>A gente acorda domingo de manhã, faz nossa rotina normal, sai cedo pro conselho da ala e então... Nosso bendito carro SUMIU<\/p>\n<p>Acontece que existe um adesivo de permissão obrigatório que a gente não sabia e que não estava no nosso carro, já que ele é tão novo. E olha que eu moro nesse condomínio com esse carro há 3 transferências (18 semanas, quase 5 meses). No fim um membro buscou a gente e o Élder Tucker (nosso coordenador de veículos) conseguiu pegar o carro no pátio do guincho, mas que jeito de começar o dia. Uma coisa que aprendi e quero compartilhar dessas transferências aqui em Tampa como treinador e líder de distrito é que o Senhor nos conhece, nos chamou e nos capacita.<\/p>\n<p>Eu não sabia tudo sobre ser líder de distrito, sobre a área nova, nem como treinar exatamente de acordo com as necessidades dos meus companheiros. Cometi erros, mas como fui colocado nessa zona de crescimento, me sentindo desconfortável, cresci muito mais do que teria crescido sem isso.<\/p>\n<p>Sejam gentis com vocês mesmos! Deus vai ajudar vocês! A Expiação é o caminho!<\/p>\n<p class=\"sign\">Los amo mucho! Hasta que esté en mi área nueva!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>sid<\/li>\n<li>Marketplace engraçado do Facebook<\/li>\n<li>Preparando a chamada da zona<\/li>\n<li>meme<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-10-24_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-24_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-24_0_2.jpg\" alt=\"\"><\/figure><\/div>", "text": "Entããão, é... agora eu sou um 🧍‍♂️criador de conteúdo do Facebook 💫 Buenos días amigos! Essa foi a última semana da transferência e foi incrível demais! Meus companheiros e eu crescemos muito juntos e nos divertimos muito! Muito grato pelo meu tempo com eles. O que acho que dá a entender que meu reinado de terror sobre Tampa acabou. Vou reabrir Largo Sp (para Élderes) com o Élder LuTu! Estou animado pra voltar pra um dos meus lugares favoritos e com um querido amigo/filho de missão. O Élder Towne é o único que fica, mas logo vai pro Brasil 🇧🇷. O Élder Rogers vai pra Dade City com o Élder Dean. Enfim, vamos falar do resto da semana Tivemos nosso último conselho de distrito, que foi divertido, e eu sinceramente achava no começo que ia ter pouca mudança, principalmente na minha dupla, mas tem bastante. Fizemos 2 divisões essa semana: uma com South Tampa e a outra com os Líderes de Zona. Todos Élderes fenomenais. Não vou ser líder de distrito na próxima transferência, mas não é por castigo nem nada; como missionários recebemos oportunidades de aprender e outra pessoa precisa disso mais agora. Eu amei, mas também estou feliz de ter mais tempo pra focar na minha área. Batemos muitas portas essa semana, principalmente preparando o futuro, já que a maioria das pessoas estava ocupada e não podia conversar na hora. Recebemos uma ligação de uns membros de New Jersey que estavam de visita e precisavam de bênçãos, então tivemos a oportunidade de fazer isso. Eles também têm umas indicações pra gente aqui! Sobre o título do e-mail: sim, você leu certo. De algum jeito eu tenho ido bem no Facebook com meus posts do Evangelho meio de vez em quando, a ponto de o Facebook agora estar divulgando minhas coisas como criador de conteúdo, e isso pode me ajudar a alcançar mais pessoas! Então estou animado e aberto a qualquer ideia de post pra continuar tentando coligar Israel. Uma última coisa dessa semana antes do pensamento espiritual: A gente acorda domingo de manhã, faz nossa rotina normal, sai cedo pro conselho da ala e então... Nosso bendito carro SUMIU Acontece que existe um adesivo de permissão obrigatório que a gente não sabia e que não estava no nosso carro, já que ele é tão novo. E olha que eu moro nesse condomínio com esse carro há 3 transferências (18 semanas, quase 5 meses). No fim um membro buscou a gente e o Élder Tucker (nosso coordenador de veículos) conseguiu pegar o carro no pátio do guincho, mas que jeito de começar o dia. Uma coisa que aprendi e quero compartilhar dessas transferências aqui em Tampa como treinador e líder de distrito é que o Senhor nos conhece, nos chamou e nos capacita. Eu não sabia tudo sobre ser líder de distrito, sobre a área nova, nem como treinar exatamente de acordo com as necessidades dos meus companheiros. Cometi erros, mas como fui colocado nessa zona de crescimento, me sentindo desconfortável, cresci muito mais do que teria crescido sem isso. Sejam gentis com vocês mesmos! Deus vai ajudar vocês! A Expiação é o caminho! Los amo mucho! Hasta que esté en mi área nueva! Élder Jacobo Fotos: sid Marketplace engraçado do Facebook Preparando a chamada da zona meme"}, {"id": "l72", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">OUT 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": [], "moments": ["Baptism"], "extra": "", "kind": "Carta 72 · Largo", "title": "👻 Feliz Halloween 🎃", "date": "2022-10-31T13:49:00", "group": "2022-10", "html": "<div class=\"body\"><p>🧟‍♂️🤺¡Feliz noche de brujas!🧛‍♀️🥷<\/p>\n<p>Estou trabalhando duro aqui em Largo e tudo vai muito bem!<\/p>\n<p>Essa semana foi sinceramente desanimadora no começo, mas as coisas estão melhorando! As transferências foram na terça e percebemos que isso ia ser muito mais difícil do que a gente imaginava. Morando em Gulfport (o cantinho de Saint Pete), dividindo carro, e numa área quase morta.<\/p>\n<p>Quando saí de Largo, estava cheia de amigos e com muito trabalho pra fazer. Agora parece que estamos trabalhando a partir de uma base quase vazia.<\/p>\n<p>Por sorte, temos uns membros monstros que estavam doidos pra que os Élderes voltassem e já começaram a trabalhar a todo vapor com a gente. Ainda tem muito trabalho pra fazer, mas estamos conseguindo mais amigos aos poucos e nos esforçando bastante pra fortalecer o relacionamento com os membros.<\/p>\n<p>Tivemos nosso festival de outono &amp; trunk or treat e a Conferência de Estaca. As duas atividades foram muito divertidas, com um pouco de correria pra garantir que tudo estivesse certo. Olha só a foto do porta-malas!<\/p>\n<p>A última coisa, que fez minha semana de verdade, foi o domingo. No domingo, depois da Conferência de Estaca, fomos pra Tampa. Minha amiga Yolennis foi batizada e queria que eu batizasse ela! Foi incrível demais e uma experiência muito especial. Mas o domingo não acabou aí!<\/p>\n<p>Também vi outros amigos/membros e consegui me despedir pessoalmente. O Hugo estava lá e tinha sofrido um acidente no trabalho; eu estava lá por causa do batismo e também consegui estar presente pra ele.<\/p>\n<p>Depois consegui passar na casa da família Franco e me despedir deles também. Só uma corrente de milagres de Deus me permitindo estar presente para os amigos antes de ficar 100% em St. Pete.<\/p>\n<p>Mosias 24<\/p>\n<p>12 E Alma e seu povo não levantaram a voz ao Senhor seu Deus, mas derramaram o coração diante dele; e ele conhecia os pensamentos de seu coração.<\/p>\n<p>13 E aconteceu que a voz do Senhor chegou a eles em suas aflições, dizendo: Levantai a cabeça e tende bom ânimo, pois conheço o convênio que fizestes comigo; e farei convênio com meu povo e livrá-lo-ei do cativeiro.<\/p>\n<p>14 E também aliviarei as cargas que são postas sobre vossos ombros, de modo que nem mesmo as podereis sentir sobre vossas costas, mesmo enquanto estiverdes no cativeiro; e isto farei para que daqui por diante sejais minhas testemunhas e para que saibais com certeza que eu, o Senhor Deus, visito meu povo em suas aflições.<\/p>\n<p>Por meio de nós e de outras pessoas, Deus visita nossos amigos e a nós em nossas aflições. Confiem nele!<\/p>\n<p class=\"sign\">Los amo muito!<\/p>\n<p>Élder Jacobo<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Gyro<\/li>\n<li>Élder Chevy<\/li>\n<li>Élder Owen &amp; nós<\/li>\n<li>Élder LuTu &amp; eu juntos de novo!<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-10-31_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-10-31_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-31_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-10-31_0_3.jpg\" alt=\"\"><\/figure><\/div>", "text": "👻 Feliz Halloween 🎃 🧟‍♂️🤺¡Feliz noche de brujas!🧛‍♀️🥷 Estou trabalhando duro aqui em Largo e tudo vai muito bem! Essa semana foi sinceramente desanimadora no começo, mas as coisas estão melhorando! As transferências foram na terça e percebemos que isso ia ser muito mais difícil do que a gente imaginava. Morando em Gulfport (o cantinho de Saint Pete), dividindo carro, e numa área quase morta. Quando saí de Largo, estava cheia de amigos e com muito trabalho pra fazer. Agora parece que estamos trabalhando a partir de uma base quase vazia. Por sorte, temos uns membros monstros que estavam doidos pra que os Élderes voltassem e já começaram a trabalhar a todo vapor com a gente. Ainda tem muito trabalho pra fazer, mas estamos conseguindo mais amigos aos poucos e nos esforçando bastante pra fortalecer o relacionamento com os membros. Tivemos nosso festival de outono & trunk or treat e a Conferência de Estaca. As duas atividades foram muito divertidas, com um pouco de correria pra garantir que tudo estivesse certo. Olha só a foto do porta-malas! A última coisa, que fez minha semana de verdade, foi o domingo. No domingo, depois da Conferência de Estaca, fomos pra Tampa. Minha amiga Yolennis foi batizada e queria que eu batizasse ela! Foi incrível demais e uma experiência muito especial. Mas o domingo não acabou aí! Também vi outros amigos/membros e consegui me despedir pessoalmente. O Hugo estava lá e tinha sofrido um acidente no trabalho; eu estava lá por causa do batismo e também consegui estar presente pra ele. Depois consegui passar na casa da família Franco e me despedir deles também. Só uma corrente de milagres de Deus me permitindo estar presente para os amigos antes de ficar 100% em St. Pete. Mosias 24 12 E Alma e seu povo não levantaram a voz ao Senhor seu Deus, mas derramaram o coração diante dele; e ele conhecia os pensamentos de seu coração. 13 E aconteceu que a voz do Senhor chegou a eles em suas aflições, dizendo: Levantai a cabeça e tende bom ânimo, pois conheço o convênio que fizestes comigo; e farei convênio com meu povo e livrá-lo-ei do cativeiro. 14 E também aliviarei as cargas que são postas sobre vossos ombros, de modo que nem mesmo as podereis sentir sobre vossas costas, mesmo enquanto estiverdes no cativeiro; e isto farei para que daqui por diante sejais minhas testemunhas e para que saibais com certeza que eu, o Senhor Deus, visito meu povo em suas aflições. Por meio de nós e de outras pessoas, Deus visita nossos amigos e a nós em nossas aflições. Confiem nele! Los amo muito! Élder Jacobo Fotos: Gyro Élder Chevy Élder Owen & nós Élder LuTu & eu juntos de novo!"}, {"id": "l73", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">🌊 Batismo<\/span><\/div>", "cultures": ["BR", "WS"], "moments": ["Baptism"], "extra": "Brazil Samoa", "kind": "Carta 73 · Largo", "title": "Ralando na busca & milagres", "date": "2022-11-07T12:45:00", "group": "2022-11", "html": "<div class=\"body\"><p>Talofa!<\/p>\n<p>Mais uma semana em Largo e essa foi bem melhor! A gente ainda tem feito principalmente busca, mas estamos vendo algum progresso.<\/p>\n<p>Também comecei a aprender um pouco de samoano 🇼🇸 🇦🇸 com o Élder Lutu, o que tem sido um desafiozinho divertido. Percebemos que fomos colocados juntos por muitos motivos (muitos ainda a descobrir), mas um dos principais são as línguas e culturas. Falamos inglês e espanhol, eu também falo português e ele fala samoano, então estamos nos conectando com muita gente: latinos, brasileiros e polinésios. Esperamos que, trabalhando com os membros de cada ala e falando com todo mundo, a Zona vá bombar e a obra progrida demais!<\/p>\n<p>Segunda foi Halloween e, diferente do ano passado em que ficamos em casa, tivemos um desafio de busca. A gente ainda voltou mais cedo que o normal, mas teve um desafio entre as zonas e a missão inteira pra ver quem encontrava mais pessoas. Nossa Zona ganhou da Zona de Ocala, mas o campeão geral foi Lakeland. Também jogamos pickleball mais cedo como distrito, fantasiados de Halloween, no P-day. Terça foi nosso primeiro conselho de distrito e conseguimos definir metas e conhecer os outros missionários. Essa transferência vai ser incrível. Também fiz divisão com o Élder Inkley, que foi uma festa. Temos feito muita busca, como já falei, o que nos levou a passar muitas indicações, mas também a encontrar uma família na nossa área! Com certeza um milagre. Aos poucos estamos conhecendo melhor os membros compartilhando mensagens, mas deve dar mais resultado essa semana, já que mais pessoas vão estar disponíveis.<\/p>\n<p>Encontrei uma das nossas amigas pelo Facebook, o que foi legal, já que normalmente parece que postar não adianta nada, e ela está muito interessada em aprender agora. Conto pra vocês sobre a Yanet semana que vem, depois da nossa próxima lição.<\/p>\n<p>A última coisa grande dessa semana foi o funeral. O marido da Hermana Januaria faleceu aos 62 anos; foi bem repentino e chocante pra família, então por favor orem por eles. Tivemos um serviço muito bonito pra ele no sábado, mas eles ainda têm muita cura pela frente.<\/p>\n<p>A oração foi nossa arma secreta essa semana. Oramos pedindo ajuda, pra encontrar pessoas, dons espirituais etc. E eles vêm, desde que a gente faça a nossa parte e os busque.<\/p>\n<p>D&amp;C 46<\/p>\n<p>8 Portanto, acautelai-vos para que não sejais enganados; e para que não sejais enganados, buscai diligentemente os melhores dons, lembrando-vos sempre do propósito para o qual são dados;<\/p>\n<p>9 Pois em verdade vos digo que são dados para o benefício dos que me amam e guardam todos os meus mandamentos e daquele que procura fazê-lo; para que sejam beneficiados todos os que buscam ou pedem a mim, que pedem e não por um sinal, para que o consumam em suas concupiscências.<\/p>\n<p>10 E também, em verdade vos digo que quero que sempre vos lembreis e sempre conserveis em vossa mente quais são esses dons que são dados à igreja<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p>Élder Iacopo<\/p>\n<p>P.S. a gente estava se perguntando como ia batizar alguém, já que não sabíamos se tínhamos alguém firme, mas aí recebemos uma indicação que já tem data! Estamos super animados e muito abençoados pelo Pai Celestial<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>lagarto numa cama de folhas<\/li>\n<li>ralando no Facebook<\/li>\n<li>Élder Owen e uns pássaros jaja<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-11-07_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-07_0_1.jpg\" alt=\"\"><\/figure><\/div>", "text": "Ralando na busca & milagres Talofa! Mais uma semana em Largo e essa foi bem melhor! A gente ainda tem feito principalmente busca, mas estamos vendo algum progresso. Também comecei a aprender um pouco de samoano 🇼🇸 🇦🇸 com o Élder Lutu, o que tem sido um desafiozinho divertido. Percebemos que fomos colocados juntos por muitos motivos (muitos ainda a descobrir), mas um dos principais são as línguas e culturas. Falamos inglês e espanhol, eu também falo português e ele fala samoano, então estamos nos conectando com muita gente: latinos, brasileiros e polinésios. Esperamos que, trabalhando com os membros de cada ala e falando com todo mundo, a Zona vá bombar e a obra progrida demais! Segunda foi Halloween e, diferente do ano passado em que ficamos em casa, tivemos um desafio de busca. A gente ainda voltou mais cedo que o normal, mas teve um desafio entre as zonas e a missão inteira pra ver quem encontrava mais pessoas. Nossa Zona ganhou da Zona de Ocala, mas o campeão geral foi Lakeland. Também jogamos pickleball mais cedo como distrito, fantasiados de Halloween, no P-day. Terça foi nosso primeiro conselho de distrito e conseguimos definir metas e conhecer os outros missionários. Essa transferência vai ser incrível. Também fiz divisão com o Élder Inkley, que foi uma festa. Temos feito muita busca, como já falei, o que nos levou a passar muitas indicações, mas também a encontrar uma família na nossa área! Com certeza um milagre. Aos poucos estamos conhecendo melhor os membros compartilhando mensagens, mas deve dar mais resultado essa semana, já que mais pessoas vão estar disponíveis. Encontrei uma das nossas amigas pelo Facebook, o que foi legal, já que normalmente parece que postar não adianta nada, e ela está muito interessada em aprender agora. Conto pra vocês sobre a Yanet semana que vem, depois da nossa próxima lição. A última coisa grande dessa semana foi o funeral. O marido da Hermana Januaria faleceu aos 62 anos; foi bem repentino e chocante pra família, então por favor orem por eles. Tivemos um serviço muito bonito pra ele no sábado, mas eles ainda têm muita cura pela frente. A oração foi nossa arma secreta essa semana. Oramos pedindo ajuda, pra encontrar pessoas, dons espirituais etc. E eles vêm, desde que a gente faça a nossa parte e os busque. D&C 46 8 Portanto, acautelai-vos para que não sejais enganados; e para que não sejais enganados, buscai diligentemente os melhores dons, lembrando-vos sempre do propósito para o qual são dados; 9 Pois em verdade vos digo que são dados para o benefício dos que me amam e guardam todos os meus mandamentos e daquele que procura fazê-lo; para que sejam beneficiados todos os que buscam ou pedem a mim, que pedem e não por um sinal, para que o consumam em suas concupiscências. 10 E também, em verdade vos digo que quero que sempre vos lembreis e sempre conserveis em vossa mente quais são esses dons que são dados à igreja Los amo! Élder Iacopo P.S. a gente estava se perguntando como ia batizar alguém, já que não sabíamos se tínhamos alguém firme, mas aí recebemos uma indicação que já tem data! Estamos super animados e muito abençoados pelo Pai Celestial Fotos: lagarto numa cama de folhas ralando no Facebook Élder Owen e uns pássaros jaja"}, {"id": "l74", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"MX\">🇲🇽 México<\/span><span class=\"stamp c\" data-c=\"BR\">🇧🇷 Brasil<\/span><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": ["MX", "BR", "WS"], "moments": ["Holidays"], "extra": "Mexico Brazil Samoa", "kind": "Carta 74 · Largo", "title": "⚡️Faíscas voando, 🤯milagres chegando, e a gente só vivendo 🤙", "date": "2022-11-14T13:43:00", "group": "2022-11", "html": "<div class=\"body\"><p>Manuia Soifua!<\/p>\n<p>Tarde abençoada/Boa tarde!<\/p>\n<p>Sim, ainda estou aprendendo samoano, mas é isso: tem que achar coisas de que você gosta e mostrar seu amor pelos outros. A cultura é muito importante pra muita gente: América Latina, brasileiros, polinésios e até as pequenas tradições de família (como os biscoitos da família Jacobs no Natal). Tudo isso é importante pra quem nós somos!<\/p>\n<p>Somos filhos de Deus<\/p>\n<p>Filhos do convênio<\/p>\n<p>Discípulos de Jesus, o Cristo<\/p>\n<p>2 Néfi 25:<\/p>\n<p>26 E falamos de Cristo, regozijamo-nos em Cristo, pregamos a Cristo, profetizamos de Cristo e escrevemos de acordo com nossas profecias, para que nossos filhos saibam em que fonte procurar a remissão de seus pecados Fa'afetai!<\/p>\n<p>Obrigado!<\/p>\n<p>Enfim, vamos pra essa semana...<\/p>\n<p>Na terça tivemos mais um conselho de distrito e terminamos com sushi no Sushi Kabuki. Depois tivemos uma divisão top com o Élder Devere, das mídias sociais. Foi incrível ver como continuar aplicando isso no trabalho missionário e fazer crescer minha &quot;agenda de área pessoal&quot;, ou seja, pessoas que foram atraídas ao Evangelho por eu ser eu mesmo online.<\/p>\n<p>Essa semana estamos fazendo um #becausehegave #PorqueÉlnosdio pra espalhar gratidão e pensamentos edificantes. Me avisem se quiserem participar comigo que eu mando uns conteúdos prontos pra vocês começarem!<\/p>\n<p>Temos um amigo novo e empolgado chamado Javi, que sabe muito sobre a Bíblia e foi muito receptivo ao Livro de Mórmon. Fiquem ligados semana que vem e nas próximas lições.<\/p>\n<p>Faíscas está no título por causa de uns problemas com a secadora... nossa secadora quebrou do nada e fez a gente ter que secar as roupas no varal por um tempo. O problema da secadora era uma tomada ruim, que foi descoberta pelo Élder Hammond (nosso coordenador de moradia) e por mim quando saíram faíscas da tomada enquanto eu varria os bolos de poeira 🐰, por sorte ninguém se queimou 😉 Nosso grande milagre dessa semana começou quinta à noite com visitas rápidas. Estávamos procurando um membro, mas sem sorte; quando estávamos indo embora, deixamos um cartão de divulgação num dos carros, mas eu senti que precisávamos colocar nos dois carros, o que fez a gente receber uma mensagem no dia seguinte do Fermin. Ele já tinha conversado com missionários na Espanha, mas não desse jeito; nosso cartão pareceu tocar ele de verdade e ele queria conversar. Compartilhamos a Restauração do Evangelho e ele está muito interessado em aprender mais com a gente e com os próprios estudos. Seguir o Espírito é incrível.<\/p>\n<p>Comemos umas comidas incríveis no restaurante de uns membros, numa festa de Ação de Graças e na nossa própria cozinha. A vida é boa<\/p>\n<p class=\"sign\">Los amo chamos!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>brechó (desafio tipo amigo oculto de 5$)<\/li>\n<li>comida mexicana autêntica da Hermana Isela no restaurante dela, Los Amigos<\/li>\n<li>pôr do sol<\/li>\n<li>curtindo a noite<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-11-14_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-14_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-14_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-14_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-14_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-14_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-14_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "⚡️Faíscas voando, 🤯milagres chegando, e a gente só vivendo 🤙 Manuia Soifua! Tarde abençoada/Boa tarde! Sim, ainda estou aprendendo samoano, mas é isso: tem que achar coisas de que você gosta e mostrar seu amor pelos outros. A cultura é muito importante pra muita gente: América Latina, brasileiros, polinésios e até as pequenas tradições de família (como os biscoitos da família Jacobs no Natal). Tudo isso é importante pra quem nós somos! Somos filhos de Deus Filhos do convênio Discípulos de Jesus, o Cristo 2 Néfi 25: 26 E falamos de Cristo, regozijamo-nos em Cristo, pregamos a Cristo, profetizamos de Cristo e escrevemos de acordo com nossas profecias, para que nossos filhos saibam em que fonte procurar a remissão de seus pecados Fa'afetai! Obrigado! Enfim, vamos pra essa semana... Na terça tivemos mais um conselho de distrito e terminamos com sushi no Sushi Kabuki. Depois tivemos uma divisão top com o Élder Devere, das mídias sociais. Foi incrível ver como continuar aplicando isso no trabalho missionário e fazer crescer minha \"agenda de área pessoal\", ou seja, pessoas que foram atraídas ao Evangelho por eu ser eu mesmo online. Essa semana estamos fazendo um #becausehegave #PorqueÉlnosdio pra espalhar gratidão e pensamentos edificantes. Me avisem se quiserem participar comigo que eu mando uns conteúdos prontos pra vocês começarem! Temos um amigo novo e empolgado chamado Javi, que sabe muito sobre a Bíblia e foi muito receptivo ao Livro de Mórmon. Fiquem ligados semana que vem e nas próximas lições. Faíscas está no título por causa de uns problemas com a secadora... nossa secadora quebrou do nada e fez a gente ter que secar as roupas no varal por um tempo. O problema da secadora era uma tomada ruim, que foi descoberta pelo Élder Hammond (nosso coordenador de moradia) e por mim quando saíram faíscas da tomada enquanto eu varria os bolos de poeira 🐰, por sorte ninguém se queimou 😉 Nosso grande milagre dessa semana começou quinta à noite com visitas rápidas. Estávamos procurando um membro, mas sem sorte; quando estávamos indo embora, deixamos um cartão de divulgação num dos carros, mas eu senti que precisávamos colocar nos dois carros, o que fez a gente receber uma mensagem no dia seguinte do Fermin. Ele já tinha conversado com missionários na Espanha, mas não desse jeito; nosso cartão pareceu tocar ele de verdade e ele queria conversar. Compartilhamos a Restauração do Evangelho e ele está muito interessado em aprender mais com a gente e com os próprios estudos. Seguir o Espírito é incrível. Comemos umas comidas incríveis no restaurante de uns membros, numa festa de Ação de Graças e na nossa própria cozinha. A vida é boa Los amo chamos! Elder Jacobs Fotos: brechó (desafio tipo amigo oculto de 5$) comida mexicana autêntica da Hermana Isela no restaurante dela, Los Amigos pôr do sol curtindo a noite"}, {"id": "l75", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": [], "moments": ["Baptism", "Holidays"], "extra": "", "kind": "Carta 75 · Largo", "title": "Porque Ele deu 😇", "date": "2022-11-21T12:03:00", "group": "2022-11", "html": "<div class=\"body\"><p>Malo soifua!<\/p>\n<p>Essa semana não teve muita coisa acontecendo, mas ainda assim foi boa.<\/p>\n<p>Muitos amigos estavam ocupados ou dando ghost na gente, então muitas lições foram canceladas e sobrou tempo pra buscar e conhecer os membros. O carro do Élder Owen também ficou na oficina essa semana, limitando nosso tempo com ele, mas ele está super pronto pra começar essa semana. Nosso amigo Fermin, de quem falei semana passada, não está mais muito interessado em se reunir com a gente, mas continuamos amigos e conversamos sempre. Uma lição importante: ser amigo primeiro e ensinar por causa dessa amizade e desse amor já estabelecidos. Espero aprender mais com ele sobre línguas, já que ele é linguista!<\/p>\n<p>Tivemos um devocional inter-religioso de Ação de Graças, com discursos do nosso presidente de estaca, monges, rabinos judeus, reverendos e uns números musicais incríveis. Uma experiência muito divertida, legal e às vezes estranha. Estou tentando tirar mais fotos e criar mais lembranças, o que levou a gente a visitar o píer no jantar/pôr do sol, além de outras coisas aleatórias, como os pavões andando pelo bairro. Estou amando meu tempo aqui apesar dos contratempos e da ralação lenta.<\/p>\n<p>Recebemos mais uma indicação do Facebook e ele também tem data de batismo! A última não respondeu nem deu certo, mas o Emilio está muito animado pra aprender mais e tentar vir à igreja. Na verdade ele é alguém que eu ensinei da última vez que estive aqui! Um bom reencontro com um velho amigo.<\/p>\n<p>A luz do sol anda limitada esses dias, fazendo a gente correr pra aproveitar tudo e não passar muito frio, mas a Flórida continua bipolar. Ontem estávamos congelando e hoje estamos suando de novo.<\/p>\n<p>O Dia de Ação de Graças está chegando, temos um monte de planos de visitar pessoas, e essa semana a missão toda passou postando gratidão.<\/p>\n<p>#becausehegave<\/p>\n<p>Viver com mais gratidão ajuda a gente a lembrar e sentir o amor infinito e perfeito de Deus. Eu gosto de &quot;Conta as Bênçãos&quot;, principalmente a estrofe 4:<\/p>\n<p>Seja a luta grande ou pequena, então,<\/p>\n<p>Não desanimes; Deus é o Senhor de tudo.<\/p>\n<p>Conta as muitas bênçãos; anjos te assistirão,<\/p>\n<p>Ajuda e consolo te darão até o fim da jornada...<\/p>\n<p class=\"sign\">Los amo mucho,<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>pôr do sol no píer<\/li>\n<li>jantar na casa do Élder Owen<\/li>\n<li>Noite de fútbol<\/li>\n<li>fazendeiro Owen<\/li>\n<li>pavões<\/li>\n<li>Élder Lutu com sono<\/li>\n<li>Walmart<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full port\"><img src=\"images/2022-11-21_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-21_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-21_0_6.jpg\" alt=\"\"><\/figure><\/div>", "text": "Porque Ele deu 😇 Malo soifua! Essa semana não teve muita coisa acontecendo, mas ainda assim foi boa. Muitos amigos estavam ocupados ou dando ghost na gente, então muitas lições foram canceladas e sobrou tempo pra buscar e conhecer os membros. O carro do Élder Owen também ficou na oficina essa semana, limitando nosso tempo com ele, mas ele está super pronto pra começar essa semana. Nosso amigo Fermin, de quem falei semana passada, não está mais muito interessado em se reunir com a gente, mas continuamos amigos e conversamos sempre. Uma lição importante: ser amigo primeiro e ensinar por causa dessa amizade e desse amor já estabelecidos. Espero aprender mais com ele sobre línguas, já que ele é linguista! Tivemos um devocional inter-religioso de Ação de Graças, com discursos do nosso presidente de estaca, monges, rabinos judeus, reverendos e uns números musicais incríveis. Uma experiência muito divertida, legal e às vezes estranha. Estou tentando tirar mais fotos e criar mais lembranças, o que levou a gente a visitar o píer no jantar/pôr do sol, além de outras coisas aleatórias, como os pavões andando pelo bairro. Estou amando meu tempo aqui apesar dos contratempos e da ralação lenta. Recebemos mais uma indicação do Facebook e ele também tem data de batismo! A última não respondeu nem deu certo, mas o Emilio está muito animado pra aprender mais e tentar vir à igreja. Na verdade ele é alguém que eu ensinei da última vez que estive aqui! Um bom reencontro com um velho amigo. A luz do sol anda limitada esses dias, fazendo a gente correr pra aproveitar tudo e não passar muito frio, mas a Flórida continua bipolar. Ontem estávamos congelando e hoje estamos suando de novo. O Dia de Ação de Graças está chegando, temos um monte de planos de visitar pessoas, e essa semana a missão toda passou postando gratidão. #becausehegave Viver com mais gratidão ajuda a gente a lembrar e sentir o amor infinito e perfeito de Deus. Eu gosto de \"Conta as Bênçãos\", principalmente a estrofe 4: Seja a luta grande ou pequena, então, Não desanimes; Deus é o Senhor de tudo. Conta as muitas bênçãos; anjos te assistirão, Ajuda e consolo te darão até o fim da jornada... Los amo mucho, Elder Jacobs Fotos: pôr do sol no píer jantar na casa do Élder Owen Noite de fútbol fazendeiro Owen pavões Élder Lutu com sono Walmart"}, {"id": "l76", "area": 8, "post": "<div class=\"postmark\" aria-hidden=\"true\"><div class=\"pm-in\"><span class=\"pm-a\">LARGO, FL<\/span><span class=\"pm-d\">NOV 2022<\/span><\/div><\/div>", "stamps": "<div class=\"stamps\"><span class=\"stamp c\" data-c=\"VE\">🇻🇪 Venezuela<\/span><span class=\"stamp c\" data-c=\"WS\">🇼🇸 Samoa<\/span><span class=\"stamp m\">🌊 Batismo<\/span><span class=\"stamp m\">🎄 Feriados<\/span><\/div>", "cultures": ["VE", "WS"], "moments": ["Baptism", "Holidays"], "extra": "Venezuela Samoa", "kind": "Carta 76 · Largo", "title": "Como eu quase explodi 🤯🦃🫔", "date": "2022-11-28T15:07:00", "group": "2022-11", "html": "<div class=\"body\"><p>Feliz día de acción de gracias!<\/p>\n<p>Espero que tuvieran mucha comida y tiempo con familia y amigos<\/p>\n<p>Essa semana foi muito boa, bem melhor que a anterior. Começamos a semana com umas visitas rápidas a membros, que nos apresentaram à Haydee, ao Franklin e aos Tuinakavandra (de Fiji). Todas as visitas foram incríveis e renderam umas indicações em que temos muita esperança, mas vamos ver essa semana.<\/p>\n<p>Não tivemos conselho de distrito na terça, mas ainda tivemos uma divisão que foi incrível e rendeu um monte de lições no primeiro contato! Talvez a gente tenha encontrado uma família nova pra ensinar também! Yaima &amp; Rafael<\/p>\n<p>No resto da semana o trabalho missionário com amigos e membros foi bem tranquilo: lições caindo, remarcando e visitas aleatórias. Uma coisa muito legal aconteceu com o Emilio. Eu ensinei ele da última vez que estive aqui, e ele se lembra bem de mim e ainda se lembra das lições também. Só estamos trabalhando pra fazer ele ir à igreja.<\/p>\n<p>Dia do peru, Thanksgiving, Dia de Ação de Graças foi épico. Tivemos conselho de distrito e depois um almoço de distrito bombástico (na verdade meio mais ou menos, tirando as coisas que eu levei/fiz, já que sou o único que sabe cozinhar). Também tivemos outro almoço com membros da estaca que não têm família, um churrasco com uns samoanos e um jantar com o Tio Fatu (outro samoano). O ponto alto da semana foi o batismo do Jorge &amp; da Ester no domingo. Consegui voltar e curtir estar com a família Franco. Eles são de verdade umas das pessoas mais legais e amorosas que eu conheço e estou muito animado pelo futuro deles. Lembrem que o Espírito é a chave em todas as coisas:<\/p>\n<p>O Profeta Joseph nos deu o exemplo de como receber orientação espiritual e consolo contínuos por meio do Espírito Santo.<\/p>\n<p>A primeira escolha que ele fez foi ser humilde perante Deus.<\/p>\n<p>A segunda foi orar com fé no Senhor Jesus Cristo.<\/p>\n<p>A terceira foi obedecer com exatidão. A obediência pode significar agir rapidamente. Pode significar se preparar. Ou pode significar esperar com paciência por mais inspiração.<\/p>\n<p>E a quarta é orar para conhecer as necessidades e o coração das outras pessoas e como ajudá-las pelo Senhor. Joseph orou pelos santos aflitos quando estava na prisão. Tive a oportunidade de observar os profetas de Deus enquanto oram, pedem inspiração, recebem orientação e agem de acordo com ela.<\/p>\n<p>https://www.churchofjesuschrist.org/study/general-conference/2018/04/his-spirit-to-be-with-you?lang=eng<\/p>\n<p class=\"sign\">Los amo!<\/p>\n<p class=\"sign\">Elder Jacobs<\/p>\n<p>Fotos:<\/p>\n<ul class=\"bul\">\n<li>Divisão com o Élder Sierra<\/li>\n<li>pato<\/li>\n<li>Hermana Isela fazendo a mágica dos tacos mais uma vez<\/li>\n<li>Ação de Graças do distrito<\/li>\n<li>Franklin &amp; Raul vieram de Brandon visitar a gente!<\/li>\n<li>hallaca (prato típico de Natal da Venezuela)<\/li>\n<li>doce muito bom (tem que provar!)<\/li>\n<li>batismo (os Franco &amp; eu conseguimos ver o Nicolas)<\/li>\n<\/ul><\/div><div class=\"photos\"><figure class=\"full land\"><img src=\"images/2022-11-28_0_0.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-28_0_1.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_2.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_3.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_4.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-28_0_5.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_6.jpg\" alt=\"\"><\/figure><figure class=\"full port\"><img src=\"images/2022-11-28_0_7.jpg\" alt=\"\"><\/figure><figure class=\"full land\"><img src=\"images/2022-11-28_0_8.jpg\" alt=\"\"><\/figure><\/div>", "text": "Como eu quase explodi 🤯🦃🫔 Feliz día de acción de gracias! Espero que tuvieran mucha comida y tiempo con familia y amigos Essa semana foi muito boa, bem melhor que a anterior. Começamos a semana com umas visitas rápidas a membros, que nos apresentaram à Haydee, ao Franklin e aos Tuinakavandra (de Fiji). Todas as visitas foram incríveis e renderam umas indicações em que temos muita esperança, mas vamos ver essa semana. Não tivemos conselho de distrito na terça, mas ainda tivemos uma divisão que foi incrível e rendeu um monte de lições no primeiro contato! Talvez a gente tenha encontrado uma família nova pra ensinar também! Yaima & Rafael No resto da semana o trabalho missionário com amigos e membros foi bem tranquilo: lições caindo, remarcando e visitas aleatórias. Uma coisa muito legal aconteceu com o Emilio. Eu ensinei ele da última vez que estive aqui, e ele se lembra bem de mim e ainda se lembra das lições também. Só estamos trabalhando pra fazer ele ir à igreja. Dia do peru, Thanksgiving, Dia de Ação de Graças foi épico. Tivemos conselho de distrito e depois um almoço de distrito bombástico (na verdade meio mais ou menos, tirando as coisas que eu levei/fiz, já que sou o único que sabe cozinhar). Também tivemos outro almoço com membros da estaca que não têm família, um churrasco com uns samoanos e um jantar com o Tio Fatu (outro samoano). O ponto alto da semana foi o batismo do Jorge & da Ester no domingo. Consegui voltar e curtir estar com a família Franco. Eles são de verdade umas das pessoas mais legais e amorosas que eu conheço e estou muito animado pelo futuro deles. Lembrem que o Espírito é a chave em todas as coisas: O Profeta Joseph nos deu o exemplo de como receber orientação espiritual e consolo contínuos por meio do Espírito Santo. A primeira escolha que ele fez foi ser humilde perante Deus. A se
