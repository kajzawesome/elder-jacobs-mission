<script>
const P = JSON.parse(document.getElementById('data').textContent);
const MON = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
const MONL = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const $ = id => document.getElementById(id);
const fmt = iso => { if (!iso) return ''; const d = new Date(iso); return `${d.getDate()} de ${MONL[d.getMonth()]} de ${d.getFullYear()}`; };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
P.forEach(p => p.ntext = norm(p.text));
const EMOJI = /[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}\uFE0F\u200D\u20E3]/gu;
// letter-style emojis (🅱️ovid, 🆘) become real letters before other emojis are hidden
const WORDMOJI = { '\u{1F197}': 'OK', '\u{1F192}': 'COOL', '\u{1F195}': 'NEW', '\u{1F193}': 'FREE', '\u{1F199}': 'UP', '\u{1F198}': 'SOS', '\u{1F196}': 'NG', '\u{1F191}': 'CL', '\u{1F194}': 'ID', '\u{1F19A}': 'VS', 'ℹ': 'i' };
const toLetters = t => t
  .replace(/[\u{1F130}-\u{1F149}]/gu, c => String.fromCharCode(c.codePointAt(0) - 0x1F130 + 65))
  .replace(/[\u{1F170}-\u{1F189}]/gu, c => String.fromCharCode(c.codePointAt(0) - 0x1F170 + 65))
  .replace(/[Ⓐ-Ⓩ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x24B6 + 65))
  .replace(/[ⓐ-ⓩ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x24D0 + 97))
  .replace(/[\u{1F191}-\u{1F19A}ℹ]/gu, c => WORDMOJI[c] || c);
const stripE = t => toLetters(t).replace(EMOJI, '').replace(/ {2,}/g, ' ');
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

let cur = 0, terms = [];

function render(i, dir) {
  cur = Math.max(0, Math.min(P.length - 1, i));
  const p = P[cur], art = $('art');
  art.classList.toggle('is-cover', p.id === 'cover');
  art.classList.toggle('has-pm', !!p.post);
  const body = p.id === 'gallery' && typeof galleryHTML === 'function' ? galleryHTML(p) : p.html;
  art.innerHTML = p.id === 'cover' ? p.html : `${p.post || ''}<div class="kicker">${esc(p.kind)}${p.date ? ' · ' + fmt(p.date) : ''}</div><h1>${esc(p.title)}</h1>${p.stamps || ''}${body}`;
  art.querySelectorAll('img').forEach(im => { im.loading = 'lazy'; im.decoding = 'async'; });
  art.classList.remove('split'); document.body.classList.remove('wide');
  if (p.id[0] === 'l') {
    const pics = [...art.querySelectorAll(':scope > .photos, :scope > .more')];
    if (pics.length) {
      const aside = document.createElement('aside'); aside.className = 'pics'; aside.setAttribute('aria-label', 'Fotos desta semana');
      pics.forEach(x => aside.append(x));
      const txt = document.createElement('div'); txt.className = 'txt';
      while (art.firstChild) txt.append(art.firstChild);
      art.append(txt, aside); art.classList.add('split'); document.body.classList.add('wide');
    }
  }
  if (p.id === 'map' && typeof showArea === 'function') showArea(selArea, false);
  hideTip(); if (!['cover', 'map', 'gallery'].includes(p.id)) gloss(art);
  art.classList.remove('anim-next','anim-prev'); void art.offsetWidth;
  if (dir) art.classList.add(dir > 0 ? 'anim-next' : 'anim-prev');
  const prev = P[cur-1], next = P[cur+1];
  for (const [b, q, lbl] of [[$('prevCard'), prev, '← Anterior'], [$('nextCard'), next, 'Próxima →']]) {
    b.disabled = !q; b.innerHTML = q ? `<span class="k">${lbl}</span><span class="t">${esc(q.title)}</span>` : '';
  }
  $('prevSide').disabled = $('prevDock').disabled = !prev;
  $('nextSide').disabled = $('nextDock').disabled = !next;
  $('pos').textContent = `${cur + 1} / ${P.length}`;
  $('dockMid').innerHTML = `${esc(p.kind)}<br>${p.date ? fmt(p.date) : ''}`;
  $('prog').style.width = ((cur + 1) / P.length * 100) + '%';
  if (location.hash !== '#' + p.id) history.replaceState(null, '', '#' + p.id);
  store.set('mission-page', p.id);
  document.title = silly ? (p.id === 'cover' ? p.title : `${p.title} · A missão do Élder Jacobs`) : stripE(p.id === 'cover' ? p.title : `${p.title} · A missão do Élder Jacobs`).trim();
  $('mapBtn').classList.toggle('on', p.id === 'map'); $('galBtn').classList.toggle('on', p.id === 'gallery');
  if (terms.length) highlight(art, terms); else window.scrollTo({ top: 0 });
  markList();
}
const go = d => { if (P[cur + d]) render(cur + d, d); };
const goId = id => { const i = P.findIndex(p => p.id === id); if (i >= 0) render(i, i > cur ? 1 : -1); };

['prevSide','prevDock','prevCard'].forEach(id => $(id).onclick = () => { terms = []; go(-1); });
['nextSide','nextDock','nextCard'].forEach(id => $(id).onclick = () => { terms = []; go(1); });

/* swipe */
let sx = 0, sy = 0, st = 0;
document.addEventListener('touchstart', e => { if (e.touches.length !== 1) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive: true });
document.addEventListener('touchend', e => {
  if ($('drawer').classList.contains('open') || $('lb').classList.contains('open')) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && Date.now() - st < 600) { terms = []; go(dx < 0 ? 1 : -1); }
});

/* drawer */
let searchMode = false;
const openDrawer = (search, focus = search) => {
  searchMode = !!search; $('drawer').classList.toggle('searching', searchMode); $('dTitle').textContent = searchMode ? 'Pesquisar' : 'Sumário';
  drawList();
  $('drawer').classList.add('open'); $('scrim').classList.add('open');
  const c = $('list').querySelector('.item.cur'); if (c && !searchMode) c.scrollIntoView({ block: 'center' }); else $('list').scrollTop = 0;
  if (focus) setTimeout(() => $('q').focus(), 50); };
const closeDrawer = () => { $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); };
$('menuBtn').onclick = () => openDrawer(false);
$('searchBtn').onclick = () => openDrawer(true);
$('closeBtn').onclick = closeDrawer; $('scrim').onclick = closeDrawer;
$('homeBtn').onclick = () => { terms = []; goId('cover'); };
$('mapBtn').onclick = () => { terms = []; goId('map'); };
$('galBtn').onclick = () => { terms = []; goId('gallery'); };

const dated = P.map((p, i) => ({ p, i })).filter(x => x.p.date && x.p.id[0] === 'l');
const years = [...new Set(dated.map(x => x.p.date.slice(0, 4)))];

/* date jump: the letter written on/after that day covers it */
$('dateIn').min = dated[0].p.date.slice(0, 10); $('dateIn').max = dated[dated.length - 1].p.date.slice(0, 10);
$('dateIn').onchange = e => {
  const v = e.target.value; if (!v) return;
  const hit = dated.find(x => x.p.date.slice(0, 10) >= v) || dated[dated.length - 1];
  terms = []; render(hit.i, hit.i > cur ? 1 : -1); closeDrawer();
};

/* list + search */
function groupedHTML(pool) {

function gloss(root) { return; // glossary is English-only for now

  const used = new Set(), skip = 'h1,.kicker,.stamps,button,a,svg,mark,.gl,script,style';
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest(skip) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });

      used.add(i); // first time on each page only
      if (SAID.test(s.slice(m.index + m[0].length, m.index + m[0].length + 4))) continue;
      frag.append(s.slice(k, m.index));

      sp.textContent = m[0]; frag.append(sp); k = m.index + m[0].length; any = true;
    }
